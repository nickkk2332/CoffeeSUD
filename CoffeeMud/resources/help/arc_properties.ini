ADDICTIONS=\
Property   : Addictions\n\r\
Targets    : Mobs\n\r\
Parameters : [ITEM NAME];...\n\r\
Example    : pot pie;sugar\n\r\
Description: \n\r\
This ability governs addictions to food, drink, smoking, or sniffing.  The parameter \
is the substring to match in the name of the item.  The player with an addiction \
will be annoyed unless he gets his "fix" every rl hour.  Players can only become \
addiction through the engine by smoking, or by a drink infected with inebriation, \
alcohol, or liquor. The player can either "ride out" the addiction for 24 hours, \
suffering increasingly annoying messages as he goes, or he can keep making his fix. \
Addictions are not diseases, and can not be cured with magic or restoration. Multiple \
substances can be listed by separating with semicolons, and the matches are made by \
parts of item names.

AUTOAWARDS=\
Property   : AutoAwards\n\r\
Targets    : Mobs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This ability governs properties and affects based on player attributes and date/time \
changes.  See awards.txt for more information.

AGE=\
Property   : Age\n\r\
Targets    : Items, Mobs\n\r\
Parameters : [MILLISECONDS]/[AGE YEARS]/+[# MUD HOURS]/[AGE RANGE]\n\r\
Example    : 106222323232\n\r\
Example    : 10\n\r\
Example    : child\n\r\
Example    : +9999\n\r\
Description: \n\r\
The ability to age from infancy (an item) to adulthood (a mob).  The normal argument \
is the birth time in real-life epoc milliseconds.  A number smaller than 32768 will \
be interpreted as a number of years old.  An argument beginning with a + will adjust \
the milliseconds birth time backwards by the given number of mud-hours.  Only a \
timestamp argument will allow aging to occur over time.\n\r\
This process can also alter the race of a mob using the /resources/skills/age.txt \
instructions.  The format of that rules in that doc is as follows: \n\r\
[RACEID] </> [AGE CATEGORY] [GENDER CHAR]/* [NEWRACEID]\n\r\
Each field is tab-separated.  The first is the existing race, then a < or > \
character, then the age category that the race needs to be greater or less than, \
then either the Gender to match that line, or an * to match any unlisted Genders, and \
lastly the race to convert them into.

SOILED=\
Property   : Soiled\n\r\
Targets    : Items, Mobs\n\r\
Parameters : \n\r\
Description: \n\r\
A property of something dirty and smelling.  Bathing or moving around in water will remove it.

ALLERGIES=\
Property   : Allergies\n\r\
Targets    : Mobs\n\r\
Parameters : Resource or Race names\n\r\
Example    : STRAWBERRIES DWARF\n\r\
Description: \n\r\
This ability governs allergies.

AMBIANCE=AMBIANCEADDER
AMBIANCEADDER=\
Property   : Ambiance Adder\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : [AMBIANCE TEXT](;[AMBIANCE TEXT]...)\n\r\
Example    : ^^YGLOWING^^N;^^hshining^^n\n\r\
Description: \n\r\
Allows the builder to add permanent ambiance "flags" to an object.\n\r\
Ambiances, by default, are designed for adding random text to the \
room display text of items and mobs, such as "glowing" or other \
decorations.  Ambiances also have a 'flagging' capability, when \
specific string values are used.  These include: \n\r\
-ALL : hides all natural flag displays\n\r\
-MOST : hides most natural flag displays\n\r\
-GOOD, -EVIL, -INVISIBLE, -SNEAKING : hides these flag displays\n\r\
-HIDDEN, -MAGIC, -METAL, -GLOWING :   hides these flag displays\n\r\
-BUSY, -LAW, -CHAOS :   hides these flag displays\n\r\
-BOUND, -FLYING, -FALLING :   hides these flag displays\n\r\
(?)X:Y : shows X if target heard, Y otherwise\n\r\
@X : X is an special flag, not to be shown by default\n\r\
#X : X is shown if @x is also an ambiance

BAD_REPUTATION=BADREPUTATION
BADREPUTATION=<ABILITY>\
Property   : Bad Reputation\n\r\
Affects    : Mobs\n\r\
Parameters : Percentage of faction gain\n\r\
Example    : 45%\n\r\
Description: \n\r\
The character is of such a poorly received race that others are much less \
forgiving of historical events and unlikely to accept them into society.  \
Faction changes happen much more slowly.

BANISHMENT=\
Property   : Banishment\n\r\
Targets    : Mobs\n\r\
Parameters : [AREA NAME](;[AREA NAME] .. )\n\r\
Example    : Midgaard\n\r\
Description: \n\r\
This mob property makes them unable to enter the area. If the area has child areas \
they will not be able to enter those either.  Even recalling into the area won't work.

BOOKLOANING=\
Property   : BookLoaning\n\r\
Targets    : Items, Mobs, Areas, Rooms, Exits\n\r\
Parameters : <XML> or (DUEDAYS=[NUM] MAXDAYS=[NUM] MAX=[NUM]\n\r\
Parameters :           DAYCHARGE=[NUM]\n\r\
Example    : DUEDAYS=12 MAXDAYS=24 MAX=2 DAYCHARGE=1\n\r\
Description: \n\r\
BookLoaning is primarily known as a common skill for allowing a player \
to loan books to other players.  However, when used as a property/effect \
on ungettable items, areas, rooms, or exits, it allows items to be borrowed \
and lent just like a librarian.  Archons may add to the items to sell by \
either dropping the item in the same room as the BookLoaning, or (in the case \
of an area), throwing the item up into the air.  The parameters have meanings \
identical to those listed in the Archon's Guide

CARNIVOROUS=\
Property   : Carnivorous\n\r\
Targets    : Mobs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Mobs with this effect take no nourishment from foods that aren't meat.

SLOW_LEARNER=SLOWLEARNER
SLOWLEARNER=<ABILITY>\
Property   : Slow Learner\n\r\
Affects    : Mobs\n\r\
Parameters : Percentage of experience lost\n\r\
Example    : 20%\n\r\
Description: \n\r\
The character does not learn from experience the way most do, gaining \
fewer experience points than most.

SCRIPT_LATER=SCRIPTLATER
SCRIPTLATER=<ABILITY>\
Property   : ScriptLater\n\r\
Affects    : Mobs\n\r\
Parameters : xml containing invoker, times, and scripts\n\r\
Example    : <scripts><script invoker= clock=>script</script>..\n\r\
Example    : <scripts><script invoker= time=>script</script>..\n\r\
Example    : <scripts><script invoker= ticks=>script</script>..\n\r\
Description: \n\r\
Adds a new script to a player at a later time. Invocation arguments \
are mob, timeclock, future time in millis, or a number of ticks, and \
script to add.\n\r\
\n\r\
Parameters to the Script tag in the Parameters incude:\n\r\
INVOKER = the name of the mob who caused the later script.\n\r\
-- ONE OF THE BELOW --\n\r\
CLOCK = Formatted Mud Date, format=yr/month/day/hr timezone name\n\r\
TICKS = number of ticks to wait before the script starts.\n\r\
TIME = timestamp (milliseconds since epoc) that script start.\n\r

AUTOSTACK=\
Property   : Autostack\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (TRIGGERCOUNT=[NUM]) (GROUPCOUNT=[NUM]) (CHECKTICKS=[NUM])\n\r\
Example    : triggercount=1000 groupcount=10 checkticks=600\n\r\
Description: \n\r\
This ability governs the automatic packaging (as stacks) of identical items, \
whenever the total number of items in a room is larger than TRIGGERCOUNT, and \
whenever there are at least GROUPCOUNT identical items to package.  The checks \
are made every CHECKTICKS ticks.\n\r\
\n\r\
As this is a property, it will not operate only sporadically on rooms, but like \
clockwork on areas.

GAIT=\
Property   : Gait\n\r\
Targets    : Mobs\n\r\
Parameters : ARRIVE=[STR] LEAVE=[STR] STATE=[STR]\n\r\
Example    : ARRIVE="arrives" leave="leaves" state="walking"\n\r\
Description: \n\r\
This ability changes how mobs appear to be moving from room to room.

INJURY=\
Property   : Injury\n\r\
Targets    : Mobs\n\r\
Parameters : [BODY PART CODE]:[PART NAME]:[DAMAGE AMT];(...)\n\r\
Example    : 1:left finger:23\n\r\
Description: \n\r\
This mob property denotes damage to a particular body part, which is a \
prelude to amputation.

LOYALTY=\
Property   : Loyalty\n\r\
Targets    : Mobs\n\r\
Parameters : NAME=[PLAYER] TELEPORT=[TRUE/FALSE]\n\r\
Example    : NAME=Bob TELEPORT=false\n\r\
Description: \n\r\
This mob property makes a mob keep an eye out for a particular player and Follow them when \
they encounter them.  If TELEPORT=true, they will also attempt to teleport to the player \
before following them.

MERCHANT=\
Property   : Merchant\n\r\
Targets    : Items, Mobs, Areas, Rooms, Exits\n\r\
Parameters : <XML> or (ISELL=[whattobuy] IPREJ=[prejudice] IBUDJ=[money]\n\r\
Parameters :           IDVAL=[devalue] IGNOR=[mask]\n\r\
Example    : ISELL=WEAPONS IBUDJ=1000 IGNOR=-Race +Elf\n\r\
Description: \n\r\
Merchant is primarily known as a common skill for allowing a player \
to sell items to other players.  However, when used as a property/effect \
on ungettable items, areas, rooms, or exits, it allows items to be bought \
and sold just like a shopkeeper.  Archons may add to the items to sell by \
either dropping the item in the same room as the Merchant, or (in the case \
of an area), throwing the item up into the air.  The parameters have meanings \
identical to those listed in the Archon's Guide, except for budget, which is \
the maximum amount to spend on any particular item purchased from a player.

BOOKLOANING=\
Property   : BookLoaning\n\r\
Targets    : Items, Mobs, Areas, Rooms, Exits\n\r\
Parameters : <XML> or (DUEDAYS=[NUM] MAXDAYS=[NUM] MAX=[NUM])\n\r\
Example    : DUEDAYS=12 MAXDAYS=24 MAX=2\n\r\
Description: \n\r\
BookLoaning is primarily known as a common skill for allowing a player \
to loan books to other players.  However, when used as a property/effect \
on ungettable items, areas, rooms, or exits, it allows items to be borrowed \
and lent just like a librarian.  Archons may add to the items to sell by \
either dropping the item in the same room as the BookLoaning, or (in the case \
of an area), throwing the item up into the air.  The parameters have meanings \
identical to those listed in the Archon's Guide

INSTANCEAREA=\
Property   : InstanceArea\n\r\
Targets    : Mobs, Items, Area\n\r\
Parameters : TYPEID or instance modification arguments (see areainstancetypes.txt)\n\r\
Example    : Triumph\n\r\
Example    : ID=ANYTHING\n\r\
Example    : LIKE=Triumph AREAMATCH=Midgaard\n\r\
Description: \n\r\
This misc property, when applied to an area, will put anyone who enters the area \
into a group instance of the area, as per StdThinInstance.  Modifications to the \
mobs, items, and levels of the area will be applied according to a TYPEID given \
in the arguments, which matches a type from resources/skills/areainstancetypes.txt. \
If no modifications are desired, then at least an ID= parameter is required.\n\r\
\n\r\
When the property is applied to a player or item directly, then it will also require \
an AREAMATCH argument to specify which area(s) will be instanced when entering them.

MOOD=\
Property   : Mood\n\r\
Targets    : Mobs\n\r\
Parameters : [name of the mood]\n\r\
Example    : PROUD\n\r\
Example    : HAPPY\n\r\
Description: \n\r\
This ability governs player and mob moods.  It can be added like a property to mobs.

PREGNANCY=\
Property   : Pregnancy\n\r\
Targets    : Mobs\n\r\
Parameters : Start Date/Delivery Date/Fathers Name/Fathers Race\n\r\
Example    : 106222323232/12312232322/Bob/Human\n\r\
Description: \n\r\
The ability to be pregnant, and to eventually give birth.  A consequence \
of sex under certain circumstances.

PRISONER=\
Property   : Prisoner\n\r\
Targets    : Mobs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This mob property makes them unable to recall or magically leave their present location. \
It also prevents fleeing from combat.

SHAMING=\
Property   : Shaming\n\r\
Targets    : Mobs\n\r\
Parameters : GLOBAL/[AREA NAME]\n\r\
Example    : \n\r\
Description: \n\r\
This mob property makes them unable to effectively interact with anyone in the specified area \
and their home area, if they are different.  Attempts to interact are changed into emotes of \
shaming towards the shamed one.

PROP_ABILITYIMMUNITY=\
Property   : Prop_AbilityImmunity\n\r\
Targets    : Mobs, Items, Rooms, Exits, Areas\n\r\
Parameters : (OWNER;) (WEARER;)list of abilities with optional error string, ';' delimited\n\r\
Example    : OWNER;Disease_Cold;Disease_Flu;Spell_Fireball\n\r\
Example    : Disease_Cold=<T-NAME> is immune to <O-NAME>;Spell_Fireball=<T-NAME> can't be burnt!\n\r\
Description: \n\r\
Makes the mob, item, or whatever immune to the listed disease, spell \
or similar affects.  Items will pass their immunity on to their owners \
if the OWNER flag is present, or the wearer or wielder if the WEARER flag is present.   

PROP_ABSORBDAMAGE=\
Property   : Prop_AbsorbDamage\n\r\
Targets    : Mobs, Items\n\r\
Parameters : Damage Absorption percentages or amounts, the list of absorbed damage types\n\r\
Example    : 50% +ALL -SILVER -CLOTH -LEATHER\n\r\
Example    : 5 +ALL -MAGIC -SLASHING -FROSTING\n\r\
Example    : 25% +ALL -LEVEL15\n\r\
Example    : 15% +BASHING 1 +IRON 3 +STEEL 15% +MAGIC\n\r\
Example    : 40% +BURNING SOURCEMASK="-RACECAT +Dragon"\n\r\
CoffeeSUD: SOURCEMASK="[ZAPPER MASK]" makes it work only against the attackers it fits.\n\r\
Description: \n\r\
Whenever the item with this property is worn, or for the mob with \
this property, or anyone in the area or room with this property, they will \
attain damage absorption from the types and/or materials of weapons specified.  \
Damage absorption may be represented as a percentage or as a straight amount. \
Damage amounts must be before the type of damage absorbed in the parameters. \
Damage amounts/percentages in the negative will add to the damage. \
If the term "ENHANCED" is included in the parameters, and percentage absorption amounts are used, \
then this will also attempt to auto-save against skills according to the percentage \
change, or, if the percentage is negative, make the effect last longer. \
Here are the parameters: \n\r\
+ALL - Specifies that, by default, the mob has ALL damage absorbed.\n\r\
-[DAMAGETYPE]- Creates an exception to the +ALL rule by permitting normal damage \
of the given type.  Examples for DAMAGETYPE would be -PIERCING, -GASSING, \
-SLASHING, -BURNING, -MELTING, -NATURAL, -BASHING, etc.\n\r\
+[DAMAGETYPE]- Can be used instead of +ALL to absorb damage from the given \
damage type.  Examples for DAMAGETYPE would be +PIERCING, +GASSING, \
+SLASHING, +BURNING, +MELTING, +NATURAL, +BASHING, etc.\n\r\
-[WEAPONCLASS]- Creates an exception to the +ALL rule by permitting normal damage \
of the given class.  Examples for WEAPONCLASS would be -AXE, -BLUNT, -EDGED, \
-FLAILED, -HAMMER, -KARATE, -POLEARM, -RANGED, -SWORD, -DAGGER, -STAFF, -THROWN, etc.\n\r\
-[WEAPONCLASS]- Can be used instead of +ALL to absorb damage from the given \
weapon class.  Examples for WEAPONCLASS would be +AXE, +BLUNT, +EDGED, \
+FLAILED, +HAMMER, +KARATE, +POLEARM, +RANGED, +SWORD, +DAGGER, +STAFF, +THROWN, etc.\n\r\
-[ABILITYCODE]- Creates an exception to the +ALL rule by permitting normal damage \
of the given type of ability.  Examples for ABILITYCODE would be -THIEF_SKILL, -PRAYER, etc.  Do list abilitycodes.\n\r\
+[ABILITYCODE]- Can be used instead of +ALL to absorb damage from the given \
type of ability.  Examples for ABILITYCODE be +SPELL, +SONG, etc.. Do list abilitycodes.\n\r\
-[ABILITYDOMAIN]- Creates an exception to the +ALL rule by permitting normal damage \
of the given domain of ability.  Examples for ABILITYDOMAIN would be -ILLUSION, -DEATH_LORE, etc. Do list abilitydomains.\n\r\
+[ABILITYDOMAIN]- Can be used instead of +ALL to absorb damage from the given \
domain of ability.  Examples for ABILITYDOMAIN be +SPELL, +SONG, etc.. Do list abilitydomains.\n\r\
-[ABILITYFLAG]- Creates an exception to the +ALL rule by permitting normal damage \
of the given flagged abilities.  Examples for ABILITYFLAG would be -UNHOLY, -CHARMING, etc. Do list abilityflags.\n\r\
+[ABILITYFLAG]- Can be used instead of +ALL to absorb damage from the given \
flagged abilities.  Examples for ABILITYDOMAIN be +HOLY, +CHARMING, etc..  Do list abilityflags.\n\r\
-[ABILITYID]- Creates an exception to the +ALL rule by permitting normal damage \
of the given specific ability.  Examples for ABILITYID would be -SPELL_FIREBALL, etc. \n\r\
+[ABILITYID]- Can be used instead of +ALL to absorb damage from the given \
specific ability.  Examples for ABILITYID be +SPELL_MAGICMISSILE, etc.. \n\r\
-MAGIC - Creates an exception to the +ALL rule by permitting normal damage from \
magical spells and magical weapons.\n\r\
+MAGIC - If +ALL is not used, this will absorb damage from magical \
spells and weapons.\n\r\
-LEVELX - Creates an exception to the +ALL rule by permitting normal damage from \
weapons whose level is X or better. Example: -LEVEL1, -LEVEL5, -LEVEL10, etc.\n\r\
+LEVELX - Can be used instead of +ALL to absorb damage from \
weapons whose level is X or lower. Example: +LEVEL1, +LEVEL5, +LEVEL10, etc.\n\r\
-MATERIALTYPE - Creates an exception to the +ALL rule above by permitting \
normal damage from a weapon made of the given MATERIALTYPE.  Where MATERIALTYPE \
may be any valid material, such as SILVER, WOOD, COTTON, etc.  As for the \
damage types above, +MATERIALTYPE may be used instead of +ALL to absorb \
damage from materials a given material.\n\r\
-PARALYSIS - Creates an exception to the +All rule by permitting normal damage from paralysis spells.\n\r\
+PARALYSIS - If +All is not used, this absorbs damage from damage from fire spells.\n\r\
-FIRE - Creates an exception to the +All rule by permitting normal damage from fire spells.\n\r\
+FIRE - If +All is not used, this absorbs damage from damage from fire spells.\n\r\
-COLD - Creates an exception to the +All rule by permitting normal damage from cold spells.\n\r\
+COLD - If +All is not used, this absorbs damage from damage from cold spells.\n\r\
-WATER - Creates an exception to the +All rule by permitting normal damage from water spells.\n\r\
+WATER - If +All is not used, this absorbs damage from damage from water spells.\n\r\
-GAS - Creates an exception to the +All rule by permitting normal damage from gas spells.\n\r\
+GAS - If +All is not used, this absorbs damage from damage from gas spells.\n\r\
-MIND - Creates an exception to the +All rule by permitting normal damage from mind spells.\n\r\
+MIND - If +All is not used, this absorbs damage from damage from mind spells.\n\r\
-JUSTICE - Creates an exception to the +All rule by permitting normal damage from justice spells.\n\r\
+JUSTICE - If +All is not used, this absorbs damage from damage from justice spells.\n\r\
-ACID - Creates an exception to the +All rule by permitting normal damage from acid spells.\n\r\
+ACID - If +All is not used, this absorbs damage from damage from acid spells.\n\r\
-ELECTRICITY - Creates an exception to the +All rule by permitting normal damage from electric spells.\n\r\
+ELECTRICITY - If +All is not used, this absorbs damage from damage from electric spells.\n\r\
-POISON - Creates an exception to the +All rule by permitting normal damage from poison spells.\n\r\
+POISON - If +All is not used, this absorbs damage from damage from poison spells.\n\r\
-UNDEAD - Creates an exception to the +All rule by permitting normal damage from undead spells.\n\r\
+UNDEAD - If +All is not used, this absorbs damage from damage from undead/evil spells.\n\r\
-DISEASE - Creates an exception to the +All rule by permitting normal damage from disease spells.\n\r\
+DISEASE - If +All is not used, this absorbs damage from damage from disease spells.\n\r\
-TRAPS - Creates an exception to the +All rule by permitting normal damage from traps spells.\n\r\
+TRAPS - If +All is not used, this absorbs damage from damage from traps spells.\n\r

PROP_ADDDAMAGE=\
Property   : Prop_AddDamage\n\r\
Targets    : Items, Mobs\n\r\
Parameters : Extra Damage percentages or amounts, the list of extra damage types\n\r\
Example    : 50% PIERCING\n\r\
Example    : 5 SLASHING FROST\n\r\
Example    : 50% BURNING FIRE TARGETMASK="-RACECAT +Undead"\n\r\
Example    : 5 LEECH=25%\n\r\
Description: \n\r\
Whenever the item with this property is worn, or for the mob with \
this property, they will do extra damage of the types specified.  \
Extra Damage may be represented as a percentage or as a straight amount. \
Damage amounts must be before the type of extra damage in the parameters. \
* Here are the classes of damage: \n\r\
NATURAL, SLASHING, PIERCING, BASHING, BURNING, BURSTING, SHOOTING, FROSTING, \
GASSING, MELTING, STRIKING, LASERING, SONICING, DISRUPTING, STULTIFYING, CORRUPTING, \
SCRAPING\n\r\
* Here are the types of damage attacks: \n\r\
PARALYSIS, FIRE, COLD, WATER, GAS, MIND, JUSTICE, ACID, ELECTRICITY, POISON, \
UNDEAD, DISEASE, TRAPS, WEAPONATTACK.\n\r\
* CoffeeSUD: TARGETMASK="[ZAPPER MASK]" gives the extra damage only to the victims it fits (a bane \
weapon), and LEECH=[N]% heals the wielder that share of the damage dealt, the hit and the extra.\n\r\
ALLSET="set-name-N" activates this bonus when at least N worn pieces share \
the set name, including pieces using the other ALLSET bonus properties. Each \
property keeps its own threshold; the default is two pieces.\n\r

PROP_ATTUNEMENT=\
Property   : Prop_Attunement\n\r\
Targets    : Items\n\r\
Parameters : PROPS="[ID]([ARGS]);[ID]([ARGS])" (HOW=REST:[TICKS]) (RITUAL="INROOM [ROOM ID] & SAY [WORDS]") (ON=EQUIP) (LIMIT=[N]) (BIND=true) (MSG="[TEXT]") (MASK="[ZAPPER MASK]")\n\r\
Example    : PROPS="Prop_WearEnabler(Spell_Haste);Prop_WearAdjuster(dex+2)" HOW=REST:10 LIMIT=3 BIND=true\n\r\
Example    : PROPS="Prop_WearEnabler(Chant_Barkskin)" RITUAL="INROOM Grove#1 & SAY attune"\n\r\
Description: \n\r\
CoffeeSUD: powers that wake only once the item is attuned.  PROPS stay inert until then.  \
One attunes by resting with it (HOW=REST:[TICKS], sitting or sleeping while carrying it), by a \
RITUAL (in the room, saying the words; either part may be left out), or by wearing it \
(ON=EQUIP).  LIMIT is how many items a character may be attuned to (3); UNATTUNE [ITEM] frees \
one.  BIND keeps it inert in anyone else's hands.  MSG is what the one who attunes is told; \
MASK is who may.  Identifying it says it requires attunement, or to whom it is attuned.

PROP_AUTOSAVE=\
Property   : Prop_AutoSave\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (ONCE=CHAR) (SLOT=[NAME]) (ROTATE=[NUMBER]) (MSG="[MESSAGE]")\n\r\
Example    : ONCE=CHAR MSG="[Autosaved]"\n\r\
Example    : SLOT=auto ROTATE=3\n\r\
Description: \n\r\
Saves the game when the player comes into the room, or into the area from \
outside it.  With ONCE=CHAR, only the first time each character comes in. \
The save is called SLOT (auto if not given); with ROTATE, the saves take \
turns, SLOT1 to SLOT3 for ROTATE=3, so the last three are kept.  The player \
is told MSG, or [Autosaved].  It is skipped while the party fights (unless \
the save mode is ANYWHERE), but saves even where Prop_NoSave or the lack of \
a save point would refuse a SAVE.  In an ironman game it writes the game's \
one save.

PROP_ADJUSTER=\
Property   : Prop_Adjuster\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : statistic names followed by a +, -, or = and a value\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : str+2 dex-2 move+100 class=thief race=elf gender=F\n\r\
Example    : str+2 dex-2 move+100 MASK=-Race +Dwarf\n\r\
Description: \n\r\
The listed effects will be given to the mob.  All parameters use the + or - adjuster, except the \
class, race, and gender, ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts, and ablelvls parameters. \
Valid parameters are as follows: \n\r\
strength dexterity constitution charisma wisdom intelligence \n\r\
maxstr maxdex maxcon maxcha maxwis maxint (maximum trainable) \n\r\
savepar savefir savecol savewat savegas savemin savegen savejus \n\r\
saveaci saveele savepoi saveund savemag savedis savetra allsaves (every saving throw at once), \n\r\
ability (magical level), armor, attacks (prowess), damage (max), \
disposition (see AHELP ADJDISPOSITION), level, rejuv(!NO!), \
senses (see AHELP ADJSENSES), speed (#attacks), RONDEATH (t/f),\
height, weight, ambiance+``, gender, class, clstart, race, hitpoints, hunger (stomach size), \
mana, movement, thirst (stomach size) doubt faith deity weightadj saveblunt \
savepierce saveslash savespells saveprayers savesongs savechants rejuvrate \
critpctweapons critpctmagic critdmgweapons critdmgmagic faith rejuvrate xpadjpct.  \
Ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts, and ablelvls is a commma-delimited \
list of ablityids followed by a number in parenthesis to adjust proficiency, duration, \
costs, or casting level by.\n\r\
\n\r\
By default, the values + or - are added to the existing values.  However, if \
MULTIPLYPH=true is included in the parameters, then attack, armor, damage, \
weight and height will instead have their values multiplied by the given value / 100, \
and speed by the given value itself (SPEED+1.5 is one and a half times). Likewise, \
if MULTIPLYCH=true is included, then hitpoints, mana, and movement are similarly \
multiplied instead of added.  All other values act the same.\
\n\r\
The RONDEATH parameter, when set to true, causes this property to disappear on \
the death of the item owner, the mob, or a mob in the room. \
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
This may seem a strange parameter for a mobs-only property, but perhaps you can find \
a use for it. :) See ZAPPERMASKS for more information on zapper mask syntax.

PROP_AFFECTRETICK=\
Property   : Prop_AffectReTick\n\r\
Targets    : Areas, Rooms, Exits, Mobs, Items\n\r\
Parameters : SCAN=[SCAN TARGETS] SCANMASK=[ZAPPERMASK]\n\r\
Parameters : .. [ABILITYID]=[FORMULA] ([ABILITYID]=[FORMULA]...)\n\r\
Example    : scan="items,mobs" scanmask="-levels +>5" Prayer_Bless="@x1+1"\n\r\
Description: \n\r\
This property alters the tick-down time of any ability effect that it \
finds on a scannable target that matches the given scanmask.\n\r\
The SCAN code is a comma list of MOBS (the default), ITEMS, AREAS, ROOMS, EXITS or OWNER(S), and will \
attempt to scan to every available object in the room as the property, \
except OWNER, which will limit the scan only to the affected mob, or \
the owner of an affected item.\n\r\
The SCANMASK narrows which items will be scanned for effects with a \
ZAPPERMASK.  See ahelp ZAPPERMASK for more info on that.\n\r\
The remaining arguments are ability Ids of effects to retick, which \
are set equal to a math formula on how to alter its tickdown time.  The \
formula MUST contain the variable @x1, which represents the existing tick \
down time.\n\r\
Once the tick-down time on an effect has been altered by this property, it \
will not be altered again, so while getting an affected item may cause an \
alteration, dropping it will not 'revert' the alterations UNLESS the OWNERS \
scan value is used instead of the others.

PROP_AFFINITY=\
Property   : Prop_Affinity\n\r\
Targets    : MOBs, Areas\n\r\
Parameters : (START=[N]) (DECAY=[N]) (GIFT([ITEM])=[+N]) (TALK([WORD])=[+N]) (QUESTWIN([QUEST])=[+N]) (ATTACKED=[-N]) (STOLE=[-N]) (KILLED([MOB])=[-N]) (BRIBE=[N]) (SHOPFACTOR=[BAND]:[N],...) (REFUSE=[BAND]) (REFUSEMSG="[TEXT]")\n\r\
Example    : GIFT(rare ore)=+10 QUESTWIN(The Smith's Blade)=+30 ATTACKED=-40 SHOPFACTOR=FRIENDLY:0.9,DEVOTED:0.8 REFUSE=HOSTILE\n\r\
Description: \n\r\
CoffeeSUD: the NPC's opinion of each character, a number from START (0): HOSTILE below -50, \
COLD below 0, NEUTRAL, FRIENDLY from 25, DEVOTED from 75.  It moves by the rules: an item \
given that GIFT's item names (words of its name, or a +/- mask), money given (BRIBE \
points a gold), a word said to it (TALK, at most once a game day each), a quest won \
(QUESTWIN, counted when next read), an attack on it (ATTACKED, once a game hour), a theft \
from it (STOLE), or a killing it sees of a mob KILLED names.  DECAY brings it that much \
toward 0 a game day.  SHOPFACTOR multiplies its prices by band (a friend sells for less \
and pays more); REFUSE: at or below that band it will not trade, saying REFUSEMSG.  On an \
area, it is the village's opinion, shared by its NPCs that have none of their own.  It \
is kept in the game's script variables AFFINITY_[CHARACTER] of the NPC (or the area), so \
a save keeps it; it does not show in FACTIONS.  Scripts read AFFINITY($i $n) (or \
AFFINITY($i $n BAND)) and change it with MPAFFINITY; Prop_NPCLines takes [AFFINITY >=25] \
or [AFFINITY FRIENDLY] after an entry; MudChat a ?AFFINITY($i $t > 25) guard.

PROP_AMBUSH=\
Property   : Prop_Ambush\n\r\
Targets    : Rooms\n\r\
Parameters : MOBS="[MOBS]" (CHANCE=[N]) (DETECT=[STAT]+[SKILL]:[N]) (SURPRISE=[N]) (MSG="[TEXT]") (SPOTMSG="[TEXT]") (WAIT=[N]) (RESET=[N]) (MASK="[ZAPPER MASK]")\n\r\
Example    : MOBS="encounter:bandits" DETECT=WIS+Thief_DetectTraps:15 MSG="Figures burst from the undergrowth!" SPOTMSG="You spot glints of steel in the bushes."\n\r\
Example    : MOBS="catalog:a bandit*3" CHANCE=50 RESET=300 MASK="-LEVEL +>4"\n\r\
Description: \n\r\
CoffeeSUD: an ambush.  When the party walks in (its leader, at CHANCE percent, 100, if MASK \
fits), MOBS come out: name*dice joined with + (catalog: optional) or encounter:[TABLE].  The \
party's best rolls DETECT: d20, a stat's (N-10)/2 and a skill's proficiency/10, against the \
number (15).  Not spotted: MSG shows, the ambushers strike, and the party is caught by surprise \
for SURPRISE rounds (1; Prop_Surprised), unable to move or strike.  Spotted: the party sees \
SPOTMSG and may strike first or walk on (the ambushers go) before WAIT ticks (2) are up, when \
they attack.  It springs once, or again RESET ticks later.  AMBUSH_PROG SURPRISED, SPOTTED or \
AVOIDED runs on the room's scripts and its NPCs'.

PROP_AREAFORSALE=\
Property   : Prop_AreaForSale\n\r\
Targets    : Areas\n\r\
Parameters : (RENTAL )Price of the area\n\r\
Example    : 1000000\n\r\
Example    : Bob/100000\n\r\
Description: \n\r\
Makes this area available for purchase by a player.  To have a shopkeeper sell \
the area, you must create a GenTitle or StdTitle item with the area name as the \
property id and give it to the shopkeeper to sell.  The system will automatically \
maintain the integrity of any items left in the rooms, including restoring them \
on reboot. The title received for purchasing a room may be GIVEn or SELLed to \
change possession of the property.  The word rental followed by a space may \
preceed the price to make the price of the property be charged every month \
automatically out of a Bankers account.  Failure to make rent returns the property \
to sellable status.\n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property. \n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_ARTIFACT=\
Property   : Prop_Artifact\n\r\
Targets    : Items\n\r\
Parameters : autodrop=[T/F] nomobs=[T/F] nolocate=[T/F] nocast=[T/F] autoreset=[T/F] nodb=[T/F]\n\r\
Example    : nomobs=false\n\r\
Example    : autoreset=true\n\r\
Description: \n\r\
The items with this property will persist in their last known location past \
reboots, and optionally always drop from players inventories when they quit, \
be invulnerable to damage, not be possessable by mobs, and not capable of \
being acted upon with skills or spells. By default, all of the above is true, \
though that can change by setting one of the following parameters to false: \n\r\
autodrop - the item drops from player inventories when they quit or shutdown\n\r\
nomobs - the item may not be picked up by a non-player \n\r\
nolocate - the item may not be located via Locate Object spell\n\r\
nocast - the item may not have ANY spells cast upon it\n\r\
Two more, both false by default:\n\r\
autoreset - when a player quits holding the item (with autodrop), it is not left where it fell but destroyed and made again at its remembered place about a minute later; and the place already remembered for it is not overwritten by a later shutdown or room reset\n\r\
nodb - the item's place is never saved to or removed from the database, so it is not remembered past a reboot

PROP_ASTRALSPIRIT=\
Property   : Prop_AstralSpirit\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This property makes the mob into an incorporeal spirit.  It is used \
to support the "Astral Projection" chant.

PROP_BLOCKEDEXIT=\
Property   : Prop_BlockedExit\n\r\
Targets    : Exits\n\r\
Parameters : (NAME="[TEXT]") (HP=[N]) (TOOL="[ZAPPER MASK]") (SKILL=[STAT]+[SKILL]) (FIRE=true) (MSG="[TEXT]") (CLEARMSG="[TEXT]") (ONCLEAR="[ACTIONS]") (RESPAWN=[TICKS])\n\r\
Example    : NAME="a pile of rubble" HP=40 TOOL="-TAGS +PICKAXE" SKILL=Digging+STR CLEARMSG="The rubble gives way to a dark tunnel."\n\r\
Example    : NAME="a wall of vines" HP=60 FIRE=true RESPAWN=3000\n\r\
Description: \n\r\
CoffeeSUD: a blockage the player must clear.  While it stands nobody goes that way, and LOOK \
at the exit says so.  CLEAR, DIG, SMASH, HIT or ATTACK the direction (or the blockage by its \
NAME) wears it down: 1d6 and SKILL (a stat's (N-10)/2, a skill's proficiency/10) off its HP \
(40) each try, with TOOL held or wielded if given.  FIRE=true lets BURN clear it at once with \
a lit light in hand.  MSG shows each try; CLEARMSG on both sides when it is gone, and \
ONCLEAR's actions run; RESPAWN ticks later it is back (0: never).  What is left of it is \
kept with it (LEFT=), and one on the other side of the exit is kept the same.

PROP_CHECKPOINT=\
Property   : Prop_Checkpoint\n\r\
Targets    : Rooms\n\r\
Parameters : (NAME="[TEXT]") (ON=ENTER/REST/COMMAND:[WORD]) (HEAL=[N]%) (RESPAWNAREA=true) (SAVE=AUTO/[SLOT])\n\r\
Example    : NAME="the Old Shrine" ON=COMMAND:pray HEAL=100% RESPAWNAREA=true\n\r\
Example    : ON=ENTER SAVE=AUTO\n\r\
Description: \n\r\
CoffeeSUD: a checkpoint.  When the party walks in (ON=ENTER, the default), rests there \
(REST: sits or sleeps) or types the word (COMMAND:pray), the room becomes the respawn point \
of each of the party there: kept on the character, through death, and apart from the recall \
room.  With DEATH=CHECKPOINT in coffeemud.ini, a fallen character wakes at their last \
checkpoint (or their recall room, with none).  HEAL heals them that share; RESPAWNAREA brings \
the area's dead mobs back; SAVE saves the game (AUTO, or a slot's name).  Scripts set it with \
MPSETRESPAWN and read it with RESPAWNROOM().

PROP_CLANEQUIPMENT=\
Property   : Prop_ClanEquipment\n\r\
Targets    : Items\n\r\
Parameters : [TYPE] [POWER#] [CLAN NAME] [CLAN TYPE]\n\r\
Example    : Acid 5 "The Skooters" "Guild"\n\r\
Description: \n\r\
Base property for clan equipment.  Do not use independent of the clan spells.  \
Legacy: it depends on the inherited clan spells, and clans as a player-run feature are \
not part of single-player play in CoffeeSUD, so no clan equipment is made.

PROP_CLIMBABLE=\
Property   : Prop_Climbable\n\r\
Targets    : Exits, Rooms, Portals\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Forces players to climb, fly, or use a ladder through the exit or room with this property.

PROP_CLOSECOMMAND=\
Property   : Prop_CloseCommand\n\r\
Targets    : Exits, Items\n\r\
Parameters : [COMMAND WORD] ([PARMS...]/NOCLOSE/MESSAGE=[STR];...\n\r\
Example    : twist knob;tw knob;twi knob;noclose\n\r\
Example    : smack botto*\n\r\
Description: \n\r\
When applied to an open container or exit, this property will force \
the affected openable to close and maybe lock when the command phrase is entered \
by the user in its presence.  The command word must match exactly, and the \
command entered must otherwise be completely invalid.  PARMS arguments must also \
match exactly, although any PARM arg may end with * to use a starting string wildcard. \
A PARM argument may also end with ** to match the rest of the users entered command string. \
In addition to a series of command words, you can also use the NOCLOSE keyword to also \
disable the standard close command for the exit/item, or use MESSAGE= to change the \
message sent to the room, which can use <S-NAME> for the actor, and <T-NAME> for the item.

PROP_CLOSEDDAYNIGHT=\
Property   : Prop_ClosedDayNight\n\r\
Targets    : Items, Mobs, Rooms, Exits\n\r\
Parameters : (DAY/NIGHT)(SLEEP)(SIT)(LOCKUP)(HOURS=0-13)(HOME=Room#)\n\r\
Parameters : (WARNMSGx=[msg]) (SHOPMSG=[msg]) (MASK=)\n\r\
Example    : DAY\n\r\
Example    : SLEEP HOURS=5-10\n\r\
Example    : "Home=My Area#123" SLEEP LOCKUP MASK=-RACE +ELF\n\r\
Example    : "Home=Bob`s House" SLEEP LOCKUP "SHOPMSG=Go Away! I'm Closed!"\n\r\
Description: \n\r\
Affects the thing with this property depending on the time of day. \
By default, this property activates at night.  If the DAY paramater is \
included, it will activate by day instead. The effect of the property is that \
rooms will go dark, exits will close, and items will become unseeable. \
Mobs will become unseeable by default, though if the sit or sleep flags are \
set, they will do that instead.  LOCKUP will cause the mob to lock up his \
starting room, if any doors with locks are found.  If a Home Room is specified \
with the HOME= parameter, the mob will track to that room at closing time, then \
back to their start room the next day.  For shopkeepers, you can specify \
a SHOPMSG for them to say whenever someone tries to interact with them as \
a shopkeeper during closed hours.  You can also specify a particular \
greeting message at a particular hour of the day with WARNMSG, such as \
WARNMSG0 for the 0th hour of the day, etc..

PROP_CLOSEDSEASON=\
Property   : Prop_Closedseason\n\r\
Targets    : Items, Mobs, Rooms, Exits\n\r\
Parameters : (SUMMER/SPRING/WINTER/FALL/DAY/NIGHT\n\r\
Parameters :  DUSK/DAWN/RAIN/SLEET/SNOW/CLEAR/HEATWAVE\n\r\
Parameters :  THUNDERSTORM/BLIZZARD/WINDY\n\r\
Parameters :  DROUGHT/DUSTSTORM/COLD/HAIL/CLOUDY)\n\r\
Parameters : (MASK=[ZAPPERMASK])\n\r\
Example    : DAY\n\r\
Example    : WINTER BLIZZARD MASK=-RACE +ELF\n\r\
Description: \n\r\
Affects the thing with this property depending on the weather, or time of the year. \
By default, this property does not activate.  You must specify one or more times, seasons, \
or conditions under which the object will no longer be visible.

PROP_COMBATADJUSTER=\
Property   : Prop_CombatAdjuster\n\r\
Targets    : MOB\n\r\
Parameters : (ATTACK+/-[PCT NUMER]) (ARMOR+/-[PCT NUMER]) (DAMAGE+/-[PCT NUMER])\n\r\
Parameters : (HP+/-[PCT NUMER]) (MANA+/-[PCT NUMER]) (MOVE+/-[PCT NUMER])\n\r\
Parameters : (ATTACK=[PCT NUMER]) (ARMOR=[PCT NUMER]) (DAMAGE=[PCT NUMER])\n\r\
Parameters : (HP=[PCT NUMER]) (MANA=[PCT NUMER]) (MOVE=[PCT NUMER])\n\r\
Example    : \n\r\
Example    : ATTACK+25 DAMAGE-20 MANA=1000\n\r\
Description: \n\r\
This property either adjusts a mobs current stats by a percentage value as specified, or sets \
the value to a specific number.  This property is mostly useless for builders, but has internal uses. \
Supported stats include: ATTACK, DAMAGE, ARMOR, HP, MANA, MOVE, SPEED
 

PROP_COMBOLOCK=\
Property   : Prop_ComboLock\n\r\
Targets    : Exits, Items\n\r\
Parameters : CODE=[CODE]/RANDOM (SYMBOLS="[SYMBOL],[SYMBOL]"/[N]-[N]) (DIALS=[N]) (VERB=[VERB]) (SHOW=true) (TRIES=[N]) (ONWRONG="[ACTIONS]") (ONOPEN="[ACTIONS]") (RELOCK=[TICKS]) (MSG="[TEXT]") (VAR=[NAME])\n\r\
Example    : CODE=sun-star-moon SYMBOLS="sun,moon,star" SHOW=true TRIES=3 ONWRONG="cast Spell_ShockingGrasp $n"\n\r\
Example    : CODE=739 RELOCK=30\n\r\
Example    : CODE=RANDOM DIALS=4 VAR=VAULTCODE\n\r\
Description: \n\r\
CoffeeSUD: a combination lock on a door or a container.  TURN DIAL 2 TO 3 sets one dial (VERB \
changes the word), SET DIALS 7 3 9 all of them, ENTER 739 a keypad's code; ON [THING] picks one \
when there are more.  SYMBOLS are each dial's (0-9 by default); DIALS how many (as many as the \
code has).  When the dials read the code, it unlocks and opens, on both sides of a door, with \
MSG, and runs ONOPEN; RELOCK shuts and locks it again after that many ticks.  SHOW adds what \
the dials read to LOOK.  After TRIES wrong codes, ONWRONG runs.  CODE=RANDOM rolls one for each \
new game (DIALS of the SYMBOLS), kept with the lock, and VAR puts it in the script variable \
$<COMBO [NAME]> for a clue to print.  Actions are script commands, as in Prop_Switch.

PROP_COMMONTWISTER=\
Property   : Prop_CommonTwister\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : SKILL=[*/SKILL] MASK=[*/NAME] (NAME=[*/NEW]) (DISPLAY=[*/NEW]) (MATERIAL=[*/NEW]) (SUBTYPE=[*/NEW]);([REPEAT])\n\r\
Example    : skill=Foraging mask=berries name="some corn" display="some corn is here" material=corn\n\r\
Example    : skill=* mask=* name="some stuff" display="some stuff";skill=* mask=* name="some other" display="some other"\n\r\
Example    : \n\r\
Description: \n\r\
This property changes the results from the use of common skills.  This property \
requires the SKILL and MASK parameters, and at least one of the other parameters \
(NAME, DISPLAY, MATERIAL, or SUBTYPE).  For each parameter, * may be used to match anything \
or a random thing.

COPYRIGHT=\
Property   : Copyright\n\r\
Targets    : Items\n\r\
Parameters : ([NAME OF COPYRIGHT])\n\r\
Example    : \n\r\
Example    : Bob\n\r\
Description: \n\r\
When placed on an item, it prevents it from being transcribed, \
copied by the duplicate spell, renamed or titled by the BookNaming \
or Titling skills, or edited by the BookEdit skill.

PROP_CRAFTXP=\
Property   : Prop_CraftXP\n\r\
Targets    : MOBs, Items, Rooms, Areas\n\r\
Parameters : (PCT=[PCT]) (GATHER=[N]) (SKILLS=[SKILL ID],...) (MASK="[ZAPPER MASK]")\n\r\
Example    : PCT=50 GATHER=2 SKILLS=Blacksmithing,Mining MASK="-LEVEL +<20"\n\r\
Description: \n\r\
CoffeeSUD: crafting and gathering XP for a player character of any class.  When their \
crafting, cooking or building skill makes something, it has an XP value (what an Artisan earns for it): \
CRAFTXP=[PCT] in the ini gives every player character that percent of it, and PCT here adds its own.  \
When a gathering skill finds something, GATHERXP=[N] in the ini, and GATHER here, are XP for every unit \
found.  It counts on the character, on an item they carry, on the room or an item lying in it, and on \
the area or one of its parents, as PCT=50 on a guild hall that teaches.  SKILLS are the skills it is \
for (all when not given) and MASK who it is for.  The XP goes through the usual way, so \
Prop_ModExperience and achievements see it, and an Artisan earns it on top of their own.

PROP_CROPRULES=\
Property   : Prop_CropRules\n\r\
Targets    : Rooms, Areas, Items\n\r\
Parameters : (GROWHOURS=[N]) (SEASONS=[SEASON],...) (NEEDSUN=true/false) (DOMAINS=[ROOM TYPE],...) (WATER=[N]) (YIELD=[DICE]) (FAILMSG="[TEXT]")\n\r\
Example    : NEEDSUN=false DOMAINS=CAVE,STONE FAILMSG="Only the cellar beds will take that."\n\r\
Description: \n\r\
CoffeeSUD: crop rules for Farming and Gardening, on a room or an area (all crops there) or on the seed \
itself.  GROWHOURS is how many game hours the crop takes to grow (50 ticks when not given); a crop given \
hours is not set back by the nights while it grows.  SEASONS are when it may be planted (SPRING, SUMMER, \
AUTUMN, WINTER).  NEEDSUN=false lets it grow without sunlight.  DOMAINS are the kinds of room it grows in \
(PLAINS, HILLS, WOODS, JUNGLE, SWAMP, CAVE, STONE..., or ANY), in place of the usual farmland.  WATER is \
how many water rooms, this one or those next to it (a pond Irrigation digs counts), it needs.  YIELD is \
dice, as 2d6+1, in place of 1d7, still times the skill's yield.  FAILMSG is told when one of them refuses.  \
A world can give a crop its rules in world/crops.txt, a line each: the resource or subtype, then these \
rules, as WHEAT GROWHOURS=240 SEASONS=AUTUMN.  The area's, the room's and the seed's come over the file's, \
in that order.  With any row in crops.txt, Gardening and Farming skip their up-front refusal \
and apply each crop's own rules instead.

PROP_CRAWLSPACE=\
Property   : Prop_Crawlspace\n\r\
Targets    : Exits, Rooms, Areas\n\r\
Parameters : (HEIGHT=[NUM])\n\r\
Example    : height=24\n\r\
Description: \n\r\
Forces players to crawl through the exit or room with this property. \
The height of the crawlspace is optionally defineable.

PROP_CURSED=\
Property   : Prop_Cursed\n\r\
Targets    : Items\n\r\
Parameters : (LEVEL=[N]) (HIDDEN) (NOREMOVE) (NODROP) (PENALTY="[ID]([ARGS]);[ID]([ARGS])") (REVEAL="[TEXT]") (BREAK="SAY:[WORDS];ENTER:[ROOM ID]") (BREAKMASK="[ZAPPER MASK]") (ONBREAK=CRUMBLE/KEEP/BECOME:[ITEM]) (BREAKMSG="[TEXT]")\n\r\
Example    : LEVEL=15 HIDDEN NOREMOVE PENALTY="Prop_WearAdjuster(wis-3);Prop_WearSpellCast(Prayer_CurseLuck)" REVEAL="The ring tightens on your finger!" BREAK="SAY:i confess;ENTER:Chapel#3" ONBREAK=CRUMBLE\n\r\
Description: \n\r\
CoffeeSUD: a curse on an item that Remove Curse ends cleanly.  It is of the cursing domain, \
so Remove Curse finds it, but only a priest of LEVEL or more lifts it.  HIDDEN shows nothing \
until it is first worn, when REVEAL is told.  NOREMOVE and NODROP keep it on and in hand.  \
PENALTY is what it does (properties and their arguments, a semicolon between).  BREAK is a \
list of deeds, done in order by the one who has it (SAY:[WORDS], ENTER:[ROOM ID]); \
BREAKMASK a mask they come to fit.  Lifted or broken, its penalties go with it, and the item \
stays (KEEP), crumbles (CRUMBLE), or becomes another (BECOME:[ITEM]).  The game \
keeps the curse's state in its own text as SHOWN=true (it has been revealed) and \
STEP=[N] (how far through the BREAK deeds), which it writes itself and a builder \
need not set; REMOVECURSE (the ability) is the thing that lifts it.

PROP_DEATHRULES=\
Property   : Prop_DeathRules\n\r\
Targets    : Areas, Rooms\n\r\
Parameters : (PLAYERDEATH="[LIST]") (MOBDEATH="[LIST]") (ITEMLOOTPOLICY="[LIST]") (TO=[ROOM ID]) (GEAR=CONTAINER:[ROOM ID]/[CONTAINER]) (HEAL=[N]%) (MSG="[TEXT]") (MASK="[ZAPPER MASK]")\n\r\
Example    : TO=Hideout#4 GEAR="CONTAINER:Hideout#9/the chief's strongbox" HEAL=25% MSG="<S-NAME> <S-IS-ARE> beaten and dragged off!"\n\r\
Example    : PLAYERDEATH="OUT 3" MOBDEATH="OUT 3"\n\r\
Description: \n\r\
CoffeeSUD: the rules of death in an area or a room (the room's before its area's).  \
PLAYERDEATH, MOBDEATH and ITEMLOOTPOLICY take the place of coffeemud.ini's there (OUT 3 for a \
tutorial, where losing only knocks one out).  TO makes a defeat of the player's side not \
death: MSG shows, the fight stops, the character's gear goes into the GEAR container, and they \
wake in the TO room with HEAL percent of their hit points (1 if none), their followers with \
them, so the party stays together: a jailbreak instead of a reload.  MASK is whom these rules \
are for.

PROP_DETECTOR=\
Property   : Prop_Detector\n\r\
Targets    : Items\n\r\
Parameters : (DETECT="[ZAPPER MASK]") (DETECTITEM="[ZAPPER MASK]") (RANGE=[0-3]) (WHERE=WORN/HELD/ANY) (EVERY=[TICKS]) (AMBIANCE="[TEXT]") (MSG="[TEXT]") (STOPMSG="[TEXT]")\n\r\
Example    : DETECT="-RACECAT +Orc +Goblinoid" RANGE=2 WHERE=WORN AMBIANCE="(glowing blue)" MSG="$p glows faintly blue." STOPMSG="$p's glow fades."\n\r\
Example    : DETECTITEM="-TAGS +TREASURE" MSG="$p twitches in your hands." WHERE=HELD\n\r\
Description: \n\r\
CoffeeSUD: an item that reacts to what is near: mobs that DETECT fits, or items that \
DETECTITEM fits, in its room or up to RANGE rooms away.  WHERE: WORN (anywhere on the body), \
HELD (held or wielded) or ANY (carried, or lying anywhere).  Every EVERY ticks (1) it looks; \
while it finds something it has AMBIANCE, and the one carrying it (or the room it lies in) \
is told MSG when it starts and STOPMSG when it stops; $p is the item.

PROP_DEVCHEATS=\
Property   : Prop_DevCheats\n\r\
Targets    : MOBs\n\r\
Parameters : ([CHEAT]) (-[CHEAT]) (-[SECURITY FLAG])...\n\r\
Example    : NOCLIP NOAGGRO -IMMORT\n\r\
Description: \n\r\
A developer's cheats, which the GOD command sets: see AHELP GOD for what each \
does.  A cheat's name turns it on; a minus and a cheat's name turns it off, \
even where a sysop power would give it; a minus and a security flag (as in \
AHELP SECURITY) suspends that power for the character.  -NODEATH suspends \
IMMORT.  The cheats are NOCLIP, NOCOST, NODAMAGE, NODEATH, SEEALL and \
NOAGGRO.  A character who has the matching security flag has some of them \
without the property: GOTO gives NOCLIP, ALLSKILLS gives NOCOST, and ORDER or \
CMDROOMS gives NOAGGRO (a cheat's name after a minus still turns it off).  It is \
saved with the character like any effect.

PROP_DOWNED=\
Property   : Prop_Downed\n\r\
Targets    : MOBs\n\r\
Parameters : (TICKS=[N]) (HEAL=[N])\n\r\
Example    : TICKS=3 HEAL=5\n\r\
Description: \n\r\
CoffeeSUD: down (PLAYERDEATH's DOWNED puts it on one of the player's side at 0 hit points).  \
For TICKS rounds (3) the character lies there: it cannot move, strike, cast or stand, and is \
not attacked.  An ally's REVIVE, or a heal of HEAL hit points (1) or more, brings them back.  \
When the foes that downed them are gone or dead, and no one of the party there still fights, \
they get up at 1 hit point.  When the time runs out, the rest of the PLAYERDEATH list applies.

PROP_DISCOVERABLE=\
Property   : Prop_Discoverable\n\r\
Targets    : Items, Exits, MOBs\n\r\
Parameters : (FOUNDBY=examine:[THING]|look:[THING]|search) (CHECK="[STAT] [NUMBER]") (DC=[NUMBER]) (STAT=[STAT]) (MSG="[TEXT]") (HINT="[TEXT]") (STAYS=false) (RESET=[TICKS])\n\r\
Example    : FOUNDBY=examine:tapestry MSG="Behind the tapestry is a narrow door." HINT="The tapestry stirs in a draught."\n\r\
Example    : FOUNDBY=search|examine:fireplace CHECK="INT 12"\n\r\
Description: \n\r\
CoffeeSUD: something hidden that anyone can find.  Until it is found nobody sees it, and \
nobody goes through a hidden exit.  FOUNDBY (search, by default): EXAMINE of that thing here, \
LOOK at it (look:), or SEARCH, which needs no skill (one SEARCH looks for all there is in the \
room).  CHECK (or STAT and DC): a d20, the stat's (N-10)/2 and a tenth of Searching's or \
Thief_Search's proficiency against the number; with none, it is found at once.  MSG is what \
the finder is told; HINT is added when one of its FOUNDBY things is looked at.  Once found it \
stays found (kept with it), unless STAYS=false, which hides it again RESET ticks (30) later.

PROP_DOPPLEGANGER=\
Property   : Prop_Doppleganger\n\r\
Targets    : Mobs, Items\n\r\
Parameters : nothing, or a level change + or -, a level %, or args:\n\r\
:          : MIN=[NUM] MAX=[NUM] LEVELADD=[NUM] LEVELPCT=[PCT%]\n\r\
:          : PLAYERSONLY=true/false PLAYERSNFOLS=true/false\n\r\
:          : ASMATERIAL=[RESOURCE] DIFFADD=[NUM] DIFFPCT=[PCT%]\n\r\
:          : LEVELCODE=0/1/-1 DIFFGRP=[true/false] SAVEPCT=[PCT%]\n\r\
Example    : \n\r\
Example    : 10\n\r\
Example    : 150%\n\r\
Example    : MAX=20 MIN=5 LEVELADD=0 LEVELPCT=100% PLAYERSONLY=false\n\r\
Example    : MAX=20 MIN=5 ASMATERIAL=IRON\n\r\
Description: \n\r\
When this property is on a mob, it makes the mob the same level as those in the \
room with it, or as those who are fighting it.  The mob will only change, however, \
if the mob is at full hit points, to prevent mobs from being "softened up". By default \
the level is the average of qualifying room mobs, but can be the lowest level if \
LEVELCODE=-1, or the highest level if LEVELCODE=1.  \
When the property is on armor or a weapon, it will adjust the strength and level of \
the item appropriate to its owner.\n\r\
\n\r\
A parameter may be given to always adjust the level of the item up or down from normal, \
be multiplied by the level as a percentage, or a number of parameter variables like: \
MIN to set a minimum level, MAX to set a maximum level, LEVELADD to add a fixed number \
to the level, LEVELPCT to multiply a percentage by the level (or leave the same when set to 0), \
PLAYERSONLY to limit the level calculating mobs to players only, PLAYERSNFOLS to limit the level \
calculating mob to players or their followers only, and ASMATERIAL to change the \
material of the item only for stat calculation purposes.  The difficulty of the mob \
relative to the level change can also be affected using DIFFADD and DIFFPCT. These \
will change the difficulty of the mob relative to their level.  Saving throw bonus \
per level can also be applied by setting SAVEPCT=0-100.  These difficulties \
can be multiplied by the number of threats by setting DIFFGRP to true, which also \
will include group members not present in the math.  

PROP_PLAYERTEMPLATE=\
Property   : Prop_PlayerTemplate\n\r\
Targets    : MOBs\n\r\
Parameters : PITCH="[TEXT]" LOCK=[NAME,GENDER] NAME=RANDOM\n\r\
Example    : PITCH="A tired inspector of the Yard." LOCK=NAME,GENDER\n\r\
Description: \n\r\
CoffeeSUD: on a catalog mob in the category PLAYERTEMPLATE, makes it a ready-made character NEW offers \
(AHELP PLAYERTEMPLATES).  PITCH is its line in the menu; LOCK keeps the template's own name or gender; \
NAME=RANDOM draws a name.  It does nothing in play.

PROP_RECRUITABLE=\
Property   : Prop_Recruitable\n\r\
Targets    : MOBs\n\r\
Parameters : MASK="[ZAPPER MASK]" COST=[GOLD] MESSAGE="[TEXT]" NAME=[NAME]\n\r\
Example    : MASK="-FACTION +GOOD" COST=50 MESSAGE="<S-NAME> shoulder(s) her bow and fall(s) in with <T-NAMESELF>."\n\r\
Description: \n\r\
CoffeeSUD: a player may RECRUIT this NPC: if MASK lets them in and they pay COST, it becomes a \
character of their profile in their party (as MPRECRUIT does), named NAME or by the first word of its \
name.  MESSAGE is shown as it joins (S the NPC, T the player).

PROP_DISCOVERY=\
Property   : Prop_Discovery\n\r\
Targets    : Rooms, Exits, Items, MOBs\n\r\
Parameters : XP=[N or N%] ON=[ENTER/LOOK/READ/OPEN/GET/FIND/TALK] ONCE=[CHARACTER/PARTY/PROFILE] MESSAGE="..." TATTOO=[NAME] MASK="..." JOURNAL="..."\n\r\
Example    : XP=150 ONCE=PARTY MESSAGE="Behind the falls lies a hidden grotto!" TATTOO=FOUND_GROTTO\n\r\
Description: \n\r\
CoffeeSUD: a discovery.  The first time its event happens to a character (ON: ENTER the room, LOOK at it, \
READ, OPEN, GET, TALK to the mob, or FIND it when it is hidden with Prop_Discoverable; by default ENTER for a \
room, OPEN an exit, GET an item, TALK a mob) and MASK lets them in, they get XP (a number, or a percent of their \
level's experience; tagged DISCOVERY:, so XPMOD can scale it), are told MESSAGE, get a JOURNAL line in their \
quest journal, and the tattoo TATTOO (or one of its own) marks it done: for them, their whole party \
(ONCE=PARTY) or every character of the profile (ONCE=PROFILE).  DISCOVERYXP=[formula] in the ini or world.ini \
pays each room a character enters for the first time (@x1 their level, @x2 the area's median level).

PROP_RESPEC=\
Property   : Prop_Respec\n\r\
Targets    : MOBs, Items, Rooms\n\r\
Parameters : WHAT=[STATS,SKILLS,EXPERTISES,CLASS,ALL] COST="[N]( per skill)" ONCE=YES MASK="[ZAPPER MASK]"\n\r\
Example    : WHAT=SKILLS COST="500 per skill" MASK="+TATTOOS +TUTORIAL_DONE"\n\r\
Description: \n\r\
CoffeeSUD: where this is (the room, someone or something in it, or something carried), a character may \
RESPEC: undo what they bought with trains and practices, of the kinds WHAT names (ALL by default), and \
have back what each cost.  Each character's purchases are kept as they are made: skills taught, gained \
and practised, expertises, stats, hit points, mana and moves trained, and a class trained into (undone \
while it has no levels).  Skills that come by themselves with a class stay.  COST is money for the whole \
respec, or with "per skill" for each thing undone; ONCE=YES lets each character do it here once; MASK \
names who may.  MPRESPEC does it from a script.

PROP_SKYTEXT=\
Property   : Prop_SkyText\n\r\
Targets    : Areas, Rooms\n\r\
Parameters : (DAWN="[TEXT]") (DAY=) (DUSK=) (NIGHT=) (INDAWN=) (INDAY=) (INDUSK=) (INNIGHT=) (WEATHER_[STATE]=) (STOP_[STATE]=) (MOON=)\n\r\
Example    : DAWN="The red sun drags itself over the ash dunes." WEATHER_SNOW="Grey ash begins to fall."\n\r\
Example    : DAWN=NONE NIGHT="The glowcaps dim as night falls on the surface far above."\n\r\
Description: \n\r\
CoffeeSUD: an area's or a room's own lines for the sky.  DAWN, DAY, DUSK and NIGHT are told \
under the sky as the time of day changes, INDAWN to INNIGHT indoors; WEATHER_[STATE] (CLEAR, \
CLOUDY, WINDY, RAIN, THUNDERSTORM, SNOW, HAIL, HEAT, SLEET, BLIZZARD, DUST, DROUGHT, COLD, FOG) is \
the weather's description, as it starts and as LOOK and WEATHER tell it, STOP_[STATE] its ending \
line, MOON TIME's moon line.  Alternatives go between |, one picked each time; NONE says nothing. \
A room's own come before its area's, an area's before its parents'; what none sets comes from the \
area's climate file (AHELP WEATHERPROFILE), then resources/lists.ini.

PROP_DARKDANGER=\
Property   : Prop_DarkDanger\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (LOST=[PCT]%) (STUMBLE=[PCT]%) (LURKER=[CATALOG MOB] LURK=[PCT]%) (MSG="[TEXT]") (STUMBLEMSG="[TEXT]") (LURKMSG="[TEXT]")\n\r\
Example    : LOST=10% STUMBLE=5% LURKER=ghoul LURK=3%\n\r\
Description: \n\r\
CoffeeSUD: dangers for a player the room is dark to (dark, and they cannot see in the dark; a lit \
torch ends it).  LOST: a move goes a random open way (MSG says so).  STUMBLE: a move fails and \
costs movement (STUMBLEMSG).  LURKER: as they come in, the catalog's mob of that name (or a mob \
class) comes out of the dark, LURK percent of the time (LURKMSG).

PROP_HAZARD=\
Property   : Prop_Hazard\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : TYPE=[TYPE] DAMAGE=[DICE/FORMULA] (SAVE=[TYPE]) (DRAIN=MOVE/MANA) (AFFECT="[ID] [PCT]%") (ROOMS="[MASK]") (WHEN="[MASK]") (PROTECT="[MASK]") (EVERY=[TICKS]) (ONSET=[TICKS]) (ESCALATE=[PCT]) (WARN="[TEXT]") (DARKONLY) (LITONLY) (NONPC) (NAME="[TEXT]") (MSG="[TEXT]")\n\r\
Example    : TYPE=COLD DAMAGE=1d6 SAVE=COLD WHEN="-WEATHER +BLIZZARD +SNOW" PROTECT="-EFFECTS +Spell_ResistCold" ESCALATE=20\n\r\
Example    : TYPE=HEAT DAMAGE=@x1/2 ROOMS="-DOMAIN +DESERT" WARN="The sand burns through your boots."\n\r\
Description: \n\r\
CoffeeSUD: a hazard zone.  Each tick (EVERY) those in the room, or in the area (ROOMS a mask on each \
of them, as -DOMAIN +MOUNTAINS, for some of its rooms), take DAMAGE as TYPE's damage (COLD, HEAT, \
ACID, GAS, POISON, ELECTRIC, HOLY, UNHOLY, DISEASE, THINAIR), so resistances count: dice as 1d6+2 \
or a formula, @x1 their level.  SAVE names the save that halves it (the type's own by default). \
DRAIN=MOVE or MANA takes it from moves or mana instead (THINAIR's default).  AFFECT may give an \
effect, that percent of the time.  WHEN is a mask checked on each every tick (the weather, the time), \
PROTECT the mask of those it spares; ONSET ticks pass before it starts, ESCALATE adds that percent \
each time in a row; WARN is said once as it starts.  DARKONLY and LITONLY: only in the dark, or the \
light; NONPC: players only.  NAME is what hurts (the biting cold), MSG the damage line.

PROP_AIRSUPPLY=\
Property   : Prop_AirSupply\n\r\
Targets    : Items\n\r\
Parameters : TICKS=[N]\n\r\
Example    : TICKS=6\n\r\
Description: \n\r\
CoffeeSUD: whoever carries it can go that many more ticks without air before they choke or \
drown, on top of their own breath (BREATHTICKS in coffeemud.ini or world.ini, @x1/3 of their \
constitution by default).  Breathable air fills one's breath again.

PROP_TIDALEXIT=\
Property   : Prop_TidalExit\n\r\
Targets    : Exits\n\r\
Parameters : OPEN=LOW/HIGH (SPAN=[HOURS]) (MSG="[TEXT]")\n\r\
Example    : OPEN=LOW SPAN=1 MSG="The causeway is under water."\n\r\
Description: \n\r\
CoffeeSUD: an exit passable only at one tide: low tide in the hour the day starts, high tide \
in the dusk hour (by the area's clock), SPAN hours either side; MSG the rest of the time.

PROP_INNROOM=\
Property   : Prop_InnRoom\n\r\
Targets    : Rooms\n\r\
Parameters : (HOURS=[N]) (MSG="[TEXT]")\n\r\
Example    : HOURS=6 MSG="You wake in a soft bed, well rested."\n\r\
Description: \n\r\
CoffeeSUD: a room to rest in: a WAIT (or MPPASSTIME) of HOURS game hours or more (1 by default) \
ends with the one who waited fully rested: hit points, mana and moves.

PROP_TIMEMODE=\
Property   : Prop_TimeMode\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : MODE=TURNS/REALTIME (ONLYCOMBAT=TRUE) (RESTORE=TRUE/FALSE) (MSG="[TEXT]")\n\r\
Example    : MODE=REALTIME MSG="Time seems to quicken; the water is rising."\n\r\
Example    : MODE=TURNS ONLYCOMBAT=TRUE\n\r\
Description: \n\r\
CoffeeSUD: a zone of its own time.  Coming in, time turns to MODE (turn-based or real time), as \
TIMEMODE does, and MSG is said; TIMEMODE cannot change it there; leaving, the mode before comes \
back, unless RESTORE=FALSE.  ONLYCOMBAT holds it only while one fights there.

PROP_LOOTTABLE=\
Property   : Prop_LootTable\n\r\
Targets    : MOBs, Items\n\r\
Parameters : FILE=[TEMPLATE FILE] ID=[ITEM TAG ID] (ROLLS=[MATH]) (ON=DEATH/OPEN/SPAWN/RESET) (CHANCE=[PCT]) (GOLD=[MATH])\n\r\
Example    : FILE=randareas/loot.xml ID=goblin ROLLS=0?2 ON=DEATH GOLD=1?10\n\r\
Example    : FILE=randareas/loot.xml ID=chest ROLLS=1?3 ON=OPEN\n\r\
Description: \n\r\
CoffeeSUD: a loot table: the ITEM tag ID of a template file (resources/randareas/, or the world's own), rolled \
ROLLS times, each a fresh roll with $mob_level, $area_level, $theme and $player_level set, if CHANCE (a percent, \
100 by default) allows, and GOLD as money.  ON=DEATH (a mob's default) puts it in the mob's corpse as it dies; \
ON=OPEN (a container's default) the first time the container is opened, and it stays rolled until its contents \
reset (a save keeps that); ON=SPAWN (RESET means the same) as the mob is brought to life, or as a player first comes into the \
container's room.  A catalog entry (class="catalog") keeps the catalog's cap.  A roll that gives nothing because its tracked items (MODBASE) cannot be made yet, as the items.modifiers module is off or its definitions fail CHECK, is not spent: \
a container rolls at its next opening, a mob's ON=SPAWN roll is made as it dies.  resources/randareas/loot.xml has sample tables (goblin, chest).

PROP_DURABILITY=\
Property   : Prop_Durability\n\r\
Targets    : Items\n\r\
Parameters : (MULT=[PERCENT]) (UNBREAKABLE) (NOREPAIR) (BREAK=true) (BROKENNAME="[NAME with %s]")\n\r\
Example    : MULT=50 BROKENNAME="a shattered %s"\n\r\
Example    : UNBREAKABLE\n\r\
Description: \n\r\
CoffeeSUD: an item's own wear and tear.  MULT is the percent of the usual wear it takes (with \
coffeemud.ini's ITEMWEAR); UNBREAKABLE takes none.  BREAK or BROKENNAME: worn out, it breaks \
rather than goes (as ITEMBREAK=BREAK does for all), and BROKENNAME names it so (%s its old \
name).  A broken item cannot be worn, held or wielded, gives no armour or damage, and shows \
as (broken), until it is mended (MEND, a smith); then it has its name back.  NOREPAIR: nobody \
mends it.  Below half its condition it shows as (worn).

PROP_ENLARGEROOM=\
Property   : Prop_EnlargeRoom\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : number or adjustment of movement points\n\r\
Example    : 2\n\r\
  Example  : +2\n\r\
  Example  : -2\n\r\
  Example  : /2\n\r\
  Example  : *2\n\r\
  Example  : /2.5\n\r\
  Example  : *1.5\n\r\
Description: \n\r\
Change the number of movement points required to cross the room, and range. \
The +-/* signs may be used to adjust the amounts for a given room, or an \
absolute value may be given.

PROP_ENTERADJUSTER=\
Property   : Prop_EnterAdjuster\n\r\
Targets    : Rooms, Exits\n\r\
Parameters : statistic names followed by a +, -, or = and a value\n\r\
  Example  : and/or spells separated by semicolons, and an optional mask\n\r\
Example    : str+2 dex-2 move+100 class=thief race=elf gender=F;Prayer_Bless;\n\r\
Example    : str+2 dex-2 move+100 MASK=-Race +Dwarf\n\r\
Example    : str+2 gender=F;Prayer_Bless;MASK=-Race +Dwarf\n\r\
Description: \n\r\
Upon entering this room or exit, the listed effects or spells will be \
PERMANENTLY ADDED to the mob.  All parameters use the + or - adjuster, except the \
class, race, and gender, ableprofs, and ablelvls parameters. \
Valid parameters are as follows: \n\r\
strength dexterity constitution charisma wisdom intelligence \n\r\
maxstr maxdex maxcon maxcha maxwis maxint (maximum trainable) \n\r\
savepar savefir savecol savewat savegas savemin savegen savejus \n\r\
saveaci saveele savepoi saveund savemag savedis savetra allsaves (every saving throw at once), \n\r\
ability (magical level), armor, attacks (prowess), damage (max), \
disposition (sitting/standing/flying/etc), level, rejuv(!NO!), \
senses (blind/infravision/darkvision/etc), speed (#attacks), \
height, weight, ambiance+``,gender, class, race, hitpoints, hunger (stomach size), \
mana, movement, thirst (stomach size) conversion weightadj saveblunt \
savepierce saveslash savespells saveprayers savesongs savechants \
critpctweapons critpctmagic critdmgweapons critdmgmagic faith deity \
rejuvrate xpadjpct, experience, practices \
trains, questpoints, coins. Ableprofs and \
ablelvls is a commma-delimited list of ablityids followed by a number \
in parenthesis to adjust proficiency or casting level by.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_ESSENTIAL=\
Property   : Prop_Essential\n\r\
Targets    : MOBs\n\r\
Parameters : (MODE=YIELD/KNOCKOUT) (AT=[N]%) (TICKS=[N]) (MSG="[TEXT]") (REFUSEMSG="[TEXT]") (NOXP)\n\r\
Example    : MODE=YIELD AT=10% TICKS=20 MSG="<S-NAME> drop(s) to one knee and yield(s)!"\n\r\
Example    : MODE=KNOCKOUT TICKS=10\n\r\
Description: \n\r\
CoffeeSUD: a mob the story needs alive, or one that gives up.  MODE=YIELD: under AT percent of \
its hit points (10) it stops fighting, as do its foes, MSG shows, and its scripts' YIELD_PROG \
runs ($n who beat it), so a script can spare it, take its key, or finish it.  MODE=KNOCKOUT: a \
blow that would kill it leaves it at 1 hit point, out cold, and DEFEAT_PROG runs.  Either \
way, for TICKS ticks (20) attacks on it are refused with REFUSEMSG, and the one who beat it \
gains the experience of a kill, unless NOXP.

PROP_FAMILIAR=\
Property   : Prop_Familiar\n\r\
Targets    : MOB\n\r\
Parameters : The familiar code number or name\n\r\
Example    : rat\n\r\
Description: \n\r\
This property is a special MOB property created for the find familiar spell. \
It handles all the special benefits of the familiar type, along with the \
benefits to the owner.  It will also destroy the familiar when no longer \
following the owner.

PROP_FIGHTSPELLCAST=\
Property   : Prop_FightSpellCast\n\r\
Targets    : Weapon (Item)\n\r\
Parameters : A percentage, and proper spell names separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : Siege weapons: ALLMOBS, ALLITEMS, ONLYMOBS, ONLYITEMS flags\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : 50%;Spell_Invisible;Prayer_Sanctuary\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_Portal(Somewhere else);MASK=-RACE +Dwarf\n\r\
Description: \n\r\
Causes a spell to be cast upon the target being struck during melee combat. \
This property also supports a % chance of triggering.  Siege weapons will \
also affect a random mob/item on the deck, or all if ALLMOBS/ALLITEMS added, or\
selectively if ONLYMOBS/ONLYITEMS added.\n\r\
\n\r\
The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
The flag NOOWN can be used to skip item ownership checks.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_FUMBLE=\
Property   : Prop_Fumble\n\r\
Targets    : Items, Areas, Rooms\n\r\
Parameters : CHANCE=[PCT] (ITEM=WORN/HERE/HAVE/PRESENT) (MASK=[ZAPPERMASK])\n\r\
Parameters : (MSG="<S-NAME> fail(s) to do @x1 to <T-NAME> because @x2.")\n\r\
Parameters : (PRIVATE=TRUE/FALSE) (AID=[ABILITY ID],..) (WEAPON=TRUE/FALSE)\n\r\
Parameters : (ATYPE=[ABILITY TYPE],...) (ADOMAIN=[DOMAIN],...) (AFLAG=[FLAG],...)\n\r\
Parameters : (CAST=[ABILITY ID(ARGS)],...)\n\r\
Example    : chance=50% mask="-race +elf" aid=Spell_Fireball,Spell_Light\n\r\
Example    : chance=50% atype=spell,skill adomain=stealthy\n\r\
Example    : chance=50% atype=spell cast=Spell_Fireball\n\r\
Description: \n\r\
Causes a spell or skill to fumble and show a message according to the given \
chance%.  The skills to fumble are identified as belonging to the given ATYPE \
(if specified) AND either belonging to the ADOMAIN, having an AFLAG, or having \
its Ability ID in the list of AID.  The skill will fumble if the caster matches \
the given MASK zappermask.  The message MSG= may be specified, with special codes \
@x1 for the skill name, and @x2 for the affected item name.  The message can be \
shown PRIVATE= ly, or to everyone in the room.  If the affected is an item, the \
ITEM= parameter can be used to specify the state that the item must be in to \
cause the fumble: WORN (or WEAR, the default) is worn by the one acting, \
HAVE (HAS, or any word starting INV) is carried, HERE (or ROOM) is in the room, \
PRESENT is either worn, carried or in the room.  Lastly, a CAST= argument can be given \
to cause fumbles to be accompanied by a spell being cast by the item against the skill \
user; its list may also hold the words NOUNINVOKE (the effects cannot be dispelled) \
and TICKS=[NUMBER] (the effects that follow last that long at most).\n\r\
\n\r\
Prop_Fumble also has another mode of operation.  If WEAPON=TRUE, then instead of \
fumbling skills, it will fumble attacks and cause the attacker to suffer the \
consequences.

ADJSENSES=\
cannotsee, canseehidden, canseeinvisible, canseeevil, canseegood, canseesneakers, canseebonus, \
canseedark, canseeinfrared, cannothear, cannotmove, cannotsmell, cannottaste, cannotspeak, \
cannotbreathe, canseevictim, canseemetal, cannotthink, cannotwork, cannotautoattack, \
cannotbecamped, canseeitemshidden

ADJDISPOSITION=\
isunseen, ishidden, isinvisible, isevil, isgood, issneaking, isbonus, isdark, isgolem, issleeping, \
issitting, isflying, isswimming, isglowing, isclimbing, isfalling, islight, isbound, iscloaked, \
isunsavable, iscataloged, isunattackable, iscustom, isunhelpful

PROP_HAVEADJUSTER=\
Property   : Prop_HaveAdjuster\n\r\
Targets    : Items\n\r\
Parameters : statistic names followed by a +, -, or = and a value\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : str+2 dex-2 class=thief race=elf allset=aname-3\n\r\
Example    : str+2 ableprofs="spell_fireball(10)" MASK=-Race +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is owned, the listed effects will be \
given to the owner.  All parameters use the + or - adjuster, except the \
class, race, gender, ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts, and ablelvls parameters. \
Valid parameters are as follows: \n\r\
strength dexterity constitution charisma wisdom intelligence \n\r\
maxstr maxdex maxcon maxcha maxwis maxint (maximum trainable) \n\r\
savepar savefir savecol savewat savegas savemin savegen savejus \n\r\
saveaci saveele savepoi saveund savemag savedis savetra allsaves (every saving throw at once), \n\r\
ability (magical level), armor, attacks (prowess), damage (max), \
disposition (see AHELP ADJDISPOSITION), level, rejuv(!NO!), \
senses (see AHELP ADJSENSES), speed (#attacks), \
height, weight, ambiance+``,gender, class, race, hitpoints, hunger (stomach size), \
mana, movement, thirst (stomach size) conversion weightadj saveblunt \
savepierce saveslash savespells saveprayers savesongs savechants \
critpctweapons critpctmagic critdmgweapons critdmgmagic faith deity \
rejuvrate xpadjpct. Ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts and \
ablelvls is a commma-delimited list of ablityids followed by a number \
in parenthesis to adjust proficiency, duration, mana, movement or hit point costs, or casting level by.\n\r\
\n\r\
By default, the values + or - are added to the existing values.  However, if \
MULTIPLYPH=true is included in the parameters, then attack, armor, damage, \
weight and height will instead have their values multiplied by the given value / 100, \
and speed by the given value itself (SPEED+1.5 is one and a half times). Likewise, \
if MULTIPLYCH=true is included, then hitpoints, mana, and movement are similarly \
multiplied instead of added.  All other values act the same.\
\n\r\
Parameters may also include ALLSET=[SET_NAME]-[NUMBER] where SET_NAME is a \
arbitrary un-spaced name of the set to which the item belongs.  Only when [NUMBER] \
items in that set are possessed (or worn for Prop_WearAdjuster) will all of the \
stats be adjusted according to their parameters.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HAVEENABLER=\
Property   : Prop_HaveEnabler\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is owned, the owner \
will be granted the spells, skills listed.  The percentage given is optional, \
and will be the proficiency of the skill.  If a percentage is not given, the \
default is 100%.  \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HAVERESISTER=\
Property   : Prop_HaveResister\n\r\
Targets    : Items\n\r\
Parameters : resistance names followed by percentages\n\r\
Parameters : Parameters may be followed by an optional mask\n\r\
Example    : magic 50% poison -10%\n\r\
Example    : magic poison 50% pierce -10% MASK=-RACE +Dwarf\n\r\
Example    : fire 40% SOURCEMASK="-RACECAT +Dragon"\n\r\
CoffeeSUD: SOURCEMASK="[ZAPPER MASK]" makes it work only against the attackers it fits; MASK= is still whom it protects.\n\r\
Description: \n\r\
So long as the item with this property is owned, the owner will gain certain \
resistances and immunities in the parameters. \
The effects which may be included are: \n\r\
Resistances: gas fire electricity mind magic cold acid water evil (undead) \n\r\
Resistances: justice (as per many thief abilities) \n\r\
Resistances: weapons blunt pierce slash non-magical-weapons non-silver-weapons\n\r\
Resistances:  -- weapons get reduced % damage per round, lvl based, with limits.\n\r\
:          :  -- always modifier makes weapon resists always work, no limits.\n\r\
Resistances: spell chant song prayer thief_skill (ability types) \n\r\
Resistances: enchantment/charm kicking vexing conjuration (ability domains)\n\r\
Immunities : teleport (includes gate, summon) holy disease poison\n\r\
Misc       : debuf-duration (pct is the maximum debuf ticks remain)\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HAVESPELLCAST=\
Property   : Prop_HaveSpellCast\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is owned, the owner will be under the \
effect of the listed spells. The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HAVEZAPPER=\
Property   : Prop_HaveZapper\n\r\
Targets    : Items\n\r\
Parameters : masking parameters described below, optional zap message\n\r\
Example    : -class +mage -race +elf -evil\n\r\
Example    : MESSAGE="<O-NAME> flies off <S-NAME>" -class +mage\n\r\
Example    : -class +mage "event=accuse,trespassing" "message=^N"\n\r\
Description: \n\r\
Whenever this item is picked up by a mob, the item will be \
zapped out of the mobs hands if they meet the parameters.  \
An optional MESSAGE parameter can define what is seen when the zap occurs. \
Also optionally, the parameters can start with the word ACTUAL to change \
zapping behavior to look at actual values instead of perceived values \
(this about a class check applied to a Charlatan.).  The parameters can \
also start with the word CONTENT to have the zapper apply equally to \
a container and its contents (at least until the thing with the zapper \
is separated from the container). If the parameters include any alignment \
checks, the item will end up with an appropriate ambiance as well. \
The optional EVENT parameter is a comma-delimited set of strings, where the \
first is one of ZAP (default) or ACCUSE followed by a comma and the crime \
key from a laws.ini type definition. \
See AHELP ZAPPERMASK, where allowed can possess, and disallowed is zapped. 

PROP_HEREADJUSTER=\
Property   : Prop_HereAdjuster\n\r\
Targets    : Rooms\n\r\
Parameters : statistic names followed by a +, -, or = and a value\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : str+2 dex-2 move+100 class=thief race=elf gender=F\n\r\
Example    : str+2 ableprofs="spell_fireball(10)"  MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the room with this property is occupied, the listed effects will be \
given to the occupants.  All parameters use the + or - adjuster, except the \
class, race, and gender, ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts, and ablelvls parameters. \
Valid parameters are as follows: \n\r\
strength dexterity constitution charisma wisdom intelligence \n\r\
maxstr maxdex maxcon maxcha maxwis maxint (maximum trainable) \n\r\
savepar savefir savecol savewat savegas savemin savegen savejus \n\r\
saveaci saveele savepoi saveund savemag savedis savetra allsaves (every saving throw at once), \n\r\
ability (magical level), armor, attacks (prowess), damage (max), \
disposition (see AHELP ADJDISPOSITION), level, rejuv(!NO!), \
senses (as AHELP ADJSENSES), speed (#attacks), \
height, weight, ambiance+``,gender, class, race, hitpoints, hunger (stomach size), \
mana, movement, thirst (stomach size) conversion weightadj saveblunt \
savepierce saveslash savespells saveprayers savesongs savechants \
critpctweapons critpctmagic critdmgweapons critdmgmagic faith deity \
rejuvrate xpadjpct. Ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts and \
ablelvls is a commma-delimited list of ablityids followed by a number \
in parenthesis to adjust proficiency, duration, mana, movement or hit point costs, or casting level by.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HEREENABLER=\
Property   : Prop_HereEnabler\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
Whenever someone enters the room or area, they \
will be granted the spells, skills listed.  The percentage given is optional, \
and will be the proficiency of the skill.  If a percentage is not given, the \
default is 100%.  When they leave, they lose the spells/skills.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HERESPELLCAST=\
Property   : Prop_HereSpellCast\n\r\
Targets    : Rooms\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the room with this property is occupied, the occupants will \
be under the effect of the listed spells. The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
(MAXTICKS and TICKS only cut the time an effect has left, never lengthen it.  The word ONCLOSED, as for \
Prop_SpellAdder, is only for containers and does nothing in a room.)\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_HOMEBEACON=\
Property   : Prop_HomeBeacon\n\r\
Targets    : Rooms\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: a home.  Sleeping here (or HOME SET) makes it the start room of every character of the \
party who has privileges here, so RECALL and HOME bring them back to it.  HOMEBEACONS=true in the \
ini makes every owned room a home without it; HOMERECALL is how many turns HOME takes (3 by \
default, 0 for no HOME).

PROP_HOMESTEAD=\
Property   : Prop_Homestead\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (MASK="[ZAPPER MASK]") (SKILLS=[SKILL ID],...) (CLAIM=TRUE/FALSE/PROFILE) (MAXROOMS=[N]) (PRICE=[N]) (NOTAX)\n\r\
Example    : SKILLS=Construction,Masonry MAXROOMS=3\n\r\
Description: \n\r\
CoffeeSUD: land a character may build on without buying a deed, on a room or every room of an area.  \
MASK is a zapper mask the builder must pass, and SKILLS the building skills allowed (all when not \
given).  With CLAIM=TRUE (the default) the first build in a room with no title claims it: the room \
gets a Prop_LotsForSale owned by the builder (by @PROFILE, the whole profile, with CLAIM=PROFILE or \
PROFILEPROPERTY=true), priced PRICE (1 by default, and at 1 no property tax is due; NOTAX keeps it \
at 1), and with MAXROOMS a Prop_ReqCapacity, so the lot grows by the usual building rules to MAXROOMS \
rooms at most.  If that build does not start (no materials, say), the claim is taken back.  With \
CLAIM=FALSE they may build there with no title at all.

PROP_HIDDEN=\
Property   : Prop_Hidden\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : (UNLOCATABLE) (BUBBLES)\n\r\
Example    : \n\r\
Example    : unlocatable\n\r\
Description: \n\r\
An alternative to setting something permanently hidden, this will keep a hidden until the mob \
performs some act which would normally un-hide the mob.  After that, a period of time must \
elapse before the property reengages and makes a mob hidden again. All other object types \
just stay hidden\n\r\
\n\r\
Optional flags include: \n\r\
Unlocatable - makes the item unlocatable by spells, or an area by the WHERE command. \n\r\
Bubbles - makes the hidden property not only apply to the object, but to an owner.

PROP_ICEBOX=\
Property   : Prop_IceBox\n\r\
Targets    : Items,Rooms\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Any items placed in the room or container with this property will not spoil.  When removed, however,\
spoilage will resume.

PROP_IMPROVEGATHER=\
Property   : Prop_ImproveGather\n\r\
Targets    : Items,Rooms,Mobs,Areas\n\r\
Parameters : AMT=[MULTIPLIER] MASK=[ZAPPERMASK] SKILLS=ALL/[SKILLID LIST]\n\r\
Example    : amt=3 mask="-SEASON +SPRING" skills=Farming,Foraging\n\r\
Description: \n\r\
Alls the mob, item, or location to bestow the ability to multiply the yield \
from certain gathering skills.  SKILLS can be either a list of Ability IDs, \
or the word "ALL" to apply to all gathering skills.  A MASK would always apply \
to the person doing the skill, and the AMT is the integer number to multiply \
the yield by (or 0 to make it go away altogether!).\n\r\
\n\r\
See AHELP ZAPPERMASK, where allowed is improved, and disallowed is not. 

PROP_INSTANTDEATH=\
Property   : Prop_InstantDeath\n\r\
Targets    : MOB, Item, Room, Area\n\r\
Parameters : (MASK="[zapper]") (DAMAGE=[NUM]) (DMGPCT=[0-100]) (MSG="[STR]")\n\r\
Example    : mask="-race +dwarf"\n\r\
Example    : damage=10 dmgpct=0 msg="<S-NAME> <DAMAGES> <T-NAME>"\n\r\
Description: \n\r\
Will (eventually) cause the death of anyone using the item, attacking the mob, \
or entering the room or area.  If a mask if given, only those matching the mask \
are killed. If a DMGPCT < 100 is used, damage is done and the MSG is displayed. \
If a DAMAGE > 0 is used, but DMGPCT=0, then a flat amount of damage is done.\n\r\
\n\r\
See AHELP ZAPPERMASK, where allowed is killed, and disallowed is spared. 

PROP_INVOKABLE=\
Property   : Prop_Invokable\n\r\
Targets    : Items\n\r\
Parameters : (WORD="[WORD]") (VERB=[VERB]) SPELLS="[ID];LEVEL=[N],[ID]" (TARGET=SELF/ENEMY/ROOM) (CHARGES=[N]) (RECHARGE=DAWN/DAILY/TICKS=[N]) (COOLDOWN=[TICKS]) (REQUIRE=WORN/HELD) (MASK="[ZAPPER MASK]") (MSG="[TEXT]") (EMPTYMSG="[TEXT]") (REFUSE=HEALTHY,NOAILMENT) (REFUSEMSG="[TEXT]") (REFILL=KILL:[N]) (AUTO=HP<[N])\n\r\
Example    : WORD=Ignis SPELLS="Spell_Fireball;LEVEL=12" TARGET=ENEMY CHARGES=3 RECHARGE=DAWN REQUIRE=WORN EMPTYMSG="The ring is cold."\n\r\
Description: \n\r\
CoffeeSUD: an item's powers on demand, for anyone, with no class skill.  Its holder says WORD, \
or types VERB and its name (INVOKE [ITEM], the default without a WORD).  It casts SPELLS, each \
at LEVEL (or the item's level), on its user (SELF), their foe (ENEMY) or about them (ROOM).  \
CHARGES is how many uses it holds (what is left is kept with it); RECHARGE fills them again \
at dawn, each game day, or every N ticks.  COOLDOWN ticks pass between uses.  REQUIRE: it must \
be worn, or held.  MASK is who may use it.  MSG is what the room sees (<S-NAME> the user, \
<T-NAME> the item); EMPTYMSG what they are told when it is spent.  REFUSE: it does nothing, \
and spends nothing, when there is nothing to do: HEALTHY at full health, NOAILMENT with no \
harmful effect to cure (REFUSEMSG says so).  REFILL=KILL:N gives N charges back for each kill \
by its holder.  AUTO=HP<N: its holder below N% of their hit points uses it by itself, at most \
once a tick and not in a tick they used it by hand.  Its charges, cooldown and recharge \
countdown are kept with it in a save.  Identifying it tells its charges, recharge, cooldown, \
refusals, refill and automatic use.

PROP_INVISIBILITY=\
Property   : Prop_Invisibility\n\r\
Targets    : MOB, Items, Exits\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
An alternative to setting a mob permanently invisible, this will keep the MOB invisible until the mob \
performs some act which would normally dispel the invisibility.  After that, a period of time must \
elapse before the property reengages and makes the mob invisible again.

PROP_ITEMBINDER=\
Property   : Prop_ItemBinder\n\r\
Targets    : Items\n\r\
Parameters : TO=CHARACTER/ACCOUNT/GROUP/CLAN/PLAYER/NPC/NOONE ON=PICKUP/EQUIP \n\r\
           : (MESSAGE=[ZAPMSG]) (DEATHKEEP=TRUE/FALSE)\n\r\
           : (ALLOT="[name]") (ALLOTFOR="[time]") (TRADE=NONE/ALLOWED/ANY) (SOURCE="[text]") (EXPIRES="[time]")\n\r\
Example    : TO=CHARACTER ON=PICKUP MESSAGE="Bound -- you can't do that."\n\r\
Example    : TO=CHARACTER ON=PICKUP ALLOT="Ann" ALLOTFOR="1 mudhour" TRADE=NONE SOURCE="the furnace warden" EXPIRES="2 mudhours"\n\r\
Description: \n\r\
Allows an item to be bound when an event occurs to the person, account, or clan that \
either picks it up or first equips it.  Once bound, an item can only be picked up, worn, \
held or wielded by that same player, account, or clan, and cannot be given to anyone else.  TO=GROUP binds it to everyone in the group of \
the character who picks it up (or equips it) first, as the group stood then; any of \
them can take it, and nobody else.  The zap message is also configureable, as is \
whether the item persists with the player over death.  CoffeeSUD: the binding's other \
fields, each on its own.  ALLOT: who may take it first (only that character may pick it \
up), for ALLOTFOR (a time, as "1 mudhour"; for as long as it lies unclaimed when left out), \
after which anyone may.  TRADE: once bound, NONE (it is never given or sold), ALLOWED (the \
default: given only to whom it is bound to, never sold) or ANY (given and sold freely; only \
using it stays the bound one's).  SOURCE: where it came from, shown on inspection.  EXPIRES: \
how long a binding lasts (a time); after it, anyone may use it and it binds no more.  The \
times are kept in its text, so they are saved with the item; inspection shows each field and \
how long is left.

PROP_ITEMGROWTH=\
Property   : Prop_ItemGrowth\n\r\
Targets    : Items\n\r\
Parameters : (GAIN=KILL/HIT/USE/WORNTICK) (XP="[FORMULA]") (KILLMASK="[ZAPPER MASK]") STAGES="[N]:NAME='[NAME]' PROPS=[ID]([ARGS]);[N]:..." (MSG="[TEXT]") (BIND=CHARACTER)\n\r\
Example    : GAIN=KILL XP="@x1" KILLMASK="-RACECAT +Undead" STAGES="100:NAME='a humming blade' PROPS=Prop_WearAdjuster(dam+2);400:NAME='Dawnbringer' PROPS=Prop_WearAdjuster(dam+5)" MSG="$p shudders as it grows stronger!" BIND=CHARACTER\n\r\
Description: \n\r\
CoffeeSUD: an item that grows with use.  GAIN: the kills of the one who wields or wears it (KILL; \
KILLMASK is which), its hits (HIT), anything done with it (USE), or each tick worn (WORNTICK).  \
Each gives XP (a formula, @x1 the slain's level; 1 by default).  STAGES: at each amount it takes \
the NAME (DISPLAY too) and PROPS of that stage (a semicolon before each next stage), and its \
holder is told MSG ($p the item).  BIND=CHARACTER: it grows for its first owner only.  Its \
growth, stage and owner are kept with it; identifying it shows the stage and the way to the next.

PROP_ITEMNORUIN=\
Property   : Prop_ItemNoRuin\n\r\
Targets    : ITEM\n\r\
Parameters : (NEVERMIND)\n\r\
Example    : \n\r\
Description: \n\r\
When placed on an item, that item will be exempt from your systems loot policy.  The item will not be \
deleted, corrupted, ruined, or otherwise affected by the policy, regardless of your ini file settings. \
If the NEVERMIND argument is given, however, it will always be ruined no matter what.

PROP_ITEMSLOT=\
Property   : Prop_ItemSlot\n\r\
Targets    : ITEM\n\r\
Parameters : (NUM=[SLOTS COUNT]) (TYPE=[STRING]) (LEVEL=NONE/HIGH/ADD) \n\r\
Parameters : (REMOVABLE=[TRUE/FALSE]) (ONLOSS=DESTROY/KEEP) ; [XML]\n\r\
Example    : NUM=4 TYPE=Gems REMOVABLE=TRUE\n\r\
Description: \n\r\
When placed on an item, that item will have available slots into which other items, those \
with the Prop_ItemSlotFiller property, can be PUT using the PUT command. When this is done, \
the item with this property will gain the effect benefits of the other item in addition to \
its own.\n\r\
\n\r\
The NUM parameter determines how many slots are available.  The TYPE parameter must match \
the TYPE parameter from the Prop_ItemSlotFiller of the item being PUT.  The REMOVABLE \
property sets whether the items in the slots may be removed.  The LEVEL argument affects \
how slot fillers affect the item level: none, equal to the highest, or added together. \
See also Prop_ItemSlotFiller.\n\r\
\n\r\
CoffeeSUD: TYPE may name a type per slot, as TYPE="Gems,Gems,Runes" (the last repeats for \
any slots left): a filler goes only into empty slots of its own type.  ONLOSS=KEEP: when \
the item goes (destroyed, or this property taken off it), what is socketed goes back to \
the item's owner, or onto the floor; by default (DESTROY) it goes with the item.  A filler \
whose ADDS include Prop_ComposeSupport gives its supports while the item is worn.

PROP_COMPOSESUPPORT=\
Property   : Prop_ComposeSupport\n\r\
Targets    : ITEMS\n\r\
Parameters : SUPPORTS=[ID],[ID]\n\r\
Example    : SUPPORTS=example.burning\n\r\
Description: \n\r\
CoffeeSUD: while the item is worn, wielded or held (or a gem with it in its ADDS is socketed in \
something worn), its wearer's composed skills (the optional module abilities.composition) get \
these supports, beyond the ones linked, wherever a support fits the skill; at most two come \
from gear.  COMPOSE SHOW lists them under "From your gear", with any that do not fit.

PROP_OFFERBOOK=\
Property   : Prop_OfferBook\n\r\
Targets    : MOBS, ITEMS\n\r\
Parameters : JSON: items (catalog names, or {"name", "weight"}), size, price, reroll, refresh\n\r\
Example    : {"items":[{"name":"a steel sword","weight":3},"a leather cap","a lantern"],"size":2,"price":150,"reroll":25,"refresh":"1 mudday"}\n\r\
Description: \n\r\
CoffeeSUD: a seller's offer book.  The first OFFERS here draws size (1-8, default 3) different \
items of the list, by weight, from the campaign's offers stream, each priced at price percent \
(default 100) of its value; the book is kept in this property's text, so it is saved with the \
seller, and is drawn again only when refresh (a quest board's REFRESH, default one mud day) has \
passed.  OFFERS HOLD keeps one offer through refreshes and rerolls; OFFERS REROLL draws the others \
again for reroll (0, the default, for none), refused before anything is drawn when it cannot be \
paid; OFFERS BUY takes the price and gives a catalog copy.  See SUDDocs/creator/42-saved-choices.md.

PROP_SERVICE=\
Property   : Prop_Service\n\r\
Targets    : MOBS\n\r\
Parameters : JSON: services, each id, title, words, mask, refusal, hours, station, cost ({money} or {pool, units, org})\n\r\
Example    : {"services":[{"id":"heal","title":"Healing","words":["heal"],"cost":{"money":10}}]}\n\r\
Description: \n\r\
CoffeeSUD: the NPC's services, as one record.  A service may be had only within its hours \
(from-to), only at a workstation with its station tag, only by those who pass its mask (refused \
with its refusal) and only by those who can pay its cost: money, or units from a shared pool of \
their organization (a receipt in its ledger).  TALK's menu offers the ones one may have now and \
says why not the rest; SERVICES lists them; saying a word to the NPC is refused, before its \
scripts hear it, for the same reasons, and otherwise paid.  What the service does is the NPC's \
script answering the word.  See SUDDocs/creator/06-npcs-dialogue.md.

PROP_UNKNOWN=\
Property   : Prop_Unknown\n\r\
Targets    : ITEMS\n\r\
Parameters : KIND=[id] (NAME="[name]") (DISPLAY="[look]") (DESC="[text]") (VALUE=[n]) (REVEAL=IDENTIFY,APPRAISE,EXAMINE,USE) (MASK="[mask]")\n\r\
Example    : KIND=embertrial.alloy NAME="a dull ingot" DISPLAY="A dull ingot lies here." DESC="A lump of metal you cannot place." VALUE=2 REVEAL=IDENTIFY,EXAMINE\n\r\
Description: \n\r\
CoffeeSUD: the item is of a kind a character must learn.  Until they know KIND, everything shows \
them its NAME, its DISPLAY in the room and its DESC: inventory, rooms, messages and shops; they can \
refer to it by that name too.  Appraising it and a shop's price for it go by VALUE (by its real \
value when VALUE is left out); identifying it says they cannot tell what it is.  The ways in REVEAL \
(IDENTIFY by default) teach the kind, once, to one who passes MASK: then they know every item of \
it, by a tattoo KNOWN_[KIND] kept in the save.  Looking or appraising again changes nothing.

PROP_ITEMSLOTFILLER=\
Property   : Prop_ItemSlotFiller\n\r\
Targets    : ITEMS (NOT CONTAINERS)\n\r\
Parameters : (NUM=[SLOTS COUNT]) (TYPE=[STRING]) (SKIPS=[ID,...]) \n\r\
Parameters : (ADDS="[ID(args),...]")\n\r\
Example    : TYPE=Gems ADDS="Prop_HaveAdjuster(STR+1)"\n\r\
Description: \n\r\
When placed on an item, that item will put able to be PUT, using the PUT command, into the \
slots provided on an item with the Prop_ItemSlot property.  When this is done, the item into \
which this item is PUT will gain all the effect benefits of this item.\n\r\
\n\r\
The NUM parameter determines how many slots this item takes up.  The TYPE parameter must match \
the TYPE parameter from the Prop_ItemSlot of the item being PUT into.\n\r\
\n\r\
The SKIPS property is a comma delimited list of Ability IDs which should be ignored when determining which \
effects on this item should be applied to the slotted item.\n\r\
\n\r\
The ADDS property is a comma delimited list of Ability IDS/Properties for adjusting the item or the \
wearer of the item whose slot is being filled.  Adjustments to physical stats like attack, armor, \
damage, speed, or disposition/senses will only affect the slotted item itseld, while all other \
character state and stat adjustments will impact the wearer/wielder of item. 

PROP_ITEMTRANSPORTER=\
Property   : Prop_ItemTransporter\n\r\
Targets    : Rooms, MOBs, Items (Containers)\n\r\
Parameters : The transporter KEY\n\r\
Example    : KEYX123\n\r\
Description: \n\r\
Any room, items, or mob with this property becomes a medium for transportation to \
another mob, room, or item with the Prop_ItemTransReceiver property with the \
same key.  Any items dropped in the room, picked up or give to the mob, or placed \
inside the containers with this property will be instantly transported to another \
room/item/mob with the Prop_ItemTransReceiver property which has the exact same \
KEY parameter.  If there is more than one Prop_ItemTransReceiver found with the \
proper key, the destination will go randomly to one of the choices.

PROP_ITEMTRANSRECEIVER=\
Property   : Prop_ItemTransReceiver\n\r\
Targets    : Rooms, MOBs, Items (Containers)\n\r\
Parameters : The transporter KEY\n\r\
Example    : KEYX123\n\r\
Description: \n\r\
See Prop_ItemTransporter above.

PROP_ITEMSET=\
Property   : Prop_ItemSet\n\r\
Targets    : Items\n\r\
Parameters : SET=[ID] (NAME="[TEXT]") (COUNT=WORN/HELD) (TIER[N]="[ID]([ARGS]);[ID]([ARGS])") (PIECES=[N]) (ONMSG="[TEXT]") (OFFMSG="[TEXT]") (MASK="[ZAPPER MASK]")\n\r\
Example    : SET=drowned_king NAME="Regalia of the Drowned King" PIECES=5 TIER2="Prop_WearAdjuster(savewat+20)" TIER4="Prop_WearSpellCast(Spell_WaterBreathing);Prop_WearEnabler(Chant_Tsunami)" ONMSG="The regalia stirs."\n\r\
Example    : SET=drowned_king\n\r\
Description: \n\r\
CoffeeSUD: a piece of an item set.  Every piece has SET, the set's id; one piece (or a line \
of world/itemsets.txt, SET=[ID] NAME=... TIER2=..., for a set none of whose pieces says) has \
the tiers: TIER[N] what wearing N pieces gives (COUNT=HELD: carrying them), properties and \
their arguments in brackets, a semicolon between.  Every tier met applies: its properties go \
on one of the counted pieces, unsaved, and come off when a piece does.  ONMSG and OFFMSG tell \
the wearer as a tier comes and goes ($t the tier); MASK is who may have them; PIECES how many \
there are.  LOOK at a piece shows "Set: 3/5 worn" and each tier.  Scripts: SETCOUNT([CODE] \
[SET]) and SET_PROG.  The ALLSET of Prop_HaveAdjuster and Prop_WearAdjuster now gives each \
piece its own number of pieces needed.

PROP_JSCRIPT=\
Property   : Prop_JScript\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : SCRIPT=[FILE] ([NAME]=[VALUE])...\n\r\
Example    : SCRIPT=world:js/props/bloodblade.js KILLS=0\n\r\
Description: \n\r\
Runs a JavaScript file (under resources/, or world:path) that may define \
affectPhyStats(host, affected, stats), affectCharStats(host, mob, stats), \
affectCharState(host, mob, state), okMessage(host, msg) (false refuses the \
message), executeMsg(host, msg), tick(host, tickID), onAdded(host), \
onRemoved(host) and catchUp(host, ticks) (AHELP CATCHUP).  The other parameters are the file's parms, numbers as \
numbers; what a hook changes in parms is written back to the property's text, \
and so saved with its host.  guides/JavaScriptSUD.html has an example.

PROP_KEYRULES=\
Property   : Prop_KeyRules\n\r\
Targets    : Items (keys)\n\r\
Parameters : (CONSUME=true) (BREAK=[PERCENT]) (RETURN=[ROOM ID]) (MASK="[ZAPPER MASK]") (MSG="[TEXT]")\n\r\
Example    : CONSUME=true\n\r\
Example    : RETURN=Castle#12 MASK="-CLASSES +Thief" MSG="The key will not turn for you."\n\r\
Description: \n\r\
CoffeeSUD: rules for a key.  CONSUME: it crumbles once it has unlocked something; BREAK: that \
percent of the time it snaps when it is used; RETURN: once used it goes back to that room; \
MASK: who may use it (MSG is told to the others).  A key's code may also be a list \
(crypt;vault: it opens both) or end in * (jail.*: a master key for jail.1, jail.2...), and a \
key on a keyring is found however deep the keyring is in a pack.

PROP_KNOWNRECIPES=\
Property   : Prop_KnownRecipes\n\r\
Targets    : MOBs\n\r\
Parameters : [SKILL ID]|[RECIPE NAME OR WHOLE RECIPE LINE], one a line\n\r\
Example    : Weaponsmithing|moonblade\n\r\
Description: \n\r\
CoffeeSUD: the recipes a character knows, kept with them.  A whole recipe line (tabs and all) is a \
recipe of that skill as a recipe book's would be, without the book; a name makes one of the skill's \
own recipes known, as one marked HIDDEN=1 (AHELP RECIPEKEYS), which no one else sees.  LEARN FROM a \
recipe book copies its recipes in, and scripts use MPLEARNRECIPE and KNOWSRECIPE().  With \
PROFILERECIPES=true in the ini, every character of the profile knows what any of them knows.

PROP_LANGTRANSLATOR=\
Property   : Prop_LangTranslator\n\r\
Targets    : Mobs, Items, Rooms\n\r\
Parameters : (NOTRANSLATE) ([PERCENT]) (`WORDS) ([LANGUAGE ID]) ...\n\r\
Parameters : (#[PLAYERNAME])\n\r\
Example    : \n\r\
Example    : 100% Dwarven 50% Elvish\n\r\
Example    : Dwarven Elvish\n\r\
Example    : NOTRANSLATE 75% `smile `beer Dwarven #BOB\n\r\
Description: \n\r\
This is property has two distinct but related purposes.  The original is to \
allow the mob or item to translate any words spoken in the room \
in a language other than Common, into Common.  The mob or item is heard saying the \
translation, a line everyone in the room hears (not a SAY of its own, so it is \
not translated again).  The percentage chance given, which defaults to 100%, will \
be the chance that the mob or item will translate any given sentence.\n\r\
\n\r\
The other function of this property is activated when NOTRANSLATE is one of the \
parameters.  In this case, this property on a mob will allow that mob to understand \
languages they otherwise would not.  In fact, understanding can be limited to \
specific words by prefixing a language id with one or more `words.  This mode can \
also support passing commands through to mobs by including the names of trusted \
players using the # syntax, or a wildcard name of #*.

PROP_LANGUAGESPEAKER=\
Property   : Prop_LanguageSpeaker\n\r\
Targets    : Mobs, Items, Rooms, Areas\n\r\
Parameters : LANGUAGE=[LANGUAGE] (UNDERSTANDS=ONLY) (HOMEONLY=TRUE/FALSE) (NOMOBS=TRUE/FALSE)\n\r\
Parms(Cont):    (PLAYERS=TRUE/FALSE) (; [ZAPPER MASK])\n\r\
Example    : LANGUAGE=Dwarven\n\r\
Example    : LANGUAGE=Dwarven players=true ; -NAMES +BOB\n\r\
Example    : LANGUAGE=SignLanguage homeonly=true ; -NAMES +BOB\n\r\
Description: \n\r\
This is property forces the mobs who become affected by this property to speak \
the designated language until something else stops them.  On a mob, the affected \
mob will speak the language.  On a room, those who enter or are born in a room \
may be speak the language.  On an area, those who enter or are born in a room may \
speak the language. On an exits, those who enter the exit may speak the language. \
On an item, those who pick up the item may start speaking the language, while \
putting it down will stop them.\n\r\
\n\r\
On a mob, UNDERSTANDS=ONLY removes automatic Common comprehension while allowing learned languages and translators. See PROP_MONOLINGUAL. The parameters affect who will start speaking the language.  By default, any non-player \
mob will become affected.  HOMEONLY will force only those whose starting room is \
in the area to speak.  NOMOBS will eliminate all non-players from consideration.  \
PLAYERS will allow players to be affected.  An optional zapper mask may follow a semicolon \
to add additional masks. \
<ZAP=disallow>

PROP_LIMITEDCONTENTS=\
Property   : Prop_LimitedContents\n\r\
Targets    : Items, Rooms, Areas\n\r\
Parameters : [MAX NUM] ([MASK]) (; [...] / MSG="[MESSAGE]" ACTUAL=[T/F] LOCKIN=true LOCKMSG="[MESSAGE]" CONSUME=true ONPUT="[ACTIONS]" ONFULL="[ACTIONS]" ONEMPTY="[ACTIONS]")\n\r\
Example    : 3 -javaclass +genweapon\n\r\
Example    : 3;msg="Can't do it!"\n\r\
Example    : 2 -TAGS +DRAGONEYE;0;MSG="It does not fit.";LOCKIN=true;ONFULL="door open here north; echo The dragon's mouth grinds open."\n\r\
Description: \n\r\
This property will ensure that no more than the given number of items \
that match the given mask may be either put into the container, or dropped \
in a room.  Multiple masks may be specified.  The first mask that the item \
matches will be applied.  Matching NONE of the masks means no limit \
of those items.  CoffeeSUD: a container is also a receptacle.  LOCKIN keeps \
what is put in it in it (LOCKMSG is told); CONSUME makes what is put in \
vanish, while still counting it (kept as TALLY=).  ONPUT runs when something \
goes in, ONFULL when each limit above 0 is met, ONEMPTY when the last thing \
is taken out: script commands, a semicolon between them, MP left off if you \
like, $n who did it (as Prop_Switch's).  The ONPUT, ONFULL and ONEMPTY text is split into commands at every semicolon, \
quoted or not.

PROP_LIMITEDEQUIP=\
Property   : Prop_LimitedEquip\n\r\
Targets    : Items\n\r\
Parameters : [MAX NUM](;ID="[IDENTIFIER]" MESSAGE="[MESSAGE]")\n\r\
Parameters :          (GET=[T/F] MASK="[ZAPPERMASK]")\n\r\
Example    : 3\n\r\
Example    : 3;id="my unique id" message="Can't do it!"\n\r\
Description: \n\r\
This property will ensure that no more than the given number of items \
with the same name (or ID) as the ones with this property can be equipped \
by someone at the same time, or gotten at the same time if GET=TRUE.  An \
optional zappermask can filter who this restriction applies to.

PROP_LIMITEDITEMS=\
Property   : Prop_LimitedItems\n\r\
Targets    : Items\n\r\
Parameters : [MAX ITEMS](;ID="[IDENTIFIER]")\n\r\
Example    : 3\n\r\
Description: \n\r\
This property will ensure that no more than the given number of items \
with the same name (or ID) as the ones with this property will exist, either \
in the inventory of players, or in rooms.  It works by removing the \
excess items from the map when someone first enters a room with one \
of the excess items.  For this reason, limited items are automatically \
marked as non-locatable to block them from spells like Locate Object.\n\r\
\n\r\
This property will cause all player records to be loaded into memory \
at the end of the normal boot cycle, which will increase boot time \
and may cause a delay for the first person logging in.

PROP_LOCATIONBOUND=\
Property   : Prop_LocationBound\n\r\
Targets    : Items, Mobs\n\r\
Parameters : AREA/ROOM/[AREA NAME]/[ROOM ID]\n\r\
Parameters : (;ABSOLUTE) (;PLAYEROK) (;TIMEOUT=[SEC])\n\r\
Example    : AREA\n\r\
Example    : ROOM ;PLAYEROK ;TIMEOUT=44\n\r\
Example    : My Happy Area ;PLAYEROK\n\r\
Example    : My Area#12321\n\r\
Description: \n\r\
This property will ensure that the affected mob or item is unable to leave \
or be taken away from its home location, which is determined by the parameters. \
Use ROOM or AREA to prevent it from leaving whatever its current room or area \
is.  Using a specific area name or room id is more helpful, however, as it will \
not only prevent movement away from the given area or room, but will whisk the \
mob or item BACK to its home if it is ever able to be removed for some reason \
ANYWAY.  If the PLAYEROK argument is given, then the item can be moved anywhere \
so long as a player is holding, riding, or being followed by the bound thing.  If \
the TIMEOUT argument is given, then the item can be moved outside its bound only \
until the timer expires.  If the ABSOLUTE argument is given, then the AREA and ROOM \
argument are no longer relative, but absolute to the starting room of the bound \
item, as if the room number or area name had been specified.

PROP_LOCKRULES=\
Property   : Prop_LockRules\n\r\
Targets    : Exits, Items\n\r\
Parameters : (PICK=NEVER/LEVEL:[N]) (KEYS=[CODE];[CODE]) (RELOCK=[TICKS]) (MSG="[TEXT]")\n\r\
Example    : PICK=NEVER KEYS=spare;guard.* RELOCK=20\n\r\
Description: \n\r\
CoffeeSUD: rules for a lock.  PICK=NEVER: no thief picks it; PICK=LEVEL:30: only one of that \
level or more (MSG tells the others).  KEYS: key codes it takes besides its own (a code ending \
in * takes all that begin so).  RELOCK: that many ticks after it is unlocked it shuts and \
locks again.

PROP_LOTFORSALE=\
Property   : Prop_LotForSale\n\r\
Targets    : Room\n\r\
Parameters : (RENTAL/GRID/ALLOWTHEFT) [PRICE]\n\r\
Example    : 1000000\n\r\
Example    : Bob/100000\n\r\
Example    : GRID 1000000\n\r\
Description: \n\r\
Makes this room and future adjacent rooms available for purchase as  \
a single lot. This property is an extension of the Prop_RoomForSale property, and \
includes all of its capabilities, PLUS, when this room is sold, \
adjacent lots will automatically be created, \
allowing the player to expand his or her property.  When the property \
is sold, or falls out of a players possession, the system will \
automatically retract the created rooms. The word rental followed by a space may \
preceed the price to make the price of the property be charged every month \
automatically out of a Bankers account.  Failure to make rent returns the property \
to sellable status.  The word GRID followed by a space may preceed the price \
to make new rooms automatically link to other rooms via demolishable walls. \
The word ALLOWTHEFT disables robbery law enforcement on the property. \n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property. \n\r\
\n\r\
This property is similar to prop_lotsforsale, except that the players don't have to purchase each room.\n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_LOTSFORSALE=\
Property   : Prop_LotsForSale\n\r\
Targets    : Room\n\r\
Parameters : ([OWNER NAME]/)(RENTAL) (GRID) (ALLOWTHEFT) [PRICE]\n\r\
Example    : 1000000\n\r\
Example    : GRID 1000000\n\r\
Example    : Bob/100000\n\r\
Example    : Bob/ RENTAL 100000\n\r\
Description: \n\r\
Makes this room and future adjacent rooms available for purchase.  \
This property is an extension of the Prop_RoomForSale property, and \
includes all of its capabilities, PLUS, when this room is sold, \
adjacent lots will automatically be created and put up for sale, \
allowing the player to expand his or her property.  When the properties \
are sold, or fall back out of any players possession, the system will \
automatically retract the created rooms. The word RENTAL followed by a space may \
precede the price to make the price of the property be charged every month \
automatically out of a Bankers account.  Failure to make rent returns the property \
to sellable status.  The word GRID followed by a space may precede the price \
to make new rooms automatically link to other rooms via demolishable walls.\
The word ALLOWTHEFT disables robbery law enforcement on the property. \n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property. \n\r\
\n\r\
This property is similar to prop_lotforsale, except that the players must buy each room.\n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_MAGICFREEDOM=\
Property   : Prop_MagicFreedom\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Cancels all magical effects in the room.  If placed on a mob, will cancel magical \
effects in the same room as the mob. 

MILKABLE=\
Property   : Milkable\n\r\
Targets    : Mobs\n\r\
Parameters : (DRINK=[TRUE/FALSE]) (ON=[TRUE/FALSE])\n\r\
Parameters : (PERDAY=[AMT]) (TYPE=[RESOURCE])\n\r\
Example    : drink=true on=true perday=10000 type=milk\n\r\
Description: \n\r\
This ability governs the ability for an ordinary non-GenCow mob, to be milked.  The \
MILK command becomes available as well, which you can learn about with HELP MILK. \n\r\
\n\r\
The DRINK argument determines whether the DRINK and FILL commands work with this mob, or \
whether ONLY the MILK command will work with it.\n\r\
\n\r\
The ON argument determines whether the mob, by default, is cooperative.  By default, they \
are not, unless they are at home on private property that is managed by the milker, \
or are bound.\n\r\
\n\r\
The PERDAY argument is the amount of milk, per day, that the creature generates. \n\r\
\n\r\
The TYPE argument can be given to change the default liquid type produced, which is, \
of course, MILK.

PROP_MOBEMOTER=\
Property   : Prop_MOBEmoter\n\r\
Targets    : Room, Area, Item, Mob, Exit\n\r\
Parameters : Same as Emoter Behavior\n\r\
Parameters : ([BEHAVIOR ID] [BEHAVIOR ARGUMENTS])\n\r\
Description: \n\r\
This property, by default, is simply an ability/effect encapsulation of the Emoter behavior.  Please \
do AHELP Emoter for information on the proper use and parameters of this property.  However, if the \
first word of the arguments is a valid Behavior ID, then this property can encapsulate ANY behavior \
with all arguments after the first being the arguments of that behavior.

PROP_MOBRANK=\
Property   : Prop_MobRank\n\r\
Targets    : MOBs\n\r\
Parameters : RANK=[MINION/NORMAL/ELITE/BOSS/ANOTHER]\n\r\
Example    : RANK=BOSS\n\r\
Description: \n\r\
CoffeeSUD: the mob's rank.  It gets the rank's numbers, from MOBRANK_[NAME] in \
coffeemud.ini (or a world's world.ini): HP+n% DAMAGE+n% ATTACK+n ARMOR-n (lower is \
better) SPEED+n, XP*x (the experience for killing it), RESIST="fire 25% mind 25%" \
(saving throws), POWER=x (what an encounter budget counts it as) and TAG=text, which \
LOOK and CONSIDER show.  The numbers are read each time the mob's stats are worked \
out, so one edit retunes every mob of the rank.  The defaults: MINION HP-50% DAMAGE-25% \
ATTACK-10 XP*0.5 TAG=[minion]; NORMAL nothing; ELITE HP+100% DAMAGE+25% ATTACK+10 \
ARMOR-10 XP*2.5 TAG=[elite]; BOSS HP+300% DAMAGE+50% ATTACK+20 ARMOR-20 XP*5 TAG=[boss].  \
A world may add ranks of its own (MOBRANK_CHAMPION=...).  Scripts read RANK($i) (NORMAL \
for a mob without one) or test RANK($i == BOSS); masks take -RANK +ELITE +BOSS (only \
those) and +RANK -MINION (not those).

PROP_MODEXPERIENCE=\
Property   : Prop_ModExperience\n\r\
Targets    : MOBs, Items, Rooms, Areas\n\r\
Parameters : (=,+,-,*,/)[NUM](%)(SELF)(RIDEOK)(TARGET)(;[MASK])(;;[TYPE])\n\r\
Parameters : ([Comma-delimited, bracket[]-surrounded groups of above])\n\r\
Example    : 500\n\r\
Example    : 500;-race +orc\n\r\
Example    : =10%\n\r\
Example    : +20% SELF RIDEOK\n\r\
Example    : [+20% SELF RIDEOK;-race +horse],[=10%;-race +elf]\n\r\
Example    : +20%;-class +Fighter +Mage -Race +Elf\n\r\
Example    : *2\n\r\
Description: \n\r\
Allows the archon to modify the amount of experience gained by each player for \
slaying the mob. If placed on a mob, the experience will be granted according to \
the parm, so long as the player meets the mask, and xp meets the type parameters (both optional). \
The property will apply to the mob with this property him or herself only if the \
word SELF is included in the first parameters. The property will apply to riders of \
mobs with this property, unless RIDEOK is included in the first parameters. \
This property will only apply to targeted xp (like combat) with the TARGET parameter. \
Other arguments include: NEGATIVE to apply only to lost experience, or POSINEGA to apply \
to positive and negative experience.  POSITIVE experience only is the default. \
If placed on an item, the xp mod will be applied to the wearer (or wielder \
or holder) .  If placed on a Room or Area, the experience mods will be apply to those inside. \
If no mask or xp type is given, the experience is always granted. For valid masks, \
see AHELP ZAPPERMASK, where allowed is modified, and disallowed is not modified. \
Valid xp types include things like: "ABILITY:[ability id]", "COMBAT:*", "SCRIPT:[quest name]", \
"CLASS:[class name]", "ACHIEVE:*", "COMMAND:[command id]", "LIEGE:[name]", "MISC:*", etc. \
The type can be matched using * or ? characters. \
Multiple independent XP changes may be specified by grouping all arguments in [], and separating \
multiple groupings with commas.

PROP_MODFACTION=\
Property   : Prop_ModFaction\n\r\
Targets    : MOBs, Items, Rooms, Areas\n\r\
Parameters : (+/-[FACTION ID]:)(=,+,-,*,/)[NUMBER](%)(;[MASK])\n\r\
Example    : alignment.ini: 500\n\r\
Example    : alignment.ini: 500;-race +orc\n\r\
Example    : =10%\n\r\
Example    : examples/reputation.ini: +20%\n\r\
Example    : +20%;-class +Fighter +Mage -Race +Elf\n\r\
Example    : +alignment.ini:*2\n\r\
Description: \n\r\
Allows the archon to modify the amount of faction gained or lost by each player for \
slaying the mob. If placed on a mob, the faction will be granted according to \
the parm, so long as the player meets the mask parameters (optional) and so long \
as the faction being changed is the one specified in the parameters (also optional). \
The faction id is left empty to specify affecting all factions.  The faction id can be \
preceeded by a + to only affect faction gains, - to only affect faction losses, or neither \
to affect both.  You can also use REACTION as a faction ID to only apply to factions that \
have reactions defined.  \
If this property placed on an item, the faction will be altered for the wearer (or wielder \
or holder), so long as the mob killed meets the mask (optional).  \
If placed on a Room or Area, the faction will be changed for one who meets \
the (optional) mask requirements.  \
If no faction id is given, all factions are changed.  \
If no mask is given, the faction is always granted. For valid masks, \
see AHELP ZAPPERMASK, where allowed is modified, and disallowed is not. 

PROP_MOVERESTRICTOR=\
Property   : Prop_MoveRestrictor\n\r\
Targets    : MOBs, Rideables\n\r\
Parameters : (CHANCE=[NUMBER 0-100])\n\r\
Parameters : (NOLOCALES="[LOCALE],...") (ONLYLOCALES="[LOCALE],...")\n\r\
Parameters : (NODOMAINS="[DOMAIN],...") (ONLYDOMAINS="[DOMAIN],...")\n\r\
Parameters : (SEARCH="[STR]") (ISEARCH="[STR]") (MSEARCH="[STR]") \n\r\
Parameters : (MESSAGE="<S-NAME> [PREDICATE]") (PUBLIC=TRUE/FALSE)\n\r\
Parameters : (DISMOUNT=[TRUE/FALSE]) (CAST="[ABILITY ID];...")\n\r\
Example    : nolocales="WOODS,SWAMP" message="<S-NAME> will not enter!" public=true\n\r\
Description: \n\r\
According to the given percentage CHANCE (default 100%), this property \
restricts the ability of a mob or rideable to enter rooms of a particular spec. \
NODOMAINS can list the types of rooms that cannot be entered, whereas ONLYDOMAINS \
lists the types of rooms that can be entered, restricting all others.  Both are \
comma-delmited lists.  Indoor DOMAINS include: STONE, WOODEN, CAVE, MAGIC, and METAL.  \
Outdoor DOMAINS include: CITY, WOODS, ROCKY, PLAINS, UNDERWATER, AIR, WATERSURFACE, \
JUNGLE, SWAMP, DESERT, HILLS, MOUNTAINS, SPACEPORT, SEAPORT.\n\r\
\n\r\
NOLOCALES can list the types of rooms that cannot be entered, whereas ONLYLOCALES \
lists the types of rooms that can be entered, restricting all others.  Both are \
comma-delmited lists.  See LIST LOCALES for a list of valid room locale ids.\n\r\
\n\r\
The SEARCH string allows room restricting based on a key phrase in the potential room \
title or description.  MSEARCH restricts based on mobs in the potential room, and \
ISEARCH based on items in the potential room. \n\r\
\n\r\
The MESSAGE parameter allows you to set the string that the person trying to move into \
the room sees when it is restricted.  Use <S-NAME> as a substitute for the persons name. \
The PUBLIC parameter decides whether everyone sees the message (true), or only the person \
trying to move (false).\n\r\
\n\r\
The DISMOUNT will automatically dismount any riders on the affected.\n\r\
\n\r\
The CAST parameter allows you to cause a spell to be cast upon all the properties mover, \
or upon all the riders, when they try to enter a room that is restricted.

PROP_MULTIEFFECTS=\
Property   : Prop_MultiEffects\n\r\
Targets    : MOBs, Items, Exits, Rooms\n\r\
Parameters : [AbilityID] [AbilityID([args]) ... \n\r\
Example    : Prop_WearAdjuster(INT+2),Prop_WearAdjuster(STR-2 MASK=-RACE +ELF)\n\r\
Description: \n\r\
Allows an object to have the same effect multiple times by embedding each version of the \
effect into this property.  The list of effects is space (or comma) delimited, and can \
optionally have arguments in parenthesis.  Make sure parenthesis in parameters match! \n\r\
\n\r\
Note: the parameters are write-only.  When looked at later, the parameters are turned into \
an XML doc to protect the integrity of other properties that also transform their data.

PROP_NARROWLEDGE=\
Property   : Prop_NarrowLedge\n\r\
Targets    : Rooms, Exits\n\r\
Parameters : check=[%] name=[NAME OF THE LEDGE] (room=[ROOM ID])\n\r\
Example    : check=16 name="the narrow ledge"\n\r\
Example    : check=25 name="a tightrope" room="myarea#2"\n\r\
Description: \n\r\
Whenever a player enters or exits the room or exit with this property, \
that player is in great danger.  If the player fails to roll beneath their \
Dexterity on a roll from 1-the "check" parameter, the player will fall to \
their death or into the specified room ID.  The check parameter can be \
made smaller to give those with less dexterity a better survival chance, \
or made higher to make it more difficult to survive.

PROP_NEWDEATHMSG=\
Property   : Prop_NewDeathMsg\n\r\
Targets    : MOB\n\r\
Parameters : the new death string\n\r\
Example    : \n\r\
Description: \n\r\
Makes the mob with this property emote a different death string than the normal \
one.

PROP_NOCHANNEL=\
Property   : Prop_NoChannel\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : Semicolon delimited list of channel names and or flags QUIET; SENDOK\n\r\
Example    : SENDOK;GOSSIP;CHAT\n\r\
Example    : GOSSIP;QUIET\n\r\
Description: \n\r\
Without any parameters, this property will cancel all channel message sending from \
the room, or by the mob/player with the property.  You can limit the channels that \
are blocked by naming them in the parameters, separating them with semicolons.  You \
can also have the property block reception of channel messages using the QUIET flag. \
Lastly, you can override the no-channel-sending using the SENDOK flag, thereby allowing \
channel messages to be sent.

PROP_NOCHARM=\
Property   : Prop_NoCharm\n\r\
Targets    : MOBS, Room, Area\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Disallows the casting of charm like affects in the area, or against the target mob.

PROP_NOCRAFTABILITY=\
Property   : Prop_NoCraftability\n\r\
Targets    : ITEMS\n\r\
Parameters : ([ZAPPERMASK])\n\r\
Example    : \n\r\
Example    : -RACE +Elf\n\r\
Description: \n\r\
Disallows the item with this property from being learned as a recipe for crafting, \
even if otherwise qualified.  If placed on a GenRecipe, it prevents the recipe \
from being listed in crafting.  An optional ZapperMask can narrow the effect only \
to those who do not pass the mask.

PROP_NODAMAGE=\
Property   : Prop_NoDamage\n\r\
Targets    : Mobs, Items\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Makes a weapon or mob incapable of doing any real damage.

PROP_NOORDERING=\
Property   : Prop_NoOrdering\n\r\
Targets    : MOBs, Room, Area\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Disallows ordering by non-admins in the area, or against the target mob.

PROP_NOPKILL=\
Property   : Prop_NoPKill\n\r\
Targets    : Room, Area\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Cancels all player killing in the room or area. 

PROP_NOPURGE=\
Property   : Prop_NoPurge\n\r\
Targets    : Rooms, Containers, Items\n\r\
Parameters : ([TIMESTAMP]/[DATE-TIME]_\n\r\
Example    : \n\r\
Example    : 16885795721221\n\r\
Example    : 10/31/2023 08:51am\n\r\
Description: \n\r\
Prevents items in the room from being destroyed as refuse over time.  When \
placed on an item, this property makes the item immune to "garbage collection" \
regardless of where in the world it is.  If no parameter is given, the \
protection will last until the next reboot, or otherwise until the time given.

PROP_NORECALL=\
Property   : Prop_NoRecall\n\r\
Targets    : Room, Area, Items\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Disallows recalling in the room.  If placed on items, the item must be possessed by the \
mob or player trying to recall for prevention to work.

PROP_QUESTBOARD=\
Property   : Prop_QuestBoard\n\r\
Targets    : Items, Rooms\n\r\
Parameters : (COUNT=[N]) (REFRESH="[GAME TIME]") (TEMPLATE=[TEMPLATE]) (VARS="[NAME]=[VALUE] ...") (FILE=[PATH]) (TAGID=[ID]) (LEVELRANGE=[N])\n\r\
Example    : COUNT=3 REFRESH="1 mudday" TEMPLATE=normal LEVELRANGE=3\n\r\
Description: \n\r\
CoffeeSUD: a board of jobs, quests generated as the RandomQuests behavior makes them \
(TEMPLATE, FILE as its PATH (quests/random/all.xml, the shipped generator, if none is given), TAGID, and its other parameters, such as SOURCENAME= for \
the giver, are passed on; VARS sets more of the generator's variables).  LOOK at the \
board (or READ it, if the item is readable; LOOK in the room, on a room) lists the \
jobs the reader may take, COUNT of them (3), and ACCEPT [NUMBER] takes one.  At each \
REFRESH (1 MUDDAY, or MUDDAY:1), on the game clock, the jobs done or given up go and \
new ones come up to COUNT, or with none taken the oldest is replaced; a job taken \
stays until it is done.  The generator is told the reader's PLAYER_LEVEL, PARTY_SIZE \
(the players' characters of their group), PLAYER_FACTION_[ID] and QUESTS_DONE, and \
with LEVELRANGE=[N] TARGET_MIN_AREALEVEL and TARGET_MAX_AREALEVEL that far around \
the level.  A job waits on the board with no expiry unless EXPIRE= says one.  The \
jobs are kept in a saved game with the board.

PROP_QUESTITEM=\
Property   : Prop_QuestItem\n\r\
Targets    : Items\n\r\
Parameters : QUEST=[NAME] (NODROP) (NOSELL) (NOGIVE) (KEEPONDEATH) (REMOVEON=[WON,FAILED,ABANDONED,EXPIRED,ENDED/ALL/NONE])\n\r\
Example    : QUEST=bell NODROP NOSELL REMOVEON=WON\n\r\
Description: \n\r\
CoffeeSUD: binds the item to a quest.  NODROP, NOSELL and NOGIVE refuse those, with \
a message; KEEPONDEATH keeps it with the character when they die.  It goes when the \
quest leaves ACTIVE for its holder as REMOVEON says: WON, FAILED, ABANDONED (dropped), \
EXPIRED, or ENDED (the quest stopped); ALL, the default, is any of them, NONE none.  \
QUESTS [QUEST] lists what the character carries for it.

PROP_QUESTLOG=\
Property   : Prop_QuestLog\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game: each quest's objectives and journal entries)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: a character's quest journal, the objectives and entries that MPQOBJECTIVE, \
MPQJOURNAL and a quest's SET OBJECTIVE and SET JOURNAL give, kept in this hidden \
effect so that it is saved with the character.  QUESTS shows it.  Not for builders \
to give or change.

PROP_QUESTMARKER=\
Property   : Prop_QuestMarker\n\r\
Targets    : MOBs, Items\n\r\
Parameters : (QUEST=[NAME/*]) (AVAILABLE="[MARK]") (ACTIVE="[MARK]") (READY="[MARK]") (READYFUNC=[FUNCTION])\n\r\
Example    : QUEST=bell READYFUNC=CAN_COMPLETE\n\r\
Example    : QUEST=* AVAILABLE="^Y(!)^?" ACTIVE="^w(?)^?" READY="^Y(?)^?"\n\r\
Description: \n\r\
CoffeeSUD: a mark after the mob or item in room listings, by how the quest stands for \
the one looking: AVAILABLE (^Y(!)^?) while they may accept it (its CAN_ACCEPT says so, \
as for Prop_QuestGiver), ACTIVE (^w(?)^?) once they have, READY (^Y(?)^?) when \
READYFUNC, a FUNCTION_PROG of this mob's or item's run with them as $n, returns \
something (not CANCEL).  QUEST=* (the default) is every running quest it has a \
script from, is first quest mob or item of, or gives by Prop_QuestGiver.  Only the \
player's characters see marks, each their own.  QUESTMARKERS=AUTO in coffeemud.ini \
or world.ini marks every running quest's first quest mob, and every Prop_QuestGiver, \
without this property.

PROP_FURNISHING=\
Property   : Prop_Furnishing\n\r\
Targets    : Items\n\r\
Parameters : (ROOMEFFECT=[ABILITY](PARMS)) (ROOMBEHAVIOR=[BEHAVIOR](PARMS)) (COMFORT=[N]) (ACTS=[NAME],...)\n\r\
Example    : ROOMEFFECT=Prop_RoomLit COMFORT=2 ACTS=fire\n\r\
Example    : COMFORT=3 ROOMBEHAVIOR=Emoter(min=5 max=9 chance=50;creaks.)\n\r\
Description: \n\r\
CoffeeSUD: furniture that changes its room.  While the item is placed in a room (it cannot be picked \
up, as a decorated or mounted thing) or lies on the floor of an owned room, the ROOMEFFECT and \
ROOMBEHAVIOR are on the room; when it leaves, they go, and they are never saved with the room.  COMFORT \
adds to the room's comfort, which the script function COMFORT() reads.  ACTS makes it a workstation \
of those names with no bonus (AHELP PROP_WORKSTATION): ACTS=fire serves a craft that needs a fire.

PROP_GENLOCK=\
Property   : Prop_GenLock\n\r\
Targets    : Rooms\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: GENLOCK.  REGENERATE AREA keeps this room as it is, with its exits, when it builds the rest \
of the area again from its GENSOURCE: for rooms written or changed by hand in a generated area.  \
REGENERATE LOCK and UNLOCK put it on the room you are in and take it off.

PROP_NOSAVE=\
Property   : Prop_NoSave\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (MSG="[REFUSAL]")\n\r\
Example    : MSG="The water's whispering drowns your thoughts."\n\r\
Description: \n\r\
The game cannot be saved here, whatever its save mode (SAVEMODE in \
coffeemud.ini); the player is told MSG, or that they cannot save here.  On an \
area, it covers every room in it.  In an ironman game, QUIT still keeps the \
game, and a Prop_AutoSave here still saves.

PROP_NOSUMMON=\
Property   : Prop_NoSummon\n\r\
Targets    : Rooms, Areas, Mobs\n\r\
Parameters : (ALLOWNONAGGR) (MAGICONLY)\n\r\
Example    : \n\r\
Example    : MAGICONLY ALLOWNONAGGR\n\r\
Description: \n\r\
Disallows summoning of creatures or people INTO the affected place. \
The optional ALLOWNONAGGR parm may be added to disallow summoning \
only of aggressive mobs (a summoning aimed at anything else is let through). \
By default every summoning skill is stopped, a spell, chant, prayer or song \
with a fizzle and any other skill with a failed attempt; MAGICONLY stops only \
the spells, chants, prayers and songs.

PROP_NOTELEPORT=\
Property   : Prop_NoTeleport\n\r\
Targets    : Room, Area\n\r\
Parameters : (EXCEPTIONS=[ROOMID/AREANAME,etc..]) (NOSUMMON=TRUE)\n\r\
Parameters : ... (INTERAREAOK=true/false) (MESSAGE=[message])\n\r\
Parameters : ... (REDIRECT=[ROOM ID])\n\r\
Example    : \n\r\
Example    : exceptions="area name#12,other area name"\n\r\
Description: \n\r\
Disallows the casting of gate, teleport, portal, plantpass, and other \
spells INTO this area.  If this is placed on an area, specific room \
or area exceptions may be given. By default, mob summoning skills, such \
as monster summoning, ARE allowed, but can also be disabled with \
nosummon=true.  The optional exceptions argument can list room ids, \
area names, planarability, or spell ids.  The NOSUMMON argument prevents \
summoning also, and INTERAREAOK allows/prevents teleportation inside \
an area with this property.  MESSAGE can be used to change the fizzle \
message seen by the casters.  REDIRECT is an optional room ID that will \
allow the teleport to procede, but only to the specific room.

PROP_NOTELEPORTOUT=\
Property   : Prop_NoTeleportOut\n\r\
Targets    : Room, Area\n\r\
Parameters : (EXCEPTIONS=[ROOMID/AREANAME,etc..]) (INTERAREAOK=true/false)\n\r\
Example    : \n\r\
Example    : exceptions="area name#12,other area name"\n\r\
Example    : INTERAREAOK=false\n\r\
Description: \n\r\
Disallows the casting of gate, teleport, portal, plantpass, and other \
spells OUT OF this area. The optional exceptions argument can list room ids, \
area names, planarability, or spell ids.  INTERAREAOK is true if not given, \
and then every teleport out of the place is stopped, even to another room of \
the same area; with INTERAREAOK=false a teleport whose destination is inside the \
same area (on an area, it and its sub-areas) is let through, and only one that \
leaves it is stopped.

SPELL_TELEPORT=\
Property   : Spell_Teleport\n\r\
Targets    : Exits\n\r\
Parameters : (AREANAME)/(THEME=[AUTOGENTHEME] AREASIZE=[NUM] etc)\n\r\
Parameters : (CASTMSG="[STR]") (APPEARMSG="[STR]") (LEAVEMSG="[STR]")\n\r\
Example    : Midgaard\n\r\
Example    : theme=rats areasize=100\n\r\
Description: \n\r\
When used as a property on exits, teleport can be used to generate random areas \
as per the Generate command or StdAutoGenInstance areas.  The caster will be evicted \
after the spell expires.  You can also, in any case, change the default teleport area, \
or the casting and arrive/leave messages.

PROP_NOTELLING=\
Property   : Prop_NoTelling\n\r\
Targets    : Room, Area, Mobs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Cancels all tell message sending in or to the room, area, or mob.  \
You can also add this to player mobs as punishment or to shut them up. \
Admins are exempt from the restrictions imposed.

PROP_NPCLINES=\
Property   : Prop_NPCLines\n\r\
Targets    : MOBs, Areas\n\r\
Parameters : [KEY]="[TEXT]"(|"[TEXT]")([MASK]) ...  or  "[STOCK LINE]"="[TEXT]" ...\n\r\
Example    : NOTBUYING="Bah! I've no use for that junk."|"Take that rubbish elsewhere." STOLEN="I know where that came from, $n."\n\r\
Description: \n\r\
CoffeeSUD: the NPC's own words for the stock lines a shopkeeper, banker, postman, \
hireling or the like says.  Each entry names a line by a short key or by the line \
itself in quotes; its text is what is said instead, one of several split by | at \
random, with @x1, @x2... the line's values (a price, an item) and $n the one spoken \
to.  A [MASK] after the text makes it that customer's alone, and such entries come \
first; [AFFINITY >=25] or [AFFINITY FRIENDLY] tests the NPC's opinion of them (AHELP \
PROP_AFFINITY).  An empty text says nothing.  On an area it gives the whole town's words; \
an NPC's own come first.  The keys: NOTBUYING (I'm not interested.), NOTBUYINGTHOSE, \
STOLEN, OUTOFSTOCK, TOOPOOR (@x1 the item), SHOPPOOR, TOODEAR, OFFER (@x1 the price, \
@x2 the item), FIRM, TOOADVANCED, TOOLOW, CLANSONLY, BALANCE, NOLOANS, ACCOUNTCLOSED, \
ONLYCURRENCY, SAFE, DELIVER, FORHIRE, HIRED, PRICE, ONTHEJOB, TIMEUP, GOODBYE, \
WONTWORK, SKILLS.  Any other line the NPC says may be named in quotes.

PROP_OPENCOMMAND=\
Property   : Prop_OpenCommand\n\r\
Targets    : Exits, Items\n\r\
Parameters : [COMMAND WORD] ([PARMS...]/NOOPEN/MESSAGE=[STR];...\n\r\
Example    : twist knob;NOOPEN;MESSAGE="Doorknob!!";tw knob;twi knob\n\r\
Example    : smack botto*\n\r\
Description: \n\r\
When applied to a locked container or exit, this property will force \
the affected openable to unlock and open when the command phrase is entered \
by the user in its presence.  The command word must match exactly, and the \
command entered must otherwise be completely invalid.  PARMS arguments must also \
match exactly, although any PARM arg may end with * to use a starting string wildcard. \
A PARM argument may also end with ** to match the rest of the users entered command string. \
In addition to a series of command words, you can also use the NOOPEN arg to also \
disable the standard open command for the exit/item, or use MESSAGE= to change the \
message sent to the room, which can use <S-NAME> for the actor, and <T-NAME> for the item.

PROP_OPENPASSWORD=\
Property   : Prop_OpenPassword\n\r\
Targets    : Exits, Items\n\r\
Parameters : [PASSWORD]/[LANGUAGEID];[PASSWORD]{;[MESSAGE])\n\r\
Example    : open sesame\n\r\
Example    : Orcish;open sesame\n\r\
Example    : ;open sesame;<T-NAME> opens!\n\r\
Description: \n\r\
When applied to a locked container or exit, this property will force \
the affected openable to unlock and open when the magic word specified \
in the parameter is spoken in its presence.  A language and a semicolon \
may be optionally given to require that a particular language is being spoken. \
If a language (or blank) is specified, then an open message may also be specified.

PROP_OUTFITCONTAINER=\
Property   : Prop_OutfitContainer\n\r\
Targets    : Items\n\r\
Parameters : ;[XML TAGS...]\n\r\
Description: \n\r\
When applied to a container, this property will allow the container to remember \
which things were put into it by a player.  Then, whenever the player attempts \
to wear/hold/wield the container, if the container has items/armor/weapons inside, \
the player will actually wear the containing items instead.  The automatic wearing of \
the contained items will automatically remove conflicting items as normal. Later, when the \
remembered items are removed, they will automatically be put back into the container that \
remembers them.

PROP_PARTYSCALER=\
Property   : Prop_PartyScaler\n\r\
Targets    : MOBs, Rooms, Areas\n\r\
Parameters : (BASE=[N]) (HP=+[N]%/MEMBER) (DAMAGE=+[N]%/MEMBER) (ATTACK=+[N]/MEMBER) (LEVEL=AVG+[N]/MAX+[N]) (MIN=[N]) (MAX=[N]) (ADDS="[NAME]/MEMBER-ABOVE-[N]")\n\r\
Example    : BASE=3 HP=+25%/MEMBER DAMAGE=+10%/MEMBER ADDS="catalog:a skeleton guard/MEMBER-ABOVE-3"\n\r\
Example    : LEVEL=AVG+2 MIN=5 MAX=20\n\r\
Description: \n\r\
CoffeeSUD: a fight scaled to the party.  When the mob's fight starts it counts the party: its \
foes' groups in the room, followers too.  For each member over BASE (3), or under it, its hit \
points go up or down HP percent, its damage DAMAGE percent and its attack ATTACK; LEVEL=AVG+N \
or MAX+N makes its level the party's average or highest plus N, within MIN and MAX; ADDS brings \
one add (the catalog's, or a class) for each member over N, following it.  It holds until the \
fight ends, when the adds go.  On a room or an area, each NPC there that fights the party gets \
it for that fight.  CONSIDER says that the mob scales to your party.  It counts builders too, \
so PLAYTEST shows it as a player would see it.

PROP_PEACEMAKER=\
Property   : Prop_PeaceMaker\n\r\
Targets    : Rooms, Areas, MOBs\n\r\
Parameters : optional list of mob statements, room emotes, semicolon delimited\n\r\
Example    : \n\r\
Example    : No Fighting Here!;Make Love, not War!;You should not do that.\n\r\
Description: \n\r\
Cancels any fighting in the room.

PROP_PRACTICEDUMMY=\
Property   : Prop_PracticeDummy\n\r\
Targets    : Mobs\n\r\
Parameters : (KILLABLE)\n\r\
Example    : \n\r\
Example    : KILLABLE\n\r\
Description: \n\r\
Prevents a mob from fighting back.  If the KILLABLE parameter is NOT included, \
the mob will also never run out of hit points or be missed in combat.

PROP_PRESSUREPLATE=\
Property   : Prop_PressurePlate\n\r\
Targets    : Rooms, Items\n\r\
Parameters : (WEIGHT=[TEST]) (COUNT=[TEST]) (MASK="[ZAPPER MASK]") (ON="[ACTIONS]") (OFF="[ACTIONS]") (MSGON="[TEXT]") (MSGOFF="[TEXT]") (DELAY=[TICKS])\n\r\
Example    : WEIGHT=">=50" OFF="cast Spell_Lightning $n" MSGOFF="The pedestal rises with a click!"\n\r\
Example    : COUNT=">=2" ON="door open here north" OFF="door close here north" DELAY=2\n\r\
Description: \n\r\
CoffeeSUD: a pressure plate.  On a room it weighs the mobs there (with all they carry) and the \
items lying there; on a fixture, what is on or in it and who sits on it.  WEIGHT and COUNT (of \
the mobs) are tests: >=120, >50, <=10, <3, =2, or a number (at least).  MASK is what counts.  \
When it goes down ON runs and MSGON shows; when it comes up again OFF runs and MSGOFF shows, \
DELAY ticks later if given (it stays down if pressed again meanwhile).  It looks again when \
someone enters or leaves, things are got, put or dropped, or someone sits or stands on it.  \
Actions are script commands, as in Prop_Switch.  Scripts have ROOMWEIGHT() and \
CONTENTWEIGHT().

PROP_PRIVATEPROPERTY=\
Property   : Prop_PrivateProperty\n\r\
Targets    : Items\n\r\
Parameters : OWNER="[NAME]" (PRICE=[price]) (EXPIRESEC=[SECONDS])\n\r\
Example    : owner="bob" expiresec=60\n\r\
Description: \n\r\
Marks the item as belonging to a particular person or clan. \
Items so marked can only be sold by that person, an associate, or clan member. \
PRICE is the asking price, as a ship or other boardable item marked so gives it. \
EXPIRESEC can be set to make this property temporary, so that an item \
dropped becomes "unowned" once the owner is gone for the number of seconds given.  \
CoffeeSUD: OWNER="@PROFILE" is the whole profile, and every character of the profile counts \
as the owner of what another of them owns.

PROP_QUESTGIVER=\
Property   : Prop_QuestGiver\n\r\
Targets    : Areas, Exits, Items, Mobs, Rooms\n\r\
Parameters : QUEST="[NAME]/GENERATE:([ARGS])" (MESSAGE="[ANNOUNCEMENT]")\n\r\
Parameters : (DETAILS="TRUE/FALSE") (OPTIONAL="TRUE/FALSE") (REOFFER="ALWAYS/ONCE/[GAME TIME]")\n\r\
Parameters : (TRIGGER="GET/ENTER/LEAVE/PUTIN/DEATH/SPEAK/WEAR/WIELD/READ/LOOK")\n\r\
Example    : quest="save_the_day" message="You found a quest item" trigger=GET\n\r\
Description: \n\r\
Makes the item, room, whatever capable of offering a quest to the player who \
triggers it.  The trigger has a default for each object type, but you can \
set it explicitly with the TRIGGER argument.  The quest can be made non-optional \
with the OPTIONAL argument.  The MESSAGE is shown before the quest is offered. \
The quest details will be as well, unless the DETAILS argument is set to false. \
TRIGGER=LOOK offers the quest when the host itself is looked at (on an area, when anyone looks \
at anything in it); a keyword detail looked at through Prop_Details is not a look at the host, \
though it runs the host's LOOK_PROG scripts. \
The quest itself can be specified by name, or you can have one generated by the \
RandomQuests behavior by putting GENERATE: followed by optional quest parameters \
(with no PATH it uses the shipped generator, quests/random/all.xml; the \
arguments are given to a RandomQuests behavior made for the purpose, which \
is already set to MINQUESTS=1 MAXQUESTS=1 INLINE=true MIN=1 MAX=1 CHANCE=100, \
and your arguments follow those). \
The quest must have an accept script (FUNCTION_PROG CAN_ACCEPT and DO_ACCEPT on \
something it loads), and must be running.  On an area, with the ENTER, LEAVE, \
LOOK, SPEAK, READ, DEATH, GET, WEAR, WIELD or PUTIN triggers, each player is \
offered the quest once in each run of the quest; this is kept in the quest \
variable OFFERED:PLAYERNAME (QVAR), which a saved game keeps.  CoffeeSUD: \
REOFFER says how often to offer it, on any target: ALWAYS whenever the trigger \
comes, ONCE in a run of the quest, or a game time (such as 1 MUDDAY) after the \
last offer; without it, an area offers once and the rest whenever their trigger \
comes.  The details show the quest's SET REWARDS as Reward:.  A quest offered, or read on a quest board, is listed by QUESTS OFFERED \
while the player may still take it, and QUESTS ACCEPT takes it on.

PROP_REJUVWHEN=\
Property   : Prop_RejuvWhen\n\r\
Targets    : MOBs, Items\n\r\
Parameters : WHEN="[ZAPPER MASK]" (ELSE=WAIT/NEVER/REPLACE:[NAME])\n\r\
Example    : WHEN="-IF !VAR(* OLDMILL == CLEARED)" ELSE="REPLACE:a settler"\n\r\
Example    : WHEN="-HOUR +20 +21 +22 +23 +0 +1 +2 +3 +4" ELSE=WAIT\n\r\
Description: \n\r\
CoffeeSUD: respawns that follow the story.  When the mob's or item's rejuv would bring it \
back, WHEN is checked first: on the mob, as if back in its start room (its hour, season, \
room text, and -IF/+IF script conditions), or, for an item, on someone in its room.  If it \
fails, ELSE says what happens: WAIT (the default) tries again at the next rejuv, NEVER leaves \
it gone, and REPLACE:name puts the catalog's mob or item (or a class) there instead, for good.

PROP_REQALIGNMENTS=\
Property   : Prop_ReqAlignments\n\r\
Targets    : Rooms, Areas, Exits\n\r\
Parameters : alignment masks listed below\n\r\
Example    : -all +good\n\r\
Description: (DEPRECATED -- See PropReqEntry)\n\r\
Creates alignment restrictions for entering a room.  Followers will be allowed \
unless explicitly disallowed.  Valid parameters include:  \n\r\
nosneak (disallow sneaking past the requirement)\n\r\
-all (disallow all alignments)  \n\r\
nofollow (disallow followers of appropriate alignment)  \n\r\
+evil +good +neutral (create exceptions to -all)  \n\r\
-evil -good -neutral (disallow only listed alignments)  

PROP_REQCAPACITY=\
Property   : Prop_ReqCapacity\n\r\
Targets    : Rooms, Areas, Exits\n\r\
Parameters : PEOPLE=[MAX] PLAYERS=[MAX] MOBS=[MAX] ITEMS=[MAX] WEIGHT=[MAX] INDOOR=[T/F]\n\r\
Parameters : CONTAINERSOK=[T/F] ROOMS=[MAX] SIEGEWEAPONS=[MAX]\n\r\
Example    : people=2\n\r\
Example    : players=3 mobs=2 indoor=true\n\r\
Example    : weight=2000 items=10\n\r\
Description: \n\r\
Creates a capacity limit of one or more types for the room or area with this affect. \
The ITEMS, or WEIGHT parameters may be used to limit the number \
of items, or maximum weight respectively.  The CONTAINERSOK parameter will create an \
exception for putting items in containers (but not for dropping the containers themselves). \
The PEOPLE parameter lets you limit the total \
number of players and/or mobs.  Otherwise, the PLAYERS or MOBS can be used to limit the \
number of players or non-player mobs respectively.  The optional INDOOR flag only matters \
if this property is added to an area; it makes the property only enforce itself on indoor \
rooms types.\n\r\
\n\r\
If no parameters at all are given, a PEOPLE capacity of 2 is assumed.\n\r\
\n\r\
When this property is on an entry room with Prop_LotsForSale or Prop_LotForSale, \
then this property will be automatically propogated to each new room created.  Also, in this \
case, and the optional parameter ROOMS can be specified to limit the maximum number of \
contiguous new rooms that can be generated. 

PROP_REQCLASSES=\
Property   : Prop_ReqClasses\n\r\
Targets    : Rooms, Areas, Exits\n\r\
Parameters : class masks listed below\n\r\
Example    : -all +thief\n\r\
Description: (DEPRECATED -- See PropReqEntry)\n\r\
Creates class restrictions for entering a room.  Followers will be allowed unless \
explicitly disallowed.  Valid parameters include: \n\r\
nosneak (disallow sneaking past the requirement)\n\r\
-all (disallow all classes)  \n\r\
nofollow (disallow followers of appropriate class)  \n\r\
+thief +mage +bard (create exceptions to -all)  \n\r\
-thief -mage -bard (disallow only listed classes)  

PROP_REQENTRY=\
Property   : Prop_ReqEntry\n\r\
Targets    : Rooms, Areas, Exits, Portals\n\r\
Parameters : (nosneak) (nofollow) (actual)  ("message=my message") \n\r\
Parameters : ("event=[block/accuse],(crime)") mask\n\r\
Example    : -race +elf\n\r\
Example    : nosneak -race +elf\n\r\
Example    : "event=accuse,trespassing" "message=^N" -race +elf\n\r\
Example    : "message=Elves Only in there!" nofollow -race +elf\n\r\
Description: \n\r\
Creates restrictions for entering a room.  Followers will be allowed unless \
explicitly disallowed.  Valid parameters include: \n\r\
nosneak (disallow sneaking past the requirement)\n\r\
nofollow (disallow followers)  \n\r\
actual (discount disguises)  \n\r\
"message= ... " (override the default no-entry message. \n\r\
"event= ..." (comma-delim event: default='block', or 'accuse,[crime],..')\n\r\
See AHELP ZAPPERMASK, where allowed can enter, and disallowed is not. 

PROP_REQHEIGHT=\
Property   : Prop_ReqHeight\n\r\
Targets    : Areas, Room, Exit\n\r\
Parameters : a maximum height to enter\n\r\
Example    : 12\n\r\
Description: \n\r\
Creates a maximum height in order to enter a room.  Similar to Prop_Crawlspace.

PROP_REQLEVELS=\
Property   : Prop_ReqLevels\n\r\
Targets    : Room, Areas, Exits\n\r\
Parameters : ==, <=, >=, >, or < followed by a level number ([PARMS])\n\r\
Example    : <=10 >=5\n\r\
Description: \n\r\
Creates level restrictions for entering a room.  Followers will be allowed unless \
the NOFOLLOW parameter appears.  The parameter should describe only the allowed levels. \
Multiple criteria are allowed. The term "NOSNEAK" may be added to the parameter \
to disallow sneaking past your criteria.  The parm MESSAGE="message" may be added \
to change the error message seen.  The term "SYSOP" will require admin privileges. \
The "ALL" flag, for some reason, just lets everyone in.

PROP_REQNOMOB=\
Property   : Prop_ReqNoMOB\n\r\
Targets    : Room, Areas, Exit\n\r\
Parameters : optional nosneak parameter\n\r\
Example    : \n\r\
Example    : nosneak\n\r\
Description: \n\r\
Prevents non-player mobs without followers from entering the room. \
The term "NOSNEAK" may be added to the parameters \
to disallow sneaking past your criteria.

PROP_REQPKILL=\
Property   : Prop_ReqPKill\n\r\
Targets    : Room, Exit, Area\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Allows access only to those players who have their playerkill flag set.

PROP_REQRACES=\
Property   : Prop_ReqRaces\n\r\
Targets    : Rooms, Areas, Exits\n\r\
Parameters : room masks listed below\n\r\
Example    : -all +elf\n\r\
Description: (DEPRECATED -- See PropReqEntry)\n\r\
Creates race restrictions for entering a room.  Followers will be allowed unless \
explicitly disallowed.  Valid parameters include: \n\r\
nosneak (disallow sneaking past the requirement)\n\r\
-all (disallow all races)  \n\r\
nofollow (disallow followers of appropriate race)  \n\r\
+elf +half +human (create exceptions to -all)  \n\r\
-elf -half -human (disallow only listed races)  

PROP_REQSTAT=\
Property   : Prop_ReqStat\n\r\
Targets    : Rooms, Areas, Exits, Portals\n\r\
Parameters : mob character stat expressions as shown in example\n\r\
Example    : strength<10 intelligence==5 wisdom>=3\n\r\
Description: \n\r\
Creates restrictions for entering a room.  Players must pass every \
expression test in order to enter.  Valid parameters include: \n\r\
nosneak (disallow sneaking past the requirement)\n\r\
STRENGTH, INTELLIGENCE, WISDOM, CONSTITUTION, CHARISMA, DEXTERITY, etc..

PROP_REQTATTOO=\
Property   : Prop_ReqTattoo\n\r\
Targets    : Rooms, Areas, Exits, Items\n\r\
Parameters : optional msg; tattoo masks listed below\n\r\
Example    : -all +manlymen\n\r\
Example    : You can't go here!;-all +manlymen\n\r\
Description: \n\r\
Creates tattoo restrictions for entering a roomor possessing an item.  Followers \
will be allowed unless explicitly disallowed.  See the help on Tattoos. \
Understood masks include:\n\r\
nosneak (disallow sneaking past the requirement)\n\r\
nofol (disallow followers of appropriate alignment)  \n\r\
-all (disallow unless has one of the following +tattoos) \n\r\
+all (allow unless has any of the followng -tattoos) \n\r\
+none (must have all +tatoos, and lack all -tattoos) \n\r\
+TATTOONAME (must have tattoo) \n\r\
-TATTOONAME (must not have tattoo)\n\r\
Prefix TATOONAME name with ACCOUNT(space) to use account-based tattoos. 

PROP_REROLLSTATS=\
Property   : Prop_ReRollStats\n\r\
Targets    : MOB\n\r\
Parameters : (BONUSPOINTS=[NUM]) (PICKCLASS=TRUE/FALSE)\n\r\
Example    : \n\r\
Example    : BONUSPOINTS=5 PICKCLASS=TRUE\n\r\
Description: \n\r\
Allows a player a one-time opportunity to redesignate their stats, \
completely from scratch, and potentially re-pick their class.

PROP_RESISTANCE=\
Property   : Prop_Resistance\n\r\
Targets    : MOB\n\r\
Parameters : resistance names followed by percentages\n\r\
Parameters : Parameters may be followed by an optional mask\n\r\
Example    : magic 50% poison -10%\n\r\
Example    : magic poison 50% pierce -10% MASK=-RACE +Dwarf\n\r\
Description: \n\r\
Gives a mob natural resistances and immunities. \
The effects which may be included are: \n\r\
Resistances: gas fire electricity mind magic cold acid water evil (undead) \n\r\
Resistances: justice (as per many thief abilities) \n\r\
Resistances: weapons blunt pierce slash non-magical-weapons non-silver-weapons\n\r\
Resistances:  -- weapons get reduced % damage per round, lvl based, with limits.\n\r\
:          :  -- always modifier makes weapon resists always work, no limits.\n\r\
Resistances: spell chant song prayer thief_skill (ability types) \n\r\
Resistances: enchantment/charm kicking vexing conjuration (ability domains)\n\r\
Immunities : teleport (includes gate, summon) holy disease poison\n\r\
Misc       : debuf-duration (pct is the maximum debuf ticks remain)\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_RESTRICTSKILLS=\
Property   : Prop_RestrictSkills\n\r\
Targets    : Room, Area, MOB, Item\n\r\
Parameters : SKILLS="[ABILITYID,...]" (MESSAGE="[STRING]") (WEARONLY=[T/F])\n\r\
Parameters : (ONLYROOMS="[DOMAIN,...]") (NEVERROOMS="[DOMAIN,...]")\n\r\
Example    : SKILLS="Spell_Sleep,Skill_Recall" MESSAGE="No!" ONLYROOMS="UNDERWATER,AIR"\n\r\
Description: \n\r\
Cancels the effects of the listed spells/skills, and can be restricted by location.  \
The only required parameter is SKILLS, which is a comma-delimited list of Ability IDs. \
Optional parameters includes MESSAGE, to change the skill users error message, ONLYROOMS \
to restrict the skill everywhere except the comma delimited list of DOMAIN strings, and \
NEVERROOMS to restrict the skill only in the comma delimited list of DOMAIN strings.  DOMAINS \
include: CITY, WOODS, ROCKY, PLAINS, UNDERWATER, AIR, WATERSURFACE, JUNGLE, SWAMP, DESERT, \
HILLS, MOUNTAINS, SPACEPORT, SEAPORT, STONE, WOODEN, CAVE, MAGIC, UNDERWATER, AIR, WATERSURFACE, \
METAL.   When this property is on a mob, it only affects the mob.  When on an item, it only affects \
the owner of the item.  If you want to limit spells/skills used AGAINST a mob, look at immunities.

PROP_RESTRICTSPELLS=\
Property   : Prop_RestrictSpells\n\r\
Targets    : Rooms, Areas, Mobs\n\r\
Parameters : [SPELLID];[SPELLID];...\n\r\
Example    : Spell_Sleep;Chant_Uplift;\n\r\
Description: \n\r\
Cancels the effects of the listed spells when cast on or in the room. \n\r\
\n\r\
Spell IDs can optionally include an argument in parenthesis () to restrict \
the spell only when cast against a target of the given name. Spell ids with \
parenthesis arguments may be listed multiple times.  When a spell targets \
a room or area, the name of a Plane of Existence may also be a valid argument.

PROP_RETAINABLE=\
Property   : Prop_Retainable\n\r\
Targets    : Mobs\n\r\
Parameters : The value of the mob to shopkeepers\n\r\
Parameters : Price of the mob per period;number of days per period\n\r\
Parameters : (PERSIST=true)\n\r\
Example    : 100000\n\r\
Example    : 100 persist=true;10\n\r\
Description: \n\r\
This property serves many a purpose: to allow you to set a value to mobs \
when being sold as pets by shopkeepers.  It also allows you to create mobs \
which will be saved in the database when the system is shut down, so long \
as the mob has this property, and the mob is presently on someone's personal \
home, such as a Prop_RoomForSale room.  The second parameter following the \
semicolon, if present, will also make the mob automatically draw money from \
the property owners bank account periodically.  The second parameter refers \
to the number of mud-days between each pay period.  If a pay period passes and \
the mob can not find a bank account of the owners from which to get paid, or \
has not been placed on someone's personal property as described above, the mob \
will quit and disappear.\n\r\
\n\r\
If persist is set to true, then the mob will stop following the player, but \
remain in the game when the player logs out.


PROP_SALVAGEYIELD=\
Property   : Prop_SalvageYield\n\r\
Targets    : Items\n\r\
Parameters : (SKILL=[SKILL ID],...) YIELD="[THING]:[N](@[PCT]%), ..." (XP=[N]) (DESTROY=false)\n\r\
Example    : YIELD="brass:4, iron(clockwork):1@25%, catalog:soul gear@5%" XP=20\n\r\
Description: \n\r\
CoffeeSUD: what taking the item apart gives, in place of the usual.  SKILL is Scrapping when not \
given, or a crafting skill, for its DISMANTLE (* for any).  YIELD is a comma list (in quotes when it \
has spaces): [RESOURCE]:[N] is N \
units of a resource, [RESOURCE]([VARIANT]):[N] the resource as a named variant, and catalog:[ITEM \
NAME]:[N] a catalog item; @[PCT]% after one is the chance of it.  XP is given on success, and \
DESTROY=false leaves the item where it is, with nothing more in it.  With it, Scrapping takes just that \
item, whatever its material, enchanted or not.  It works on a catalog entry too.  Without one, \
[SKILL] DISMANTLE [ITEM] takes apart an item the skill could make, carried or in the room, for \
DISMANTLEPCT (in the ini: 50 when blank, 0 for none) percent of the materials its recipe uses, times \
the crafter's proficiency.

PROP_SAVEPOINT=\
Property   : Prop_SavePoint\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (MSG="[MESSAGE]")\n\r\
Example    : MSG="You rest by the fire and set down your journey."\n\r\
Description: \n\r\
A place where the game can be saved when its save mode is SAVEPOINTS \
(SAVEMODE in coffeemud.ini), as an inn or a campfire.  MSG is shown when \
the game is saved here.  On an area, it covers every room in it.

PROP_RIDEADJUSTER=\
Property   : Prop_RideAdjuster\n\r\
Targets    : Items and Mobs\n\r\
Parameters : see Prop_HaveAdjuster\n\r\
Example    : see Prop_HaveAdjuster\n\r\
Description: \n\r\
Whenever the item or mob having this property is mounted or ridden, the \
statistics of the rider will be adjusted as described in the parameters.  \
Dismounting will remove the effects. See Prop_HaveAdjuster for more information \
on the valid parameters for this property. 

PROP_RIDEENABLER=\
Property   : Prop_RideEnabler\n\r\
Targets    : Items and MOBS\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is being mounted or ridden, the owner \
will be granted the spells, skills listed.  The percentage given is optional, \
and will be the proficiency of the skill.  If a percentage is not given, the \
default is 100%.  \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_RIDERESISTER=\
Property   : Prop_RideResister\n\r\
Targets    : Items and Mobs\n\r\
Parameters : resistance names followed by percentages\n\r\
Parameters : Parameters may be followed by an optional mask\n\r\
Example    : magic 50% poison -10%\n\r\
Example    : magic poison 50% pierce -10% MASK=-RACE +Dwarf\n\r\
Description: \n\r\
Whenever the item having this property is mounted or ridden, the rider gains \
certain resistances and immunities described in the parameters.  When exited, \
the resistances and immunities are also cancelled.  \
The effects which may be included are: \n\r\
Resistances: gas fire electricity mind magic cold acid water evil (undead) \n\r\
Resistances: justice (as per many thief abilities) \n\r\
Resistances: weapons blunt pierce slash non-magical-weapons non-silver-weapons\n\r\
Resistances:  -- weapons get reduced % damage per round, lvl based, with limits.\n\r\
:          :  -- always modifier makes weapon resists always work, no limits.\n\r\
Resistances: spell chant song prayer thief_skill (ability types) \n\r\
Resistances: enchantment/charm kicking vexing conjuration (ability domains)\n\r\
Immunities : teleport (includes gate, summon) holy disease poison\n\r\
Misc       : debuf-duration (pct is the maximum debuf ticks remain)\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_RIDESPELLCAST=\
Property   : Prop_RideSpellCast\n\r\
Targets    : Items and MOBS\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is being mounted or ridden, the owner \
will be under the effect of the listed spells. The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
The flag ONCLOSED can be used to invoke effects only when the container is closed. \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_RIDEZAPPER=\
Property   : Prop_RideZapper\n\r\
Targets    : Items and Mobs\n\r\
Parameters : masking parameters described below, optional zap message\n\r\
Example    : -class +mage -race +elf -evil\n\r\
Example    : MESSAGE="<S-NAME> falls off <O-NAME>!" -class +mage\n\r\
Example    : -class +mage "event=accuse,trespassing" "message=^N"\n\r\
Description: \n\r\
Whenever the rider of the item or mob with this property mounts the \
item, they will be zapped unless it is allowed by the listed parameters.  \n\r\
An optional MESSAGE parameter can define what is seen when the zap occurs. \
Also optionally, the parameters can start with the word ACTUAL to change \
zapping behavior to look at actual values instead of perceived values \
(this about a class check applied to a Charlatan.) \
The optional EVENT parameter is a comma-delimited set of strings, where the \
first is one of ZAP (default) or ACCUSE followed by a comma and the crime \
key from a laws.ini type definition. \
If the parameters include any alignment checks, the item will end up with an appropriate ambiance as well. \
For valid masking parameters, \
see AHELP ZAPPERMASK, where allowed can ride, and disallowed is zapped. 

PROP_ROOMDARK=\
Property   : Prop_RoomDark\n\r\
Targets    : Areas, Room\n\r\
Parameters : (HOURS=[NUM],[NUM],...) (ABSOLUTE=TRUE) (LIGHTMASK="[MASK]") (SEEMASK="[MASK]") (SNUFF=[PCT]) (SNUFFMSG="[TEXT]")\n\r\
Example    : \n\r\
Example    : HOURS=1,4,0\n\r\
Example    : ABSOLUTE=TRUE LIGHTMASK="-TAGS +DAWNLANTERN" SEEMASK="-RACE +Dwarf" SNUFF=30\n\r\
Description: \n\r\
Makes a room dark, so that you need a light to see it. You can specify the hours of \
the day in which the room is made dark using the optional HOURS \
argument.  CoffeeSUD: ABSOLUTE=TRUE makes darkness lights cannot beat: the lights of those \
in the room, and of what lies there, go dark while they are in it, but those that pass \
LIGHTMASK (a mask on the light, as -TAGS +DAWNLANTERN).  SEEMASK is who still sees in it. \
SNUFF is the chance a lit torch goes out as one comes in (SNUFFMSG, @x1 the light).

PROP_ROOMFORSALE=\
Property   : Prop_RoomForSale\n\r\
Targets    : Room\n\r\
Parameters : (RENTAL/GRID/ALLOWTHEFT) [PRICE]\n\r\
Example    : 1000000\n\r\
Example    : Bob/1000000\n\r\
Example    : @PROFILE/0\n\r\
Description: \n\r\
CoffeeSUD: every character of the player's profile owns what another of them owns, and an owner of \
@PROFILE (as @PROFILE/0) is the whole profile, so a world can ship a home that is already the \
player's; it is never lost as an owner who does not exist.  PROFILEPROPERTY=true in the ini records \
what the player buys as @PROFILE.  MPGRANT gives a deed from a script.\n\r\
\n\r\
Makes this room available for purchase by a player.  The room will be \
automatically listed in the stock of any ShopKeeper in the SAME AREA who \
is designated a LandSeller, or any shopkeeper who has the proper StdTitle \
item in its selling inventory.  The system will automatically maintain the \
integrity of any items left in the room, including restoring them on reboot.  \
After a room is sold, the player need only enter "LOOK ID" to see the rooms \
ID for the purposes of identifying his or her lot in the future.  The title received \
for purchasing a room may be GIVEn or SELLed to change possession of the property. \
The word rental followed by a space may \
precede the price to make the price of the property be charged every month \
automatically out of a Bankers account.  Failure to make rent returns the property \
to sellable status.\
The word ALLOWTHEFT disables robbery law enforcement on the property. \
The game itself writes TAX[N]X (the back property taxes owed, as TAX3X) into the \
parameters of a property whose owner has not paid; do not set it by hand. \n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property.\n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_ROOMLIT=\
Property   : Prop_RoomLit\n\r\
Targets    : Areas, Room\n\r\
Parameters : (HOURS=[NUM],[NUM],...)\n\r\
Example    : \n\r\
Example    : HOURS=1,4,0\n\r\
Description: \n\r\
Makes a room lit, even at night.   You can specify the hours of \
the day in which the room is made lit using the optional HOURS \
argument.

PROP_ROOMPLUSFORSALE=\
Property   : Prop_RoomPlusForSale\n\r\
Targets    : Room\n\r\
Parameters : ([OWNER NAME]/)(RENTAL) (GRID) (ALLOWTHEFT) [PRICE]\n\r\
Example    : 1000000\n\r\
Example    : GRID 1000000\n\r\
Example    : The Bob Clan/1000000\n\r\
Example    : The Bob Clan/RENTAL 1000000\n\r\
Description: \n\r\
Makes this room available for purchase by a player.  If you have more than one \
room for sale, they MUST be separated by at least one room which is \
not for sale, otherwise both groups will be considered one.  This property is \
identical to Prop_RoomForSale or Prop_RoomsForSale, except that the building \
skills are permitted to add new rooms to it. See Prop_RoomForSale for more \
information on sold rooms and the flags (including the TAX[N]X the game writes for back taxes).  \n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property.\n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_ROOMREDIRECT=\
Property   : Prop_RoomRedirect\n\r\
Targets    : Areas, Room\n\r\
Parameters : [ROOM ID]=[ZAPPERMASK](;[ROOM ID]=[ZAPPERMAKS] ... )\n\r\
Example    : Midgaard#3001=-name +bob;Midgaard#3005=-name +joe\n\r\
Description: \n\r\
Allows a room or area to redirect players into another room based on \
a zappermask check of them.  Multiple masks and entries may be included, \
and each entry is separated by semicolons.  An entry is a room id followed \
by an equal sign and a zapper mask.  An empty room ID will let the player \
enter the room or area as normally.  A room ID number will check only the \
current area of the host object. This property allows players to be \
redirected based on a mask, but won't fool more programmatic mapping \
systems, such as concierge behavior or tracking skills.  Once active, \
only SYSMSGS can be used to re-enter the based room regardless of \
settings.

PROP_ROOMSFORSALE=\
Property   : Prop_RoomsForSale\n\r\
Targets    : Room\n\r\
Parameters : (RENTAL/GRID/ALLOWTHEFT) [PRICE]\n\r\
Example    : 1000000\n\r\
Example    : The Bob Clan/1000000\n\r\
Description: \n\r\
Makes this room part of a group of rooms available for purchase by a player.  \
The rooms will be sold as a group by the shopkeeper.  If you have more than one \
group of rooms for sale, they MUST be separated by at least one room which is \
not for sale, otherwise both groups will be considered one.  See \
Prop_RoomForSale for more information on sold rooms and the flags.  \n\r\
\n\r\
When property is sold, it will be listed as the owner with a slash and the price.  \
Entering this sort of parameter directly is the quick way to give players or clans property.\n\r\
\n\r\
See also Prop_ReqCapacity for the means to set limits on players building abilities on \
their property.

PROP_ROOMUNMAPPABLE=\
Property   : Prop_RoomUnmappable\n\r\
Targets    : Areas, Room\n\r\
Parameters : (MAPOK) (NOEXPLORE)\n\r\
Example    : \n\r\
Example    : NOEXPLORE\n\r\
Description: \n\r\
Makes a room unable to be mapped with skills, explored, or seen with regional awareness. \
Turning off exploration requires the NOEXPLORE parameter.  MAPOK parameter \
disables the unmappable aspect. 

PROP_ROOMVIEW=\
Property   : Prop_RoomView\n\r\
Targets    : Exits, Rooms, Items\n\r\
Parameters : ((LONGLOOK) (ATTACK);)[Room ID to show, or direction]\n\r\
Example    : Midgaard#3001\n\r\
Example    : LONGLOOK;south\n\r\
Description: \n\r\
Allows players looking at the room or exit to actually SEE the room \
description specified in the parameter.  Useful for high-up views of \
the countryside.  The LONGLOOK parameter makes it so the room is seen \
only on Examine/Longlook.  ATTACK makes it so a single ranges attack \
can target someone in the room (but, not visa-versa).\n\r\
The Room ID "OUT" can be used to allow boardable items, such as castles, \
ships, etc, to view the room in which their item object is in.  \
"DOWNINOUT" can be used by the same boardables to view the rooms below.

PROP_ROOMWATCH=\
Property   : Prop_RoomWatch\n\r\
Targets    : Rooms, Items\n\r\
Parameters : Room IDs of the rooms that may watch here or var defs ; delimited\n\r\
Example    : Midgaard#3001;Midgaard#3002;Midgaard#3012\n\r\
Example    : #3001;prefix=Throw the window you see ;#3012\n\r\
Description: \n\r\
Allows players in one of the listed rooms to see everything going on in \
the host room as if they were there.  They will be unable to interact \
with the things they see (LOOKing at, or similar), but can at least \
witness them.  The parameters are the list of rooms, though you can also \
use prefix=message to define a string to show before the remote messages, and \
can use the shorter #<num> syntax if both rooms/objects are in the same area.

PROP_SURPRISED=\
Property   : Prop_Surprised\n\r\
Targets    : MOBs\n\r\
Parameters : (TICKS=[N])\n\r\
Example    : TICKS=1\n\r\
Description: \n\r\
CoffeeSUD: caught by surprise (Prop_Ambush puts it on): for TICKS rounds the mob can neither \
move, flee, strike, nor cast; it can look about.

PROP_SAFEPET=\
Property   : Prop_SafePet\n\r\
Targets    : MOB\n\r\
Parameters : MSG=[NEW DISPLAY MESSAGE] (LIEGEFOLLOW=[PLAYER NAME])\n\r\
Example    : MSG="<S-NAME> is forbidden to harm <T-NAMESELF>."\n\r\
Example    : LIEGEFOLLOW=Bob\n\r\
Description: \n\r\
Makes the mob with this property completely unattackable.  The default message \
can be changed with parameters.  With LIEGEFOLLOW, a mob that is not following \
anyone takes that player as its liege (if it has none), and follows that player \
into any room that the player is in when the mob arrives there.

PROP_SCRAPEXPLODE=\
Property   : Prop_ScrapExplode\n\r\
Targets    : Items\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Makes an item explode when scrapped (with the Scrapping skill).  The one who scrapped it takes fire damage of \
six times the item's weight, and every other member of their group takes three times its weight, \
and the item is destroyed.  There are no parameters.

PROP_SHORTEFFECTS=\
Property   : Prop_ShortEffects\n\r\
Targets    : MOB, Item, Area, Room, etc\n\r\
Parameters : ([MAX TICKS] (REMOTEOK) (LONGTIMEOK);)([ABILITY MASK])\n\r\
Parameters : (... (OWNER) (WEARER)               ;)([ABILITY MASK])\n\r\
Example    : 3 REMOTEOK;+SKILLFLAG -DANCING -SINGING -PLAYING\n\r\
Description: \n\r\
Makes the mob with this property more resiliant against effects by \
limiting their tick-down time, and preventing effects cast by \
someone not in the same room.  Useful for bosses and elite mobs.  The \
effects can be re-enabled with REMOTEOK or LONGTIMEOK.  An ability mask \
can be given to limit what skills are affected by this property, although \
traps, poisons, and diseases always get a pass from remote effects. If the \
protected thing is an Item, OWNER and WEARER can limit the circumstances of \
protection.

PROP_SMELL=\
Property   : Prop_Smell\n\r\
Targets    : Rooms, Areas, Exits, Items\n\r\
Parameters : (TICKS=[NUM]) (CHANCE=[NUM]) (EMOTE) (BROADCAST) text(;...)\n\r\
Example    : <T-NAME> smells flowery!\n\r\
Example    : <T-NAME> smells awful!;<T-NAME> smells BAD!\n\r\
Example    : CHANCE=50 <T-NAME> smells awful!;CHANCE=10 <T-NAME> smells BAD!\n\r\
Example    : EMOTE BROADCAST <T-NAME> smells awful!\n\r\
Description: \n\r\
Makes the object with this property respond to a SNIFF command.  More than one \
smell may be given, separated by semicolons.  Each smell may have a chance of \
being selected during a sniff using the CHANCE parameter.  ONLY MOBS with this \
property have other options, including an absolute duration before going away \
using the TICKS parameter, the opportunity to emote periodically using the \
EMOTE flag, and the opportunity to emote to adjacent rooms using the BROADCAST \
flag.

PROP_SOCIALS=\
Property   : Prop_Socials\n\r\
Targets    : Areas, Room, Item, Mobs, Exits\n\r\
Parameters : NAME=[SOCIAL NAME] SRCCODE=[CODE] TGTCODE=[CODE] YOUSEE="[MSG]"\n\r\
:          : (TARGET="[TARGET CODE]") (OTHSEE="[MSG]") (TGTSEE="[MSG]")\n\r\
:          : (NOTARGSEE="[MSG]") (MSPFILE=[FILENAME]) (;[MORE SOCIALS]...)\n\r\
Parameters : MASK="[ZAPPER MASK]" ; ...\n\r\
Parameters : WORNONLY=TRUE/FALSE ; ...\n\r\
Parameters : LOAD="[SOCIALS INI FILE PATH]" ; ...\n\r\
Example    : name=USE srccode=V yousee="You use it." ; name=ROP srccode=H ...\n\r\
Example    : load="specialSocials.txt"\n\r\
Description: \n\r\
Creates and defines socials that apply to players in the affected area, room, or \
near the affected exit, or possessing the affected item.\n\r\
\n\r\
The parameters may be a LOAD command for a resource file containing a standard \
socials definition list (see your resources/socials.txt file).  These files \
have a single social definition per line, where each part is separated by \
a tab character.\n\r\
\n\r\
The parameters may also contain a MASK= definition for a zapper mask that will \
determine whether the given invoker player or mob can use the social.  See help \
on ZAPPERMASK for more information on how to use masks.  A WORNONLY variable \
can be set to TRUE or FALSE to determine whether an item with this property \
must be worn in order for the social to be usable.\n\r\
\n\r\
The parameters may also be a semicolon (;) separated list of social definitions \
using the VARIABLE=VALUE format.  The required variables are NAME, SRCCODE, \
TGTCODE, and YOUSEE.  Each variable definition set is separated by semicolons \
to define as many socials as are needed.\n\r\
\n\r\
The allowed variables and valid values are as follows:\n\r\
NAME = the keyword/name of the social -- the command\n\r\
SRCCODE = source letter: W)ords, M) hands, V)isual, S)ound, O) movement\n\r\
TGTCODE = target letter: T)hands, S)ounds, W)ords, V)noisy moves, O) visual\n\r\
TARGET = target: <T-NAME> SELF ALL <I-NAME> <V-NAME> <E-NAME> [ITEM]\n\r\
YOUSEE = What the command invoker sees (<S-NAME>) sees.\n\r\
OTHSEE = What others see the invoker do\n\r\
TGTSEE = What the target (if any) sees\n\r\
NOTARGSEE = What the invoker sees when the target is not present\n\r\
Other spellings are read for the longer ones: SOURCECODE for SRCCODE; OTHCODE, OTHERCODE or TARGETCODE for TGTCODE; \
OTHERSEE or OTHERSSEE for OTHSEE; TARGSEE or TARGETSEE for TGTSEE; NOTARGETSEE or NOTGTSEE for NOTARGSEE.  If no \
TGTCODE is given it is V, and if no SRCCODE it is M.\n\r\
MSPFILE = name of msp sound file in your sounds directory 

PROP_SOUNDER=\
Property   : Prop_Sounder\n\r\
Targets    : Areas, Room, Item, Mobs, Exits\n\r\
Targets    : Room, MOBs, Items, Areas\n\r\
Parameters :([EMOTE TRIGGER] [EMOTE STRING] (MASK=[ZAPPERMASK]);) \n\r\
Example    : enter wiggles his bottom.;sleep smiles evilly. MASK=-NAME +Bob;\n\r\
Example    : wear $p looks good on you.;remove Now you don't look so good.;remove_room $n doesn't look so good.\n\r\
\n\r\
A lightweight alternative to the Emoter and Sounder behaviors, this allows you to create very simple \
emoting triggers based on event triggers instead of pro-active tick triggers, \
such as getting an item, or leaving a room.  Each emote trigger is semicolon (;) \
separated.  A MASK= near the end will filter the cause of the trigger. \
Valid emote triggers include the following:\n\r\
GET - if an item is gotten (or THE item), this will emote to the getter.\n\r\
GET_ROOM - if an item is gotten (or THE item), this will emote to the room (not the getter).\n\r\
DROP - if an item is dropped (or THE item), this will emote to the getter.\n\r\
DROP_ROOM - if an item is dropped (or THE item), this will emote to the room (not the getter).\n\r\
PUSH - if an item is pushed (or THE item), this will emote to the pusher.\n\r\
PUSH_ROOM - if an item is pushed (or THE item), this will emote to the room (not the pusher).\n\r\
PULL - if an item is pulled (or THE item), this will emote to the pulled.\n\r\
PULL_ROOM - if an item is pulled (or THE item), this will emote to the room (not the puller).\n\r\
EAT - if an item is eaten (or THE item), this will emote to the eater.\n\r\
EAT_ROOM - if an item is eaten (or THE item), this will emote to the room (not the getter).\n\r\
MOUNT - if an item is mounted (or THE item), this will emote to the mounter.\n\r\
MOUNT_ROOM - if an item is mounted (or THE item), this will emote to the room (not the getter).\n\r\
DRINK - if an item is drunk (or THE item), this will emote to the drinker.\n\r\
DRINK_ROOM - if an item is drunk (or THE item), this will emote to the room (not the getter).\n\r\
SIT - if an item is sat on (or THE item), this will emote to the sitter.\n\r\
SIT_ROOM - if an item is sat on (or THE item), this will emote to the room (not the getter).\n\r\
SLEEP - if an item is slept on (or THE item), this will emote to the sleeper.\n\r\
SLEEP_ROOM - if an item is slept on (or THE item), this will emote to the room (not the getter).\n\r\
WEAR - if an item is worn (or THE item), this will emote to the wearer.\n\r\
WEAR_ROOM - if an item is worn (or THE item), this will emote to the room (not the getter).\n\r\
OPEN - if an item is opened (or THE item), this will emote to the wearer.\n\r\
OPEN_ROOM - if an item is opened (or THE item), this will emote to the room (not the getter).\n\r\
CLOSE - if an item is closed (or THE item), this will emote to the wearer.\n\r\
CLOSE_ROOM - if an item is closed (or THE item), this will emote to the room (not the getter).\n\r\
HOLD - if an item is held (or THE item), this will emote to the wearer.\n\r\
HOLD_ROOM - if an item is held (or THE item), this will emote to the room (not the getter).\n\r\
WIELD - if an item is wielded (or THE item), this will emote to the wearer.\n\r\
WIELD_ROOM - if an item is wielded (or THE item), this will emote to the room (not the getter).\n\r\
REMOVE - if an item is removed (or THE item), this will emote to the remover.\n\r\
REMOVE_ROOM - if an item is removed (or THE item), this will emote to the room (not the getter).\n\r\
PORTAL_ENTER - if the room is entered, this will emote to the one entering.\n\r\
PORTAL_ENTER_ROOM - if the room is entered, this will emote to the others in the room.\n\r\
PORTAL_EXIT - if the room is left, this will emote to the one leaving.\n\r\
PORTAL_EXIT_ROOM - if the room is left, this will emote to the others in the room.\n\r\
DAMAGE - if the object is hurt, or used to hurt, this will emote to the one hurting.\n\r\
DAMAGE_ROOM - if the object is hurt, or used to hurt, this will emote to the others in the room.\n\r\
FIGHT - if the object is attacking, or used to attack, this will emote to the one attacking.\n\r\
FIGHT_ROOM - if the object is attacking, or used to attack, this will emote to the others in the room.\n\r\
\n\r\
The emote strings may be any text, and the following codes may be included:\n\r\
$p - the name of the item with the behavior.\n\r\
$n - the name of the source of the emote, or the source of the trigger.\n\r\
$e - the he/she of $n.\n\r\
$s - the his/her of $n.

PROP_SPARRINGROOM=\
Property   : Prop_SparringRoom\n\r\
Targets    : Rooms, Areas, Mobs\n\r\
Parameters : (ROOMID)\n\r\
Example    : SparringArea#123\n\r\
Description: \n\r\
Creates a room or area where death is of little consequence.  Players (not \
mobs) who die in this area will lose neither equipment, nor experience, \
but will be brought back to their Start room (not their death room), or \
to any room designated in the parameters.  Players also cannot flee or \
recall.

PROP_SPELLADDER=\
Property   : Prop_SpellAdder\n\r\
Targets    : Mobs, Items, Rooms, Areas\n\r\
Parameters : See Prop_HereSpellCast\n\r\
Parameters : ... (ONCLOSED) ... (MASK=[ZAPPER MASK])\n\r\
Example    : 50%;Spell_Invisible;Prayer_Sanctuary\n\r\
Example    : Spell_Shield;ONCLOSED; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
On a room or area, casts the spells in the parameters on each one who enters, \
and takes them off again when they leave.  On a mob or an item, the spells are \
put on that host itself and last as long as the property does (an item that is \
not carried or worn is still the host).  The list is the one of Prop_HereSpellCast: \
chances, spell names with parameters in parentheses, and the flags NOUNINVOKE, \
LEVEL=[NUMBER], MAXTICKS=[NUMBER] and TICKS=[NUMBER] (these two only shorten the \
time left, never lengthen it).  ONCLOSED, as a word in the list, makes a container \
with the property cast nothing while it is open.  The parameters may end with \
MASK= and a zapper mask, which picks who is affected.

PROP_SPELLREFLECTING=\
Property   : Prop_SpellReflecting\n\r\
Targets    : MOBs, Items\n\r\
Parameters : (MIN=[LEVEL]) (MAX=[LEVEL]) (CHANCE=[%]) (FADE=0/1) (REMAIN=[NUM])\n\r\
Example    : min=1 max=30 chance=100 fade=0 remain=100\n\r\
Example    : max=10 chance=75 fade=1 remain=50\n\r\
Description: \n\r\
This complex property allows the archon to set up mobs or items which, when worn, \
are capable of reflecting spells cast at the mob back to the source.  The min and \
max parms describe the levels of spells which may be reflected.  The chance parm \
describes the % chance of a spell being reflected.  Remain is the number of \
spell levels which may be reflected.  Every time a spell is reflected, the level \
of the spell is subtracted from the remain value.  When remain reaches below 0, the \
item or mob will no longer reflect spells.  Fade describes whether the \
property is persistent or destructive.  If fade is equal to 1 or more, then the \
property is destructive, meaning that the mob will never again gain the fading \
benefit from this property after remain reaches below 0.  If the property was \
on an item, it will be destroyed. If fade is equal to 0, then the property \
is persistent.  The property will still stop working when the remain value \
reaches below 0, but the item will not be destroyed, and will begin to \
regain its strength at a rate of 1 point every 5 minutes or so.

PROP_PROPSETTER=\
Property   : Prop_PropSetter\n\r\
Targets    : All\n\r\
Parameters : TRIGGER=[TRIGTYPE] (BUBBLE=TRUE/FALSE) [STAT="VALUE"]\n\r\
Example    : trigger=get bubble=false ammocapacity=10\n\r\
Example    : trigger=always bubble=false capacity="@x1+${WEIGHT}+5"\n\r\
Description: \n\r\
This property changes the settable fields on  the affected object, or \
an items owner if bubble=true.  The change occurs on the trigger, and \
is undone on an opposing event, if the trigger has one.  The supported \
triggers are: ALWAYS, ENTER, BEING_HIT, WEAR_WIELD, GET, USE, PUT ,\
MOUNT, DROP_PUTIN, HITTING_WITH.  The stats you can discover by using \
LIST STATS [CLASSNAME].  \n\r\
"VALUE"s can be anything, including math formulas based on the previous \
numeric value by including the @x1 variable, or by referencing some other \
stat using ${OTHERSTAT} syntax inside the value.\n\r\
Now the warnings: Most fields can be temporarily and conditionally \
adjusted safely using the various Prop_*Adjuster properties.  This \
property makes permanent savable changes, similar to MPGSET in a script. \
It *might* also be able to safely undo a change, making it seem temporary, but \
its best to use this as a last resort, and to test it first.


PROP_STATADJUSTER=\
Property   : Prop_StatAdjuster\n\r\
Targets    : MOB\n\r\
Parameters : (STR=#) (INT=#) (DEX=#) (CHA=#) (CON=#) (WIS=#)\n\r\
Parameters : (ADJMAX=TRUE/FALSE)\n\r\
Example    : \n\r\
Example    : CON=1\n\r\
Example    : STR=3 INT=5 DEX=2 CON=-3 CHA=-2 WIS=-1\n\r\
Description: \n\r\
This property adjusts a mobs basic stats up or down.  Normally, \
these stats won't go above the mobs max stats.  However, if ADJMAX \
is set to true, the max stat will also be adjusted.

PROP_STATTRAINER=\
Property   : Prop_StatTrainer\n\r\
Targets    : MOB\n\r\
Parameters : (STR=#) (INT=#) (DEX=#) (CHA=#) (CON=#) (WIS=#)\n\r\
Parameters : (BASEVALUE=#) (NOTEACH)\n\r\
Example    : \n\r\
Example    : BASEVALUE=10 CON=10\n\r\
Example    : STR=30 INT=15 DEX=20 CON=0 CHA=0 WIS=0 NOTEACH\n\r\
Description: \n\r\
This property changes a mobs basic 6 stats.  With no parameter, it will set all \
stats to 25 (or the base value), making the mob a suitable trainer.  Other parameters may be entered \
in order to set the stats of the mob to the specified values.  Any values not \
given will default to 25 (or the base value).  If you do not want the mob to also be a trainer, you \
may include the NOTEACH flag. Use BASEVALUE to change the base value from 25 to something else.  A \
BASEVALUE of -1 will prevent any alteration of that stat.

PROP_STAYABOARD=\
Property   : Prop_StayAboard\n\r\
Targets    : MOB, ITEM\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Put this property on mobs or items that you want to be perpetually mounted on whatever \
it is initially mounted on/to.  This is especially useful for Patrollers in chaotic \
environments where a gust of wind or a nasty current may throw things out of whack.

PROP_SUMMONED=\
Property   : Prop_Summoned\n\r\
Targets    : MOBs\n\r\
Parameters : ID=[ABILITY ID] TICKS=[N] [FLAGS]\n\r\
Example    : ID=CallThePack TICKS=20 FOLLOW ASSIST DISMISSONEXPIRE\n\r\
Description: \n\r\
CoffeeSUD: put on a mob a generic ability's SUMMON brought (AHELP GENABILITY); it is not given by hand.  \
With BIND the mob departs when its summoner dies or leaves the game; TICKS counts down to its departure \
and is kept in a save; NOSAVE keeps it out of saves.  Its summoner is the caster, or after a restore the \
mob it follows.

PROP_SWITCH=\
Property   : Prop_Switch\n\r\
Targets    : Items, Exits\n\r\
Parameters : (VERBS="[VERB],[VERB]") (STATES="[STATE],[STATE]"/[N]-[N]) (START=[STATE]) (DESC_[STATE]="[TEXT]") (MSG_[STATE]="[TEXT]") (ACTION_[STATE]="[ACTIONS]") (RESET=[TICKS]) (REQUIRES="[ZAPPER MASK]") (REQMSG="[TEXT]") (ONCE=true)\n\r\
Example    : STATES="down,up" DESC_up="The lever is up." ACTION_up="door open Gate#3 east" ACTION_down="door close Gate#3 east" RESET=20\n\r\
Example    : VERBS=turn STATES=1-8 ACTION_5="signal WORLD vault dial5"\n\r\
Description: \n\r\
CoffeeSUD: a lever, button, crank or dial that keeps its state.  One of VERBS (pull, push, \
turn, press, flip), with the thing's name, moves it to its next state, before the game's own \
command of that name; "TURN DIAL TO 3" to that state; ACTIVATE and DEACTIVATE to the second \
state and the first.  STATES are words or a range of numbers (a dial); START the first.  \
DESC_[STATE] is added to LOOK; MSG_[STATE] is what the room sees (<S-NAME> who, <T-NAME> \
it); ACTION_[STATE] runs script commands, a semicolon between them and MP left off if you \
like (door open Gate#3 east; signal WORLD gate1 up; unhide 'a narrow stair'), for the thing, \
$n who moved it.  RESET goes back to START after that many ticks, running its action.  \
REQUIRES (or MASK) is who may move it, REQMSG what the others are told; ONCE moves it once.  \
SWITCH_PROG [STATE] runs on its scripts and its room's, and SWITCHSTATE() reads it.  The \
state is kept in the property's text (STATE=), so saves and world files keep it.

PROP_TATTOO=\
Property   : Prop_Tattoo\n\r\
Targets    : MOB\n\r\
Parameters : tattoo names delimited by semicolons\n\r\
Example    : ;UNDEADKILLER;MANLYMEN;\n\r\
Description: \n\r\
This property WAS used to give MOBs tattoos.  It is deprecated now. \
They are now stored on MOB objects.  See Help TATTOO.\n\r\
Prefix the tattoo name with ACCOUNT(space) to use account-based tattoos.

PROP_TATTOOADDER=\
Property   : Prop_TattooAdder\n\r\
Targets    : MOBs, Items, Exits, Rooms, \n\r\
Targets    : Areas, Weapons, Food, Drink, Armor\n\r\
Parameters : tattoo name to grant or remove\n\r\
Example    : MANLYMEN\n\r\
Example    : -MANLYMEN\n\r\
Example    : +-MANLYMEN\n\r\
Example    : +~MANLYMEN\n\r\
Example    : +-~MANLYMEN\n\r\
Example    : +34 MANLYMEN\n\r\
Description: \n\r\
This property is used to give MOBs tattoos based on an action taken.  The tattoo is \
given by the object with this property, based on an action which depends on the type of \
object with this property.  Tattoos are arbitrary strings, without spaces, that can be \
checked for as flags by scripts, masks, and other properties.  There are only two types \
of 'special' tattoos: those starting with RACE_ and those starting with CHARCLASS_, which \
are used to grant access to otherwise inaccessible races or classes for char creation \
(e.g. RACE_FIREMEPHIT), assuming all other rules allow.\n\r\
The tattoo parameter is prefixed with - to remove it when the trigger occurs. \n\r\
The tattoo parameter is prefixed with + (or nothing) to add it when the trigger occurs. \n\r\
The tattoo parameter is prefixed with +- to add or remove it when the trigger occurs. \n\r\
The tattoo parameter (after any +- marks) is prefixed with ~ to disable emoting.\n\r\
The tattoo parameter is prefixed (after +- or ~) with a number to make it decay.\n\r\
The tattoo name is prefixed with ACCOUNT(space) to use account-based tattoos.\n\r\
The actions which trigger the tattoo include:\n\r\
MOB - death \n\r\
Item - get \n\r\
Exit - enter \n\r\
Room - enter \n\r\
Area - enter \n\r\
Weapon - use in battle \n\r\
Food - eat \n\r\
Drink - drink \n\r\
Armor - wear

PROP_TELEGRAPH=\
Property   : Prop_Telegraph\n\r\
Targets    : MOBs\n\r\
Parameters : (NAME=[NAME]) (TICKS=[N]) (WARNING="[TEXT]") (INTERRUPT=STUN,DAMAGE>[N]%,MOVE) (AVOID=LEAVE,HIDE,COMMAND:[WORD]) (INTERRUPTMSG="[TEXT]") (RESPOND="[WORD]=SPARE/INTERRUPT/[COMMAND]|...") (THEN=[FUNCTION]) (ABILITY=[ID] TARGET=[NAME])\n\r\
Example    : TICKS=2 WARNING="<S-NAME> rears back!" INTERRUPT=STUN,DAMAGE>20% AVOID=COMMAND:brace\n\r\
Description: \n\r\
CoffeeSUD: a mob winding up an attack.  Scripts put it on with MPTELEGRAPH (AHELP \
BEHAVIOR_SCRIPTABLE), and a generic ability with a WINDUP does when a monster uses it.  \
WARNING shows at the start and each tick, and LOOK at the mob tells that it is gathering \
power.  A stun, sleep, hold or binding always interrupts it; INTERRUPT adds DAMAGE>N% (that \
share of its hit points taken meanwhile) and MOVE (it leaves the room); INTERRUPTMSG is what \
the room sees.  AVOID: those who leave the room are never hit; HIDE spares those hidden, and \
COMMAND:word those who type the word (brace, duck...).  RESPOND gives words to type while it \
winds up, each with an outcome: SPARE (not hit), INTERRUPT (stops it at once), or a script \
command run on them instead of the blow; only a foe's first word counts.  THEN names the mob's \
FUNCTION_PROG run once the blow lands (not after an interrupt), to chain the next wind-up.  \
Its ticks left, damage taken and who avoided or answered it are kept in a save.  \
A generic ability's WINDUP field (ticks; \
MODIFY ABILITY, or WINDUP= in its XML) and WINDUPMSG (the warning, <T-NAME> its target) make \
a monster wind it up first and use it on its target when the time is up.

PROP_TICKETTAKER=\
Property   : Prop_TicketTaker\n\r\
Targets    : Mobs, Items\n\r\
Parameters : [Cost of boarding]/[Name of ticket item]\n\r\
Example    : 100\n\r\
Example    : a red ticket\n\r\
Description: \n\r\
This property makes a mob or item the master of a carriage, horse, ship, or other \
rideable item.  They will require the payment specified in the \
parameters before allowing anyone else to board.  Non-player mobs will \
always be allowed to board.  The ticket taker must be riding either \
the carriage, or riding a horse pulling it, or actually BE the carriage, or \
either be just outside or just inside the ship or caravan type boardable.\
\n\r\
CoffeeSUD: also accepts FARE=[price] PARTY=LEADER|EACH PETS=[price per pet] CARGO=[price per 100 lbs]. LEADER charges once for the nearby party and admits its companions on the same payment. Disembarking clears the receipt. EACH preserves individual payment. The original numeric and named-ticket formats still work: with a ticket item's name as the parameter, a boarder who does not hold that ticket is refused, and the ticket is taken.

PROP_TRAINER=\
Property   : Prop_Trainer\n\r\
Targets    : MOB\n\r\
Parameters : (STR=#) (INT=#) (DEX=#) (CHA=#) (CON=#) (WIS=#) (NOTEACH)\n\r\
Parameters : ((ALL) [CLASSNAME]) (EXPERTISENAMES) (SKILLS)\n\r\
Example    : \n\r\
Example    : CON=10\n\r\
Example    : STR=30 INT=15 DEX=20 CON=0 CHA=0 WIS=0 NOTEACH\n\r\
Example    : all Fighter all Cleric\n\r\
Description: \n\r\
This property makes a mob a suitable target for the TRAIN command for players. \
With no parameter, it will set all stats to 25, give them 0 levels in all \
classes, and give them all expertises.  Other parameters may be entered \
in order to set the stats of the mob to the specified values.  Any values not \
given will default to 25.  If you do not want the mob to also be a trainer, you \
may include the NOTEACH flag.  Listing one or more class names will make that \
trainer have 0 levels in those classes (able to train to it).  Not listing any \
will give the mob ALL classes at level 0.  Listing expertise IDs works similarly.\n\r\
CoffeeSUD: the teacher's rules, in any order among the rest: STUDENTMASK="[ZAPPER MASK]" (whom it teaches at all; REFUSEMSG="[TEXT]" is what it says to others), SKILLMASK.[ABILITY ID]="[ZAPPER MASK]" (whom it teaches that skill), PRICE="[N] per level" or PRICE=[N] (money it takes for each lesson, on top of the usual cost) and HIDDEN=[ID],[ID] (skills it teaches but leaves off TEACHLIST).  They gate TEACH ME, GAIN, PRACTICE and TRAIN with it, and TRAIN with no trainer named passes over one who refuses.  TEACHLIST shows a student what this teacher offers them.

PROP_TRANSFORM=\
Property   : Prop_Transform\n\r\
Targets    : Items, MOBs\n\r\
Parameters : (AFTER=[TICKS]/DAYS=[GAME DAYS]/WHEN=NIGHT/DAY/DAWN/DUSK/FULLMOON/[SEASON]/"[ZAPPER MASK]") (START=GET/DROP/WEAR/ALWAYS) (RESET=true) (ONLYIN=ROOM/CONTAINER/CARRIED) INTO="[ITEM]"/MOB="[MOB]"/SET="NAME=.. DISPLAY=.. DESC=.. PROPS=.." (REVERT=true) (KEEP=FOLLOW,STATE,TAGS,USES,CONTAINER,WORN) (MSG="[TEXT]")\n\r\
Example    : DAYS=3 START=GET ONLYIN=CARRIED MOB="a wyrmling" KEEP=FOLLOW MSG="$p cracks open!"\n\r\
Example    : WHEN=NIGHT REVERT=true MOB="a stone gargoyle" MSG="$p stirs and spreads its wings!"\n\r\
Description: \n\r\
CoffeeSUD: a thing that changes form.  The time: AFTER ticks or DAYS game days (what is left is \
kept with it), counted once START holds (GET: carried, DROP: lying in a room, WEAR: worn; \
ALWAYS by default) and while ONLYIN does; RESET starts again when START no longer holds.  Or \
WHEN: a time of day, FULLMOON, a season, or a zapper mask tested on its room.  It becomes: \
INTO, an item (from the catalog, or a class) in its place, MOB, a mob there (KEEP=FOLLOW: \
following the one who carried it), or SET, changed in place (PROPS adds properties).  KEEP \
is also MPTRANSFORM's (STATE, TAGS, USES, CONTAINER, WORN).  With WHEN, REVERT=true changes it \
back when WHEN ends.  MSG is shown ($p is what it became).  What it becomes may have a \
Prop_Transform of its own.

PROP_TRANSPORTER=\
Property   : Prop_Transporter\n\r\
Targets    : MOBs, Items, Exits, Rooms, Areas, Weapons, Food, Drink, Armor\n\r\
Parameters : Room ID (; (SENDENTER=[TRUE/FALSE]))\n\r\
Example    : Midgaard#3001\n\r\
Example    : Midgaard#3001;sendenter=true\n\r\
Description: \n\r\
This property is used to transport mobs to a particular place based on an action taken.  \
The actions which trigger the transport include:\n\r\
Rideable - mount \n\r\
MOB - speak \n\r\
Item - get \n\r\
Exit - enter \n\r\
Room - enter \n\r\
Area - enter \n\r\
Weapon - use in battle \n\r\
Food - eat \n\r\
Drink - drink \n\r\
Armor - wear \n\r\
 \n\r\
Normally, this skill bypasses any normal notifications, but behaves as if the transported \
mob is "just there".  Add a semicolon and set "sendenter" to true for scripts to see the \
movement.

PROP_TRASHCAN=\
Property   : Prop_Trashcan\n\r\
Targets    : Room, Container Item\n\r\
Parameters : (DELAY=[#TICKS])\n\r\
Example    : \n\r\
Example    : DELAY=4\n\r\
Description: \n\r\
Causes all items dropped, or placed in the host container to be  \
destroyed and to cease to exist.  If a delay parameter is used, the destruction of \
the items in the can will not occur until that time has passed.

PROP_UNCAMPABLE=\
Property   : Prop_Uncampable\n\r\
Targets    : Items, Rooms, Mobs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
If this mob, room, or item is otherwise rejuvenating, this property will prevent the \
rejuvenation from actually occurring if PCs are in the same room as the rejuvenation, \
but an admin is not present.

PROP_UNDROPPABLE=\
Property   : Prop_Undroppable\n\r\
Targets    : Items\n\r\
Parameters : (MESSAGE="[message]") (AMBIANCE="[ambiance]") (LOSTOFF=[T/F])\n\r\
Example    : message="You can't drop that."\n\r\
Description: \n\r\
Makes the mob or item unable to be dropped.  The message shown and whether \
the item has an ambiance can also be set, and whether this property is automatically \
removed when the item is lost to another owner.

PROP_UNSELLABLE=\
Property   : Prop_Unsellable\n\r\
Targets    : Items, Mobs\n\r\
Parameters : (MESSAGE="[message]") (AMBIANCE="[ambiance]") (DROPOFF=[T/F])\n\r\
Example    : message="You can't sell that."\n\r\
Description: \n\r\
Makes the mob or item unable to be sold to a shopkeeper.  The message shown and whether \
the item has an ambiance can also be set, and whether this property is automatically \
removed when the item is dropped.

PROP_UPGRADEPATH=\
Property   : Prop_UpgradePath\n\r\
Targets    : Items\n\r\
Parameters : TO=catalog:[ITEM]/ADJ="dam+[N] att+[N] arm+[N]" (COST=[GOLD]) (MATERIALS="[NAME] x[N]") (LEVEL=[N]) (KEEP=[KEEPS]) (MSG="[TEXT]")\n\r\
Example    : TO="catalog:Starfall, the reforged blade" COST=2000 MATERIALS="starmetal ingot x3"\n\r\
Description: \n\r\
CoffeeSUD: an item's own way up, for any ItemUpgrader (a smith, a workbench): its row, without \
FROM.  See BEHAVIOR_ITEMUPGRADER.

PROP_USEADJUSTER=\
Property   : Prop_UseAdjuster\n\r\
Targets    : Items\n\r\
Parameters : statistic names followed by a +, -, or = and a value\n\r\
Parameters : (reversed)\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : move+100 class=thief race=elf gender=F\n\r\
Example    : dex-1 reversed MASK=-Race +Dwarf\n\r\
Description: \n\r\
When the item with this property is used in a particular way, the listed effects will be \
permanently given to the owner.   For items, trigger use includes:\n\r\
Food, Drink: EAT/DRINK\n\r\
Weapon: Doing damage with (can be reversed)\n\r\
Container: Putting something into\n\r\
Armor: Taking damage while wearing properly\n\r\
The REVERSED parameter is special, and means that instead of the effect going to \
the owner of the item, it goes to the other party in a trigger, such as to the \
target instead of the owner when a weapon does damage, or to the attacker instead \
of the owner when taking damage with an armor.\n\r\
All parameters use the + or - adjuster, except the \
class, race, gender, ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts, and ablelvls parameters. \
Valid parameters are as follows: \n\r\
strength dexterity constitution charisma wisdom intelligence \n\r\
maxstr maxdex maxcon maxcha maxwis maxint (maximum trainable) \n\r\
savepar savefir savecol savewat savegas savemin savegen savejus \n\r\
saveaci saveele savepoi saveund savemag savedis savetra allsaves (every saving throw at once), \n\r\
ability (magical level), armor, attacks (prowess), damage (max), \
disposition (see AHELP ADJDISPOSITION), level, rejuv(!NO!), \
senses (see AHELP ADJSENSES), speed (#attacks), \
height, weight, ambiance+``,gender, class, race, hitpoints, hunger (stomach size), \
mana, movement, thirst (stomach size) conversion weightadj saveblunt \
savepierce saveslash savespells saveprayers savesongs savechants \
critpctweapons critpctmagic critdmgweapons critdmgmagic faith deity \
rejuvrate xpadjpct. Ableprofs, ableticks, ablehpcosts, ablemncosts, ablemvcosts and \
ablelvls is a commma-delimited list of ablityids followed by a number \
in parenthesis to adjust proficiency, duration, mana, movement or hit point costs, or casting level by.\n\r\
\n\r\
By default, the values + or - are added to the existing values.  However, if \
MULTIPLYPH=true is included in the parameters, then attack, armor, damage, \
weight and height will instead have their values multiplied by the given value / 100, \
and speed by the given value itself (SPEED+1.5 is one and a half times). Likewise, \
if MULTIPLYCH=true is included, then hitpoints, mana, and movement are similarly \
multiplied instead of added.  All other values act the same.\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_USEEMOTER=\
Property   : Prop_UseEmoter\n\r\
Targets    : Item\n\r\
Parameters : Flags, pct chance, emote strings, ';' separated.\n\r\
Example    : chance=25;wiggles his bottom.;smiles evilly.;burps!\n\r\
Example    : smell chance=25 ;smells horrible!;is really stinky!\n\r\
Example    : chance=100 inroom="Here#1,Here#2";looks horrible!;is bad!\n\r\
Example    : broadcast sound chance=25;grumbles!;eeeks!\n\r\
Example    : chance=25;sound grumbles!;visual leers broadly.;social smile\n\r\
Description: \n\r\
This property defines a serious of emotes, one of which is triggered when \
an item is used, such as armor worn, weapon wielded, container filled, \
drinkable filled.  All emote strings are separated \
by the semicolons shown above.  The first parameter can be empty for defaults,\
the percent chance of occurrence after the event occurs, \
a list of rooms where the emoter MUST be for the emoter to work (inroom=...), \
a mask="..." zapper mask to filter who can trigger the emoter, \
a tag to make the emote sound based (sound), a tag to make the \
emote smell based (smell), smoking (puff), a tag to make the emote broadcast to adjacent \
rooms (broadcast), or a tag to make the message private to the actor (private).\n\r\
You can also mix and match the types of emotes by putting the keywords SIGHT, \
SMELL, NOISE, PUFF, and SOCIAL as the first word in each emote string.  This denotes \
the type of emote for the rest of the string.  The last example shows how to \
enter a mixed emote.\n\r\
If an emote begins with MASK= then the remaining is a zappermask for the mob \
who is causing the emote.  The words AROMA (or SMELL), SIGHT (or VISUAL) and SOUND \
(or NOISE) are also read as types, and NOPRIVATE and NOBROADCAST turn PRIVATE and \
BROADCAST back off for the emotes that follow.

PROP_USEEMOTER2=\
Property   : Prop_UseEmoter2\n\r\
Targets    : Item\n\r\
Parameters : Flags, pct chance, emote strings, ';' separated.\n\r\
Example    : See Prop_UseEmoter\n\r\
Description: \n\r\
This property defines a serious of emotes, one of which is triggered when \
an item is used, such as item gotten, food ate or drank, or liquid poured. \
 All emote strings are separated \
by the semicolons shown above.  The first parameter can be empty for defaults,\
the percent chance of occurrence after the event occurs, \
a list of rooms where the emoter MUST be for the emoter to work (inroom=...), \
a mask="..." zapper mask to filter who can trigger the emoter, \
a tag to make the emote sound based (sound), a tag to make the \
emote smell based (smell), a tag to make the emote broadcast to adjacent \
rooms (broadcast), or a tag to make the message private to the actor (private). \n\r\
You can also mix and match the types of emotes by putting the keywords SIGHT, \
SMELL, NOISE, and SOCIAL as the first word in each emote string.  This denotes \
the type of emote for the rest of the string.  The last example shows how to \
enter a mixed emote.  

PROP_USESPELLCAST=\
Property   : Prop_UseSpellCast\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis.\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
When the item with this property is worn or wielded, filled or has \
something placed in it, the owner will be affected by the listed spells. \n\r\
\n\r\
The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_USESPELLCAST2=\
Property   : Prop_UseSpellCast2\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis.\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
When the item with this property is touched, or in the case of food and \
drink, eaten or drank, the owner will be affected by the listed spells.  \n\r\
\n\r\
The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.

PROP_WEAKBRIDGE=\
Property   : Prop_WeakBridge\n\r\
Targets    : Rooms, Exits\n\r\
Parameters : max=[WEIGHT] chance=[%] down=[# TICKS]\n\r\
Example    : max=400 chance=75 down=300\n\r\
Description: \n\r\
Whenever a player enters or exits the room or exit with this property, \
that player is in great danger.  If their total weight exceeds the \
weight specified by the max parameter, there is a % chance equals to the \
chance parameter that the bridge beneath them will break.  If the property \
is on an exit, that means instant death for the player.  If the property \
is on an InTheAir type room with a place to fall beneath it, they will \
fall.  If the property is on any other kind of room, instant death will \
result.  The down property describes how many ticks the bridge will remain \
"down" once it has been broken by a heavy player.  Flying can always \
overcome this property.

PROP_WEAPONIMMUNITY=\
Property   : Prop_WeaponImmunity\n\r\
Targets    : Items, Mobs\n\r\
Parameters : List of immunities\n\r\
Example    : +ALL -SILVER -CLOTH -LEATHER\n\r\
Example    : +ALL -MAGIC -SLASHING -FROSTING\n\r\
Example    : +ALL -LEVEL15\n\r\
Example    : +BASHING +IRON +STEEL +MAGIC\n\r\
Example    : +ALL +MAGICSKILLS +AXE +THROWN +DAGGER\n\r\
Description: \n\r\
Whenever the item with this property is worn, or for the mob with \
this property, they will attain damage immunities to the types and/or \
materials of weapons specified.  Here are the parameters: \n\r\
+ALL - Specifies that, by default, the mob is immune to ALL damage.\n\r\
-DAMAGETYPE- Creates an exception to the +ALL rule by permitting damage \
of the given type.  Examples for DAMAGETYPE would be -PIERCING, -GASSING, \
-SLASHING, -BURNING, -MELTING, -NATURAL, -BASHING, etc.\n\r\
+DAMAGETYPE- Can be used instead of +ALL to create an immunity to the given \
damage type.  Examples for DAMAGETYPE would be +PIERCING, +GASSING, \
-WEAPONCLASS- Creates an exception to the +ALL rule by permitting damage \
of the given type.  Examples for WEAPONCLASS would be -AXE, -BLUNT, -EDGED, \
-FLAILED, -HAMMER, -KARATE, -POLEARM, -RANGED, -SWORD, -DAGGER, \
-STAFF, -THROWN, etc.\n\r\
+WEAPONCLASS- Can be used instead of +ALL to create an immunity to the given \
of the given type.  Examples for WEAPONCLASS would be +AXE, +BLUNT, +EDGED, \
+FLAILED, +HAMMER, +KARATE, +POLEARM, +RANGED, +SWORD, +DAGGER, \
+STAFF, +THROWN, etc.\n\r\
-MAGIC - Creates an exception to the +ALL rule by permitting damage from \
magical spells and magical weapons.\n\r\
+MAGIC - If +ALL is not used, this will create an immunity to magical \
spells and weapons.\n\r\
-MAGICSKILLS - Creates an exception to the +ALL rule by permitting damage from \
magical spells, chants, songs, or prayers.\n\r\
+MAGICSKILLS - If +ALL is not used, this will create an immunity to magical \
spells, chants, songs, and prayers.  MAGICSPELLS is read the same as MAGICSKILLS, \
and for spells and the like +MAGIC counts too.\n\r\
-NONMAGIC - Creates an exception to the +ALL rule by permitting damage from \
weapons that are not magical.\n\r\
+NONMAGIC - If +ALL is not used, this will create an immunity to weapons that are \
not magical (those with no magical bonus).\n\r\
-LEVELX - Creates an exception to the +ALL rule by permitting damage from \
weapons whose level is X or better. Example: -LEVEL1, -LEVEL5, -LEVEL10, etc.\n\r\
+LEVELX - Can be used instead of +ALL to create an immunity to \
weapons whose level is X or lower. Example: +LEVEL1, +LEVEL5, +LEVEL10, etc.\n\r\
-MATERIALTYPE - Creates an exception to the +ALL rule above by permitting \
damage from a weapon made of the given MATERIALTYPE.  Where MATERIALTYPE \
may be any valid material, such as SILVER, WOOD, COTTON, etc.  As for the \
damage types above, +MATERIALTYPE may be used instead of +ALL to create \
an immunity to a given material.\n\r\
-PARALYSIS - Creates an exception to the +All rule by permitting damage from paralysis spells.\n\r\
+PARALYSIS - If +All is not used, this creates an immunity to damage from paralysis spells.\n\r\
-FIRE - Creates an exception to the +All rule by permitting damage from fire spells.\n\r\
+FIRE - If +All is not used, this creates an immunity to damage from fire spells.\n\r\
-COLD - Creates an exception to the +All rule by permitting damage from cold spells.\n\r\
+COLD - If +All is not used, this creates an immunity to damage from cold spells.\n\r\
-WATER - Creates an exception to the +All rule by permitting damage from water spells.\n\r\
+WATER - If +All is not used, this creates an immunity to damage from water spells.\n\r\
-GAS - Creates an exception to the +All rule by permitting damage from gas spells.\n\r\
+GAS - If +All is not used, this creates an immunity to damage from gas spells.\n\r\
-MIND - Creates an exception to the +All rule by permitting damage from mind spells.\n\r\
+MIND - If +All is not used, this creates an immunity to damage from mind spells.\n\r\
-JUSTICE - Creates an exception to the +All rule by permitting damage from justice spells.\n\r\
+JUSTICE - If +All is not used, this creates an immunity to damage from justice spells.\n\r\
-ACID - Creates an exception to the +All rule by permitting damage from acid spells.\n\r\
+ACID - If +All is not used, this creates an immunity to damage from acid spells.\n\r\
-ELECTRICITY - Creates an exception to the +All rule by permitting damage from electric spells.\n\r\
+ELECTRICITY - If +All is not used, this creates an immunity to damage from electric spells.\n\r\
-POISON - Creates an exception to the +All rule by permitting damage from poison spells.\n\r\
+POISON - If +All is not used, this creates an immunity to damage from poison spells.\n\r\
-UNDEAD - Creates an exception to the +All rule by permitting damage from undead spells.\n\r\
+UNDEAD - If +All is not used, this creates an immunity to damage from undead/evil spells.\n\r\
-DISEASE - Creates an exception to the +All rule by permitting damage from disease spells.\n\r\
+DISEASE - If +All is not used, this creates an immunity to damage from disease spells.\n\r\
-TRAPS - Creates an exception to the +All rule by permitting damage from traps spells.\n\r\
+TRAPS - If +All is not used, this creates an immunity to damage from traps spells.\n\r

PROP_WEARADJUSTER=\
Property   : Prop_WearAdjuster\n\r\
Targets    : Items (armor and weapons principally)\n\r\
Parameters : see Prop_HaveAdjuster, and may include optional LAYERED flag\n\r\
Example    : str+2 dex-2 class=thief race=elf allset=aname-3\n\r\
Example    : str+2 dex-2 move+100 LAYERED MASK=-Race +Dwarf\n\r\
Description: \n\r\
Whenever the item having this property is wielded or worn, the statistics of \
the owner will be adjusted as described in the parameters.  Removing the \
item will remove the effects.  The Layered flag may be used to prevent \
bonus or penalty stacking due to multiple items worn on the same location. \
See Prop_HaveAdjuster for more information on the valid parameters for this property.  

PROP_WEARENABLER=\
Property   : Prop_WearEnabler\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis.\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Parameters : The above parameters may include optional LAYERED flag\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : Spell_MageArmor;LAYERED;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is worn, wielded, or held, the owner \
will be granted the spells, skills listed.  The percentage given is optional, \
and will be the proficiency of the skill.  If a percentage is not given, the \
default is 100%.  The layered flag means that, among layers of armor, only \
the top layer will grant its effect.\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax. \
ALLSET="set-name-N" activates this bonus when at least N worn pieces share \
the set name, including pieces using the other ALLSET bonus properties. Each \
property keeps its own threshold; the default is two pieces.\n\r

PROP_WEAROVERRIDE=\
Property   : Prop_WearOverride\n\r\
Targets    : Items\n\r\
Parameters : (DRESS) (CONTENTS) ([masking params])\n\r\
Example    : -class +mage -race +elf -evil\n\r\
Description: \n\r\
Whenever the owner of the item with this property tries to wear or wield the \
item, they will be be permitted only if allowed by the mask argument.  \
Additionally, if they are permitted, then any wear restrictions that would \
normally prevent them from wearing the item will be suspended until the \
item is removed.  This is so that you can make special armor for creatures \
that normally can't wear standard gear, such as barding for horse backs, and \
so forth.  The DRESS argument will allow the item to be dressed or undressed \
from a creature without regard to normal permission rules. The CONTENTS parm \
allows the contents to be seen or manipulated.  \n\r\
For valid masking parameters \
see AHELP ZAPPERMASK, where allowed can wear, and disallowed is not. 

PROP_WEARRESISTER=\
Property   : Prop_WearResister\n\r\
Targets    : Items (armor and weapons principally)\n\r\
Parameters : resistance names followed by percentages\n\r\
Parameters : Parameters may be followed by an optional mask\n\r\
Parameters : May include optional LAYERED flag\n\r\
Example    : magic 50% poison -10%\n\r\
Example    : magic poison 50% pierce -10% MASK=-RACE +Dwarf\n\r\
Example    : fire 40% SOURCEMASK="-RACECAT +Dragon"\n\r\
CoffeeSUD: SOURCEMASK="[ZAPPER MASK]" makes it work only against the attackers it fits; MASK= is still whom it protects.\n\r\
Example    : magic 50% poison -10%\n\r\
Example    : magic 50% poison -10% LAYERED MASK=-RACE +Dwarf\n\r\
Description: \n\r\
Whenever the item having this property is wielded or worn, the owner gains \
certain resistances and immunities described in the parameters.  When removed, \
the resistances and immunities are also cancelled.  The Layered flag may be used to prevent \
resistance stacking due to multiple items worn on the same location. \
The effects which may be included are: \n\r\
Resistances: gas fire electricity mind magic cold acid water evil (undead) \n\r\
Resistances: justice (as per many thief abilities) \n\r\
Resistances: weapons blunt pierce slash non-magical-weapons non-silver-weapons\n\r\
Resistances:  -- weapons get reduced % damage per round, lvl based, with limits.\n\r\
:          :  -- always modifier makes weapon resists always work, no limits.\n\r\
Resistances: spell chant song prayer thief_skill (ability types) \n\r\
Resistances: enchantment/charm kicking vexing conjuration (ability domains)\n\r\
Immunities : teleport (includes gate, summon) holy disease poison\n\r\
Misc       : debuf-duration (pct is the maximum debuf ticks remain)\n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.\
ALLSET="set-name-N" activates this bonus when at least N worn pieces share \
the set name, including pieces using the other ALLSET bonus properties. Each \
property keeps its own threshold; the default is two pieces.\n\r

PROP_WEARSPELLCAST=\
Property   : Prop_WearSpellCast\n\r\
Targets    : Items\n\r\
Parameters : a list of properly named spells separated by semicolons\n\r\
Parameters : Spell names may optionally have parameters in parenthesis.\n\r\
Parameters : The above parameters may be followed by an optional mask\n\r\
Parameters : The above parameters may include optional LAYERED flag\n\r\
Example    : Spell_MageArmor;Spell_Shield\n\r\
Example    : Spell_MageArmor;LAYERED;Spell_Shield\n\r\
Example    : 90%;Spell_Portal(Somewhere else);Prayer_SummonElemental(/FIRE)\n\r\
Example    : Spell_MageArmor;Spell_Shield; MASK=-RACE +Dwarf\n\r\
Description: \n\r\
So long as the item with this property is being worn, wielded, or smoked, the owner \
will be under the effect of the listed spells. The layered flag means that, \
among layers of armor, only the top layer will grant its effect. \
The flag NOUNINVOKE can be substituted for a spell \
to make all the effects non-dispellable until the property no longer applies; \
use this flag with care! The flag LEVEL=[NUMBER] can also be substituted for a spell \
name to force all the listed effects be cast at a different level than default.\
The flag MAXTICKS=[NUMBER] can be used to shorten the length of all spell casts. \n\r\
The flag TICKS=[NUMBER] can be used to shorten the length of all subsequent listed spells. \n\r\
\n\r\
The parameters may also END with the key word MASK= followed by a mask.  This \
mask will select which kinds of mobs and players will be affected by this property. \
See ZAPPERMASKS for more information on zapper mask syntax.\
ALLSET="set-name-N" activates this bonus when at least N worn pieces share \
the set name, including pieces using the other ALLSET bonus properties. Each \
property keeps its own threshold; the default is two pieces.\n\r

PROP_WEARZAPPER=\
Property   : Prop_WearZapper\n\r\
Targets    : Items\n\r\
Parameters : masking parameters described below, optional zap message\n\r\
Example    : -class +mage -race +elf -evil\n\r\
Example    : MESSAGE="<O-NAME> falls off <S-NAME>!" -class +mage\n\r\
Example    : -class +mage "event=accuse,trespassing" "message=^N"\n\r\
Description: \n\r\
Whenever the owner of the item with this property tries to wear or wield the \
item, they will be zapped unless it is allowed by the listed parameters.  \n\r\
An optional MESSAGE parameter can define what is seen when the zap occurs. \
Also optionally, the parameters can start with the word ACTUAL to change \
zapping behavior to look at actual values instead of perceived values \
(this about a class check applied to a Charlatan.) \
The optional EVENT parameter is a comma-delimited set of strings, where the \
first is one of ZAP (default) or ACCUSE followed by a comma and the crime \
key from a laws.ini type definition. \
If the parameters include any alignment checks, the item will end up with an appropriate ambiance as well. \
For valid masking parameters, \
See AHELP ZAPPERMASK, where allowed can wear, and disallowed is zapped. 

PROP_WEATHER=\
Property   : Prop_Weather\n\r\
Targets    : Areas\n\r\
Parameters : the weather type and/or one or more climate masks\n\r\
Example    : RAIN\n\r\
Example    : RAIN CLIMATE_WET\n\r\
Description: \n\r\
Makes this area always have the same weather.  Valid weather values include: \
"CLEAR", "CLOUDY", "WINDY", "RAIN", "THUNDERSTORM", "SNOW", "HAIL", "HEAT", \
"SLEET","BLIZZARD","DUST","DROUGHT","COLD"\n\r\
\n\r\
Can also change the climate settings.  Valid climate mask values include: \
"CLIMATE_NORMAL", "CLIMATE_WET", "CLIMATE_COLD", "CLIMATE_WINDY", "CLIMATE_HOT", \
"CLIMATE_DRY", "CLIMATE_VOID"

PROP_WHEN=\
Property   : Prop_When\n\r\
Targets    : Rooms, Areas, Exits, Items, MOBs\n\r\
Parameters : PROPS="[ID]([ARGS]);[ID]([ARGS])"/ID=[ID] PARMS="[ARGS]" (WHEN="[ZAPPER MASK]") (CHECK=HOST/OWNER/ROOMPLAYERS/TRIGGERER) (EVERY=[TICKS]) (CHANCE=[PERCENT]) (COOLDOWN=[TICKS]/[N]H) (ONCE=CHAR/PROFILE/WORLD) (ONSTART="[ACTIONS]") (ONEND="[ACTIONS]") (ELSEMSG="[TEXT]")\n\r\
Example    : WHEN="-IF ISMOON(FULL)" PROPS="RandomMonsters(catalog:werewolf;3;5);Emoter(min=5 max=10 howls)"\n\r\
Example    : CHECK=ROOMPLAYERS COOLDOWN=24H ONCE=CHAR PROPS="Prop_Transporter(Feywild#1)"\n\r\
Description: \n\r\
CoffeeSUD: properties and behaviours that are there only while a condition holds.  PROPS \
lists them (abilities or behaviours, a semicolon between; their arguments in brackets), or ID \
and PARMS name one.  WHEN is a zapper mask on what CHECK says: HOST (the thing it is on, the \
default), OWNER (an item's owner), ROOMPLAYERS (any of the player's side in its room) or \
TRIGGERER (the last of them to come in).  Every EVERY ticks (1) it looks again: when the \
condition comes true what it wraps is added (at CHANCE percent; not before COOLDOWN, ticks or \
game hours with H, has passed since it last went; ONCE a character, a profile or a game), and \
ONSTART runs; when it no longer holds they are taken off and ONEND runs.  ELSEMSG is told to \
one who comes in while it is off.  What it wraps is not saved; its cooldown and ONCE=WORLD are.

PROP_WORKSTATION=\
Property   : Prop_Workstation\n\r\
Targets    : Items, Rooms\n\r\
Parameters : TAG=[NAME],... (SKILLS=[SKILL ID],...) (SPEED=[PCT]) (PROF=[N]) (MAXLEVEL=[N]) (QUALITY=[N])\n\r\
Example    : TAG=forge,anvil SKILLS=Blacksmithing,Weaponsmithing SPEED=25 PROF=+10 MAXLEVEL=40 QUALITY=+1\n\r\
Description: \n\r\
CoffeeSUD: a workstation, for a crafter in the room with it (on the room, or on an item lying there).  \
TAG is what it is, as a recipe's or skill's STATION asks for it.  SKILLS are the skills it helps (all when \
not given).  SPEED takes that percent off the time a craft takes (0 to 90; more or less is made to fit), PROF is added to the crafter's \
proficiency, MAXLEVEL lets recipes up to that level be made here (above the crafter's own), and \
QUALITY is for quality tiers (AHELP CRAFTQUALITY).  An item with a tag (TAGS) and no Prop_Workstation counts as a station \
of that name too, with no bonus.  A recipe asks for one with STATION=[NAME] (AHELP RECIPEKEYS), and \
a data skill (GenCraftSkill) for all its recipes with its STATION field.

PROP_YIELD=\
Property   : Prop_Yield\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : (HARVESTS=[N]) (DROP=[PCT]%) (REGROW=[N] [HOURS/DAYS/MONTHS/YEARS]) (EMPTYMSG="[TEXT]")\n\r\
Example    : HARVESTS=5 DROP=0% REGROW=7 DAYS EMPTYMSG="The glade is picked clean."\n\r\
Description: \n\r\
CoffeeSUD: how a room, or every room of an area, is gathered out and grows back.  Each harvest of a \
room takes a share off the next (DROP; the skill's own, 20% for most, when not given), and HARVESTS is how \
many it gives before it is bare: trying again then shows EMPTYMSG and finds nothing.  REGROW is how long \
after its last harvest it grows back, in game time (a bare number is game hours); without this property a \
room grows back 30 game minutes after its first harvest.  All of it runs on game time, so it waits while \
the game is paused or between turns, and the save keeps it.  With Prop_ImproveGather (AMT=0 outside a \
season) and ResourceOverride's seasons, a glade can give mushrooms five times in autumn and then rest a \
week.

PROP_WIZINVIS=\
Property   : Prop_WizInvis\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
Grants the MOB unlimited sensory knowledge as well as complete undetectibility.

QUESTBOUND=\
Property   : QuestBound\n\r\
Targets    : Mobs, Items\n\r\
Parameters : Class reference code of a Quest object or *\n\r\
Example    : Don't worry about it\n\r\
Example    : *\n\r\
Description: \n\r\
Either a temporary affect automatically added to all quest mobs and items both \
created and existing, or , if the parameter is *, a permanent effect to restrict an item or mob from being \
selected for a quest. \
Its purpose is to detect when a reset, shutdown, or other disaster is about to \
happen to the mob or item so that the quest can be stopped.  This prevents \
unwanted properties/behaviors/changes from being saved to the database on accident.

SOUNDECHO=\
Property   : SoundEcho\n\r\
Targets    : Areas, Rooms\n\r\
Parameters : [RANGE]/(RANGE=[RANGE] ACCURACY=[ACCURACY]\n\r\
Example    : 4\n\r\
Example    : range=10 accuracy=85\n\r\
Description: \n\r\
Causes sound to echo around the area or room when it occurs.  In other rooms, there \
is a default 50% chance that the echo will seem to come from the direction it actually came from. \
The range can be changed by including the range argument, and the accuracy by its argument (0-100). 

TATTOO=\
Tattoo's are intended to \
act as miscellaneous flags which players may obtain, not unlike a quest point.  \
These tattoo's can then be checked for as requirements to enter rooms or exits, \
or to possess certain items.  If the common account system is used, accounts can \
also have tattoos on them as well. \
\n\r\
An example would be like this:  The completion of a specific quest occurs when \
Gunther defeats the evil sorcerer Nunder and enters his inner chamber (where all \
the treasure is hidden).  Entering this inner chamber automatically grants Gunther \
a Tatto called "NUNDERKILLER".  Now, elsewhere in the realm is the second quest \
where Nunder's apprentice has escaped with an ancient artifact and is up to \
no good.  However, to even ENTER the area where Nunder's apprentice is operating, \
the system (via the Prop_ReqTattoo property on this other Area) requires that \
Gunther already have the "NUNDERKILLER" Tattoo.  If Gunther had not defeated \
Nunder and obtained the "NUNDERKILLER" Tattoo, he would not be allowed into \
the realm of Nunder's apprentice.

TEMPORARYAFFECTS=\
Property   : Temporary Affects\n\r\
Targets    : Mobs, Items, Exits, Rooms\n\r\
Parameters : [ABILITYID/BEHAVIORID] [NUM TICKS] ([PARAMETERS])\n\r\
Parameters : +[ABILITYID/BEHAVIORID] [NUM TICKS] ([PARAMETERS])\n\r\
Parameters : +AMBIANCE [NUM TICKS] ([AMBIANCE TEXT])\n\r\
Parameters : +BINDTO ([NAME])\n\r\
Parameters : -[ABILITYID/BEHAVIORID]\n\r\
Example    : +Mood 10 HAPPY\n\r\
Example    : +Clericness 20 Healer\n\r\
Example    : +Prop_Hidden 10\n\r\
Description: \n\r\
Allows the builder to temporarily affect a mob, item, exit, or room with a \
property or behavior that would normally be permanent if applied in a normal \
way.  The first parameter is the ability id or the behavior id, the second \
is the number of ticks that it will last, while the last parameter is optional \
parameters for THAT ability or behavior.  The parameters may be prefixed with a \
plus(+) sign to allow it to stack with other temporary affects.  A minus(-) sign \
followed by an ability or behavior id will prematurely remove the temporary \
affect.  The ability id may be AMBIANCE to add an ambiance \
string.  The ability id may also be BINDTO in order to bind the effects to the continued \
presence of a given named mob or object in the same room. If the parms (following \
any optional +) is prefixed with a #, then parms will be allowed on behaviors on non-mobs here.

TEMPORARYIMMUNITY=\
Property   : TemporaryImmunity\n\r\
Targets    : Mobs\n\r\
Parameters : Ability ID/Start time in millis;etc..\n\r\
Example    : Disease_Cold/12312312323;Spell_Fireball/123123132\n\r\
Description: \n\r\
This is used by diseases primarily to provide a mob or player with \
temporary (30 mud hour) immunity to a set of diseases, but you can \
also include other ability ids or behavior ids on the list as well.

TRIGGEREDAFFECTS=\
Property   : TriggeredAffects\n\r\
Targets    : Mobs, Exits, Rooms, Items\n\r\
Parameters : [PARM LIST - see below]\n\r\
Example    : (ID=Spell_Bless TICKS=100 ONTRIGGER=ADD TRIGGER="SAY \"praise the light\"" MESSAGE="A warm glow settles on the room.")\n\r\
Description: \n\r\
This allows other properties or effects to be automatically add or \
removed, for a limited time, based on a triggering event performed \
by someone in the same room.\n\r\
\n\r\
One parameter list is required for each Property or effect.  Multiple \
property lists must be grouped in (parenthesis).\n\r\
Each parameter list has some required and some optional keywords. These \
are listed in key="value" format.\n\r\
The required keywords for each parameter list are:\n\r\
ID=[ABILITY ID]/[BEHAVIOR ID]/AMBIANCE\n\r\
TICKS=[NUMBER OF TICKS] - how long the effect will remain or be gone after triggering.\n\r\
ONTRIGGER=ADD/REMOVE - whether to add the effect on trigger, or remove it.\n\r\
TRIGGER=[RITUAL] - the ritual that triggers the change, see AHELP RITUAL.\n\r\
\n\r\
Optional Keywords:\n\r\
PARMS=[PARMS] - Parameters for the property or behavior, or the ambiance.\n\r\
MESSAGE=[MSG] - The message to echo to the room when a trigger occurs.\n\r\
IMEANIT=TRUE/FALSE - PARMS apply to Behaviors even when applied to a non-agent.\n\r\
INVOKE=TRUE/FALSE - the ability is invoked instead of merely made an effect.

PROP_FIRSTENTRY=\
Property   : Prop_FirstEntry\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : TEXT="[TEXT]" (ONCE=CHARACTER/PROFILE) (SETVAR=[KEY]=[VALUE]) (TATTOO=[NAME])\n\r\
Parameters : (ID=[STABLE ID]) (ALIASES=[OLD ID]) (LEGACYKEYS=[OLD TOKEN])\n\r\
Example    : TEXT="A cold draught greets you." ONCE=CHARACTER\n\r\
Example    : TEXT="<VARIES><NIGHT>The vault is dark.</NIGHT></VARIES>" ONCE=PROFILE TATTOO=seenvault\n\r\
Description: \n\r\
CoffeeSUD: a once-only message, shown to a character the first time they enter the room or area.  \
The text accepts VARIES.  ONCE says whether the marker is kept for the character or for all of \
their profile.  SETVAR sets a script variable on the entering character, and TATTOO gives them the \
tattoo.  A stable ID keeps the same once marker after renaming the host; ALIASES and LEGACYKEYS name \
old IDs and tokens whose markers still count.

PROP_LORE=\
Property   : Prop_Lore\n\r\
Targets    : Items, Rooms, Mobs\n\r\
Parameters : ENTRY=[KEY] ON=[READ/GET/EXAMINE/ENTER/KILL/DEATH] (MSG="[TEXT]") (SCOPE=CHAR/PROFILE)\n\r\
Example    : ENTRY=founding ON=READ MSG="You learn of the founding." SCOPE=PROFILE\n\r\
Example    : ENTRY=dragon_weakness ON=KILL\n\r\
Description: \n\r\
CoffeeSUD: unlocks an entry of world/lore/*.ini when the event ON happens to the host: it is read, \
picked up, examined, entered (a room), or its killer (KILL awards the killer of this host) or the \
dying character (DEATH) is the one who learns it.  MSG is shown when it unlocks, and SCOPE says \
whether it is kept for the character or for the whole profile.  A script gives one with \
MPLORE $n ADD [KEY] [PROFILE].  See HELP LORE.

PROP_DETAILS=\
Property   : Prop_Details\n\r\
Targets    : Rooms, Items, Mobs\n\r\
Parameters : [KEYWORD],[ALIAS]=[DESCRIPTION];[OTHER KEYWORD]=[DESCRIPTION]\n\r\
Parameters : Each detail may end with (EXAMINEONLY) (READ="[TEXT]") (MASK="[ZAPPER MASK]") (HIGHLIGHT)\n\r\
Parameters : ... (SETVAR=[KEY]=[VALUE]) (TATTOO=[NAME]) (ID=[STABLE ID]) (ALIASES=[OLD ID]) (LEGACYKEYS=[OLD TOKEN])\n\r\
Example    : mural,painting=Faded figures march along the wall. HIGHLIGHT;lever=A rusty lever. EXAMINEONLY\n\r\
Example    : tome=A thick, dusty tome. READ="The pages crumble at a touch." TATTOO=readtome\n\r\
Description: \n\r\
CoffeeSUD: keywords in a description that can be looked at.  LOOK, EXAMINE and READ try the details \
after the real objects fail to match; LOOK [KEYWORD] ON [OBJECT] names the host.  EXAMINEONLY lets only \
EXAMINE show it, READ is what READ shows, MASK limits who sees it, and HIGHLIGHT marks the keyword in \
the host's text.  Quote option values that hold spaces or semicolons.  Clue options (SETVAR, TATTOO) run \
only on the first use.\n\r\
LOOK_PROG: a detail that is shown also runs the host's LOOK_PROG scripts, with the keyword in $g; a bare \
keyword (or 100) in the trigger line picks the keyword (AHELP SCRIPTABLE).  Looking at the host itself is \
the ordinary look, which Prop_QuestGiver's TRIGGER=LOOK answers; a detail is not that look.

PROP_SENSES=\
Property   : Prop_Senses\n\r\
Targets    : Rooms, Items, Mobs, Exits\n\r\
Parameters : (SOUND="[TEXT]|[TEXT]") (TOUCH="[TEXT]") (TASTE="[TEXT]") (CHANCE=[PCT])\n\r\
Parameters : ... (SETVAR=[KEY]=[VALUE]) (TATTOO=[NAME]) (ID=[STABLE ID]) (ALIASES=[OLD ID]) (LEGACYKEYS=[OLD TOKEN])\n\r\
Example    : SOUND="water drips|a stone shifts";TOUCH="nine studs; one loose";TASTE="salt" CHANCE=100\n\r\
Description: \n\r\
CoffeeSUD: what LISTEN [TARGET], TOUCH or FEEL [TARGET] and TASTE [TARGET] tell of the host, which work in \
darkness.  Quote the texts; a | separates alternatives, one of which is chosen.  First-use clues (SETVAR, \
TATTOO) are tracked separately for each sense.  SNIFF still uses Prop_Smell.

PROP_DARKDESCRIPTION=\
Property   : Prop_DarkDescription\n\r\
Targets    : Rooms\n\r\
Parameters : TITLE="[TEXT]" DESC="[TEXT]"\n\r\
Example    : TITLE="Somewhere dark" DESC="Cold water laps at your knees."\n\r\
Description: \n\r\
CoffeeSUD: describes a dark room without revealing its contents.  VARIES is allowed.  Alternatively place \
DARK and LIT blocks in the room description.

PROP_MAPGLYPH=\
Property   : Prop_MapGlyph\n\r\
Targets    : Rooms\n\r\
Parameters : CHAR=[CHARACTER] (COLOR=[COLOR CODE]) (LABEL="[TEXT]") (LEGEND) / HIDE\n\r\
Example    : CHAR=I COLOR=y LABEL="Inn" LEGEND\n\r\
Example    : HIDE\n\r\
Description: \n\r\
CoffeeSUD: a custom glyph and legend entry for the room on MAP, AUTOMAP and the window panel.  HIDE leaves \
the room off the map.  Unmappable rooms and areas remain excluded.

PROP_MAPREVEAL=\
Property   : Prop_MapReveal\n\r\
Targets    : Items\n\r\
Parameters : ROOMS=[ROOM IDS] / AREA="[AREA NAME]" (MARK=[ROOM ID]:[CHARACTER]:"[LABEL]") (COLOR=[COLOR CODE])\n\r\
Example    : ROOMS=Area#1-40,Area#45 MARK=Area#12:X:"Buried chest" COLOR=r\n\r\
Example    : AREA="Old Quarter"\n\r\
Description: \n\r\
CoffeeSUD: on a readable item.  Reading it teaches saved map knowledge of the rooms (a list or a range, or a \
whole area) and puts the marks on the map, without counting as a visit.  Revealed rooms are dim on MAP under \
MAPFOG=KNOWN.

PROP_SHOWWHEN=\
Property   : Prop_ShowWhen\n\r\
Targets    : Items, Mobs, Exits, Rooms\n\r\
Parameters : MASK="[ZAPPER MASK]" (CHECK=VIEWER/ROOMPLAYERS/ANYPLAYER/HOST) WHEN="[CONDITION]"\n\r\
Parameters : ... (HIDEMODE=UNSEEN/HIDDEN) (ID=[STABLE ID]) (ALIASES=[OLD ID]) (LEGACYKEYS=[OLD TOKEN])\n\r\
Example    : MASK="-TATTOO +SPIRITSIGHT" CHECK=VIEWER HIDEMODE=UNSEEN\n\r\
Example    : WHEN="IFVAR GHOSTS=1" CHECK=ANYPLAYER HIDEMODE=HIDDEN\n\r\
Description: \n\r\
CoffeeSUD: the host shows only while a condition holds.  MASK checks the selected viewer(s): the one looking, \
the players in the room, any player, or the host itself, as CHECK says.  WHEN accepts a VARIES tag and \
argument or a zapper mask.  Until allowed, the host is invisible and cannot be handled or crossed.  A \
successful SEARCH reveals HIDDEN hosts to that character; UNSEEN hosts require the condition.  SYSOPMSGS \
bypasses this for builders.

PROP_AREAENTRY=\
Property   : Prop_AreaEntry\n\r\
Targets    : Areas\n\r\
Parameters : (ENTER="[TEXT]") (FIRST="[TEXT]") (LEAVE="[TEXT]") (TITLE="[TEXT]") (SHOWNAME) (TEXT="[TEXT]")\n\r\
Parameters : (DESC) (ONCE) (MASK="[ZAPPER MASK]") (COLOR="[COLOR CODE]")\n\r\
Example    : TITLE="The Ashen Reach" TEXT="Ash drifts down like grey snow." ONCE\n\r\
Example    : ENTER="You pass the border stones." FIRST="The old road ends here." LEAVE="The ash thins behind you." MASK="-PLAYERS"\n\r\
Description: \n\r\
CoffeeSUD: text on an area's border, for a player's character who comes in from another area (or into the \
world) or leaves it.  ENTER is told each time they come in, FIRST only the first time they come into the \
area, and LEAVE on leaving.  TITLE (or SHOWNAME, the area's name) and TEXT make a banner, shown in COLOR \
(the highlight color, if not given); DESC adds the area's description.  ONCE shows the banner (title, text and \
description) only the first time in; ENTER and FIRST are unaffected.  MASK says whom it is for.  Prop_AreaBanner \
is this with the area's name as the title and the description on, unless told otherwise.

PROP_AREABANNER=\
Property   : Prop_AreaBanner\n\r\
Targets    : Areas\n\r\
Parameters : (TITLE="[TEXT]") (TEXT="[TEXT]") (ONCE/EACH) (MASK="[ZAPPER MASK]") (COLOR="[COLOR CODE]")\n\r\
Parameters : (ENTER="[TEXT]") (FIRST="[TEXT]") (LEAVE="[TEXT]")\n\r\
Example    : \n\r\
Example    : TEXT="Welcome to the market." ONCE\n\r\
Description: \n\r\
CoffeeSUD: the entry banner of an area, shown to a character who comes into it from another area: the area's \
name (in capitals, or TITLE), any TEXT and then the area's description.  EACH, the default, shows it at every \
entry; ONCE only the first time.  It takes the rest of Prop_AreaEntry's keys (ENTER, FIRST, LEAVE, MASK, COLOR); \
see PROP_AREAENTRY.

PROP_VERBS=\
Property   : Prop_Verbs\n\r\
Targets    : Areas, Rooms, Items, Mobs, Exits\n\r\
Parameters : VERBS="[VERB],[VERB]..." MSG="[WHAT THE ONE WHO DOES IT SEES]" (OTHERS="[WHAT THE OTHERS SEE]")\n\r\
Example    : VERBS="pull,yank" MSG="You haul on the rope and a bell clangs far above." OTHERS="<S-NAME> hauls on the rope.  A bell clangs."\n\r\
Example    : VERBS="turn,rotate" MSG="The wheel creaks round."\n\r\
Description: \n\r\
CoffeeSUD: verbs for an object without a script.  A command whose first word is one of the VERBS (the whole \
word, not a prefix), and whose rest names the object it is on, shows MSG to the character and OTHERS to the \
rest of the room, instead of the command, skill or social of that word.  On a room or an area the rest of the \
line need not name anything.  The same is done with a script by VERB_PROG (AHELP SCRIPTABLE); LIST VERBS lists \
what is in a room.

PROP_BROKEN=\
Property   : Prop_Broken\n\r\
Targets    : Items\n\r\
Parameters : (ORIGINAL=[THE ITEM'S OLD NAME])\n\r\
Example    : ORIGINAL="a steel longsword"\n\r\
Description: \n\r\
CoffeeSUD: put on an item when it is broken (ITEMBREAK=BREAK, or Prop_Durability's BREAK).  A broken item cannot \
be worn, held or wielded, gives no armour and does no damage, and shows as (broken).  When it is mended (its \
uses are above 0 again), the property goes and the item has the name ORIGINAL back.  The game adds it; a builder \
seldom needs to.  See PROP_DURABILITY.

PROP_PLAYTEST=\
Property   : Prop_Playtest\n\r\
Targets    : MOBs\n\r\
Parameters : [ROOM ID THE PLAYTEST BEGAN IN]\n\r\
Example    : Ember#1\n\r\
Description: \n\r\
CoffeeSUD: put on a builder by PLAYTEST ON, and not saved.  While it is on them their sysop powers are \
suspended, so that the game treats them as a mortal, and a death takes them back, whole, to the room in the \
parameter, where the playtest began.  PLAYTEST OFF takes it away.  See PLAYTEST.

PROP_FACTIONEFFECTS=\
Property   : Prop_FactionEffects\n\r\
Targets    : MOBs\n\r\
Parameters : [FACTION ID]\n\r\
Example    : alignment.ini\n\r\
Description: \n\r\
CoffeeSUD: internal.  It is put on a player's character by the game for each faction with PLAYEREFFECT rules \
(AHELP FACTIONPLAYEREFFECTS), and runs those rules' effects as transient handlers, chosen by the band the \
character stands in or by the rule's zapper mask.  They are rebuilt from the faction's data and never saved \
with the character.  Not for builders to give.

PROP_JOURNEYSTATE=\
Property   : Prop_JourneyState\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  One passage in progress (AHELP PROP_JOURNEY), kept on the party's leader: the journey's \
definition, origin, destination and transit room, the hours done and the time left on the leg, the fares paid, \
who is aboard and what is paused.  It shows as (Travelling), is saved with the character, and its alarms are \
rebuilt from the time remaining.  Not for builders to give or change; JOURNEY RESUME and the journey's own \
settings are the way to steer a passage.

PROP_JOURNEYPASSENGER=\
Property   : Prop_JourneyPassenger\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  A saved identity for each passenger of a journey (AHELP PROP_JOURNEY), including \
mounts that share a name, so that the passage's seats still match after a save.  Shown as nothing.  Not for \
builders to give.

PROP_PURCHASES=\
Property   : Prop_Purchases\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  A hidden record, saved with the character, of what they bought with trains and practices \
(skills taught, gained, trained and so on), so that MPRESPEC and the like can give back what each cost.  Not \
for builders to give or change.

PROP_STORYRECORDS=\
Property   : Prop_StoryRecords\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  The saved journal, the map knowledge, the unread lore and the colour choices of a \
character (the things that Prop_Lore, Prop_MapReveal and the like teach, and JOURNAL, MAP and LORE show), \
kept in this one hidden effect so that they travel with the character.  Not for builders to give or edit.

PROP_AUTHORIDENTITY=\
Property   : Prop_AuthorIdentity\n\r\
Targets    : Rooms, Areas, Items, Mobs, Exits\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  A saved identity for a source of authored text that has no ID= of its own (a once-only \
message, a waypoint, a lore entry), written as AUTO:[a random id] against the kind of record.  A room or area \
needs none: its identity comes from its room ID or its name.  Giving a property an ID=[stable id] avoids it \
altogether.  Not for builders to give.

PROP_TRANSITVIEW=\
Property   : Prop_TransitView\n\r\
Targets    : Rooms\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  The text of the view from a MovingRoom (AHELP MOVINGROOM) while it travels, added to what \
LOOK shows in the room; the room's own description is left as it is.  Not saved, and not for builders to give.

PROP_TWEAKWATCH=\
Property   : Prop_TweakWatch\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: internal.  Left beside the effect that a TWEAK ability (AHELP GENTWEAK) put on a mob: its text is the \
tweak's ID and then the effect's.  When the effect is gone it runs the tweak script's ONEXPIRE and takes itself \
away.  Hidden and not saved; not for builders to give.

DUSTY=\
Property   : Dusty\n\r\
Targets    : Rooms, Items\n\r\
Parameters : LEVEL=[N] INTERVAL=[GAME HOURS] (TIME=[MILLISECONDS])\n\r\
Example    : LEVEL=0 INTERVAL=2880\n\r\
Description: \n\r\
CoffeeSUD: a layer of dust on an item that has lain untouched in a room.  The game puts it on (PuddleMaker \
gives items LEVEL=1 with an INTERVAL so long that the dust never thickens, and does not save it; a room for sale, \
Prop_RoomForSale and its kin, gives the loose items LEVEL=0 and an INTERVAL of a game year).  Every INTERVAL \
game hours (120 if not given), and then every twice as long as the last time, LEVEL goes up by one and the item \
shows it: a bit dusty, dusty, a dusty [item], [item], covered in dust, covered in a thick layer of dust, \
something under a dense layer of dust, and at last a lump of thick dust.  TIME is when the level last rose.  The \
dust goes if a mob picks the item up, or when it rains, snows, hails, sleets or storms there.  DUST or CLEAN, \
alone or with ALL, ROOM or HERE, takes one level off everything gettable that lies in the room, and DUST [ITEM] \
takes all of it off one item.  Prayer_Cleanliness also removes it.

ALERTED=\
Property   : Alerted\n\r\
Targets    : MOBs\n\r\
Parameters : ROOM="[ROOM ID]" INTRUDER="[NAME]"\n\r\
Example    : ROOM="Keep#12" INTRUDER="Bob"\n\r\
Description: \n\r\
CoffeeSUD: an NPC an alarm has roused (the ALARM of Sleeper and Sentry), put on by the game for the ALERTTICKS \
(40 by default) of the Sentry that raised it.  The NPC heads for ROOM, or for the INTRUDER if it knows where \
they are, and attacks them or any of their party when it finds them (with no INTRUDER, a player's \
character).  Schedule and Patroller wait while it lasts, and Mobile is held off.  It shows as (Alert).  Not for \
builders to give.

GOINGHOME=\
Property   : GoingHome\n\r\
Targets    : MOBs\n\r\
Parameters : (kept by the game)\n\r\
Example    : \n\r\
Description: \n\r\
CoffeeSUD: HOME under way (AHELP HOME).  After its turns (HOMERECALL in the ini, 3 by default) the character's \
whole party, followers too, is brought to the leader's home (AHELP PROP_HOMEBEACON); a fight stops it before \
that, with a message.  It shows as (Going home).  Not for builders to give.

PHOBIAS=\
Property   : Phobias\n\r\
Targets    : MOBs\n\r\
Parameters : [RACE/RACIAL CATEGORY/WORD],[RACE/RACIAL CATEGORY/WORD],...\n\r\
Example    : Spider,Snake\n\r\
Example    : Undead,Dragon\n\r\
Description: \n\r\
A comma-separated list of what the mob fears.  An entry that is a race (Elf) or a racial category (Undead) is a \
race phobia: a creature of it that the mob can see frightens the mob.  Any other entry is a word to look for in \
the name of a creature or of an item lying in the room (spider).  Every few ticks, if the mob is awake and mobile \
and something it fears is in the room (items count only when fewer than 20 lie there), there is a 50% chance it \
reacts.  Its Mood becomes SCARED (and is put back when nothing frightening is left), and then: 30% of the \
time it cowers (Cowering); in a fight it flees; otherwise 40% of the time it vomits, 40% of what is left it passes \
out for a few ticks, and else it runs off.  The phobias show as "Afraid of ..." in the mob's health condition.

PROP_COMBATSTATS=\
Property   : Prop_CombatStats\n\r\
Targets    : MOBs, Items\n\r\
Parameters : [STRICT JSON], as {"schema":1,"armor":200,"resistance":{"fire":50},"penetration":{"fire":20}}\n\r\
Example    : {"schema":1,"armor":200,"resistance":{"fire":50},"penetration":{"fire":20}}\n\r\
Description: \n\r\
CoffeeSUD optional profile combat only.  Attach it to a MOB or to an owned, worn, top-level item.  Adds \
accuracy/evasion/armor, block/spell_block/crit_chance/crit_multiplier points, typed resistance/penetration \
and immune type lists.  Types: physical, fire, cold, electric, acid; immunity also accepts burning.  The critical \
multiplier is additive points: +50 changes the default 150% to 200%.  Unequipping or removing the source removes \
the bonus; ordinary engine stats are not changed.\n\r\
At most 64 sources per actor and 8192 characters per property.  Invalid primary stats reject casts before costs.  \
WORLD CHECK ONLY=COMBAT diagnoses properties.  See AHELP WORLD_COMBAT and SUDDocs/creator/16-combat-profiles.md for \
ranges and order.

PROP_RESOURCEMAX=\
Property   : Prop_ResourceMax\n\r\
Targets    : MOBs, Items\n\r\
Parameters : [POOL]=+[N] ([POOL]=-[N]) ...\n\r\
Example    : embertrial.heat=+20 embertrial.cinder=+1\n\r\
Description: \n\r\
Raises (or lowers) the maximum of named resources (the optional module abilities.resources) while it is \
on the character, or on an item they wear or hold. A pool's value above a lowered maximum is cut to it \
the next time the pool is read or changed. A maximum is never below 1. See SUDDocs/creator/34-named-resources.md.

PROP_RESERVE=\
Property   : Prop_Reserve\n\r\
Targets    : MOBs\n\r\
Parameters : POOL=[ID] AMOUNT=[N] (NAME="[TEXT]") (OF=SELF/LEADER) (EFFECTS="[ID];[PARMS]") (ONSUSPEND=PAUSE/LEAVE)\n\r\
Example    : POOL=example.spirit AMOUNT=30 NAME="Aura of embers" EFFECTS="Prop_Adjuster;STR+2"\n\r\
Description: \n\r\
Holds part of a reservable named resource (the optional module abilities.resources) while it is on its \
host: OF=SELF from the host's own pool (an aura), OF=LEADER from the pool of the one it follows (a minion's \
upkeep).  What it holds cannot be spent, and taking it off (or the minion's end) frees it at once.  EFFECTS \
work while it fits.  Reservations fit in the order they were made (SINCE= in its text), each while the \
pool's value has room; one that does not is suspended: ONSUSPEND=PAUSE stops its effects until there is \
room, LEAVE dismisses the minion (or takes the property off).  RESOURCES names each, and which are \
suspended.  See SUDDocs/creator/34-named-resources.md.

PROP_TRIGGERS=\
Property   : Prop_Triggers\n\r\
Targets    : MOBs, Items\n\r\
Parameters : TRIGGERS=[ID],[ID]...\n\r\
Example    : TRIGGERS=example.riposte,example.harvest\n\r\
Description: \n\r\
Grants causal triggers (the optional module abilities.triggers) while it is on the character, or on an \
item they wear or hold. A character has one Prop_Triggers of their own; list every trigger in it. The \
triggers are definitions in world/triggers/. See SUDDocs/creator/35-causal-triggers.md.

PROP_REWARDACTIVITY=\
Property   : Prop_RewardActivity\n\r\
Targets    : Areas\n\r\
Parameters : ACTIVITY=[ID]\n\r\
Example    : ACTIVITY=example.trial\n\r\
Description: \n\r\
Marks an area as the place of a reward-escrow activity (the optional module rewards.escrow). A character with a \
run of the activity under way who leaves the area gets the activity's on_leave (forfeit, bank or keep), once \
the move is over. See SUDDocs/creator/36-reward-escrow.md.

PROP_EXPEDITIONCHART=\
Property   : Prop_ExpeditionChart\n\r\
Targets    : Items\n\r\
Parameters : EXPEDITION=[ID] SEED=[N] TIER=[N]\n\r\
Example    : EXPEDITION=example.depths SEED=0 TIER=1\n\r\
Description: \n\r\
Makes the item a chart of an expedition (the optional module expeditions.contracts). SEED=0 is an unread \
chart: its seed is drawn from the campaign's expeditions random stream when it is first opened, and written \
into it. The modifiers it offers come from its seed. EXPEDITION PREVIEW and OPEN use it. See \
SUDDocs/creator/38-expeditions.md.

PROP_WORKORDER=\
Property   : Prop_WorkOrder\n\r\
Targets    : Items\n\r\
Parameters : (kept by the game: the recipe's pin and the stage reached)\n\r\
Example    : \n\r\
Description: \n\r\
A work piece of a staged recipe (items.modifiers, kind recipe). MODCRAFT BEGIN makes the piece with this \
property; each settled stage moves it on, saved with the piece; the last stage makes the product and takes \
the piece away. Do not attach it by hand. See SUDDocs/creator/17-item-modifiers-crafting.md.

PROP_TRACKS=\
Property   : Prop_Tracks\n\r\
Targets    : MOBs, Items\n\r\
Parameters : (TRACKS=[ID],[ID]...)\n\r\
Example    : TRACKS=example.blade-mastery\n\r\
Description: \n\r\
Progression tracks (the optional module progression.tracks). On an item, TRACKS names its mastery tracks: \
the item earns them while worn or wielded. On a character or an item, it is the source of the combat stats \
its milestones give; a character gets one by itself when a milestone first gives stats. See \
SUDDocs/creator/39-progression-tracks.md.

PROP_ITEMMODIFIERS=\
Property   : Prop_ItemModifiers\n\r\
Targets    : Items\n\r\
Parameters : (kept by the game: a strict saved JSON record)\n\r\
Example    : \n\r\
Description: \n\r\
Applied by optional MODBASE generation to standard generic items and equipment.  It carries a strict saved JSON \
record with item identity, base pin/revision, display baselines and per-modifier identity, source pin, tier, \
group, tags, numeric rolls and protection.  ITEMMODS inspects it; MODCRAFT performs controlled selective edits.  \
Do not hand-attach an empty property.  Use ItemModifiers.initialize on fresh unowned generated items; \
ItemModifiers.copyOf is the managed clone API with fresh identities and preserved values.\n\r\
Numeric deltas feed the optional combat-profile collector when correctly worn.  A generic copy (bound to another \
item), a corrupt record or one over the campaign's max_modifiers grants nothing and does not stop its wearer's \
combat; the log, COMBATRESULT and WORLD CHECK ONLY=ITEMMODS name it.  Disabling items.modifiers suspends \
bonuses/crafting and keeps records/receipts.  This first family does not own arbitrary AFFECT layers, new \
crafting currencies or staged choices.  See SUDDocs/creator/17-item-modifiers-crafting.md.
