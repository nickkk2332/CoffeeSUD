PROP_TRAVELTIME=\
Property   : Prop_TravelTime\n\r\
Targets    : Exits, Rooms, Areas\n\r\
Parameters : TIME=[GAME MINUTES] (MOUNTED=[MULTIPLIER]) (VEHICLE=[MULTIPLIER]) (NIGHT=[MULTIPLIER])\n\r\
Example    : TIME=30 MOUNTED=0.5 VEHICLE=0.7 NIGHT=1.5\n\r\
Description: \n\r\
CoffeeSUD: TIME is the time spent per step. Multipliers apply when mounted, in a vehicle and at night. Priority: exit, destination room/area, source room/area. Followers do not add another time charge. The scheduler runs weather, hunger, NPCs and scripts during travel.

PROP_ROAD=\
Property   : Prop_Road\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : TIME=[MULTIPLIER] (NOTFOR="[VEHICLE NAMES OR IDS, COMMA SEPARATED]")\n\r\
Example    : TIME=0.5 NOTFOR="the Gull,ore cart"\n\r\
Description: \n\r\
CoffeeSUD: Allows caravans to use the existing terrain without changing its locale, resources or description. TIME multiplies Prop_TravelTime. NOTFOR excludes matching vehicles.

PROP_PORT=\
Property   : Prop_Port\n\r\
Targets    : Rooms\n\r\
Parameters : NAME="[PORT NAME]" KIND=[SEA/ROAD/AIR/SPACE] (HIDDEN=[TRUE/FALSE]) (KNOWNMASK="[ZAPPER MASK]")\n\r\
Example    : NAME="Saltmarsh Quay" KIND=SEA\n\r\
Example    : NAME="Smugglers' Cove" KIND=SEA HIDDEN=true KNOWNMASK="-TATTOO +KNOWSCOVE"\n\r\
Description: \n\r\
CoffeeSUD: PORTS lists known ports. A hidden port requires a matching KNOWNMASK. COURSE TO, SAIL TO and DRIVE TO accept a known port, room ID, area or numbered Sea Charting point. Routes follow open exits and the vessel terrain rules.

PROP_HELMRESTRICT=\
Property   : Prop_HelmRestrict\n\r\
Targets    : Items\n\r\
Parameters : NAVMASK="[ZAPPER MASK]" (MESSAGE="[REFUSAL]") (ONFAIL=[FUNCTION])\n\r\
Example    : NAVMASK="-PLAYERS"\n\r\
Description: \n\r\
CoffeeSUD: Restricts anchor, brake, course, steering, sailing and tender commands. Sailor NPC crew aboard the vessel and builders with item permissions pass. ONFAIL calls a function on the vessel. Example: NAVMASK="-PLAYERS".

PROP_JOURNEY=\
Property   : Prop_Journey\n\r\
Targets    : Exits, Rooms, Items, MOBs\n\r\
Parameters : DEST=[ROOM ID OR PORT] (required) DURATION=[GAME HOURS] (required) (VIA=[TRANSIT ROOM]) (FARE=[PRICE])\n\r\
Parameters : (PARTY=[LEADER/EACH]) (PERHEAD=[TRUE/FALSE]) (MISSING=[WAIT/CONTINUE/RESCUE/CANCEL/RETURN])\n\r\
Parameters : (DEAD=[CONTINUE/WAIT/CANCEL/RETURN]) (DISCONNECTED=[TRAVEL/WAIT/CONTINUE/CANCEL/RETURN])\n\r\
Parameters : (CANCEL=[HERE/RETURN]) (REFUND=[NONE/FULL/UNUSED]) (LEAVEMSG="[TEXT]") (ARRIVEMSG="[TEXT]")\n\r\
Parameters : (EVENTS="[CHANCE%:ACTION;...]")\n\r\
Example    : DEST=Harbor#1 DURATION=6 FARE=25 PARTY=EACH\n\r\
Example    : DEST="Saltmarsh Quay" DURATION=12 VIA=Sea#1 EVENTS="10%:CATALOG gale;5%:calm_seas"\n\r\
Description: \n\r\
CoffeeSUD: Entering the host or JOURNEY <host> starts a passage for the nearby party. Each game hour rolls EVENTS: a script function, LOAD MOB <spec>, or CATALOG <encounter table>. A function returning PAUSE waits for JOURNEY RESUME. Combat pauses travel. Saves retain elapsed hours, remaining leg time, scenes and individual passengers.\n\r\
Missing/dead/disconnected passenger policies are checked before advancing or arriving. WAIT pauses without spending time; CONTINUE releases the seat. RESCUE obeys movement checks. RETURN brings the present party to the origin; refused returns stay paused. Saved fare receipts support full or unused-time refunds once per payer. Defaults: MISSING=WAIT DEAD=CONTINUE DISCONNECTED=TRAVEL CANCEL=HERE REFUND=NONE.  Any REFUND value but NONE refunds, in full unless it is UNUSED.\n\r\
JOURNEY_PROG START|HOUR|ARRIVE|CANCEL|ALL: $g is the stage, $0 completed game hours and $1 the destination room ID.

PROP_WAYPOINT=\
Property   : Prop_Waypoint\n\r\
Targets    : Rooms, Items\n\r\
Parameters : NETWORK=[NAME] NAME="[DESTINATION]" (ID=[STABLE AUTHOR ID]) (ALIASES=[OLD IDS]) (LEGACYKEYS=[OLD TOKENS])\n\r\
Parameters : (DISCOVER=[ENTER/TOUCH/RITUAL/QUEST]) (SCOPE=[CHARACTER/PROFILE]) (COST="[mana/moves/movement/gold/money] [NUMBER]")\n\r\
Parameters : (TIME=[GAME HOURS]) (MASK="[ZAPPER MASK]") (MSG="[TEXT]") (RITUAL=[FUNCTION]) (QUEST="[QUEST NAME]")\n\r\
Example    : NETWORK=ley NAME="The Standing Stones" DISCOVER=TOUCH COST="mana 20" TIME=1\n\r\
Example    : NETWORK=ley NAME="Hollow Oak" DISCOVER=ENTER SCOPE=PROFILE\n\r\
Description: \n\r\
CoffeeSUD: TRAVEL lists discovered destinations in the current network and TRAVEL <name> moves the nearby party. Discovery is saved per character, or shared with the account/profile. ID keeps the key stable when a waypoint is moved or renamed. TRAVEL ATTUNE checks masks and ritual/quest requirements. TOUCH and USE activate touch waypoints. Cost is charged once, after every passenger passes entry checks.

BEHAVIOR_TRANSPORTLINE=\
Behavior   : TransportLine\n\r\
Targets    : Navigable vessels, rideables, mounted MOB drivers\n\r\
Parameters : STOPS="[ROOM IDS OR PORT NAMES SEPARATED BY SEMICOLONS]" (WAIT=[TICKS]) (DEPART=[GAME HOURS, COMMA SEPARATED])\n\r\
Parameters : (ROUND=[LOOP/BACK]) (FARE=[PRICE]) (FARES="[STOP:PRICE,...]") (PARTY=[LEADER/EACH]) (PETS=[PRICE])\n\r\
Parameters : (CARGO=[PRICE PER 100 LBS]) (PASSENGERONLY=[TRUE/FALSE]) (SIGN="[ITEM NAME]") (BOARDCALL="[TEXT]")\n\r\
Parameters : (DEPARTMSG="[TEXT]") (ARRIVEMSG="[TEXT]")\n\r\
Example    : STOPS="Harbor#1;Isle#3" WAIT=10 ROUND=BACK FARE=5\n\r\
Example    : STOPS="Saltmarsh Quay;Smugglers' Cove" DEPART=6,18 ROUND=LOOP FARES="Smugglers' Cove:12" PETS=2\n\r\
Description: \n\r\
CoffeeSUD: Routes between stops with the ordinary movement system. DEPART replaces WAIT with calendar departure hours. BACK reverses at endpoints; LOOP cycles. Messages substitute $stop and $next. SIGN publishes the timetable at stops; TIMETABLE also shows it. Progress, direction, departure and arrival count are saved.\n\r\
PASSENGERONLY is true if not given: a navigable vessel with a TransportLine gets a crew-only helm (Prop_HelmRestrict NAVMASK="-PLAYERS") unless it has its own Prop_HelmRestrict; PASSENGERONLY=false leaves the helm open.  Generated ticket and crew-only helm properties are temporary; explicit authored properties take priority. PARTY=LEADER pays for the group, EACH uses individual fares. WAIT UNTIL ARRIVAL stops at a line arrival.

TRANSPORT_SCRIPTING=\
Commands: MPSAIL <vessel> TO <room|area|port>, or <directions>; MPANCHOR <vessel> UP|DOWN; MPMOVEVESSEL <vessel> <room>; MPBOARD <who> <vessel> [interior room]; MPHITCH <item> <mount>; MPUNHITCH <item>. Quote multiword arguments with single quotes.\n\r\
Functions in MOBPROG and JavaScript: ABOARD(who), RIDING(who), RIDERS(rideable), ISANCHORED(vessel), ISDOCKED(vessel), COURSE(vessel), VESSELROOM(vessel), SPEED(vessel), HULL(vessel). Vessel names resolve across the world.\n\r\
In JavaScript, use uppercase bridge names: VESSELROOM$("the Gull") returns a string value; ISANCHORED("the Gull") returns a boolean. MPBOARD carries the nearby party. MPMOVEVESSEL moves and docks without a voyage. MPHITCH requires co-location and refuses riding loops.

VESSEL_PACING=\
Generic navigable vessel stats: TICKSPERMOVE=[at least 1], TICKSPERTURN=[at least 1], WEATHERSPEED=true|false, FIXEDINTERIOR=true|false. Set with MODIFY or MPSET; catalog and XML templates retain them.\n\r\
Copies receive unique interior area names and room IDs unless FIXEDINTERIOR is true. Use a fixed interior only when deliberately preserving one authored name.
