PROP_TRAVELTIME=\
Property: Prop_TravelTime\n\r\
Targets: Exits, Rooms, Areas\n\r\
Parameters: TIME=[game minutes] MOUNTED=0.5 VEHICLE=0.7 NIGHT=1.5\n\r\
TIME is the time spent per step. Multipliers apply when mounted, in a vehicle and at night. Priority: exit, destination room/area, source room/area. Followers do not add another time charge. The scheduler runs weather, hunger, NPCs and scripts during travel.

PROP_ROAD=\
Property: Prop_Road\n\r\
Targets: Rooms, Areas\n\r\
Parameters: TIME=[multiplier] NOTFOR="[vehicle names or IDs, comma separated]"\n\r\
Allows caravans to use the existing terrain without changing its locale, resources or description. TIME multiplies Prop_TravelTime. NOTFOR excludes matching vehicles.

PROP_PORT=\
Property: Prop_Port\n\r\
Targets: Rooms\n\r\
Parameters: NAME="[port name]" KIND=SEA|ROAD|AIR|SPACE HIDDEN=false KNOWNMASK="[mask]"\n\r\
PORTS lists known ports. A hidden port requires a matching KNOWNMASK. COURSE TO, SAIL TO and DRIVE TO accept a known port, room ID, area or numbered Sea Charting point. Routes follow open exits and the vessel terrain rules.

PROP_HELMRESTRICT=\
Property: Prop_HelmRestrict\n\r\
Targets: Items\n\r\
Parameters: NAVMASK="[mask]" MESSAGE="[refusal]" ONFAIL=[function]\n\r\
Restricts anchor, brake, course, steering, sailing and tender commands. Sailor NPC crew aboard the vessel and builders with item permissions pass. ONFAIL calls a function on the vessel. Example: NAVMASK="-PLAYERS".

PROP_JOURNEY=\
Property: Prop_Journey\n\r\
Targets: Exits, Rooms, Items, MOBs\n\r\
Parameters: DEST=[room or port] DURATION=[game hours] VIA=[transit room] FARE=[price] PARTY=LEADER|EACH PERHEAD=true MISSING=WAIT|CONTINUE|RESCUE|CANCEL|RETURN DEAD=CONTINUE|WAIT|CANCEL|RETURN DISCONNECTED=TRAVEL|WAIT|CONTINUE|CANCEL|RETURN CANCEL=HERE|RETURN REFUND=NONE|FULL|UNUSED LEAVEMSG="[text]" ARRIVEMSG="[text]" EVENTS="[chance%:action;...]"\n\r\
Entering the host or JOURNEY <host> starts a passage for the nearby party. Each game hour rolls EVENTS: a script function, LOAD MOB <spec>, or CATALOG <encounter table>. A function returning PAUSE waits for JOURNEY RESUME. Combat pauses travel. Saves retain elapsed hours, remaining leg time, scenes and individual passengers.\n\r\
Missing/dead/disconnected passenger policies are checked before advancing or arriving. WAIT pauses without spending time; CONTINUE releases the seat. RESCUE obeys movement checks. RETURN brings the present party to the origin; refused returns stay paused. Saved fare receipts support full or unused-time refunds once per payer. Defaults: MISSING=WAIT DEAD=CONTINUE DISCONNECTED=TRAVEL CANCEL=HERE REFUND=NONE.\n\r\
JOURNEY_PROG START|HOUR|ARRIVE|CANCEL|ALL: $g is the stage, $0 completed game hours and $1 the destination room ID.

PROP_WAYPOINT=\
Property: Prop_Waypoint\n\r\
Targets: Rooms, Items\n\r\
Parameters: NETWORK=[name] NAME="[destination]" ID=[stable author ID] ALIASES=[old IDs] LEGACYKEYS=[old tokens] DISCOVER=ENTER|TOUCH|RITUAL|QUEST SCOPE=CHARACTER|PROFILE COST="mana|moves|gold [number]" TIME=[game hours] MASK="[mask]" MSG="[text]" RITUAL=[function] QUEST="[quest name]"\n\r\
TRAVEL lists discovered destinations in the current network and TRAVEL <name> moves the nearby party. Discovery is saved per character, or shared with the account/profile. ID keeps the key stable when a waypoint is moved or renamed. TRAVEL ATTUNE checks masks and ritual/quest requirements. TOUCH and USE activate touch waypoints. Cost is charged once, after every passenger passes entry checks.

BEHAVIOR_TRANSPORTLINE=\
Behavior: TransportLine\n\r\
Targets: Navigable vessels, rideables, mounted MOB drivers\n\r\
Parameters: STOPS="[room IDs or port names separated by semicolons]" WAIT=[ticks] DEPART=[game hours, comma separated] ROUND=LOOP|BACK FARE=[price] FARES="[stop:price,...]" PARTY=LEADER|EACH PETS=[price] CARGO=[price per 100 lbs] PASSENGERONLY=true SIGN="[item name]" BOARDCALL="[text]" DEPARTMSG="[text]" ARRIVEMSG="[text]"\n\r\
Routes between stops with the ordinary movement system. DEPART replaces WAIT with calendar departure hours. BACK reverses at endpoints; LOOP cycles. Messages substitute $stop and $next. SIGN publishes the timetable at stops; TIMETABLE also shows it. Progress, direction, departure and arrival count are saved.\n\r\
Generated ticket and crew-only helm properties are temporary; explicit authored properties take priority. PARTY=LEADER pays for the group, EACH uses individual fares. WAIT UNTIL ARRIVAL stops at a line arrival.

TRANSPORT_SCRIPTING=\
Commands: MPSAIL <vessel> TO <room|area|port>, or <directions>; MPANCHOR <vessel> UP|DOWN; MPMOVEVESSEL <vessel> <room>; MPBOARD <who> <vessel> [interior room]; MPHITCH <item> <mount>; MPUNHITCH <item>. Quote multiword arguments with single quotes.\n\r\
Functions in MOBPROG and JavaScript: ABOARD(who), RIDING(who), RIDERS(rideable), ISANCHORED(vessel), ISDOCKED(vessel), COURSE(vessel), VESSELROOM(vessel), SPEED(vessel), HULL(vessel). Vessel names resolve across the world.\n\r\
In JavaScript, use uppercase bridge names: VESSELROOM$("the Gull") returns a string value; ISANCHORED("the Gull") returns a boolean. MPBOARD carries the nearby party. MPMOVEVESSEL moves and docks without a voyage. MPHITCH requires co-location and refuses riding loops.

VESSEL_PACING=\
Generic navigable vessel stats: TICKSPERMOVE=[at least 1], TICKSPERTURN=[at least 1], WEATHERSPEED=true|false, FIXEDINTERIOR=true|false. Set with MODIFY or MPSET; catalog and XML templates retain them.\n\r\
Copies receive unique interior area names and room IDs unless FIXEDINTERIOR is true. Use a fixed interior only when deliberately preserving one authored name.
