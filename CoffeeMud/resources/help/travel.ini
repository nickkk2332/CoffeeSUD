TRAVEL=\
Usage: TRAVEL [destination name | ATTUNE]\n\r\
At a waypoint, TRAVEL lists the places you have discovered in its network. TRAVEL <name> takes your nearby party there. The waypoint may require mana, movement, money or time.\n\r\
TRAVEL ATTUNE discovers the waypoint if you meet its mask and ritual or quest requirements. TOUCH or USE can attune touch-activated waypoints.

JOURNEY=\
Usage: JOURNEY [host | RESUME | CANCEL]\n\r\
JOURNEY <host> begins an authored passage with your nearby party. With no name, it shows your current progress or starts a passage here.\n\r\
Travel takes game hours; fights and scenes can pause it. RESUME continues after a scene, or retries arrival. CANCEL ends the journey where you currently are. Saves keep your progress.

PORTS=\
Usage: PORTS\n\r\
Lists the named ports your character knows. A hidden port may require a chart, tattoo or other qualification.\n\r\
Aboard a navigable vessel, COURSE TO <port>, SAIL TO <port> or DRIVE TO <port> sets a route. Room IDs and Sea Charting points (CHART 2) are also accepted. The helm must be available to you.

TIMETABLE=\
Usage: TIMETABLE [line name]\n\r\
Shows the position, next stop and departure of scheduled transport lines and moving rooms. A line may also publish its timetable on a sign.\n\r\
Aboard a ferry or coach, WAIT UNTIL ARRIVAL waits for its next stop.

STABLE=\
Usage: STABLE [mount name | LIST]\n\r\
At a stable keeper, STABLE <mount> leaves an eligible mount in their care; LIST shows your mounts in this stable network. With no name, STABLE lists your mounts.\n\r\
RETRIEVE <mount> collects it. A sister stable can charge a send fee as well as accrued keep. Only the owner can retrieve it. Stable keepers also understand these requests when spoken to. For the ranger mount skill, use STABLEMOUNT.

RETRIEVE=\
STABLE

TOUCH=\
Usage: TOUCH [waypoint name]\n\r\
Touches a waypoint here and attempts to attune it. With no name, touches the waypoints currently here. USE also activates a touch waypoint. TRAVEL lists your discovered destinations.
