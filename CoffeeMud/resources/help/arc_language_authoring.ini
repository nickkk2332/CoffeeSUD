LANGUAGE_AUTHORING=\
World languages and vocabulary\n\r\
GenLanguage supports WORDFILE, SUFFIXES, SYLLABLES, KEEPWORDS, KEEPNAMES, \
WRITTENNAME and TRANSLATESCRIPT. WORDFILE loads WORD=translation lines from \
world/vocab/languages/. Inline HASHEDWORDS wins over the file. SUFFIXES uses \
S:en,ED:ka; SYLLABLES uses comma-separated banks separated by /.\n\r\
INTERPRETS=Elvish(60),Sylvan(30) grants partial understanding at the language's \
proficiency times the percentage. Hearing, reading, scripts and inline LANG \
inscriptions share comprehension, including translators on the listener, \
carried items and room. WRITTENNAME names its script.\n\r\
TRANSLATESCRIPT defines translate(word,language), optionally garble(text,count). \
Return null to use dictionaries. Normal JSCRIPTS approval and runtime limits apply.\n\r\
See also: PROP_MONOLINGUAL, PROP_LANGUAGEIMMERSION, PROP_LOCALLISTS, \
PROP_WEAPONMESSAGES, WORLD_VOCABULARY, LANGUAGE_SCRIPTING.

GENLANGUAGE=LANGUAGE_AUTHORING

PROP_MONOLINGUAL=\
Property   : Prop_Monolingual\n\r\
Targets    : Mobs\n\r\
Parameters : LANGUAGES=Orcish,Goblinese CONFUSED="<S-NAME> grunt(s) and shrug(s)."\n\r\
Removes automatic Common comprehension. The listed languages are understood \
fully. Learned languages and translators still apply. Unknown speech reaches \
NOTUNDERSTOOD_PROG instead of SPEECH_PROG or MudChat. An optional CONFUSED line \
is shown. If no foreign language is selected, replies use the first declared \
language. Prop_LanguageSpeaker also accepts UNDERSTANDS=ONLY for its LANGUAGE.

PROP_LANGUAGEIMMERSION=\
Property   : Prop_LanguageImmersion\n\r\
Targets    : Areas, Rooms, Mobs, Items\n\r\
Parameters : LANGUAGE=Orcish HEAR=1 READ=3 CHANCE=20% START=5 MAX=60 GRANTAFTER=25 ID=stable-id ALIASES=old-id LEGACYKEYS=old-token\n\r\
LANGUAGE=ANY covers all languages. HEAR and READ give proficiency gains per \
successful exposure; CHANCE is checked per exposure. Unknown languages can be \
granted at START after GRANTAFTER exposures, within MAXLANGUAGES. Knowledge \
grows to MAX, immediately updating live effects. Exposure counters and learned \
abilities survive saves. The property can be carried, granted to a creature, \
or placed on the room or area where immersion happens.

PROP_LOCALLISTS=\
Property   : Prop_LocalLists\n\r\
Targets    : Areas, Rooms, Mobs\n\r\
Parameters : LOAD=vocab/lists_underdark.ini or KEY="value" ...\n\r\
Keys: TOD_CHANGE_OUTSIDE, TOD_CHANGE_INSIDE, HEALTH_CHART, DAMAGE_WORDS, \
WEAPON_HIT_DESCS, WEAPON_MISS_DESCS, CORPSE_BLURBS, MAGIC_WORDS, GAIT_LIST.\n\r\
Inline values override LOAD. Lookup tries the creature, room, area, parents, \
then global lists. LOAD resolves under world/vocab/. Lists use the stock \
lists.ini format: comma-indexed entries, pipe alternatives, semicolon grid \
rows. Health has eleven entries using <MOB>. Hit and miss text has six stock \
attack categories. DAMAGE_WORDS accepts flat severity words or a stock grid. \
Weapons use the wielder's context, including unowned racial natural weapons. \
Prop_SkyText overrides its own time-of-day text first.

PROP_WEAPONMESSAGES=\
Property   : Prop_WeaponMessages\n\r\
Targets    : Weapons, including racial natural weapons\n\r\
Parameters : HIT="<S-NAME> sear(s) <T-NAMESELF> with <TOOLNAME>: <DAMAGE>." \
MISS="<S-NAME> swing(s) wide." DAMAGEWORDS="singes,scorches,burns,incinerates"\n\r\
HIT and MISS may contain pipe-separated random alternatives. Normal combat \
source, target and damage substitutions apply. This property's text wins over \
local hit/miss lists; its damage words win over local damage words.\n\r\
GenRace HEALTHCHART holds eleven comma-separated health lines with <MOB> and \
pipe alternatives. CORPSEBLURBS uses cause=phrase|alternative pairs separated \
by semicolons, such as BURNING=molten gears;ALL=a heap of springs. Empty fields \
retain HEALTHRACE and local/global fallbacks. Both fields are in MODIFY RACE.

LANGUAGE_SCRIPTING=\
MPLEARNLANG who language N|+N|-N [FORCE]\n\r\
MPSAYIN language text\n\r\
UNDERSTANDS(who language) returns true/false; UNDERSTANDS$(who language) \
returns effective proficiency from 0 to 100. Both count related languages \
and translators. MPLEARNLANG sets or adjusts knowledge and live effects, \
respecting MAXLANGUAGES for new languages unless FORCE is supplied. MPENABLE \
also updates live effects and checks the cap. MPSAYIN restores the prior \
speaking language after saying one line.\n\r\
NOTUNDERSTOOD_PROG [language|ANY] [p pattern] runs on the listener when \
comprehension is zero. $0 is garbled speech; $g is its language. The optional \
pattern matches the garbled speech. ISSPEAKING($n) names that event's language, \
and ISSPEAKING($n Common) tests it. Unknown speech does not reach SPEECH_PROG \
or MudChat. Common is understood unless explicitly restricted.

MPLEARNLANG=LANGUAGE_SCRIPTING
MPSAYIN=LANGUAGE_SCRIPTING
NOTUNDERSTOOD_PROG=LANGUAGE_SCRIPTING
UNDERSTANDS=LANGUAGE_SCRIPTING
UNDERSTANDS$=LANGUAGE_SCRIPTING

WORLD_VOCABULARY=\
World vocabulary files live under world/vocab/ and use UTF-8.\n\r\
Glossary: glossary.ini uses term=replacement, with whole words and preserved \
capitalization. gold coin(s)=crown(s) supports plurals. Add ;SCOPE=HELP or \
;SCOPE=SCORE to restrict a rule, and ;NOT: Archon Hall to exempt a phrase. \
A standalone SCOPE=ALL|HELP|SCORE or NOT: line changes subsequent defaults. \
Prefix FINAL to a term (or append ;FINAL) for final output only. Normal rules \
run on translated messages and help/score output.\n\r\
Inline inscriptions: use a LANG tag with the language ID, optional NOTE \
attribute, body and closing /LANG tag, using CoffeeMud's caret-angle markup. \
Unknown readers see foreign text and NOTE; known readers also see a partial \
or full translation. Descriptions, readable text, echoes and help support it.\n\r\
Socials: vocab/socials.txt loads after stock; vocab/socials.ini sets \
STOCK=ALL|NONE|comma-list and REMOVE=comma-list. World socials can reintroduce \
a removed name. Builder SOCIAL edits save a world snapshot with STOCK=NONE. \
Prop_Socials LOAD= checks world/vocab/ before resources.\n\r\
Help: stock files load alphabetically, then vocab/help/*.ini alphabetically, \
then the builder world_help.ini/arc_world_help.ini override. World entries win. arc_*.ini contains Archon help. hide.txt lists stock keys \
to hide; settings.ini accepts HIDE=CLANS,CHANNELS. ARC:KEY hides only Archon \
help. Builder HELP/AHELP edits write world_help.ini/arc_world_help.ini. \
Final builder deletions use vocab/help/deleted.txt; ARC:KEY is Archon-only. \
Saving a recreated entry clears its deletion. Archons see the selected source. \
WORLD RELOAD ASSETS clears vocabulary/help/social caches; WORLD CHECK \
ONLY=VOCAB,LORE,TEMPLATES,ROUTES,IDS validates authoring assets. See docs/languages.md for examples.
