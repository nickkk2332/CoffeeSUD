 - ISDEV()  if this is a developer's game (started with DEV=1).\n\r\
 - ISBUILDER()  if this is builder mode (started with BUILDER=1).\n\r\
 - ISTURNBASED()  if time is turn-based (TIMEMODE TURNS).\n\r\
