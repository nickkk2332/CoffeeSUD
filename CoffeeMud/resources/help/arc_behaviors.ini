BEHAVIOR_COMMONSPEAKER=\
Behavior   : CommonSpeaker\n\r\
Targets    : MOBs\n\r\
Parameters : ([LANGUAGEID])\n\r\
Example    : \n\r\
Example    : Orcish\n\r\
Description: \n\r\
Without parameters, this behavior makes sure that a mob is always speaking Common, \
even if it should be a race other than Human, or it should be polymorphed.  Another \
language may also optionally be specified.

BEHAVIOR_FIGHTFLEE=\
Behavior   : FightFlee\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, and a percent chance\n\r\
Example    : min=10 max=20 chance=75\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob or item with this behavior will flee during combat.

BEHAVIOR_FIERYROOM=\
Behavior   : FieryRoom\n\r\
Targets    : Rooms\n\r\
Parameters : min, max ticks, a percent chance, flags and strings\n\r\
Example    : min=5 max=10 chance=100;damage=77 Title="A Horribly \n\r\
             Blackened Spot" Description="This place was once just like \n\r\
             any part of the road.  Now it is nothing more than a sooty pit." \n\r\
             NOSTOP eqchance=50\n\r\
Description: \n\r\
This behavior makes a room operate like it is on fire.  This can include dealing direct \
damage to players, burning flammable equipment and making non-flammable equipment heat \
up (i.e. is dropped), emote that it is burning, and eventually turn into a burnt-out \
room. \n\r\
The first parameter can be empty for defaults, \
or may contain a setting for minimum ticks (min=10), maximum ticks (max=20), and \
the percept chance of occurrence after the random number of ticks has expired \
(chance=25).\n\r\
\n\r\
Additional Settings and Flags: \n\r\
DAMAGE=XXX         - The amount of damage dealt to inhabitants every behavior tick \n\r\
TITLE=[text]       - The Room Display to change the room to when done burning \n\r\
DESCRIPTION=[text] - The Room Desc to change the room to when done burning \n\r\
EQCHANCE=XXX       - The unlikeliness of EQ bursting into flames or heating up.\n\r\
BURNTICKS=XXX      - How many behavior ticks to keep burning (Moot with NOSTOP)\n\r\
NOSTOP             - Prevent the room from ever burning up.  TITLE, DESCRIPTION and \n\r\
                     BURNTICKS become irrelevant\n\r\
NONPC              - Don't deal damage or eq burn/drop to NPC's\n\r\
NOFIRETEXT         - Don't display burning emotes while the room is burning.\n\r\
\n\r\
All of the parameters are optional. Defaults are: \n\r\
DAMAGE=10 \n\r\
TITLE="A Charred Ruin" \n\r\
DESCRIPTION="Whatever was once here is now nothing more than ash." \n\r\
EQCHANCE=0  (no default Eq destruction) \n\r\
BURNTICKS=12

BEHAVIOR_ENCOUNTERRESET=\
Behavior   : EncounterReset\n\r\
Targets    : MOBs, Rooms\n\r\
Parameters : (RADIUS=[N]) (IDLE=[N]) (HEAL=[N]) (HOME=true/false) (DESPAWNADDS=true/false) (ROOM=true/false)\n\r\
Example    : RADIUS=1 IDLE=5 HEAL=100\n\r\
Example    : IDLE=10 ROOM=true\n\r\
Description: \n\r\
CoffeeSUD: a boss that the party walks away from resets.  After a fight, when none of those \
it fought has been within RADIUS rooms (1; 0 for its own room) for IDLE ticks (5), it goes \
back to its start room (HOME, true), heals HEAL percent of its hit points (100) and all its \
mana and moves, sheds what was cast on it to harm it, loses the adds it summoned \
(DESPAWNADDS, true: NPCs following it that have no home, or with the tag SUMMONED), forgets \
its threat, and its scripts' RESET_PROG runs.  ROOM=true resets every NPC of its start room \
with it; on a room, every NPC there is reset together.

BEHAVIOR_ESCORTEE=\
Behavior   : Escortee\n\r\
Targets    : MOBs\n\r\
Parameters : DEST=[ROOM ID] (MODE=LEAD/FOLLOW) (WAITFOR=LEADER) (WAITCALL=[N]) (WAITMSG="[TEXT]") (PANIC=FLEE/HIDE/COWER) (AVOID=[ROOM ID],...) (TALK="[ROOM ID]:[TEXT]") (ONARRIVE="[MOBPROG]") (ONDEATH="[MOBPROG]") (TIMEOUT=[N] ONTIMEOUT="[MOBPROG]")\n\r\
Example    : DEST=Riverford#1 MODE=LEAD WAITFOR=LEADER PANIC=COWER TALK="Bridge#3:They say trolls live under here." ONARRIVE="say Thank you, friends!;mpsetvar $n ESCORTED 1"\n\r\
Description: \n\r\
CoffeeSUD: an NPC escorted to DEST.  Its leader is the one it follows when the escort \
begins (a quest's MPFORCE $i follow $n); until then it waits.  MODE=FOLLOW (the default): it \
follows its leader; MODE=LEAD: it stops following and walks the way itself, a step a tick, \
and the party follows it.  WAITFOR=LEADER: while its leader is not with it, it does not go \
on, and after WAITCALL ticks (3) it calls WAITMSG ("Wait for me!").  PANIC: when attacked \
it flees, dives for cover or cowers (both stop the fight).  AVOID: rooms (by ID, or the end \
of one) it will not go into.  TALK (and TALK1= to TALK9=): a remark the first time it comes \
to that room.  ONARRIVE, ONDEATH and, after TIMEOUT ticks, ONTIMEOUT: MOBPROG lines, ; between \
them, run with its leader as $n: a word, MPSETVAR, MPCALLFUNC, MPQUESTWIN.  Arrived, it stops \
following.  Its leader, arrival and remarks are kept in a saved game.

BEHAVIOR_EVILEXECUTIONER=\
Behavior   : EvilExecutioner\n\r\
Targets    : MOBs\n\r\
Parameters : PLAYERS\n\r\
Example    : \n\r\
Description: \n\r\
The mob with this behavior will attack any good or paladin non-player mob it \
detects.  With the Players parameter, it will even attack players as well.

BEHAVIOR_FOLLOWER=\
Behavior   : Follower\n\r\
Targets    : MOBs, Items\n\r\
Parameters : min, max, pct (inv) (group) (nofollowers) (wander)\n\r\
Parameters : (follow mask) (name=[name])\n\r\
Example    : \n\r\
Example    : min=1 max=1 chance=50 -race +elf\n\r\
Example    : group nofollowers -race +elf +gnome\n\r\
Example    : min=4 max=20 chance=100 inv -race +elf +gnome\n\r\
Description: \n\r\
The mob with this behavior will follow any other mob that leaves the room.  Following \
normally happens on the tick, but if minticks and maxticks are -1 and GROUP is not set, it will be instant. A chance \
percentage (1-100) parameter may be given to better randomize the opportunity.  A \
GROUP flag may also be included to make the mob join the targets group instead of \
merely following them out of the room.  The rate of non-grouping following is \
dictated by the min and max ticks.  The NOFOLLOWERS flag will make sure that \
this behavior does not trigger when the mob has someone following him/her. \
The WANDER flag may be added to allow the mob to leave their home area.\n\r\
\n\r\
An item with this behavior will also follow mobs around, depending upon \
whether the INVENTORY flag is in the parameters or not.  If it is, then \
the item will reappear in the inventory of the first person to pick it \
up whenever it is dispensed with.  If the INVENTORY flag is not used, it \
will always appear in the same room as the first it comes across.  The \
rate of reappearance is dictated by the min and max ticks. Items with \
this behavior can not be sold to shopkeepers.\n\r\
\n\r\
A NAME may be given to limit the person followed to only that name. \
A mask may also be given to define what sort of targets are eligible \
to be followed by the mob or item.  \n\r\
See AHELP ZAPPERMASK, where allowed is followed, and disallowed is ignored. 

BEHAVIOR_GATEGUARD=\
Behavior   : GateGuard\n\r\
Targets    : MOBs\n\r\
Parameters : a list of masking parameters described below\n\r\
Example    : -class +mage -race +elf -evil\n\r\
Description: \n\r\
When this mob is standing next to a doorway and a player enters, the mob will open \
the door for the player, and close it after them.  The guard will also lock the door \
at night, if the door has a lock.  The guard will behave according to whether \
any players in the room meet the parameters.  If no parameter is given, the \
guard will always follow the behavior. Valid parameters include:  \n\r\
keeplocked (if the door has a lock, the mob will make sure it remains so \n\r\
allnight (does not operate differently at night than the day)\n\r\
See AHELP ZAPPERMASK for masking people away from the gate. 

BEHAVIOR_GENBEHAVIOR=\
Behavior   : GenBehavior (a generic behaviour: CREATE BEHAVIOR [ID])\n\r\
Targets    : what its CANIMPROVE says: MOBs, ITEMs, ROOMs, AREAs, EXITs\n\r\
Parameters : [NAME]=[VALUE]..., over the defaults its PARMS field gives\n\r\
Example    : TollKeeper price=5 exit=west\n\r\
Description: \n\r\
CoffeeSUD: a behaviour defined as data, in builder mode.  CREATE BEHAVIOR TollKeeper makes one and \
opens its editor: NAME, HELP (what AHELP TOLLKEEPER shows), CANIMPROVE (MOBS, ITEMS, ROOMS, AREAS, \
EXITS, with commas), PARMS with their defaults (price=20 exit=north), SCRIPT, ACCOUNT (what it says \
it is doing) and VARSCOPE (empty: its variables are its host's, as a Scriptable's; *: its own).  The \
script is MOBPROG, with <SCRIPT> JavaScript in it if it likes, or LOAD=[FILE]; it reads its \
parameters as PARM(price), $%PARM(price)% in text, IF PARM(free) (set, and not 0 or false), and \
parm('price') in JavaScript.  Then TollKeeper price=5 exit=west goes wherever a behaviour ID goes: \
on a mob or item, MPBEHAVE, a quest's GIVE BEHAVIOR, a faction or a plane.  Each copy has its own \
engine and its own values; all share the definition, so MODIFY BEHAVIOR TollKeeper changes every \
one at once.  MODIFY BEHAVIOR [ID] [FIELD] [VALUE] sets one field without the editor (\\n in a \
SCRIPT is a new line).  WHEN=, TOD= and HOURS= work in its parameters as in any behaviour's.  \
DESTROY BEHAVIOR [ID] removes it; what has it keeps it until the world is loaded again.  SAVE \
writes it to the world's custom/behaviors/ folder, its script in a file beside it.

BEHAVIOR_GETSALLEQUIPPED=\
Behavior   : GetsAllEquipped\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This is a deprecated behavior, but listed here in case someone can think of \
a new use for it.  This behavior causes the mob, on reset, to grab everything \
in its default room, and attempt to wear it.  He also does this whenever someone \
in the room dies, so its also good for making the mob autoloot.

BEHAVIOR_GOODEXECUTIONER=\
Behavior   : GoodExecutioner\n\r\
Targets    : MOBs\n\r\
Parameters : (PLAYERS)\n\r\
Example    : \n\r\
Description: \n\r\
The mob with this behavior will attack any evil or thief non-player mob it \
detects.    With the Players parameter, it will even attack players as well.

BEHAVIOR_GOODGUARDIAN=\
Behavior   : GoodGuardian\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This is a very active behavior.  If the mob detects any evil mob attacking \
a good mob in the same room, or an adjacent room, it will attack the evil \
mob.  If evil mobs are fighting, it will do nothing.  If two good or neutral \
mobs are fighting, it will stop the fight.

BEHAVIOR_GUARD=\
Behavior   : Guard\n\r\
Targets    : MOBs\n\r\
Parameters : ([MOB Name])\n\r\
Example    : \n\r\
Example    : Bob\n\r\
Description: \n\r\
If ANY mob, player or non-player, is attacked in the same room as the mob with \
this behavior, this mob will come to the victim's defence.  However, if this behavior \
has a parameter, then they will only come to the aid of players/mobs with that name.

BEHAVIOR_HEALER=\
Behavior   : Healer\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, and a percent chance\n\r\
Example    : min=10 max=20 chance=75\n\r\
Description: \n\r\
The mob with this behavior gains Cure Disease, Cure Light Wounds, Cure \
Serious Wounds, Bless, and Sanctuary.  At random, the mob will cast these \
spells on any player-mobs in the room.\n\r\
\n\r\
CoffeeSUD: SPELLS=[ID],[ID] its own spells in place of those six; HEALAT=[N] heals only those \
under N% of their hit points, the most hurt first (its cures, for poison and disease, first \
of all); TARGET=GROUP (its group) or TARGET=MASK:"[ZAPPER MASK]" whom it heals, NPCs too.  With \
any of them it chooses whom it heals rather than at random.\n\r\
Example    : min=1 max=2 chance=100 HEALAT=70 SPELLS=Prayer_CureSerious,Prayer_CureDisease TARGET=MASK:"-NPC"

BEHAVIOR_HIRELING=\
Behavior   : Hireling\n\r\
Targets    : MOBs\n\r\
Parameters : price to hire;minutes of service\n\r\
Example    : 10000;30\n\r\
Description: \n\r\
Allows a mob to hire him or herself out for a given amount of time. \
The first parameter is the price to hire the mob, followed by a semicolon \
and the number of minutes that amount of money purchases.  Additional money \
may be given by the player to extend the time.  When the time expires, the \
mob returns to his or her start room.\n\r\
\n\r\
CoffeeSUD: terms, KEY=value after them (quote a value with spaces): KEYWORDS=[WORD],... the \
words that ask its terms (HIRE, HIRELING, WORK, WORKS, TIME, AVAILABLE); MSG_OFFER (@x1 the \
price, @x2 the term), MSG_HIRED (@x1 the term, @x2 its skills), MSG_REFUSE, MSG_EXPIRE and \
MSG_NOORDER, its own lines (Prop_NPCLines rewords the stock ones too); CONTRACT=MINUTES (the \
second number), DAYS (that many game days), "QUEST:[NAME]" (until the employer's quest is won, \
failed or dropped) or UNTILFIRED (until SAY FIRED); UPKEEP=[N] wages a game day, taken from \
the employer, who after two unpaid days is left; FLEEHP=[N]: below N% of its hit points in a \
fight it quits, unless its opinion of the employer (Prop_Affinity) is at least LOYAL=[N] (25); \
REFUSE=[COMMAND],... orders it will not take.  The contract and wages are kept in a saved \
game.  HIRE [MOB] shows its terms as a menu, and HIRE [MOB] PAY pays its price.\n\r\
Example    : 500;0;CONTRACT="QUEST:goblinwar" UPKEEP=5 MSG_HIRED="My blade is yours till the goblin king falls."

BEHAVIOR_INSTANTDEATH=\
Behavior   : InstantDeath\n\r\
Targets    : MOBs, Items, Rooms, Areas\n\r\
Parameters : mask, min, max ticks, and a percent chance\n\r\
Example    : min=10 max=20 chance=75 mask="-RACE +ORC"\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
item owner with this behavior will be killed.  MOBs and Rooms with this \
behavior will kill all their inhabitants.  MOBs do not \
kill until attacked, food when eaten, drinks when sipped \
items when they are picked up, weapons when they are first wielded, \
or armor when it is first worn.  Rooms merely need to be entered. \n\r\
See AHELP ZAPPERMASK, where allowed is killed, and disallowed is spared. 

BEHAVIOR_ITEMGENERATOR=\
Behavior   : ItemGenerator\n\r\
Targets    : Areas, Rooms, Containers, Mobs\n\r\
Parameters : [min/max ticks] [% chance] [min/max items/dups] [enchanted=%][mobs] [locale mask]; [mask]\n\r\
Example    : min=10 max=20 chance=75 minitems=1 maxitems=10 maxdups=0;-LEVELS +>10\n\r\
Example    : minitems=10 maxitems=20 MOBS -ALL +CITY;-MATERIAL +IRON +BRONZE\n\r\
Example    : minitems=10 maxitems=20 enchanted=20;-NAME "+Short Sword"\n\r\
Description: \n\r\
This behavior will generate a list of items from the standard common skills. It \
will also add random enchantments and curses to items a percentage of the time \
dictated by the enchanted parameter (default=10).  Items are selected from the \
list on a pseudo-random basis, with the chance weighted in favor of the least \
valuable items in favor of the most valuable.  This is to decrease the chances \
of a plethora of Spidersteel swords.\n\r\
\n\r\
The parameters \
before the semicolon describe the rate and amount of items generated.  \
The room or area will attempt to generate an item every (min) to (max) \
ticks, assuming the percent chance (chance) is made.  It will then generate \
at least the minimum (minitems) number of items from the list, but \
never more than the maximum (maxitems) number of monsters.  Duplicates \
are allowed unless (maxdups) is set to some value.  \
Items taken away will be replaced by this behavior, even if \
they are looted.  This behavior will generate items when on a room, in the \
inventory when on a mob, or in the shop when on a shopkeeper.  If on an area, a random room in \
the area will be picked for the item. The TYPE of room in that area which \
will be selected for population may also be specified. \
-ALL to disallow all locales, followed by +AIR +CITY +JUNGLE (etc) to \
reallow certain locales.  -CITY -UNDERWATER and others may be used to \
restrict certain locales.  If no locale types are specified, then all rooms \
in an area will be populatable.  \
Valid locates include: "STONE",	"WOODEN", "CAVE", "MAGIC", "UNDERWATER", "AIR", \
"WATERSURFACE",	"METAL", "CITY", "WOODS", "ROCKY", "PLAINS", "UNDERWATER", \
"AIR", "WATERSURFACE", "JUNGLE", "SWAMP", "DESERT", "HILLS", "MOUNTAINS". \
If the behavior is on a mob, or the MOBS flag is given in the parameters, then \
the item will be placed on a mob IF POSSIBLE (if the behavior is on an area, and \
a room with no mobs is randomly selected, it may not happen).  Items placed on \
mobs will be automatically worn if possible. \n\r\
\n\r\
The parameters after the semicolon are a mask to help select what kind of items \
are generated for the several rooms or whatever.  For the mask flags, see \
AHELP ZAPPERMASK, where allowed is generated, and disallowed is not. 

BEHAVIOR_ITEMMENDER=\
Behavior   : ItemMender\n\r\
Targets    : MOBs\n\r\
Parameters : (COST="[FORMULA]")\n\r\
Example    : COST="100+@x1"\n\r\
Description: \n\r\
For a price, this mob will repair damaged weapons and armor.  \
The mender will NOT work for Archons, however. \
\n\r\
The optional COST parameter can be used to change the pricing \
formula.  Variables are: @x1=level, @x2=value, @x3=condition(0-100), \
@x4=magical=1.0/non-magical=0.0. 

BEHAVIOR_ITEMREFITTER=\
Behavior   : ItemRefitter\n\r\
Targets    : MOBs\n\r\
Parameters : (COST="[FORMULA]")\n\r\
Example    : COST="100+@x1"\n\r\
Description: \n\r\
For a price, this mob will resize armor to fit the mob.  \
The mender will NOT work for Archons, however.\
\n\r\
The optional COST parameter can be used to change the pricing \
formula.  Variables are: @x1=level, @x2=value, @x3=condition(0-100), \
@x4=magical=1.0/non-magical=0.0. 


BEHAVIOR_ITEMIDENTIFIER=\
Behavior   : ItemIdentifier\n\r\
Targets    : MOBs\n\r\
Parameters : (COST="[FORMULA]")\n\r\
Example    : COST="100+@x1"\n\r\
Description: \n\r\
For a price, this mob will identify items.  \
They will NOT work for Archons, however.\
\n\r\
The optional COST parameter can be used to change the pricing \
formula.  Variables are: @x1=level, @x2=value, @x3=condition(0-100), \
@x4=magical=1.0/non-magical=0.0. 


BEHAVIOR_MAGENESS=\
Behavior   : Mageness\n\r\
Targets    : MOBs\n\r\
Parameters : (SUBCLASS NAME) (PROFICIENT) (NOSTATS) (NOCOMBATSTAT)\n\r\
Parameters : (OFFENSIVE,DEFENSIVE,MIXEDOFFENSIVE,MIXEDDEFENSIVE)\n\r\
Parameters : (MINTICKS=[NUM] MAXTICKS=[NUM] CHANCE=[NUM])\n\r\
Parameters : (BSIZE=[NUM])\n\r\
Example    : \n\r\
Example    : Mage\n\r\
Example    : Illusionist MIXEDDEFENSIVE\n\r\
Description: \n\r\
An extension of CombatAbilities, this behavior makes the mob a Mage by class, \
and gives the mob mage spells appropriate to its level.  After \
this behavior has triggered, it will often require a RESET for any \
level changes to the mob to take over.\n\r\
Use the proficient flag to make all skills at 100% instead of level-based. Use \
the offensive/.../mixeddefensive flags to influence skill choices. \
This behavior should not be used WITH any of the other CombatAbilities behaviors, \
such as Fighterness, Thiefness, Mageness, Clericness, Druidness, or CombatAbilities. \
It should be used alone on a mob.\n\r\
Also, be aware that this behavior will modify the mobs stats to better reflect the class, \
so any additions or removals of this behavior should be accompanied by a room reset after \
saving, and manually checking to make sure the combat stats are as desired.

BEHAVIOR_ITEMUPGRADER=\
Behavior   : ItemUpgrader\n\r\
Targets    : MOBs, Items\n\r\
Parameters : UPGRADE1="FROM=[NAME]|tag:[TAG]|catalog:[ITEM] TO=catalog:[ITEM]/ADJ=\"dam+[N] att+[N] arm+[N]\" (COST=[GOLD]) (MATERIALS=\"[NAME] x[N], [NAME]\") (LEVEL=[N]) (KEEP=[KEEPS]) (MSG=\"[TEXT]\")" (UPGRADE2..9=) (UPGRADES=world/upgrades.txt)\n\r\
Example    : UPGRADE1="FROM=notched TO=\"catalog:Starfall, the reforged blade\" COST=2000 MATERIALS=\"starmetal ingot x3\" LEVEL=20 KEEP=TAGS,STATE"\n\r\
Description: \n\r\
CoffeeSUD: a smith, or a workbench, that upgrades items along set paths.  Each row (UPGRADE1 to \
9, or one a line in the file UPGRADES names, the same keys) is FROM, the items it takes (a name, \
tag:X or catalog:X, | between), and TO, a catalog item it becomes in its place (held or worn as \
it was; KEEP as MPTRANSFORM's), or ADJ, the same item better (dam, att, arm, lvl).  COST is gold, MATERIALS what \
is used up (x3 for three), LEVEL the least level, MSG what is seen.  An item with \
Prop_UpgradePath carries its own row.  UPGRADE [ITEM] tells what it would take; UPGRADE [ITEM] \
CONFIRM does it.

BEHAVIOR_JSBEHAVIOR=\
Behavior   : JSBehavior\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : SCRIPT=[FILE] ([NAME]=[VALUE])...\n\r\
Example    : SCRIPT=world:js/props/bellringer.js EVERY=12\n\r\
Description: \n\r\
Runs a JavaScript file, as Prop_JScript does, that may define okMessage(host, \
msg) (false refuses the message), executeMsg(host, msg), tick(host, tickID), \
onAdded(host), onRemoved(host) and catchUp(host, ticks) (AHELP CATCHUP).  A behaviour is not asked for stat changes: \
Prop_JScript has those hooks.  What a hook changes in parms is written back to \
the behaviour's parameters.

BEHAVIOR_JSCRIPTABLE=\
Behavior   : JScriptable\n\r\
Targets    : Mobs, Items, Exits, Rooms, Areas\n\r\
Parameters : LOAD=[FILE] (SCOPE=[INDIVIDUAL/GLOBAL/NAME]), or the script itself\n\r\
Example    : LOAD=world:js/npc/ferryman.js\n\r\
Description: \n\r\
Scripts its host wholly in JavaScript.  The script defines the handlers it wants: \
onLoad, onGreet(who), onArrive(room), onLeave(who), onSpeech(who, text), onGive(who, \
item), onGet, onDrop, onWear, onRemove (who, item), onOpen, onClose, onLock, onUnlock \
(who, thing), onDeath(killer), onKill(victim), onDamage(who, amount), onCast(who, \
ability, target), onLook(who), onTick, onHour(hour), onDay(day), onCommand(who, verb, \
rest) (true handles a command typed near the host), canMessage(msg) (false refuses \
it), afterMessage(msg) and onReload(old).  Its other functions answer MPCALLFUNC and \
CALLFUNC.  The script has me, cm, CMMsg and state, the host's cm.store, saved with the \
game.  A SCOPE other than INDIVIDUAL shares one script among the hosts that name it.  \
guides/JavaScriptSUD.html has a ferryman.

BEHAVIOR_LINKEDWEATHER=\
Behavior   : LinkedWeather\n\r\
Targets    : Areas\n\r\
Parameters : [Area Name](;ROLLING)\n\r\
Example    : My Area\n\r\
Example    : My Area;ROLLING\n\r\
Description: \n\r\
This behavior forces the area to always mimic the weather of another area \
on your map.  That area is determined by the parameters.  The normal behavior \
is for the weather of the given area to always be the same as the linked area. \
If the area name in the parameters is followed by a semicolon and the word \
ROLLING, then the area instead will always take on the weather of the linked \
area on its next weather change, meaning that the linked area's weather will \
seem to "roll" into this area on every weather change.

BEHAVIOR_MEMORY=\
Behavior   : Memory\n\r\
Targets    : MOBs\n\r\
Parameters : (KIN="[MASK]") (TRACK=[NAME]:[REGEX]) (FORGET=[TIME]) (HOSTILEIF=[COND]) (GREETIF=[COND] GREET="[TEXT]") (REFUSEIF=[COND] REFUSE="[TEXT]") (SHARE=[AREA/MASK])\n\r\
Example    : KIN="-NAMES +villager" SHARE=AREA HOSTILEIF=KILLEDKIN>0 REFUSEIF=STOLE>0 REFUSE="Thief! Out!" GREETIF=HEALED>0 GREET="Welcome back, $n." FORGET=30d\n\r\
Description: \n\r\
CoffeeSUD: the NPC remembers what each character did: MET (with FIRSTMET and LASTMET, \
game dates), ATTACKED (once a fight), HURT (the damage), HEALED, GAVE (the value given), \
STOLE, KILLEDKIN (of those KIN fits), TALKED, and TRACK=NAME:regex (TRACK1= to TRACK9= \
for more), a count of what it sees them do that the regex fits.  Each is a script \
variable of the NPC, MEM_[FACT]_[NAME], so a script reads VAR($i MEM_ATTACKED_$n) or \
$<$i MEM_GAVE_$n>, and it is kept in a saved game.  FORGET=30d (or 12h) lets a fact fade \
that long, in game time, after it last grew.  HOSTILEIF: it attacks them on sight.  \
GREETIF with GREET: it greets them when they come in ($n is their name).  REFUSEIF with \
REFUSE: it will not buy, sell or teach for them.  A condition is FACT>N, FACT>=N, FACT=N \
or FACT<N, joined by & or |.  SHARE=AREA, or a mask, tells what it learns to the other \
Memory NPCs in its area (those the mask fits): rob one villager and the village knows.

BEHAVIOR_MIME=\
Behavior   : Mime\n\r\
Targets    : MOBs, Items, Exits, Rooms\n\r\
Parameters : min, max ticks, and a percent chance\n\r\
Example    : min=10 max=20 chance=75\n\r\
Description: \n\r\
This amazingly annoying Behavior makes the thing mimic any emotes or socials \
done by a player in the same room, back to that player.

BEHAVIOR_MOBEATER=\
Behavior   : MOBEater\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, and a percent chance to occur, and pct of hp acid dmg does\n\r\
Example    : min=4 max=8 chance=5 acidpct=50\n\r\
Description: \n\r\
This behavior allows a mob to eat other mobs or players, and digest them!  Great for dragons! \
You can set how often this occurs, and what % of the players max hp is taken from when when being \
digested in the stomach.  Another player must kill the mob with this behavior to free those \
being digested.  This behavior will not work at ALL unless the mob with this behavior is twice \
the weight of the target.

BEHAVIOR_MOBHELPER=\
Behavior   : MOBHelper\n\r\
Targets    : MOBs\n\r\
Parameters : ([MAX COMBATANTS]) (MSG="[ATTACK MESSAGE]")\n\r\
Example    : 5 MSG="OMG ATTACK!"\n\r\
Description: \n\r\
The mob with this behavior will come to the defence of any non-player mob \
which is attacked in its presence.

BEHAVIOR_COMBATASSISTER=\
Behavior   : CombatAssister\n\r\
Targets    : MOBs\n\r\
Parameters : mask of mobs to assist\n\r\
Example    : -RACE +Elf\n\r\
Example    : -NAME "+My Buddies"\n\r\
Example    : -CLANS "+My Clan"\n\r\
Description: \n\r\
The mob with this behavior will come to the defence of any other mob \
which is attacked in its presence and meets the mask defined above.  \n\r\
See AHELP ZAPPERMASK, where allowed is assisted, and disallowed is ignored. 

BEHAVIOR_MOBHUNTER=\
Behavior   : MOBHunter\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, room radius, a percent chance, mask of mobs to hunt\n\r\
Example    : min=600 max=1200 chance=99 radius=50 -RACE +Human\n\r\
Example    : min=50 max=1200 chance=75 -NAME "+Evil Wizards"\n\r\
Description: \n\r\
This behavior will cause the mob to seek out a victim within the RADIUS \
number of rooms from where he is.  The mob will then hunt down and \
assassinate the victim.  The mob will begin the hunt according to the \
frequency defined by the parameters.  The MIN and MAX parms decide \
the minimum number of ticks to wait between hunts, and the CHANCE parm \
determines the chance the hunt will begin at that time.  The RADIUS \
is the number of rooms away from the mobs current room in which a \
victim will be sought.  The rest of the parameters are a mask to \
determine who would make a good victim.  \n\r\
See AHELP ZAPPERMASK, where allowed is hunted, and disallowed is ignored. 

BEHAVIOR_MOBILE=\
Behavior   : Mobile\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, a percent chance, flags, locale parms\n\r\
Example    : min=10 max=20 chance=75 wander -air -underwater\n\r\
Example    : min=10 max=20 chance=75 opendoors\n\r\
Example    : min=10 max=20 chance=75 leash=3 opendoors\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will travel in a random available direction. \
Mobs will not leave rooms containing visible Archons and builders with the CMDMOBS \
security flag. \
The \
wander flag is required if the mob is allowed to leave his or her area. \
The opendoors flag will allow the mob to open closed doors when walking \
around, or to unlock locked doors if the mob has the key. \
The leash parameter will prevent the mob from getting too far from home. \
The TYPE of room from which the mob is restricted may also be entered. \
-ALL to disallow all locales, followed by +AIR +CITY +JUNGLE (etc) to \
reallow certain locales.  -CITY -UNDERWATER and others may be used to \
restrict certain locales.  The full locale list is: STONE, WOODEN, CAVE, \
MAGIC, UNDERWATER, AIR, WATERSURFACE, METAL , CITY, WOODS, ROCKY, \
PLAINS, JUNGLE, SWAMP, DESERT, HILLS, MOUNTAINS, SPACEPORT, SEAPORT

BEHAVIOR_MOBILEAGGRESSIVE=\
Behavior   : MobileAggressive\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, a percent chance, flags, message=[msg], and masks\n\r\
Example    : min=10 max=20 chance=75 -underwater -thief +elf\n\r\
Example    : min=10 max=20 chance=75 wander -air -elf\n\r\
Example    : min=10 max=20 chance=75 message="aha!" -air -elf\n\r\
Example    : min=10 max=20 chance=75 mobkill misbehave\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will travel in a random available direction. The mob \
will attack any player mob it comes across. They will be especially aggressive \
towards players within 16 levels of themselves in adjacent rooms. If no other parameters are given, \
the mob will attack anyone, anywhere. The wander flag is required if the \
mob is allowed to leave his or her area. The TYPE of room from which the \
mob is restricted may also be entered. -ALL to disallow all locales, \
followed by +AIR +CITY +JUNGLE (etc) to reallow certain locales.  \
-CITY -UNDERWATER and others may be used to restrict certain locales. \
The full locale list is: STONE, WOODEN, CAVE, \
MAGIC, UNDERWATER, AIR, WATERSURFACE, METAL , CITY, WOODS, ROCKY, \
PLAINS, JUNGLE, SWAMP, DESERT, HILLS, MOUNTAINS, SPACEPORT, SEAPORT. \n\r\
\n\r\
Masks may also be used to specify who the mob is likely to attack.  \
Mobs will not be mobile or aggressive towards Archons and builders with the CMDMOBS \
security flag. \
If no other masks are given, the mob will attack anyone within 8 levels. \n\r\
Valid aggressive masks include:  \n\r\
message=[msg] something for the mob to say whenever he's fixing to attack\n\r\
delay=x (makes the mob delay x ticks before looking for a victim) \n\r\
mobkill (makes this behavior attack mobs as well as players) \n\r\
nogang (makes this behavior pass over players already in combat) \n\r\
misbehave (makes this mob attack even when wounded or a follower) \n\r\
checklevel (makes this mob attack only those within 6 levels below him) \n\r\
BRIBE=[AMOUNT],[TICKS OF PEACE],[TICKS TO PAY] - this is a comma-delimited \n\r\
BRIBEPAYMSG=x, BRIBEPAIDMSG=x, (see also ahelp on AGGRESSIVE BRIBE)\n\r\
See AHELP ZAPPERMASK, where allowed is attacked, and disallowed is spared. 

BEHAVIOR_MOBILEGOODGUARDIAN=\
Behavior   : MobileGoodGuardian\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, a percent chance, flags, locale parms\n\r\
Example    : min=10 max=20 chance=75 wander -air -underwater\n\r\
Description: \n\r\
This is a very active behavior.  If the mob detects any evil mob attacking \
a good mob in the same room, or an adjacent room, it will attack the evil \
mob.  If evil mobs are fighting, it will do nothing.  If two good or neutral \
mobs are fighting, it will stop the fight. This mob is also mobile, which \
means the mob will move around the area. The wander flag is required if the \
mob is allowed to leave his or her area. The TYPE of room from which the \
mob is restricted may also be entered. -ALL to disallow all locales, \
followed by +AIR +CITY +JUNGLE (etc) to reallow certain locales.  \
-CITY -UNDERWATER and others may be used to restrict certain locales. \
The full locale list is: STONE, WOODEN, CAVE, \
MAGIC, UNDERWATER, AIR, WATERSURFACE, METAL , CITY, WOODS, ROCKY, \
PLAINS, JUNGLE, SWAMP, DESERT, HILLS, MOUNTAINS, SPACEPORT, SEAPORT.  \
Mobs will not leave rooms containing visible Archons and builders with the CMDMOBS \
security flag.

BEHAVIOR_MOBRESAVE=\
Behavior   : MOBReSave\n\r\
Targets    : MOBs\n\r\
Parameters : min, max ticks, a percent chance\n\r\
Example    : min=140 max=140 chance=100\n\r\
Description: \n\r\
This behavior allows the mob with it to be updated in the CoffeeMud database \
according to the frequency defined by min, max ticks.  This behavior is tricky \
to set up the first time. When you know you are going to want an updating mob in \
a room, you should first go to the room and create a GenMob with this behavior \
(no parameters needed).  Wait a few seconds, and you will see the GenMob that you \
created has disappeared.  Now you are free to add this behavior to one or more \
other mobs at your leisure.  Don't forget to resave the room when you are done!


BEHAVIOR_MOBTEACHER=\
Behavior   : MOBTeacher\n\r\
Targets    : MOBs\n\r\
Parameters : Char class name(s), ability name(s), expertise name(s), [pct%],\n\r\
Parameters : noteach flag, nocommon flag, noexps flag, or empty=teach all.\n\r\
Example    : mage evoker illusionist transmuter\n\r\
Example    : 100% mage 10% Thief_Steal NOCOMMON\n\r\
Example    : Spell_Sleep 5% Spell_Wish\n\r\
Example    : Spell_BurningHands\n\r\
Description: \n\r\
This behavior makes the mob suitable to teach skills, spells, prayers, \
songs, or expertises as specified in the parameters.  If the parameter is empty, the \
mob will be able to teach all abilities.  If the parameter contains the \
name of a character class, the mob will only teach abilities of that class. \
*Any* class may always practice with a MOBTeacher, but the mob may only \
teach those abilities for the character class the parameters describe.  \
The classes listed by mob teacher are NOT base classes.  To have a teacher \
able to teach skills from an entire base class, all sub-classes must be \
listed. \n\r\
Percentages may be included inside the parameters as well.  The percentage \
will always apply only to the character classes or spells listed after the \
percentage, not before.  Encountering another percentage entry will override \
the previous.  A percentage will dictate the chance that a given spell will \
be known by the teacher, or the chance that a particular spell in a given \
character class will be known. \n\r\
Two flags can also modify your list.  The NOCOMMON flag prevents the teacher \
from teaching common skills, even if they would normally be on his list.  The \
NOEXPS flag prevents the teacher from teaching expertises, even if he would \
normally qualify for them.\n\r\
If this behavior has NO parameters whatsoever, the mob will teach all basic \
skills. Expertises will only be taught if the mob otherwise qualifies for them \
himself, and Character Class changes will only be taught if the mob is that class. \
The noteach flag will prevent the mob from teacher or using all those awesome skills.

BEHAVIOR_MONEYCHANGER=\
Behavior   : MoneyChanger\n\r\
Targets    : MOBs\n\r\
Parameters : (CUT=[NUM]) (DEFAULT=[NUM]) ([CURRENCY]=[NUM])\n\r\
Parameters : (CUT=[NUM]) (SPACEMAXCUT=[NUM]) (SPACEMAXDISTANCE=[PCT])\n\r\
Parameters : (RATE.[CURRENCY]=+[PCT]/-[PCT])\n\r\
Example    : \n\r\
Example    : cut=5\n\r\
Example    : default=0 GOLD=5 INGITS=10\n\r\
Example    : cut=5 spacemaxcut=90 spacemaxdistance=35\n\r\
Example    : cut=5 RATE.CROWN=-30 RATE.LEAF=+10\n\r\
Description: \n\r\
CoffeeSUD: RATE.[CURRENCY] is a premium (+) or discount (-) in percent on what coins of that currency \
fetch, before the cut (RATE.DEFAULT for the default currency); it is no fee, so the changer still takes \
every currency.  MPEXCHANGE sets a rate for every money changer in the world, kept in the save.\n\r\
Whenever a player gives the money changer coins, the money changer will give back to \
the player a bag containing an equivalent amount of money in the money changers \
native currency.  The "cut" that the money changer takes, in general, can be defined \
with the CUT parameter, by making CUT equal to a percentage.  If you wish, you can \
also define exchange rates for the several currencies in your system by setting each \
currency name equal to a percentage.\n\r\
\n\r\
When dealing with intersteller currencies, there are two other parameters, which can \
be used to automatically calculate a scaled "cut" of the exchange based on how \
far away the exchanged currencies planet is from the money changers.  To do this, \
you can add spacemaxcut to denote the percentage to take when the currency is from \
an unknown or maximum distance, and spacemaxdistance to denote a percentage of the entire \
galactic radius to use as a maximum.

BEHAVIOR_MORALE=\
Behavior   : Morale\n\r\
Targets    : MOBs\n\r\
Parameters : (FLEEAT=[N]%) (OUTNUMBERED=[X]) (BREAK=LEADERDEAD,[N]%DEAD,HP<[N]%) (LEADER="[ZAPPER MASK]") (ACTION=FLEE/SURRENDER/BERSERK) (CHANCE=[N]) (MSG="[TEXT]") (RALLY=[ROOM ID]/HOME REGROUP=[N]) (SURRENDERAT=[N]%) (SURRENDERMSG="[TEXT]") (BRAVE="[ZAPPER MASK]")\n\r\
Example    : FLEEAT=40% BREAK=LEADERDEAD ACTION=FLEE RALLY=Warren#12 REGROUP=15\n\r\
Example    : SURRENDERAT=20% SURRENDERMSG="Mercy! I'll show you the loot!"\n\r\
Description: \n\r\
CoffeeSUD: the mob's nerve breaks: when its hit points fall under FLEEAT, when its foes here \
outnumber its side OUTNUMBERED to one, or as BREAK says: LEADERDEAD (its leader dies: the \
one LEADER names, or the mob it follows), [N]%DEAD (that share of its side has fallen), \
HP<[N]% (its side's hit points together).  Its side is its group, its leader's, and NPCs of \
its race here who fight.  Then, at CHANCE percent a tick (100), it says MSG (":text" for an emote) \
and does ACTION: FLEE (to RALLY, a room ID or HOME, where it waits REGROUP ticks (10), then comes back with the \
NPCs it finds there following it, and attacks the ones it fled from), SURRENDER, or BERSERK (a third more damage and a tenth \
less attack until the fight ends).  Under SURRENDERAT it surrenders whatever else: it drops \
its weapon, its foes and it make peace, it says SURRENDERMSG, and its scripts' \
SURRENDER_PROG runs ($n one it fought).  BRAVE: those the mask fits never break.

BEHAVIOR_MUDCHAT=\
Behavior   : MudChat\n\r\
Targets    : MOBs\n\r\
Parameters : (([data file]=)[group])(+[extra entries]\n\r\
Example    : smurf\n\r\
Example    : chat.dat=smurf\n\r\
Example    : chat.dat=smurf+(smurfy);9Smurfy!\n\r\
Example    : mychat.dat=cityguard\n\r\
Example    : mychat.dat=\n\r\
Example    : +(here there);9neither;5well, where?;1nowhere\n\r\
Description: \n\r\
Allows the mobs to speak and respond to speech.  The chat.dat file, from which \
speech behavior is derived, contains many "templates" for different speech \
behaviors.  MudChat will attempt to choose the correct speech behavior for \
the mob based on the mobs name.  This may be overridden by specifying a \
speech behavior in the parameter [group].  Speech patterns in the chat.dat at \
present include: default, dog fido beastly fido_dog, cat kitten lion, pig boar, \
doll toy, papa_smurf smurf, monster, smurfette, healer cleric doctor.\n\r\
\n\r\
If the first character in the parameters is a +plus-sign, then a semi-colon \
delimited list of chat data is expected, in the same format as is found in chat.dat.\n\r\
\n\r\
If a +plus-sign occurs after the data file and/or group name, then new entries may be \
added that way also, with the entry lines semi-colon delimited as above.\n\r\
\n\r\
CoffeeSUD: DELAY=[N] anywhere in the parameters is how many ticks it waits before \
it answers (2).  When replies come at once (DIALOGUETIME, TIMEMODE DIALOGUE), its \
answer comes before the player's next prompt whatever the delay.\n\r\
\n\r\
CoffeeSUD, in a chat file: a line ?[CONDITION] before an entry is a script condition, as \
after IF, that must hold for it: $t and $n are the speaker, $i the mob, as in \
?QUESTSCRIPTED($t mine) and VAR($t MET == 1).  A reply starting with & runs the rest \
as a MOBPROG line, the mob its host and the speaker $n (9"Clear the rats.~&mpsetvar $n \
JOB given).  $@[GROUP] at a reply's end switches to that group for that speaker alone, \
for six minutes; $@![GROUP] until it is changed, kept in the saved variable \
MUDCHAT_GROUP_[SPEAKER] of the mob; $@- back to the base group.


BEHAVIOR_QUESTCHAT=\
Behavior   : QuestChat\n\r\
Targets    : MOBs\n\r\
Parameters : optional or additional chat data, or filenames ,or chat-mob-type\n\r\
Example    : smurf\n\r\
Example    : +(here there);9neither;5well, where?;1nowhere\n\r\
Example    : chat.dat=smurf\n\r\
Example    : mychat.dat=cityguard\n\r\
Example    : mychat.dat=\n\r\
Example    : +(speak | talk | words::DONE_SPEAKING);9only said this to YOU once.\n\r\
Description: \n\r\
An extension of the MudChat behavior, with a special feature for Quests. \
Allows the mobs to speak and respond to speech.  The chat.dat file, from which \
speech behavior is derived, contains many "templates" for different speech \
behaviors.  MudChat will attempt to choose the correct speech behavior for \
the mob based on the mobs name.  This may be overridden by specifying a \
speech behavior in the parameters.  This behavior extends the basic functionality \
of MudChat in the following ways:\n\r\
\n\r\
1. If the first character in the parameters is a plus-sign, then a semi-colon \
delimited list of chat data is expected, in the same format as is found in chat.dat.\n\r\
\n\r\
2. If format#1 is used, the trigger pattern may be followed by a double-colon, and then \
immediately by a variable string.   This string will designate \
that the given pattern is only responded to for a given player ONCE.  The string \
will also be added to a list of strings under the players name in any Quest object. \
This list will then be available through a Scriptable QVAR function, as \
QVAR(questname CHAT:PLAYERNAME), and it is what the mob goes by: it lasts for \
the run of the quest, and a saved game keeps it.

BEHAVIOR_MOVINGROOM=\
Behavior   : Mover\n\r\
Targets    : Rooms\n\r\
Parameters : min=3 max=3 chance=100;[xmlsection];[ticks at stops];[ticks between stops] \n\r\
Example    : min=3 max=3 chance=100;SUBWAY;3;10\n\r\
Description: \n\r\
The above example would set the room's parameters to the ones listed in the SUBWAY \
section of the file resources/moving.xml.  There is a subway example already there. \n\r\
NOTE!      : The follow conditions -must- be met before setting the room to this behaviour. \n\r\
1. \n\r\
The rooms that you want this room to open out to -must- already be defined before \
you make the XML section. \n\r\
2. \n\r\
The XML document -must- be writen before you set this behaviour. \n\r\
3. \n\r\
You -cannot- have the moving room override an exit, ie. if room A links south to Room B \n\r\
you cannot have the mover link north to room A.\n\r\
******************* \n\r\
XML DOCUMENT NOTES: \n\r\
******************* \n\r\
You can use the following strings in the XML document to be translated on the fly \n\r\
$disproom  : if mover is at a stop this is the room it is opened to otherwise \n\r\
. Example  : this is the next room that this room will open too. \n\r\
$inopendir : this is the direction the door on the inside (the mover) opens. \n\r\
$outopendir: this is the direction the door on the outside (where the mover stoped) opens. \n\r\
$traveldir : this is the current direction that the room is moving in. \n\r\
 \n\r\
<STOPS> here you would list the ROOMID of each room the mover will stop at example.\n\r\
<STOP1>[first stop]</STOP1>n\r\
 \n\r\
<NORMALDIRECTION> and <REVERSEDIRECTION> \n\r\
-in these tags you define the parameters for the mover while is is going back and forth. \n\r\
-normal is stop1 to stopwhatever and reverse is stopwhatever to stop1. \n\r\
-TRAVELDIRECTION = the direction it is traveling from point a to point b. \n\r\
-DOORSDIRECTION = the direction the doors open out of the mover. \n\r\
--<INSIDE> and <OUTSIDE> \n\r\
---in these tags you define what is echoed to the client in the mover and outside. \n\r\
---ARRIVALINFO = what is echoed when the room gets to the stop \n\r\
---DEPARTINFO = what is echoed when the room leaves the stop \n\r\
<ROOMDESCRIPTIONS> \n\r\
-here you define what is appended to the end of the room descriptions. \n\r\
-<NORMALDIRECTION> and <REVERSEDIRECTION> \n\r\
--<INSIDE> and <OUTSIDE> \n\r\
---DOOROPENED = if the door is opened append this.\n\r\
---DOORCLOSED = if the door is closed append this.\n\r\
 \n\r\
There are two examples in the XML document you can look at for further info. \n\r\
 \n\r\
Ideas for this would be, subways, busses, wagon trains (caravans) spaceships, \
stargates, everchanging paths in mazes, elevators, ect.

BEHAVIOR_NASTYABILITIES=\
Behavior   : NastyAbilities\n\r\
Targets    : MOBs\n\r\
Parameters : (MIN=X MAX=X CHANCE=X) (FIGHTOK) (CHECKLEVEL) (; [ZAPPERMASK])\n\r\
Example    : min=10 max=20 chance=75\n\r\
Example    : min=10 max=20 chance=75 fightok\n\r\
Example    : min=1 fightok ; -RACE +ELF\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will use any of its malicious abilities, including \
spells, prayers, songs, or others, to the detriment of random player mobs in the \
same room.  These spells will not automatically cause combat unless the FIGHTOK \
string is included in the parameters.  If a zappermask is specified, it will \
be nasty only to the matching.  The LEVELCHECK argument can be given to ensure \
the mob does not pick on lower level creatures.

BEHAVIOR_NEUTRALABILITIES=\
Behavior   : NeutralAbilities\n\r\
Targets    : MOBs\n\r\
Parameters : (MIN=X MAX=X CHANCE=X) (SKILLs="[id],[id],...") (; [ZAPPERMASK])\n\r\
Example    : min=10 max=20 chance=75\n\r\
Example    : min=1 fightok ; -RACE +ELF\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will use any of its indifferent abilities, including \
spells, prayers, songs, or others, to the amusement of random player mobs in the \
same room.  If a zappermask is specified, it will be nasty only to the matching. \
To limit the skill usage to specific skills, SKILLs=[ability id] may be specified.

BEHAVIOR_NICEABILITIES=\
Behavior   : NiceAbilities\n\r\
Targets    : MOBs\n\r\
Parameters : (MIN=X MAX=X CHANCE=X) (; [ZAPPERMASK])\n\r\
Example    : min=10 max=20 chance=75\n\r\
Example    : min=10 ; -RACE +ELF\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will use any of its benevolent abilities, including \
spells, prayers, songs, or others, for the benefit of player mobs in the \
same room.  If a zappermask is specified, the benefits only go to the \
matching.\n\r\
\n\r\
CoffeeSUD: HEALAT=[N] before the ; has it heal the most hurt of those it helps who are under N% \
of their hit points, and nothing else.\n\r\
Example    : min=1 max=1 HEALAT=60 ; -RACE +Goblin

BEHAVIOR_NOCOMBATASSIST=\
Behavior   : NoCombatAssist\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
This behavior makes sure that a mob does not assist in combat when following \
a player or another mob.

BEHAVIOR_OBJECTGUARDIAN=\
Behavior   : ObjectGuardian\n\r\
Targets    : MOBs\n\r\
Parameters : (DROPOK) (SENTINAL) (MOBMASK="[MASK]") (ITEMMASK="[MASK]")\n\r\
Example    : SENTINAL\n\r\
Description: \n\r\
This will cause a mob to explicitly prevent any other mob from taking or \
removing any object in the same room as the mob. You have to kill him! By \
adding SENTINAL to the parameters, the mob will be even more vigilant and \
steadfast, not letting combat or even severe damage deter him from his duty. \
Normally dropping items is also forbidden, unless DROPOK is specified.  \
Zappermasks to filter the item-getting-mobs and the items themselves \
can also be added.  See help on ZAPPERMASK.

BEHAVIOR_PATROLLER=\
Behavior   : Patroller\n\r\
Targets    : MOBs, Items\n\r\
Parameters : min, max ticks, % chance, rideok flag, diameter; room ids or directions\n\r\
Example    : min=10 max=20 chance=75 rideok=true;Midgaard#3001;#3002;#3003;RESTART\n\r\
Example    : min=10 max=20 chance=99 rideok=only;Midgaard#3001;#3002;#3003;RESTART\n\r\
Example    : min=10 max=20 chance=15;east;.;north;north;east\n\r\
Example    : min=10 max=20 chance=15 diameter=100;Midgaard#1;New Thalos#10;.;.;restart\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob or item with this behavior will travel the path assigned in the parameters.  \
Cardinal directions and room numbers are all valid entries, though the \
cardinal directions must always be valid from the objects current position to \
work.  The 'RESTART' parameter may be placed in the path to force the object \
to start the path from the beginning.  If no 'RESTART' parameter is given, \
the object will by default retrace their steps back to the beginning of the \
path.  The '.' parameter (a period) in the path will direct the patroller to \
pause one step at that point.  If any doors are encountered along the \
patrol route, they will be unlocked and opened by a mob.  Items will ignore doors. \
If a route of room ids is given, the patroller will automatically "track" from their \
current position to the next room on their patrol list, even if it is not adjacent. \
The diameter parameter should be enlarged when it is possible for the patroller to \
become more that 20 rooms "off track".\n\r\
\n\r\
By default, rideable mobs and items will stop patrolling when they are ridden.  \
Setting rideok to true will make it so that they continue their patrol even when \
ridden, though they can still be driven by passengers.  Setting rideok to only \
will keep the rideable on track, and prevent driving by passengers.\n\r\
\n\r\
See Prop_StayAboard for a helpful support property for patrollers with riders. \n\r\
\n\r\
CoffeeSUD: more steps.  WAIT=[N] waits N ticks; DO=[COMMAND] has it do a command (DO=lock \
door, DO=say Gate secure.); EMOTE=[TEXT] an emote; IF=[MASK] goes on only if the mask fits \
the patroller, else to the next RESTART (or the start).  These are not walked back on a \
route with no RESTART.  ROUTE=[NAME]:[FIRST STEP];... starts a named route, its steps up to \
the next ROUTE=: the one named for the time of day (DAWN, DAY, DUSK or NIGHT) is walked, \
else ROUTE=DEFAULT, else the first, from its start when it changes.  RESUME=true with the \
ticks: after a fight it walks back to where it left its route before going on.\n\r\
Example    : min=3 max=3;Gate#1;WAIT=5;DO=say Gate secure.;Wall#4;EMOTE=peers over the battlements.;RESTART\n\r\
Example    : min=3 max=3;ROUTE=DAY:Gate#1;Wall#4;RESTART;ROUTE=NIGHT:Barracks#1;Barracks#2;RESTART

BEHAVIOR_PLAYERHELPER=\
Behavior   : PlayerHelper\n\r\
Targets    : MOBs\n\r\
Parameters : ([MAX COMBATANTS]) (MSG="[ATTACK MESSAGE]")\n\r\
Example    : 5 msg="OMG ATTACK!"\n\r\
Description: \n\r\
The mob with this behavior will come to the defence of any player mob \
against any non-player mob.  You may optionally specify a maximum number \
of combatants that can join in using this behavior.

BEHAVIOR_POKERDEALER=\
Behavior   : PokerDealer\n\r\
Targets    : MOBs, Rooms\n\r\
Parameters : (GAME=[gameint]) (MINPLAYERS=[numplayers]) (ANTI=[antiamount])\n\r\
Example    : game=2 minplayer=4 anti=5.0\n\r\
Description: \n\r\
This behavior makes the mob or room a dealer of poker games.  The behavior will manage \
not only the players hands, but their betting, card draws, and other aspects.  The \
variety of poker defaults to straight poker, but may be set to one of the following: \
STRAIGHTPOKER=0, 5CARDSTUD=1, 7CARDSTUD, DRAWPOKER=3.\n\r\
As of this version, the dealer can not play, so numplayers must be 2 or more.

BEHAVIOR_PURSUE=\
Behavior   : Pursue\n\r\
Targets    : MOBs\n\r\
Parameters : (CHANCE=[N]) (MAXROOMS=[N]) (DELAY=[N]) (MASK="[ZAPPER MASK]") (LEASH=[N]) (STAY) (GIVEUPMSG="[TEXT]") (REMEMBER=[N])\n\r\
Example    : CHANCE=80 MAXROOMS=4 LEASH=8\n\r\
Example    : CHANCE=50 MAXROOMS=10 MASK="-RACES +Goblin" REMEMBER=30\n\r\
Description: \n\r\
CoffeeSUD: the mob chases one who flees it.  CHANCE is the percent chance it gives chase \
(60), MASK whom it chases.  It follows them room by room, a room a tick after DELAY ticks \
(1), and attacks them where it catches them; past MAXROOMS rooms in all (3), or LEASH rooms from \
home, or when it loses the trail, it gives up (GIVEUPMSG, "<S-NAME> give(s) up the chase.") \
and walks home, or with STAY stays where it is.  REMEMBER=[N]: one who fled it and comes \
back within N ticks is attacked on sight.

BEHAVIOR_PUDDLEMAKER=\
Behavior   : PuddleMaker\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : [PCT CHANCE]\n\r\
Example    : 34\n\r\
Description: \n\r\
The room or area with this behavior will, on the given pct chance, \
generate a puddle or some snow following an appropriate rain, sleet, \
thunderstorm, or similar weather event.  The generated snow or puddle \
will disappear (evaporate) after a time.  It can also generate dust \
after a dust storm.

BEHAVIOR_RANDOMENCOUNTERS=\
Behavior   : RandomEncounters\n\r\
Targets    : Areas, Rooms\n\r\
Parameters : TABLE=[NAME] (CHANCE=[N]%) (COOLDOWN=[N]/[N]DAYS) (LOCALES="[KIND],[KIND]") (TRIGGER="[ZAPPER MASK]") (MAXACTIVE=[N]) (DESPAWN=[N]) (BUDGET=[N]%)\n\r\
Example    : TABLE=darkwood CHANCE=10% COOLDOWN=6\n\r\
Example    : TABLE=moors CHANCE=15% LOCALES="PLAINS,HILLS" TRIGGER="-LEVEL +>3" BUDGET=80%\n\r\
Description: \n\r\
CoffeeSUD: as the party moves, each room it enters may bring an encounter from the table \
world/encounters/NAME.enc (AHELP ENCOUNTER), rolled on the next tick for the one who leads the \
party in (if they are still there).  CHANCE is the percent a room (10); COOLDOWN=N lets N rooms \
go by after one, N DAYS game days; LOCALES the kinds of room (WOODS, PLAINS, CITY...); TRIGGER a \
mask on the one who came in; MAXACTIVE the monsters of its encounters about at once (6); \
DESPAWN how many ticks they stay once the party has left them (10), unless fighting; BUDGET adds \
MOBS entries until the monsters' power is that share of the party's (C15's mob ranks count).

BEHAVIOR_RANDOMITEMS=\
Behavior   : RandomItems\n\r\
Targets    : Areas, Rooms, Containers, Mobs\n\r\
Parameters : [min/max ticks] [% chance] [min/max items] [mobs] [locale mask]; [xml/filename]\n\r\
Example    : min=10 max=20 chance=75 minitems=1 maxitems=10;myitems.cmare\n\r\
Example    : minitems=10 maxitems=20 MOBS -ALL +CITY;stuff.cmare\n\r\
Example    : minitems=10 maxitems=20 ;<ITEMS><ITEM>..etc..\n\r\
Example    : maxitems=3 CATALOG="pine cone=5,amber=1" DESPAWN=TICKS=200\n\r\
Description: \n\r\
This behavior will read a list of items from a CMARE file of items generated \
using the "EXPORT AREA ITEMS" or "EXPORT ROOM ITEMS" command.  The path to this \
file should be the last parameter, following a semicolon.  The path is considered \
relative to the CoffeeMud resources directory.  The xml from such \
a file may also be pasted in as the last parameter instead. \n\r\
\n\r\
The parameters \
before the semicolon describe the rate and amount of items generated.  \
The room or area will attempt to generate an item every (min) to (max) \
ticks, assuming the percent chance (chance) is made.  It will then generate \
at least the minimum (minitems) number of items from the list, but \
never more than the maximum (maxitems) number of monsters.  Duplicates \
are allowed.  Items taken away will be replaced by this behavior, even if \
they are looted.  If the behavior is on a room, all \
items will be generated in that room.  If on an area, a random room in \
the area will be picked for the item. The TYPE of room in that area which \
will be selected for population may also be specified. \
-ALL to disallow all locales, followed by +AIR +CITY +JUNGLE (etc) to \
reallow certain locales.  -CITY -UNDERWATER and others may be used to \
restrict certain locales.  If no locale types are specified, then all rooms \
in an area will be populatable.  \
Valid locates include: "STONE",	"WOODEN", "CAVE", "MAGIC", "UNDERWATER", "AIR", \
"WATERSURFACE",	"METAL", "CITY", "WOODS", "ROCKY", "PLAINS", "UNDERWATER", \
"AIR", "WATERSURFACE", "JUNGLE", "SWAMP", "DESERT", "HILLS", "MOUNTAINS". \
If the behavior is on a mob, or the MOBS flag is given in the parameters, then \
the item will be placed on a mob IF POSSIBLE (if the behavior is on an area, and \
a room with no mobs is randomly selected, it may not happen).  Items placed on \
mobs will be automatically worn if possible.   If the behavior is on a shopkeeper, \
it will put the items up for sale.\n\r\
\n\r\
CoffeeSUD spawn rules, before the semicolon (or with no semicolon and no file): \
CATALOG="name=weight,name=weight" picks the catalog's entries by weight (counted and capped as catalog: is); \
WHEN="[ZAPPER MASK]" is tested on the room a spawn would go to (-SEASON +WINTER, -HOUR +20, \
-LOCATION +ROOMSTR(moonlit)...), and nothing spawns where it fails; DESPAWN=WHENFALSE (when the mask \
no longer passes where it is), DAWN (at dawn or by day) or TICKS=[N] (N of the behavior's ticks after it \
came) makes a spawn leave, unseen: not while a player is in its room, nor while it fights; on an area, \
NEAR=PARTY:[N] spawns only within N rooms of the player's side, and MAXAREA=[N] spawns nothing while \
the area holds N spawns (of any spawner).  The rules for rooms (WHEN, NEAR, MAXAREA, DESPAWN) are for items \
left in rooms.

BEHAVIOR_RANDOMMONSTERS=\
Behavior   : RandomMonsters\n\r\
Targets    : Areas, Rooms\n\r\
Parameters : [min/max ticks] [% chance] [min/max monsters] [locale mask]; [xml/filename]\n\r\
Example    : min=10 max=20 chance=75 minmonsters=1 maxmonsters=10;monsters.cmare\n\r\
Example    : minmonsters=10 maxmonsters=20 -ALL +CITY;criminals.cmare\n\r\
Example    : minmonsters=10 maxmonsters=20 ;<MOBS><MOB>..etc..\n\r\
Example    : minmonsters=2 maxmonsters=4;catalog:a goblin,a goblin shaman\n\r\
Example    : maxmonsters=6 CATALOG="grey wolf=4,dire wolf=1" WHEN="-SEASON +WINTER" DESPAWN=DAWN NEAR=PARTY:3 LEVEL=PARTY+-2\n\r\
Description: \n\r\
This behavior will read a list of monsters from a CMARE file of mobs generated \
using the "EXPORT AREA MOBS" or "EXPORT ROOM MOBS" command.  The path to this \
file should be the last parameter, following a semicolon.  The path is considered \
relative to the CoffeeMud resources directory.  The xml from such \
a file may also be pasted in as the last parameter instead. \n\r\
Or the last parameter may be catalog:NAME,NAME, the catalog's mobs: their copies are counted, and none is \
made past an entry's cap.\n\r\
\n\r\
The parameters \
before the semicolon describe the rate and amount of monsters generated.  \
The room or area will attempt to generate a monster every (min) to (max) \
ticks, assuming the percent chance (chance) is made.  It will then generate \
at least the minimum (minmonsters) number of monsters from the list, but \
never more than the maximum (maxmonsters) number of monsters.  Duplicates \
are allowed.  Monsters who die will be replaced by this behavior, even if \
they wander out of the room or area.  If the behavior is on a room, all \
monsters will be generated in that room.  If on an area, a random room in \
the area will be picked for the monster. The TYPE of room in that area which \
will be selected for population may also be specified. \
-ALL to disallow all locales, followed by +AIR +CITY +JUNGLE (etc) to \
reallow certain locales.  -CITY -UNDERWATER and others may be used to \
restrict certain locales.  If no locale types are specified, then all rooms \
in an area will be populatable.  By default, non-flying mobs will never be \
generated in air rooms, nor will non-swimming mobs be generated underwater. \
Valid locates include: "STONE",	"WOODEN", "CAVE", "MAGIC", "UNDERWATER", "AIR", \
"WATERSURFACE",	"METAL", "CITY", "WOODS", "ROCKY", "PLAINS", "UNDERWATER", \
"AIR", "WATERSURFACE", "JUNGLE", "SWAMP", "DESERT", "HILLS", "MOUNTAINS".\n\r\
\n\r\
CoffeeSUD spawn rules, before the semicolon (or with no semicolon and no file): \
CATALOG="name=weight,name=weight" picks the catalog's entries by weight (counted and capped as catalog: is); \
WHEN="[ZAPPER MASK]" is tested on the room a spawn would go to (-SEASON +WINTER, -HOUR +20, \
-LOCATION +ROOMSTR(moonlit)...), and nothing spawns where it fails; DESPAWN=WHENFALSE (when the mask \
no longer passes where it is), DAWN (at dawn or by day) or TICKS=[N] (N of the behavior's ticks after it \
came) makes a spawn leave, unseen: not while a player is in its room, nor while it fights; on an area, \
NEAR=PARTY:[N] spawns only within N rooms of the player's side, and MAXAREA=[N] spawns nothing while \
the area holds N spawns (of any spawner).  LEVEL=PARTY, PARTY+[N], PARTY-[N] or PARTY+-[N] makes each spawn the level of \
the party's highest, give or take, its stats by the level formulas.

BEHAVIOR_RANDOMQUESTS=\
Behavior   : RandomQuests\n\r\
Targets    : Areas, Mobs\n\r\
Parameters : (MIN=[TICKS]) (MAX=[TICKS]) (CHANCE=[0-100]) ([var=value] ...)\n\r\
Example    : minquests=3 maxquests=5 template=normal_capture1\n\r\
Description: \n\r\
This behavior will generate a random quest inside a host area, or generate \
a random quest on behalf of the host mob.  The arguments are all optional, \
and are numerous: \n\r\
MIN, MAX, and CHANCE determine how frequently an attempt will be made to \
generate a quest.  Be generous with this, as quest generation is a cpu-\
intensive process.  Default is 10-20 ticks.\n\r\
MINQUESTS, MAXQUESTS determine how many quests will be generated at one time. \
If any existing quests ellapse, then new ones will be generated.  Default is \
1-3 quests.  If multiple quests are offered by the same mob, then, by default, \
the player must complete each one in order.\n\r\
PATH is used to specify the xml document to read the random quest data from. \
Default is randareas/example.xml.\n\r\
TAGID is the tag of the QUEST object inside the PATH document to generate. \
Default is "all_quests".\n\r\
EXPIRE is the amount of time a quest will run for before expiring forever. \
Expiration occurs even if a quest is accepted moments before.  The default \
is "3 hours".\n\r\
MAXATTEMPTS is the number of attempts that will be made to generate a \
particular quest.  This is necessary because not all areas, people, or \
circumstances will support evey quest type.  The default is 3.\n\r\
\n\r\
A saved game keeps the quests this behavior generated, whole, with their \
progress, and a restore makes them again; the behavior takes them back \
rather than generating others.\n\r\
\n\r\
The following are not aspects of this behavior, but are variables passed on \
to the percolator who generates the quests, and are only meaningful because \
of their definitions in /resources/quests/random/*.xml.\n\r\
TEMPLATE is the name of the quest template to use.  Default is normal.\n\r\
AVOIDSCANS can be set to YES to avoid quest templates that scan an entire area.\n\r\
AREA_NAME can override the name of the areas where the announcer is found.\n\r\
SOURCE_NAME can override the name of the quest announcer.\n\r\
TARGETAREA_NAME can override the name of the area where the quest occurs.\n\r\
MULTIAREA can be set to YES to allow the quest to occur other than the source area.\n\r\
TARGETNAME is quest-type specific, but can mean the name of a quest target mob or item.\n\r\
NUM_TARGETS is quest-type specific, but can mean the number of items/mobs to target.\n\r\
AGGRESSION is quest-type specific, but can be set to YES or NO.\n\r\
XP_AMOUNT_AWARDED is the amount of xp to award for completing a quest.\n\r\
GOLD_AMOUNT_AWARDED is the amount of money to award for completing a quest.\n\r\
SOURCE_FACTION and SOURCE_FACTION_AMT are the faction (its ID) the quest's \
giver belongs to and how far, picked from the giver; the reward templates use \
them to award faction with the giver, as SOURCE_FACTION_AMT / 500.\n\r\
QUEST_POINT_AWARDED can be set to YES or NO.\n\r\
QUEST_MULTIPLE can be set to YES, NO, or PREV\n\r\
ANNOUNCECHANNEL can be anything from SAY, LOCAL, QUESTCHAT, etc.\n\r\
TARGET_MIN_AREALEVEL AND TARGET_MAX_AREALEVEL to set a range for randomly picked target areas\n\r

BEHAVIOR_RANDOMTELEPORTER=\
Behavior   : RandomTeleporter\n\r\
Targets    : Mobs\n\r\
Parameters : min, max ticks, a percent chance, (nowander) locale parms\n\r\
Parameters : ("POOFIN=[MESSAGE]") ("POOFOUT=[MESSAGE]")\n\r\
Example    : min=10 max=20 chance=75 -air -underwater\n\r\
Example    : min=10 max=20 chance=75 nowander "poofin=<S-NAME> Arrives!"\n\r\
Description: \n\r\
This behavior makes a mob which will transport himself to a random room \
on the map.  Locale parms may be given to restrict the types of rooms he \
will transport too.  A randomtransport will, by default, transport all over \
the world.  Use the nowander flag to keep him in his area. The optional \
poofin and poofout (which are spacing and quotation sensitive) can add \
some optional messaging to the process.

BEHAVIOR_REGENERATE=\
Behavior   : Regenerate\n\r\
Targets    : Areas\n\r\
Parameters : (FILE=[TEMPLATE] ID=[AREA ID] VARS="[VAR]=[VAL] ...") (SEED=RANDOM/DAILY/WEEKLY/SAME/[N])\n\r\
Parameters : (WHEN=MUDDAY:[N],MOON:[PHASE],ONEMPTY,SCRIPT) (KEEP="[ROOM ID] ...")\n\r\
Example    : WHEN=MOON:FULL SEED=RANDOM\n\r\
Example    : WHEN=ONEMPTY SEED=DAILY KEEP="Old Tunnels#0"\n\r\
Description: \n\r\
CoffeeSUD: the area re-rolls itself.  It is built again from FILE and ID (with VARS), or from its \
GENSOURCE (what GENERATE AREA recorded) when they are left out, as REGENERATE AREA does: the rooms \
marked GENLOCK, the rooms KEEP names and the rooms a running quest uses (or someone or something in \
them) stay as they are, the rest are made again, and the gate and every other exit go to the rooms of \
the same IDs.  WHEN is one or more of MUDDAY:N (every N days of the area's calendar), MOON:FULL (or \
another phase: NEW, WAXCRESCENT, ... as it begins), ONEMPTY (as the party leaves, so it is fresh when \
they come back) and SCRIPT (only when MPREGENERATE asks; the default).  SEED is RANDOM (a new one each \
time, the default), DAILY or WEEKLY (one for the game day or week: the same all that day), SAME (the \
GENSOURCE's) or a number.  It never re-rolls while a player, or one following a player, is inside: it \
waits for them to leave.  The area's GENERATED_PROG runs after.  Its STATE (when the days count from, \
the moon last seen, a re-roll waiting) is kept in a saved game; the rooms are kept as rooms changed in \
play.

BEHAVIOR_RESETWHOLE=\
Behavior   : ResetWhole\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : # of ticks of inactivity before reset\n\r\
Parameters : (TICKS=[INACTIVITY TICKS])/(RLHOUR=[HOUR])/(MUDHOUR=[HOUR])\n\r\
Parameters : (DAYS=[GAME DAYS]) (EXCEPT="[MASK]") (MSG="[TEXT]")\n\r\
Example    : 4000\n\r\
Example    : DAYS=7 EXCEPT="-NAME +'the Goblin King'" MSG="Fresh tracks lead into the tunnels."\n\r\
Description: \n\r\
This behavior provides an alternative means of resetting your rooms and areas.  \
The system will total reset a room (mobs and items) which has not been visited \
by a player in the given amount of ticks.  Remember that a tick is about 4 seconds. \
You can alternatively specify a real life hour (0-23) or mud hour of the day with \
the RLHOUR or MUDHOUR parameters. \
CoffeeSUD: DAYS is game days on the area's calendar after the party was last there, in place of TICKS. \
EXCEPT is a mask of the mobs and items that never come back once gone: a slain boss or taken loot stays gone, \
one still there at the reset stays; a name with spaces goes in single quotes, +'the Goblin King'.  MSG is shown to the first who comes in after a reset.  RLHOUR reads the \
real clock, which means nothing with pause and turn-based time; use MUDHOUR or DAYS. \
An Area with this behavior will skip over any rooms which also have this behavior, \
allowing you to have different total reset times for certain rooms.  Of course, \
this behavior does not override the existing REJUV system for mobs and items, so \
if you would like to use the ResetWhole system exclusively, you should set the \
rejuv rate on all the mobs and items in your game to 0, which disables their \
internal rejuvenation.

BEHAVIOR_RESOURCEOVERRIDE=\
Behavior   : ResourceOverride\n\r\
Targets    : Rooms, Areas, Mobs\n\r\
Parameters : (min=x) (max=[ticks]) (chance=[%]) ([RESOURCE]) ([ROOM TYPE])...\n\r\
Parameters : .. ("item name([RESOURCE] [SUBTYPE])") ("[RESOURCE] [SUBTYPE]")\n\r\
Example    : MIN=5 MAX=5 CHANCE=100 CORN WHEAT RICE\n\r\
Example    : CORN WHEAT RICE ROCKY MOUNTAINS PLAINS\n\r\
Example    : CORN "some weird corn(CORN WIERDCORN)" "CORN WIERDCORN"\n\r\
Example    : SPRING=flowers,herbs SUMMER=blueberries AUTUMN=apples WINTER=none MSG="The orchard turns with the season."\n\r\
Example    : MUSHROOMS SEASON=autumn HOUR=20-23,0-4\n\r\
Description: \n\r\
This class allows one to override the normal resources generated by \
rooms for many common skills, or by corpses during butchering.  \
This skill will randomly select from \
the list enumerated in the parameters instead of the normal list. \
If this behavior is added to an area, you can add to the parameters \
a list of room types to apply the new resources to.  Room types include: \
STONE, WOODEN, CAVE, MAGIC, UNDERWATER, AIR, \
WATERSURFACE,	METAL, CITY, WOODS, ROCKY, PLAINS, UNDERWATER", \
AIR, WATERSURFACE, JUNGLE, SWAMP, DESERT, HILLS, MOUNTAINS\n\r\
\n\r\
Resource types can be listed by name or their code number.  You can also \
put a resource type in double-quotes followed by a space and sub-type. \
Lastly, a custom resource can be made by putting the name in quotation \
marks followed by the resource type and sub-type in parenthesis. \n\r\
\n\r\
When changing the parameters of an existing ResourceOverride on an area, \
be sure to use RESET AREA to change back any rooms previously affected. \n\r\
\n\r\
CoffeeSUD: by the calendar (of the room's area).  SPRING=, SUMMER=, AUTUMN= (or FALL=) and WINTER= each \
give a season its own comma list of resources (none for nothing), which swap in as the season turns; a \
season with no list uses the plain list, if there is one, or else the rooms' own.  SEASON=, MONTH= and \
HOUR= (comma lists, with ranges as 20-23) limit when it applies at all; outside them the rooms have \
their own resources back.  MSG="[TEXT]" is shown in a room when the calendar changes its resource.

BEHAVIOR_ROOMSTATES=\
Behavior   : RoomStates\n\r\
Targets    : Rooms, Areas\n\r\
Parameters : STATE=[NAME] (TITLE=) (DESC=) (ATMOSPHERE=) (CLIMATE=) (ADD="[ID]([PARMS]);...") (BLOCK=[DIRS]) (OPEN=[DIRS]) (ENTERMSG=); TO=[NAME] (FROM=[NAMES]) (WHEN="[MASK]") (AFTER=[TICKS]) (TICKS=[N]) (ONVAR="[HOST] [VAR]==[VALUE]"); START=[NAME]; (ROOMS=[ROOM IDS])\n\r\
Example    : STATE=dry TITLE="A dusty shaft"; STATE=collapsed TITLE="A collapsed shaft" ADD="Prop_RoomDark()" BLOCK=down; TO=collapsed ONVAR="mine collapse==1"; START=dry\n\r\
Description: \n\r\
CoffeeSUD: named versions of a room, declared in one place; clauses go with a semicolon between. \
A STATE sets the room's title, description, atmosphere (WATER, AIR...) and climate (WET, COLD...), \
gives it effects and behaviours (ADD, with their parameters in brackets; taken away when the \
state ends), refuses ways out (BLOCK), opens doors (OPEN) and says ENTERMSG to those coming in; \
what it leaves unset is the room's own.  A transition (TO) goes from the states named (FROM, or \
any) when WHEN holds (a mask on someone standing there, as -WEATHER +RAIN) AFTER ticks in a row, \
after TICKS in the state, or when a script variable holds (ONVAR, the host * when not given). \
On an area, all its rooms (or ROOMS=) change together.  MPROOMSTATE and ROOMSTATE() set and \
read it; a save keeps it.

BEHAVIOR_TIDALROOM=\
Behavior   : TidalRoom\n\r\
Targets    : Rooms\n\r\
Parameters : (SPAN=[HOURS]) (TITLE=) (DESC=) (FLOODMSG=) (DEEP) (WASH=[WEIGHT])\n\r\
Example    : SPAN=1 DESC="The sea fills the cove." WASH=2 DEEP\n\r\
Description: \n\r\
CoffeeSUD: a shore room the tide floods, made from RoomStates: at high tide (SPAN hours either \
side) it is a swimming room with its own TITLE and DESC, and FLOODMSG for those who come in; \
with DEEP its air is water at the spring tides; WASH washes away the loose things there that \
weigh up to that much as the water comes.  At the ebb it is itself again.  ROOMSTATE() says ebb, \
flooded or deep.

BEHAVIOR_FLOODABLE=\
Behavior   : Floodable\n\r\
Targets    : Rooms\n\r\
Parameters : (RISE="[MASK]") (ONVAR="[HOST] [VAR]==[VALUE]") (TIDE=HIGH) (RATE=[TICKS]) (DRAIN=[TICKS]) (FLOWTO=[DIR]) (FLOAT=[WEIGHT]) (TITLE1= to TITLE3=) (DESC1= to DESC3=) (MSG1= to MSG3=)\n\r\
Example    : RISE="-WEATHER +RAIN +THUNDERSTORM" RATE=15 DRAIN=30 FLOWTO=east\n\r\
Example    : ONVAR="pump sluice==open" RATE=5\n\r\
Description: \n\r\
CoffeeSUD: a room that floods, made from RoomStates, in levels: 0 dry, 1 ankle-deep, 2 waist-deep \
(one swims; loose things weighing up to FLOAT, 2 by default, float off through FLOWTO, or away), \
3 full (the air is water: one drowns once one's breath runs out).  While RISE (a mask on someone \
standing there), ONVAR (a script variable) or TIDE holds, the water rises a level each RATE ticks \
(10), else it drains a level each DRAIN ticks; rising water puts out lights.  Each level may have \
its own TITLE, DESC and MSG (what those coming in are told).  FLOODLEVEL() reads the level.

BEHAVIOR_RIDDLER=\
Behavior   : Riddler\n\r\
Targets    : MOBs, Items\n\r\
Parameters : RIDDLE="[TEXT]" ANSWERS="[ANSWER]|[ANSWER]" (RIDDLE1..9= ANSWERS1..9=) (RANDOM=true) (FUZZY=[N]) (ASK=GREET,LOOK,COMMAND) (TRIES=[N]) (ONRIGHT="[ACTIONS]") (ONWRONG="[ACTIONS]") (ONOUT="[ACTIONS]") (RIGHTMSG="[TEXT]") (WRONGMSG="[TEXT]") (ONCE=CHARACTER/SAVE/NONE)\n\r\
Example    : RIDDLE="What has roots nobody sees, and is taller than trees?" ANSWERS="mountain|mountains" FUZZY=1 TRIES=3 ONRIGHT="door open here north; exp $n 100" ONOUT="force $i kill $n"\n\r\
Description: \n\r\
CoffeeSUD: a mob or a thing that asks riddles.  RIDDLE and ANSWERS (more with RIDDLE1 to 9 and \
ANSWERS1 to 9; RANDOM picks one, else the first); case, a, an, the and punctuation do not \
count, and FUZZY=1 forgives one wrong letter (or two swapped).  ASK (all three by default): GREET asks one of \
the player's side who comes in, LOOK one who looks at it, COMMAND one who types RIDDLE.  They \
answer by saying it (SAY) or with ANSWER [TEXT].  After TRIES wrong answers (3) ONOUT runs; \
ONRIGHT and ONWRONG run on each answer (script commands, MP left off if you like, $n who \
answered; as Prop_Switch's).  ONCE=CHARACTER (the default) asks each character until they \
solve it, SAVE until anyone does (kept with it), NONE always.

BEHAVIOR_ROMGANGMEMBER=\
Behavior   : ROMGangMember\n\r\
Targets    : MOBs\n\r\
Parameters : [GANG NAME](;[ATTACK MESSAGE]...\n\r\
Example    : Troll\n\r\
Example    : Troll;I`m gonna kill you!;I`ve got you now!;DIE!\n\r\
Description: \n\r\
A silly behavior to better support ROM area files.  The mob with this behavior will attack any other \
mob which also has this behavior, but is in a different gang.  This behavior is not active when \
a mob with the ROMPatrolman is in the room.  The first argument is always the gang that this \
member belongs to, whereas any additional arguments are things the mobs say before attacking.

BEHAVIOR_ROMPATROLMAN=\
Behavior   : ROMPatrolman\n\r\
Targets    : MOBs\n\r\
Parameters : \n\r\
Example    : \n\r\
Description: \n\r\
A silly behavior to better support ROM area files.  The mob with this behavior will complain whenever \
there is a fight going on in the same room.  The mob may do nothing, join the fight, or break it up.

BEHAVIOR_SCHEDULE=\
Behavior   : Schedule\n\r\
Targets    : MOBs\n\r\
Parameters : [WHEN]: [PLACE] ([ACTIVITY]...) (SAY [TEXT]/EMOTE [TEXT]); ...; (SHOPMSG="[TEXT]")\n\r\
Example    : DAWN: Mill#2 WORK "pours grain into the hopper|wipes flour from his hands"; DAY: Market#5 SHOP; DUSK: Inn#1 SIT "stool" SAY Long day.; NIGHT: Mill#9 SLEEP "straw bed" LOCK\n\r\
Description: \n\r\
CoffeeSUD: a daily routine over several places.  Entries are separated by ';'; the first \
whose WHEN holds is the one in force.  WHEN is DAWN, DAY, DUSK or NIGHT, or hours (2-5, or \
7, on the area's clock), with any of DAYS=[FROM]-[TO] (days of the month), SEASON=, \
WEATHER= (CLEAR, RAIN, SNOW...) and MASK="[ZAPPER MASK]" (on the mob) after it.  PLACE \
is a room ID (it runs to the first activity word, so an ID with spaces is fine), HOME or \
START (where the mob starts), or ANY:"[ROOM MASK]" (a room of its \
area that fits).  The activities: SLEEP or SIT, each with an optional item to do it on; \
WANDER [N]; SHOP (it trades only while here: elsewhere, or on the way, it says SHOPMSG); \
WORK "[EMOTE]|[EMOTE]" (now and then); LOCK (closes and locks the place's doors while \
there, and unlocks them when the entry ends); HIDE.  SAY or EMOTE, last, is said on \
arriving.  It walks there, holding Mobile off on the way, and goes back to it after a \
fight; woken, it goes back to sleep after a while.  When no player is in the area of \
either room it is put there at once, so a restored game, a time jump or an area nobody \
is in finds it where its routine says.  With no entry in force it stays where it is.  \
STAT($i SCHEDULE) is the entry in force, and STAT BEHAVIORS shows it.

BEHAVIOR_SCAVENGER=\
Behavior   : Scavenger\n\r\
Targets    : MOBs\n\r\
Parameters : (MIN=[TICKS]) (MAX=[TICKS]) (CHANCE=[NUM%]) (TRASH=[ROOMID]) \
Parameters : ... (; [ITEM ZAPPERMASK]) \
Example    : min=10 max=20 chance=75\n\r\
Example    : min=10 max=20 chance=75 trash="no"\n\r\
Example    : min=10 max=20 chance=75 trash="Midgaard#3021"\n\r\
Example    : min=10 max=20 chance=75 ; -JAVACLASS +GENWEAPON\n\r\
Description: \n\r\
According to the timing and percent chance described by the parameters, the \
mob with this behavior will attempt to pick up and take away random objects \
in the same room as the mob.  Scavengers will not do their work when a PC is \
in the room, however.  If they get "filled up" on items, they will destroy \
them, unless the trash flag is present.  If it is set to NO, they will do nothing.  \
If it is set to a roomid, the mob will track to that room and put the things \
in any ungettable container therein, or on the ground if that is not an option. \
An optional semicolon at the end of the arguments may be followed by a zapper mask \
to limit the types of items the scavenger will pick up.  See AHELP ZAPPERMASK.

BEHAVIOR_SCENE=\
Behavior   : Scene\n\r\
Targets    : Rooms, MOBs\n\r\
Parameters : statements, ; between them or one to a line in FILE=[PATH]: (NAME=[NAME]) ACTOR [NAME]=[MASK OR NAME] ... [NAME]: [COMMAND] ... (PAUSE [N]) (ECHO [TEXT]) (DO [MOBPROG]) (IF=[CONDITION]) (ONCE/REPEAT=[DAYS]) (DELAY=[N]) (INTERRUPTIBLE)\n\r\
Example    : NAME=bribes;ACTOR guard1=tall guard;ACTOR guard2=-NAMES +"short guard";guard1: say Heard the bandits hit the mill again.;guard2: emote spits.;PAUSE 1;guard1: say The [[captain]] takes their coin, they say.;DO mpsetvar $n HEARD_BRIBES yes;TOD=NIGHT\n\r\
Description: \n\r\
CoffeeSUD: NPCs play out a scene for a player character to overhear.  ACTOR names each \
part and how to find the NPC in the room: a zapper mask (starting + or -), or words of its \
name; on an NPC, SELF is the NPC itself.  Then the lines, one a tick (a turn in turn-based \
time), DELAY=[N] ticks apart: [NAME]: say ..., [NAME]: emote ..., or any command the NPC \
can do; ECHO [TEXT] for the room; PAUSE [N] for N ticks of silence; DO [MOBPROG] runs a \
script line with $n the character it plays for (MPSETVAR, MPQJOURNAL, MPCALLFUNC...).  $n \
in a line is that character's name, and [[topic]] in a line said teaches the topic (AHELP \
NPCTOPICS).  It begins when a player character is in the room it has not played to, all \
its actors are there, awake and not fighting, and IF=[CONDITION] holds (a script \
condition, $n the character, $i the first actor); WHEN=, TOD= and HOURS= hold it back too \
(AHELP BEHAVIOR_WHEN).  Played to its end, each player character there has heard it: the variable \
SCENE_[NAME] on them is the game day, and it is not played to them again (ONCE, the \
default), or not for REPEAT=[DAYS] game days.  It stops, not heard, when the character or \
an actor goes, or an actor fights.  INTERRUPTIBLE: a character who speaks to an actor \
stops it and the actors turn to them; it plays to them again when they have left and come \
back.  Where it is in a scene is kept in a saved game; STAT BEHAVIORS shows it and any \
statement it did not understand.

BEHAVIOR_SENTRY=\
Behavior   : Sentry\n\r\
Targets    : MOBs\n\r\
Parameters : (SPOT=[N]) (INTRUDERS="[MASK]") (ALARM="RADIUS=[N] MASK=[MASK] MSG=[TEXT]") (ALERTTICKS=[N]) (ALARMITEM="[ITEM NAME]")\n\r\
Example    : SPOT=30 ALARM="RADIUS=6 MASK=-NAMES +bandit MSG=Intruders! To arms!" ALERTTICKS=40 ALARMITEM="a brass gong"\n\r\
Description: \n\r\
CoffeeSUD: a lookout.  It sees an intruder here or next door: a player's character or one \
following them, or whoever INTRUDERS fits.  One hidden or sneaking it spots at SPOT% a \
tick (25), less their Hide or Sneak proficiency, and half that next door.  Then, or when \
it is attacked, it raises the alarm: a shout of MSG (a NOISE message, which EXECMSG_PROG \
can catch), and every NPC within RADIUS rooms (6) that fits MASK wakes (a Sleeper stays \
up) and is alert for ALERTTICKS (40): it heads for the alarm room, or for the intruder \
if they are near, and attacks them or their party, while its Schedule or Patroller waits.  \
ALARMITEM is an item in its room that anyone, a player too, may PUSH or PULL to raise the \
alarm.  It raises it at most once in ALERTTICKS.  Silence the lookout first, and a camp \
can be taken tent by tent.

BEHAVIOR_SLEEPER=\
Behavior   : Sleeper\n\r\
Targets    : MOBs\n\r\
Parameters : (ALWAYS/SLEEPS=[DAWN/DAY/DUSK/NIGHT/FROM-TO]) (BED="[ITEM]") (WAKEON=[ATTACK,NOISE,ENTER,LIGHT,TOUCH]) (WAKECHANCE=[N]) (DEEP) (GRUMBLE="[TEXT]") (AWAKEFOR=[TICKS]) (ALARM)\n\r\
Example    : ALWAYS WAKEON=NOISE,ENTER WAKECHANCE=40 GRUMBLE="Who disturbs Grok?" ALARM\n\r\
Description: \n\r\
CoffeeSUD: a sleeping NPC that noise wakes.  It sleeps always (the default), or at SLEEPS= \
a time of day or hours on the area's clock (not TOD= or HOURS=, which would switch the whole \
behaviour off), on BED= if it is there.  WAKEON says what may wake it (all of them, by \
default) and WAKECHANCE (50) how likely each is: a fight in the room makes it likelier, one \
next door less likely; someone entering sneaking or hidden takes off their Sneak or Hide \
proficiency; one carrying a light adds to it; TOUCH is anything done to it but looking.  \
DEEP: only an attack wakes it.  Woken, it says GRUMBLE, stays up AWAKEFOR ticks (20) and \
then sleeps again, and with ALARM shouts an alarm that wakes the NPCs round about: its \
Sentry's ALARM= if it has one (AHELP BEHAVIOR_SENTRY), else six rooms and 'Intruders!'.  \
LOOK at it says it is sleeping soundly, or that it stirs when something nearly woke it.

BEHAVIOR_SCRIPTABLE=\
Behavior   : Scriptable\n\r\
Targets    : MOBs, Items, Rooms\n\r\
Parameters : (see below)\n\r\
Example    : LOAD=progs/mrinfo.script~\n\r\
Description: \n\r\
This behavior allows the reactions and behaviors of the mob to be scripted. \
The parameter may be complete scripts, and/or LOAD commands as specified below. \
If you choose to use a file for your script, then each script command line \
must be terminated by a linefeed or a semicolon.  If you choose to put your entire \
script into the parameters, you must terminate EVERY line with a semicolon (;). \
\n\r\
Multiple scripts with multiple triggers may be included.  Each script and trigger \
must be separated by the ~ character.  See examples in the resources/progs directory! \
\n\r\
Now to the script itself:\n\r\
The first line must be a trigger word followed by any parameters.  Valid \
triggers and parameters are as follows:\n\r\
LOAD=[SCRIPT PATH] - insert a new script from another file.  Ex: LOAD=progs/my.script~ \n\r\
GREET_PROG [PCT CHANCE] - When players enter the room, given the chance.\n\r\
ARRIVE_PROG [PCT CHANCE] - When the mob enters a new room, or enters the game.\n\r\
ALL_GREET_PROG [PCT CHANCE] - Same as GREET_PROG, but works with sneakers too.\n\r\
LOGIN_PROG [PCT CHANCE] - When players logs into the game, given the chance.\n\r\
LOGOFF_PROG [PCT CHANCE] - When players log out of the game, given the chance.\n\r\
LEVEL_PROG (GAIN/LOSS/ANY) [PCT CHANCE/MASK] - When a player anywhere gains a level (or loses one), given the \
chance. $g is the new level.\n\r\
SPEECH_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When someone says the words.\n\r\
BRIBE_PROG [AMOUNT OF GOLD] - When the amount or better is given to the monster.\n\r\
GIVE_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When something is given to the monster.\n\r\
RAND_PROG [PCT CHANCE] - Triggers at random, given the chance.\n\r\
ONCE_PROG - Triggers on the first occurrence, but never again (until reset).\n\r\
FIGHT_PROG [PCT CHANCE] - Triggers during combat, given the chance.\n\r\
ENTRY_PROG [PCT CHANCE] - Triggers whenever the monster enters a new room.\n\r\
EXIT_PROG [PCT CHANCE] - Triggers whenever anyone exits the room of the monster.\n\r\
DEATH_PROG (@GLOBAL (MASK)) - When the monster dies; with @GLOBAL, any death anywhere, of one who fits the mask.\n\r\
KILL_PROG (@GLOBAL (MASK)) - When the monster kills; with @GLOBAL, any kill anywhere, by one who fits the mask.\n\r\
HITPRCNT_PROG [HP PCT] - When the monster reaches the hit points % remaining.\n\r\
MASK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When a mob performs an action with these words.\n\r\
IMASK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When this mob performs an action with these words.\n\r\
REGMASK_PROG (P) [EXACT PHRASE]/[REGULAR EXPRESSION] - When a mob performs an action matching.\n\r\
ACT_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When a mob performs an action with these words.\n\r\
SOCIAL_PROG (EXACT) (ME) [SOCIAL NAME] - When a mob performs the given social: a name that starts it, the whole \
name with EXACT, aimed at this mob with ME. $g is the social's full name.\n\r\
CHANNEL_PROG [CHNAME] (P) [A PHRASE]/[ONE OR MORE WORDS] - When channels a message with these words.\n\r\
QUEST_TIME_PROG [QUEST NAME] [TIME LEFT] - When the running quest reaches the number of minutes left. \
A time left of -1 fires at each step of the quest, and -2 when it ends, for the objects the quest gave the script to.\n\r\
QUEST_PROG [START/ACCEPT/STEP/WIN/FAIL/END/ANY] [QUEST NAME/*] (DETAIL) - When a quest starts, is accepted, steps, \
is won, ends without a winner (FAIL), or ends; heard by every object with the trigger, wherever it is. The detail \
is a step number for STEP, and for FAIL and END the outcome: WON, EXPIRED, STOPPED or DROPPED. $n is the player \
(the accepter, the winner, the one who dropped it) or 'the quest', $g the quest's name, $0 the detail.\n\r\
QUESTFAIL_PROG [QUEST NAME/*] - CoffeeSUD: when a quest fails for a character (MPQUESTFAIL, or a KEYPLAYER FAIL death); heard by every object with the trigger, the character's own quest scripts too. $n is the character, $g the quest's name, $0 why.\n\r\
TALK_PROG ([WORDS]/P [PHRASE]/ALL) - CoffeeSUD: when a character begins a conversation with the mob by TALK (and TALK ABOUT a topic): ALL, or no words, for any; else when the topic has one of the words, or the phrase. Runs at once. $n is the character, $g and $0 the topic (empty for none). With no TALK_PROG that fits, the character says the topic (or Hello) to the mob instead, for its MudChat and SPEECH_PROGs, and with no topic is shown its services. MEMORY(npc who LASTTOPIC) is the topic.\n\r\
SET_PROG ([SET]/ALL) - CoffeeSUD: on a piece of an item set (Prop_ItemSet) or its wearer: a tier came on or went off; $0 the tier, $1 ON or OFF, $n the wearer.\n\r\
USE_PROG ([KEYWORDS]/ALL) - CoffeeSUD: on either thing of USE X (ON Y): it was used; the keywords are looked for in the other thing's name (none, or ALL, for any); $n who, $o the first, $t the second (or the first, alone).  Without one, world/combinations.txt is looked at.\n\r\
COMBINE_PROG ([KEYWORDS]/ALL) - CoffeeSUD: on either thing of COMBINE X WITH Y, as USE_PROG.\n\r\
SWITCH_PROG ([STATE]/ALL) - CoffeeSUD: on a thing with Prop_Switch, or its room: it moved to that state; $0 the state, $n who moved it.\n\r\
PARTYDEFEAT_PROG - CoffeeSUD: on a room or an area: every one of the party there is down (PLAYERDEATH's DOWNED) or dead; $n the last to fall.  The script decides what happens; without one, coffeemud.ini's PARTYDEFEAT does.\n\r\
AMBUSH_PROG ([SURPRISED/SPOTTED/AVOIDED]/ALL) - CoffeeSUD: on a room with Prop_Ambush, or an NPC there: when it springs and how it went; $0 the outcome, $n the one who came in.\n\r\
WAVE_PROG ([N]/ALL) - CoffeeSUD: on a room with WaveSpawner, or an NPC there: when wave N (or any) comes; $0 is the wave, $n one of the party.\n\r\
ARENAWIN_PROG - CoffeeSUD: when a WaveSpawner's last wave is beaten; $n the winner.\n\r\
ARENALOSE_PROG - CoffeeSUD: when the party leaves or falls in a WaveSpawner's arena; $n who started it.\n\r\
PHASE_PROG ([N]/ALL) - CoffeeSUD: when the mob's BossPhases enters phase N (or any): $g and $0 are the phase, $n its foe.\n\r\
YIELD_PROG - CoffeeSUD: when the mob yields (Prop_Essential MODE=YIELD): $n is who beat it.\n\r\
DEFEAT_PROG - CoffeeSUD: when a killing blow knocks the mob out instead (Prop_Essential MODE=KNOCKOUT): $n is who beat it.\n\r\
SURRENDER_PROG - CoffeeSUD: when the mob surrenders (Morale SURRENDERAT=): $n is one it fought.\n\r\
RESET_PROG - CoffeeSUD: when EncounterReset puts the mob back after its foes left: $n and $i are the mob.\n\r\
QUESTTIMEOUT_PROG ([QUEST NAME/*]) - CoffeeSUD: when a character's own deadline for a quest (MPQTIMER) comes; runs at once on the character's scripts, a bare QUESTTIMEOUT_PROG on those the quest gave them, busy or not. With no such trigger there, the quest fails for them, EXPIRED. $n is the character, $g and $0 the quest's name.\n\r\
TIME_PROG [LIST OF HOURS] - Mob runs program at listed hours of the day: numbers, DAWN, DAY, DUSK or NIGHT \
(the hour the area's clock begins it), or ranges, 6-18 or 6-18/3 for every third hour.\n\r\
DAY_PROG [LIST OF DAYS] - Mob runs program at listed days of the month, or ranges of them (1-7).\n\r\
DELAY_PROG [LOW TICKS] [HIGH TICKS] - Mob runs program at the given interval range.\n\r\
LOOK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is looked at.\n\r\
LLOOK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is llooked at.\n\r\
GET_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is gotten.\n\r\
OPEN_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is opened.\n\r\
CLOSE_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is closed.\n\r\
LOCK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is locked.\n\r\
UNLOCK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is unlocked.\n\r\
PUT_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is put in something.\n\r\
DROP_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is dropped.\n\r\
REMOVE_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is removed.\n\r\
CONSUME_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is ate/drank.\n\r\
WEAR_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is worn/wielded.\n\r\
DAMAGE_PROG - When damage taken by mob or given by item. Item#2 is the weapon. $g will have the amount.\n\r\
BUY_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is bought (items only).\n\r\
SELL_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is sold.\n\r\
EXECMSG_PROG (@GLOBAL) [MSG CODE] (P) [COMMAND WORDS] - When a msg of type msg code is executed. HELP MSG TYPES, or LIST MSGTYPES. \
With @GLOBAL, the world-wide messages of that type (DEATH, LEVEL, LOGIN, QUIT, LEGALWARRANT, LEGALSTATE, WINQUEST, \
ENDQUEST) wherever they happen, heard once. SKILL_PROG and FACTION_PROG take @GLOBAL first too.\n\r\
CNCLMSG_PROG [MSG CODE] (P) [COMMAND WORDS] - Before a msg of type msg code is allowed. HELP MSG TYPES, or LIST MSGTYPES.\n\r\
In either, =S, =T or =O [STAT]=[VALUE] in place of the words checks the source, target or tool: the value may \
have * wildcards, and =S MASK=[ZAPPER MASK] checks a mask. MSG() reads the message, MPMSG changes it.\n\r\
FUNCTION_PROG [FUNCTION NAME] - declares a runnable function, with parms in $g, see MPCALLFUNC.\n\r\
SKILL_PROG [LEARN/IMPROVE/MASTER/FAIL/ANY] [SKILL ID/NAME/*] (MASK) - When a character near the host \
learns a skill, gains proficiency in it, reaches its most, or fails its roll, and fits the zapper mask. \
Heard by the room, its items and mobs, and its area. $t is the skill, $g its proficiency.\n\r\
DISCOVER_PROG [ROOM/AREA] (PARTY) (MASK) - When a character first visits the room, or the area's first room \
they visit; with PARTY, only if no one else in their group has been there. $g is the room's ID.\n\r\
WEATHER_PROG [WEATHER/ANY] (OLD WEATHER) - When the host's area's weather changes to the weather (CLEAR, CLOUDY, \
WINDY, RAIN, THUNDERSTORM, SNOW, HAIL, HEAT, SLEET, BLIZZARD, DUST, DROUGHT, COLD, FOG), from the old one if given. \
$g is the new weather, $0 the old, $1 the forecast. EXECMSG_PROG WEATHERCHANGE, TODCHANGE and DATECHANGE hear \
a change of weather, of the time of day, and a new day, in the area.\n\r\
MOON_PROG [PHASE/ANY] - When the moon over the host's area becomes the phase (NEW, WAXCRESCENT, WAXQUARTER, \
WAXGIBBOUS, FULL, WANEGIBBOUS, WANEQUARTER, WANECRESCENT). $g is the phase, $0 the one before.\n\r\
GAME_PROG [NEWGAME/RESTORE/SAVE/NEWCHAR/SWITCHTO/SWITCHFROM/PAUSE/RESUME/TIMEMODE/ANY] (MASK) - When the game \
starts new or restored, is saved, a character is made, the player switches characters, pauses, resumes or \
changes the time mode; heard by every object with the trigger. $n is the character, $g the save's name for SAVE \
and RESTORE and otherwise the event, $0 the event, $1 the detail (the other character, or TURNS or REALTIME). \
SAVE runs at once, before the save is made, so what it sets is saved; RETURN CANCEL refuses the save.\n\r\
TURN_PROG (EVERY N) (MASK) - At the end of each turn: a party's turn in turn-based time, a player's command that \
takes time in real time; every N turns if given. Heard by objects with the trigger in the leader's area, the area, \
and the world's scripts. $n is the leader, $g the turns since the game began.\n\r\
The files in world/scripts/ are scripts on one hidden object, WORLD (its variables are WORLD's), that goes \
where the player goes and ticks every tick: GAME_PROG, QUEST_PROG and TURN_PROG there hear the whole game.\n\r\
VERB_PROG [VERB(,ALIAS...)] (P [PHRASE] / [KEYWORDS]) - When a player types the verb (whole, not a prefix) \
and the rest of the line names the object the script is on (or has the phrase or a keyword; a room or area needs \
no naming), before any command, skill or social of that word; on items carried or here, mobs, exits, the room and \
the area. $t is the object, $g the rest of the line. RETURN CONTINUE hands the line back to the usual commands. \
Prop_Verbs (VERBS=\"pull,yank\" MSG=\"...\" OTHERS=\"...\") does it without a script; LIST VERBS lists a room's.\n\r\
PARTY_PROG [JOIN/LEAVE/REST/LEAD/SWITCH/ANY] (MASK) - When a character joins the party, leaves it, rests, takes \
the lead, or the player switches to a member; heard by every object with the trigger. $n is the member, $t the \
leader, $g the event.\n\r\
SEASON_PROG [SPRING/SUMMER/FALL/WINTER/ANY], MONTH_PROG [NUMBERS OR NAMES/ANY], YEAR_PROG [YEAR/ANY], \
WEEKDAY_PROG [DAY NAMES/ANY] - When the area's clock comes to a new season, month or year, or each new day of \
the week. $g is the new one, $0 the one before.\n\r\
CLAN_PROG [JOIN/LEAVE/PROMOTE/DEMOTE/EXILE/RELATION/CONQUER/LOSEAREA/LEVEL/ALL] (CLAN/ALL) - When a member \
joins or leaves a clan (however it comes about), is promoted, demoted or exiled, the clan's relation to another \
changes, it wins or loses an area, or changes level; heard in the member's room, the clan's recall room and the \
area. $n is the member, $t the area, $g the new rank, relation or level, $0 the event, $1 the clan, $2 the \
detail, $3 the other clan or the area.\n\r\
CRAFT_PROG [SKILL ID/*] [ITEM WORDS/ALL] (RUINED/SUCCESS) - When a crafter here makes something with the skill \
(heard by the room, its area, and things and mobs around). $n is the crafter, $o and $t the thing made, $g the skill.\n\r\
RECIPE_PROG [SKILL ID/*] [RECIPE WORDS/ALL] - When a crafter here learns a recipe. $o is the thing it makes, $g the skill.\n\r\
FACTION_PROG (@GLOBAL) [FACTION] [RANGE NAME/ANY/UP/DOWN] (MASK) - When a character's standing changes (any, up, \
down), or comes into the named range; heard by the room and area, or anywhere with @GLOBAL. $g is the new \
range, $0 the change, $1 the range before, $2 the faction.\n\r\
COMBAT_PROG [START/END/FLEE/ANY] (MASK) - When the monster's fight (an item's owner's, or any fight in a room) \
starts, ends with both sides alive, or an opponent flees. $n is the opponent (the one fleeing), $g the event.\n\r\
AREA_ENTER_PROG and AREA_LEAVE_PROG (ALL) (PCT/MASK) - When someone comes into the host's area from another area \
(or into the world), or leaves it; with ALL, a move between it and an area inside it counts too. $n is the mover, \
$g the other area's name, $0 the other room's ID. Prop_AreaEntry (ENTER, FIRST, LEAVE, TITLE or SHOWNAME, TEXT, \
DESC, ONCE, MASK, COLOR) and Prop_AreaBanner show text on an area's border.\n\r\
BOARD_PROG (MASK) and DISEMBARK_PROG (MASK) - When someone boards a vessel or leaves it; heard by the vessel, its \
rooms and crew, and the room outside. $n is the one, $t the vessel, $g its name.\n\r\
SAIL_PROG [COURSE/ANCHOR/STEER/ALL] - When one allowed to gives the vessel an order. $n is the helmsman, $g the \
order, $0 its kind.\n\r\
VESSEL_ARRIVE_PROG [ROOM ID/AREA/ALL] - On the vessel and its crew, when it comes into a room. $g is the room's ID, \
$0 its area. VESSEL_GREET_PROG [VESSEL WORDS/ALL] - On a room a vessel comes into, and what is there. \
DOCK_PROG - When the vessel's anchor drops; heard aboard and in the room. $g is the room's ID.\n\r\
READ_PROG [ITEM WORDS/P PHRASE/ALL] - When someone reads the thing (on a thing, only its own reading; on its \
holder, room or area, any that fits). $n is the reader, $o the thing. It runs before the reading: RETURN CANCEL \
keeps the thing's own text back. CoffeeSUD: READ_PROG PAGE [N]/[TITLE] for a page of a GenTome (AHELP GENTOME).\n\r\
GENERATED_PROG (PCT) - When a generator has made the area or room the host is in (the area, its rooms, mobs and \
items hear it; EXECMSG_PROG GENERATED too). $g is the generator's ID. An AREA tag's onGenerate=\"...\" runs once.\n\r\
FIRSTGREET_PROG (PCT) - When the mob first meets a character ever (sees them arrive). REGREET_PROG [GAME DAYS] (PCT) \
- When a character it has met comes back after at least that many game days. The meetings are kept in the save.\n\r\
EVERY_PROG [N] (HOURS/DAYS/WEEKS/MONTHS) (CATCHUP) - Every N hours, days, weeks or months of the area's clock, \
its next time kept in the save; with CATCHUP, $g is how many times it was due while the host did not tick.\n\r\
VAR_PROG [HOST/*/QUEST] [VAR] [==/!=/>/</>=/<=] [VALUE] - When a script variable's change makes the condition \
come true; heard by every object with the trigger. $g is the new value, $0 the old.\n\r\
AFFECT_PROG [ADD/REMOVE/ANY] [ABILITY ID/NAME WORDS/*] - When an effect is put on something or comes off it; \
heard by the thing, its room, and an item's owner. $t is the thing, $g the effect's ID, $n its invoker.\n\r\
DESTROY_PROG [REASON/WORDS/ALL] - When an item is destroyed, at once, on the item, its room and its owner; $g is \
DECAY, JUNKED or empty. DECAY_PROG - When an item rots or runs out (its expiry).\n\r\
ACHIEVE_PROG [ACHIEVEMENT ID/*] (MASK) - When an achievement is earned; heard by every object with the trigger. \
$n is the earner, $g the achievement's ID.\n\r\
SIGNAL_PROG [NAME/ALL] - When a script sends the signal to this thing, with MPSIGNAL. $g is its arguments, \
$n who caused it, $t the thing that sent it.\n\r\
PUTTING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When matching something is put in something, the words naming the \
thing put (PUT_PROG's name the container). On a mob, only its own putting; on an item, when it is the thing put; on a \
room or area, anyone's. $n is the one putting, $t and $o the container, $p the thing put.\n\r\
SPEAK_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself says the words (SPEECH_PROG hears others); \
on an item, room or area, when anyone says them. $n is the speaker, $t the one spoken to, $g what was said.\n\r\
GIVING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster gives away a matching thing (GIVE_PROG is when it is \
given one); on an item, when it is the thing given; on a room or area, any giving. $n is the giver, $t the one given \
it, $o the thing.\n\r\
CAST_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When someone else uses a skill, spell or other ability of that name (or \
ID) on the monster; on a room or area, anyone's. Speech in a language other than Common counts too, as that language. \
$n is the user, $t the monster, $g the trigger word that matched. Not on items.\n\r\
CASTING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself uses a skill, spell or other ability of that \
name (or ID), a language it speaks in too; on a room or area, anyone's. $n is the user, $t its target, $g the trigger \
word that matched. Not on items.\n\r\
CMDFAIL_PROG [COMMAND] (P) [A PHRASE]/[ONE OR MORE WORDS]/ALL - When a command fails, or is not known (Huh?), and the \
word typed starts the command given (OP for OPEN). ALL or nothing for any words after it, P for exactly these. It runs \
before the failure is shown: RETURN CANCEL keeps it back. $n is the one who typed it, $t the command's target, $g the \
rest of the line.\n\r\
GROUP_GREET_PROG [PCT CHANCE] - Same as ALL_GREET_PROG, but at most once a tick, so a group coming in together sets it \
off once, for the first of them. In the host's room only, not on areas.\n\r\
DROPPING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself drops a matching thing (DROP_PROG hears \
others). $t and $o are the thing. MPNOTRIGGER DROP_PROG stops it too.\n\r\
GETTING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself gets a matching thing (GET_PROG hears others). \
$t and $o are the thing. MPNOTRIGGER GET_PROG stops it too.\n\r\
RIDE_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When someone else mounts a matching rideable: the host itself, or, on a \
room, area or mob, any rideable there. $n is the rider, $t the rideable.\n\r\
RIDING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself mounts a matching rideable (RIDE_PROG hears \
others). $t is the rideable.\n\r\
WEARING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself wears, holds or wields a matching thing \
(WEAR_PROG hears others). $t and $o are the thing. MPNOTRIGGER WEAR_PROG stops it too.\n\r\
DISMOUNT_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - As RIDE_PROG, when someone else gets off a matching rideable.\n\r\
REMOVING_PROG (P) [A PHRASE]/[ONE OR MORE WORDS] - When the monster itself removes a matching thing it wears \
(REMOVE_PROG hears others). $t and $o are the thing. MPNOTRIGGER REMOVE_PROG stops it too.\n\r\
Of these, SPEAK_PROG and the -ING triggers (PUTTING, GIVING, CASTING, DROPPING, GETTING, RIDING, WEARING, REMOVING) \
are, on a mob, for its own doing; DROPPING, GETTING, RIDING, WEARING and REMOVING work on mobs only. The words match \
a word of the thing's name, or its ID; P a whole name. All but CMDFAIL_PROG run after the deed, on the host's next \
tick (at once with MPSETINTERNAL NODELAY TRUE), so RETURN CANCEL cannot stop it.\n\r\
*** NOTE Phrases for MASK_PROG, GIVE_PROG, GET_PROG, PUT_PROG, REMOVE_PROG, WEAR_PROG, BUY_PROG, SELL_PROG, \
and SPEECH_PROG must group words and phrases \
together using the "'" character, for instance 'a phrase' or 'multiple words'. \
The characteris unnecessary when put around single words 'word'.\n\r\
\n\r\
*** NOTE If Scriptable is placed on an Item, triggers such as GET_PROG, DROP_PROG, \
WEAR_PROG, and REMOVE_PROG will only trigger when the scripted item is involved. \n\r\
\n\r\
*** NOTE MASK_PROG and ACT_PROG will check commands as they appear to the mob with \
this behavior.  Consider perspective, vision, and word tense in light of this fact \
when wording your masks.  For instance, the purchase of a sword in a dark shop \
may be seen as 'Someone buys something from someone' instead of 'Bob buys a sword from Joe'.\n\r\
\n\r\
Following this line is your script itself.  The commands are as follows:\n\r\
IF/ENDIF/ELSE Conditional evaluations, separated by AND/OR.  The IF statement \
can group conditions with () and use the following functions as part of its \
evaluation:\n\r\
 - RAND([% CHANCE])    Random truth\n\r\
 - HAS([CODE] [ITEM NAME])  if the given mob has the specified item.\n\r\
 - HASNUM([CODE] [ITEM NAME] == [NUM])  the amount the given mob has of the item.\n\r\
 - HASTITLE([CODE] [TITLE STR])  if the given mob has the give title.\n\r\
 - WORN([CODE] [ITEM NAME])  if the given mob wears the specified item.\n\r\
 - ISNPC([CODE])  if the given mob is a non-player.\n\r\
 - ISPC([CODE])  if the given mob is a player.\n\r\
 - ISPKILL([CODE])  if the given mob has playerkill flag on.\n\r\
 - ISGOOD([CODE])  if the given mob is good.\n\r\
 - ISNAME([CODE] [WORDS])  if the given item is named with given words.\n\r\
 - CURRENCY([CODE] == [NAME])  if the native currency of the mob or coins is the name. Where == may be !=.\n\r\
 - NUMMOBSINAREA([MOB NAME] == [NUM]) if comparison of number of mobs of that name in area. Where == may be !=, >, <, <=, <=.\n\r\
 - NUMMOBS([MOB NAME] == [NUM]) if comparison of number of mobs of that name in world. Where == may be !=, >, <, <=, <=.\n\r\
 - NUMRACES([MOB NAME] == [NUM]) if comparison of number of mobs of that name in world. Where == may be !=, >, <, <=, <=.\n\r\
 - ISEVIL([CODE])  if the given mob is evil.\n\r\
 - ISNEUTRAL([CODE])  if the given mob is neutral.\n\r\
 - ISFIGHT([CODE])  if the given mob is fighting.\n\r\
 - ISALIVE([CODE])  if the given mob is alive and available.\n\r\
 - ISIMMORT([CODE])  if the given mob is an archon.\n\r\
 - ISCHARMED([CODE])  if the given mob is charmed.\n\r\
 - STRCONTAINS([STRING] [CODED WORDS])  is string contains coded words.  May use "" & | > < ().\n\r\
 - STAT([CODE] [STAT] == [VALUE]) if the given mob/item has a stat of value, != is also valid.\n\r\
 - GSTAT([CODE] [STAT] == [VALUE]) like STAT, but player data accessible. See Generic.java.\n\r\
 - DATETIME([TIME/DAY/ETC] == [VALUE]) like STAT, but player data accessible. Where == may be >, <, !=, >=, or <=.\n\r\
 - AFFECTED([CODE] [SPELL CLASS]) if the mob is affected by spell.\n\r\
 - ISBEHAVE([CODE] [BEHAVIOR CLASS]) if the mob has a behavior.\n\r\
 - ISFOLLOW([CODE])  if the given mob is following someone in the room.\n\r\
 - ISSERVANT([CODE])  if the given mob is serving someone in the room.\n\r\
 - HITPRCNT([CODE] == [% HITS])  if the given mob has the pct chance hit points.  Where == may be >, <, !=, >=, or <=.\n\r\
 - HASTATTOO([CODE] [TATTOONAME]) whether the given mob has the given tattoo.\n\r\
 - INLOCALE([ROOM CLASS]) if the mob is in the given room type.\n\r\
 - ISBIRTHDAY([CODE]) if the mobs birthday is today.\n\r\
 - INROOM([ROOM ID/MOB NAME] == [ROOM ID/MOB NAME]) if the mob is in the given room.  BEACON, MYPROPERTY, ANYPROPERTY and ANYSPECIAL may stand for the room; CoffeeSUD: with a mob on the left, BEACON and MYPROPERTY are that mob's (its start room, land it or its profile owns), not the scripted mob's.\n\r\
 - MOOD([MOB NAME] == [MOOD NAME]) if the mob has a mood, and it is the one specified.\n\r\
 - ISRECALL([MOB NAME]== [ROOM ID/MOB NAME]) is the mob is from the given room.\n\r\
 - ISHERE([CODE]) if the mob/item in the same room as the scripted one.\n\r\
 - INAREA([NAME]) if the scripted mob/item in room named by the parameters.\n\r\
 - ISLIKE([CODE] [MASK]) if the mob/item meets the given zapper mask.  See ZAPPERMASKS for mask syntax\n\r\
 - ISODD([AMT]) whether the given argument is an odd whole number\n\r\
 - VAR([CODE] [VAR NAME] == [VALUE]) if the var for the given mob has value.  Where == may be !=, >, <, >=, <=.\n\r\
 - FACTION([CODE] [FACT] == [VALUE]) if the faction for the given mob has value.  Where == may be !=, >, <, >=, <=.\n\r\
 - SEX([CODE] == [M/F/N]) evaluates sex.  Where == may also be !=.\n\r\
 - POSITION([CODE] == [SLEEPING/STANDING/SITTING] Evaluates position.\n\r\
 - LEVEL([CODE] == [LVL]) evaluates level.  Where == may be !=, <, >, >=, <=.\n\r\
 - MATH([EXPR] == [EXPR]) evaluates expression.  Where == may be !=, <, >, >=, <=.\n\r\
 - QUESTPOINTS([CODE] == [VAL]) evaluates questpoints.  Where == may be !=, <, >, >=, <=.\n\r\
 - QVAR([QUEST] [CODE] == [VAL]) evaluates temp quest vars.  Where == may be !=, <, >, >=, <=.\n\r\
