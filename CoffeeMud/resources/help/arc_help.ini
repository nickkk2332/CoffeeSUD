LIST_SESSIONS=\
Command  : LIST\n\r\
Usage    : LIST SESSIONS (STATUS/VALID/NAME/IP/IDLE/[NUM])\n\r\
Example  : list sessions\n\r\
Example  : list sessions name\n\r\
Example  : list sessions 5\n\r\
Lists the players online, their idle time, status, and ip address.  An \
optional parameter may be given to sort by one of the fields, or to \
get longer info on a particular session.

NOPURGE=\
Command : NOPURGE\n\r\
Usage   : NOPURGE [PLAYER NAME]\n\r\
Example : nopurge bob\n\r\
Short(s): \n\r\
Makes a player inelligible for purging by the autopurge system.  Use LIST NOPURGE, \
or DESTROY NOPURGE for maintaining the list.

LLM=\
Command : LLM\n\r\
Usage   : LLM [MESSAGE]/RESET\n\r\
Example : llm hello there mr robot!\n\r\
Example : llm reset\n\r\
Short(s): \n\r\
A command for the conversing with the LLM, if one is integrated.  The \
LLM can be reset for the current user with the RESET argument.

REGENERATE=\
Command : REGENERATE\n\r\
Usage   : REGENERATE (NOSAVE) AREA ([SEED=N]/[SEED=SAME]) ([VAR]=[VAL]...)\n\r\
Usage   : REGENERATE LOCK / UNLOCK\n\r\
Usage   : REGENERATE\n\r\
Example : regenerate area seed=same\n\r\
Example : regenerate area seed=77 areasize=30\n\r\
CoffeeSUD: builds the area you are in again from its GENSOURCE, the record GENERATE AREA keeps of how \
it was made, with the same seed (SEED=SAME), another (SEED=N) or a new one, and the variables given \
changed.  Rooms marked GENLOCK are kept as they are, with their exits: write or change a room by hand, \
REGENERATE LOCK it (the Prop_GenLock property), and a better template can be run again without losing \
it.  The other rooms are replaced by the new build's rooms of the same IDs, every exit into the area \
(the gate too) is pointed at the room of its ID, an exit to a room the new build lacks is removed, and \
players there move to the new room.  REGENERATE alone says how the area was made and which rooms are \
kept.  The Regenerate behaviour (AHELP BEHAVIOR_REGENERATE) and MPREGENERATE re-roll an area in play, \
on a schedule, at a moon or when the party leaves, and its GENERATED_PROG runs after.

LINK=\
Command : LINK\n\r\
Usage   : LINK [ROOMID] [DIRECTION]\n\r\
Example : link midgaard#3001 north\n\r\
Example : link Smurfy Road east\n\r\
Example : link midgaard#3001#(3,2) north\n\r\
Short(s): \n\r\
A command for the linking of rooms to each other, including grid rooms.
	
LOAD=\
Command : LOAD\n\r\
Usage   : LOAD [OBJECT TYPE] [PATH/NAME]\n\r\
Example : load resource banned.ini\n\r\
Example : load ability /myclasses/blah.class\n\r\
Example : load weapon /myclasses/blah2.class\n\r\
Example : load class com.planet_ink.coffee_mud.Items.Weapons.Sword.class\n\r\
Example : load weapon com/planet_ink/coffee_mud/Items/Weapons/Sword.java\n\r\
Short(s): \n\r\
A command for the loading of resources, faction ini files, unloaded areas, \
or class files of java or javascript.\n\r\
\n\r\
Use LIST RESOURCES to see a list of resources.\n\r\
\n\r\
Use LOAD AREA area name re-load areas in the database that have been unloaded.\n\r\
\n\r\
For class files, the LIST command can also show whats already loaded.  This command \
will automatically attempt to unload a class if it is already loaded.  If the specified \
class is a java source file or javascript, it will attempt to compile it first.  \
For loading classes, the second parameter may be the word "class" and the system \
will attempt to correct your ambiguity.  If it is unable to determine the type of \
class being loaded, however, you may get an error.  It is therefore better just \
to use the load [CLASS-TYPE] syntax instead.
	
MODIFY=\
Command : MODIFY\n\r\
Usage   : MODIFY [ITEM TYPE] ... \n\r\
Example : modify room name The Grassy Knole\n\r\
Example : modify mob orc\n\r\
Example : modify item longsword\n\r\
Example : modify item "longsword@an orc"\n\r\
Example : modify jscript\n\r\
Example : modify news\n\r\
Short(s): \n\r\
A command for the modification of an ITEM, RACE, CLASS, ABILITY, LANGUAGE, CRAFTSKILL, GATHERSKILL, WRIGHTSKILL, \
ALLQUALIFY, AREA, EXIT, COMPONENT, RECIPE, EXPERTISE, QUEST, \
MOB, USER, HOLIDAY, ACHIEVEMENT, MANUFACTURER, HELP/AHELP, TRAP, CRON, \
GOVERNMENT, JSCRIPT, FACTION, SOCIAL, CLAN, NEWS, DAY, MONTH, YEAR, \
TIME, HOUR, UPDATE: (MQL), or ROOM. \
Enter MODIFY or MODIFY X for more information on command usage.  \
In the Effects field, an ID adds that effect, -ID removes one, and =ID or \
its number edits one's parameters, the current ones shown and kept if \
none are given; ?P lists the properties and effects that can affect the \
thing, each with a line of its help.  An effect it has already is offered \
Prop_MultiEffects, which holds both copies, as a second copy alone would \
be ignored.  CoffeeSUD: MODIFY BEHAVIOR [ID] edits a generic behaviour, and MODIFY BEHAVIOR [ID] \
[FIELD] [VALUE] sets one field of it (AHELP GENBEHAVIOR).
	
IMPORT=\
Command  : IMPORT\n\r\
Usage    : IMPORT (NOPROMPT) (NODELETE) (AREATYPE=TYPE) [FILE NAME(S)] \n\r\
Example  : import /areas/myarea.cmare\n\r\
Example  : import noprompt nodelete /areas/midgaard.are\n\r\
Example  : import areatype=stdthininstance /areas/midgaard.are /areas/school.are\n\r\
Example  : import noprompt /areas/areas.lst\n\r\
Example  : import noprompt /areas/\n\r\
Short(s) : \n\r\
The import command will allow you to import official coffeemud \
area files, whose extension is "*.cmare"\n\r\
CoffeeMud may also import, with varying levels of success, the "*.are" \
files used by other muds.  Some formats are better supported \
than others, so be sure to carefully examine the imported \
area afterwards.\n\r\
The import command will auto detect, based on the file given, \
whether the file refers to a coffeemud area file, room file, \
a "*.are" from another mud, or a "*.lst" list of other area \
files.\n\r\
The CoffeeMud "resources" directory is the default path.  Remember \
that all paths in CoffeeMud treat the install directory as "root'. \
This means that the files being imported must be copied into a \
folder underneath your install directory before use.  See the help \
on VFS for more information on this concept.

MERGE=\
Command  : MERGE\n\r\
Usage    : MERGE (AREA/ROOM) (CHANGE=[FIELD,..]) (ON=[FIELD,..]) (IGNORE=[FIELD,..]) [PATH & FILE NAME]\n\r\
Usage    : MERGE (AREA/ROOM) DATABASE (MOBS/ITEMS/ROOMS) DBCLASS=[JAVACLASS] DBSERVICE=[DB SERVICE URL]\n\r\
:        :       DBUSER=[USERNAME] DBPASS=[PASSWORD] (IGNORE=[FIELD,..]) (MASK=[ZAPPERMASK])\n\r\
Example  : merge /myfiles/myitems.cmare\n\r\
Example  : merge change=damage,level,ability /myfiles/myweapons.cmare\n\r\
Example  : merge area change=material ignore=level /myfiles/myweapons.cmare\n\r\
Example  : merge change=damage on=name /myfiles/weapons.cmare\n\r\
Example  : merge area database dbclass=com.mysql.jdbc.Driver dbservice=jdbc:mysql://localhost:3306/db\n\r\
:        :            dbuser=username dbpass=password ignore="IMG,ATTACK" MASK="-NAMES +Bob"\n\r\
Short(s) : \n\r\
Allows you to selectively modify all instances of a mob or item in the world \
based on the contents of a CMARE file containing items or mobs, or another \
CoffeeMud database. \n\r\
\n\r\
When using CMARE files, the files must be \
generated using the EXPORT (WORLD/AREA/ROOM) (ITEMS/WEAPONS) command. \
The first parameter specifies whether the items in the text file are to be \
merged with those in the entire world, in your current area, or just the room. \
The second parameter (CHANGE) is implied to be ALL unless specified otherwise. \
It denotes which fields in the existing items may be changed based on what \
changes are seen to the item inside the CMARE file.   The third parameter \
(ON) is implied to be ALL unless specified otherwise.  It denotes how an item \
in the CMARE file is matched with an existing item in your world.  If the \
listed fields from the CMARE file and the existing item are equal, the items \
will be considered a match for the purposes of merging.  The fourth parameter \
(IGNORE) is implied to be NONE unless specified otherwise.  It denotes \
exceptions to the (ON) parameter, namely which fields are allowed to differ \
between items in the CMARE file and an existing item in cases where they would \
otherwise be considered a match according to the (ON) parameter.  Matched \
items in your existing world, in every room, will be modified accordingly, and \
the room will be resaved to your database.  The log will reflect all changes \
made to your world.  Every room in every area in your world will be reloaded \
from the database prior to any evaluations or changes.\n\r\
\n\r\
When using a database as a source, the merge command will compare and match the \
database version of the room contents with the local world.  The user is then \
given the opportunity to make changes to the local world depending on differences. \
The merge requires DBCLASS, DBSERVICE, DBUSER, and DBPASS parameters be set.  The \
IGNORE parameters is a comma delimited list of fields to ignore when displaying \
differences.  To mask the types of objects checked, the user can specify mobs, items, \
or the whole rooms after the word database, and a zappermask can be included after the \
mask parameters.

MPCOMMAND=\
Command : MPCOMMAND\n\r\
Usage   : MPxxx ([ARGUMENT]...)\n\r\
Example : MPECHO bob\n\r\
Short(s): \n\r\
Execute an MP command from the command line, for what that's worth.

EXPORT=\
Command : EXPORT\n\r\
Usage   : EXPORT (AREA/ROOM/WORLD) (DATA/ITEMS/MOBS/WEAPONS/ARMOR) ([FILE]/SCREEN/EMAIL)\n\r\
Usage   : EXPORT (CATALOG) (DATA/ITEMS/MOBS/WEAPONS/ARMOR) ([FILE]/SCREEN/EMAIL)\n\r\
Usage   : EXPORT (PLAYER/PLAYERS) (DATA/ITEMS/MOBS/WEAPONS/ARMOR) ([FILE]/SCREEN/EMAIL)\n\r\
Usage   : EXPORT (CLASS/RACE/ABILITY) (DATA/[ID]) ([FILE]/SCREEN/EMAIL)\n\r\
Example : export room myroom\n\r\
Example : export area /home/users/myarea\n\r\
Example : export area weapons /home/users/myarea\n\r\
Example : export area screen\n\r\
Example : export area email\n\r\
Example : export catalog mobs\n\r\
Example : export world data /exportfiles/\n\r\
Example : export player bob\n\r\
Short(s): \n\r\
The export command will generate the official coffeemud area files, \
whose extension is "*.cmare".  This command may also be used to export \
individual rooms, player data, or unique items or mobs as well.  If the second parameter \
(ITEMS/MOBS/WEAPONS/etc) is NOT specified, export will produce full \
room data for the scope of the first parameter (AREA, ROOM, or WORLD). \
If the second parameter IS specified, then only the specified data will \
be generated.\n\r\
The results will be written to the file given in the last argument, or to the \
screen if "screen" is given as the last argument, or sent to your email address \
if that is enabled.  The extension need not be \
included, as coffeemud will add it if not present.  If a directory name \
is given (no file name), the system will reference the AREA ARCHIVE file \
name for an Area, assuming EXPORT AREA or EXPORT WORLD is used. The default \
directory for this command is the CoffeeMud root.

ORDER=\
Command : ORDER\n\r\
Usage   : ORDER [TARGET NAME] [COMMAND(S)]\n\r\
Example : order dog flee\n\r\
Short(s): \n\r\
This command will allow you to force a mob to perform any command \
listed in the COMMANDS or SOCIALS list, except for certain commands \
such as ALIAS, SERVE, various CONFIG commands (AUTO*), BUY, BID, \
and so forth.
	
POOF=\
Command : POOF\n\r\
Usage   : POOF\n\r\
Short(s): \n\r\
For those with access to the GOTO command, this command will allow the admin to change \
the messages seen when they leave and enter a room via GOTO.  The S-NAME, S-HIM-HER and \
other codes may be used so that the admins name is properly presented.  Remember to \
surround the codes with the less-than and greater-than tag markers!  You can also \
change your death poof. as per the non-archon version of this command.

PURGE=\
Command : PURGE\n\r\
Usage   : PURGE [ITEM TYPE] ... \n\r\
Example : purge orc\n\r\
Example : purge item longsword\n\r\
Example : purge item longsword@an orc\n\r\
Short(s): \n\r\
This command is a weak form of DESTROY, allowing only items and mobs to be \
destroyed.  Rejuvinating mobs will still rejuvenate when purge is used, unlike \
destroy.
	
QUESTWINS=\
Command : QUESTS\n\r\
Usage   : QUESTS (WON/[QUEST NAME]/[PLAYER NAME])\n\r\
Example : quests\n\r\
Example : quests won\n\r\
Example : quests bob\n\r\
Short(s): \n\r\
This command is for listing quests one is either involved in, or \
were involved in. The admin version of this command allows a player \
name to be specified when retreiving information, or if the quest name \
is supplied, the winners of the quest.  Enter HELP QUESTS \
for more information on the mundane use of the command.

SNOOP=\
Command : SNOOP\n\r\
Usage   : SNOOP [TARGET NAME]\n\r\
Example : snoop player\n\r\
Short(s): \n\r\
This command will allow you to watch a player play -- seeing everything \
they type in, and everything they read on their screen.
	
DEVLOG=\
Command  : DEVLOG\n\r\
Usage    : DEVLOG ON (ERROR/WARN/INFO/DEBUG) (MODULE [MASK])\n\r\
Usage    : DEVLOG OFF\n\r\
Usage    : DEVLOG LAST ([NUMBER]) (ERROR/WARN/INFO/DEBUG) (MODULE [MASK])\n\r\
Usage    : DEVLOG CLEAR\n\r\
Example  : devlog on warn module Scripting,Quest*\n\r\
Example  : devlog last 30 error\n\r\
Short(s) : \n\r\
In builder mode or a DEV=1 game, tells you each line the engine logs as it \
is logged, whatever mud.log is set to keep: script errors, JavaScript errors, \
MPLOG, MPDEBUG and debug() lines (told you whatever you watch), quest failures, what the world files' loader skipped.  ON takes the \
level (ERROR, WARN, the default, INFO or DEBUG, each with those above it) and \
a mask of modules (names separated by commas, * for any letters).  Each line \
comes as one coloured line with its level and module; a line repeated is \
told once, and how many more times when something else comes.  LAST replays \
the last lines kept (500), the repeats counted, by level (DEBUG, all, by \
default) and module; CLEAR forgets them.  In builder mode the setting is kept \
beside the database for the next time; the DEVLOG= key in coffeemud.ini \
(DEVLOG=WARN Scripting,Quest*) gives it otherwise.

ASSERT=\
Command  : ASSERT\n\r\
Usage    : ASSERT HERE [ROOM ID]\n\r\
Usage    : ASSERT HAS [ITEM]\n\r\
Usage    : ASSERT VAR [HOST] [NAME] [=/!=/</>/<=/>=] [VALUE]\n\r\
Usage    : ASSERT QUEST [NAME] STEP [NUMBER]\n\r\
Example  : assert here Moor#1\n\r\
Example  : assert var Hero PAIDTROLL = 1\n\r\
Short(s) : \n\r\
In builder mode or a DEV=1 game, answers ASSERT ok: ... or ASSERT FAIL: ... and \
why, for playtest files: you are in the room, carry the item, a global script \
variable compares so (numbers as numbers), or a quest is running at the step. \
Playtest files, world/tests/*.play, hold one command a line and #expect TEXT, \
#reject TEXT, #assert ..., #wait N, #save SLOT, #seed N, #char \
NAME,RACE,CLASS and #restore SLOT; tools/playtest.sh runs them, each in a new \
game on a scratch copy of the world, in turns with a fixed seed, prints PASS \
or FAIL for each with the failing lines, and exits 1 if any failed.

TESTCHAR=\
Command  : TESTCHAR\n\r\
Usage    : TESTCHAR [NAME] (KIT=[KIT]) (PARTY)\n\r\
Usage    : KIT [KIT] ([CHARACTER OR MOB])\n\r\
Example  : testchar Tank KIT=act3-warrior PARTY\n\r\
Example  : kit act3-cleric Heals\n\r\
Short(s) : KIT\n\r\
In builder mode or a DEV=1 game, TESTCHAR makes a character of your profile \
with no questions: an average human apprentice of level 1, or as the kit \
says, levelled as CHARGEN levels, starting where you are or in the kit's \
room.  PARTY brings them into the world and the party (as PARTY ADD); without \
it they rest in the profile.  KIT gives a character, a follower or a mob here \
(you, by default) a kit.  Kits are kept with the world, world/kits/NAME.kit, \
one setting a line (# for comments): race, class, gender, alignment (good, \
neutral, evil...), level, gold, room, item (a class, or catalog:NAME; worn if \
it can be; as many as wanted), ability ID PROFICIENCY, faction ID VALUE and \
var NAME VALUE (a global script variable of the character).
KIT=TESTCHAR

HAZARDS=\
Command  : HAZARDS\n\r\
Usage    : HAZARDS ([AREA NAME])\n\r\
Usage    : WEATHER SET [WEATHER] (FOR [N] HOURS/DAYS) (AREA [NAME]) (NEXT)\n\r\
Usage    : WEATHER FORECAST\n\r\
Usage    : WEATHER NEXT\n\r\
Usage    : TIME SET [HOUR/DAWN/DAY/DUSK/NIGHT]\n\r\
Usage    : TIME SEASON [SPRING/SUMMER/FALL/WINTER]\n\r\
Usage    : LOOK AS [CONDITION]...\n\r\
Example  : weather set thunderstorm\n\r\
Example  : time set dusk\n\r\
Example  : look as night fog\n\r\
Short(s) : WEATHER SET,WEATHER FORECAST,WEATHER NEXT,TIME SET,TIME SEASON,LOOK AS\n\r\
For builders (builder mode, a DEV=1 game, or CMDAREAS).  HAZARDS lists what \
an area holds that acts on those in it: the area's own behaviours and effects \
(spawners such as RandomMonsters, weather), and in its rooms, exits and items \
their behaviours, traps, Prop_InstantDeath, Prop_NarrowLedge and \
Prop_Weather, each with its state (as STAT BEHAVIORS gives it) or its \
parameters.  WEATHER SET changes the area's weather now, as a change of \
weather comes, with its messages and the scripts that wait on it, or with \
NEXT only the weather that comes next (CLEAR, CLOUDY, WINDY, RAIN, \
THUNDERSTORM, SNOW, HAIL, HEAT, SLEET, BLIZZARD, DUST, DROUGHT, COLD, FOG); \
FOR holds it there, each change coming back to it, for that much game time. \
WEATHER FORECAST shows the weather now, what comes next, a hold, and the \
odds of each weather the step after, from the area's season and climate; \
WEATHER NEXT makes the next change now. \
TIME SET runs the area's clock forward, hour by hour as TICKTOCK does (so \
its events happen), to an hour or the start of DAWN, DAY, DUSK or NIGHT; \
TIME SEASON runs it forward a month at a time to the season.  LOOK AS shows \
this room under made-up conditions, as PREVIEW does.

LAW=\
Command  : LAW\n\r\
Usage    : LAW\n\r\
Usage    : LAW CRIMES ([TEXT])\n\r\
Usage    : LAW WARRANTS ([NAME])\n\r\
Usage    : LAW PARDON [NAME] ([CRIME]/ALL)\n\r\
Usage    : LAW ACCUSE [NAME] [CRIME]\n\r\
Example  : law\n\r\
Example  : law accuse Bob ASSAULT\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with ABOVELAW: the law of the area you are \
in, as it found its people and places by name: the legal behaviour and its \
law file, the officers and judges it found among the area's mobs (or that it \
found none, so that a misnamed guard shows at once, and a mob named as one but \
not one, and why: an officer must wander, a judge stay put), the jail and release \
rooms each name found (or FOUND NOWHERE), the taxes, and how many crimes and \
warrants there are.  CRIMES lists the crimes, with their names, sentences, \
places and circumstances, or those holding the text.  WARRANTS lists the \
warrants out, or a person's.  PARDON takes a person's warrants away, or \
those for one crime.  ACCUSE makes one, as a witness would.

TIMESCALE=\
Command  : TIMESCALE\n\r\
Usage    : TIMESCALE ([RATE])\n\r\
Example  : timescale 8\n\r\
Example  : timescale 1\n\r\
Short(s) : \n\r\
In builder mode or a DEV=1 game: how fast the game clock runs against \
real time, from 0.1 to 20.  At 8, eight game seconds pass in each real \
one, so ticks, cooldowns, decay, effects and the calendar all come eight \
times as soon: a caravan's route or a change of weather is watched in a \
few minutes.  PAUSE and turn-based time work as before.  The prompt shows \
(x8) while it is not 1.  TIMESCALE= in coffeemud.ini sets it at start.

NOTES=NOTE
NOTE=\
Command  : NOTE\n\r\
Usage    : NOTE (HERE) [TEXT]\n\r\
Usage    : NOTES (ALL)\n\r\
Usage    : NOTES DONE/UNDONE/GOTO [NUMBER]\n\r\
Example  : note the miller mentions a dog that is not in the room\n\r\
Example  : notes goto 4\n\r\
Short(s) : \n\r\
In any game: a playtest note, kept in notes/playtest.txt (NOTESFILE= in \
coffeemud.ini), outside the world and the saves, so that a note made in \
play reaches builder mode, where the fix is made.  Each note has the date, \
the save, the character, the room's ID and name, the game time and the \
text.  NOTE HERE adds the room as it is: its exits, mobs, items, effects \
and behaviours.  NOTES lists those to do, numbered (ALL with those done), \
NOTES DONE marks one done and UNDONE takes that back, and NOTES GOTO, in \
builder mode or a DEV=1 game, takes you to the note's room.

VESSEL=\
Command  : VESSEL\n\r\
Usage    : VESSEL STATUS [NAME]\n\r\
Usage    : LIST SHIPS\n\r\
Usage    : LIST INSTANCES\n\r\
Usage    : LIST UNSAVED\n\r\
Example  : vessel status gull\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDAREAS: VESSEL STATUS shows a \
vessel as it is: where it is and where it is docked, the way it faces, its \
anchor, course, top speed and pace, its hull, owner and home port, the \
behaviours on it, its decks and those aboard with their state (as STAT \
BEHAVIORS shows it), and its crew and passengers.  LIST SHIPS has each \
vessel's anchor, course and owner too.  LIST INSTANCES lists the instance \
areas made from others: each with its parent, its class, the characters it \
was made for, the ticks until it times out, its rooms and a room to GOTO.  \
In builder mode, LIST UNSAVED lists each room whose mobs or items a \
building command (CREATE, MODIFY, DESTROY, COPY, TRANSFER, RESTRING, EVERY, \
GENERATE) changed since it was saved, with the commands and the change in \
its counts from what is saved; SAVE CHANGED saves them.

VALIDATE=\
Command  : VALIDATE\n\r\
Usage    : VALIDATE RECIPES ([SKILL]/ALL)\n\r\
Example  : validate recipes blacksmithing\n\r\
Example  : validate recipes all\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDRECIPES: checks every row of a \
skill's recipe file and of its extension files (.txt.1 and on), each value \
as MODIFY RECIPE would take it (materials, resources, item classes, spells \
and the rest) and each row's number of columns, and reports every problem \
with its file and row, not only the first.  ALL, the default, checks every \
skill's, then hunting.txt (resources, places, frequencies, and mobs or \
races), fishing.txt and components.txt (each entry as the game parses it, \
and its ability).

VOCAB=\
Command  : VOCAB\n\r\
Usage    : VOCAB TEST [TEXT]\n\r\
Usage    : VOCAB INPUT [COMMAND LINE]\n\r\
Usage    : VOCAB LIST [KEY]\n\r\
Usage    : VOCAB RELOAD\n\r\
Usage    : VOCAB ADD [SECTION] [RULE]\n\r\
Example  : vocab input get sword and shield from chest\n\r\
Example  : vocab add final-translation replaceall "colour" with "color"\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDAREAS: tests the translation and \
parser rules.  TEST shows a text after the session, final and filter \
translations, with each rule that matched (nothing is auto-ignored into \
the rule files on the way).  INPUT shows what the raw input parser and the \
command pre-processor make of a typed line: the command, or the commands \
it splits into, and each rule that matched.  LIST shows a lists.ini key's \
value in effect and the file it came from (the world's resources/ over \
the game's).  RELOAD forgets the cached rules, lists, socials and help, so \
that the files are read again.  ADD, in builder mode, appends a rule to the \
world's own rule file (world/resources/translation_... or parser_... for \
the COMMAND-PRE-PROCESSOR, ITEM-PRE-PROCESSOR, ITEM-FAIL-PROCESSOR and \
RAW-INPUT-PROCESSOR sections) under its section, and it takes effect at once.

LANGUAGE_PREVIEW=\
Command  : LANGUAGE\n\r\
Usage    : LANGUAGE PREVIEW [ID] ([PROFICIENCY]) [TEXT]\n\r\
Usage    : LANGUAGE COVERAGE [ID] [FILE/ROOM/AREA/HERE]\n\r\
Example  : language preview Dunetongue 40 the well is dry\n\r\
Example  : language coverage Dunetongue Oasis\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDABILITIES: PREVIEW shows what a \
language does to a text, at a proficiency (50 if none is given): what one \
who does not know it hears, what a listener at that proficiency \
understands, how the speaker at it is heard, what it says written and what \
a reader at it reads, and each word's translation with where it came from: \
the dictionary, or a word list by the word's length.  COVERAGE counts how \
many words of a text the language's dictionary has, over a file, a room \
(or HERE), or an area's rooms and the mobs and items in them, and names \
the words most often missing.  LANGUAGE with other words is LANGUAGES.

ENCOUNTER=\
Command  : ENCOUNTER\n\r\
Usage    : ENCOUNTER LIST | SHOW [TABLE] | ADD [TABLE] [ENTRY] | DEL [TABLE] [N] | ROLL [TABLE] | CHECK ([TABLE]/ALL) | RESET [TABLE]\n\r\
Example  : encounter add darkwood MOBS "grey wolf*2d3" LEADER="dire wolf" WEIGHT=4 MASK="-HOUR +20 +21 +22" AMBUSH\n\r\
Example  : encounter roll darkwood\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDMOBS: the encounter tables of world/encounters, which \
RandomEncounters, MPMLOAD ENCOUNTER and the quests' LOAD ENCOUNTER roll.  A table is a text file, \
one entry a line (# for a comment): its kind, what, and options.  MOBS "name*dice,name*dice" \
brings mobs from the catalog (or a class), as many as the dice say (2d3, 1d4+1, 3, 2-5), with \
LEADER="name" one more that the others follow; MERCHANT "name" the same, for a pedlar; ITEM \
"name*dice" leaves things in the room; EMOTE "text" is shown to the room; TRAP [TRAP ID] is \
set off on the one who came in; FUNC [FUNCTION] runs a FUNCTION_PROG of what rolled the table \
(the area's or room's scripts), $n the one who came in.  Options: WEIGHT=N (1); MASK="[ZAPPER \
MASK]" on the one who came in (-HOUR, -SEASON, -LEVEL, +GROUPSIZE...); LEVEL=LO-HI the party's \
highest level (8- for 8 and up, -5 for up to 5); ONCE (once a game); COOLDOWN=N (N encounters \
of the table before it comes again); FROM=HERE (the default), HIDDEN (hidden in the room) or \
ADJACENT (they walk in from next door); AMBUSH (they strike first).  SHOW lists a table with \
what ONCE and COOLDOWN hold back, ADD checks an entry before it goes in, ROLL rolls the table \
for you where you are, and RESET lets ONCE and COOLDOWN entries come again.

QUESTCHECK=\
Command  : QUESTCHECK\n\r\
Usage    : QUESTCHECK ([QUEST]/[FILE]/ALL)\n\r\
Example  : questcheck bell\n\r\
Example  : questcheck all\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDQUESTS: reads a quest's script \
without starting it or making anything, and reports each problem with its \
line: commands, SET variables and GIVE, TAKE, LOAD and IMPORT kinds the \
quest engine does not know; no SET NAME or SET DURATION; a SET WAIT with no \
SET INTERVAL, which deletes the quest after its first stop; LOAD= and \
IMPORT files that are neither the quest's own (its FILE sections) nor in \
the resources; and, through SCRIPTCHECK, each script it gives.  It takes a \
file in world/quests, a loaded quest by name, a file in the resources, or \
ALL (the default) for every file of world/quests, which builder mode also \
checks at the start, in one line.

PUZZLE=\
Command  : PUZZLE\n\r\
Usage    : PUZZLE CHECK (AREA ([NAME]))\n\r\
Example  : puzzle check\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDROOMS: checks what the world's \
scripts (inline and their LOAD= files) name: a room ID for MPGOTO, MPAT or \
MPTRANSFER that is no room, a direction for MPOPEN, MPCLOSE, MPLOCK or \
MPUNLOCK with no exit, no door or no lock in the host's room, and an \
MPOLOAD or MPMLOAD name that is no class or catalog entry.  Words with \
$-codes are left alone.  It also runs when the game starts, and writes what \
it finds to mud.log.  The puzzle listing and console (PUZZLE, PUZZLE SET, \
SIGNAL and RESET) come with the switch, plate and controller properties.

SCRIPTPROF=\
Command  : SCRIPTPROF\n\r\
Usage    : SCRIPTPROF ON/OFF/RESET\n\r\
Usage    : SCRIPTPROF REPORT ([NUMBER]) (AREA)\n\r\
Example  : scriptprof report 5\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDROOMS: ON counts and times each \
script trigger's runs (its whole run, with the functions and loops it \
calls), by its file and line; REPORT lists those that took longest in all \
(10, or the number given), each with its share, its runs, its longest run \
and the host of that run, or only those in your area with AREA.  OFF stops \
the counting and RESET forgets it.  SCRIPTSLOW= in coffeemud.ini logs each \
trigger run longer than so many milliseconds to mud.log, with its host, \
file and line, and an MPWHILE cut off at its 4-second cap now says so.

COMBATDEBUG=\
Command  : COMBATDEBUG\n\r\
Usage    : COMBATDEBUG ON/OFF ([TARGET])\n\r\
Usage    : COMBATDEBUG LOG [FILE]/OFF\n\r\
Example  : combatdebug on goblin\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDMOBS: explains each attack by or on \
a character in the room (or, with no target, every attack) on one line: the \
attack against the armor, the fudge, the hit chance and the roll, the damage \
of each formula (TARGETED, CRIT, FUDGE), each effect or item that changed \
the damage and what it made of it (an absorb or a resistance), or that \
stopped it, and what was dealt.  Damage outside an attack, a spell's, gets \
a line of its own.  LOG writes the lines to a file as well.

PROGRESSION=\
Command  : PROGRESSION\n\r\
Usage    : PROGRESSION [CLASS] ([RACE]) ([TO LEVEL])\n\r\
Usage    : PROGRESSION XP ([AREA])\n\r\
Example  : progression fighter dwarf 20\n\r\
Example  : progression xp\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDCLASSES: the level curve of a class \
(a Human, to level 10, unless given): for each level the experience it takes, \
the hit points, mana and moves, the practices and trains, and the skills \
gained, those given at once marked *.  PROGRESSION XP adds up the experience \
the content gives: the achievements', then each area's (the literal MPEXP \
amounts in its scripts and its Prop_EnterAdjuster experience), with the \
level a character reaches having done it all, area by area in order.

ORGCHECK=\
Command  : ORGCHECK\n\r\
Usage    : ORGCHECK ([FACTION FILE]/CLANS/GOVERNMENTS/ALL)\n\r\
Example  : orgcheck thieves.ini\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDFACTIONS: reads faction files again \
from their lines, so that what the game's reading hides shows: a key given \
twice (only the later counts), bands that overlap or leave a gap, CHANGE \
triggers that match nothing, REACTION and AFFBEHAV IDs that are no ability, \
behaviour, command or social, a REACTION range that is no band's code, and \
a RELATION faction that does not exist.  CLANS lists the world files' mobs \
whose CLAN is no clan (they lose it as the world loads), GOVERNMENTS the \
governments whose ENTRYSCRIPT does not pass SCRIPTCHECK, and ALL, the \
default, does it all.

EDIT=\
Command  : EDIT\n\r\
Usage    : EDIT SCRIPT [TARGET] ([NUMBER])\n\r\
Usage    : EDIT DESC [TARGET]\n\r\
Example  : edit script the innkeeper\n\r\
Example  : edit script here 2\n\r\
Example  : edit desc the old sword\n\r\
Short(s) : EXTRACT\n\r\
In builder mode or with CMDMOBS, CMDITEMS or CMDROOMS: EDIT SCRIPT opens a \
thing's script (the first, or the number given: its Scriptable behaviours', \
then its scripts) in the line editor, a statement to a line.  The editor's \
menu lists (L), edits (E), inserts (I) and deletes (D) lines, adds them (A), \
replaces text (R), and saves (S) or quits (Q).  On save the script is \
checked as SCRIPTCHECK does: edit it again, keep it, or cancel.  A script \
that is only LOAD=file opens the file, which every LOAD= of it shares, and \
is read again.  EDIT DESC opens the description.  The target is a mob or \
item here or carried, HERE, AREA, or name@room.  A room or area is saved; \
SAVE ROOM keeps a mob or item.  EXTRACT SCRIPT [TARGET] ([NUMBER]) ([FILE]) \
moves an inline script to resources/progs/NAME.script (the world's own \
copy, in builder mode), a statement to a line, and puts LOAD= of it in \
its place, for others to share.  MODIFY's script fields (GenAbility and \
GenTrap's Scriptable Parm, GenCommand's Script), a Scriptable behaviour \
added, a quest's script and a description of more than one line open the \
same editor, and + at a description's prompt opens it for any.  \
EDITOR=WINDOW in coffeemud.ini edits in a window instead, and \
EDITOR=EXTERNAL in the program EDITORCOMMAND= names (or $VISUAL or \
$EDITOR), on a temporary file.

UNDO=\
Command  : UNDO\n\r\
Usage    : UNDO ([NUMBER])\n\r\
Usage    : UNDO LIST ([NUMBER])\n\r\
Example  : undo\n\r\
Example  : undo 3\n\r\
Short(s) : \n\r\
In builder mode or with CMDROOMS: the last 50 building commands (CREATE, \
MODIFY, DESTROY, COPY, TRANSFER, RESTRING, EVERY, GENERATE and GMODIFY) are \
logged, each with the rooms it changed as they were before it, their mobs \
and items too, in memory and in world/.history/.  UNDO puts back the rooms \
of the last one (or the last NUMBER, newest first): each room is made again \
as it was, and saved, those in it waiting outside and the exits into it \
linked again.  UNDO LIST lists them, newest first, with where each was \
given and how many rooms it changed (HISTORY lists the commands typed).

EXTRACT=EDIT

DEVWATCH=WORLD

RUNFILE=\
Command  : RUNFILE\n\r\
Usage    : RUNFILE [NAME] ([ARGS])\n\r\
Example  : runfile shop weaponsmith weapons\n\r\
Short(s) : \n\r\
In builder mode or with CMDROOMS: runs world/macros/NAME.cmd, a game \
command to each line, as if you typed them: $1 to $9 are the args, $room \
your room's ID and $area its area's name.  A line starting # is a \
comment, and a line STOPONERROR stops at the first line that fails.  A \
line fails when its first word is no command, social or skill you may \
use, or it ends in an error; at the end one line says what ran and what \
failed.  A command that asks for more, such as an editor, reads what you \
type next.

SANDBOX=\
Command  : SANDBOX\n\r\
Usage    : SANDBOX ENTER/LEAVE/CLEAR\n\r\
Usage    : SANDBOX PREVIEW [CATALOG NAME/TEMPLATE]\n\r\
Example  : sandbox preview the town guard\n\r\
Example  : generate area maze_dungeon from randareas/example.xml areasize=30 sandbox\n\r\
Short(s) : \n\r\
In builder mode or with CMDROOMS: the Sandbox is a scratch area of a few \
bare rooms in a row, marked unsavable, so neither the world files nor the \
database ever have it.  ENTER takes you there (making it the first time) \
and LEAVE back where you were; CLEAR takes away its mobs and items and the \
areas GENERATE made for it.  PREVIEW puts a copy of a catalog mob or item, \
or a builder template, in it and shows it, its gear and what it sells, \
until you leave.  GENERATE ... SANDBOX generates there, NOSAVE, and an \
area it makes is unsavable too.

BUILDING=\
Topic    : BUILDING\n\r\
Short(s) : BUILDERMODE\n\r\
Building in CoffeeSUD, with BUILDER=1.  The world lives in its folder \
(WORLDDIR, world/ by default): areas/*.cmare, quests/*.quest, the \
catalog, custom objects, templates, clans and the world's own resources/.  \
The database is a cache of those files; SAVE writes the files from it, \
and so does QUIT.\n\r\
\n\r\
1. A mob or item you CREATE is only in the room until SAVE ROOM, which \
saves each mob into its own start room; this is the first trap.  LIST \
UNSAVED lists the rooms with mobs or items not saved, SAVE CHANGED saves \
them all, QUIT asks, and %U in a prompt counts them.  MODIFY ROOM and the \
room's exits are saved as you make them.\n\r\
2. UNDO puts back what the last building commands changed (UNDO LIST).  \
SAVE keeps a copy of each world file it writes over in world/.backup/ \
(WORLD BACKUPS, WORLD RESTOREFILE).\n\r\
3. A world file edited outside the game while it runs is not written \
over: WORLD STATUS lists such files, WORLD DIFF shows one against the \
game's, WORLD RELOAD loads it (or CHANGED, all of them; DEVWATCH ON does \
it as they change), and SAVE FORCE writes the game's over it.\n\r\
4. To make: CREATE ROOM, WORLD DIG and WORLD PATH for rooms, COPY, \
the catalog and templates for things, GMODIFY and MODIFY UPDATE: (MQL) \
for many at once, IMPORT and GENERATE for whole areas (GENERATE ... \
SANDBOX to try one out first), RUNFILE for a file of commands and JRUN \
with its builder object for scripts.  EDIT SCRIPT and EDIT DESC open the \
line editor.\n\r\
5. To look: WORLD MAP, WORLD CHECK (and sud.sh CHECK=1), SCRIPTCHECK, \
PROPCHECK, QUESTCHECK, ORGCHECK, VALIDATE RECIPES, LIST CONTENTS, LIST \
LINKAGES, WORLD PROBLEMS for files that did not load whole, DEVLOG and \
SCRIPTTRACE for what runs, PAUSE AREA to freeze one.  PLAYTEST plays as a \
player, BUILD runs one builder command meanwhile.\n\r\
6. Not in the world folder: the characters (the database's), the game's \
own resources/ unless a world copy is made (builder mode writes changes \
to the world's copy), and coffeemud.ini; ERRMSGS=BOTH and JSCRIPTS=2 there \
help while building.

BUILDERMODE=BUILDING

PRICECHECK=\
Command  : PRICECHECK\n\r\
Usage    : PRICECHECK [ITEM] (AT [SHOPKEEPER]) (FOR [CHARACTER]) (SELL)\n\r\
Example  : pricecheck cloak\n\r\
Example  : pricecheck sword at smith for Bob sell\n\r\
Short(s) : \n\r\
In builder mode, a DEV=1 game or with CMDMOBS: how a shop's price for \
something was reached.  It lists the settings the shop prices by \
(PREJUDICE, PRICEMASKS, BUDGET, DEVALRATE, INVRESETRATE and IGNOREMASK) \
with where each came from: the shopkeeper, its area, a parent area or the \
ini, and a running quest that gave it.  Then each step of the sum, as the \
shop works it out: the base price, the prejudice rule that matched, each \
price mask that matched, charisma against the keeper's wisdom, sales tax, \
the fall for what is in stock, and the rounding to coins.  Last, both \
prices, the budget left and when the stock is next put back.  Without SELL \
it is what the shop asks; with SELL, what it pays.  The item is looked for \
in the shop's stock, then the character's and your own inventory, then the \
room.  With no AT, the first shopkeeper here that is not a player; with no \
FOR, yourself.

PLAYTEST=\
Command  : PLAYTEST\n\r\
Usage    : PLAYTEST (ON/OFF)\n\r\
Usage    : BUILD [COMMAND]\n\r\
Example  : playtest on\n\r\
Example  : build modify mob sentry\n\r\
Short(s) : \n\r\
In builder mode, meets the world as a mortal would.  While on, every sysop \
power you have is suspended: aggressive mobs attack you, followers follow, \
dopplegangers scale to you and spawns spawn as for a player, and the prompt \
says (playtest).  A death takes you back, whole, to the room you began the \
playtest in.  BUILD runs one command with your powers back (an editor that \
asks for input after the command returns may refuse); it is a command only \
in a playtest, where the Building skill is BUILDING, and is the skill \
otherwise.  PLAYTEST OFF ends it, \
makes you whole and makes peace.  GOD (in a DEV=1 game or builder mode) turns \
single powers and cheats on and off instead.
BUILD=PLAYTEST

SCRIPTCHECK=\
Command  : SCRIPTCHECK\n\r\
Usage    : SCRIPTCHECK [FILE/TARGET/AREA/ALL]\n\r\
Example  : scriptcheck progs/miller.script\n\r\
Example  : scriptcheck baker\n\r\
Example  : scriptcheck area\n\r\
Short(s) : \n\r\
Reads MOBPROG scripts without running them and lists, by file and line, what \
would go wrong: unknown triggers (GREETPROG), commands and functions, an MP \
word that is only the start of commands (MPSE), IF without ENDIF and ELSE or \
ENDIF without IF, SWITCH, CASE and ENDSWITCH, FOR and NEXT, MPWHILE and IF \
parentheses, <SCRIPT> without </SCRIPT>, JavaScript that does not compile \
and, where JSCRIPTS asks for approval, blocks not approved, LOAD= files that \
are missing, MPCALLFUNC to a FUNCTION_PROG the scripts do not have, and room \
IDs in MPGOTO, MPTRANSFER and MPOLOADROOM that do not exist.  It takes a \
script file (as LOAD= names it), a mob or item here or carried, ROOM or \
name@room, AREA (every script in this area) or ALL (the world).  A file that \
several objects load is told of once.  Builder SAVE says how many problems \
SCRIPTCHECK ALL finds.  See also SCRIPTERRORS for errors as scripts run.

SCRIPTTRACE=\
Command  : SCRIPTTRACE\n\r\
Usage    : SCRIPTTRACE [TARGET/ROOM/AREA] ([TRIGGER])\n\r\
Usage    : SCRIPTTRACE OFF\n\r\
Example  : scripttrace chief\n\r\
Example  : scripttrace area GREET_PROG\n\r\
Short(s) : \n\r\
Traces the scripts of a mob or item here (or carried, or name@room), of \
everything in this room (ROOM), or in this area (AREA), to your session only, \
not the log, until SCRIPTTRACE OFF: each trigger's chance as it is rolled and \
whether it ran (GREET_PROG 50: rolled 73 of 50, skipped), a trigger turned off \
(MPNOTRIGGER or SCRIPT DISABLE), a host too busy to be triggered (asleep, \
fighting...), each line run, and each variable changed.  A trigger after the \
target traces that trigger only.  One trace at a time; it is not saved.  A \
script can trace itself with MPSETINTERNAL TRACE TRUE (in builder mode or a \
DEV=1 game), and ask whether the game is in builder mode with ISBUILDER(), as \
a condition or as $%ISBUILDER()%.

SCRIPTERRORS=\
Command  : SCRIPTERRORS\n\r\
Usage    : SCRIPTERRORS ([NUMBER]) ([TEXT])\n\r\
Usage    : SCRIPTERRORS CLEAR\n\r\
Example  : scripterrors\n\r\
Example  : scripterrors 50 elder.script\n\r\
Short(s) : \n\r\
Lists the script errors since the game began (the last 200 are kept), \
MOBPROG and JavaScript, oldest first: the last 20, or as many as the number \
says, or those holding the text.  Each says the file and line it is written \
at (inline:n for a script written on the object itself), the command, what \
went wrong and the host and room, such as "progs/elder.script:212 MPECHOT \
Syntax: unknown command MPECHOT (the elder @ Town#4)".  An MP word that is no \
command, or the start of several (MPSE), is an error, not a game command.  In \
builder mode and a DEV=1 game each error is also told to you as it happens; \
in a normal game the SCRIPTERRORS key in coffeemud.ini decides: LOG (the \
default) only logs them, NOTICE tells the player once that a script went \
wrong, SHOW shows each to the room.  CLEAR forgets them.  See also DEVLOG and \
JS ERRORS.

PREVIEW=\
Command  : PREVIEW\n\r\
Usage    : PREVIEW (ROOM) ([CONDITION]...)\n\r\
Usage    : CHECKTEXT (ROOM/AREA/WORLD)\n\r\
Example  : preview night winter snow\n\r\
Example  : preview from north visited\n\r\
Example  : preview dusk as Bob var BRIDGE=1\n\r\
Example  : checktext area\n\r\
Short(s) : CHECKTEXT\n\r\
PREVIEW shows this room's title and description as they read under the \
conditions given, the rest as they are, and changes nothing: a time of day \
(DAY, NIGHT, DAWN, DUSK), a season (SPRING, SUMMER, FALL, WINTER), a weather \
(RAIN, SNOW, CLEAR, FOG, THUNDERSTORM, BLIZZARD, WINDY, CLOUDY...), FROM a \
direction or FROM UNKNOWN, VISITED or FIRSTVISIT, AS a character (for MASK \
parts and what they are doing) and VAR NAME=VALUE (a script variable of the \
reader, put back after).  Only rooms' texts vary (<VARIES>).  CHECKTEXT lists \
what in rooms' titles and descriptions would print as text instead of \
varying: variation tags in a text that does not start with <VARIES>, tags \
that are none (<nigth>), tags in small letters (their end is found only in \
capitals), tags opened and not closed or closed and not opened, a MASK whose \
mask has a > in it (write &gt;), and a colour code left open at the end. \
<FROMUNKNOWN> is the same as <FROMUNKOWN>, as the code long spelled it.
CHECKTEXT=PREVIEW

TRACEB=\
Command  : TRACEB\n\r\
Usage    : STAT BEHAVIORS ([MOB/ITEM/HERE])\n\r\
Usage    : TRACEB [MOB/ITEM/HERE] ([TICKS])\n\r\
Usage    : TRACEB OFF\n\r\
Example  : stat behaviors miller\n\r\
Example  : traceb miller 40\n\r\
Short(s) : \n\r\
STAT BEHAVIORS shows each behaviour of a mob, an item or this room (HERE) \
with its parameters and what it has built up while running, and, for one that \
acts on a timer, in how many ticks it acts, how often, its chance, and when it \
last acted; keys of its parameters that its help (AHELP BEHAVIOR_...) does not \
name are told as unknown.  TRACEB tells you, for as many ticks (20 by \
default), each decision of the host's timed behaviours: when one's time \
comes, whether it acts, could not act (asleep, bound) or lost its chance \
roll.  TRACEB OFF stops it.

PROPCHECK=\
Command  : PROPCHECK\n\r\
Usage    : PROPCHECK (ROOM/AREA ([NAME])/ALL/CATALOG/[MOB OR ITEM])\n\r\
Example  : propcheck\n\r\
Example  : propcheck area Dunmoor\n\r\
Example  : propcheck chest\n\r\
Short(s) : \n\r\
Reads the text of each effect set on things again (the properties and \
abilities a builder gave them, not what is cast on them) and lists what \
would do nothing or not what was meant, as "Room#12 / iron chest / \
Prop_LimitedContents: unknown key MAXX": what the effect's own class \
complains of as it reads the text, keys that the effect's help (AHELP \
PROP_...) does not name, room IDs that do not exist, abilities in a spell \
list that do not exist, and effects on things they cannot affect.  ROOM (the \
default) covers this room, its exits, the mobs in it and what they carry, \
and its items; AREA this area, or the one named; ALL the world and the \
catalog; CATALOG the catalog's mobs and items; or one mob or item here.  See \
also SCRIPTCHECK for scripts.

SCRIPT=\
Command  : SCRIPT\n\r\
Usage    : SCRIPT LIST [TARGET]\n\r\
Usage    : SCRIPT FIRE [TARGET] [TRIGGER] ([WORDS]) (AS [WHO]) (WITH [ITEM])\n\r\
Usage    : SCRIPT CALL [TARGET] [FUNCTION] ([ARGUMENTS])\n\r\
Usage    : SCRIPT RESET [TARGET] (ONCE/DELAY/TIME/ALL)\n\r\
Usage    : SCRIPT DISABLE/ENABLE [TARGET] ([TRIGGER])\n\r\
Usage    : SCRIPT ALARMS [TARGET] (LIST/CLEAR)\n\r\
Example  : script fire baker TIME_PROG 5 AS Bob\n\r\
Example  : script fire innkeeper SPEECH room AS me\n\r\
Example  : script fire guard GIVE WITH pass\n\r\
Example  : script reset innkeeper ONCE\n\r\
Short(s) : \n\r\
Runs a host's script triggers on demand, to test them without waiting for \
the moment they are for.  The target is a mob or item here (or carried), \
ROOM, AREA, or name@room.  LIST gives its triggers, numbered, with the file \
and line each is written at, [off] for one disabled and [done] for a \
ONCE_PROG that ran.  FIRE runs the triggers of a kind (SPEECH or SPEECH_PROG, \
GREET, GIVE, DEATH, TIME_PROG...) now, as if WHO (you, by default) had caused \
them, whatever their own conditions and odds; given words, only those that \
answer to them run (a SPEECH_PROG with the word, the TIME_PROG of the hour \
given), and the words are the message ($g); WITH gives the item ($o).  CALL \
runs a FUNCTION_PROG and says what it returned.  RESET lets ONCE_PROGs, \
DELAY_PROG waits, or the TIME_PROGs and DAY_PROGs of this hour and day run \
again (ALL, by default, is all three).  DISABLE turns a trigger, or all, off \
until ENABLE, as MPNOTRIGGER does from inside a script.  ALARMS lists what is \
queued to run (MPALARMs and triggers waiting their tick), and CLEAR forgets it.

STAT=\
Command : STAT\n\r\
Usage   : STAT ((SKILL/STAT TYPE) [TARGET NAME])/([NUMBER] [DAYS/WEEKS/MONTHS/YEARS]\n\r\
Usage   : ... (/SKILLUSE/QUEST/AREA/CRIME)) (PLAYERS)\n\r\
Usage   : STAT BEHAVIORS ([MOB/ITEM/HERE]) (see AHELP TRACEB)\n\r\
Example : stat\n\r\
Example : stat 2 weeks\n\r\
Example : stat tom\n\r\
Example : stat equipment bob\n\r\
Example : stat combat bob\n\r\
Example : stat inventory bob\n\r\
Example : stat questwins bob\n\r\
Example : stat tattoos bob\n\r\
Example : stat titles bob\n\r\
Example : stat scripts bob\n\r\
Example : stat charstats bob\n\r\
Example : stat roomsexplored bob\n\r\
Example : stat factions bob\n\r\
Example : stat spell bob\n\r\
Example : stat skill hassan\n\r\
Example : stat chant hassan\n\r\
Example : stat prayer hassan\n\r\
Example : stat area midgaard\n\r\
Example : stat item my longsword\n\r\
Example : stat clan bob\n\r\
Example : stat fountain\n\r\
Short(s): \n\r\
This command serves two purposes.  The first is to allow you to view \
a usage statistics report on your mud.  Entering STAT alone allows you \
to see information gathered since midnight.  You may also enter a number \
and a scale (days, weeks, months, or years) to view information going \
farther back.  Adding the PLAYERS flag at the end shows player stats \
instead of character stats for the min/avg online stat ONLY.\n\r\
\n\r\
STAT will also allow you to retrieve basic stat information on a player, mob, \
item, room, or exit in the game.  Entering STAT and the objects name brings up the \
most basic information.  Specifying AREA, MOB, ITEM, ROOM, or EXIT before the name \
will make the search more specific. Including a skill type before a mob or player name \
will list their abilities of that type.  Valid skill types include: SKILL, \
SPELL, PRAYER, SONG, TRAP, PROPERTY, "THIEF SKILL", LANGUAGE, CHANT, \
"COMMON SKILL", DISEASE, POISON.  You can also get special reports by \
entering one of the following before the name: EQUIPMENT, COMBAT, INVENTORY, STINK, DEITY, \
QUESTWINS, TATTOOS, TITLES, SCRIPTS, WORLDEXPLORED, AREASEXPLORED, ROOMSEXPLORED, ALIGNMENT, INCLINATION, \
FACTIONS, FACTIONID, FACTIONAMT, MATTRIB, OBJATTRIB, CLAN, CLANROLE, LEVELTIMES, POBJECTS, \
BUDGETRESETDATE, INVENTORYRESETDATE, IDLETICKS, PEACETICKS, BIRTHDATE, AGEMINS, AGENAME, \
GENDERNAME, MAXHUNGER, MAXTHIRST, SHOPGOODSLIST, ALIGNMENTDESC, SPEED, and CHARSTATS.  \
As per the player version of this command, you can also use \
basic stats, such as: HITS, MANA, MOVE, HUNGER, THIRST, FATIGUE, MAXHITS, MAXMANA, MAXMOVE, \
MAXHUNGER, MAXTHIRST, MAXFATIGUE, STRENGTH, INTELLIGENCE, DEXTERITY, \
CONSTITUTION, CHARISMA, WISDOM, GENDER, PARALYSIS, FIRE, COLD, WATER, GAS, \
MIND, GENERAL, JUSTICE, ACID, ELECTRICITY, POISON, UNDEAD, MAGIC, DISEASE, \
TRAPS, MAXSTRENGTH, MAXINTELLIGENCE, MAXDEXTERITY, MAXCONSTITUTION, \
MAXCHARISMA, MAXWISDOM, REJUVRATE, AGE, DETECTION, DOUBT, FAITH, WEIGHTADJ, \
LEVEL, SENSES, ARMOR, DAMAGE, ATTACK, DISPOSITION, REJUV, WEIGHT, UNSAVABLE, \
ABILITY, HEIGHT, XP (experience), XPFNL (experience for next level), and \
XPTNL (experience to next level), QUESTPOINTS, TRAINS, PRACTICES, and any \
factions shown in the score command, such as ALIGNMENT.  Many of the basic \
character stats, such as INTELLIGENCE, etc, can also be prefixed like \
CURRENT_INTELLIGENCE to ensure you are getting the fully adjusted value.

SAVE=\
Command : SAVE\n\r\
Usage   : SAVE [ROOM, MOBS, ITEMS, QUESTS, FACTION, USERS]\n\r\
Usage   : SAVE (FORCE)\n\r\
Usage   : SAVE ROOM (HOME/ALL)\n\r\
Usage   : SAVE CHANGED\n\r\
Example : save room\n\r\
Example : save users\n\r\
Example : save quests\n\r\
Example : save faction area_my_area\n\r\
Short(s): \n\r\
A command to permanently save the contents of a room, the mobs \
in the room, the current quests list, a specific faction, or the users who are logged in.  \
The command will apply to the room in which your Character is located.  \
In builder mode, SAVE alone writes the world files; a file that loaded only in \
part (see WORLD PROBLEMS) is not written until it is fixed, and SAVE FORCE \
writes it anyway, as the world has it.  In builder mode, SAVE ROOM is SAVE \
ROOM HOME: each mob is saved into its own start room, wherever it stands, so \
one that wandered in from elsewhere is left out (and named) and this room's \
own that wandered off are kept.  SAVE ROOM ALL saves every mob standing here.  \
A world file changed outside the game is not written over or deleted (see \
WORLD STATUS), and SAVE FORCE writes over it.  SAVE CHANGED saves the mobs \
and items of each room a building command changed (LIST UNSAVED lists \
them), then the world files; plain SAVE names them, as the world files do \
not have them, QUIT asks whether to save them first, and GMODIFY CHANGE=, \
which resets each room first, asks before it drops them.  \
BUILDERAUTOSAVE=1 in coffeemud.ini saves them after each command, and %U \
in a prompt is their number.

PAUSE=\
Command : PAUSE\n\r\
Usage   : PAUSE [ROOM/AREA/OBJECTNAME]\n\r\
Example : pause\n\r\
Example : pause area\n\r\
Example : pause orc\n\r\
Short(s): \n\r\
This very powerful and dangerous command allows you to suspend all thread and \
ticking services in the entire mud.  It can be a quick and easy way to discern \
locked up threads, or to free up CPU time for other purposes.  Enter PAUSE alone \
to suspend and resume all objects, or specify room, area, or an object name \
to suspend the ticking of just that object.

SYSMSGS=\
Command : SYSMSGS\n\r\
Usage   : SYSMSGS\n\r\
Example : sysmsgs\n\r\
Short(s): \n\r\
A command to toggle debug mode, or extended messages.  A mobile NPC will not \
be able to enter or leave a room if a player in this mode is present.

AFTER=\
Command : AFTER\n\r\
Usage   : AFTER (EVERY/STOP/LIST) [NUMBER] [SECONDS/TICKS/MINUTES/HOURS] [COMMAND]\n\r\
Example : after 5 seconds smile\n\r\
Example : after every 5 seconds at bob smile\n\r\
Example : after 10 minutes shutdown noprompt\n\r\
Example : after stop\n\r\
Example : after list\n\r\
Short(s): \n\r\
A command to delay the execution of a command.  The every parameter \
may be used to make a command automatically recurring.  after stop should be \
used to cancel commands created with the every parameter.

TAKE=\
Command : TAKE\n\r\
Usage   : TAKE (ALL) [ITEM NAME] ([MOB NAME])\n\r\
Example : take all dagger Horice\n\r\
Example : take qp Horice\n\r\
Example : take all Horice\n\r\
Example : take pie Horice\n\r\
Short(s): \n\r\
This is A command that forces the specified mob or character \
to give item that is in his or her inventory or equipment to \
you.  If the item is inside a specified container, it will \
be retrieved from the container.  The very special item name "qp" \
may be used to take Quest Points from players using this command. 

SHUTDOWN=\
Command : SHUTDOWN\n\r\
Usage   : SHUTDOWN (IN [NUMBER] [MINS/HOURS..]) (NOPROMPT) \n\r\
Example : shutdown\n\r\
Example : shutdown noprompt\n\r\
Example : shutdown in 10 minutes\n\r\
Example : shutdown at 11:00 pm\n\r\
Short(s): \n\r\
With no argument, this command will bring down the CoffeeMud server. \
You can also specify how long before the shutdown will begin.  This \
will also cause periodic warnings to your players.

UNLINK=\
Command : UNLINK\n\r\
Usage   : UNLINK [DIRECTION]\n\r\
Example : unlink north\n\r\
Short(s): \n\r\
A command for the unlinking of rooms from each other.

CURRENCY_FILE=\
CoffeeSUD: a world's currencies, in world/resources/currencies.ini (the stock resources/currencies.ini \
is read when the world has none).  Each line CODE=[DEFINITION] makes a currency, as an area's \
CURRENCY would: denominations with semicolons between, each its value in the lowest coin, its name \
with (s) for the plural, and its short form in brackets, as CROWN=1 copper penny(s) (cp);12 silver \
shilling(s) (ss);240 gold crown(s) (gc); notrade first makes coins no shop takes.  Areas then name \
it by its code alone (MODIFY AREA, CURRENCY CROWN), and an area that defines the code again, \
differently, keeps the file's (the log says so).  DEFAULT=CROWN is the currency of every area \
with none of its own, in place of the gold coins and Archon notes; GOLD, COPPER, CREDIT, DOLLAR \
and VICTORY are built in.  coffeemud.ini or world.ini may set CURRENCY_[CODE]=[DEFINITION] and \
DEFAULTCURRENCY=[CODE] as well.\n\r\
\n\r\
A denomination may end in braces, in any currency definition (an area's too): 12 silver \
shilling(s) (ss) {MATERIAL=SILVER WEIGHT=0.01 DESC="A thin disc stamped with the crowned stag."}. \
MATERIAL is what its coins are made of (else the first material word of the name; note, bill and \
dollar are paper), WEIGHT what one coin weighs (else a hundred to the pound), DESC their look, \
shown before the "Equal to" line.

CALENDAR=\
CoffeeSUD: MODIFY AREA CALENDAR [KEY=VALUE ...] gives an area, and its child areas, a calendar of its own, \
kept in the area's data (so in its .cmare), in place of the global clock's: HOURS= (hours in a day), DAYS= \
(days in a month), MONTHS="Leafwake,Bloomtide" (the months' names), WEEK="..." (the weekdays'), \
YEARS="year #" (the years'), DAWNHR=, DAYHR=, DUSKHR=, NIGHTHR= (the hours each begins), and \
START=YEAR/MONTH/DAY/HOUR, where a new game starts its clock (months and days count from 1; the hour left \
out is dawn).  What it leaves \
out comes from the parent area's clock, else the global one.  A saved game goes on from its own date. \
MODIFY AREA CALENDAR alone shows it, NONE takes it away; the area editor's calendar screen writes it too. \
STARTDATE=YEAR/MONTH/DAY/HOUR in coffeemud.ini (or world.ini) is the global clock's START. \
Seasons, day length and moons: SEASONS="the Burn:SUMMER:1-2,the Rains:SPRING:Flood-Silt" names each season, \
the built-in season it counts as for the weather, VARIES and the like, and its months (numbers from 1, or the \
months' names); SEASONOFFSET=[MONTHS] is the area's own, its seasons that many months on, on its parent's \
clock (a southern land); DAYLIGHT="WINTER:2-4,the Burn:0-5" gives a season's dawn and night hours (or all \
four, DAWN-DAY-DUSK-NIGHT); MOONS="Selune:24,Ember:9:3" names each moon, its cycle in days and its offset \
in days, the first being the moon the tides and ISMOON(FULL) follow.  ISSEASON(the Burn), ISMOON(Ember full), \
-SEASON "+the Burn", <the Burn>...</the Burn> in VARIES text and TIME know them.\n\r\
Example    : MODIFY AREA CALENDAR HOURS=10 DAYS=30 MONTHS="Leafwake,Bloomtide,Highsun,Frostfall" DAWNHR=0 DAYHR=1 DUSKHR=8 NIGHTHR=9 START=812/2/3

WEATHERPROFILE=\
CoffeeSUD: MODIFY AREA WEATHERPROFILE [NAME] (NONE takes it away) gives an area, and its child areas, \
the climate of world/climates/[NAME].ini (or resources/climates/[NAME].ini) in place of the built-in \
one.  Its lines: SPRING=, SUMMER=, FALL= and WINTER= (or ALL= for every season not given) weigh each \
weather, as CLEAR 40, CLOUDY 30, RAIN 20, FOG 10 (the area's wet, cold, hot, dry and windy bits still \
add theirs); TRANSITION=RAIN->FOG=30, CLEAR->RAIN=10 sets the chance of a change from one weather to \
another in place of the built-in one (a minus number all but forbids it); HOLD=[HOURS] is the fewest \
game hours a weather lasts before it changes on its own; ALLOW=FOG,CLEAR is the only weathers it has; \
TEXT_[WEATHER]= the weather's description and STOP_[WEATHER]= its ending line, alternatives between |, \
NONE for nothing, in place of lists.ini's.  WEATHER FORECAST names an area's climate and shows its \
odds; a file that is missing, or a line it cannot read, is logged.

GENTOME=\
CoffeeSUD: a GenTome (CREATE ITEM GenTome) is a book whose pages are kept in it, so that they \
go into the world files and every new game.  Its readable text holds the pages, \
<PAGE TITLE="The Fall of Ost" LANG=Elvish LORE=ost.fall>text</PAGE> one after another, or \
FILE=world/texts/ost.txt, a file in which a line "=== The Fall of Ost ===" (or "=== The Fall \
of Ost | LANG=Elvish LORE=ost.fall ===") begins each page.  READ BOOK lists the pages; READ 3 \
BOOK, READ NEXT BOOK, READ PREV BOOK and READ [TITLE] BOOK read one.  A page in a language \
(LANG) is read only by one who knows it; <VARIES> works in a page; LORE gives the reader the \
tattoo LORE:[KEY].  READ_PROG PAGE 7 (or PAGE [TITLE]) fires for that page.  TEAR PAGE 3 FROM \
BOOK gives a page of its own (tagged PAGE:3; the book is tagged TORN:3).\n\r\
\n\r\
Books and boards that keep their pages in the game's journals (GenBook, GenJournal) are filled, \
when empty, from world/journals/[NAME].txt the first time they are read: [NAME] is their name, \
lower case, spaces as _; "=== subject ===" begins each entry, and an AUTHOR: line before the \
first names the writer.

GENTRAP=\
CoffeeSUD: a GenTrap (CREATE ABILITY GenTrap, MODIFY ABILITY [ID]) has, besides its \
messages, damage, ability and script:\n\r\
TRIGGERS: what springs it, instead of its class's (entering a room, opening or unlocking an \
exit or container, getting an item): message types, commas between, such as SIT, READ, LOOK, \
EXAMINE, OPEN, CLOSE, WEAR, HOLD, PUT, DROP, GET; on a room ENTER, LEAVE:[DIRECTION] and \
the others, by anyone there.\n\r\
DISARM: verb:[PHRASE], typed there, disarms it (until it resets), besides the usual skills.\n\r\
ONCE: it springs once and is gone.\n\r\
Its script (the Scriptable Parm) runs when it springs, with or without an ability: ACT_PROG \
[TRAP ID], $t the one who sprang it.

GMODIFY=\
Command : GMODIFY\n\r\
Usage   : GMODIFY (AREA/ROOM/WORLD/PLAYERS/#TAG) [FIELD=VAL](&&/||[...])\n\r\
Usage   :         (CHANGE=[FIELD=VAL])\n\r\
Example : gmodify area class=genmob&&name=the cityguard change=name=the guard\n\r\
Example : gmodify world class=[cs]GenMob&&name=[ss]city change=name=[ss]\n\r\
Example : gmodify world class=[cs]GenItem&&name=a rusty sword change=destroy=true\n\r\
Example : gmodify players charclass=Fighter\n\r\
Example : gmodify #mytag change=ability=12\n\r\
Example : gmodify ?\n\r\
Short(s): \n\r\
A command to select objects in a an area, some rooms, or the whole world \
based on the specified field values, and optionally change some of \
those specified fields.\n\r\
\n\r\
Searching the entire WORLD is implied, but the first parameter may be \
the word AREA or ROOM to narrow the search.  You may also enter a hash \
mark and the name of a TAG to only search tagged objects.\n\r\
\n\r\
The next parameter is the search criteria.  \
The key phrase WHEN= may optionally precede it to \
make explicit that you are specifying the search criteria.  The search \
criteria fields may be separated by && strings to specify that all of the \
preceding criteria AND the next single criteria must be true.  The criteria \
fields may also be separated by || strings to specify that all of the preceding \
criteria OR the next single criteria may be true.  One of those strings must \
be present when specifying more than one criteria.\n\r\
\n\r\
Each field in the search criteria must be of the form FIELD=VALUE, FIELD!=VALUE, \
FIELD$VALUE, FIELD>VALUE, FIELD<VALUE, FIELD>=VALUE, or FIELD<=VALUE.  Where \
FIELD must be a valid search field.  Enter GMODIFY ? for a complete list of all \
valid fields.  Not all fields will apply to all object types, so take this into \
account especially when using < or != operators.  The operators are all normal \
except for the new one, $, which means that the value is really a regular expression. \
The VALUE portion of the criteria may be prefixed with modifiers, which include: \n\r\
[ss] to specify that the value refers to a substring of the fields whole value.\n\r\
[cs] to specify that the search is case sensitive (case insensitive is implied).\n\r\
\n\r\
The last parameter is the optional change specifications.  These specifications \
must be prefixed with the key phrase CHANGE=.  If these specifications are not \
included, GMODIFY will display the results of the search.  The change specifications \
are similar to the search criteria in that they consist of groupings of FIELD=VALUE \
separated by && strings.  Unlike search criteria, however, operators other than =, and \
strings other than || have no special meaning.  The fields, like in the search \
criteria, must be valid fields for the options selected by the search criteria.  A \
special field name "DESTROY", when set to true, will \
obliterate the item in question.  Otherwise, the ordinary \
fields on the object will be changed to the specified value UNLESS the following \
conditions are met: the VALUE portion of a field is prefixed with the modifier [ss], \
and the VALUE portion of an identical field in the search criteria was also prefixed with \
the modifier [ss].  Under those special conditions, instead of substituting the entire \
field value on the object with the new value, ONLY the portion of the string selected \
in the search criteria will be substituted.\n\r\
\n\r\
* Be very careful with this command! It is wise to try the command WITHOUT change= ... \
first, to make sure you are matching Exactly what you expect, before doing a change pass.\n\r\
\n\r\
Exits are matched and changed too, with their own fields (CLOSEDTEXT, KEYNAME, \
DOORNAME and the like), each room's saved with it; an area's own fields \
(AUTHOR, CURRENCY, PLAYERLEVEL and the like) are known as well: \
gmodify area name$wooden change=name=stone

NOWIZINV=\
Command  : WIZARD INVISIBILITY\n\r\
Usage    : VISIBLE\n\r\
Example  : visible\n\r\
Short(s) : nowizinv\n\r\
Wizard Invisibility makes the invoker \
completely undetectable by other mobs or players.  This command \
turns wizard invisibility off.  See WIZINV for more information.

CHARGEN=\
Skill    : CHARGEN\n\r\
Usage    : CHARGEN (COMBAT/NEW/PLAYER/EQUIP) (CHARCLASS/ALL) (LEVEL)\n\r\
Example  : chargen combat figher 10\n\r\
Example  : chargen equip bob\n\r\
Example  : chargen weapon ([ARG]=[VALUE] ...)\n\r\
Short(s) : \n\r\
A little utility designed to give example characters and weapons \
of various levels, for comparison with MOBs of similar \
level.  It's basically a class balancing tool.

GOD=\
Command  : GOD\n\r\
Usage    : GOD\n\r\
Usage    : GOD [CHEAT/POWER/ALL] ([CHEAT/POWER]...) (ON/OFF)\n\r\
Usage    : GOD RESET\n\r\
Example  : god noclip noaggro on\n\r\
Example  : god nodamage\n\r\
Example  : god immort off\n\r\
Example  : god all off\n\r\
Short(s) : \n\r\
A developer's cheats, in a DEV=1 game or in builder mode.  GOD alone lists \
them, and whether each is on.  The cheats are NOCLIP (walk through closed and \
locked doors and past the Prop_Req* entry checks, and walking costs no \
movement), NOCOST (skills cost no mana, movement or hit points, and need no \
wait), NODAMAGE (take no damage), NODEATH (hit points stop at 1), SEEALL (see \
in the dark, the hidden, the invisible and those who sneak, and never be \
blind) and NOAGGRO (aggressive creatures leave you be).  A cheat's name with \
ON or OFF turns it on or off; with neither, it turns over.  Some sysop powers \
give a part of a cheat already (GOTO walks through doors, ALLSKILLS skips the \
wait, IMMORT keeps you alive, ORDER or CMDROOMS keep the aggressive away); \
turning the cheat OFF takes that away too.  A sysop power's name (IMMORT, \
GOTO, ALLSKILLS...) with OFF suspends that power for you, and with ON gives \
it back.  ALL is every cheat: ALL OFF plays as a mortal would.  RESET forgets \
them all.  The cheats are kept with the character (Prop_DevCheats).

GOTO=\
Skill    : GOTO\n\r\
Usage    : GOTO [ROOM ID/DESC/MOB/AREA]/PREVIOUS (!)\n\r\
Example  : goto Midgaard#3001\n\r\
Example  : goto #3001\n\r\
Example  : goto north\n\r\
Example  : goto hassan\n\r\
Example  : goto temple of mota\n\r\
Example  : goto midgaard\n\r\
Example  : goto previous\n\r\
Short(s) : \n\r\
The invoker and his or her followers will be transported, \
with very little fanfare, to the destination listed.  This \
ability is not magical in nature, and is thus not affected \
by no-teleport areas and rooms.  Appending an exclaimation \
point to the room will ADD fanfare to the entrance.

TRANSFER=\
Skill    : TRANSFER\n\r\
Usage    : TRANSFER [ALL/[MOB NAME]/"ITEMS X"] [ROOM/DESC/MOB/AREA/SRVR]\n\r\
Usage    : TRANSFER [SPACE OBJECT] SPACE:[COORDS]/[OBJ] ([DIST])\n\r\
Example  : transfer all Midgaard#3001\n\r\
Example  : transfer all midgaard\n\r\
Example  : transfer all north\n\r\
Example  : transfer bob #3001\n\r\
Example  : transfer smurf hassan\n\r\
Example  : transfer bobbyjoe temple of mota\n\r\
Example  : transfer "item sword" north\n\r\
Example  : transfer "all item sword" north\n\r\
Example  : transfer "all items" north\n\r\
Example  : transfer "item sword" midgaard#3001@user$password$server:port\n\r\
Example  : transfer "space ship galileo" space:100,-1000,10000\n\r\
Example  : transfer "space ship galileo" space:planet bob 10000km\n\r\
Short(s) : \n\r\
The targets and their followers will be transported, \
with very little fanfare, to the destination listed.  This \
ability is not magical in nature, and is thus not affected \
by no-teleport areas and rooms.  If all or item is used, it will refer \
only to those in the same room as the admin.  Otherwise, the \
admins present area will be checked for all instances of the name \
and transfers all of them.  If none are found in the same area, the \
whole world will be checked.  If the word items is used, then an item \
can also be transported to a room destination, though the word INVENTORY \
is also a valid destination to move the item into your inventory.

OUTFIT=\
Command : OUTFIT\n\r\
Usage   : OUTFIT (([LEVEL]) [NAME])\n\r\
Example : outfit\n\r\
Example : outfit 15 bob\n\r\
Example : outfit bob\n\r\
Short(s): \n\r\
Should your character or the targeted character ever be without clothing or weapon (usually \
due to death), this command will give your character some newbie \
equipment to get by with, or level appropriate equipment when a player or mob is targeted \
by name by the builder.  The mundane player version of this only gives level 1 equipment \
to the player using the command.

WIZEMOTE=\
Command : WIZEMOTE\n\r\
Usage   : WIZEMOTE [ALL/HERE/ROOM NAME/AREA NAME/CLAN NAME/PLAYER NAME] message\n\r\
Example : wizemote all You are having fun!\n\r\
Example : wizemote here We are having fun!\n\r\
Example : wizemote bob You are having more fun though.\n\r\
Example : wizemote "Death Area" Something bad happened here!\n\r\
Example : wizemote "Death Area#5320" Something bad happened there!\n\r\
Example : wizemote "The Artisans" Something bad happened to your clan!\n\r\
Short(s): \n\r\
A command to send emote-type messages to everyone in an \
area, a room, a clan, or to a specific player, or to everyone everywhere.

POSSESS=\
Command  : POSSESS\n\r\
Usage    : POSSESS [MOB NAME]\n\r\
Example  : possess dragon\n\r\
Example  : possess dragon@MyArea#23\n\r\
Example  : possess dragon@MyArea\n\r\
Short(s) : \n\r\
This command will allow your character to possess and control \
any given mob.  That mob will be controlled \
as if it were your own character.  Use the QUIT command to return \
to your own characters body.  Should the mob die, you will be \
returned automatically.  POSSESS does not transfer your security \
levels to the possessed mob UNLESS you have turned on your SYSMSGS \
flag before possessing.
	
RESTRING=\
Command : RESTRING\n\r\
Usage   : RESTRING [ITEM NAME]\n\r\
Example : restring longsword\n\r\
Example : restring "longsword@an orc"\n\r\
Short(s): \n\r\
This command is a weak for of MODIFY.  It allows you to modify an items \
name, display text, and description.

TEMPLATE=\
Command : TEMPLATE\n\r\
Usage   : TEMPLATE LIST (MOBS/ITEMS/EXITS/ROOMS) (MASK)\n\r\
Usage   : TEMPLATE TEMPLATE ADD [NEW ID] [mob/item name/exit direction/here or room id]\n\r\
Usage   : TEMPLATE DELETE [ID]\n\r\
Usage   : TEMPLATE TOGGLE [ID]\n\r\
Example : template list mobs myswords\n\r\
Example : template list\n\r\
Example : template add myroomid here\n\r\
Example : template add myswordid the greatest longsword ever\n\r\
Example : template delete myswordid\n\r\
Short(s): \n\r\
The template command allows builders to maintain a personal favorites \
collection of items, rooms, mobs, or exit objects for quick \
duplication using the create command.  Each object \
must have a unique id, which is typically a short friendly word.  Objects \
in your templates can also be shared with other builders, and you will be \
able to access objects shared by others.  Sharing status is toggled using \
the template toggle syntax.

TRAILTO=\
Command : TRAILTO\n\r\
Usage   : TRAILTO (CONFIRM) (AREANAMES) (IGNOREROOMS=[ROOMS LIST]) [AREA NAME] /[ROOM ID] /EVERYROOM /EVERYAREA\n\r\
Example : trailto MyArea#394\n\r\
Example : trailto everyarea\n\r\
Example : trailto confirm areanames "ignorerooms=myarea#10,myarea#20" everyarea\n\r\
Short(s): \n\r\
This command shows the directions one must travel to get from their current \
position to the destination given. You can end the areas with 'areanames', 'ignorerooms=', \
and 'confirm!' flags.  You can also include one of these flags: NOHOMES, OPENONLY, \
UNLOCKEDONLY, AREAONLY, NOHIDDENAREAS, NOEMPTYGRIDS, NOAIR, NOWATER, WATERSURFACEONLY, \
UNDERWATERONLY, FLOORSONLY, CEILINGSSONLY, NOCLIMB, NOCRAWL, OUTDOORONLY, FALLBACK, \
RADIUS=X, or MINSIZE=X. MINSIZE will change the minimum area size for use with EVERYAREA, \
FALLBACK will remove flags in reverse order until a trail is found. RADIUS changes the \
width of the space to look for trails in.  See also help on LIST_TRACKINGFLAGS.

SHELL=\
Command : SHELL\n\r\
Usage   : SHELL [COMMAND] [PARAMETERS]\n\r\
Example : shell\n\r\
Example : shell ?\n\r\
Example : shell directory\n\r\
Example : shell cd /resources/text\n\r\
Example : shell copy thisfile.txt ::\n\r\
Example : shell del ::thisfile.txt\n\r\
Example : shell edit thisfile.txt\n\r\
Short(s): .\n\r\
This command allows the archon, and users with appropriate FS: and/or VFS: security \
flags to access the file system and/or the virtual file system.  See help on CMFS \
or VFS for the difference between the two.\n\r\
\n\r\
The commands are case-insensitive, except where dealing with the local file system, where \
it may be case-sensitive depending upon the host system.  As mentioned in the CMFS docs, \
filenames and paths may be preceded by a :: string to denote forced VFS access, or // \
to denote forced local file-system access.  When neither is specified for a given \
shell command, the VFS file is always preferred. The / character is always used to separate \
directory paths and folders, such as /resources/text/down.txt would refer to the file \
down.txt in the text folder, which in turn is in the resources folder, which in turn is \
located in the root directory.\n\r\
\n\r\
The shell command may be entered with no parameter to see the players current directory. \
When viewing directories, a "-" character will precede a file which exists only in the \
VFS system.  A "+" character will precede a file which exists in both the local file \
system and the VFS system.  Since folders always exist in the VFS, they will always \
be seen with the "+" character preceding them.\n\r\
\n\r\
The shell command can be used to create directories, delete files or directories, \
copy files, search for files with given names, search inside text files for a \
text string, display a text file, or edit a text file.  Many commands support a \
mask to limit the files displayed. The mask may include "*" characters anywhere \
in the string to match 0 or more unknown characters in the filenames.  A "?" \
character always matches a single unknown character in a filename. \n\r\
\n\r\
See HELP CMFS for more information on CoffeeMuds file system.

WHO=\
Command : WHO\n\r\
Usage   : WHO ([OPTIONAL PARAMETER])\n\r\
Example : who\n\r\
Example : who @CoffeeMud\n\r\
Example : who friends\n\r\
Example : who account\n\r\
Example : who playerkill\n\r\
Short(s): \n\r\
This command will list all of the characters presently online, \
regardless of where they are.  If \
an @ sign is used, this command will list all the players at a \
particular MUD.  If "friends" is given, then the list will \
consist only of those from the players friends list (see the \
FRIENDS command). If "Playerkill" is given, then the list will \
consist only of those players who have their playerkill flags on. \
If account is given, then a list of players with the account they \
belong to is shown.
	
WHERE=\
Command : WHERE\n\r\
Usage   : WHERE (AREA) (ROOM/MOB/ITEM/MOBMASK/ITEMMASK) ([MASK])\n\r\
Usage   : WHERE (AREA) SELECT: [REST OF MQL STATEMENT]\n\r\
Example : where\n\r\
Example : where dog\n\r\
Example : where area item knife\n\r\
Example : where area mobmask -race +orc -levels +>=10\n\r\
Example : where area select: * from area\\\\mobs where 'farmer' in name\n\r\
Example : where !\n\r\
Short(s): \n\r\
Without an argument, this command displays the names and locations of \
all players online.  With the ROOM, MOB, ITEM, or no argument, it will show \
all mobs, rooms, and/or items the match the given key words in the mask, \
along with room locations.  With the MOBMASK, ITEMMASK arguments, it will \
show all mobs or items that match the given Zapper Mask (See ZAPPERMASKS). \
With the SELECT: prefix, it will show the results of an MQL query (see \
AHELP MQL); be sure to escape your backslashes! The arguments may also be \
qualified with AREA to show only the \
Archons current area. The argument ! will show the mundane/player \
version of the WHERE command.
	
WIZINVISIBLE=WIZINV
WIZINV=\
Skill    : WIZARD INVISIBILITY\n\r\
Usage    : WIZINV (OFF/NOCLOAK)\n\r\
Example  : wizinv\n\r\
Example  : wizinv nocloak\n\r\
Short(s) : \n\r\
Wizard Invisibility makes the invoker \
completely undetectable by other mobs or players.  In addition, \
the invoker will not hunger or thirst, may pass through any \
terrain unhindered (except doors), and is invulnerable to sleep \
spells.  Lastly, unless the nocloak parameter is specified, the \
Archon is completely cloaked as per the CLOAK command.

XML=\
Command  : \n\r\
Usage    : By MUDGrinder only\n\r\
Example  : \n\r\
Short(s) : \n\r\
This command exist to facilitate the transfer of information \
between MUDGrinder and CoffeeMud.  Do not use this command for \
any reason.

UNLOAD=\
Command  : UNLOAD\n\r\
Usage    : UNLOAD CLASS/HELP/USER/AREA/FACTION/ALL/FILE\n\r\
Usage    : UNLOAD RESOURCE/INIFILE/ACHIEVEMENTS/[FILENAME]\n\r\
Usage    : UNLOAD VFS/INI/SETTINGS/AWARDS/[RESOURCE NAME]\n\r\
Example  : unload help\n\r\
Example  : unload all\n\r\
Example  : unload armorsmith\n\r\
Example  : unload class Thief_Search\n\r\
Example  : unload user joe\n\r\
Short(s) : \n\r\
Unloads most resource text, cached users, class objects, \
areas, coffeemud.ini, lists.ini, library caches, and \
help files for easy refreshing. 

DUMPFILE=\
Command  : DUMPFILE\n\r\
Usage    : DUMPFILE (RAW) [USER/ALL] [FILENAME]\n\r\
Example  : dumpfile all classes.txt\n\r\
Short(s) : \n\r\
Unloads most resource text and help files for easy refreshing.

JRUN=\
Command  : JRUN\n\r\
Usage    : JRUN [FILENAME] [PARM1] ... \n\r\
Example  : jrun resources/myscript.js parm1 parm2\n\r\
Short(s) : \n\r\
Runs the given file as Javascript.  See the Programming Guide for more information \
on how to write Javascript for CoffeeMud.  A script run this way may take up to \
JSTIMELIMIT_JRUN seconds (30 unless the ini says otherwise); other scripts up to \
JSTIMELIMIT seconds (2).  See JS ERRORS.  A JRUN script has a builder \
object too: builder.here(), room(id), dig(dir, type) (a room made as \
WORLD DIG makes one), link(fromId, dir, toId), create('mob' or 'item', \
catalog name or class, roomId), saveRoom(id), forEachRoom(area, function) \
and cmd('a command'), each as you.

JS=\
Command  : JS ERRORS\n\r\
Usage    : JS ERRORS ([NUMBER]), JS STATE ([KEY] (= {VALUE}/DELETE)), JS RELOAD ([FILE]/ALL), JS WATCH ON/OFF, JS HELP [EXPR]\n\r\
Example  : js errors 20\n\r\
Short(s) : \n\r\
Lists the most recent JavaScript errors since the game started (10, or the \
number given): when, where the script is (its host, room and trigger, or the \
JRUN file, quest or cron job), the line, and what went wrong.  A script that \
runs past its time limit (JSTIMELIMIT in the ini) is stopped, and listed here \
too.  In builder mode each error is also shown as it happens.\n\r\
Every JavaScript (a script's <SCRIPT>, JRUN, JCONSOLE, a quest's, cron's, world/js/init.js, a JS class) \
may require('name') a library: world/js/lib/name.js, or else resources/js/lib/name.js, gives what it puts \
in exports.  Each is compiled once, and read again when its file changes.\n\r\
A world keeps its JavaScript classes in world/js/[kind]/ (behaviors, abilities, properties, items, mobs, races, \
charclasses, commands, common, locales, exits, areas), loaded as the game starts; resources/js/templates/ has \
commented templates for a behaviour and a property.  A room's or area's behaviour may extend \
com.planet_ink.coffee_mud.Behaviors.JSWorldBehavior and define onEnter, onLeave, onWeather and onDaypart.  A \
script's LOAD=world:scripts/name.script reads a file of world/scripts/.  WORLD CHECK's JS part lists the \
classes that do not compile or extend nothing.\n\r\
Every JavaScript scope also has cm, the game's objects (cm.here(), cm.room(id), cm.findMob(name), \
cm.loadMob(catalogName, room), cm.say(mob, text), cm.mp('MPECHO hi'), cm.var(host, name), cm.clock(), cm.weather(), \
cm.law(), cm.shop(mob), cm.bank(mob), cm.lib for CMLib...); cm.on(event, fn) for the clock, the weather and the \
game's course (a save listener that returns false refuses the save); sud (sud.time, sud.party, sud.save, \
sud.find, sud.vars); include('path') or include('world:path'); debug(x); and importPackage.  JCONSOLE has \
here, area and target.  guides/JavaScriptSUD.html lists it all.\n\r\
cm.store(key) is a plain JavaScript object kept with the game: key is 'world', 'quest:name', any \
string, or a room, mob, item or area.  A save writes it as JSON, a restore puts it back, and a new game starts \
from world/js/state.json if the world has one.  JS STATE lists the stores, JS STATE key shows one, JS STATE \
key = {gold: 5} replaces it and JS STATE key DELETE takes it away (in builder mode).\n\r\
cm.on also hears the world, wherever it happens: death(victim, killer), beforeDeath (false keeps \
the victim alive), levelUp(mob, level), questWin(mob, quest), questEnd(quest, mob, why), enterRoom(mob, room, \
from), beforeEnterRoom (false keeps the mover out), enterArea(mob, area, from), itemGained(mob, item), \
itemLost(mob, item), factionChange(mob, faction, change) and turn(leader, count); cm.off(event, fn) takes one \
away.  Register them in world/js/init.js's onBoot.\n\r\
The property Prop_JScript and the behaviour JSBehavior run a JavaScript file: SCRIPT=world:js/props/x.js \
and parameters, which the file has as parms (see AHELP PROP_JSCRIPT and AHELP BEHAVIOR_JSBEHAVIOR).\n\r\
JS RELOAD puts the world/js files changed since the game started (or since their last reload) \
into the running world; JS RELOAD file reloads one, JS RELOAD ALL every one.  A file that does not compile \
is shown with its line, and left as it was.  init.js is read again and its onReload(old) called; a library \
is read again where it is required from then on; a class is compiled again, and its behaviours and effects in the world \
replaced; a Prop_JScript or JSBehavior file is read again by each one running it, which calls its \
onReload(old) with the old scope.  JS WATCH ON ([SECONDS]) does it by itself as files change; JS WATCH OFF \
stops it.  Builder mode only.\n\r\
The behaviour JScriptable scripts a mob, item, room, exit or area wholly in JavaScript, with \
handlers as onSpeech(who, text) and onGive(who, item) (see AHELP BEHAVIOR_JSCRIPTABLE).\n\r\
Math.random() in every JavaScript scope is the game's own dice, so a game started with RANDOMSEED= \
rolls the same, and a save keeps where the dice were.  cm.now() and cm.ticks() are the game's time, which \
stands still while it is paused; cm.realNow() is the real time.  Date is the real date and time.\n\r\
A zapper mask may have -JS "expr" (only what the JavaScript expression is true for) and +JS \
"expr" (what it is true for, whatever else the mask says): the expression sees mob, item, room, target \
and cm, cm.store included; an error counts as false.\n\r\
JS HELP [expression] shows the methods of what an expression gives, and its stats: JS HELP \
cm.room('Town#1'), JS HELP cm, JS HELP cm.store('world').  guides/JavaScriptSUD.html says where JavaScript \
runs, what each place has, and how to do common things.\n\r\
A quest may have JavaScript handlers, in SET JSFILE world:js/quests/x.js or a <JSQUEST> ... </JSQUEST> \
block: onStart(state), onStep(n, state), onTimeUp(state), onWin(player), onAccept(player) and onStop(), with state \
cm.store('quest:name') and a quests helper; the JScriptables of its mobs and items may have onQuestAccept, \
onQuestStep, onQuestWin, onQuestFail and onQuestEnd.\n\r\
Timers on the game's clock, which wait while it is paused and step with its turns: cm.every(10, fn), \
cm.every('6 hours', fn), cm.at('day 7 hour 8', fn) and cm.after(ticks, fn, data); an after() is kept in the save. \
cm.stopTimer(key) takes one away, cm.timers() lists them.\n\r\
cm.command('dig', {help: 'DIG [DIRECTION]', cost: 1, combatCost: 2, words: ['excavate']}, function(mob, \
args) {...}) makes a command of the world's (DIG ? shows its help); cm.verb(thing, 'pull lever', function(mob, \
rest) {...}) makes a phrase that works near that room, item or mob only.  Register them in init.js's onBoot.\n\r\
world/scripts/progression.js: onCreated(mob), onCreationStep(mob, step, answer), xpGain(mob, source, \
amount) (returns the experience), onLevel(mob, level), practicesForLevel(mob) and trainsForLevel(mob) (return \
the numbers), onLearn(mob, abilityId), onTrain(mob, what, amount), and statRoll(mob, bonus) when STARTSTAT=SCRIPT.

CHATTEST=\
Command  : CHATTEST\n\r\
Usage    : CHATTEST [NPC] [WHAT YOU WOULD SAY]\n\r\
Usage    : CHATLINT [CHAT FILE]\n\r\
Usage    : CHAT RELOAD ([CHAT FILE])\n\r\
Example  : chattest foreman hello there\n\r\
Example  : chatlint chat.dat\n\r\
Short(s) : CHATLINT\n\r\
For NPCs that talk (MudChat).  CHATTEST shows what the NPC would make of \
what you would say, without anyone speaking: its base and active chat \
groups, anything that would stop it answering (it cannot hear or see you, it \
answered you last, another NPC spoke, three or more players are here), each \
entry the words lead to and whether it matches, and the replies of the first \
that does, with their weights and their variables filled in ($n is the NPC's \
own name).  CHATLINT checks a chat file as the parser reads it: patterns that \
do not parse, malformed ${} lines, @ links to groups not defined above them, \
replies with no pattern, patterns with no replies, files that cannot be read \
and lines the parser skips, each with its line number.  CHAT RELOAD reads a \
chat file again (or all of them) for every NPC that talks from it; in builder \
mode an edited chat file is read again by itself.

QUESTINFO=\
Command  : QUESTINFO\n\r\
Usage    : QUESTINFO [QUEST NAME/NUMBER]\n\r\
Usage    : MODIFY QUEST [NAME] STEP [NUMBER/STEP NAME]\n\r\
Usage    : MODIFY QUEST [NAME] WIN/UNWIN [CHARACTER]\n\r\
Usage    : MODIFY QUEST [NAME] RESETWINNERS\n\r\
Usage    : MODIFY QUEST [NAME] REOPEN\n\r\
Usage    : MODIFY QUEST [NAME] VAR [NAME] [VALUE]\n\r\
Usage    : MODIFY QUEST [NAME] RELOAD\n\r\
Example  : questinfo bell\n\r\
Example  : modify quest bell step 4\n\r\
Short(s) : \n\r\
QUESTINFO shows a quest on one screen: whether it runs, waits, is stopped or finished, \
its step, the time left (or until it starts), its variables, the MOB, ITEM, \
ROOM and AREA it designated and its groups, with where each is, the mobs and \
items it holds, the scripts, behaviours and effects it added and to what, \
its winners, and its last errors (a step that sets no duration stops the \
quest, and says so here).  MODIFY QUEST tests it: STEP goes to a step of a \
running quest; WIN and UNWIN make a character a winner or not; RESETWINNERS \
forgets them all; REOPEN makes a finished quest one that has not run; VAR sets a quest variable; RELOAD reads the quest's script \
and the scripts it loads again (from their files, after an edit) and, if it \
was running, starts it again at the step it was at, with its variables.

VARS=\
Command  : VARS\n\r\
Usage    : VARS LIST ([SCOPE]) ([HOST]) ([MASK])\n\r\
Usage    : VARS SCOPES\n\r\
Usage    : VARS SET [HOST] [NAME] [VALUE] (SCOPE [SCOPE])\n\r\
Usage    : VARS CLEAR [HOST] ([NAME]/*) (SCOPE [SCOPE])\n\r\
Usage    : VARS WATCH ([HOST] [NAME]) / VARS UNWATCH\n\r\
Usage    : VARS DUMP [FILE]\n\r\
Example  : vars list * Hero QUEST_*\n\r\
Example  : vars set Hero ACT 3\n\r\
Example  : vars watch * DRAGONMOOD\n\r\
Short(s) : \n\r\
Shows and changes the variables scripts keep (MPSETVAR, $%VAR()%).  LIST \
gives each one's scope, host, name and value: the scope is * for all of them, \
GLOBAL, QUEST and a quest's name, a scope's name (MPSETINTERNAL SCOPE), or \
INDIVIDUAL for the scripts that keep their own; the host and the name may \
hold * as a wild card.  SCOPES counts the hosts and variables of each scope. \
SET sets one as MPSETVAR would (so ++, +5 and the like add), in the global \
scope unless SCOPE is given; CLEAR clears one, or all a host has.  WATCH \
tells you of each change to a variable (* for any host or name), with the \
script file that made it and the room it ran in; WATCH alone lists yours, \
UNWATCH stops them.  DUMP writes the list to a file, to compare two runs. \
Scripts can list names too: $%VARNAMES(host prefix)%.

WORLD=\
Command  : WORLD\n\r\
Usage    : WORLD (LIST)\n\r\
Usage    : WORLD SET [KEY]=[VALUE]\n\r\
Usage    : WORLD PROBLEMS\n\r\
Usage    : WORLD CHECK (AREA ([NAME])) (LOG) (ONLY=[PART],[PART]...)\n\r\
Usage    : WORLD DEV (([AREA]) ON/OFF)\n\r\
Usage    : WORLD STATUS\n\r\
Usage    : WORLD DIFF [FILE]\n\r\
Usage    : WORLD RELOAD ([AREA]) [NAME] (FORCE)\n\r\
Usage    : WORLD RELOAD SCRIPT [FILE]/ALL (RESET)\n\r\
Usage    : WORLD RELOAD QUEST [NAME]/QUESTS/CATALOG/CHANGED\n\r\
Usage    : WORLD BACKUPS ([FILE])\n\r\
Usage    : WORLD RESTOREFILE [FILE] ([TIME])\n\r\
Usage    : WORLD DIG ON/OFF (TYPE=[LOCALE/TEMPLATE]) (LINK=TWO-WAY/ONE-WAY)\n\r\
Usage    : WORLD PATH [DIRECTIONS] (TYPE=..) (NAME="..") (DESC="..") (LINK=..)\n\r\
Usage    : WORLD MAP (RADIUS [N]) (AREA) (IDS) (FLAGS) (HTML=[FILE])\n\r\
Example  : world\n\r\
Example  : world check only=exits,keys\n\r\
Example  : world diff castle\n\r\
Example  : world reload castle\n\r\
Example  : world path e,e,n,ne type=forestpath name="A forest trail"\n\r\
Example  : world map area ids flags\n\r\
Example  : world reload script progs/innkeeper.script reset\n\r\
Example  : world set START=Emberfall#0\n\r\
Example  : world set HOURSINDAY=12\n\r\
Short(s) : LIST WORLDINI\n\r\
WORLD lists the world settings: the keys a world may set in world.ini in its \
folder, each with its value in effect and where that came from (coffeemud.ini, \
world.ini or the command line).  In builder mode, WORLD SET KEY=VALUE changes \
the key's line in world.ini, or adds one, and a blank value takes it out; it \
takes effect the next time the game starts.  Keys that are not world \
settings, such as the database's, stay in coffeemud.ini.  WORLD PROBLEMS lists \
what did not load from the world files: an object of an unknown class (a \
misspelled ability, say) is skipped, and its file loaded only in part, so \
builder mode does not write that file until it is fixed (and the world \
loaded again from it), or SAVE FORCE writes it as the world has it.  WORLD \
CHECK, in builder mode or a DEV=1 game, checks the whole world (or one area) \
and lists errors, then warnings, each with its part and room: EXITS (exits \
to nowhere, doors with no way back), REACH (start rooms that do not exist, \
rooms nothing leads to from them, by area), KEYS (locked doors and containers \
whose key is nowhere: in rooms, carried, in shops or the catalog), TEXT (the \
new room's description, rooms, generic mobs and items with their class's \
text), SHOPS (shopkeepers with nothing to sell), DATA (WORLD PROBLEMS), \
SCRIPTS (SCRIPTCHECK), PROPS (PROPCHECK) and JS (the world's JavaScript classes); ONLY= picks parts, LOG writes the \
report to the log too.  sud.sh CHECK=1 loads the world as a new game would, on \
a scratch copy, runs it with no player, prints it and exits 1 if it found \
errors: for a script or a commit hook.  WORLD DEV lists the dev areas: those \
in world/dev, for building and testing only, which builder mode and DEV=1 \
games load and a normal game never does (DEVSTART= in coffeemud.ini can \
start new characters in one, such as a hub with portals and test gear).  In \
builder mode, WORLD DEV [AREA] ON makes an area one (SAVE writes it to \
world/dev) and OFF a shipped one again; WORLD CHECK warns of an exit from a \
shipped area into a dev area, which leads nowhere in a normal game.  In \
builder mode, SAVE does not write over or delete a world file changed outside \
the game (edited, added or deleted since the game loaded or last wrote it): \
what it would write goes beside it, as NAME.builder, and SAVE FORCE writes \
over it.  WORLD STATUS lists the files changed outside the game, and what \
SAVE would write, delete and leave; WORLD DIFF [FILE] shows a file (castle, \
areas/castle.cmare, quests/hunt.quest) against what SAVE would write, - for \
its lines on disk and + for SAVE's.  WORLD RELOAD loads world files again \
into the running game: an area (by its name or its file's), whose players \
and their followers wait outside it and come back, and whose exits from \
other areas are linked again (refused while rooms of it have unsaved mobs \
or items, as LIST UNSAVED lists them, unless FORCE); SCRIPT, the scripts \
that name a file (or ALL), their triggers reset with RESET; QUEST, a \
quest stopped, read again from its file in world/quests and started again \
at its step; QUESTS, each of them; CATALOG, the catalog's entries from its \
file; CHANGED, each file WORLD STATUS lists as changed outside the game.  \
In a normal game it saves the game as world-reload and restores it, which \
builds the world from its files again.  DEVWATCH ON ([SECONDS]) looks at \
the world files and resources' scripts every few seconds and runs the \
reload that matches what changed, each noted in DEVLOG; DEVWATCH OFF stops \
it.  Before SAVE writes over or deletes a world file it keeps a copy in \
world/.backup/ (the last BACKUPS= in coffeemud.ini of each, 5 if not set): \
WORLD BACKUPS lists the files with backups, WORLD BACKUPS FILE the times of \
one's, and WORLD RESTOREFILE FILE (TIME) puts the newest (or that one) back, \
changed outside the game, for WORLD RELOAD to load.  WORLD DIG ON makes a \
room, as CREATE ROOM does (of the room's own kind, or TYPE=, a locale or a \
builder template), wherever you walk and there is no exit, and goes into \
it, linked back unless LINK=ONE-WAY; WORLD DIG OFF stops it.  WORLD PATH \
lays out a chain of rooms, one for each direction, following the exits \
there already, each with NAME= and DESC= if given, and leaves you where you \
are.  Rooms made so are saved and tagged TODO, which WORLD CHECK lists until \
EDIT DESC gives them their own text.  WORLD MAP draws the rooms around you \
(5 steps out, or RADIUS N) or the whole area (AREA), north up, laid out by \
walking their exits from your room (*); a room above or below, or where \
another is, is listed instead.  IDS numbers the rooms and lists them; FLAGS \
marks what to look at: > < v ^ an exit that does not lead back, + a locked \
door, @ an exit to another area, s a room with scripts, and lists the rooms \
of the area nothing leads to from here.  HTML=FILE writes the area's map \
to world/maps/FILE.html, each room with its exits as links.

MPRUN=\
Command  : MPRUN\n\r\
Usage    : MPRUN ([USER]:[PASS]) [SCRIPT]\n\r\
Example  : mprun once_prog;mpecho hello!;~;\n\r\
Example  : mprun load=mine.script\n\r\
Example  : mprun archons:password once_prog;mpecho hello!;~;\n\r\
Short(s) : \n\r\
Runs the given script as per the Scriptable behavor.  Since Scriptable scripts are \
event-triggered, any commands executed must be in a ONCE_PROG trigger (or perhaps \
a RAND_PROG).\n\r\
\n\r\
For use as part of automated testing, MPRUN can also be executed by unauthorized users \
so long as they know the username and password of an authorized user.  Any failed attempts \
to use this command will cause the user to be marked as unable to use this command for \
two minutes.

TEST=\
Command  : TEST\n\r\
Usage    : TEST (LIST) [CATEGORY]/[TEST NAME]\n\r\
Example  : test all\n\r\
Short(s) : \n\r\
Runs one or more of internal tests.  This command is only for code developers, and takes a lot \
of time and resources to complete, so use it only if you know why you are doing it.

NOWIZINFO=\
Command : NOWIZINFO\n\r\
Usage   : NOWIZINFO\n\r\
Example : nowizinfo\n\r\
Short(s): \n\r\
Turn off the automatic information channel available to admins and \
area admins. 

MASKS=\
In numerous parameters, places, and input fields, CoffeeMud will ask you for something \
called a "Zapper Mask".  The mask is used to help select particular mobs, items, etc \
from the universe of available selections by "filtering out" those you don't want. \
For example, if you wanted to only select mobs named Bob, you would compose a mask \
that Disallows non-mobs, and Disallows things that dont have the name Bob.  This is \
done using the Zapper Mask syntax, shown below:\n\r\
<ZAP=disallow>

ZAPPER_MASKS=MASKS

ABILITY_PREREQS=\
Ability Prerequisites is a comma delimited list of skills or skill masks that describe \
what skills or set of skills must be learned, and at what optional proficiency, before \
a player of a given class can learn that skill.  The list is comma delimited, and each \
item in the list consists of a valid Ability ID (like Spell_Fireball), or a wildcard \
mask of Ability_IDs (like Spell_F* to select all Ability IDs beginning with Spell_F). \
Following the Ability_ID is an optionally number in parenthesis, which would represent \
the minimum proficiency of the aforementioned Ability that is required.\n\r\
Example:\n\r\
Skill_Trip(50),Fighter_*(10)\n\r\
The above means that the current ability requires that the player have Trip at 50% \
proficiency and any Fighter skill at 10% proficiency or better.

NEWS=The channel where logon news is shown.  Try LIST NEWS and MODIFY NEWS.

ABILITY_SECRET=\
Ability secret status is a flag with three states: Public means that characters know \
about the ability, and teachers will normally teach it.  Secret means that characters and \
teachers will not know about the ability, which means a scroll or other means is required. \
Masked means the ability is secret except when the Ability mask criteria are met.
