LIST_DISABLES=LIST_DISABLEDS
LIST_DISABLEDS=\
Command  : LIST\n\r\
Usage    : LIST DISABLEDS\n\r\
Example  : list disableds\n\r\
Lists all the active disable flags in your mud.  Use LIST DISABLEFLAGS to see all available.

LIST_ENABLEFLAG=\
Command  : LIST\n\r\
Usage    : LIST ENABLEFLAG\n\r\
