ACCOUNT=\
Command : ACCOUNT\n\r\
Usage   : ACCOUNT [ACCOUNT/PLAYER NAME]\n\r\
Example : account bob\n\r\
Short(s): \n\r\
If this mud supports accounts, this command will show the account name, \
a list of characters, and the account expiration date, if applicable.

ARCHELP=AHELP
AHELP=\
Command : AHELP\n\r\
Usage   : AHELP [TOPICNAME]\n\r\
Example : ahelp ahelp\n\r\
Short(s): \n\r\
A command to view the Administrative help commands.

AFFECT=\
Command : AFFECT\n\r\
Usage   : AFFECT ([TARGET])\n\r\
Example : affect\n\r\
Example : affect room\n\r\
Example : affect area\n\r\
Example : affect orc\n\r\
Short(s): AFF\n\r\
List the spell or other affects that your character is currently \
under the influence of.  If targeted, it will show what the given \
target is affected by.
    
AREAS=See the normal HELP AREAS for usage information. \
The Archon version of this command will color the area names based \
on whether the area is active or passive, frozen or stopped.  Also, \
area names will be in parenthesis if they are currently Hidden from \
normal users.

TICKTOCK=\
Command : TickTock\n\r\
Usage   : TICKTOCK [NUM] (HOURS/MONTHS/DAYS/YEARS)/CLANTICK/[THREAD]\n\r\
Usage   : SET [FORMATTED DATE]\n\r\
Example : ticktock 10\n\r\
Example : ticktock 5 weeks\n\r\
Example : ticktock -4\n\r\
Example : ticktock CLANTICK\n\r\
Example : ticktock THPLAYERS0\n\r\
Advance the time by specified number of hours, or cause one of the \
specified maintenance threads to immediately go through a cycle.  \
Use LIST REPORTS to get a list of maintenance threads.  The CLANTICK \
argument forces the timed clan maintenance.\n\r\
Formatted dates can be: Y#/M#/D#/H# or M#/D#/Y# H#h.

ARCTOPICS=ATOPICS
ATOPICS=\
Command : ATOPICS\n\r\
Usage   : ATOPICS [TOPICNAME]\n\r\
Example : atopics\n\r\
Short(s): \n\r\
A command to view the Administrative help topics.\n\r\

AS=\
Command : AS\n\r\
Usage   : AS [PLAYERNAME/MOBNAME]/(PORT X)/PLAYERS (HERE) [COMMAND]\n\r\
Example : as "bob" inventory\n\r\
Example : as bob here drop all\n\r\
Example : as PLAYERS here drop all\n\r\
Example : as bob cast fireball monster\n\r\
Example : as port 2325 list users\n\r\
Short(s): \n\r\
A command that allows one to issue other commands as if they \
were another player or mob.  Anyone can use it on their own characters in \
the world: see PARTY.  This is the best way to manage \
a players inventory or bank accounts from the command line. \
The optional "here" parameter should follow the name if the \
command is to be issued with the player in the same room as the \
archon. The optional "port x" parameter can be used to execute \
commands on other mud hosts, so long as the admin qualifies as a SysOp \
on the target port.\n\r\
\n\r\


ASYNC=\
Command : ASYNC\n\r\
Usage   : ASYNC [COMMAND]\n\r\
Example : async where mob the\n\r\
Short(s): \n\r\
A command that allows one to issue other commands on their own \
separate thread, so that you can continue to issue other commands \
while the other one is ongoing and giving you its output.  Be careful \
not to lock up all of your muds threads this way!

AT=\
Command : AT\n\r\
Usage   : AT [ROOM ID/DESC/MOB/AREA]/PLAYERS [COMMAND]\n\r\
Example : at "the greasy pub" smile\n\r\
Example : at Midgaard#3001 bow\n\r\
Example : at bob cast fireball bob\n\r\
Example : at players say hello all!\n\r\
Short(s): \n\r\
A command that allows one to issue other commands elsewhere in the \
mud.

BEACON=\
Command : BEACON\n\r\
Usage   : BEACON ([PLAYER TYPE]/[SHIP NAME])\n\r\
Example : beacon\n\r\
Example : beacon bob\n\r\
Short(s): \n\r\
A command to change the start room of a player, or the home port \
of a given ship.  If no player or ship \
is named, this command will change your own start room to the room \
you occupy.  If a player is named, this command changes the players \
start room to the room the player currently occupies.  If a ship is named, \
then the current ships location will become their home port.
	
CATALOG=\
Command  : CATALOG\n\r\
Usage    : CATALOG LIST (MOBS/ITEMS/CATEGORIES/) [NAME MASK]\n\r\
Usage    : CATALOG (DELETE) [ITEM/MOB NAME]\n\r\
Usage    : CATALOG (ROOM/AREA/WORLD) (MOBS/ITEMS/)\n\r\
Usage    : CATALOG EDIT [ITEM NAME]\n\r\
Usage    : CATALOG CATEGORY [CATEGORY NAME]\n\r\
Usage    : CATALOG SCAN/DBSCAN (ROOM/AREA/WORLD) (MOBS/ITEMS/)\n\r\
Usage    : CATALOG OVERLOOK/DBOVERLOOK (ROOM/AREA/WORLD) (MOBS/ITEMS/)\n\r\
Example  : catalog list\n\r\
Example  : catalog list mobs the st\n\r\
Example  : catalog list mob categories\n\r\
Example  : catalog the waiter\n\r\
Example  : catalog delete the waiter\n\r\
Example  : catalog edit the sword\n\r\
Example  : catalog room mobs\n\r\
Example  : catalog scan area\n\r\
Example  : catalog dboverlook area mobs\n\r\
Short(s) : \n\r\
This command is used to manage your muds global catalog of generic mobs and/or items. \
The catalog is a place where you can store templates of mobs and items for reuse, \
or for quick global modification and analysis.  Mobs and items in your catalog \
can be changed globally simply by creating and then changing any instance of one \
of them.  You can create \
new instances of a cataloged object simply by entering CREATE <cataloged object name>. \
Your catalog is keyed by name, so once the name of a cataloged item or mob is set, it \
should not be changed. \
\n\r\n\r\
Cataloged items can be placed into categories by issueing the catalog category command \
before adding or modifying catalog entries.  Mobs and items so cataloged must still \
have a unique global name, but flagging them this way can make listing them must easier. \
\n\r\n\r\
You may review the objects in your catalog using the catalog list command. You can also \
check the catalog synchronicity of the objects in your live rooms with scan, or your \
saved rooms with dbscan.  You can check for uncataloged objects in live rooms with the \
overlook parameter, or in your saved rooms with dboverlook. \
\n\r\n\r\
You may delete an object from your catalog to stop using it as a global template. \
Deleting an object from the catalog only detaches instances of a cataloged object from \
all others, but does not destroy any actual instances.\
\n\r\n\r\
The catalog is also used to manage a global random item-drop table.  Items can be set to \
randomly appear in the inventories of selected mobs when those mobs are brought to life, or \
at the moment of their death. Use CATALOG EDIT <item name> to change drop settings.

CATCHUP=\
Topic   : CATCHUP\n\r\
Short(s): \n\r\
CoffeeSUD: an area no player has been in for its PASSIVEMINS game minutes turns PASSIVE: \
its wanderers and aggressive mobs stop, though scripts and most behaviours go on.  When a \
player comes back, it wakes and catches up on what it would have done, at once: Mobile \
wanderers take the steps they would have taken (at most 10), Patroller the steps of its \
route it missed while it did not tick, Schedule NPCs are in their places, a Sleeper asleep \
or up as the hour says, a Prop_ClosedDayNight keeper with HOME= at home or at work.  The \
wanderers go first, so that a routine has the last word.  A script's FUNCTION_PROG CATCHUP \
runs with $g the ticks it slept (a Scriptable's, a generic behaviour's or one on the \
thing); a JavaScript file of JSBehavior or Prop_JScript may define catchUp(host, ticks).  \
An area with the tag NOCATCHUP stays as it was; CATCHUP=OFF in the world's settings turns \
it off everywhere.

NPCFORMULAS=\
Topic   : NPCFORMULAS\n\r\
Short(s): \n\r\
CoffeeSUD: the combat numbers a mob gets from its level, when it is made, by RESET \
MOBCOMBATSTATS, Prop_Doppleganger, summons and hirelings, are formulas in coffeemud.ini \
(or a world's world.ini): FORMULA_NPCHITPOINTS, FORMULA_NPCARMOR (lower is better; a \
half rounds down), FORMULA_NPCATTACK, FORMULA_NPCDAMAGE, FORMULA_NPCSPEED (attacks a round), \
FORMULA_NPCREJUV (game minutes before a dead mob comes back) and FORMULA_NPCMONEY.  In \
each, @x1 is the level, @x2 LASTPLAYERLEVEL and @x3 the mob's ABILITY (its hit point \
modifier); in FORMULA_NPCATTACK @x4 is the attack bonus a level from its attack attribute, \
and in FORMULA_NPCMONEY @x5 is a roll of 1d(level) and @x6 a roll of 1d10.  The defaults \
are what CoffeeMud always did, so nothing changes until they are edited; then RESET \
MOBCOMBATSTATS WORLD brings the mobs already made into line.  Operators are worked left to \
right, so use brackets; < is the smaller of two, > the larger, ? a random number between.  \
A formula that does not work out is logged once and gives 0.  In the attack, armor, \
damage and crit formulas, @xP is 1 when the one the number is for (the attacker, or whose \
armor it is) is a character or follows one, and @xD is the difficulty's D (STORY 0.5, EASY \
0.75, NORMAL 1, HARD 1.25), so a curve can treat the player's side apart or follow the \
difficulty.  DIFFICULTY=NORMAL in coffeemud.ini or world.ini is a new game's difficulty, \
and DIFFICULTY_[NAME]="NPCDAMAGE=n NPCHP=n PLAYERDAMAGE=n PLAYERXP=n D=x" changes a \
preset or adds one; the player's DIFFICULTY command changes it in play, and the save keeps \
it.\n\r\
Example: a low-magic world where mobs hit harder and are easier to hit: \
FORMULA_NPCDAMAGE=@x1*1.3 and FORMULA_NPCARMOR=110-(@x1*1.8), then RESET MOBCOMBATSTATS WORLD.

FORMULA_NPCARMOR=NPCFORMULAS
FORMULA_NPCATTACK=NPCFORMULAS
FORMULA_NPCDAMAGE=NPCFORMULAS
FORMULA_NPCSPEED=NPCFORMULAS
FORMULA_NPCREJUV=NPCFORMULAS
FORMULA_NPCMONEY=NPCFORMULAS

NPCTOPICS=\
Topic   : NPCTOPICS\n\r\
Short(s): \n\r\
CoffeeSUD: in what an NPC says (a SAY, a MudChat reply, a script's say, a shopkeeper's \
line), [[mine]] or [[the old mine|mine]] shows the words highlighted and teaches the topic \
(mine) to each player character who hears it: they are told "(You can ask about mine \
now.)".  A character's topics are kept in their script variable KNOWN_TOPICS (topics \
between |), saved with the game; VAR($n KNOWN_TOPICS) reads it.  ASK [NPC] ABOUT or TALK \
[NPC] ABOUT, with no topic, lists the topics the character knows that the NPC answers to: \
the words of its scripts' SPEECH_PROG and TALK_PROG (not ALL), and MudChat entries found by \
the topic's own words.  A plain TALK lists them too, when there are any.  HINTTOPICS=true \
in coffeemud.ini or world.ini, or the tag HINTTOPICS on an NPC, has the NPC tell its topics \
(and teach them) the first time a character talks with it: its scripts' words and its own \
chat file's entries (not the default chat file's).

HINTTOPICS=NPCTOPICS

CLOAK=\
Command  : CLOAK\n\r\
Usage    : CLOAK (OFF)\n\r\
Example  : cloak\n\r\
Example  : cloak off\n\r\
Short(s) : \n\r\
Cloak makes the player unable to be seen in the WHO list.  They can \
still be seen by players in the same room, however.

COPY=\
Command : COPY\n\r\
Usage   : COPY ([NUMBER]) [ITEM TYPE]/[DIRECTION]/([ABILITY ID] [NEW ID])\n\r\
Example : copy joe\n\r\
Example : copy beast sword\n\r\
Example : copy Longsword@room\n\r\
Example : copy Longsword@an orc\n\r\
Example : copy east\n\r\
Example : copy Spell_Fireball Spell_AlsoFireball\n\r\
Short(s): \n\r\
A command for the creation of items, mobs, generic abilities, and rooms. \
Enter COPY for more information on command usage.

CREATE=\
Command : CREATE\n\r\
Usage   : CREATE [ITEM TYPE] ... \n\r\
Example : create room e StdRoom\n\r\
Example : create item Longsword\n\r\
Example : create item Longsword@room\n\r\
Example : create item Longsword@an orc\n\r\
Example : create StdExit east\n\r\
Example : create news\n\r\
Short(s): \n\r\
A command for the creation of an EXIT, ITEM, QUEST, FACTION, COMPONENT, GOVERNMENT, HOLIDAY, \
CLAN, MOB, RACE, MIXEDRACE, ABILITY, LANGUAGE, CRAFTSKILL, HELP/AHELP, \
ACHIEVEMENT, MANUFACTURER, ALLQUALIFY, CLASS, DEBUGFLAG, \
WEBSERVER, DISABLEFLAG, ENABLEFLAG, NEWS, USER, TRAP, WRIGHTSKILL, \
GATHERSKILL, CRON, TITLE, AWARD, or ROOM. \
Enter CREATE or CREATE X for more information on command usage. \
Use AHELP QUESTS for more information on creating quests.  \
CoffeeSUD: CREATE QUEST's Quest Maker has story templates for one player: Story Talk #1 (speak with \
someone, perhaps handing something over), Story Chain #1 (three stages in turn), Story Choice #1 (two \
outcomes, each with its own reward and outcome word), Story Use-Item #1 (leave an item in a room), Story \
Explore #1 (find a room) and Story Bounty #1 (a repeatable kill count with a cooldown).  They offer the \
quest with a yes/no question, mark givers and turn-ins, and keep objectives and the journal.  The \
competitive templates, which race several players, are not listed.  CREATE BEHAVIOR [ID] makes a \
behaviour defined as data, a script with parameters (AHELP GENBEHAVIOR).

DESTROY=\
Command : DESTROY\n\r\
Usage   : DESTROY [ITEM TYPE] ... \n\r\
Example : destroy room e\n\r\
Example : destroy orc\n\r\
Example : destroy item longsword\n\r\
Example : destroy item longsword@an orc\n\r\
Short(s): \n\r\
A command for the destruction of EXIT, ITEM, AREA, USER, MOB, QUEST, FACTION, \
SESSION, TICKS, THREAD, HOLIDAY, JOURNAL, SOCIAL, ACHIEVEMENT, CLASS, ABILITY, MANUFACTURER, \
LANGUAGE, COMPONENT, RACE, EXPERTISE, TITLE, CLAN, BAN, GOVERNMENT, NOPURGE, BUG, TYPO, IDEA, \
WEBSERVER, DEBUGFLAG, DISABLEFLAG, ENABLEFLAG, CRAFTSKILL, GATHERSKILL, CRON, \
TRAP, WRIGHTSKILL, AWARD, DELETE: (MQL), or a ROOM. \
Enter DESTROY for more information on command usage.  \
CoffeeSUD: DESTROY BEHAVIOR [ID] removes a generic behaviour (AHELP GENBEHAVIOR).
	
DEVIATIONS=\
Command : DEVIATIONS\n\r\
Usage   : DEVIATIONS [MOBS/ITEMS/BOTH] [MASK]/ROOM/AREA/METRO\n\r\
Usage   : ... (SORTBY [NAME/LEVEL/PLEVEL/TYPE]\n\r\
Example : deviations mobs area\n\r\
Example : deviations mobs area sortby level\n\r\
Short(s): \n\r\
A command for showing items in a room or area or metro (area and \
children areas), and how they deviate from established norms for their \
type and level.  This is done by comparing the base stats.  Magical \
ability is applied only to the level of the item.
	
EVERY=\
Command : EVERY\n\r\
Usage   : EVERY [ROOM/ITEM/MOB/EXIT] (INAREA/INWORLD) (+PLAYERS) (<MASK>[ZAPPERMASK]</MASK>) [COMMAND]\n\r\
Example : every room inarea look\n\r\
Example : every mob cast tourettes *\n\r\
Short(s): \n\r\
This command allows you to execute a command against every room, item, mob, or exit in the same room \
as the Archon.  The name of the target can be substituted in your command with an asterisk *.  The \
INAREA or INWORLD flag may be given to expand the rooms affected.  The +PLAYERS flag will include players \
when the MOB argument is given.  A ZapperMask may be placed between <MASK> and </MASK> strings to filter \
out the type of mob/item affected; see HELP ZAPPERMASK for more information on that.

EXPIRE=\
Command : EXPIRE\n\r\
Usage   : EXPIRE [PLAYERNAME] ([NEW DAYS REMAINING]) \n\r\
Example : expire bob\n\r\
Example : expire bob 15\n\r\
Short(s): \n\r\
This command sets and displays the amount of active days a user has left.  This command \
is only relevant if the account expiration system is enabled in your coffeemud.ini file.

GENERATE=\
Command : GENERATE\n\r\
Usage   : GENERATE [OBJ TYPE] [ID] (FROM [FILENAME]) ([VAR]=[VAL]...) ([DIR]/[TARGET])\n\r\
Example : generate area maze_dungeon from randareas/example.xml areasize=50 "areaname= the test" \
level_range=10?20 aggrochance=50 theme=kobolds south\n\r\
Usage   : GENERATE CHECK [FILENAME]\n\r\
Example : generate area maze_dungeon from randareas/forest.xml areaname=Woods areasize=20 level_range=5 aggrochance=0 theme=forest SEED=13 up\n\r\
Example : generate string list\n\r\
Example : generate check randareas/example.xml\n\r\
\n\r\
CoffeeSUD: SEED=[N] builds the same thing each time (the same seed, the same area, rooms, mobs and items); \
with no SEED it picks one and says it, and an area keeps it as its GENSEED flag.  The game's own rolls go \
on as if nothing had been built.  In a template, seed="[MATH]" on an AREA, ROOM, MOB or ITEM tag seeds \
just that one (seed="$[$GAME_DAY]" for one a day); $GEN_SEED is the seed in use.  An autogen instance's \
or AutoGrid's SEED variable is a number, GAME (the save's own seed, so the same dungeon each visit) or \
ENTRY (a new one each time).\n\r\
\n\r\
GENERATE FILL [ROOM ID] (FROM [FILENAME]) ([VAR]=[VAL]...) ROOM/AREA (KEEPTEXT) (SEED=[N]) runs a ROOM \
template on rooms that are already there: the room you are in, or every room of its area.  Each room \
gets the tags a layout would give it, from its real exits: ROOMTAG_NODETYPE (leaf for one exit, street \
for two, square for more), ROOMTAG_NODERUN (ns, ew, ud, nesw or nwse for a straight street), \
ROOMTAG_NODEEXITS (,n,e,), ROOMTAG_NODEFLAGS (corner, tee, intersection, gate), the neighbours' \
NODETYPE_x, ROOMTITLE_x and ROOMLINK_x, ROOMTAG_NODEGATEEXIT and ROOMTAG_GATEEXITROOM for an exit out of \
the area, and the depth tags from a walk from the entrance.  The template sets the title and \
description (unless KEEPTEXT, or the room is GENLOCK) and adds its mobs, items, effects and \
behaviours; the exits are left alone.\n\r\
\n\r\
The layouts are APARTMENT, BOXCITY, BOXCITYSQUARE, BRANCH, CROSS, GRIDCITY, MAZE, MESH, SPOTTEDMESH, \
TREE and MAP, and with CoffeeSUD: CAVE (smoothed random blobs and winding passages), CLUMP (a square \
block with dead ends off it), LINEAR (a road with side spurs), RING (a loop with spokes, for wall \
walks) and ISLANDS (clusters joined by single bridges).  layout="TREE,CAVE" picks one at random.  \
levels="N" on an AREA (or a ROOM with a layout) splits its size over N floors of the layout, each \
joined to the next by a stair at rooms that are not leaves: DOWN to the next floor and UP back, or \
the other way with levelsdir="UP".  Rooms get ROOMTAG_LEVEL (1 for the entrance's floor) and \
ROOMTAG_STAIRS (up, down, or up,down), and the area AREA_LEVELS.\n\r\
\n\r\
layout="MAP" on an AREA lays its rooms out as drawn, in a MAP tag inside it or the file its \
MAPFILE="world/maps/keep.txt" names (the size is the number of rooms drawn).  Each character that \
is not a link or a space is a room: . a street, o an interior room, L a leaf, @ the entrance, ^ and v \
stairs, and any other a room built from the ROOM template its <GLYPH char="B" room="boss_room"/> \
names (else from the AREA's rooms, as the others are).  Rooms side by side are joined, - and | join \
rooms a space apart, + does so with a door, / and \\ on the diagonal; a line of = starts the floor \
above, and a ^ is joined to the v in the same column there.  The rooms get the usual ROOMTAG tags, \
with ROOMTAG_GLYPH (the character) and ROOMTAG_DOORS (,e,n,), so the themes fill a drawn plan as \
they fill a made one, and re-rolling keeps the plan.\n\r\
\n\r\
An AREA's ENSURE tags run once its rooms are laid out and filled.  <ENSURE NAME="[WORDS]" or \
VAR="[COUNTER]" MIN="[N]" MAX="[N]" FALLBACK="[ITEM OR MOB ID]" WHERE="..." IN="MOB|CONTAINER|ROOM"/> \
makes sure of a thing: with NAME, the mobs and items whose names hold the words are counted where \
they may be, and one in the wrong place is moved to a right one; with VAR, the counter is read; then \
the FALLBACK tag is built until MIN is reached, and with NAME, MAX removes the extras (those in the \
wrong place first).  WHERE is ANY (the default), REACHABLE (from the entrance) or \
REACHABLE-WITHOUT:KEYNAME=[KEY] (from the entrance without going through a door locked to that key), \
so a key is never behind the door it opens; IN says whether an item goes on a mob, in a container or \
in the room there (ROOM by default).  <ENSURE ROOM="[ROOM ID]" COUNT="[N]" REPLACE="[ROOM ID]"/> \
makes sure that many rooms came from that ROOM template: the deepest rooms (of the REPLACE template, \
if given) are emptied and made from it, keeping their exits.\n\r\
\n\r\
UNLINKED as the last word (GENERATE AREA ... [DIR] UNLINKED) builds the area with no gate, for LINK \
later; it says the entrance's room ID.  The area keeps a GENSOURCE flag, how it was made (the file, the \
AREA id, the seed and the variables given), saved in its .cmare: REGENERATE AREA builds it again from \
it.  GEN_BACKTICKS=false in coffeemud.ini keeps real apostrophes in what GENERATE makes (names and \
texts), rather than the engine's backticks.\n\r\
\n\r\
Room templates in a generated area also see ROOMTAG_DEPTH (rooms from the entrance), ROOMTAG_DEPTHPCT \
(0 to 100), ROOMTAG_ISDEEPEST (true or false), ROOMTAG_INDEX, ROOMTAG_X and ROOMTAG_Y, and AREA_MAXDEPTH \
and AREA_NUMROOMS; an AREA's order="depth", "reverse-depth" or "random" is the order its room groups are \
built in after the entrance.\n\r\
\n\r\
GENERATE CHECK loads a file as GENERATE would, with its LOAD and FROM includes, \
generates nothing, and lists its mistakes by line and tag id: what loading it \
complains of (duplicate ids, includes that are missing), INSERT ids that are not \
defined, LIKE ids that are not defined or not of the same tag, CLASS values that \
are no class of their kind, unknown layouts and SELECT modes.\n\r\
\n\r\
This command uses an xml file to generate random content for your mud.  This content can \
be anything from whole areas, to rooms, mobs, items, or simple strings. By default, the \
content is built from the file in resources/randareas/example.xml, though the builder \
may specify his or her own xml file path as one of the many arguments.  The arguments, \
briefly, are:\n\r\
\n\r\
OBJ TYPE: One of the following: AREA, ROOM, MOB, ITEM, SCRIPT, or STRING.\n\r\
\n\r\
ID      : one of the "id" xml attributes defined on any tag in the XML file. \
Use GENERATE STRING LIST for a list of all "id" attributes defined in your file.\n\r\
\n\r\
FROM "F": An optional argument to specify your own xml file, with the resources \
directory being the default root.\n\r\
\n\r\
VAR=VAL : One or more variables and their definitions.  Many tags will have a specific set of required \
variables which must be defined in order for the content to be generated.  Failing to specify \
one of the required variables will cause an error message listing the variables which must \
be defined, and the type of data required for the variable.  Variable types which list numbers \
as their data types may also have math expressions values (so you can use random numbers).  See \
the help on MATH EXPRESSION for more information on this.  In addition to required variables, you \
may also use the space to enter one or more "override" values.  Many object fields (such as LEVEL \
for mobs and items, or NAME, etc) as well as the XML id tags, can have their "random" values overridden \
by defining them using the generate command.  If you need to use a space in a variable value, enclose \
the ENTIRE definition in quotes, such as "areaname=the dungeon" instead of areaname="the dungeon".\n\r\
\n\r\
DIRECTION: This applies only to ROOM and AREA object types.  The object, if successfully generated, will \
be linked to the current room that the player is standing in, in the direction they specify.\n\r\
\n\r\
TARGET: This applies only to SCRIPT object types.  The script, if successfully generated, will \
be added to the target.\n\r\
\n\r\
In closing, the GENERATE command is an interesting way to deliver large amounts of dynamic content \
for your world, though it can never replace the caring touch of a real, creative builder.  If \
anyone is interested in writing their own xml content, please open up the /resources/randareas/example.xml \
file and begin reading. Use that file as an example on how to construct your own.

JCONSOLE=\
Command : JCONSOLE\n\r\
Usage   : JCONSOLE (@[TARGET]) ([STATEMENT])\n\r\
Example : jconsole ([statement])\n\r\
Short(s): \n\r\
When entered with a statement, this command will execute the single javascript statement \
and exit.  When entered alone, it will enter a console where the user can enter as many \
javascript statements as they want, and the system will even remember any variables or \
functions they've defined later one (does NOT survive reboots!).\n\r\
\n\r\
All the Scriptable/MOBPROG \
commands and functions are also available, though the commands and functions must be entered \
in ALL UPPERCASE, and commands must have their parameters separated by commas instead of spaces, \
be put into quotes, and surrounded by parenthesis like javascript function calls.  \n\r\
\n\r\
For multi-line data, you can enter multi-line mode by entering < by itself, \
and exiting by entering > by itself.  If you have GMCP, you might see a pop-up too.\n\r\
\n\r\
JCONSOLE @[NAME] (a mob or item), @HERE, @AREA or @ME binds the console to that thing: its MOBPROG \
calls run as it, with you as the source, and me, here and cm are its.  Lines that start with a dot \
are the console's own: .trigger GREET|SPEECH [TEXT]|GIVE [ITEM]|LOOK|TICK fires that event on it, \
.inspect [EXPR] shows a thing's name, class, room and stats, .load [FILE] runs a file, .reset clears \
the console, .time ON|OFF shows each line's time, .history lists the lines before and !N runs line \
N again.  In builder mode the history is kept from one game to the next.


