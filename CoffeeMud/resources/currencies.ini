# CoffeeSUD: the game's currencies (W2).  A world's copy,
# world/resources/currencies.ini, is read instead of this one.
#
# Each CODE=definition line makes a currency, as an area's CURRENCY would, and
# areas then name it by its code alone.  A definition is its denominations,
# with semicolons between: the value (in the lowest coin), the name, with (s)
# for its plural, and its short form in brackets.  "notrade" first makes a
# currency no shop buys with.  DEFAULT=CODE is the currency of every area with
# none of its own (in place of the gold coins and Archon notes); the built-in
# codes GOLD, COPPER, CREDIT, DOLLAR and VICTORY can be named too.
#
# coffeemud.ini or world.ini can set CURRENCY_CODE=definition and
# DEFAULTCURRENCY=CODE as well, and those come after this file.  A code
# defined twice, differently (here and in an area, say), keeps the first
# definition, and the log says so.
#
#DEFAULT=CROWN
#CROWN=1 copper penny(s) (cp);12 silver shilling(s) (ss);240 gold crown(s) (gc)
#TRADEBAR=notrade;1 trade bar(s) (tb)
