# Hints for SKILLTREE (HELP SKILLTREE).  One line a skill:
#   [ABILITY ID]=HINT="where it is taught"
#   [CLASS ID].[ABILITY ID]=HINT="..." SHOW=HINT
# A class's own line comes before the skill's line for every class.  A hint
# shows beside a locked skill, and in place of a hidden one as "??? - hint";
# SHOW=HINT shows a masked or secret skill by name with its hint, its mask
# kept from view.  A world's own copy (world/resources/skills/) is read first.
