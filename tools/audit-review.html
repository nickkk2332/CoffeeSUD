<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Audit Review</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --text: #1d1d1b; --muted: #66645e; --line: #dedbd2;
  --accent: #2f5d8a; --yes: #2e7d4f; --yes-bg: #e3f2e8; --no: #a33a2e; --no-bg: #f7e4e1;
  --chip: #eeece6; --code: #efede7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #201f1d; --text: #e9e7e1; --muted: #a29f97; --line: #35332f;
    --accent: #7fa8d4; --yes: #7cc79a; --yes-bg: #1e3326; --no: #e48d80; --no-bg: #3a2220;
    --chip: #2c2b28; --code: #2a2926;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #201f1d; --text: #e9e7e1; --muted: #a29f97; --line: #35332f;
  --accent: #7fa8d4; --yes: #7cc79a; --yes-bg: #1e3326; --no: #e48d80; --no-bg: #3a2220;
  --chip: #2c2b28; --code: #2a2926;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 20px; margin: 14px 0 4px; }
.tally { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.tally b { color: var(--text); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
select, input[type=search], button, textarea { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; }
select, input[type=search] { padding: 6px 8px; min-width: 0; }
input[type=search] { flex: 1 1 180px; }
button { padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
main { padding: 16px 0 60px; }
.theme { margin: 28px 0 8px; font-size: 17px; }
.scope { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
.item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.item.yes { border-left-color: var(--yes); }
.item.no { border-left-color: var(--no); opacity: .72; }
.head { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
.id { font-weight: 700; color: var(--accent); min-width: 3.2em; }
.title { font-weight: 600; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0 calc(3.2em + 10px); }
.chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
.chip.high { color: var(--text); font-weight: 600; }
.body { margin: 8px 0 0 calc(3.2em + 10px); display: none; }
.item.open .body { display: block; }
.body p { margin: 0 0 8px; }
.body code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 13px; }
.body ul { margin: 0 0 8px; padding-left: 20px; }
.decide { display: flex; gap: 6px; margin: 10px 0 0 calc(3.2em + 10px); flex-wrap: wrap; }
.decide button.on.y { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); font-weight: 600; }
.decide button.on.n { background: var(--no-bg); border-color: var(--no); color: var(--no); font-weight: 600; }
.note { flex: 1 1 200px; padding: 6px 8px; font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  width: min(640px, calc(100vw - 32px)); }
dialog textarea { width: 100%; height: 50vh; padding: 8px; font: 13px/1.4 ui-monospace, Consolas, monospace; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (max-width: 560px) {
  header { position: static; }
  .meta, .body, .decide { margin-left: 0; }
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Builder capabilities audit</h1>
  <div class="tally" id="tally"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search titles and text">
    <select id="fTheme"><option value="">All themes</option></select>
    <select id="fValue"><option value="">Any value</option><option>high</option><option>medium</option><option>low</option></select>
    <select id="fEffort"><option value="">Any effort</option><option>small</option><option>medium</option><option>large</option></select>
    <select id="fState"><option value="">All items</option><option value="u">Undecided</option><option value="yes">Yes</option><option value="no">No</option></select>
    <button id="openAll">Expand all</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
  </div>
</div></header>
<main class="wrap" id="list"></main>
<dialog id="dlg">
  <p id="dlgText"></p>
  <textarea id="dlgArea" spellcheck="false"></textarea>
  <div class="bar" style="padding-top:10px">
    <button id="dlgCopy">Copy</button>
    <button id="dlgApply">Apply</button>
    <button id="dlgClose">Close</button>
  </div>
</dialog>
<script>
const DATA = {"themes": [{"prefix": "ST", "name": "Script triggers", "scope": "New, fixed and widened MOBPROG triggers: the game, world, clock, party and object events a script can react to."}, {"prefix": "SC", "name": "Script language, functions and commands", "scope": "MOBPROG syntax, variables, string, list, number and time functions, cross-script calls, general script commands, zapper mask keys and the script documentation."}, {"prefix": "JS", "name": "JavaScript", "scope": "The JavaScript runtime and its limits, helper objects, hooks, scheduling, JS classes kept in the world folder, and JS approval."}, {"prefix": "Q", "name": "Quests", "scope": "Quest scripts, quest state and outcomes, branching, rewards, offers, the quest log and templates."}, {"prefix": "N", "name": "NPC behaviour and dialogue", "scope": "Behaviours for NPC routines and AI outside combat, companions and hirelings, conversation, MudChat, barks, rumours and LLM-driven NPCs."}, {"prefix": "C", "name": "Combat and encounters", "scope": "Fights, boss mechanics, monster AI in combat, encounter spawning, difficulty and scaling, respawns, and death and defeat rules."}, {"prefix": "I", "name": "Items, properties and puzzles", "scope": "Item properties, general-purpose property wrappers, containers, locks, keys, traps, books, transformations and puzzle mechanisms."}, {"prefix": "W", "name": "World systems (time, weather, environment, economy, law)", "scope": "Calendar and clock, weather and climate, environmental hazards, darkness, tides, resets, shops, money and currency, and the legal system."}, {"prefix": "G", "name": "Generators and random content", "scope": "Random area and room generation, generated content in scripts, loot tables, affixes, theme packs and name generators."}, {"prefix": "CR", "name": "Crafting, gathering and housing", "scope": "Crafting and gathering skills, recipes, resources, farming, workstations, player-owned property and home storage."}, {"prefix": "F", "name": "Factions and organisations", "scope": "Clans and guilds run by NPCs, ranks, dues, diplomacy, conquest, faction effects and display, reputation and deities."}, {"prefix": "T", "name": "Travel, vehicles and instances", "scope": "Ships, mounts, ferries and other transport, routes, fares, travel time, fast travel, and instanced or resetting dungeons."}, {"prefix": "L", "name": "Languages and vocabulary", "scope": "Invented languages and how they are heard, read and learned, rule files, lists, socials, help files and the words the world uses."}, {"prefix": "P", "name": "Characters, progression and custom abilities", "scope": "Character creation, starting kits, levelling, training and teachers, achievements, ranks, ageing, races, classes and GenAbility-style custom abilities and diseases."}, {"prefix": "PR", "name": "Presentation", "scope": "What the player sees: conditional and first-visit text, details and senses, ambient lines, maps, lore codex, journal, narration, prompt, screens and colours."}, {"prefix": "S", "name": "Saves and world files", "scope": "What survives a save and restore, what content lives in world/ (resources overlay, world.ini, clans, cron), save rules, and the format of world files."}, {"prefix": "B", "name": "Builder tools", "scope": "Commands and editors for building in builder mode: tracking and protecting changes, reload, undo, editing, digging, mass changes, macros and sandbox."}, {"prefix": "DT", "name": "Testing and debugging tools", "scope": "Checkers and lints, inspectors, tracing and error display, playtest and developer modes, simulators and automated content tests."}], "items": [{"id": "ST1", "theme": "ST", "title": "Register LOGIN, LEVEL, LOGOFF and CHANNEL triggers when the script loads", "kind": "script trigger", "value": "high", "effort": "small", "body": "**Today.** `LOGIN_PROG`, `LEVEL_PROG` and `CHANNEL_PROG` register their host for world-wide events only inside `executeMsg`, so only after the host has heard some other message. A login is sent only as a global message, so a quiet room or item misses it. `RESTORE` reboots the engine and clears every registration, so each restore starts from nothing. `LOGOFF_PROG` never registers. It fires only in the rooms of the character who quits and of their group. As a result these triggers fire \"sometimes\". The only workaround is JavaScript calling `CMLib.map().addGlobalHandler`, which needs `JSCRIPTS` approval.\n\n**Add.** When a script is parsed (`getScripts` or `setScript`), register its host at once: LOGIN for `LOGIN_PROG`, LEVEL for `LEVEL_PROG`, QUIT for `LOGOFF_PROG`, CHANNEL for `CHANNEL_PROG`. There is no syntax change. Unregistering mostly comes free, because `sendGlobalMessage` already drops hosts that have left the game. ST5 and ST12 build on this.\n\n**Example.** An inn room with `LOGIN_PROG 100` greets the returning character: \"You wake in the Gilded Goose; the fire has burned low.\" Today it stays silent after a restore unless something has happened in the inn first.\n\n*Note.* `JSCRIPTS=2` already runs every JavaScript block without approval (see *Already possible* in the README), so the `addGlobalHandler` workaround needs no approval. The registration bug stands.\n\n*See also:* ST12, ST2, ST5, ST14 (ST2, ST5 and ST14 fire world-wide through ST12's @GLOBAL, whose hosts are registered at parse time by ST1's change).", "d": "yes", "note": "Absolutely"}, {"id": "ST2", "theme": "ST", "title": "SKILL_PROG: skill learned, improved, mastered or failed", "kind": "script trigger", "value": "high", "effort": "small", "body": "**Today.** Teaching, practising and failing a skill are messages (`EXECMSG_PROG TEACH ALL`, `PRACTICE ALL`, `SKILLFAIL ALL`). Learning is not. Abilities granted on levelling (`CoffeeLevels`) only print \"You have learned...\", `StdMOB.addAbility` sends nothing, and a proficiency gain only prints a line. Mastery is posted to channels flagged PROFICIENT, so a hidden channel plus `CHANNEL_PROG` can catch it, but ST1's registration bug applies. The SKILLPROF and SKILLUSE achievements can award things, and `ISABLE` and `EXPERTISE` can be polled. A mentor NPC cannot react when the player learns a skill.\n\n**Add.** `SKILL_PROG <LEARN|IMPROVE|MASTER|FAIL|ANY> <ability ID or name words|*> [mask on the learner]`. It fires for the learner's scripted items, the room and the area, and anywhere with `@GLOBAL` (ST12). Hooks: the level grants in `CoffeeLevels`, a non-temporary `addAbility`, `StdAbility.helpProficiency` (each gain, and on reaching the maximum) and SKILLFAIL. `$g` is the new proficiency.\n\n**Example.** When the player first learns Fireball, `SKILL_PROG LEARN Spell_Fireball` on the guild area brings the wizard's familiar, who sends them to the Ember Tower. When Lockpicking is mastered, a thieves' guild invitation is loaded into their pack.\n\n*See also:* ST1, ST12, ST5, ST14 (ST2, ST5 and ST14 fire world-wide through ST12's @GLOBAL, whose hosts are registered at parse time by ST1's change); P3 (ST2's SKILL_PROG LEARN and P3's ONLEARN hook both fire when a mob gains an ability, from the same addAbility point).", "d": "yes", "note": "Another must have"}, {"id": "ST3", "theme": "ST", "title": "DISCOVER_PROG: first visit to a room or area", "kind": "script trigger", "value": "high", "effort": "small", "body": "**Today.** The room knows about a first visit: `StdRoom`'s `addRoomVisit` returns true, and visits are kept in player stats across saves. Scripts only get `GREET_PROG`, which fires on every entry and runs after the visit is recorded. The working trick is `CNCLMSG_PROG ENTER ALL` with `IF EXPLORED($n <roomID> == 0)`. It runs before the visit is recorded, but it also fires on moves that are later cancelled. The ROOMENTER, AREAVISIT and EXPLORE achievements give XP, items or titles on discovery, but they cannot run a script or start a quest.\n\n**Add.** `DISCOVER_PROG <ROOM|AREA> [mask]`, fired for the room's and area's scripts when `addRoomVisit` returns true. AREA fires on the first room the character visits in that area. Each party member counts separately. A PARTY option fires once for the group.\n\n**Example.** The first time the player enters the Sunken Cathedral nave, `DISCOVER_PROG ROOM` echoes a long passage about the drowned saints. `DISCOVER_PROG AREA` on the area gives `MPEXP $n 500` and starts the Bells Beneath quest with `MPSTARTQUEST`.\n\n*See also:* PR3, P11 (Three hooks on a character's first entry to a room (a trigger, once-only text, discovery XP) that can share one first-visit flag).", "d": "yes", "note": ""}, {"id": "ST4", "theme": "ST", "title": "Weather and moon changes as messages and triggers", "kind": "script trigger, JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** A change of weather sends no message. `DefaultClimate` only tells each player under the sky (`mob.tell`). `TYP_WEATHER` is weather damage from `WeatherAffects`, not a change of weather. Dawn and dusk in `DefaultTimeClock.handleTimeChange` work the same way. So `EXECMSG_PROG`, faction rules and JavaScript cannot see these changes. Builders poll `ISWEATHER`, `ISTIME` or `ISMOON` from `RAND_PROG` or `DELAY_PROG` and keep the last value in a variable. Fixed hours already work, since `TIME_PROG` fires on any object.\n\n**Add.** Area-wide messages, sent to the area and its rooms: WEATHERCHANGE (old, new, forecast) from `weatherTick` and `forceWeatherTick`, and TODCHANGE (DAWN, DAY, DUSK, NIGHT) and DATECHANGE (day, month, season, year) from the clock. Two triggers for mobs, items, rooms and areas: `WEATHER_PROG <new|ANY> [<old>]`, with `$g` the new weather and `$G` the old, and `MOON_PROG <phase>`. When a restore puts the saved weather back, nothing fires. Triggers for the time of day, season, month and weekday are ST11.\n\n**Example.** A fisherman with `WEATHER_PROG THUNDERSTORM` says \"Storm's coming!\" and walks home. A werewolf with `MOON_PROG FULL` uses `MPAFFECT` to shape-change himself.\n\n*See also:* ST11, JS8 (ST4's dawn, dusk and date-change messages and ST11's calendar triggers hook the same clock transitions, which JS8's hour, day and weather events also need).", "d": "yes", "note": ""}, {"id": "ST5", "theme": "ST", "title": "QUEST_PROG: quest start, accept, step, win, fail and end, anywhere", "kind": "script trigger, quest feature", "value": "high", "effort": "medium", "body": "**Today.** `QUEST_TIME_PROG <quest|*> -1` fires on each step and `-2` at the end. It reaches only the objects the quest registered (given scripts and behaviours, quest mobs), plus the player's tracking script on `MPENDQUEST $n` and `QUESTS DROP`. The -1 and -2 codes are not in the help. `MPQUESTWIN` and `MPENDQUEST` send `TYP_WINQUEST` and `TYP_ENDQUEST` globally, but nothing listens for them. A quest starting or timing out sends nothing globally. Only the plain countdown form, `QUEST_TIME_PROG <quest> <minutes left>`, works on any scripted object: it looks the quest up by name, so an NPC can react a few minutes before a timed quest runs out. For start, win and end, any other NPC has to poll `QUESTWINNER()` or `QVAR` from `RAND_PROG`.\n\n**Add.** `QUEST_PROG <START|ACCEPT|STEP|WIN|FAIL|END|ANY> <quest|*> [detail]`, registered globally (ST1). STEP takes a step number or label. END takes WON, FAILED, EXPIRED, STOPPED or DROPPED. `DefaultQuest` sends the event on every path: `startQuestInternal`, `acceptQuest`, `stepQuest`, `declareWinner`, `stopQuestInternal` (FAIL when the quest stops without a winner), tick expiry and `MODIFY QUEST STOP`, plus the existing win and end messages. `$n` is the winner if there is one, `$g` the quest name, `$0` the step or outcome. Also document the -1 and -2 codes.\n\n**Example.** The town crier has `QUEST_PROG WIN goblin_raid` with `MPECHO The crier shouts that $n drove off the goblins!`. The innkeeper has `QUEST_PROG END goblin_raid EXPIRED`: the stables burned, so the inn is closed tonight.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST1, ST12, ST2, ST14 (ST2, ST5 and ST14 fire world-wide through ST12's @GLOBAL, whose hosts are registered at parse time by ST1's change); Q4, Q11, JS18 (Quest outcome hooks overlap: ST5's QUEST_PROG FAIL and END EXPIRED, Q4's QUESTFAIL_PROG, Q11's QUESTTIMEOUT_PROG, and JS18's onQuestFail and onQuestEnd in JavaScript); Q9, SC9 (Q9, SC9 and ST5 each ask to document MPSTEPQUEST or QUEST_TIME_PROG's -1 and -2 codes; write it once).", "d": "yes", "note": ""}, {"id": "ST6", "theme": "ST", "title": "GAME_PROG and TURN_PROG: new game, save, restore, switch, pause and turns", "kind": "script trigger, script function, JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** A new game, a restore, `SWITCH` and `PARTY ADD` all send LOGIN, so `LOGIN_PROG` cannot tell an intro from a reload. `CHARCREATIONSCRIPTS` in `coffeemud.ini` runs scripts at three stages: END (after a new character is made), CHARLOGIN, and ALLCHARLOGIN (also on `SWITCH`). They run on a throwaway engine, only `ONCE_PROG` fires, and the character is briefly in a random room. Save, restore, pause and time mode reach no script, and no function reports the game's mode. `DELAY_PROG` already counts turns in turn-based time.\n\n**Add.** `GAME_PROG <NEWGAME|RESTORE|SAVE|NEWCHAR|SWITCHTO|SWITCHFROM|PAUSE|RESUME|TIMEMODE|ANY> [mask]`, registered globally and fired from `SaveGame`, `CharCreation`, `Switch`, `GameTime` and `TimeMode`. SAVE runs before the snapshot, so variables it sets are saved, and `RETURN CANCEL` refuses the save with the script's message. `$n` is the character, `$g` the event or save slot. `TURN_PROG [pct]` fires once per party turn in the leader's area. Functions: `ISTURNBASED()`, `ISPAUSED()`, `ISBUILDER()`, `ISDEV()`, `SAVESLOT()`, `GAMETIME()`. JavaScript gets the same events. Then either document `CHARCREATIONSCRIPTS` or retire it. Party events are ST10.\n\n**Example.** The world's parent area has `GAME_PROG NEWGAME`, which plays the intro and loads the old sage beside the player. His `GAME_PROG RESTORE` recaps: \"Last time, you had found the silver key.\" In the Labyrinth, `GAME_PROG SAVE` refuses: \"The maze will not let you rest here.\"\n\n**Also merged here, from ST23 (TURN_PROG: once per player turn).** TURN_PROG [every N] [mask]. In turn-based time, it fires at the end of each party turn (Party.afterLeaderActs and passTurn, through endTurn). In real time, it fires after each player command that takes time. $g is the turn count since the game began, kept in the save. Optionally, a function TURNS() reads the count.\n\n**Also merged here, from ST28 (World scripts and game lifecycle triggers).** At boot, world/scripts/*.script are loaded onto a world host. It is a hidden object, with the fixed variable host WORLD, that ticks every tick wherever the player is. New triggers, usable on any host: NEWGAME_PROG, RESTORE_PROG, SAVE_PROG, and PARTY_PROG JOIN|LEAVE|SWITCH|LEAD.\n\n**Also merged here, from JS4 (World lifecycle hooks in world/js/init.js).** If world/js/init.js exists, the engine calls whichever of these functions it defines: onBoot(), onNewGame(player) (first start only), onRestore(player, slot), onBeforeSave(slot), onPlayerEnter(player), onSwitch(fromChar, toChar), onPartyChange(leader) and onBuilderStart(builder). They are called from SaveGame.afterBoot, save and playerLoggedIn, on the game thread, with `cm` and the time limit.\n\n*See also:* JS8 (JS8's save, restore and turn() events repeat ST6's lifecycle and turn events (with JS4 (now in ST6) and ST23 (now in ST6) merged into ST6)); ST10 (ST28 (now in ST6)'s PARTY_PROG JOIN|LEAVE|SWITCH|LEAD is ST10's party trigger); SC2 (Both add a GAMETIME() function; define it once); DT5, DT18 (ST6 adds ISDEV() and ISBUILDER(), DT5 adds ISDEV() and DT18 adds ISBUILDER(); add each once); S2 (Both make SAVE refusable (a GAME_PROG SAVE returning cancel, or save rules), which needs one check in Save.execute); W28 (ST6's ISTURNBASED() is the missing time-mode function that W28's Today names for restoring the player's mode).", "d": "yes", "note": ""}, {"id": "ST7", "theme": "ST", "title": "VERB_PROG: verbs on objects that win over skills and socials", "kind": "script trigger, property, builder tool", "value": "high", "effort": "medium", "body": "**Today.** `CMDFAIL_PROG` fires only when the word matches nothing else, and it matches any prefix, so typing `T` fires a TURN trigger. The parser tries commands first, then skills, then socials, so TURN WHEEL makes a cleric turn undead. LIGHT, SEARCH and CLIMB are skills, and PRAY and POKE are socials. `CREATE COMMAND TURN` adds a verb that wins over them, but it is global and cannot pass the line to the wheel's own script. `Prop_Socials` on rooms and exits only covers words that reach HUH.\n\n**Add.** `VERB_PROG <verb[,alias...]> [p] [keywords]` on items, exits, mobs and rooms. It is checked before command lookup, for objects within reach. It fires when the rest of the line names the object, or when the trigger needs no object. `$t`/`$i` is the object and `$g` the rest of the line. Returning `continue` hands the line back to normal parsing. Verbs match exactly. Also add `Prop_Verbs` (`VERBS=\"turn,rotate\" MSG=...`) for flavour without a script, and `LIST VERBS` in builder mode. A cheaper first step: make `CMDFAIL_PROG` match whole words, and let a GenCommand forward to the target's trigger.\n\n**Example.** A ship's wheel with `VERB_PROG turn,spin p wheel` changes the heading. TURN WHEEL turns the wheel; a bare TURN still turns undead.\n\n*See also:* I9, I19 (All three let an object's own verb (TURN, PULL, PUSH) win over stock commands and skills; one parser hook serves them); JS20 (JS20's cm.verb is a JavaScript form of ST7's VERB_PROG local verbs).", "d": "yes", "note": ""}, {"id": "ST8", "theme": "ST", "title": "Vessel triggers: board, disembark, sail, arrive and dock", "kind": "script trigger, JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** Boarding is an ENTER into the deck room, so a `GREET_PROG` on the deck or interior area sees it, but the vessel item does not. A ship moves through a temporary mob named after it. An `ENTRY_PROG` on the ship fires for every ENTER it hears and has to test `NAME($n)==NAME($i)`. That mob is destroyed right after the move, so `$n` is unreliable in queued responses. `ARRIVE_PROG` does not fire for ships, the deck hears nothing of the arrival, and anchoring sends no event. Steering is `MSG_NOISYMOVEMENT`, which `EXECMSG_PROG` can match.\n\n**Add.** Triggers for the vessel item, its rooms and crew, and outside rooms, with a stable `$i` (the vessel) and `$r`: `BOARD_PROG [mask]` and `DISEMBARK_PROG [mask]` (`$n` is the person); `SAIL_PROG <COURSE|ANCHOR|STEER|ALL>` (`$n` is the helmsman, `$t` the order); `VESSEL_ARRIVE_PROG <room id|area|mask>` on the vessel and crew, with `$r` the room entered; `VESSEL_GREET_PROG` on any room a vessel enters; and `DOCK_PROG` when the anchor drops or the brake is set in a seaport or drivable room. The JavaScript engine gets the same events.\n\n**Example.** The ferry captain has `VESSEL_ARRIVE_PROG Port Azure#1`, which echoes \"Port Azure! All ashore!\" and runs `MPFORCE $i lower anchor`. The harbour room's `VESSEL_GREET_PROG all` sends the harbour master to meet the player's ships.\n\n*See also:* W4 (ST8's DOCK_PROG and T1 (now in W4)'s WAIT UNTIL DOCK both need an event when a vessel stops or anchors in a port).", "d": "yes", "note": ""}, {"id": "ST9", "theme": "ST", "title": "CLAN_PROG, and entry and exit scripts on every membership change", "kind": "script trigger, JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** There is no clan trigger, and `DefaultClan.addMember` and `delMember` send nothing. A government's `ENTRYSCRIPT` and `EXITSCRIPT` run only from CLANAPPLY, CLANACCEPT, CLANEXILE and CLANRESIGN, not from `MPSETCLAN` or a GuildMaster. Conquest news (\"X gains control of Y\") goes to channels flagged CONQUESTS. This fork's INFO channel keeps that flag, so `CHANNEL_PROG` can match the text, though that is fragile. Adding CLANINFO to INFO in `coffeemud.ini` would expose declarations and auto-promotions the same way.\n\n**Add.** `CLAN_PROG <JOIN|LEAVE|PROMOTE|DEMOTE|EXILE|RELATION|CONQUER|LOSEAREA|LEVEL|DUESLATE|ALL> [clan name|ALL]`. It fires on scripts in the member's room, the clan's recall room and the affected area. `$n` is the member, `$t` the other clan or area, `$v` the new rank or state. JavaScript gets the same event. `addMember` and `delMember` run the entry and exit scripts, so `MPSETCLAN` and a GuildMaster act like CLANACCEPT. A government's `<EVENTSCRIPT>` receives every event of its clans.\n\n**Example.** When the player is promoted to Shadow, the guildmaster congratulates them and unlocks the vault door. When the Orc Horde takes Millbrook, the innkeeper switches to occupation dialogue and the militia goes into hiding.\n\n*See also:* F2, F3, F9, F10, F16, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts).", "d": "yes", "note": ""}, {"id": "ST10", "theme": "ST", "title": "PARTY_PROG and party functions", "kind": "script trigger, script function", "value": "medium", "effort": "small", "body": "**Today.** `PARTY ADD` and `REMOVE` change following directly. The only trace is the echo \"<S-NAME> join(s) <T-YOUPOSS> party.\", which an `ACT_PROG` in the same room can match. Handing over the lead, resting and bringing a member in send nothing. Masks already test the party: `+GROUPSIZE 4` works as a trigger's chance (`GREET_PROG +GROUPSIZE 4`) or in `ISLIKE`, and `+FOLLOW`, `ISFOLLOW` and `$f` test the leader. NPC followers send FOLLOW and NOFOLLOW, which `EXECMSG_PROG` catches. No function returns a count.\n\n**Add.** `PARTY_PROG <JOIN|LEAVE|REST|LEAD|SWITCH|ANY> [mask]`, fired globally from `PartyCmd` join and remove, `Party.rest`, `handOver` and `bringIn`. `$n` is the member, `$t` the leader. New functions `PARTYSIZE($n)`, `INPARTY($n $t)` and `PARTYLEADER($n)`, and `$%PARTY($n)%` for the member names.\n\n**Example.** A hired mercenary has `PARTY_PROG JOIN` with \"Coin first, questions later.\" When he leaves, his rival at the tavern remarks on it. A bridge troll's `GREET_PROG` uses `IF PARTYSIZE($n) > 3` to charge a toll per head.\n\n*See also:* ST6 (ST28 (now in ST6)'s PARTY_PROG JOIN|LEAVE|SWITCH|LEAD is ST10's party trigger); SC8 (Both add PARTYSIZE, INPARTY, PARTYLEADER and $%PARTY%; build the functions once).", "d": "yes", "note": ""}, {"id": "ST11", "theme": "ST", "title": "Calendar triggers: named times of day, ranges, season, month, year, weekday", "kind": "script trigger, script function", "value": "medium", "effort": "small", "body": "**Today.** `TIME_PROG` takes hour numbers only. Each argument goes through `CMath.s_int`, so `TIME_PROG DAWN` reads as hour 0 and fires at midnight. `DAY_PROG` is the day of the month only, and neither trigger takes ranges. Nothing fires on a new season, month, year or weekday, so builders poll `ISTIME`, `ISSEASON`, `ISMONTH`, `ISYEAR` or `DATETIME` and keep a variable. A quest can already start on a game date (`SET DATE MUDDAY`). The clock has weekday names (`getWeekNames`), but no function tests the weekday.\n\n**Add.** `TIME_PROG` accepts DAWN, DAY, DUSK and NIGHT, taken from the area clock's own hours, and ranges with steps (`TIME_PROG 6-18/3`). `DAY_PROG` takes ranges too. New triggers, each fired once on the transition from `handleTimeChange`, `bumpDays` and `bumpMonths`, for scripts in areas on that clock: `SEASON_PROG <SPRING|SUMMER|FALL|WINTER|ANY>`, `MONTH_PROG <numbers or names>`, `YEAR_PROG <year|ANY>` and `WEEKDAY_PROG <day names>`. Plus an `ISWEEKDAY` function.\n\n**Example.** A fey glade with `SEASON_PROG SPRING` loads blossoms and unlocks a hidden exit. The town crier announces the market with `WEEKDAY_PROG Sunday`. The vampire's crypt uses `TIME_PROG DUSK` to `MPUNHIDE` him.\n\n*See also:* ST4, JS8 (ST4's dawn, dusk and date-change messages and ST11's calendar triggers hook the same clock transitions, which JS8's hour, day and weather events also need); SC2 (Both add weekday tests on the area calendar (ISWEEKDAY, WEEKDAY())).", "d": "yes", "note": ""}, {"id": "ST12", "theme": "ST", "title": "@GLOBAL modifier for EXECMSG_PROG, DEATH_PROG and KILL_PROG", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** The engine broadcasts several categories world-wide: DEATH, LEVEL (gain and loss), LOGIN, QUIT, LEGALWARRANT, LEGALSTATE, WINQUEST and ENDQUEST. Scripts hear them only through `LOGIN_PROG`, `LEVEL_PROG` and `CHANNEL_PROG`. Deaths can already be heard everywhere. `DEATH_PROG` and `KILL_PROG` on a room, area or item fire for every death the host hears, and area messages rise to parent areas, so one parent area over all areas hears every death. These triggers take no arguments, so the filtering goes in the body (`IF ISLIKE($n '<mask>')`). Warrants, legal state, quest wins and ends, and level loss reach no script.\n\n**Add.** An `@GLOBAL` first argument: `EXECMSG_PROG @GLOBAL DEATH ALL`, `DEATH_PROG @GLOBAL -RACE +Goblin`, `KILL_PROG @GLOBAL`. The host is registered for that category when the script is parsed (ST1). `DEATH_PROG` and `KILL_PROG` also take a mask. This pairs with the proposed functions that read a message's details.\n\n**Example.** A bounty-board NPC in the capital has `DEATH_PROG @GLOBAL -NAME +*bandit*`. It counts each kill in a variable and pays the killer on their next visit.\n\n*See also:* ST1, ST2, ST5, ST14 (ST2, ST5 and ST14 fire world-wide through ST12's @GLOBAL, whose hosts are registered at parse time by ST1's change); JS8 (Both expose the engine's world-wide broadcasts (DEATH, LEVEL, WINQUEST, LEGALWARRANT and so on) to scripts, ST12 in MOBPROG and JS8 in JavaScript); SC5 (SC5's MSG() functions are the message-detail reads that ST12 says it pairs with).", "d": "yes", "note": ""}, {"id": "ST13", "theme": "ST", "title": "CRAFT_PROG and RECIPE_PROG", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** Crafting sends ITEMGENERATED in the room, ruined results included, and learning a recipe sends RECIPELEARNED. Much already works. `EXECMSG_PROG ITEMGENERATED =O CLASS=Weaponsmithing` on a room, area or carried item fires for that one skill. The product is `$t`, `IF STAT($t CLASS == GenRuinedItem)` spots a ruined one, and `LEVEL($t)` works. The CRAFTING achievement counts items by skill. But the `=O` test names one skill per trigger, no variable gives the skill when matching ALL, the product itself hears nothing, and none of this is documented.\n\n**Add.** `CRAFT_PROG <skill ID|*> <item words|ALL> [RUINED|SUCCESS]` and `RECIPE_PROG <skill ID|*> <recipe words|ALL>`. `$o` is the item made, `$g` the skill ID, `$n` the crafter. They fire on the crafter's scripted items, the room, the area and the item. A smaller option: a function for the message's tool (`MSGTOOL()`) and a documented recipe.\n\n**Example.** The Dwarven Forge room has `CRAFT_PROG Weaponsmithing ALL SUCCESS`. The master smith appraises the blade and gives a rune if its level is above 20. A ruined attempt makes the apprentice snicker.\n\n*See also:* P21 (ST13's CRAFT_PROG and P21's ONCRAFTED and ONFAILED skill scripts are alternative hooks on the same crafted or ruined item).", "d": "yes", "note": ""}, {"id": "ST14", "theme": "ST", "title": "FACTION_PROG: faction change and range crossing", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** A faction change is a FACTIONCHANGE message, sent only to the source's room. The faction id is in the message text and the amount in its value, and scripts can read neither. Faction files already react to ranges. REACTION entries give an ability, a behaviour (Scriptable included) or a command to mobs in the same room as a character in a named range. AFFBEHAV works on monsters only. Masks take `-FACTION +RANGE`, `FACTION()` reads the range, and ANNOUNCE posts to FACTIONANNOUNCEMENTS channels, which `CHANNEL_PROG` can hear. Nothing fires when a character enters a range, and nothing reports a change made elsewhere.\n\n**Add.** `FACTION_PROG <faction ID> <range name|ANY|UP|DOWN> [mask]`, fired after the change on scripts in the room and area, and anywhere with `@GLOBAL` (ST12). It fires on any change, or only on entering the named range, which `DefaultFaction` finds by comparing the range before and after. `$g` is the new range name, `$G` the amount.\n\n**Example.** When the player's standing with the Thieves' Guild enters Trusted, a fence in another district unhides the back-room exit (`FACTION_PROG thieves.ini Trusted` with `@GLOBAL`). When it drops to Hated, guild assassins are loaded on the road.\n\n*Note.* A `<SCRIPT>` block in a `CNCLMSG_PROG FACTIONCHANGE` can already read the faction id and the amount from the live message, `objs()[0]` (see *Already possible* in the README). What this item adds is the plain MOBPROG trigger.\n\n*See also:* ST1, ST12, ST2, ST5 (ST2, ST5 and ST14 fire world-wide through ST12's @GLOBAL, whose hosts are registered at parse time by ST1's change); F6, JS8 (All three need DefaultFaction to report a change and a band crossing beyond the source's room (FACTION_PROG, live band effects, a JS factionChange event)).", "d": "yes", "note": ""}, {"id": "ST15", "theme": "ST", "title": "COMBAT_PROG: combat start, end and flight", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** `FIGHT_PROG` fires on every combat tick. So a line said once at the start of a fight needs `FIGHT_PROG 100` (or `HITPRCNT_PROG 100`) with a tattoo or variable, which a `RAND_PROG` testing `!ISFIGHT($i)` clears later. (`MPNOTRIGGER FIGHT_PROG <ms>` can mute it instead, but only for a fixed time, and it mutes every `FIGHT_PROG` in that script.) Flight can be caught with `EXECMSG_PROG FLEE ALL`, victory with `KILL_PROG`, defeat with `DEATH_PROG`. A fight that ends with both sides alive (a flee, `MPSTOP`, peace, the foe leaving) sends no combat-ended message. Only whatever caused it can be seen: the FLEE or LEAVE message, or the peace spell. `MPSTOP` sends nothing.\n\n**Add.** `COMBAT_PROG <START|END|FLEE|ANY> [mask on the opponent]`, triggered when the state changes: `isInCombat` is compared between ticks, and FLEE messages are watched. This covers the proposed ENGAGE_PROG, DISENGAGE_PROG and FLEE_PROG. START fires once, with `$n` the first opponent. END fires when combat stops with both sides alive. FLEE fires when an opponent flees, with `$n` the one fleeing. It works on mobs, on items whose owner fights, and on rooms for any fight inside them. WIN and LOSE would repeat `KILL_PROG` and `DEATH_PROG`, so at most they are aliases. JavaScript gets the same events.\n\n**Example.** The vampire's `COMBAT_PROG START` echoes \"The candles gutter out\" and darkens the room with `Prop_RoomDark`. His `COMBAT_PROG FLEE` says \"You cannot run from me forever...\" and gives him `MOBHunter` with `MPBEHAVE`.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* C3, C21 (C3's ONENGAGE and rearm and C21's reset need the combat start and end detection that ST15 adds).", "d": "yes", "note": ""}, {"id": "ST16", "theme": "ST", "title": "Area border triggers and an area entry banner", "kind": "script trigger, property", "value": "high", "effort": "small", "body": "**Today.** On an area, `GREET_PROG` and `ALL_GREET_PROG` fire on every ENTER into any of its rooms, so every move inside the area counts. `ENTRY_PROG` needs the host to be the target, and `EXIT_PROG` compares against the last known room, so neither fires at the border. No variable holds the previous room. The workaround is `CNCLMSG_PROG ENTER ALL` on the area, with `IF INAREA($n == 'Haunted Marsh')` checked before the move. It also fires on cancelled moves, and catching a departure needs scripts on the neighbouring areas or a parent area. There is no entry banner.\n\n**Add.** `AREA_ENTER_PROG` and `AREA_LEAVE_PROG [pct|mask]`, which fire only when the old and new rooms are in different areas. ENTER also fires on a login or restore into the area. An ALL option makes moves between parent and child areas count too. `$n` is the mover, `$r` the room crossed from or to, and `$g` the other area's name. A property, `Prop_AreaBanner(TITLE=\"...\" TEXT=\"...\" ONCE|EACH MASK=...)`, shows a styled banner and the area's description on entry and marks the area explored.\n\n**Example.** Crossing into the Haunted Marsh shows \"THE HAUNTED MARSH: mist clings to the reeds...\" the first time. `AREA_ENTER_PROG 100` starts a fog with `MPAFFECT Spell_Fog`, and `AREA_LEAVE_PROG` removes it: \"The marsh's chill releases you.\"\n\n**Also merged here, from PR4 (Area entry and exit text: Prop_AreaEntry and AREAENTER_PROG).** `Prop_AreaEntry` on areas takes `ENTER=`, `FIRST=` (first time per character), `LEAVE=`, `SHOWNAME` (the area name as a banner), `MASK=` and `COLOR=`. It fires only when the previous room was in another area. Two script triggers go with it: `AREAENTER_PROG` and `AREAEXIT_PROG`. `$n` is the mover and the other area is the argument. Fix `Prop_Sounder` on areas at the same time.", "d": "yes", "note": ""}, {"id": "ST17", "theme": "ST", "title": "LEVEL_PROG for level loss, with the new level in $g", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** LEVEL_PROG fires on gains only. A level loss is sent only globally, so no script hears it, unless the builder adds a hidden LOSTLEVELS channel and uses CHANNEL_PROG. The trigger runs before the level is applied: LEVEL($n) still reads the old level and $g is empty. A host in the same room can get the message twice, once globally and once from the room, because LEVEL_PROG lacks the lastMsg check that GET_PROG has.\n\n**Add.** LEVEL_PROG [GAIN|LOSS|ANY] [pct|mask]. GAIN stays the default, as today. The new level goes in $g and the class in $G. A message already handled is skipped. A bug that fills every local variable with the trigger array is fixed. Optionally, a CLASSLEVEL variant for multi-class levels.\n\n**Example.** The old mentor has LEVEL_PROG GAIN with IF EVAL($g == 10), and MPOLOADs a sealed letter for $n. A cursed shrine has LEVEL_PROG LOSS and taunts the player when its drain costs a level.\n\n*See also:* SC14 (Both fix LEVEL_PROG filling every local variable with the trigger array).", "d": "yes", "note": ""}, {"id": "ST18", "theme": "ST", "title": "Fix RIDE_PROG; add DISMOUNT_PROG and REMOVING_PROG", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** RIDE_PROG is a copy of RIDING_PROG: both fire only when the scripted host does the mounting. So a scripted horse, raft or carriage never learns it was mounted, though Scriptable.html says it should. Dismounting has no trigger. REMOVE has no -ING form, unlike GET, DROP, PUT, WEAR and GIVE. The workaround is EXECMSG_PROG MOUNT ALL and DISMOUNT ALL on the rideable, but their keywords match the player's typed command.\n\n**Add.** Fix RIDE_PROG, a one-line change. It then fires when anyone mounts the scripted rideable, or any rideable for a room or area host; $n is the rider and $i the rideable. RIDING_PROG stays for the host's own mounting. DISMOUNT_PROG (TYP_DISMOUNT) works the same way for getting off. REMOVING_PROG fires when the scripted mob removes something.\n\n**Example.** The ferryman's raft has RIDE_PROG ALL. It echoes 'The raft lurches; the ferryman pushes off', then uses MPTRANSFER after 3 ticks. A warhorse throws riders who lack the HORSEFRIEND tattoo. The griffon's DISMOUNT_PROG sends it back to its roost.", "d": "yes", "note": ""}, {"id": "ST19", "theme": "ST", "title": "READ_PROG for books, signs and inscriptions", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** Reading sends a READ message, and only EXECMSG_PROG and CNCLMSG_PROG catch it. LOOK_PROG fires on looking, not reading. CNCLMSG_PROG READ ALL on a book works now: it can MPECHOAT $n the right page, keep the page in a variable and RETURN CANCEL the default text. But it does not check that the host is the item being read, and its keywords match the typed command. So a book in a room also answers reads of other items, unless filtered with '=T NAME=a leather diary'.\n\n**Add.** READ_PROG [item words|P phrase|ALL]. It matches the item's name as LOOK_PROG does, with $o the item and $n the reader. It fires on the item, its holder, the room and the area. RETURN CANCEL replaces the default text. Until then, the guide should document the CNCLMSG_PROG pattern.\n\n**Example.** The diary has READ_PROG ALL. IF VAR($n diary_page) < 3, it echoes the next page and increments the variable. The last page reveals the vault code (MPSETVAR) and steps the quest (MPSTEPQUEST).\n\n*See also:* I3 (I3's paged books fire a READ_PROG <page>, the trigger ST19 adds).", "d": "yes", "note": ""}, {"id": "ST20", "theme": "ST", "title": "GENERATED_PROG after a generator runs", "kind": "script trigger, script function and generator", "value": "medium", "effort": "small", "body": "**Today.** Nothing fires when a generator finishes. A builder cannot rename the deepest room, put a catalog NPC in a leaf room, or set a quest variable to the dungeon's name. The workaround is a Scriptable behaviour on the template's AREA tag, with LOAD=progs/crypt_post.script and a ONCE_PROG. The script must be in a file, because $ in template parms means a template variable. It runs only once the area starts ticking, possibly after the player arrives. The generator's variables are thrown away after the run.\n\n**Add.** When fillInArea or postProcess completes, a GENERATED message goes to the area and to each room, mob and item built. GENERATED_PROG [pct] catches it, with $i the area and $g the generator id. GENVAR(<area> <name>) reads the generator's variables, such as $__boss or AREA_MAXDEPTH. An AREA attribute onGenerate=\"<script or LOAD=file>\" attaches a script for one run.\n\n**Example.** After the crypt generates, its GENERATED_PROG finds the deepest room with an MQL SELECT. It MPOLOADs the catalog item 'Bone Crown' there, and sets the quest variable crypt_name for the priest's quest text.\n\n*See also:* G14 (G14 runs ST20's GENERATED_PROG after re-rolling an area); G3, G9, G15 (G9, G15 and ST20's GENVAR use G3's depth tags (ROOMTAG_DEPTH, AREA_MAXDEPTH)).", "d": "yes", "note": ""}, {"id": "ST21", "theme": "ST", "title": "First and repeat meetings: FIRSTGREET_PROG, REGREET_PROG, MEMORY()", "kind": "script trigger and script function", "value": "medium", "effort": "small", "body": "**Today.** GREET_PROG fires on every entry, so a first-meeting speech repeats unless the builder writes guards. The usual pattern is IF VAR($n HERMIT_MET) == '' then MPSETVAR $n HERMIT_MET 1, and MPSETVAR $n HERMIT_COUNT ++ to count meetings. 'Back after a while' takes a timed tattoo (MPTATTOO $n 7200 SEEN_HERMIT), tested with HASTATTOO. Exact days need DATETIME and MATH. Nothing records the last topic.\n\n**Add.** For each NPC and character, saved with the game: times met, first and last meeting in game time, and the last topic. A meeting counts when the NPC sees the player arrive, as for GREET_PROG, or when they TALK. FIRSTGREET_PROG [pct] fires at the first meeting ever. REGREET_PROG <min game days> [pct] fires when the player returns after at least that long. MEMORY($i $n MET|COUNT|LASTSEEN|DAYSSINCE|LASTTOPIC) reads the record.\n\n**Example.** The hermit's FIRSTGREET_PROG tells the story of the cursed tower. His GREET_PROG says 'Ah, you again.' His REGREET_PROG 30 says 'I thought the tower had swallowed you.'\n\n*See also:* N6 (Both keep a saved per-NPC, per-character record of meetings (times met, first and last game date)); N9 (ST21 counts a TALK as a meeting and keeps the last topic, which N9's TALK command supplies).", "d": "yes", "note": ""}, {"id": "ST22", "theme": "ST", "title": "SOCIAL_PROG: exact names and socials aimed at the mob", "kind": "script trigger", "value": "medium", "effort": "small", "body": "**Today.** SOCIAL_PROG matches a social whose name starts with the given text. The target form can already be chosen through the name: 'SOCIAL_PROG BOW <T-NAME>' fires only for targeted bows, 'SOCIAL_PROG BOW SELF' only for self-bows. But a bare name also catches longer socials. In the stock socials.txt, KNEE matches KNEEL, HI matches HICCUP and MOO matches MOON. To react only to a social aimed at itself, every script needs an IF comparing $t with $i.\n\n**Add.** SOCIAL_PROG [EXACT] [ME] <name>. EXACT matches the whole first word only. ME fires only when the social targets the scripted mob. $0 holds the full social name and $t the target. Without these options it behaves as today. The SELF, OTHER, NONE and ANY modes the audit proposed are left out, because the target forms already cover them.\n\n**Example.** A queen has SOCIAL_PROG EXACT ME KNEEL. She answers 'Rise, loyal one.' only when the player kneels to her, not to the steward.", "d": "yes", "note": ""}, {"id": "ST24", "theme": "ST", "title": "EVERY_PROG: saved game-time timer that catches up", "kind": "script trigger", "value": "medium", "effort": "medium", "body": "**Today.** DELAY_PROG counts the host's ticks in game time, but its countdown is not saved. It also stops when the host does not tick, as for an item carried in a room with nobody in it. DAY_PROG and TIME_PROG follow the area calendar, so 'DAY_PROG 1 8 15 22' gives a rough weekly restock. MPALARM timers are lost on restore. Cron jobs run on the real clock and ignore PAUSE and turn-based time. They are kept as journal entries, not world content. Nothing catches up on missed intervals.\n\n**Add.** EVERY_PROG N [HOURS|DAYS|WEEKS|MONTHS] [CATCHUP], timed on the host area's game clock. The next fire time is stored in the save. With CATCHUP, it fires once for each missed interval, or once with the number missed in $g. Ideally it shares its saved state with a saved ONCE_PROG. Optionally, CMJournals cron intervals move to GameTime as well.\n\n**Example.** The caravan room has EVERY_PROG 7 DAYS CATCHUP. It restocks the trader (MPOLOADSHOP) and echoes 'A caravan rolls in from the east.' After three game weeks in the dungeon, the trader's stock reflects them.\n\n*See also:* S7 (ST24 wants its saved next-fire time to share S7's saved script state (ONCE, DELAY, alarms)); S21, JS19 (Three ways to run something on a game-clock interval that survives saves; ST24 also suggests moving cron to GameTime, which is S21); N8 (Both catch up on time that passed while a host or area was not ticking (catchUp(elapsedTicks) vs EVERY_PROG CATCHUP)).", "d": "yes", "note": ""}, {"id": "ST25", "theme": "ST", "title": "VAR_PROG: react when a variable meets a condition", "kind": "script trigger", "value": "medium", "effort": "medium", "body": "**Today.** World flags such as 'bridge repaired' or 'king dead' live in MPSETVAR variables. setVar writes the variable map and notifies nothing, and no trigger watches a variable. So every NPC that cares polls IF VAR(...) from RAND_PROG or DELAY_PROG, and keeps its own 'already reacted' variable.\n\n**Add.** VAR_PROG [host|*GLOBAL*|quest name] [var name] [== != > < >= <=] [value]. It fires once when the condition becomes true after a change by MPSETVAR, MPLOADVAR, the JavaScript setVar() or a quest's script. (MPARGSET writes no variables: it only sets the $0-$9, $n, $i, $t, $o, $p and $g slots.) It does not fire again while the condition stays true. setVar notifies a small watch list kept by variable name. $g is the new value and $0 the old. ($G already means the same message as $g in its original case, so it cannot carry the old value.)\n\n**Example.** The player repairs the bridge (MPSETVAR *GLOBAL* bridge_fixed 1). The ferryman has VAR_PROG *GLOBAL* bridge_fixed == 1, so he grumbles about lost business. The toll keeper on the far side MPGOTOs his post.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* W7 (W7's ONVAR transitions (and W19's) need the variable-change notice that ST25 adds to setVar).", "d": "yes", "note": ""}, {"id": "ST26", "theme": "ST", "title": "AFFECT_PROG: effect added or worn off", "kind": "script trigger", "value": "medium", "effort": "medium", "body": "**Today.** Adding an effect (addEffect) and ending one (StdAbility.unInvoke, delEffect) send no message. Only casting is visible, to CAST_PROG and CASTING_PROG. A disease, poison, curse or potion applied without a cast is invisible to scripts, and so is every wear-off. Builders poll AFFECTED($n Disease_Lycanthropy) from RAND_PROG with a state variable. The EFFECTSHAD achievement counts effects but cannot run a script.\n\n**Add.** AFFECT_PROG [ADD|REMOVE|ANY] [ability ID or name words|*]. It fires after an effect is added or removed, on the scripts of the affected host and its room, and for an item also its owner's. $t is the affected object, $g the ability ID and $n the invoker. addEffect and delEffect are hot paths, so the check runs only when the host or room has scripts.\n\n**Example.** When Lycanthropy takes hold, the village elder's AFFECT_PROG ADD Disease_Lycanthropy makes him lock his door (MPLOCK). When the curse wears off the haunted locket, its AFFECT_PROG REMOVE Curse lets the ghost speak.", "d": "yes", "note": ""}, {"id": "ST27", "theme": "ST", "title": "DESTROY_PROG and DECAY_PROG for items", "kind": "script trigger", "value": "medium", "effort": "medium", "body": "**Today.** StdItem.destroy() deletes an item's scripts (delAllScripts) without sending an event, and any queued EXECMSG_PROG response is lost with them. Two cases are covered: eating and drinking fire CONSUME_PROG, and expiry fires CNCLMSG_PROG EXPIRE ALL on the item, before the destroy. Breaking, burning out, junking, MPJUNK, MPPURGE and Decay fire nothing. A quest item lost for good, or a vase breaking, starts nothing.\n\n**Add.** DESTROY_PROG [reason words|ALL]. It fires at once, not queued, in StdItem.destroy before delAllScripts, on the scripts of the item, its room and its owner. Where the caller knows why, $g holds DECAY, BROKEN, CONSUMED or JUNKED. DECAY_PROG is a shortcut for rot and expiry.\n\n**Example.** The Heart of the Mountain gem has DESTROY_PROG ALL. It runs MPENDQUEST 'Heart of the Mountain' and echoes 'The mountain groans...' across the area. The player learns the quest failed, and it does not stall.", "d": "yes", "note": ""}, {"id": "ST29", "theme": "ST", "title": "ACHIEVE_PROG: achievement earned", "kind": "script trigger", "value": "low", "effort": "small", "body": "**Today.** Achievements count many events (KILLS, EXPLORE, CRAFTING, SKILLPROF, QUESTOR, LEVELUP and more). They can award ITEM, MOB, TITLE, ABILITY, EXPERTISE, TATTOO, XP, QP or CURRENCY, but cannot run a script. An earned achievement adds a tattoo named after its ID, so a script can poll HASTATTOO($n WOLFBANE). A grant posts only to channels flagged ACHIEVEMENTS, and the fork removed that flag from INFO. A hidden channel with the flag, plus CHANNEL_PROG, can catch the text.\n\n**Add.** ACHIEVE_PROG [achievement ID|*] [mask]. It fires globally when an achievement is granted, with $n the earner and $g its ID. achievements.ini then works as a declarative event counter, such as 'kill 50 wolves', and the script holds the consequence.\n\n**Example.** An achievement Wolfbane (KILLS 50, -RACE +Wolf). The ranger lodge master has ACHIEVE_PROG Wolfbane and gives the player a wolf-pelt cloak and a title (MPTITLE).\n\n*See also:* P5 (Alternatives for running a script when an achievement is earned: an ACHIEVE_PROG trigger or a SCRIPT reward).", "d": "yes", "note": ""}, {"id": "SC1", "theme": "SC", "title": "Lists in variables: loop, add, remove, shuffle", "kind": "script function and script command", "value": "high", "effort": "small", "body": "**Today.** Space-separated lists half work: `.LENGTH#` counts words, `.n` or `.$0` takes one, `STRIN` tests membership, `$<V>.$%RAND0NUM($<V>)%` picks one at random, and `mpsetvar WORLD V $<WORLD V> cook` appends. But `FOR $0 IN $<WORLD SUSPECTS>` loops once, because `FOR ... IN` splits on commas before it substitutes; the guide's space-separated example has the same fault. Removing a word, de-duplicating, shuffling, sorting or joining need index loops. Tags use commas, words use spaces.\n\n**Add.** `FOR $0 IN LIST <text>`, which substitutes first, then splits on spaces (with quotes), or on commas if there are any. `MPLIST <host> <var> ADD|ADDUNIQUE|DEL|CLEAR|SHUFFLE|SORT <words>` and `$%LISTJOIN(text sep)%`. Readable aliases of today's forms: `LISTHAS`, `LISTCOUNT`, `LISTGET`, `LISTFIND`, `LISTPICK`. One list convention, documented in the guide.\n\n**Example.** A manor mystery: `MPLIST WORLD SUSPECTS ADD cook butler gardener`, the culprit is `$%LISTPICK($<WORLD SUSPECTS>)%`, and `FOR $0 IN LIST $<WORLD SUSPECTS>` hands out alibis.", "d": "yes", "note": ""}, {"id": "SC2", "theme": "SC", "title": "Absolute game time, elapsed time and weekdays", "kind": "script function", "value": "high", "effort": "small", "body": "**Today.** `DATETIME` gives the current hour, day, week, month, season or year; `DATETIME(ALLTIME)` returns 0, and only JavaScript can read `toHoursSinceEpoc`. Timed tattoos (`MPTATTOO $n '450 PLANTED'`, tested with `HASTATTOOTIME`) handle delays, but in ticks the builder converts by hand, and only on mobs. No function gives the weekday (`+WEEK` is the week of the month). The `ISRL*` tests read the computer's clock, which means nothing in a turn-based game.\n\n**Add.** `$%DATETIME(STAMP)%` and `$%GAMETIME(HOURS|DAYS|MONTHS|YEARS)%`, counted from the area calendar's epoch. `$%ELAPSED(<stamp> DAYS)%` and the test `ELAPSED(<stamp> DAYS >= 3)`. `MPSETVAR host var NOW`. `DATETIME(DAYOFYEAR|WEEKDAY)`, `WEEKDAY()` and `ISWEEKDAY(name)`. `$%TICKS(3 DAYS)%` for tattoo durations. Document `ISRL*` as real-world, or add a world option that maps them to game time.\n\n**Example.** A smith runs `mpsetvar $n SWORD_ORDERED NOW`; once `elapsed($<$n SWORD_ORDERED> DAYS >= 3)` he hands over the sword. A market opens only when `ISWEEKDAY(Marketday)`.\n\n*See also:* ST11 (Both add weekday tests on the area calendar (ISWEEKDAY, WEEKDAY())); ST6 (Both add a GAMETIME() function; define it once).", "d": "yes", "note": ""}, {"id": "SC3", "theme": "SC", "title": "Load mobs and items from the catalog", "kind": "script command and quest feature", "value": "high", "effort": "small", "body": "**Today.** `MPMLOAD` and `MPOLOAD` copy a template found by name in the world, or load one from a `.cmare` or generator file. None reads `world/catalog.cmare`, nor do quest `LOAD MOB` and `RandomMonsters`. The workarounds are a hidden storage room of prototypes, which bypasses catalog caps, or a generator file with `class=\"catalog\"`, whose picks freeze after the first call. `MPMLOAD` also clears its template's start room, and its `ALL` keyword loads nothing.\n\n**Add.** A `CATALOG` source: `MPMLOAD CATALOG <name> [count]`, `MPOLOAD CATALOG <name> [INTO <container>]`, and the room and shop forms, setting `$b` to the last copy. The same for quest `load mob|item catalog <name>` and `RandomMonsters` (`catalog:goblin,goblin shaman`). Copies go through `changeCatalogUsage`, so caps and DEVPLAN item 1's rules hold; `FORCE` skips them. Tests `CATALOG(name)` and `$%CATALOGCOUNT(name)%`. Fix `ALL` and the start room.\n\n**Example.** A chieftain's `HITPRCNT_PROG 50` runs `mpmload catalog goblin guard 2`, then `mpforce $b kill $n`. A reward `mpoload catalog the Sunblade` does nothing if the unique Sunblade exists.\n\n*See also:* C4, C9 (All three add a catalog source to RandomMonsters and MPMLOAD (catalog:name, CATALOG= weights); settle one syntax); SC14 (Both fix MPMLOAD clearing its template's start room).", "d": "yes", "note": ""}, {"id": "SC4", "theme": "SC", "title": "Saved variables per object, not per name", "kind": "script command and script function", "value": "high", "effort": "medium", "body": "**Today.** `MPSETVAR` and `VAR` key a mob's or item's variables by its name (`getVarHost`), so every \"a city guard\" shares one `BRIBED` and every \"a lever\" one state. `MPSETINTERNAL SCOPE *` gives each engine its own table, but other scripts cannot read it and a save drops it. `$@i` keys on the Java identity, which changes on every load. Tattoos and `TAGS` are saved per copy, but hold only flags.\n\n**Add.** A per-object host, `@`: `MPSETVAR @$i BRIBED 1`, `VAR(@$t BRIBED == 1)`, `$<@$i BRIBED>`. Values are stored on the object in the `ExtraData` effect, which a save already writes, so they move and die with that copy. `MPSTATE <obj> <name> <value>|CLEAR`, the test `STATE(<obj> <name>)` and JS `state(obj, name[, value])` use the same store. `MPSETINTERNAL VARHOST INSTANCE` makes bare `$i` mean `@$i`. Mob values clear on rejuv unless marked `PERSIST`. The guide explains how this differs from `SCOPE *`.\n\n**Example.** Five gate guards share one script; bribing the east guard opens only his gate. Three goblin archers each count their own arrows.\n\n*See also:* JS7 (Two saved per-object state stores: SC4's @-host variables in ExtraData and JS7's cm.store keyed by host); S7 (S7 saves the INDIVIDUAL-scope variables that SC4 says a save drops; SC4's per-object store is the other answer to the same loss); JS17, SC6, I2 (JS17's state(), signal() and door() helpers wrap SC4's per-object state, SC6's signals and I2's MPDOOR).", "d": "yes", "note": ""}, {"id": "SC5", "theme": "SC", "title": "Read and change the message a script reacts to", "kind": "script function and script command", "value": "high", "effort": "medium", "body": "**Today.** `CNCLMSG_PROG` and `EXECMSG_PROG` match any message type, and `=S|T|O VAR=VAL` filters on the source, target or tool by exact equality. But a script cannot read the message's value (damage, XP), its texts (a crime name), its tool's ability ID or the type that matched, and can only cancel it. `CNCLMSG_PROG` keeps the `CMMsg` in `$0`, usable from a `<SCRIPT>` block past the approval gate, undocumented. `EXECMSG_PROG` keeps nothing. Only `DAMAGE_PROG` passes a value, in `$g`.\n\n**Add.** Keep the message in both; `EXECMSG` keeps a copy of its fields, as `CMMsg` objects are pooled. `$%MSG(TYPE|VALUE|SOURCE|TARGET|TOOL|TOOLID|STEXT|TTEXT|OTEXT|SMINOR|TMINOR|OMINOR)%`, tests like `MSG(VALUE > 10)`, and `$q` for the tool's name. In `CNCLMSG_PROG`: `MPMSG VALUE <n|*0.5|-5>`, `MPMSG TEXT S|T|O <text>`, `MPMSG TARGET <obj>`. Let `=S|T|O` take `*` wildcards and masks.\n\n**Example.** A frost shrine's `CNCLMSG_PROG DAMAGE` runs `MPMSG VALUE *0.5` when `$%MSG(TOOLID)%` contains Fire. A fence's `EXECMSG_PROG LEGALWARRANT` reads `$%MSG(OTEXT)%` to learn the crime.\n\n*Note.* JavaScript can already read and change the message: in a `CNCLMSG_PROG` `<SCRIPT>` block, `objs()[0]` is the live message (see *Already possible* in the README). What this item adds is the MOBPROG forms, `MSG()` and `MPMSG`.\n\n*See also:* ST12 (SC5's MSG() functions are the message-detail reads that ST12 says it pairs with); JS15, JS17 (Message access and veto from scripts: SC5 in MOBPROG, JS17's msg() and cancel(), JS15's cancel(); JS15 and JS17 both add cancel()).", "d": "yes", "note": ""}, {"id": "SC6", "theme": "SC", "title": "Signals and function calls between scripts", "kind": "script command and script trigger, with a JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** `MPCALLFUNC` and `CALLFUNC` find functions only in the running script itself, so a lever cannot tell the gatehouse to raise the portcullis with MOBPROG commands. Only an approved inline `<SCRIPT>` JavaScript block can do it, by fetching the target's script engine and calling its Java `callFunc`. Stopgaps: `MPAT <room> <command>`; `MPSCRIPT <target> EXECUTE`, a one-off `ONCE_PROG` on the target that cannot reach its own functions; echoes caught by `ACT_PROG`, which the player sees unless they are `MPECHOAT` aimed at an NPC (only that NPC sees it, yet every `ACT_PROG` in the room matches it) or at a room the player is not in; or variables polled by `RAND_PROG`.\n\n**Add.** `MPCALLFUNC <target> <func> [args]` and `CALLFUNC(<target> func args)`. `MPSIGNAL <target> <name> [args]`, the target being an object, a room ID, an exit `room:north`, `TAG:<tag>[@WORLD]`, `ROOM`, `AREA` or `WORLD` (through `CMMap.scriptHosts`). It fires `SIGNAL_PROG <name>|ALL` on each target's scripts: `$g` the args, `$n` the actor, `$o` the sender. Queued, optionally delayed by ticks, silent. JS gets `signal(target, name, args)`. The puzzle props proposed elsewhere would emit signals.\n\n**Example.** Three braziers tagged `sunaltar` run `MPSIGNAL TAG:sunaltar lit` when lit. The altar's `SIGNAL_PROG lit` counts them and opens the sanctum door at three.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* I9, I12 (later), I15, I25 (The puzzle props send and receive SC6's signals (signal gate1 on, ONFULL=signal, SIGNAL inputs)); JS17, SC4, I2 (JS17's state(), signal() and door() helpers wrap SC4's per-object state, SC6's signals and I2's MPDOOR).", "d": "yes", "note": ""}, {"id": "SC7", "theme": "SC", "title": "MPWAIT: pause a script and resume it later", "kind": "script command", "value": "high", "effort": "medium", "body": "**Today.** `MPALARM` delays one command; the rest of the body runs at once. A cutscene or ritual must be split into `FUNCTION_PROG` steps chained with `MPALARM n MPCALLFUNC step2`. Those alarms keep `$n` and `$t` but are lost on save. `DELAY_PROG` repeats rather than pauses, and `MPWHILE` is capped at four seconds of real time.\n\n**Add.** `MPWAIT <ticks>`, `MPWAIT <n> HOURS` (game time) and `MPWAIT UNTIL (<condition>) [max ticks]`. They suspend the body and resume at the next line, keeping `$n`, `$t`, `$o`, `$0`-`$9` and the enclosing `IF`, `FOR` and `SWITCH` frames. Pending waits are saved with the game. `MPSETINTERNAL CANCELWAITS` drops them. The resumable frame runs on the single game thread, unlike the prompt commands, which spawn a thread.\n\n**Example.** A shrine's `GREET_PROG`: `mpecho The candles gutter.`, `mpwait 2`, `mpecho A voice whispers your name, $n.`, `mpwait 3`, then `mpcast bless $n` if not already blessed.\n\n*See also:* S7 (SC7's saved pending waits and S7's saved queued alarms belong in one script-state section of the save); N28 (Two answers to scripted cutscenes: MPWAIT in any script, or a Scene behaviour for NPC exchanges).", "d": "yes", "note": ""}, {"id": "SC8", "theme": "SC", "title": "Party and terminal awareness in scripts", "kind": "script function", "value": "high", "effort": "medium", "body": "**Today.** Scripts treat each party member as a separate player and cannot ask who is being played, who leads, or who is in the party; the engine never refers to `Party`. With party windows off, `MPECHOAT` to a background member goes to its silent `PartySession`, and the prompt commands likely ask it too. `GROUP_GREET_PROG`, `NUMPCSROOM`, `ISFOLLOW` and `$f` give rough group checks. Profile flags already exist as `HASACCTATTOO` and `MPACCTATTOO`, since the account is the profile; the guide should say so.\n\n**Add.** Codes `$u` and `$U` for the character at the terminal (`Party.terminalOf`). Functions `ISPLAYED($n)`, `INPARTY($n)`, `PARTYLEADER($n)` (its text form gives the name), `PARTYSIZE($n)` and `$%PARTY($n)%`, the list of names. With windows off, `MPECHOAT`, `MPECHOAROUND`, `MPPROMPT`, `MPCONFIRM` and `MPCHOOSE` aimed at a background member go to the terminal, prefixed with the member's name.\n\n**Example.** A ferryman's `GROUP_GREET_PROG 100`: `mpechoat $u Five coins a head, and I count $%PARTYSIZE($u)% of you.`\n\n*See also:* ST10 (Both add PARTYSIZE, INPARTY, PARTYLEADER and $%PARTY%; build the functions once).", "d": "yes", "note": ""}, {"id": "SC9", "theme": "SC", "title": "Bring the trigger and message-type help up to date", "kind": "presentation", "value": "medium", "effort": "small", "body": "**Today.** The in-game `SCRIPTABLE` help omits 12 of the 58 triggers, among them `GROUP_GREET`, `GIVING`, `CAST`, `WEARING` and `CMDFAIL`; `CMDFAIL_PROG`, the custom-verb trigger, is in no guide either. `MESSAGE_TYPES` stops at `LEGALWARRANT`. `MPSETINTERNAL`, `MPLLM`, `MPHIT`, `MPACHIEVE` and `MPACCUSE` are only in the HTML guide, and `MPSTEPQUEST` is nowhere. `LOGIN`, `LOGOFF` and `CHANNEL` read as multiplayer. `LIST MSGTYPES` and `LIST MSGMASKS` already print every type.\n\n**Add.** Regenerate the lists in `resources/help/arc_behaviors.ini` from the engine's `progs`, `funcs` and `methods` arrays, and point `MESSAGE_TYPES` at `LIST MSGTYPES`. Add to `guides/Scriptable.html` a `CMDFAIL_PROG` section and single-player notes: what `LOGIN` and `LOGOFF` mean (new game, restore, switch, party), that only `INFO` and `QUESTCHAT` remain, `ONCE_PROG` and saves, the parent-area listener trick. Optionally, `LIST TRIGGERS` with each trigger's syntax and hosts.\n\n**Example.** `HELP SCRIPTABLE` shows `CMDFAIL_PROG` with an example that adds \"pray at altar\".\n\n*See also:* SC15, JS20 (SC9 and SC15 both rewrite guides/Scriptable.html with single-player notes and a CMDFAIL_PROG section, which JS20 says may be enough on its own); Q9, ST5 (Q9, SC9 and ST5 each ask to document MPSTEPQUEST or QUEST_TIME_PROG's -1 and -2 codes; write it once).", "d": "yes", "note": ""}, {"id": "SC10", "theme": "SC", "title": "String functions", "kind": "script function", "value": "medium", "effort": "small", "body": "**Today.** MOBPROG has no case change, character length, substring, replace, trim, padding, capitalisation, a/an article or plural. The text forms of `STRCONTAINS` and `EVAL` return \"[unimplemented function]\". What exists: the `STRCONTAINS` and `STRIN` tests, `STRIN`'s word index, the word modifiers `.n`, `.LENGTH#`, `.DECOMMA#` and `.DESEMICOLON#`, and `$g` (lowercased) beside `$G`. A `<SCRIPT>` JavaScript block can do the rest, past the approval gate.\n\n**Add.** `$%UPPER(s)%`, `$%LOWER(s)%`, `$%CAP(s)%`, `$%LEN(s)%`, `$%SUBSTR(s start [len])%`, `$%REPLACE(s 'old' 'new')%`, `$%TRIM(s)%`, `$%PADRIGHT(s n)%`, `$%ANAME(s)%` (a or an, from `CMLib.english()`) and `$%PLURAL(s n)%`, and the tests `STRSTARTS(s x)` and `STRENDS(s x)`. Give `STRCONTAINS` a text form returning the position, and `EVAL` one returning the result.\n\n**Example.** `mpecho $%CAP($%ANAME($o)%)% flares in $%LOWER($n)%'s hand.`, or a shop sign padded into columns.\n\n*Note.* `JSCRIPTS=2` already runs every JavaScript block without approval (see *Already possible* in the README), so the JavaScript route mentioned above needs no approval; what this item adds is the convenience of doing it without JavaScript.", "d": "yes", "note": ""}, {"id": "SC11", "theme": "SC", "title": "Numbers, dice and weighted picks", "kind": "script function", "value": "medium", "effort": "small", "body": "**Today.** `MPSETVAR` reads a leading `+`, `-`, `*` or `/` as an operation on 32-bit integers, so `MPSETVAR $i MOD -5` subtracts; storing -5 means setting 0 first. `NUMBER()` rejects signs and decimals. `$%MATH(expr)%` already has decimals, `%`, `^`, `?` (random between, so `1?6+1?6+1?6` is close to 3d6), `<` (min) and `>` (max). Weighted picks exist only in generator XML (`PICKWEIGHT`, through `MPOLOAD FROMGENFILE`). `DiceLibrary`'s `rollNormalDistribution` is not reachable from scripts.\n\n**Add.** `MPSETVAR host var =<value>` for literal assignment. Signed and decimal `NUMBER()`. Long arithmetic, with `%N` and `^N` operations. `$%DICE(3d6+2)%` and the test `DICE(1d20+5 >= 15)`. `$%PICK(a b \"c d\")%`, `$%WPICK(common:70 rare:25 legendary:5)%` and `$%ROLLNORMAL(3 6 0)%`. `$%CLAMP(v lo hi)%` and `$%ABS(v)%` as readable shorthands.\n\n**Example.** A pit trap: `if dice(1d20+$%STAT($n DEX)% < 15)`, `mpdamage $n 5 15`. Loot: `mpoload $%WPICK(\"a copper ring\":70 \"a silver ring\":25 \"a jade ring\":5)%`.", "d": "yes", "note": ""}, {"id": "SC12", "theme": "SC", "title": "Add, remove and count tags from scripts", "kind": "script command and script function", "value": "medium", "effort": "small", "body": "**Today.** Scripts test tags with `HASTAG` and loop over tagged objects with `FOR $0 IN #tag`, and `$%HASTAG(target)%` already returns an object's whole tag list. The only way to set one is `MPSET target TAGS`, which replaces the comma list; rebuilding it from `HASTAG`'s space-separated, quoted output is error-prone. Counting means a `FOR` loop with `mpsetvar $i N ++`. `HASTAG` also logs its errors under the `HASTATTOO` label.\n\n**Add.** `MPTAG <target> ADD|DEL|TOGGLE <tag>`, `$%NUMTAGGED(tag)%` and the test `TAGGED(tag)`, for mobs, items, rooms and exits. Document `$%HASTAG(x)%` as the tag list, with `$%TAGS(target)%` as an alias, and fix the error label.\n\n**Example.** Each villager the player helps gets `MPTAG $t ADD grateful`. The mayor checks `math($%NUMTAGGED(grateful)% >= 5)` before offering the key to the town.", "d": "yes", "note": ""}, {"id": "SC13", "theme": "SC", "title": "Script files with parameters", "kind": "script function", "value": "medium", "effort": "small", "body": "**Today.** `LOAD=` takes only a file name, so one guard script shared by twenty guards cannot be told each guard's post or greeting. Setting variables in `ONCE_PROG` collides, since variables are keyed by name. A working pattern exists but is undocumented: put `FUNCTION_PROG POST~return castle#12~` before `LOAD=progs/guard.script` in each object's text, and read it in the file with `$%CALLFUNC(POST)%`. It is wordy, has no defaults, and a missing function logs an error.\n\n**Add.** `LOAD=progs/guard.script POST=castle#12 GREETING=\"Halt, who goes there?\"`. In the file, `$%ARG(POST)%` reads a value, `ARG(POST == castle#12)` tests it, and `ARGDEFAULT POST=...` lines set defaults. The arguments join the file name in the parse cache key. The cookbook also shows the `FUNCTION_PROG` pattern.\n\n**Example.** One shopkeeper script serves every merchant in the world, each given its own `OPEN` and `CLOSE` hours and the room to walk home to.\n\n*See also:* N7, P1, JS9 (Four ways to give a shared script or effect per-instance parameters (SC13's ARG(), N7's PARM(), P1's EFFECTPARM(), JS9's parms); decide them together).", "d": "yes", "note": ""}, {"id": "SC14", "theme": "SC", "title": "Fix the confirmed MOBPROG bugs", "kind": "script function and command fixes, with a debug tool", "value": "medium", "effort": "small", "body": "**Today.** Confirmed in the code: `LEVEL_PROG` fills `$0`-`$9` with the whole argument array; `NUMMOBS(... MASK=...)` reads the wrong argument and gives 0; named XML for `MPMLOAD` and `MPOLOAD` is sought under trigger 55, not 58; the `MP` prefix fallback takes the last match; `MPDAMAGE ... kill` never kills; `INROOM(... BEACON)` drops the start room; `MPMLOAD` clears its template's start room; `MPACCUSE` checks the wrong object; `MPRLOAD` runs as a game command; one-digit `RAND_PROG` fires only in active areas; an unapproved JavaScript block is refused only once per boot; the text forms of `ISNPC`, `ISPC`, `ISIMMORT`, `EVAL` and `STRCONTAINS` are placeholders. `scriptableTest.script` names a `TEST SCRIPTABLE` command that no longer exists.\n\n**Add.** Fix each, and re-check the `MPLLM` and `NUMMOBSINAREA` faults listed in `DOCS`. Turn `resources/progs/scriptableTest.script` into an automated check run by `tools/engine-tests.sh`, covering the new commands and functions too.\n\n**Example.** A `LEVEL_PROG` congratulation using `$1` prints a Java object name today; a census NPC using `NUMMOBS` with a mask always reports 0.\n\n*See also:* ST17 (Both fix LEVEL_PROG filling every local variable with the trigger array); SC3 (Both fix MPMLOAD clearing its template's start room); CR6 (Both fix INROOM(BEACON) throwing away the start room); DT10 (SC14 fixes the MP prefix fallback taking the last match, and DT10 makes an ambiguous MP word an error); JS1 (Both fix JSCRIPTS=1 letting a refused script run from its second try).", "d": "yes", "note": ""}, {"id": "SC15", "theme": "SC", "title": "A CoffeeSUD edition of the Scriptable guide", "kind": "presentation", "value": "medium", "effort": "small", "body": "**Today.** `guides/Scriptable.html` (8,733 lines) describes multiplayer CoffeeMud. It lacks `CMDFAIL_PROG`, says `INDIVIDUAL` variables are saved with the target (true only for players), and shows a space-separated `FOR IN` list that the code splits on commas. `IPADDRESS`, `ISPKILL`, `CHANNEL_PROG`, `LOGOFF_PROG`, clans and `MPPOSSESS` have no single-player meaning given. It never says account tattoos are the profile, that `ONCE_PROG` fires again on each restore, or what a save keeps.\n\n**Add.** Single-player notes per entry, multiplayer-only entries marked, a \"what survives a save\" table, a quick reference grouped by purpose, and a cookbook: once-ever events, character versus profile flags, cutscenes, puzzle rooms, timed returns, catalog spawns. Also document what this audit found: `$@x`, timed tattoos as delays, `SWITCH` in place of `ELSEIF`, `MPAT` and `MPSCRIPT EXECUTE`, `FUNCTION_PROG` with `LOAD=`, `MATH`'s `? < > ^ %`, `$%HASTAG(x)%`, quest `SET DATE MUDDAY`, `CHARCREATIONSCRIPTS` `END`/`CHARLOGIN`/`ALLCHARLOGIN`, and `HASACCTATTOO`/`MPACCTATTOO`.\n\n**Example.** A builder new to MOBPROG writes a lever-and-door puzzle from the cookbook instead of reading 8,700 lines of HTML.\n\n*See also:* SC9, JS20 (SC9 and SC15 both rewrite guides/Scriptable.html with single-player notes and a CMDFAIL_PROG section, which JS20 says may be enough on its own).", "d": "yes", "note": ""}, {"id": "SC16", "theme": "SC", "title": "+ANYINGROUP and +ALLINGROUP mask keys", "kind": "zapper mask key, used by behaviours and scripts", "value": "medium", "effort": "small", "body": "**Today.** Zapper masks test one creature at a time. `-FOLLOW` and `-RIDE` apply the rest of a mask to the leader or the mount, and `+/-GROUPSIZE` counts the group, so \"the leader carries the pass\" can be written with `+OR`. Nothing tests whether any or every member does, and `-IF` checks one subject. Behaviours that scan the whole room already cover part of this: `Aggressive -ITEM \"+stolen idol\"` attacks whoever in the room holds the idol, `Wimpy very=1 -CLASS +Paladin` runs from any paladin present while out of combat, and `GateGuard` counts every player in the room. What cannot be said is a check on one creature that also looks at its companions. `DoorwayGuardian` checks only the creature moving, `CombatAssister` the creature attacked, MudChat the speaker, and an in-combat `Wimpy` only the creature attacking it. So \"let the party through if one of them carries the pass\" or \"flee when the attacker's party includes a paladin\" cannot be written.\n\n**Add.** `+ANYINGROUP <rest of mask>` and `+ALLINGROUP <rest of mask>`, applying the rest to the subject's group in the same room (leader, followers, party), built on the same recursion as `FOLLOW` and `RIDE`. Every mask user gets them at once: `Aggressive`, `DoorwayGuardian`, `GateGuard`, `Follower`, `CombatAssister`, `Wimpy`, `NastyAbilities`, `NiceAbilities`, MudChat `/` conditions and scripts.\n\n**Example.** `DoorwayGuardian north +ALLINGROUP +ITEM \"-guild pass\"` lets the party in when one member carries the pass. DoorwayGuardian blocks movers that match its mask, and `+ITEM \"-guild pass\"` matches those without the pass, so it blocks only when every member lacks one. `+ANYINGROUP` here would block the party unless everyone had a pass. A ghoul with `Wimpy +ANYINGROUP -CLASS +Paladin` flees from a party that has a paladin.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "SC17", "theme": "SC", "title": "ELSEIF, WHILE blocks, CONTINUE, named locals and parameters", "kind": "script command", "value": "medium", "effort": "medium", "body": "**Today.** A chain of tests needs one ENDIF per branch, because `ELSE IF` on one line is refused. SWITCH/CASE helps only when every branch tests the same value. MPWHILE runs a single command, often MPCALLFUNC, and stops after 4 seconds of real time, which makes little sense under turn-based time. FOR has BREAK but no CONTINUE. There are only ten locals, $0 to $9, set with MPARGSET, and $9 is also SHOPHAS's price. A FUNCTION_PROG gets one string, $g, which the script splits with $g.0, $g.1 and so on.\n\n**Add.** `ELSEIF <cond>`. A `WHILE <cond>` ... `ENDWHILE` block, capped by a number of passes, not by time. `CONTINUE` in loops. Named locals: `MPLOCAL name value`, read as `$(name)`, which last while the body runs. Named parameters: `FUNCTION_PROG heal WHO AMOUNT` binds $(WHO) and $(AMOUNT) from the words of the call. Optional: plain comparisons in IF, wrapped in EVAL automatically.\n\n**Example.** A gate guard's GREET_PROG checks level, then faction, then whether the player carries a pass, in one IF / ELSEIF / ELSE / ENDIF.", "d": "yes", "note": ""}, {"id": "JS1", "theme": "JS", "title": "Run world JavaScript without per-script approval", "kind": "world option", "value": "high", "effort": "small", "body": "**Today.** The shipped coffeemud.ini has JSCRIPTS=1. A new or edited `<SCRIPT>` block is refused (\"A Javascript was not authorized\") until it is approved with MODIFY JSCRIPT. Approvals go to `::jscripts.ini` in the database VFS. Normal games do not copy it, so a script approved in builder mode does nothing in a real game or a fresh checkout. Only GenCommand pre-approves its scripts. GenAbility and GenTrap do not. JSCRIPTS=2 (always run) already exists, in the ini or as `sud.sh JSCRIPTS=2`. JSCRIPTS=1 also has a bug: a refused script is added to the table, so it passes from its second run each boot.\n\n**Add.** Ship JSCRIPTS=2, in the ini or in SUD's SINGLE_PLAYER_SETTINGS, since the player is the author. If JSCRIPTS=1 stays as an option: save approvals to world/jscripts.ini, pre-approve in GenAbility and GenTrap, list unapproved JS in a world check, and fix the bug.\n\n**Example.** A GenAbility \"Chain Lightning\" with a ten-line JS block works the same in builder mode, in a new game
