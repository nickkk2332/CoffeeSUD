 (in `Sense`) allows, and it looks only at what the room's locale class fixes: its domain and, for caves and indoor stone, its movement cost (base weight) and size (height). Seaport, spaceport, city and plains always pass. Caves pass only with a base weight over 3, and indoor stone only with a set weight and height. Nothing overrides this, and a locale's domain is fixed. A forest road, mountain pass or desert track must become a plains or city locale such as `Road`, and loses its terrain and resources.\n\n**Add.** A `Prop_Road` property for rooms or areas. It makes them drivable for `GenCaravan` vehicles, coach caravans included (Wainwrighting's wagons and coaches are `GenRideable` and already go anywhere but air and water), and is checked before the domain rule. Optional `TIME=<multiplier>`, which combines with the proposed travel-time setting, and `NOTFOR=<vehicle names>`.\n\n**Example.** The Old Forest Road is a strip of `WoodsGrid` rooms with `Prop_Road`. The player's spice caravan follows it through the forest. The rest of the forest stays closed to it.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* T4, T6, T12 (T6, T12 and T18 use T4's travel time).", "d": "yes", "note": ""}, {"id": "T19", "theme": "T", "title": "Sister stables for mounts", "kind": "behaviour", "value": "low", "effort": "medium", "body": "**Today.** Most of this exists. The `Nanny` behaviour, set for example to `RATE=2.5 NAME=\"The Stables\" WATCHES=\"mounts,wagons,boats\"`, guards the mounts, wagons or boats left in its room once the owner leaves. They are given back only when the hourly fee is paid (the first game hour is free). They do not decay and cannot be attacked. The drop-offs are saved in the behaviour's parameters. But a mount can be collected only where it was left.\n\n**Add.** A `NETWORK=<name>` parameter for `Nanny`. A mount left at one stable of the network can be collected at another for `SENDFEE=<n>`, paid on top of the fee. Perhaps also explicit `STABLE`, `RETRIEVE` and `LIST` verbs, and a rate per game day.\n\n**Example.** The party leaves its horses at the Port Azure livery before taking ship. Three game days later it collects them at Gullrock's sister stable and pays the keep and the send fee.", "d": "yes", "note": ""}, {"id": "L1", "theme": "L", "title": "NPCs who understand only their own language", "kind": "property", "value": "high", "effort": "small", "body": "**Today.** Speech in a language a mob does not know never reaches its speech_prog. Common has no language tool, though, so Common speech always does, even on an orc meant to know only Orcish. MudChat answers speech in any language, because it reads the speaker's clear text (`msg.sourceMessage()`). Only orders and trade check comprehension. `ISSPEAKING($n Common)` is true even when $n speaks Orcish. `Prop_LanguageSpeaker HOMEONLY` compares with `homeRoom` and `homeArea`, which are final nulls, so it fails for any mob with a start room.\n\n**Add.** `UNDERSTANDS=ONLY` on `Prop_LanguageSpeaker`, or a separate `Prop_Monolingual LANGUAGES=Orcish,Goblinese CONFUSED=\"<S-NAME> grunt(s) and shrug(s).\"`. Speech the mob cannot follow through its languages, translators or spells, Common included, does not reach speech_prog or MudChat. The CONFUSED line shows instead, if set. MudChat gets the same check and answers in its spoken language. Fix `HOMEONLY` to use the property's area and room, and fix `ISSPEAKING` for Common.\n\n**Example.** In an orc camp only a captured interpreter (`Prop_LangTranslator`) or a player who has learned Orcish can bargain with the chieftain. Anyone else gets shrugs.\n\n*See also:* L4, L11 (All three route hearing through one comprehension check (L4's understands(), L11's INTERPRETS search, L1's monolingual filter)).", "d": "yes", "note": ""}, {"id": "L2", "theme": "L", "title": "A glossary for renaming terms without regex", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** The translation file can rename terms. `[final-translation]` runs on every printed line, and `[session-translation]` runs inside every `L()` call. But `REPLACE` swaps the whole line for one regex template, so each rule handles one occurrence. `REPLACEALL` is a plain substring match, so 'mana' also hits 'manage'. Neither keeps capitals: 'Mana' becomes 'aether'. Plurals and scopes need hand-written regex.\n\n**Add.** `vocab/glossary.ini`, one term per line: `hit points = vigor`, `mana = aether`, `gold coin = crown`, `Archon = Warden`. Each line compiles to a whole-word rule that replaces every occurrence and keeps capitals (Hit Points to Vigor, HIT POINTS to VIGOR). It handles plurals from `(s)` forms, takes an exception list (`NOT:` proper names, item names) and `SCOPE=ALL|HELP|SCORE`. It applies in session translation through `L()` and in help output, and to final output only for lines marked `FINAL`. It can be built as a new `DirtyLanguage` rule command, `REPLACEWORD`.\n\n**Example.** A low-magic world renames mana to 'focus' and spell to 'working' in score, help, prompts and messages with two lines. 'Mana' at the start of a sentence reads 'Focus'.", "d": "yes", "note": ""}, {"id": "L3", "theme": "L", "title": "List overrides per area, room and mob (Prop_LocalLists)", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Time-of-day lines, the health chart, damage and miss words, corpse blurbs, gaits and magic words are global. An underground area still hears the stock line, which has the sun rising in the west. Workarounds cover a few of these: `DISABLE=TODNOTIFIES` plus an area Scriptable with `TIME_PROG` and `MPECHO`, GenRace `HEALTHRACE`, corpse blurbs keyed by the killing ability or weapon, and `Prop_NewDeathMsg` on one mob. Nothing gives an area its own health chart, damage words, hit and miss text, gaits or magic words. Weather lines per area are a separate item.\n\n**Add.** `Prop_LocalLists` on an area, room or mob: `TOD_CHANGE_OUTSIDE=`, `TOD_CHANGE_INSIDE=`, `HEALTH_CHART=`, `DAMAGE_WORDS=`, `WEAPON_HIT_DESCS=`, `CORPSE_BLURBS=`, `MAGIC_WORDS=`, `GAIT_LIST=`, or `LOAD=vocab/lists_underdark.ini`. Where the code knows a room or mob, a lookup tries the room's effects, then the area, then parent areas, then the global list. It goes through a new `CMProps.getListFileChoiceFromIndexedList(ListFile, Physical context)`.\n\n**Example.** The Underdark sets `TOD_CHANGE_INSIDE` to '^JThe glowmoss brightens; it is now day-cycle.^?' and gives `HEALTH_CHART` entries like 'is bleeding black ichor'. The Feywild's `CORPSE_BLURBS` read 'dissolving into petals'.\n\n*See also:* W13, W20 (Three ways to give an area its own time-of-day and weather lines (Prop_SkyText, climate files, Prop_LocalLists); pick one); L7, L8 (Health chart, corpse blurbs and hit and miss text overridden by area (L3), race (L7) and weapon (L8); one lookup chain).", "d": "yes", "note": ""}, {"id": "L4", "theme": "L", "title": "Script trigger and functions for understanding a language", "kind": "script trigger and script function", "value": "high", "effort": "medium", "body": "**Today.** `ISSPEAKING($n Elvish)` tests the speaker's language, so `speech_prog p mellon` with `if isspeaking($n Elvish)` can already require a language. `ISABLE($n Elvish)` tests whether someone knows a language, and its string form gives the proficiency. `AFFECTED` tests the live effect. But speech the mob cannot follow produces no message a script sees. No test counts translators (`Prop_LangTranslator`, spells such as `Prayer_Tongues`, items, the room) or `INTERPRETS`. That logic is protected inside `StdLanguage.getAnyTranslator`.\n\n**Add.** A public `CMLib.utensils().understands(MOB, String)`, with three script parts built on it. `NOTUNDERSTOOD_PROG [language|ANY] [p pattern]` fires when the mob hears speech it cannot follow. The garbled text is in `$0`, and `ISSPEAKING($n)` names the language. `UNDERSTANDS($n <lang>)` returns true or false. `UNDERSTANDS$($n <lang>)` returns the effective proficiency, 0 to 100, counting effects, items and the room. The proposed `LANG=` option for speech_prog is dropped, because `isspeaking` already covers it.\n\n**Example.** A gate guard's `NOTUNDERSTOOD_PROG ANY` says 'Speak Common, stranger!' and marks the player suspicious with `MPSETVAR`.\n\n*See also:* L1, L11 (All three route hearing through one comprehension check (L4's understands(), L11's INTERPRETS search, L1's monolingual filter)).", "d": "yes", "note": ""}, {"id": "L5", "theme": "L", "title": "GenLanguage: dictionary files, suffixes, kept names, written name", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** A GenLanguage dictionary is one `HASHEDWORDS` string of english/word pairs, plus `WORDS` lists by length. Both are saved in `world/custom.cmare`, a text file. A large dictionary can be generated outside the game and pasted in, but thousands of entries are unwieldy. Draconic's 10,190 words are in Java. Unknown words are whole words picked by length and hash. Only player names stay as they are, so NPC, area and place names are scrambled. `writtenName()` always returns the spoken name.\n\n**Add.** New GenLanguage fields:\n\n- `WORDFILE=vocab/languages/dunetongue.txt`: one `english=word` per line, merged with `HASHEDWORDS`.\n- `SUFFIXES=ED:a,ING:ir,S:i`: an inflected form is the root's translation plus a suffix, the regularity DOCS b062 found in Draconic.\n- `SYLLABLES=`: banks of syllables that build unknown words, always the same way for a given word.\n- `KEEPWORDS=` and `KEEPNAMES=true`: words left as they are; KEEPNAMES also keeps capitalised words and the names of mobs, areas and catalog entries.\n- `WRITTENNAME=`: the name of the script in reading messages.\n\n**Example.** Dunetongue gets a 600-word file, `SUFFIXES=S:en,ED:ka` and `KEEPNAMES=true`, so 'the sultan Hakim rode to Qarth' keeps Hakim and Qarth. Its writing is called Glyphscript.\n\n*See also:* G12 (Both add syllable banks for made-up words (names vs unknown words), and G12 attaches a name style to a GenLanguage); L12 (Both extend GenLanguage translation (dictionary files and suffixes vs a translate() script run before the tables)); DT31 (DT31's preview shows which of L5's sources (dictionary, suffixes, syllables) each word came from).", "d": "yes", "note": ""}, {"id": "L6", "theme": "L", "title": "Foreign text inside descriptions, exits, echoes and help", "kind": "presentation", "value": "high", "effort": "medium", "body": "**Today.** A readable item can carry a language as an effect, added in the item editor or by writing on it while speaking the language. READ then shows scrambled text, plus the translation for readers who know it. A non-gettable item can stand in for runes over a door. `LOOK_PROG` with `if isable($n Dwarven)` and `MPECHOAT` can show each viewer different room text. But room and exit descriptions, `MPECHO` and help cannot hold text in a language. Exits cannot be read in a language, because `StdLanguage` reading needs an Item. `CoffeeFilter` has no language tag.\n\n**Add.** A markup tag that works in room, exit and item descriptions, readable text, `MPECHO`, script output and help: `^<LANG Elvish^>Mellon, friend^<\/LANG^>`. The filter garbles the text for each viewer by how well they understand it, using the reading code. Those who know the language also see '(you read: \"Mellon, friend\")'. An optional `NOTE=\"elegant runes\"` is shown to those who cannot read it.\n\n**Example.** A tomb: 'Above the door is carved ^<LANG Dwarven NOTE=\"angular runes\"^>Here lies Durin; disturb not his rest^<\/LANG^>.' Players who know Dwarven read it. Others see angular runes and gibberish.", "d": "yes", "note": ""}, {"id": "L7", "theme": "L", "title": "GenRace HEALTHCHART and CORPSEBLURBS fields", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** A custom race can only borrow another race's health text, through the GenRace field `HEALTHRACE`. It points at one of the 123 Java races that override `healthText`, golems, undead and plants among them. A race cannot write its own. Corpse blurbs are chosen by the killing ability or weapon, not by race. `Prop_NewDeathMsg` changes the death message of a single mob only.\n\n**Add.** Two GenRace fields. `HEALTHCHART` is a list of eleven entries with `<MOB>`, like `HEALTH_CHART`, and allows pipe-separated variants. `CORPSEBLURBS` holds cause=phrase pairs. When they are empty, `HEALTHRACE` applies, then the global chart. Both are edited in `MODIFY RACE` and saved in `custom.cmare`.\n\n**Example.** A Clockwork race: 'is shedding gears and sparks', 'has a cracked casing', 'ticks along perfectly'. Its corpse is 'a heap of springs'.\n\n*See also:* L3, L8 (Health chart, corpse blurbs and hit and miss text overridden by area (L3), race (L7) and weapon (L8); one lookup chain).", "d": "yes", "note": ""}, {"id": "L8", "theme": "L", "title": "Hit and miss messages per weapon", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Hit and miss text comes only from the six fixed slots of `WEAPON_HIT_DESCS` and `WEAPON_MISS_DESCS`, chosen by weapon class and damage type. `StdWeapon` always returns `standardHitString` or `standardMissString`, so a named sword or a whip cannot have its own lines. A Scriptable `DAMAGE_PROG` (amount in `$g`) or `Prop_UseEmoter` can only add a line next to the stock one. `CNCLMSG_PROG` cancels the damage along with the message. `Prop_NewDeathMsg` shows that a property can override a message.\n\n**Add.** `Prop_WeaponMessages`, or GenWeapon fields `HITMSG` and `MISSMSG`. It takes `HIT=\"<S-NAME> sear(s) <T-NAMESELF> with <TOOLNAME>, <DAMAGE> <T-HIM-HER>.|...\"`, `MISS=\"...\"` and an optional `DAMAGEWORDS=` list for this weapon. `StdWeapon.hitString` and `missString` check it first. It also works on the natural weapons of a GenRace.\n\n**Example.** Frostbrand: 'Rime spreads as <S-NAME> <DAMAGE> <T-NAMESELF> with <TOOLNAME>.' A spider race's bite: '<S-NAME> sink(s) dripping fangs into <T-NAMESELF>.'\n\n*Note.* A `CNCLMSG_PROG` `<SCRIPT>` block can change the live message in `objs()[0]` instead of cancelling it (see *Already possible* in the README), so a weapon's hit line can be reworded today, if clumsily.\n\n*See also:* L3, L7 (Health chart, corpse blurbs and hit and miss text overridden by area (L3), race (L7) and weapon (L8); one lookup chain).", "d": "yes", "note": ""}, {"id": "L9", "theme": "L", "title": "Socials as world content, with pruning of stock ones", "kind": "data file and builder tool", "value": "medium", "effort": "small", "body": "**Today.** `Prop_Socials` already adds emotes as content, on areas, rooms, exits, mobs and items. It is written inline with `NAME=`, `TARGET=`, `YOUSEE=`, `OTHSEE=`, `TARGSEE=`, `NOTARGSEE=`, `SRCCODE=`, `OTHCODE=`, `ZAPMASK=`, `MASK=` and `WORNONLY=`, and on a top-level area it is saved in that area's .cmare. `SOCIAL_PROG` lets NPCs react. But stock socials cannot be dropped, including the crude ones DOCS c03 notes: DISABLE knows only `COMMAND_`, `ABILITY_`, `EXPERTISE_`, `FACTION_`, `RACE_` and `CHARCLASS_`, and none of them reaches socials. `CREATE`, `MODIFY` and `DESTROY SOCIAL` write `resources/socials.txt`. `Prop_Socials LOAD=` looks only under `resources/`.\n\n**Add.** Read `vocab/socials.txt` after the stock file, so a world line overrides a stock social of the same name. `vocab/socials.ini` takes `STOCK=ALL|NONE|<list to keep>` and `REMOVE=<list>`. In builder mode the three SOCIAL commands write the world file. `Prop_Socials LOAD=` also looks in `vocab/`.\n\n**Example.** A monastery world keeps only BOW, NOD, SMILE and WAVE from the stock socials and adds MEDITATE, PROSTRATE and CHANT. Its monks react to these through `SOCIAL_PROG`.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* S6, S20 (Three designs for world socials and dropping stock ones (vocab/socials files, the world resources overlay, DISABLE=STDSOCIALS)).", "d": "yes", "note": ""}, {"id": "L10", "theme": "L", "title": "MPLEARNLANG and MPSAYIN, and an MPENABLE fix", "kind": "script command", "value": "medium", "effort": "small", "body": "**Today.** `MPENABLE <who> <lang> <N|++N|--N>` adds or raises a language, but it changes only the stored ability. The live effect, which translation reads, keeps its old proficiency unless the ability is new. MPENABLE also ignores the language cap that `StdLanguage.canBeLearnedBy` enforces. JavaScript can set the effect directly (`source().fetchEffect('Elvish').setProficiency(60)`). Saying one line in a language takes three: `MPSPEAK` to it, the line, then `MPSPEAK $i Common` back.\n\n**Add.** `MPLEARNLANG <who> <lang> <N|+N|-N> [FORCE]` adds the language if it is missing, within `MAXLANGUAGES` unless `FORCE` is given. It sets both the ability and the live effect, as `helpProficiency` does, and tells the player 'Your grasp of Elvish improves.' `MPSAYIN <lang> <text>` says one line in that language, then goes back to the previous one. Also fix `MPENABLE` so it updates the live effect.\n\n**Example.** Each lesson with the elven tutor runs `MPLEARNLANG $n Elvish +15`, and the next lines the player hears are visibly less garbled. A smuggler mutters `MPSAYIN ThievesCant the goods are in the well`.\n\n*See also:* L13 (Both fix MPENABLE not updating the live language effect).", "d": "yes", "note": ""}, {"id": "L11", "theme": "L", "title": "INTERPRETS for hearing and reading, with partial understanding", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** GenLanguage `INTERPRETS` is read only by `getAnyTranslator`, which only orders and trade call. To hear speech, the listener needs an effect with the speaker's exact language ID; to read, the reader needs the same. `Prop_LangTranslator` takes percentages ('80% Elvish 40% Sylvan'). By default its bearer says the translation aloud as an interpreter, with the percentage as the chance per sentence. In `NOTRANSLATE` mode it covers only orders and trade. Neither lets a player half-understand a related language, so dialects cannot be modelled.\n\n**Add.** Hearing and reading use the same search as orders and trade: own effects, then `INTERPRETS`, then translators. `INTERPRETS` takes percentages, as in `INTERPRETS=Elvish(60),Sylvan(30)`, and understanding counts at proficiency times the percentage. '(translated from Elvish)' shows as it does now.\n\n**Example.** High Elvish scholars follow ordinary Elvish at 80%. Woodland Elvish speakers follow High Elvish at only 40%, so ancient scrolls are half-garbled for them.\n\n*See also:* L1, L4 (All three route hearing through one comprehension check (L4's understands(), L11's INTERPRETS search, L1's monolingual filter)).", "d": "yes", "note": ""}, {"id": "L12", "theme": "L", "title": "JavaScript hook for languages built by rule", "kind": "JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** GenLanguage can only look words up. Languages that transform words by a rule, such as PigLatin, PirateTalk and Drunken, override `translate()` in Java. `StdLanguage` has no script hook, so a builder cannot make a language that spells words backwards or a cipher.\n\n**Add.** A GenLanguage field `TRANSLATESCRIPT` holding a JavaScript body. It defines `translate(word, language)` and optionally `garble(text, count)`. It is called before the lookup tables, and a null return falls back to them. It reuses the Rhino setup in `DefaultScriptingEngine`, like JavaScript in MOBPROG. That setup is not restricted (it has full `Packages` access), so with `JSCRIPTS=1` the script needs the same `MODIFY JSCRIPT` approval (`CMSecurity.isApprovedJScript`).\n\n**Example.** Mirrorspeech for a looking-glass realm: `TRANSLATESCRIPT=\"function translate(w){return w.split('').reverse().join('');}\"`. A Runic cipher shifts each letter.\n\n*See also:* L5 (Both extend GenLanguage translation (dictionary files and suffixes vs a translate() script run before the tables)).", "d": "yes", "note": ""}, {"id": "L13", "theme": "L", "title": "Learning a language by immersion", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Proficiency in a language grows only while the character speaks it (`helpProficiency`), and only if they already know it. Hearing only translates, and reading only scrambles or translates, so living among orcs teaches no Orcish. The ways to learn a language are explicit: `TEACH` and `MOBTeacher`, the Studying skill, `MPENABLE`, or a race or class. A rough version can be scripted: a room Scriptable whose speech_prog runs `MPENABLE $n Orcish ++1`. But it hears only speech its host understands, and MPENABLE does not update the live effect.\n\n**Add.** `Prop_LanguageImmersion` on an area, room, mob or item, or given by a quest: `LANGUAGE=Orcish|ANY HEAR=1 READ=3 CHANCE=20% START=5 MAX=60 GRANTAFTER=25`. Each time the character hears or reads the language, they may gain proficiency, up to `MAX`. A character who does not know it gains it at `START` after `GRANTAFTER` exposures, within `MAXLANGUAGES`. Gains are reported ('You are starting to follow Orcish.') and saved.\n\n**Example.** A prisoner in the goblin warrens picks up Goblinese to 50% over a few game days. A dusty library gives `READ` gains in Ancient Imperial up to 40%.\n\n*See also:* L10 (Both fix MPENABLE not updating the live language effect).", "d": "yes", "note": ""}, {"id": "L14", "theme": "L", "title": "World help with fixed priority and hidden stock entries", "kind": "data file and builder tool", "value": "medium", "effort": "small", "body": "**Today.** GenAbility, GenLanguage and GenCommand carry their own `HELP` field, saved in `custom.cmare`. `CREATE COMMAND` on a stock command copies its help for rewriting. But `help/*.ini` files merge in `File.listFiles()` order, which is unspecified, so a world file cannot reliably override a stock key. Stock entries for removed features cannot be hidden, nor the 70 or so places that name CoffeeMud or the MUD. `CREATE HELP` and `CREATE AHELP` write `resources/help/newhelp.ini` and `arc_newhelp.ini`. World files have no place for lore pages.\n\n**Add.** Load the stock files sorted by name, then `vocab/help/*.ini` last, so world entries win. `vocab/help/hide.txt` lists stock keys to drop (or `HIDE=CLANS,CHANNELS,...`). In builder mode `CREATE` and `MODIFY HELP` write `vocab/help/world_help.ini`. For an Archon, `HELP` shows where each entry came from.\n\n**Example.** The world replaces HELP MAGIC with its own account of 'workings', hides the CLAN entries, and adds HELP DUNETONGUE and HELP SANDSEA as lore pages.\n\n*See also:* S6 (Both load world help after the stock files and point the help editors at the world (vocab/help vs world/resources/help)).", "d": "yes", "note": ""}, {"id": "P1", "theme": "P", "title": "GenAbility as a complete custom property", "kind": "property", "value": "high", "effort": "small", "body": "**Today.** `CREATE ABILITY` makes a GenAbility, and its SCRIPT already runs when the GenAbility is attached as an effect. But HERESTATS and MOCKABILITY are set up only in `invoke()` and `autoInvocation()`, so a GenAbility attached statically gives no stats. The script cannot read the text of its own instance, so each setting needs its own copy. The workaround is to attach `Scriptable(LOAD=...)` plus `Prop_HereAdjuster` or `Prop_WearAdjuster`.\n\n**Add.** (a) When a GenAbility is added as a non-invoked effect, build its HERESTATS and MOCKABILITY effects in `setAffectedOne` or `setMiscText`. (b) Give the SCRIPT the instance text as `$PARMS`, and a function `EFFECTPARM(KEY)`. Then one class serves many settings, such as `Prop_MyTrap(DAMAGE=10 MSG=...)`. (c) Write an AHELP GENABILITY page with a worked custom-property example. Today the only help is LIST ABILITYFLAGS.\n\n**Example.** The builder makes Prop_Haunted once. It is a GenAbility whose MOBPROG brings cold drafts, flickering lights and moans at night. It is attached to twenty rooms with different `FREQ=` values and saved in `world/custom.cmare`.\n\n*See also:* SC13, N7, JS9 (Four ways to give a shared script or effect per-instance parameters (SC13's ARG(), N7's PARM(), P1's EFFECTPARM(), JS9's parms); decide them together).", "d": "yes", "note": ""}, {"id": "P2", "theme": "P", "title": "Exact level-ups from scripts: MPLEVELUP, MPLEVELDOWN, EXPTONEXT", "kind": "script command and script function", "value": "high", "effort": "small", "body": "**Today.** `MPEXP $n 100%` posts one level's XP span. That is exactly one level only when the character sits at a level boundary, as with milestone-only XP (kill XP turned off through XPMOD). From mid-level it overshoots or falls short. A negative MPEXP can take a level away. `MPSET LEVEL` changes the number with no gains. A JavaScript block can call `CMLib.leveler().level()` through Packages, but only with JSCRIPTS=2 or approval. STAT() has no code for XP to the next level.\n\n**Add.** `MPLEVELUP <target> [n]` and `MPLEVELDOWN <target> [n]`. Up posts exactly `getExpNeededLevel()+1` XP, or calls `level()` when the character has no XP. Down calls `unLevel` with the XP adjusted. Also add an `MPEXP <target> NEXTLEVEL` keyword, a function `EXPTONEXT($n)`, and the same calls for JavaScript.\n\n**Example.** When the dragon dies, the quest's last step runs MPLEVELUP on each party member with \"You feel the weight of what you have done\", and each gains one level.", "d": "yes", "note": ""}, {"id": "P3", "theme": "P", "title": "Named lifecycle hooks and a cast-failure message for GenAbility scripts", "kind": "script trigger", "value": "high", "effort": "medium", "body": "**Today.** Most of these hooks exist under other names. On a successful cast the script gets a message whose text is the ability ID, with the cast arguments as $0-$9 (`IMASK_PROG p <ID>`). On expiry it gets `UNINVOKE-<ID>`. RAND_PROG and DELAY_PROG fire each tick while the effect is on. CASTMASK can veto a cast before costs, with zapper keys such as +IF, -HOUR and -LOCATION. But it always prints \"You do not meet the requirements: <maskDesc>\" (TARGETMASK has TARGETFAILMSG), and the target is not $t during the check. Nothing fires when a mob learns the ability. GenTrap sends a message only when it springs, and nothing on disarm.\n\n**Add.** A CASTFAILMSG field, and the target as $t during the CASTMASK check. Named functions called where the old messages are sent, as GenCommand calls EXECUTE: CANCAST (before costs; RETURN false cancels), ONCAST, ONTICK and ONEXPIRE. The old messages stay. New hooks: ONLEARN, when a mob gains the ability, and ONTRIGGER and ONDISARM for GenTrap.\n\n**Example.** Moonblade's `FUNCTION_PROG CANCAST` runs `IF !istime(night) MPECHO The moon is hidden. RETURN false`. ONCAST gives the target a silver glow, and ONEXPIRE echoes \"the moonlight fades\".\n\n*See also:* ST2 (ST2's SKILL_PROG LEARN and P3's ONLEARN hook both fire when a mob gains an ability, from the same addAbility point); I20 (Both extend GenTrap scripting (TRIGGERS and DISARM vs ONTRIGGER and ONDISARM hooks)); P21, P22 (Named script hooks (CANCAST, ONCAST, ONTICK, ONEXPIRE) on GenAbility, GenTweakAbility, GenPoison and trade skills; one hook design).", "d": "yes", "note": ""}, {"id": "P4", "theme": "P", "title": "GenAbility TARGETMODE: area, group and all-enemies abilities", "kind": "data file (GenAbility field)", "value": "high", "effort": "medium", "body": "**Today.** A GenAbility resolves exactly one target by its can-target code. It never calls `StdAbility.properTargets`, which the engine's own area spells use. There are rough substitutes. Can Target and Can Affect set to ROOMS with HERESTATS gives a room aura, through `Prop_HereAdjuster` with `MASK=`. A script on `IMASK_PROG p <ID>` can FOR-loop over the room with MPDAMAGE or MPCAST. None of them gives each target its own saving throw, damage formula, cast message, POSTCASTAFFECT and POSTCASTABILITY.\n\n**Add.** A field TARGETMODE, built on properTargets, with the values SINGLE (default), ALLENEMIES, ALLALLIES (the caster's group in the room), ALLINROOM or GROUPANYWHERE. Each target goes through the existing steps: target mask, cast message, saving throw, damage or heal formula, HERESTATS, public effects, extra castings and the script's cast event. Optional fields: a MAXTARGETS formula, and an AOEMSG shown once before the messages for each target.\n\n**Example.** Thunderclap has TARGETMODE=ALLENEMIES, damage 2d6+@x1/2, and public effect Spell_Deafness for 3 ticks. A party song, Marching Cadence, has TARGETMODE=ALLALLIES and HERESTATS for move regeneration.", "d": "yes", "note": ""}, {"id": "P5", "theme": "P", "title": "Achievement rewards: SCRIPT, EFFECT, FACTION, VAR and RECIPE", "kind": "data file (achievement rewards)", "value": "high", "effort": "medium", "body": "**Today.** Achievement REWARDS have 13 types: QP, XP, CURRENCY, TITLE, ABILITY, EXPERTISE, STAT, NOPURGE, CLANXP, CLANCURRENCY, TATTOO, ITEM and MOB. Story consequences need detours. A recipe is an ITEM reward of a catalog GenRecipe item. A permanent passive is an autogain ABILITY reward: a GenAbility set to AUTOINVOKE with HERESTATS, whose script can also run ONCE_PROG with MPFACTION or MPSETVAR, though the auto-invoked copy is not saved, so that ONCE_PROG runs again at every load unless the script guards it. A TATTOO reward can be tested later with hastattoo() and masks. FACTION, SCRIPT, VAR and a timed EFFECT do not exist as rewards.\n\n**Add.** New reward types:\n- `SCRIPT(LOAD=progs/x.script)` or an inline script, run once on the player with ONCE_PROG or FUNCTION_PROG ONACHIEVE;\n- `EFFECT(ID=Prop_Adjuster PARMS=\"con+1\" TICKS=0)`, permanent when TICKS=0;\n- `FACTION(ID=elves.ini AMOUNT=500)`;\n- `VAR(NAME=chapter VALUE=2 SCOPE=*)`, a script variable;\n- `RECIPE(SKILL=Weaponsmithing NAME=\"rune blade\")`.\n\nThe ACHIEVEMENTS command shows what each reward gives. [ACCOUNT] (profile) achievements may give these rewards to every later character.\n\n**Example.** Friend of the Grove (QUESTOR, three grove quests) gives 1000 FACTION elves.ini, a permanent EFFECT Prop_Resistance (poison 10%), and a SCRIPT that changes the elder's next greeting.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST29 (Alternatives for running a script when an achievement is earned: an ACHIEVE_PROG trigger or a SCRIPT reward); Q10 (Both extend Achievements.parseAwards' award syntax (FACTION, catalog ITEM, SCRIPT, VAR, RECIPE)); CR4 (P5's RECIPE reward needs a place to keep known recipes, which CR4's Prop_KnownRecipes is).", "d": "yes", "note": ""}, {"id": "P6", "theme": "P", "title": "Character origins (backgrounds) as data", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** An origin can be scripted. `CHARCREATIONSCRIPTS=FACTIONS:LOAD=progs/origin.script` runs a ONCE_PROG before the start room is set. The script picks an origin with MPCHOOSE, records it with MPTATTOO, and gives items, skills, standing and money (MPOLOAD, MPENABLE, MPFACTION, MPMONEY). Then `START_MASK=TempleOfAsh#0=-TATTOO +ORIGIN_ORPHAN` sets the start room. Nothing lists or describes origins, and the parts sit in coffeemud.ini and resources/progs, not in the world. STARTINGITEMS splits by race only.\n\n**Add.** A file `world/data/origins.ini`. Each origin has:\n- NAME, DESCRIPTION, and MASK (the races and classes allowed);\n- UNLOCK, an account tattoo such as ORIGIN_EXILE, given by profile achievements;\n- START (room ID), ITEMS (catalog names with counts), ABILITIES (ID and proficiency), FACTIONS (ID and amount), TATTOOS and MONEY;\n- SCRIPT (a ONCE_PROG).\n\nWhen origins exist, character creation adds an ORIGIN step after class. A CHARCREATIONSCRIPTS code ORIGIN runs old-style scripts after it.\n\n**Example.** Temple Orphan, for humans and half-elves, starts at the Temple of Ash. It gives a worn prayer book, Prayer_Bless at 25%, +1000 Faith of Ash and the tattoo ORPHAN, so the head priest greets them by name.\n\n*See also:* P7, P12 (P6's ORIGIN step and P7's KIT step slot into P12's data-driven creation steps).", "d": "yes", "note": ""}, {"id": "P7", "theme": "P", "title": "Starting kits by class, origin or mask, with a choice of kit", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** STARTINGITEMS splits by race prefix and accepts catalog names. Class outfits are fixed per GenCharClass (OUTFIT, stored as full item XML). There are workarounds:\n- a kit by any mask: a [PLAYER] JUSTBE achievement with PLAYERMASK and an ITEM reward, but JUSTBE is checked periodically, so the kit arrives a little after creation;\n- a menu of kits: a `CHARCREATIONSCRIPTS=CLASS` ONCE_PROG with BASECLASS, MPCHOOSE and MPOLOAD.\n\nNothing declares kits as data or puts their items on.\n\n**Add.** A thin data layer over these routes: `world/kits.ini`, or STARTINGKIT_n keys, for example `KIT=\"Soldier's kit\" MASK=\"-BASECLASS +Fighter\" CHOOSE=fighter ITEMS=\"1 \\\"a short sword\\\", 1 \\\"a leather jerkin\\\"\" MONEY=\"20 gold coins\" WEAR=YES`. Items can be catalog names, class IDs or LOAD= items. Every kit whose mask matches is given. Kits that share a CHOOSE group are offered as a menu, in a KIT step (P12) or right after CLASS.\n\n**Example.** Fighters choose \"sword and shield\" or \"two-hander\". Every dwarf also gets a mining pick. Characters tattooed ORIGIN_NOBLE get a signet ring and a better cloak.\n\n*See also:* P6, P12 (P6's ORIGIN step and P7's KIT step slot into P12's data-driven creation steps); P8, DT16 (DT16's kit files and TESTCHAR overlap P7's starting kits (both under world/kits) and P8's ready-made characters; share one format).", "d": "yes", "note": ""}, {"id": "P8", "theme": "P", "title": "Ready-made characters (templates) offered by NEW", "kind": "data file and world option", "value": "high", "effort": "medium", "body": "**Today.** Creation always goes through race, gender, stats and class. A fixed hero is possible with workarounds. `DISABLE=CHARCRRACE,CHARCRGENDER,CHARCRCLASS,CHARCRSTAT` picks at random among the allowed choices. With one race available and `CLASSSYSTEM=NO-[ClassID]`, those picks are fixed. A `CHARCREATIONSCRIPTS` END ONCE_PROG then sets stats, skills, items, tattoos and the description, and MPCHOOSE can offer preset bundles. IMPORT reads characters from XML, but NEW does not offer them. The player always types the name.\n\n**Add.** Catalog mobs in category PLAYERTEMPLATE, or in `world/templates.cmare`.\n- With `CREATIONTEMPLATES=OFFER`, NEW lists them, each with a one-line pitch, next to \"make your own\". With ONLY, they are the only route.\n- Picking one copies race, gender, class and level, stats, abilities and their proficiency, expertises, factions, tattoos, items, money and description.\n- `LOCK=NAME,GENDER` keeps fields fixed. `NAME=RANDOM` draws a name.\n- Builders edit templates in builder mode like any catalog mob.\n\n**Example.** In a detective world you always play Inspector Hale (LOCK=NAME). A dungeon crawler offers six ready-made adventurers for a quick party, next to custom creation.\n\n*See also:* P7, DT16 (DT16's kit files and TESTCHAR overlap P7's starting kits (both under world/kits) and P8's ready-made characters; share one format); S10 (Both use world/templates.cmare, for player templates and for builder templates).", "d": "yes", "note": ""}, {"id": "P9", "theme": "P", "title": "MPRECRUIT: an NPC met in the world joins the profile", "kind": "script command and property", "value": "high", "effort": "medium", "body": "**Today.** Companions met in the world can only be followers or hirelings (Follower, Hireling), and they stay NPCs. The player cannot SWITCH to them, they do not level as players, and the party save does not keep them. The only NPC-to-player conversion is hard-coded in Age.java, for a grown-up baby. MPPLAYERCLASS only changes the class. A JavaScript block could repeat the Age.java steps through CMLib, but that is fragile.\n\n**Add.** `MPRECRUIT <npc> <player> [PARTY|REST] [NAME=...]`. It makes a player character from the NPC and keeps race, class and level, stats, abilities, effects, inventory, factions, tattoos and description. It adds the character to the profile, which then either joins the party or rests. It refuses with a message if the profile or party is full (P10) or the name is taken. Party.bringIn already applies the existing caps. Also add a property `Prop_Recruitable` (MASK=, MESSAGE=, COST=), so the player can type RECRUIT MIRA with no script, and the same call for JavaScript.\n\n**Example.** You free the ranger Mira from the goblin cave. When you ask her to join, her SPEECH_PROG answers \"I'll travel with you\" and runs `MPRECRUIT $i $n PARTY`. SWITCH MIRA then plays her.\n\n*See also:* N13 (later) (Companion NPCs (N13 (later)) and recruiting an NPC into the profile (P9) are alternatives for NPC party members); P10 (P9's recruit refuses when P10's profile or party size is full).", "d": "yes", "note": ""}, {"id": "P10", "theme": "P", "title": "World rules for the profile and party: size, new characters, roles, cheats", "kind": "world option", "value": "high", "effort": "medium", "body": "**Today.**\n- `COMMONACCOUNTSYSTEM=n` caps the profile, but n must be above 1, so a world with one character only is not possible. The reward \"1 ACCOUNT BONUSCHARLIMIT\" raises the cap.\n- `MAXCONNSPERACCOUNT=n` caps how many of the profile's characters are in the world at once, party members included. When it refuses a PARTY ADD, the message goes to the new member's own session, and the player sees only a generic failure.\n- `DISABLE=NEWCHARACTERS` blocks the first character too.\n- There are no party roles and no cheat setting (PLAN.md:441-442).\n\n**Add.** Settings in the ini or in `world/rules.ini`:\n- PARTYMAX=n, the most characters in the party at once, and PROFILEMAX=n;\n- NEWCHARS=ALWAYS|FIRSTONLY|CHEAT|MASK, with the mask checked on the leader, e.g. \"+ROOMSTR(Adventurers' Guild)\", and a NEWCHARMESSAGE explaining where to go;\n- PARTYROLES=\"healer:-BASECLASS +Cleric +Druid; scout:-BASECLASS +Thief\", warned about at NEW and PARTY;\n- a command, CHEAT ON/OFF, kept in the save and shown in SAVES; it unlocks NEWCHARS=CHEAT and other options marked as cheats.\n\nAlso fix the lost refusal message.\n\n**Example.** A lone-wolf world sets PARTYMAX=1 NEWCHARS=FIRSTONLY. A dungeon crawler sets PARTYMAX=4 NEWCHARS=MASK, so new characters are made only at the Adventurers' Guild.\n\n*See also:* P9 (P9's recruit refuses when P10's profile or party size is full); S3, S6 (P10's world/rules.ini, S14 (now in S6)'s rules.ini and S3's world.ini are one world rule file).", "d": "yes", "note": ""}, {"id": "P11", "theme": "P", "title": "Prop_Discovery: XP and marks for discoveries, once per character, party or profile", "kind": "property and world option", "value": "high", "effort": "medium", "body": "**Today.** Once-per-character room XP needs two properties. `Prop_EnterAdjuster \"experience+150 MASK=+TATTOOS -FOUND_GROTTO\"` pays those without the tattoo, and `Prop_TattooAdder \"FOUND_GROTTO\"` adds the tattoo after entry (ACCOUNT tattoos too). Other triggers need scripts (LOOK_PROG, OPEN_PROG, EXECMSG_PROG READ, GREET_PROG) using HASTATTOO, MPTATTOO and MPEXP. Achievements such as ROOMENTER, EXPLORE and AREAVISIT live in resources/. Missing: a single property for all of this, once per party, a \"hidden thing found\" trigger, and XP for every room seen for the first time.\n\n**Add.** A property Prop_Discovery, for rooms, exits, items or mobs:\n- XP=150, or XP=10% of the level's span;\n- ON=ENTER|LOOK|READ|OPEN|GET|FIND|TALK, where FIND means a hidden thing was found;\n- ONCE=CHARACTER|PARTY|PROFILE;\n- MESSAGE=, TATTOO=, MASK= and a JOURNAL line.\n\nThe XP is tagged DISCOVERY:, so XPMOD can scale it. A world option `DISCOVERYXP=<formula>` pays for each room a character enters for the first time.\n\n**Example.** The grotto behind the waterfall gives 150 XP the first time anyone in the party enters. Reading the ancient tablet gives 40 XP and the tattoo LORE_TABLET, which an NPC asks about later.\n\n*See also:* ST3, PR3 (Three hooks on a character's first entry to a room (a trigger, once-only text, discovery XP) that can share one first-visit flag); I11 (P11's ON=FIND discovery XP fires when a hidden thing is found, as I11's discoveries are).", "d": "yes", "note": ""}, {"id": "P12", "theme": "P", "title": "Creation steps and questions as data", "kind": "data file", "value": "high", "effort": "large", "body": "**Today.** Creation is a fixed Java state machine, and the order of its steps cannot change. There are partial routes:\n- A faction works as a question: AUTOCHOICES with zapper masks, a CHOICEINTRO screen, and range names as the answers. `START_<range code>` and -FACTION masks then use the answer.\n- `CHARCREATIONSCRIPTS` at RACE, GENDER, STATS, CLASS, FACTIONS or END runs a ONCE_PROG that can use MPCHOOSE or MPPROMPT (see `resources/progs/chardesc.script`). But the mob is moved to a random room, and the player cannot go back to a question.\n\n**Add.** A file `world/creation.ini`.\n- `STEPS=RACE,GENDER,ORIGIN,STATS,CLASS,KIT,FACTIONS,DEITY,REVIEW` sets the order. Each standard step can be SKIP or RANDOM, replacing the CHARCR* DISABLE flags. At REVIEW the player can go back to a step.\n- A custom step: `[ORIGIN] PROMPT=\"Where were you raised?\" INTRO=text/origin.txt SHOWIF=<zapper>`, then CHOICE lines. Each has NAME, HELP, MASK and EFFECTS in the achievement reward syntax, plus FACTION=, START= and SCRIPT=LOAD=. The script runs in the character's real room.\n- Each answer is stored as a tattoo (CHARCR_ORIGIN_NOBLE).\n\nP6 and P7 can build on it.\n\n**Example.** \"Origin: Noble / Farmhand / Street urchin\". The noble gets +1 CHA and 50 gold and starts in the manor. The urchin gets Thief_Swipe at 25% and starts at the docks, and the cooper greets urchins differently (HASTATTOO).\n\n*See also:* P6, P7 (P6's ORIGIN step and P7's KIT step slot into P12's data-driven creation steps); P27 (P27's REVIEW with BACK is the REVIEW step of P12).", "d": "yes", "note": ""}, {"id": "P13", "theme": "P", "title": "Picks at level-up and at creation: perks, traits and flaws", "kind": "data file", "value": "high", "effort": "large", "body": "**Today.** A level-up gives fixed gains. The only choice is how to spend trains and practices. Perks can be built today:\n- a GenAbility, passive and AUTOINVOKE, with MOCKABILITY or HERESTATS;\n- listed in allqualifylist.txt [EACH] with a level, MASK= and REQUIRES=;\n- priced in SKILLCOST (\"Perk_Tough 1 TRAIN\");\n- learned from a MOBTeacher, or given by an achievement.\n\nFlaw-like effects exist too (SlowLearner, BadReputation, Allergies). Missing: a schedule of picks with its own currency, traits and flaws bought with points at creation, and a screen that shows locked perks with the reason.\n\n**Add.** A file `world/perks.ini`.\n- Each perk: `PERK_TOUGH NAME=\"Tough\" POOL=GENERAL MASK=\"-LEVEL +>=3\" REQUIRES=PERK_HARDY COST=1 REWARDS=\"20 HITPOINTS 1 SAVE_POISON\"`.\n- The schedule: `PICKS=\"GENERAL every 3 levels; CLASS:Fighter at 1,5,10\"`.\n- At creation, `TRAITS=2`; flaws have a negative COST and give points back.\n- PERKS lists available, owned and locked perks. PERK <name> takes one.\n- Taken perks are tattoos, with a function HASPERK() and a command MPPERK.\n\n**Example.** At levels 3, 6 and 9 the player picks Pack mule (+50% carry), Night eyes (infravision) or Silver tongue (better shop prices). At creation, the flaw Bad back pays for the trait Lucky.", "d": "yes", "note": ""}, {"id": "P14", "theme": "P", "title": "GenAbility action costs and components in the ability's record", "kind": "data file (GenAbility fields)", "value": "medium", "effort": "small", "body": "**Today.** A GenAbility's action cost can be set only in coffeemud.ini, in the DEFABLETIME and DEFCOMABLETIME exception lists (\"Spell_Emberbrand 2.0, 0.10\"). `StdAbility.castingTime` and `combatCastingTime` read these lists. GenAbility has no cost field, while GenCommand has ACTCOST and CBTCOST. Components are kept only in `resources/skills/components.txt`, edited with CREATE/MODIFY COMPONENT. A reagent can also be checked by CASTMASK with -ITEM or +ITEM, and used up with MPJUNK in the script. Neither the cost nor the components travel with the spell in custom.cmare.\n\n**Add.** New fields on GenAbility, GenTweakAbility and the craft and gather skills:\n- ACTIONCOST and COMBATACTIONCOST, in actions, with -1 for the default;\n- COMPONENTS, in the syntax of a components.txt line, e.g. `(held:consumed:1:ember shard:)`.\n\nThe component library reads an ability's COMPONENTS field before components.txt.\n\n**Example.** Greater Ward takes 2.0 actions in combat and uses up a pinch of salt from the caster's pack. Both are set in the spell's own record.", "d": "yes", "note": ""}, {"id": "P15", "theme": "P", "title": "Starting level for characters made later in the game", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** Every new character starts at level 1, and no STARTLEVEL setting exists. Two routes give a head start through real level-ups. First, an [ACCOUNT] achievement: its REWARDS (\"N XP\", TRAINS, PRACTICES, items) go to each new character at creation, and a story script can unlock it with MPACCTATTOO or MPACHIEVE. Second, a `CHARCREATIONSCRIPTS` END ONCE_PROG can run `MPEXP $i n`. Neither can follow the party's level.\n\n**Add.** A setting `NEWCHARLEVEL=1|N|PARTYMIN|PARTYAVG|LEADER-n`. It is applied after creation through real level-ups, as CHARGEN does, so HP, practices, trains and autogain skills are granted. An optional setting `NEWCHARXP=keep|floor` goes with it. Kits with -LEVEL masks (P7) can then give gear for the level.\n\n**Example.** The party is level 9 when a cleric is created. With NEWCHARLEVEL=PARTYMIN-1 the cleric joins at level 8, with eight levels' worth of trains and practices to spend.\n\n*Re-checked against the code after writing: accurate.*", "d": "yes", "note": ""}, {"id": "P16", "theme": "P", "title": "Teachers gated by mask, rank and price, and a TEACHLIST view", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** Every NPC starts with the NOTEACH attribute. Only mobs with MOBTeacher, Prop_Trainer or Prop_StatTrainer, or of the Teacher class, can teach or TRAIN. So a setting allowing only marked trainers is not needed. One bug: TRAIN takes the first mob in the room even when it refuses, so the player must name the trainer. MOBTeacher already limits skills by its ID list, and proficiency by its N% parameter. SKILLCOST sets prices per skill. Gating students needs a CNCLMSG_PROG on each teacher for TEACH, PRACTICE or TRAIN, with IF, MPECHOAT, RETURN CANCEL and MPMONEY.\n\n**Add.** New parameters for MOBTeacher and Prop_Trainer:\n- STUDENTMASK=\"<zapper>\" and REFUSEMSG=\"...\";\n- SKILLMASK.<AbilityID>=\"<zapper>\" for each skill;\n- PRICE=\"5 gold per level\", added to the normal cost;\n- HIDDEN=skill list.\n\nThe masks also gate PRACTICE and GAIN. A TEACHLIST command shows what this teacher offers you. TRAIN should skip a trainer that refuses.\n\n**Example.** Brother Aldous teaches Bless to any Acolyte of the temple. He teaches Sanctuary only to Priests, with `SKILLMASK.Prayer_Sanctuary=\"-CLANRANK '+Temple of Arden>=PRIEST'\"`. He refuses anyone whose temple standing is Shunned.", "d": "yes", "note": ""}, {"id": "P17", "theme": "P", "title": "Trains and practices per level as formulas", "kind": "world option, data file", "value": "medium", "effort": "small", "body": "**Today.** Each level gives one train, and floor(WIS/6) practices plus the class's LVLPRAC. GenCharClass has LVLPRAC, FSTPRAC and FSTTRAN, and its HP, mana and move gains are already formulas. GenRace has no train or practice fields, and the ini has no formula for either. A global LEVEL_PROG with MPTRAINS or MPPRACS can add or take back points on chosen levels, and TRAINCOSTS converts one into the other.\n\n**Add.** Ini keys FORMULA_TRAINSPERLEVEL and FORMULA_PRACTICESPERLEVEL: @x1 the new level, @x2 WIS, @x3 INT, @x4 the class bonus, @x5 the race bonus. Optionally TRAINSATLEVELS=\"1:3, 5:2, 10:2\" for bursts at chosen levels. New fields: LVLTRAIN on GenCharClass; TRAINS1, PRACS1, LVLPRAC and LVLTRAIN on GenRace.\n\n**Example.** A low-power world gives a train every second level and a flat 2 practices a level. Elves get 2 extra practices at level 1, humans an extra train.\n\n*See also:* JS23 (JS23's practicesForLevel and trainsForLevel override P17's per-level formulas; they are alternatives).", "d": "yes", "note": ""}, {"id": "P18", "theme": "P", "title": "Creation screens that follow the content, with locked choices shown", "kind": "presentation", "value": "medium", "effort": "small", "body": "**Today.** After races.txt and classes.txt, the creation prompt already lists the races and classes that qualify, builder-made GenRace and GenCharClass included, and typing one shows its HELP. But the intro texts are static, classes.txt is printed raw (not even through TextMacros.filter), and the only list macro is @RaceList@, names only. Races locked behind a RACE_ profile tattoo are hidden silently.\n\n**Add.** Filter classes.txt through TextMacros. New macros: @ClassList@, @RaceList?FORMAT=TABLE@ (name and the first line of HELP), @DeityList@, @StatList@ (ADDCHARSTAT stats included) and @if?Tattoo=RACE_DROW@. A SHOWLOCKED=YES setting and an UNLOCKHINT field on GenRace and GenCharClass list a locked choice with its hint.\n\n**Example.** Until the Underdark quest is finished in some game of the profile, the race screen shows \"Drow (locked: reach the Underdark)\". After that, the RACE_DROW tattoo makes it pickable.", "d": "yes", "note": ""}, {"id": "P19", "theme": "P", "title": "Summons as a GenAbility field", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** Summoning needs Java: stock spells such as Spell_SummonMonster build their mob in code. GenAbility has no summon field, and no Prop_ spawns a mob. A script can do it with MPMLOAD, MPFORCE follow, and MPPURGE in an IMASK_PROG p UNINVOKE-<ID> and on the summoner's death. That is fragile, and since followers are saved with the player (PLAN 4d), a missed cleanup is saved too.\n\n**Add.** GenAbility fields SUMMON=<catalog mob name or class>, SUMMONCOUNT and SUMMONLEVEL (formulas, @x1 the caster's level), and SUMMONFLAGS (FOLLOW, ASSIST, NOSAVE, DISMISSONEXPIRE, BIND to the caster). The summon lives while the effect lasts, leaves with the UNINVOKEMSG, and is a follower for party turns and AUTOASSIST.\n\n**Example.** A druid-like class's \"Call the Pack\" summons 1+@x1/10 grey wolves from the catalog for 20 ticks. They follow and assist, and go when the effect ends.", "d": "yes", "note": ""}, {"id": "P20", "theme": "P", "title": "GenDisease: diseases as data", "kind": "data file, builder tool", "value": "medium", "effort": "medium", "body": "**Today.** There are 141 Java diseases and no generic one, and CREATE has no DISEASE. A GenAbility with CLASSIFICATION=DISEASE already counts for Prayer_CureDisease and about 31 other checks, and HERESTATS, TICKAFFECTS, TARGETMASK, a script and Prop_HereSpellCast on rooms cover much. It lacks DiseaseAffect: difficultyLevel, which cures compare with the caster's level, spread through Disease.catchIt, a DELAY between effects, and convertAbilityToGeneric for diseases.\n\n**Add.** GenDisease, a GenAbility subclass implementing DiseaseAffect, and CREATE DISEASE. Fields: TICKS formula, DELAY, SPREAD (STD, CONTACT, PROXIMITY, CONSUMPTION, DAMAGE, GET, HEARING, INHERITED), CATCHCHANCE, DIFFICULTY, STARTMSG, AFFECTMSG, DONEMSG, ADJUSTMENTS, DAMAGE per delay, EFFECTS (Prop_SpellAdder syntax), IMMUNEMASK, MALICIOUS, SCRIPT, HELP.\n\n**Example.** Ash Lung spreads by proximity in the Cinder Mines: CON -2, a cough every 5 ticks, 1d4 damage. Prayer_CureDisease cures it at difficulty 12, and dwarves are immune.", "d": "yes", "note": ""}, {"id": "P21", "theme": "P", "title": "Scripts on poisons, tweaks and trade skills", "kind": "data file, script trigger", "value": "medium", "effort": "medium", "body": "**Today.** Only GenAbility, GenTrap and GenCommand take a SCRIPT. Race and class logic already works through effects: a scripted GenAbility listed as a GenRace racial effect (NUMREFF, GETREFF) runs on every mob of the race, players included, and an AUTOINVOKE one given as a level 1 autogain (GETCABLEGAIN) does the same for a class. Crafting sends TYP_ITEMGENERATED, so EXECMSG_PROG ITEMGENERATED sees the made item as $t. GenPoison, GenTweakAbility and the trade skill records have no script, and there is no event for a failed craft.\n\n**Add.** SCRIPT on GenPoison (ONAFFECT, ONTICK, ONCURE), on GenTweakAbility (see the TWEAK item), and on GenCraftSkill and GenGatheringSkill (ONCRAFTED with $o the new item, ONFOUND, ONFAILED). As a convenience, SCRIPT on GenRace and GenCharClass, run as a hidden, unsaved effect.\n\n**Example.** The gathering skill Ember Mining has an ONFOUND that rarely spawns an ember sprite.\n\n*See also:* ST13 (ST13's CRAFT_PROG and P21's ONCRAFTED and ONFAILED skill scripts are alternative hooks on the same crafted or ruined item); JS23 (JS23 says it complements P21's SCRIPT field on GenRace and GenCharClass); P3, P22 (Named script hooks (CANCAST, ONCAST, ONTICK, ONEXPIRE) on GenAbility, GenTweakAbility, GenPoison and trade skills; one hook design).", "d": "yes", "note": ""}, {"id": "P22", "theme": "P", "title": "Masks, effects and scripts on TWEAK abilities", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** GenTweakAbility renames a Java ability and overrides its triggers, cost, range, cooldown and messages (codes 0-17), with no masks, effects or script. A GenAbility wrapper keeps the Java behaviour (CASTMASK \"-LOCALE +OUTDOORS\", POSTCASTABILITY \"Spell_Lightning\" through Prop_SpellAdder), but under a new ID, so class qualifications and scrolls must name the wrapper. Prop_RestrictSpells or a CNCLMSG_PROG can forbid a spell in places.\n\n**Add.** On GenTweakAbility, keeping the original ID: CASTMASK and TARGETMASK (zapper, checked before delegating); POSTCASTABILITY and POSTCASTAFFECT (Prop_SpellAdder syntax, after a successful invoke); a SCRIPT with CANCAST, ONCAST and ONEXPIRE functions; DAMAGEMULT and DURATIONMULT, applied in okMessage to messages whose tool is this ability.\n\n**Example.** Stormcall is a TWEAK of Spell_Lightning: CASTMASK -LOCALE +OUTDOORS, Fighter_Trip cast as well 20% of the time, and a script raising DAMAGEMULT to 1.25 in thunderstorms.\n\n*See also:* P3, P21 (Named script hooks (CANCAST, ONCAST, ONTICK, ONEXPIRE) on GenAbility, GenTweakAbility, GenPoison and trade skills; one hook design).", "d": "yes", "note": ""}, {"id": "P23", "theme": "P", "title": "Retraining with refunds", "kind": "property, script command", "value": "medium", "effort": "medium", "body": "**Today.** REMORT, gated by REMORTMASK (say -TATTOOS +RESPEC_TOKEN) with REMORTRETAIN keeping LEVELS, RACE and GENDER, already gives a full respec through real level-ups. Prop_ReRollStats (BONUSPOINTS=, PICKCLASS=TRUE) redoes stats and class once but refunds no trains. A script can MPDISABLE a skill and refund by hand with MPTRAINS or MPPRACS. Nothing records what a purchase cost, so a fair, selective refund cannot be made.\n\n**Add.** PlayerStats records each purchase: ability, expertise or stat, cost type, amount, level. Prop_Respec on an NPC, item or room: WHAT=STATS|SKILLS|EXPERTISES|CLASS|ALL, COST=\"500 gold\" (per skill or whole), ONCE=YES, MASK=. A RESPEC command lists refundable purchases, removes those chosen (autogain skills stay) and refunds trains and practices. MPRESPEC does the same from a script.\n\n**Example.** The Oracle of Mists gives one free full respec after the tutorial island, then charges 500 gold a skill.", "d": "yes", "note": ""}, {"id": "P24", "theme": "P", "title": "SKILLTREE view with prerequisites and hints", "kind": "presentation", "value": "medium", "effort": "medium", "body": "**Today.** QUALIFY lists what can be learned now, with its cost, and hides skills with unmet prerequisites. WILLQUALIFY [level] [class] lists by level, hiding SECRET and unmet MASKED skills. Prerequisites appear only in HELP <skill>, through formatPreRequisites, or when learning fails. Nothing shows the REQUIRES chain, and no field can hint where a skill is taught.\n\n**Add.** A SKILLTREE [class|skill] command: the class's skills grouped by REQUIRES chain, each marked learned (with proficiency), learnable now (with cost), locked (the unmet level, prerequisite or mask, worded as formatPreRequisites does) or hidden. Optional fields in allqualifylist and GenCharClass abilities: HINT=\"Taught by the hermit of Greyfen\", and SHOW=HINT, which shows a masked skill's name and hint without its mask.\n\n**Example.** A ranger sees Tracking > Hunting (50%) > Camouflage (locked: needs Hunting at 50%), and a line \"??? - seek the Druid circle in the Fernwood\".", "d": "yes", "note": ""}, {"id": "P25", "theme": "P", "title": "Rank ladders", "kind": "data file, script command, script function", "value": "medium", "effort": "medium", "body": "**Today.** A rank can already be a tattoo (MPTATTOO), a faction range or a clan position (MPSETCLAN, CLANRANK()), and masks gate skills, Prop_ReqTattoo and shops on it. titles.ini gives titles by mask and achievements give one-time rewards. But AutoAwards effects check their mask only at login, so a promotion's effects wait; faction AFFBEHAV is for mobs only; and no ladder is shown.\n\n**Add.** A world/ranks.ini: LADDER=GUILD NAME=\"Thieves' Guild\" RANKS=\"Footpad, Cutpurse, Shadow, Master\", and per rank REQUIRES=<mask> or promotion by hand, REWARDS (achievement syntax, once), EFFECTS held while at the rank, and TITLE. The rank is a tattoo (GUILD_2). Add MPRANK $n GUILD +1/-1/=3, RANK($n GUILD), a RANKS command, a RANKUP achievement event, and optional FACTION=id.\n\n**Example.** In a world without levels, the Order of the Lantern unlocks prayers by rank with MASK=+TATTOOS +LANTERN_3. Quests promote with MPRANK; RANKS shows \"Lantern-bearer (3/5): next rank needs the Vigil of Ash\".\n\n*Re-checked against the code after writing: accurate.*\n\n*See also:* F9 (Alternatives for ranks earned by deeds: a tattoo rank ladder or clan positions with MERIT promotion).", "d": "yes", "note": ""}, {"id": "P26", "theme": "P", "title": "Effects for added stats", "kind": "world option", "value": "medium", "effort": "medium", "body": "**Today.** ADDCHARSTAT adds a stat that is shown, rolled and trainable but does nothing by itself. FORMULA_ keys get fixed positional parameters (getMaxCarry builds a fixed array), and class and race code read the six stats by constant. Scripts read an added stat with STAT($n LUCK), and the IFSTAT mask tests it, but only for equality. AutoAwards can give step effects with such masks, checked at login.\n\n**Add.** @STAT(NAME) and @BASESTAT(NAME) in every FORMULA_ key. STATEFFECT_<STAT> ini entries mapping points to effects, applied on recover to char stats, phy stats or state, for example STATEFFECT_LUCK=\"per point over 10: +1 SAVE_GENERAL, +1 CRITCHANCE%\". Test and document REPLACECHARSTAT for renaming, so the screens and stats.txt follow.\n\n**Example.** A world adds LUCK: each point over 10 gives +1 to all saves, and a loot script reads it for rare drops. Charisma is renamed Presence.", "d": "yes", "note": ""}, {"id": "P27", "theme": "P", "title": "Creation review with BACK, and a QUICK NEW", "kind": "presentation", "value": "medium", "effort": "medium", "body": "**Today.** After the last step, creation goes straight to \"Character creation complete!\". Each step only confirms itself (Y/n), and the code has no BACK. A mistake two steps back means RETIRE and starting over, or a one-time Prop_ReRollStats (stats and class, PICKCLASS=TRUE) in the start room or on an NPC. The CHARCR* DISABLE flags pick at random for every character, not for one NEW.\n\n**Add.** A REVIEW step showing the sheet: race, gender, stats, class, faction choices, custom answers, kit, start room. BACK <step> redoes that step and every later step that depends on it; DONE finishes. NEW <name> QUICK fills each unanswered step at random, or from a template.\n\n**Example.** The review shows \"Drow Mage, STR 9 ...\". The player types BACK CLASS and becomes a Thief without rolling the stats again.\n\n*See also:* P12 (P27's REVIEW with BACK is the REVIEW step of P12).", "d": "yes", "note": ""}, {"id": "P28", "theme": "P", "title": "EXPDEFER and RPAWARDS timers on game time", "kind": "world option", "value": "low", "effort": "small", "body": "**Today.** The EXPDEFER \"every N mud-hours\" timer, on both the timed and the COMMAND paths, and the RPAWARDS interval compare System.currentTimeMillis() with PlayerStats lastXPAward, and the award sets that from the wall clock. Phase 3 moved game logic to core/GameTime but missed these lines. In turn-based or paused play, held XP is released by real time.\n\n**Add.** Use GameTime.now() for lastXPAward and for the deferral checks. The value is already saved with the character (LASTXPAWARD is a PlayerStats code), so only the clock source changes.\n\n**Example.** A turn-based world where experience settles at dawn (EXPDEFER=24 100%) releases it at the in-game dawn, however long the player thinks over each turn.", "d": "yes", "note": ""}, {"id": "P29", "theme": "P", "title": "Ageing as data", "kind": "data file, script trigger, world option", "value": "low", "effort": "medium", "body": "**Today.** Age category effects are hard-coded in StdRace.agingAffects, and the ageing diseases in tickAging; GenRace has only the AGING year chart. There are DISABLE=ALL_AGEING, ISBIRTHDAY(), STAT($n AGENAME) and birthday masks such as +BIRTHDAY, so a DAY_PROG with ISBIRTHDAY can mark a birthday. Nothing fires on a change of age category, and starting age comes only from the race chart.\n\n**Add.** A GenRace field AGEEFFECTS=\"MIDDLEAGED: STR-1 DEX-1 WIS+1; VENERABLE: ...\" that replaces the defaults when set. An ini AGEDISEASES= naming the ageing diseases and their odds. An AGE_PROG trigger and an AGECATEGORY achievement event on each birthday and change of category, with $t the category. STARTAGE=<mask>:<years> entries.\n\n**Example.** In a long campaign, elves keep their stats until ANCIENT, humans gain 1 WIS at middle age, a veteran origin starts older, and the camp script holds a feast on AGE_PROG.", "d": "yes", "note": ""}, {"id": "P30", "theme": "P", "title": "Training that takes game time", "kind": "world option", "value": "low", "effort": "medium", "body": "**Today.** TRAIN, LEARN and PRACTICE cost only a command's action time. The expertise file's #TIME cost is documented but commented out in ColumbiaUniv. The Scholar's Studying skill learns over several ticks, but skills learned that way cannot be used. A trainer's CNCLMSG_PROG TRAIN can MPFORCE $n WAIT n so turn-based time passes, but the character is not busy and nothing interrupts it.\n\n**Add.** A TRAINTIME= ini setting, per TRAINCOSTS entry and per stat; a TIME=\"2 hours per level\" parameter on teachers (MOBTeacher); and the expertise #TIME field put into effect. While training, the character is busy as when crafting, the clock moves on as with WAIT, and an attack interrupts it.\n\n**Example.** Learning Fireball at the archmage's tower takes three in-game days, while the world and a timed quest move on.", "d": "no", "note": "later: moved to LATER.md"}, {"id": "PR1", "theme": "PR", "title": "VARIES text on items, mobs, exits and areas", "kind": "presentation", "value": "high", "effort": "small", "body": "**Today.** Only `StdRoom` runs `CMLib.commands().parseVaries`. On `StdItem`, `StdMOB`, `StdExit` and `StdArea`, the viewer-aware `description(MOB)` and `displayText(MOB)` return the raw text, though `CommonMsgs` already calls them. The workaround is a `LOOK_PROG` or `TIME_PROG` that runs `MPSET $i DESCRIPTION`, which changes the text for everyone. In rooms, moon, combat, hour and month tests already work through `<MASKn>` (`-IF ISMOON(FULL)`, `-IF ISFIGHT($i)`, `+HOURS`, `+MONTHS`), but they are long to write. Nothing tests for a holiday or for being wanted.\n\n**Add.** Run `parseVaries` in those methods and in readable text. Take the clock and climate from the holder's room and area. Every existing tag then works on things. Add short tags as sugar over `MASK`: `<FULLMOON>`, `<NEWMOON>`, `<WAXING>`, `<WANING>` (`TimeClock.MoonPhase`), `<INCOMBAT>`, `<DARK>`, `<HOUR 2-4>`, `<MONTH name>`, `<VAR name=value>`. Two tags are new tests: `<HOLIDAY name>` (ws-holidays) and `<WANTED>`.\n\n**Example.** The old fountain's description: `<VARIES><WINTER>Its basin is a disc of grey ice.<\/WINTER><ELSE>Clear water trickles from a stone fish.<\/ELSE><\/VARIES>`.\n\n*See also:* W1, W26 (later) (W1's +WANTED mask is what W26 (later)'s bounty hunters need and what PR1's <WANTED> tag tests); W6 (Both add a VARIES <HOLIDAY name> tag); PR2, PR16 (PR1's and PR2's new VARIES tags need PR16's VARIES help); PR11 (Both define a <DARK> VARIES tag, with different meanings).", "d": "yes", "note": ""}, {"id": "PR2", "theme": "PR", "title": "VARIES tags for world variables, quests and the party", "kind": "presentation", "value": "high", "effort": "small", "body": "**Today.** World state can already change text: `<MASK1 -IF \"VAR(* BRIDGE == 1)\">` reads the global scope that `WorldState` saves, and the whole party sees the same result. `-QUESTWIN` tests for a quest won, and `&gt;` stands in for `>`. But the syntax is obscure and the VARIES help does not cover it. A lone `+IF` always passes, so the obvious spelling fails without warning. Tattoo masks are per character. Nothing tests for a running quest, a quest step, or a tattoo held by anyone in the party.\n\n**Add.** Short tags that compile to those checks:\n- `<IFVAR name>`, `<IFVAR name=value>` and `<IFVAR name GE 3>` (also EQ, NE, LT, LE, GT), on the `*` scope;\n- `<QUESTWON quest>`, `<QUESTRUNNING quest>` and `<QUESTSTEP quest n>`;\n- `<PARTYTATTOO X>`.\n\nThey nest and pair with `<ELSE>` like the other tags. The tests for a running quest, a quest step and a party tattoo are new.\n\n**Example.** `<VARIES><IFVAR BRIDGE=1>A new plank bridge spans the gorge.<\/IFVAR><ELSE>The bridge hangs in charred ropes.<\/ELSE><\/VARIES>`. The carpenter's quest ends with `MPSETVAR * BRIDGE 1`.\n\n*See also:* PR1, PR16 (PR1's and PR2's new VARIES tags need PR16's VARIES help).", "d": "yes", "note": ""}, {"id": "PR3", "theme": "PR", "title": "First-visit text: FIRSTVISIT tag and Prop_FirstEntry", "kind": "presentation and property", "value": "high", "effort": "small", "body": "**Today.** `<VISITED>` cannot give first-time text. `StdRoom.executeMsg` records the visit (`addRoomVisit`) on entry, before `MUDTracker` shows the arrival look, so `<VISITED>` is already true. There are four workarounds:\n- a room `GREET_PROG +TATTOOS -SAW_THRONE` that runs `MPECHOAT` and `MPTATTOO`; its text comes after the look, a tick later unless `MPSETINTERNAL NODELAY true`;\n- a VARIES `MASK` on that tattoo, plus the same script;\n- a masked `Prop_Sounder` `ENTER`, which cannot set a tattoo;\n- a `ROOMENTER` achievement.\n\n**Add.** A `<FIRSTVISIT>` tag that is true during the arrival look of a character's first entry. Player stats keep a \"this entry was new\" flag until the next move. Also `Prop_FirstEntry` on rooms or areas: `TEXT=` is shown once per character, or once per profile with `ONCE=PROFILE`. Optional `SETVAR=` and `TATTOO=` let scripts react. VARIES is allowed.\n\n**Example.** The throne room: `Prop_FirstEntry TEXT=\"^xThe torches flare as one, and the empty throne seems to turn toward you.^N\" TATTOO=SAW_THRONE`.\n\n*See also:* ST3, P11 (Three hooks on a character's first entry to a room (a trigger, once-only text, discovery XP) that can share one first-visit flag).", "d": "yes", "note": ""}, {"id": "PR5", "theme": "PR", "title": "Title screen, game name and prologue from world data", "kind": "presentation", "value": "high", "effort": "small", "body": "**Today.** The launcher (`SUD.chooseSave`) prints a plain \"Saved games:\" list on stdout, before any colour. Then `resources/text/intro.txt` shows. That file can be replaced, and `@MudInfo?NAME@` expands to `MUD_NAME`, but the launcher passes `CoffeeSUD` as the host name, which overrides the ini's `MUD_NAME`, so the name cannot be set without Java; and it still says \"Powered By CoffeeMud v5.11\". Only the network path picks a random `intro*.txt`. After a new character, only `newchardone.txt` shows. A prologue is possible through `CHARCREATIONSCRIPTS=END:LOAD=progs/x.script`, a `ONCE_PROG` using `MPPROMPT` and `MPECHO`, and coffeemud.ini documents the hook, with `resources/progs/chardesc.script` as a sample `ONCE_PROG` using `MPPROMPT`, but nothing documents using it for a prologue. PLAN phase 1 still lists a title screen as to do.\n\n**Add.** The launcher shows `world/text/title.txt` (colour codes, `@MudInfo?NAME@`, `GAMENAME=` from the ini) with a menu: Continue (latest save), New game, Load (the list), Quit. A new game shows `world/text/prologue.txt` one page at a time, with [Enter] between pages, or runs `PROLOGUE=script` once in the start room. Document the `CHARCREATIONSCRIPTS END` hook as the place for a scripted prologue. An optional `EPILOGUE` text can serve a command that ends the game, such as `MPENDGAME` if it is added.\n\n**Example.** An ASCII skyline and \"Vael: The Ashen Crown\", then \"C) Continue - Ser Aldric, The Mirefen, day 34\". A new game opens with a three-page prologue and wakes the hero in a cell.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* PR12 (Both show story text page by page, waiting for Enter (prologue pages vs MPNARRATE PAUSE)).", "d": "yes", "note": ""}, {"id": "PR6", "theme": "PR", "title": "A lore codex: LORE command, Prop_Lore and MPLORE", "kind": "property, script command and presentation", "value": "high", "effort": "medium", "body": "**Today.** The engine has no codex, bestiary or lore system. Help (`resources/help/*.ini`) is one global table that shows everything from the start, and its `<ZAP=...>` macro hides nothing. The nearest tools are achievements (`SCRIPTED` ones fired by `MPACHIEVE`, listed by `ACHIEVEMENTS`), `GenBook` and `GenReadable` items, tattoos used as flags, and `GenCommand`. None of them has categories, a way to re-read an entry later, or profile scope.\n\n**Add.** Entries go in `world/lore/*.ini` as `KEY=title|category|text`, with VARIES and colour, or as `FILE=`. Three things unlock an entry: `MPLORE $n ADD key`, `Prop_Lore` (`ENTRY=`, `ON=READ|GET|EXAMINE|ENTER|KILL|DEATH`, `MSG=`) on readables, rooms and mobs, and quests. Each unlock is stored as the tattoo `LORE_key`, per character or per profile with `SCOPE=PROFILE`. Saves keep it, and `HASTATTOO` and `+TATTOO` can test it. `LORE` lists categories with counts, `LORE <topic>` reads one entry and `LORE NEW` shows unread ones. Help entries may also take `<MASK=zapper>`, `<LOCKED=teaser>` and `<CATEGORY=>`.\n\n**Example.** Reading the Tablet of Ash adds \"The Sundering\" under History. The sage's script checks `HASTATTOO($n LORE_SUNDERING)` before it tells the next part.\n\n*See also:* I3 (I3's pages carry LORE= keys from PR6's codex).", "d": "yes", "note": ""}, {"id": "PR7", "theme": "PR", "title": "JOURNAL: saved notes, clues and an automatic chronicle", "kind": "script command and presentation", "value": "high", "effort": "medium", "body": "**Today.** `REPLAY` replays only the messages of the current session and is not saved. A builder can hand out a writable `GenBook` or `GenJournal`; its entries live in `CMJRNL`, which saves keep. `CALENDAR ADD` keeps dated events. `COMMANDJOURNALS=` in `coffeemud.ini` can define a journal command, but no script command can write to it. `QUESTS` shows only `INSTRUCTIONS` and `PROGRESS`. Nothing records what happened or what an NPC said.\n\n**Add.** A `JOURNAL` command, with `NOTES` as an alias. It lists entries newest first with the game date, and takes `WRITE text`, `DELETE n`, `SEARCH word` and a category name. The script command `MPJOURNAL $n [category] \"text\"` records who said it, where and when, under categories such as Clues, People, Places and Rumors. Switches in the ini add automatic entries: quest accepted or won, level gained, new area, lore unlocked. Optionally every `TALK` reply with a `[[topic]]` becomes an entry too. If dialogue and rumour systems are added, they can feed it with a `NOTE` flag. The log is kept in player data and saved.\n\n**Example.** The hermit's script runs `MPJOURNAL $n Clues \"The vault opens to the word 'Ashgrove' (the hermit)\"`. Ten game days later, `JOURNAL SEARCH vault` finds it.\n\n*See also:* Q3 (Two journals: Q3's quest log with MPQJOURNAL and PR7's JOURNAL with MPJOURNAL and automatic quest entries); N23 (later), N24, N28 (N23 (later)'s rumours, N24's [[topic]] lines and N28's overheard scenes can write PR7 journal entries); DT26 (Both claim the NOTES command (PR7's JOURNAL alias vs DT26's playtest notes)).", "d": "yes", "note": ""}, {"id": "PR8", "theme": "PR", "title": "Prop_Details: extra descriptions by keyword", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Details are made with scenery items. A `GenItem` gets an empty display text and is made ungettable. `EXAMINE` highlights its name in the room text (`^H`, with an MXP link), `LOOK` shows its description, and a `LOOK_PROG` on it can `MPTATTOO` the viewer. A `CMDFAIL_PROG` can also catch the failed `LOOK`. This works, but each detail is a whole item, and the items clutter saves and the catalog. No property maps keywords to text.\n\n**Add.** `Prop_Details` on rooms, items and mobs: `fountain,basin=A cracked marble basin.;runes,carving=<VARIES>...`. `LOOK`, `EXAMINE` and `READ` try the keywords after real objects fail. Options per detail:\n- `EXAMINEONLY`;\n- `READ=text`;\n- `SETVAR=` or `TATTOO=` on first look, so a quest can require \"has examined the runes\";\n- `HIGHLIGHT`, which colours the keyword in the room text as hidden items are;\n- `MASK=`.\n\nA look at a detail fires `LOOK_PROG` with the keyword.\n\n**Example.** A library: `Prop_Details books,shelves=Rows of mouldering ledgers.;ledger,red ledger=EXAMINEONLY One entry is circled in red: 'Vault, third bell.' TATTOO=CLUE_VAULT`.", "d": "yes", "note": ""}, {"id": "PR9", "theme": "PR", "title": "A map for every player, with fog of war and room glyphs", "kind": "presentation, property and world option", "value": "high", "effort": "medium", "body": "**Today.** `AUTOMAP ON` draws a minimap after each look when `AWARERANGE` is above 0:\n- the ini sets its size for the whole world, not per player;\n- it shows rooms not yet visited;\n- its glyphs come only from the domain type;\n- it stops at indoor rooms.\n\n`MAP` is the Cartography skill (`Skill_Map`), which is limited to some classes and needs paper. The `REGION` skill works outdoors only. `WHERE`, `AREAS`, prompt `%l`/`%L` and `EXPLORED()` draw nothing. Builders cannot mark an inn or a shrine.\n\n**Add.**\n- (a) A free map command: `MAP`, `MAP n` (radius) and `MAP AREA name`. It shows the rooms visited, `*` for you, exits and a legend. It reuses `getMiniMap` with a `DefaultPlayerStats.hasVisited` filter. `Skill_Map` already uses the word `MAP`, so one of the two needs another name.\n- (b) `Prop_MapGlyph` on rooms: `CHAR=I COLOR=y LABEL=\"Inn\" LEGEND`, or `HIDE`.\n- (c) An ini option, `MAPFOG=VISITED|KNOWN|ALL`.\n- (d) `AUTOMAP SIZE n`, set by each player.\n\nAll of it honours `Prop_RoomUnmappable`.\n\n**Example.** In town the inn shows as a yellow `I` and the temple as a white `+`. Unexplored alleys stay blank until walked.\n\n*See also:* B10 (Two MAP commands (a player map with fog of war vs a builder map with IDs), both clashing with Skill_Map's word); PR19 (PR19's revealed rooms are shown by PR9's MAP command).", "d": "yes", "note": ""}, {"id": "PR10", "theme": "PR", "title": "Emoter: conditional, weighted, non-repeating ambient lines", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** `Emoter` picks lines at random with equal odds and can repeat them. It knows `SIGHT`, `SOUND`, `SMELL`, `SOCIAL`, `PUFF`, `INROOM=`, `EXPIRES=` and one `MASK=` for the whole behaviour. It has two bugs:\n- `emoteHere` tests the `MASK=` before `emoter.setLocation(room)`, so time and weather masks are unreliable, and a failed mask silences that tick;\n- `EmoteObj.mask` is never set, so masks per line never apply.\n\nA room holds only one `Emoter`. The workaround is a `RAND_PROG` that tests `ISTIME` or `VAR`, then runs `MPECHO`.\n\n**Add.** Fix both bugs. Masks are checked after the stand-in mob is placed, and an area emoter checks each room's own conditions. Add prefixes per line in `Emoter` and `Sounder`:\n- `DAY`/`NIGHT`/`DAWN`/`DUSK`, `SPRING`..`WINTER` and `RAIN`/`SNOW`/`FOG` (the VARIES names);\n- `INDOORS`/`OUTDOORS` and `IFVAR name=value`;\n- `MASK=\"...\"`, now parsed;\n- `ONCE` (per character) and `WEIGHT=n`.\n\nAdd options `NOREPEAT=k`, `RETRY` (pick again among lines that pass) and an area-level `QUIETAFTER=n` that pauses ambience during combat or reading. The old syntax keeps working.\n\n**Example.** A forest area: `min=8 max=20 chance=40;NIGHT SOUND an owl hoots somewhere above.;IFVAR WOLVES=1 SOUND wolves howl, closer than before.`\n\n*See also:* N22 (Both add per-line time, weather and mask conditions, weights and once or cooldown rules to Sounder).", "d": "yes", "note": ""}, {"id": "PR11", "theme": "PR", "title": "Descriptions for dark rooms", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** When `canBeSeenBy(room, mob)` fails, the title and description are skipped and the player gets \"You can't see anything!\". To be seen, a dark room needs the moon, a light or darkvision. A builder can add `LISTEN` or `FEEL` with `Prop_Socials` (`SRCCODE=S`) and `SNIFF` with `Prop_Smell`. A `LOOK_PROG` can test `CANSEE` and run `MPECHOAT`. But that text comes after the message, not in its place.\n\n**Add.** `Prop_DarkDescription` on rooms: `TITLE=\"Somewhere dark\" DESC=\"...\"`, with VARIES allowed. It is shown in place of \"You can't see anything!\". The other form is a pair of tags, `<DARK>...<\/DARK>` and `<LIT>...<\/LIT>`, honoured even when the room cannot be seen. Exits are still listed when `AUTOEXITS` is on.\n\n**Example.** A flooded crypt: `Prop_DarkDescription TITLE=\"Darkness\" DESC=\"Cold water laps at your knees and something brushes past your leg.\"`\n\n*See also:* PR1 (Both define a <DARK> VARIES tag, with different meanings).", "d": "yes", "note": ""}, {"id": "PR12", "theme": "PR", "title": "MPNARRATE: story text from files, with pauses", "kind": "script command", "value": "medium", "effort": "small", "body": "**Today.** Long story passages have to be written into scripts as `MPECHOAT` lines. `LOAD=` reads only scripts, not text files, and no MOBPROG command echoes a file. Only JavaScript in a `<SCRIPT>` block can call `Resources.getFileResource`. `MPPROMPT $n VAR [Press Enter]` makes a pause, but it blocks the thread. The guide therefore allows it only from player-caused triggers such as `GREET_PROG`, not from tick triggers.\n\n**Add.** `MPNARRATE target file[#section] [PAUSE|NOPAUSE] [STYLE=LORE]`. It reads `world/text/file`, where sections are marked `[name]`. It applies VARIES and `$` variables and shows the text to a player, the room or the area. `PAUSE` waits for [Enter] between paragraphs without blocking a thread. In turn-based time the clock does not move. In real time the game pauses, as `PAUSE` does.\n\n**Example.** The crypt's `ENTRY_PROG` runs `MPNARRATE $n crypt.txt#awakening PAUSE`. Four paragraphs tell of the lich waking, one per Enter.\n\n*See also:* PR5 (Both show story text page by page, waiting for Enter (prologue pages vs MPNARRATE PAUSE)).", "d": "yes", "note": ""}, {"id": "PR
