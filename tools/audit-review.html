\n\n**Also merged here, from T15 (Vessels owned by the whole profile, and MPGRANT for quest rewards).** In `doesOwnThisProperty`, any character of the owner's profile (`Party.profileOf`) counts as owner, for vessels, caravans, castles and land titles. A script command `MPGRANT <property item> <who> [NAME=<new name>]` sets the owner, registers the item with the character so it saves, docks it at the nearest port, and renames it through `Boardable.rename` with no prompt, without the duplicate noted in the item on saving vessels. `MPGRANT <item> NOBODY` undoes it.\n\n*See also:* CR6, CR7 (CR6's ISOWNER and MPDEED and CR7's claims use CR1's profile owner and @PROFILE, and MPDEED and T15 (now in CR1)'s MPGRANT both set an owner from a script).", "d": "yes", "note": ""}, {"id": "CR2", "theme": "CR", "title": "A world materials file with stable codes", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** New resources come only from `ADDMATERIAL_` (and `REPLACEMATERIAL_`) lines in coffeemud.ini, which is engine config, not world/ content. Codes follow the ini's hash order, and items save MTRAL as a bare number. Adding or removing a material can renumber others and silently change what world items, catalog entries and saves are made of. A resource carries one effect, used when eaten raw, and no description.\n\n**Add.** `world/materials.txt`, one row per resource: NAME, FAMILY, VALUE, FREQUENCY, HARDNESS, BUOYANCY, CATEGORY (FISH, BERRY or WOODY), SMELL, EFFECTS, DESCRIPTION and an optional fixed CODE. Other codes are stable: sorted by name, after the built-ins. World XML writes the resource name next to MTRAL, and load cross-checks the two, so a renumbering repairs itself. The ini route stays as a fallback.\n\n**Example.** Starsteel (METAL, value 300, hardness 6) is mined only in the Fallen Star crater through `ResourceOverride(starsteel)`, and Blacksmithing takes it as METAL. Glowcap (VEGETATION, BERRY) casts Spell_Light when eaten.\n\n*See also:* CR15 (Two world data files for resources (materials vs named variants) that should share one format).", "d": "yes", "note": ""}, {"id": "CR3", "theme": "CR", "title": "Workstations and tool wear", "kind": "property and data file", "value": "high", "effort": "medium", "body": "**Today.** The only workstation is a fire. `NEEDFIRE` accepts any burning item, so a hearth with a permanent Burning effect works. components.txt can require a tool (NEARBY, HELD, fate KEPT), but matches only by resource, material or name substring, and a kept tool never wears. Only gathering has a tool bonus (`Prop_ImproveGather`). Only the crafter makes a craft faster, better or higher-level. Their level above the item's and the X-TIME and RUSH expertises shorten it, the QUAL, DURA, LITE and other EnhancedCraftingSkill expertises improve the item, and the ADVN expertise opens higher recipes. No tool, item or room does any of this.\n\n**Add.** (a) Component id `tag:anvil`, matching item tags (CompType TAG). (b) Recipe key `STATION=forge` and a GenCraftSkill field STATION. (c) `Prop_Workstation(TAG=anvil SKILLS=Blacksmithing,Weaponsmithing SPEED=25 PROF=+10 MAXLEVEL=40 QUALITY=+1)` on an item or room, applied when the crafter is in the room with it. (d) Component fate `wear:n`: the tool is kept but loses n uses or condition, and breaks at zero.\n\n**Example.** The home smithy's \"dwarven forge\" (tags forge and anvil) makes Blacksmithing 25% faster and allows level 30+ recipes. A \"travel anvil\" satisfies STATION=anvil with no bonus. A smith's hammer loses 1 condition per craft.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* I26 (Both let worn items break instead of vanishing (a tool's wear:n fate vs ITEMBREAK=BREAK)); CR17, CR20 (CR17's station quality and CR20's ACTS= stations build on CR3's workstations); CR5 (Both add recipe requirement keys (STATION vs MASK, ROOMMASK and TOOL) read by the same recipe parser).", "d": "yes", "note": ""}, {"id": "CR4", "theme": "CR", "title": "Recipes a character knows", "kind": "property, script command and script function", "value": "high", "effort": "medium", "body": "**Today.** Extra recipes count only while their GenRecipe book is carried, even one made sticky with `Prop_ItemBinder TO=ACCOUNT`. Sold, they are lost, and the rest of the party cannot use them. Base-file rows are open to anyone of the right level, so \"learned from the elven smith\" cannot be said. `CoffeeUtensils.addExtRecipes` already reads recipes from effects that implement Recipes, but no Ability does.\n\n**Add.** `Prop_KnownRecipes`, a permanent Ability implementing Recipes, with SKILL= and recipe lines, saved with the character; the existing loop picks it up. A `STUDY <book>` (or `LEARN FROM <book>`) verb copies or consumes a GenRecipe's lines into it. Script command `MPLEARNRECIPE $n <skill> <recipe name|line>`, function `KNOWSRECIPE($n skill name)`, and recipe key `HIDDEN=1` for base rows usable only when known. The profile rule of CR1 can make knowledge party-wide.\n\n**Example.** After the quest \"Silver for the Lady\" the elven smith runs `mplearnrecipe $n Weaponsmithing moonblade`. The moonblade is known for good and shows in `weaponsmith list`.\n\n*See also:* CR18, CR21 (Ways a character learns recipes: CR18 needs CR4's Prop_KnownRecipes and HIDDEN key, and CR21 turns on the LEARN that CR18 notes data skills lack); P5 (P5's RECIPE reward needs a place to keep known recipes, which CR4's Prop_KnownRecipes is).", "d": "yes", "note": ""}, {"id": "CR5", "theme": "CR", "title": "Recipe requirement keys", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** GenCraftSkill's KEY_VALUE_PARMS column knows one requirement, RACEREQUIREMENT; any other key becomes an item stat. Stock skills have no such column. A recipe can be held back in a GenRecipe book, and `NEEDFIRE` asks for a fire. Anything else needs a room script: `CNCLMSG_PROG` on the craft words with `RETURN CANCEL` to refuse, and `EXECMSG_PROG ITEMGENERATED` to give XP or a tattoo.\n\n**Add.** Reserved keys, removed before item stats are set: `MASK=` (zapper on the crafter), `ROOMMASK=` (zapper on the room: locale, room ID, area, a room effect), `TOOL=` (item held or nearby), `FAILMSG=`, `XP=` (on success) and `TATTOO=` (on first success). The recipe list hides recipes whose MASK the crafter fails. Stock skills read the same keys from an optional extra column when present.\n\n**Example.** The Runeblade row has `ROOMMASK=\"-ROOMID +Deepforge#3\" MASK=\"-TATTOO +RUNE_TRAINED\" TOOL=\"rune chisel\" XP=200 FAILMSG=\"Only the Deepforge burns hot enough.\"`\n\n*See also:* CR3 (Both add recipe requirement keys (STATION vs MASK, ROOMMASK and TOOL) read by the same recipe parser); CR12 (Both award crafting XP (a recipe XP= key vs CRAFTXP)).", "d": "yes", "note": ""}, {"id": "CR6", "theme": "CR", "title": "Script functions and commands for property", "kind": "script function and script command", "value": "medium", "effort": "small", "body": "**Today.** Scripts cannot simply ask who owns a room or give a deed as a reward. `INROOM` has ANYPROPERTY and MYPROPERTY, but MYPROPERTY tests the scripted mob, not $n. `INROOM(BEACON)` never matches: the start room it fetches is thrown away. A deed changes hands by GIVE only from its owner or a shop. A JavaScript `<SCRIPT>` block can call `CMLib.law().getLandTitle(room)` and set the owner, as `resources/progs/changeRoomOwned.js` does, but it needs JSCRIPTS approval.\n\n**Add.** Functions `OWNER(room|$n)` (owner name or empty), `ISOWNER($n [room])`, honouring the profile rule of CR1, and `LANDTITLE(room)` (lot ID and price). Commands `MPDEED <room|area|lotID> <$n|@PROFILE> [price]`, which sets the owner, updates the title and colours the room, and `MPUNDEED <room>`. Fix the BEACON branch.\n\n**Example.** When the ghost of the haunted farmhouse is laid to rest, the reeve runs `mpdeed \"Farmhouse#3\" $n` and says \"The deed is yours.\" A gardener's GREET_PROG checks `ISOWNER($n)` before offering to tend the plot.\n\n*Note.* `JSCRIPTS=2` already runs every JavaScript block without approval (see *Already possible* in the README), so the JavaScript route mentioned above needs no approval; what this item adds is the convenience of doing it without JavaScript.\n\n*See also:* SC14 (Both fix INROOM(BEACON) throwing away the start room); CR1, CR7 (CR6's ISOWNER and MPDEED and CR7's claims use CR1's profile owner and @PROFILE, and MPDEED and T15 (now in CR1)'s MPGRANT both set an owner from a script).", "d": "yes", "note": ""}, {"id": "CR7", "theme": "CR", "title": "Building without a deed where the world allows", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Building skills need land the builder owns (`doesOwnThisLand`, also the grid parent or the room in the build direction) or the CMDROOMS security flag. Nothing grants build rights without a title: Thief_Squatting only claims existing titles, and the recipe's DAT_BUILDERMASK limits who builds, not where. A camp or a cave home needs a `Prop_LotsForSale` or `Prop_RoomForSale` at price 0 placed first, and a real-estate shopkeeper to sell it.\n\n**Add.** `Prop_Homestead` on rooms or areas: `MASK=` (zapper on the builder), `SKILLS=Construction,Masonry,Excavation`, `CLAIM=true` (the first build creates a Prop_LotsForSale-style title owned by the builder or `@PROFILE`), `MAXROOMS=n`, `PRICE=0` and `NOTAX`. BuildingSkill's `canBuild` also accepts a matching homestead. Expanding the lot then follows the existing rules.\n\n**Example.** On the north ridge of The Wilds a ranger may build a lean-to with roof, fence and gate, at most 3 rooms, and it becomes the party's camp.\n\n*See also:* CR1, CR6 (CR6's ISOWNER and MPDEED and CR7's claims use CR1's profile owner and @PROFILE, and MPDEED and T15 (now in CR1)'s MPGRANT both set an owner from a script).", "d": "yes", "note": ""}, {"id": "CR8", "theme": "CR", "title": "Building skills as data", "kind": "builder tool and data file", "value": "medium", "effort": "small", "body": "**Today.** Crafting, gathering and wright skills can be data (GenCraftSkill, GenGatheringSkill, GenWrightSkill), but building skills cannot; CREATE knows only CRAFTSKILL, WRIGHTSKILL and GATHERSKILL. Construction differs from a new trade only in name, trigger, recipe file, main material and sound. A JavaScript class extending Construction could point at another file, but it loads only through LOAD ABILITY or the ini, is not kept in world/custom.cmare, and is untested in the fork.\n\n**Add.** `GenBuildingSkill`, extending BuildingSkill, with fields NAME, HELP, TRIGSTR, FILENAME, MATLIST, MAINRESOURCE (word and material), VERB, SOUND and CANSIT, stored like GenCraftSkill. Builder commands `CREATE`, `MODIFY` and `DESTROY BUILDSKILL`, with a CMGenEditor page. The alternative is to have world/ load .js classes, so the script route becomes content.\n\n**Example.** \"Icecarving\" for the Frost Clans, from icecarving.txt: an igloo roof that makes the room an ice room, ice walls, a snow-block door and an ice-shelf platform, all from ICE and SNOW resources.\n\n*See also:* JS5 (CR8 names world-loaded JS classes (JS5) as the alternative to GenBuildingSkill).", "d": "yes", "note": ""}, {"id": "CR9", "theme": "CR", "title": "Weighted and masked finds for data gathering skills", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** A data gathering skill picks evenly among its ITEMXML items (repeating an entry weights it), and ROOMMASK and PLAYMASK gate only the whole skill. Time or season variants can be had through ResourceOverride named entries with MOBMASK=, at a fixed chance. `Prop_ImproveGather` (AMT=, SKILLS=, MASK=) multiplies yield and can test level. YIELDFORMULA is parsed without variables, so yield cannot grow with level or proficiency.\n\n**Add.** Each ITEMXML entry takes an optional FREQ (weight), MASK (zapper on room and gatherer: +SEASONS, +HOUR, +WEATHER, +AREA, +TAGS) and YIELD. YIELDFORMULA gets variables through the `CMath.parseIntExpression` overload that takes them: @x1 gatherer level, @x2 proficiency, @x3 expertise bonus, @x4 the room's remaining yield. NOTHINGFREQ weights a find of nothing.\n\n**Example.** \"Beachcombing\": driftwood (weight 60), shells (30), amber (5, only when +WEATHER is stormy) and a \"message in a bottle\" catalog item (1). Yield is `1+@x2/40`.\n\n*See also:* CR10 (Both add a zapper mask to gathering finds (data skill ITEMXML vs the hunting and fishing tables)).", "d": "yes", "note": ""}, {"id": "CR10", "theme": "CR", "title": "A mask column for hunting and fishing tables", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** hunting.txt rows match only the room's resource and a domain, `*`, or a locale class ID; fishing.txt rows match only the resource. Every row applies to the whole world, so area, seasonal or night-only game cannot be set. For fish, ResourceOverride with a named entry and MOBMASK can swap the catch for a variant, but it keeps the base fish's value.\n\n**Add.** An optional last column, MASK: a zapper mask tested against the room and the hunter or fisher (+AREA, +SEASONS, +HOUR, +WEATHER, +TAGS on the room). Rows without it behave as now. A masked fishing row carries its own value, so a fish can be worth more in one area. The same column applies to the Herbology, Floristry and Mycology lists where they pick names.\n\n**Example.** In Frostmere, in winter only, hunting fur finds snow hares (a catalog mob). In the Bog of Lights at night, fishing finds lantern eels worth 12 gold.\n\n*See also:* CR9 (Both add a zapper mask to gathering finds (data skill ITEMXML vs the hunting and fishing tables)).", "d": "yes", "note": ""}, {"id": "CR11", "theme": "CR", "title": "Seasonal room resources", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** A room's resource is fixed by its locale class or by ResourceOverride, all year. Nothing in gathering reads the calendar. A room script can do it: a DAY_PROG testing `ISSEASON(autumn)` runs `MPUNBEHAVE $d ResourceOverride`, then `MPBEHAVE $d ResourceOverride apples` (or $a for the area). It must unbehave first, since MPBEHAVE does not re-parm, and re-apply after a restore, since behaviours added in play are not saved in world.xml.\n\n**Add.** ResourceOverride parameters `SEASON=SPRING,SUMMER`, `MONTH=` and `HOUR=`, or a list form `SPRING=flowers,herbs SUMMER=berries AUTUMN=apples WINTER=none` that swaps the room's or area's resource as the season turns, with an optional message on the change. `none`, already accepted, yields nothing.\n\n**Example.** The Vale orchard gives blossoms for Floristry in spring, apples in autumn and nothing in winter, so the party stores fruit in the home pantry (`Prop_IceBox`).", "d": "yes", "note": ""}, {"id": "CR12", "theme": "CR", "title": "Crafting and gathering XP for every class", "kind": "world option and property", "value": "medium", "effort": "small", "body": "**Today.** Every craft computes an XP value (`setMsgXPValue`), but only the Artisan class awards it. Two data routes exist. In achievements.ini, EVENT=\"CRAFTING\" with ABILITYID, ITEMMASK, NUM and REWARDS=\"n XP\" (ACH_FIRSTCRAFTOR gives 50) can be chained as milestones, and SKILLUSE covers gathering. A script, `EXECMSG_PROG ITEMGENERATED all` with `MPEXP $n 10`, can sit on a room, a carried item, or the character through `MPSCRIPT $n SAVABLE`.\n\n**Add.** World options `CRAFTXP=` (percent of the computed value, for all classes; default 0, so nothing changes) and `GATHERXP=n` per gathered unit. `Prop_CraftXP(PCT=50 SKILLS=... MASK=...)` on a character, item or area, such as a guild hall that teaches. XP goes through `postExperience`, so `Prop_ModExperience` and achievements apply.\n\n**Example.** In a cosy crafting world, the fighter who forges her own armour and the cook who feeds the party earn some XP for it.\n\n*See also:* CR5 (Both award crafting XP (a recipe XP= key vs CRAFTXP)).", "d": "yes", "note": ""}, {"id": "CR13", "theme": "CR", "title": "A way home for the party", "kind": "property, command and world option", "value": "medium", "effort": "small", "body": "**Today.** Recall goes to each character's start room, and only a script changes it: `MPBEACON <room> all` in a bed or room script (`EXECMSG_PROG SLEEP all`), which a crafted bed can carry through the recipe's spell column. A home bought or built has no tie to recall by itself. Skill_Recall takes along only monster followers, so party members are left behind. The existing `+ISHOME` mask means the home area, but `-LOCATION +OWNED` and `-LOCATION +PRIV` already test for property the character owns or has privileges in.\n\n**Add.** `Prop_HomeBeacon` on rooms, which an option can add to owned property: SLEEP or `HOME SET` there sets every party member's start room, if they have privileges there. A `HOME` command recalls the whole party there, out of combat, over N turns (world option `HOMERECALL=turns`, 0 to disable). No new zapper mask is needed: `-LOCATION +OWNED` and `-LOCATION +PRIV` already cover owned property.\n\n**Example.** After buying the Millhouse the party sleeps there once. From then on Recall or HOME brings everyone back to it after a dungeon.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* C7 (Both set a per-character return point for the party (a respawn checkpoint vs a home start room)).", "d": "yes", "note": ""}, {"id": "CR14", "theme": "CR", "title": "Resource depletion and regrowth on game time, saved", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** Each harvest in a room cuts its yield by 20%, and it recovers after a fixed 30 minutes. The record's expiry uses game time, but the map holding it (`ExpireHashMap`) clears by the computer's clock, so in a paused or turn-based game it recovers in real minutes. Depletion is not saved, and the count and regrowth cannot be set. Conditional yield already exists: `Prop_ImproveGather` with `AMT=` (0 removes yield) and a `MASK=` on season, weather or hour.\n\n**Add.** `Prop_Yield` on rooms and areas: `HARVESTS=5 DROP=20% REGROW=2 DAYS` (game time) and `EMPTYMSG=\"The bushes are bare.\"`. Regrowth runs on game time everywhere, and depletion records are saved in world.xml. Seasons need nothing new here: Prop_ImproveGather covers yield, and CR11 the resource itself.\n\n**Example.** A mushroom glade has `Prop_ImproveGather` with AMT=0 outside autumn, and `Prop_Yield(HARVESTS=5 REGROW=7 DAYS)`. After five autumn harvests it stays bare for a week, even across a save.", "d": "yes", "note": ""}, {"id": "CR15", "theme": "CR", "title": "Named resource variants as data", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** A variant such as \"moonpetal\" herbs is only a name. `RawCMaterial.makeItemResource` sets value and effects from the resource code and leaves the description empty; the subtype changes only the name (`adjustResourceName`). ResourceOverride's `name(RESOURCE subtype)` entries and `Prop_CommonTwister` only rename, and fishing.txt sets a value for fish only. A valuable or magical variant needs a new material code, or a custom GenGatheringSkill whose ITEMXML holds the exact item.\n\n**Add.** `world/resources.txt` rows: SUBTYPE, BASE_RESOURCE, DISPLAY_NAME, VALUE, WEIGHT_PER_UNIT, DESCRIPTION, SMELL, EFFECTS (properties or spells on the raw item) and NOURISHMENT. `makeItemResource` and `adjustResourceName` apply the row whenever that subtype is made: gathering, ResourceOverride, Butchering, the fishing and hunting tables, bundling. Components and recipes already accept `herbs(moonpetal)`.\n\n**Example.** Moonpetal (HERBS, value 40, glows, Spell_Light when eaten) grows only in the Silver Glade through `ResourceOverride(moonpetal(HERBS moonpetal))`. An Herbalism recipe asks for `herbs(moonpetal)`.\n\n*See also:* CR2 (Two world data files for resources (materials vs named variants) that should share one format).", "d": "yes", "note": ""}, {"id": "CR16", "theme": "CR", "title": "Crop rules as data", "kind": "property and data file", "value": "medium", "effort": "medium", "body": "**Today.** A crop grows in a fixed 50 ticks after planting (about 3 real minutes, or WAIT 50 in turn-based time). It needs `canSeeTheSun` and an outdoor plains, hills, woods, jungle or swamp room (or a DIRT resource), and yields 1d7 times a base amount, plus compost. Gardening uses the same rooms, and MasterFarming only shortens planting. No season, per-crop time, cellar farm or watering exists; the only workaround is a room `CNCLMSG_PROG` that refuses planting when `ISSEASON` fails.\n\n**Add.** `Prop_CropRules` on a room, area or seed item, plus optional rows in a world `crops.txt` keyed by resource or subtype: `GROWHOURS=` (game hours), `SEASONS=`, `NEEDSUN=true|false`, `DOMAINS=`, `WATER=n` (a water source or an Irrigation-built room adjacent), `YIELD=` (dice) and `FAILMSG=`. Farming and Gardening read it for duration, season, sun and yield.\n\n**Example.** Winter wheat planted in autumn takes 10 game days. Glowcap mushrooms grow in the dark cellar farm under the player's house (`NEEDSUN=false DOMAINS=CAVE`).", "d": "yes", "note": ""}, {"id": "CR17", "theme": "CR", "title": "Rolled quality tiers for crafted items", "kind": "world option", "value": "medium", "effort": "medium", "body": "**Today.** A craft either works or makes a ruined item: one proficiency check, then `dropAWinner` or `dropALoser`. Quality words exist only as stages the crafter learns and picks, such as the EnhancedCraftingSkill expertise stages and MasterLeatherWorking's Designer to Legendary. Nothing rolls a tier. Prop_CommonTwister can rename output on ITEMGENERATED, but it renames every item the same way and leaves stats alone.\n\n**Add.** A world list `CRAFTQUALITY`, in lists.ini or a world file. Each tier has a NAME prefix and a CHANCE formula built from proficiency, level margin and station or tool quality. It also has multipliers for value, armour or damage and uses, a level change, and optional effects. GenCraftSkill gets `QUALITY=on/off`. A recipe key `NOQUALITY=1` opts a recipe out. The tier name goes into the item name and the maker's brand.\n\n**Example.** Smithing yields \"a crude iron sword\" (-10% damage), \"an iron sword\", \"a fine iron sword\" (+1 level, +10% value) or, rarely, \"a masterwork iron sword\" (+3 levels).\n\n*See also:* CR3, CR20 (CR17's station quality and CR20's ACTS= stations build on CR3's workstations).", "d": "yes", "note": ""}, {"id": "CR18", "theme": "CR", "title": "EXPERIMENT: discover recipes by trying materials", "kind": "skill subcommand, recipe keys and world option", "value": "medium", "effort": "medium", "body": "**Today.** The only way to learn a recipe in play is LEARN (`doLearnRecipe`). It takes apart an unbranded item no higher than your level into a recipe book with blank pages. It needs `supportsDeconstruction`, which is false for Cooking and for GenCraftSkill data skills. Nothing finds a recipe by trying materials together.\n\n**Add.** A subcommand `<skill> EXPERIMENT <material> [<material>...]`. It compares the materials and amounts offered with recipes marked HIDDEN that the character could make at their level. A match teaches the recipe and gives XP. The recipe goes into a new Prop_KnownRecipes on the character; `addExtRecipes` already reads recipes from a character's effects. A near miss shows the recipe's optional HINT. A miss uses up part of the materials. A world option limits experiments per game day.\n\n**Example.** A cook tries honey, apples and mead and discovers \"spiced cider\". A near miss says \"It needs something warming...\".\n\n*See also:* CR4, CR21 (Ways a character learns recipes: CR18 needs CR4's Prop_KnownRecipes and HIDDEN key, and CR21 turns on the LEARN that CR18 notes data skills lack).", "d": "yes", "note": ""}, {"id": "CR19", "theme": "CR", "title": "Salvage and dismantle yields as data", "kind": "property, skill subcommand and world option", "value": "medium", "effort": "medium", "body": "**Today.** Scrapping gives a fifth of an item's weight in its one material. It refuses flesh, liquid, paper, energy, gas, vegetation and enchanted items. Mobs are covered: a GenRace's NUMRSC, GETRSCID and GETRSCPARM, or ResourceOverride on the mob, set full Butchering yields. ResourceOverride on a room or area, with Scrapping in its parameters, can swap the scrap for a named variant at a chance. None of these gives several outputs, catalog items or rules per item.\n\n**Add.** Prop_SalvageYield on items or catalog entries: `SKILL=Scrapping` (or any skill ID), `YIELD=\"brass:4, gear(clockwork):1@25%, catalog:soul gear@5%\"`, `XP=n`, `DESTROY=true`. Scrapping uses it when it is present. Crafting skills also get a DISMANTLE subcommand. It finds the item's recipe and returns a share of its materials, set by a world option `DISMANTLEPCT=50` and adjusted by proficiency.\n\n**Example.** Scrapping the \"ruined automaton\" in the Old Foundry yields brass, a mainspring, and a 25% chance of the soul gear a quest needs.", "d": "yes", "note": ""}, {"id": "CR20", "theme": "CR", "title": "Furniture that changes its room: Prop_Furnishing", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** Some furniture already works. FasterRecovery on a placed, non-gettable item helps everyone in the room, and on a bed or chair (a Rideable) it helps whoever is on it. Prop_RideAdjuster, Prop_RideSpellCast and Prop_RideEnabler affect whoever sits or sleeps on it. A hearth with a permanent Burning counts as fire for Cooking. A recipe's spell column can put any property or behaviour on what it makes. Three things are missing. An item cannot give room-wide effects, because Prop_HereAdjuster, Prop_HereSpellCast and Prop_RoomLit go only on rooms or areas. There is no comfort total. An item cannot act as a station.\n\n**Add.** Prop_Furnishing on items. `ROOMEFFECT=<ability(parms)>` and `ROOMBEHAVIOR=<behavior(parms)>` apply to the room while the item is decorated or placed in the room, or lies on the floor of an owned room. They stop when it leaves. `COMFORT=n` adds to a room total that masks and scripts can read. `ACTS=fire|forge|anvil` makes it count as a station (see the workstations item).\n\n**Example.** A crafted brazier with `ROOMEFFECT=Prop_RoomLit` lights the cellar. A trophy rack adds comfort. At comfort 5 the house's resting bonus rises.\n\n*See also:* CR3, CR17 (CR17's station quality and CR20's ACTS= stations build on CR3's workstations).", "d": "yes", "note": ""}, {"id": "CR21", "theme": "CR", "title": "LEARN for data crafting skills (GenCraftSkill)", "kind": "data file", "value": "low", "effort": "small", "body": "**Today.** Data crafting skills (GenCraftSkill) cannot use LEARN. Recognising items already works: `GenCraftSkill.mayICraft` checks the supported resource and `mayBeCrafted`. It then matches the item's name against each recipe's final name, with % as a wildcard. Two things block LEARN. `supportsDeconstruction()` is hard-coded false. `GenCraftSkill.unInvoke` has no LEARNING branch that calls `deconstructRecipeInto`, as Blacksmithing's does.\n\n**Add.** A GenCraftSkill field `CANLEARN` that turns `supportsDeconstruction` on. The missing LEARNING branch in `unInvoke`. An optional `LEARNMASK`, an item zapper mask (class, material, +TAGS), that narrows which items the skill will learn from.\n\n**Example.** A custom Runecarving skill learns rune designs by taking apart rune stones found in barrows into a blank recipe book, with `LEARNMASK \"+TAGS rune\"`.\n\n*See also:* CR4, CR18 (Ways a character learns recipes: CR18 needs CR4's Prop_KnownRecipes and HIDDEN key, and CR21 turns on the LEARN that CR18 notes data skills lack).", "d": "yes", "note": ""}, {"id": "CR22", "theme": "CR", "title": "Linked storage chests for the profile: Prop_SharedStash", "kind": "property", "value": "low", "effort": "medium", "body": "**Today.** Bankers with the same `bankChain()` reach the same account from anywhere. But StdBanker keeps deposits by depositor name, so each character has their own account (saved as player data). A clan banker shares by clan, but clans are not world content. Prop_ItemTransporter and Prop_ItemTransReceiver move items one way only. A chest at home keeps its contents in the save, but can be reached only there.\n\n**Add.** Prop_SharedStash on containers: `NAME=home`, an optional `MASK` (a zapper mask) and `CAPACITY=n`. Every container with the same NAME shows and holds one shared list of items. The list is kept in the save like player data and belongs to the profile, so every party character reaches it. PUT and GET work from any linked container.\n\n**Example.** A \"Wayfarer's coffer\" in each inn reaches the same goods as the strongbox in the party's house.", "d": "no", "note": "later: moved to LATER.md"}, {"id": "F1", "theme": "F", "title": "Clan rank and member data for a named clan", "kind": "script function", "value": "high", "effort": "small", "body": "**Today.** `clan($n IN 'Temple of Arden')` tests membership in any clan, and `islike($n '-CLAN \"+Temple of Arden(PRIEST)\"')` tests an exact position. But `clanrank()` looks only at the rivalrous or first clan and returns the role index, not seniority. Its function form casts a non-MOB argument to MOB, which throws. Member records (join date, dues owed, gold and XP donated) cannot be read, and nothing lists a character's clans.\n\n**Add.** `clanrank(who 'clan' >= PRIEST)` with an explicit clan, compared by position rank, taking position IDs or numbers. `$%CLANPOS(who clan)%` gives the position ID. `$%CLANMEMBER(who clan JOINDATE|DUESOWED|DONATEDGOLD|DONATEDXP|RANKNAME)%` reads the member record. `$%CLANS(who)%` lists memberships. Fix the cast.\n\n**Example.** The temple doorkeeper says \"Welcome, Father\" if `clanrank($n 'Temple of Arden' >= PRIEST)`, though the player's first clan is the Thieves Guild. A collector says \"You owe `$%CLANMEMBER($n 'Thieves Guild' DUESOWED)%` gold.\"\n\n*See also:* F4 (Both compare clan positions by rank (clanrank() vs -CLANRANK)); F16 (F16 reads arrears through F1's CLANMEMBER(DUESOWED)).", "d": "yes", "note": ""}, {"id": "F2", "theme": "F", "title": "MPCLANRELATION and clanrelation() for scripted diplomacy", "kind": "script command, script function, builder tool", "value": "high", "effort": "small", "body": "**Today.** Clan relations are set only by `CLANDECLARE`. An NPC whose role has DECLARE power (the GANG BOSS) can run it from a MOBPROG, but it sets one side only, needs both clans rivalrous, has a one-mud-month cooldown in real time, and announces only on CLANINFO channels. `mpsetclandata <clan> POLITICS <xml>` replaces the whole politics XML. No script function reads a relation, and `MODIFY CLAN` has no relations editor.\n\n**Add.** `mpclanrelation <clan> <otherclan> <WAR|HOSTILE|NEUTRAL|FRIENDLY|ALLY> [MUTUAL]`, with no cooldown. It calls `setClanRelations` on one side, or both with MUTUAL, and fires CLAN_PROG RELATION. `clanrelation(clanA clanB == WAR)` and `$%CLANRELATION(clanA clanB)%` return the combined state. `MODIFY CLAN` gets a relations list, and `world/clans.cmare` holds the starting relations.\n\n**Example.** After the third raid, a DAY_PROG on the Orc Warlord runs `mpclanrelation 'Orc Horde' 'Riverton Militia' WAR MUTUAL`. The ending of the \"Broken Oath\" quest makes the Knights of the Rose allies of the Temple.\n\n*See also:* ST9, F3, F9, F10, F16, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts); F7 (F2 keeps starting relations in F7's world/clans.cmare); F12 (F12 reads the live relation that F2's MPCLANRELATION sets).", "d": "yes", "note": ""}, {"id": "F3", "theme": "F", "title": "MPCONQUER and area ruler functions", "kind": "script command, script function", "value": "high", "effort": "small", "body": "**Today.** A script cannot give an area to a clan, change control points or free an area. Control changes only through the clan flag item, kills and revolts, or JavaScript calling `CMLib.law().getLegalBehavior(area).setControlPoints(clan, n)`. Reading the ruler is indirect: `clandata('Orc Horde' AREAS)` lists the areas a clan rules, to be tested with `strcontains`. Control points and revolt chance cannot be read.\n\n**Add.** `mpconquer <area> <clan> <+n|-n|=n|RULE|FREE>` adds or sets control points, makes the clan the ruler outright, or ends its rule (`endClanRule`), firing CLAN_PROG CONQUER or LOSEAREA. The condition `areaclan(area == 'Orc Horde')` and the functions `$%AREACLAN(area)%`, `$%AREACONTROL(area clan)%` and `$%REVOLTCHANCE(area)%` read the state.\n\n**Example.** At the climax of the quest \"Hold the Bridge\", if the defenders die, `mpconquer Millbrook 'Orc Horde' RULE`. Later, burning the orc supply camp runs `mpconquer Millbrook 'Orc Horde' -200`, and a revolt becomes possible.\n\n*See also:* ST9, F2, F9, F10, F16, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts); S5 (S5 saves the control points that F3's MPCONQUER changes); F19 (later) (F19 (later)'s raids change area rule, which F3 sets directly from scripts).", "d": "yes", "note": ""}, {"id": "F4", "theme": "F", "title": "Mask keys -CLANRANK and -RULER", "kind": "property, behaviour (mask keys)", "value": "high", "effort": "small", "body": "**Today.** `-CLAN \"+Thieves Guild(SHADOW)\"` matches one position, and `-CLAN \"+Thieves Guild(<power>)\"` any position holding a power. \"Cutpurse or better\" means listing positions or giving senior ones a marker power, which breaks when ranks are added. `-IF \"<script condition>\"` can call `clanrank()` or test `clandata(clan AREAS)`, but it is clumsy. No mask key knows who rules the area; `-LOCATION +CLANOWNED` is about property titles, not conquest.\n\n**Add.** `-CLANRANK \"+Thieves Guild>=CUTPURSE\"` (also <, <=, =, >), compared by position rank. `-RULER \"+Orc Horde\"` and `+RULER`: the ruling clan of the subject's current area (for rooms and items, their area), with `\"+*\"` for any ruler. Both work wherever masks do: Prop_ReqEntry, GateGuard, Aggressive, MudChat, REACTION masks, `titles.ini`, shop ignore masks.\n\n**Example.** Orc guards in occupied Millbrook have the Aggressive mask `-RULER \"+Orc Horde\" -CLAN \"+Riverton Militia\"`: they attack militia only while the Horde rules. The guild vault's Prop_ReqEntry uses `-CLANRANK \"+Thieves Guild>=SHADOW\"`.\n\n*See also:* F1 (Both compare clan positions by rank (clanrank() vs -CLANRANK)).", "d": "yes", "note": ""}, {"id": "F5", "theme": "F", "title": "Fix MPFACTION band names and ability faction rules; add FACTIONVALUE", "kind": "script command, script function", "value": "high", "effort": "small", "body": "**Today.** Three bugs. `MPFACTION` with a band name searches the alignment faction's bands, whatever faction is named, and only by display name, so `mpfaction $n thieves.ini TRUSTED` fails. CHANGE rules keyed to an ability ID never fire: keys are stored in upper case and looked up with the mixed-case `A.ID()`. This also breaks the stock `alignment.ini` rules CHANGE2 to CHANGE16 (PRAYER_BURY and others). `$%FACTION()%` gives only the band name. Numbers already work: `faction($n thieves.ini > 500)`, `mpfaction $n thieves.ini +50`.\n\n**Add.** `MPFACTION` resolves band names and band codes in the named faction. DefaultFaction looks up ability triggers in upper case. New functions `$%FACTIONVALUE(who id)%` (the number) and `$%FACTIONBAND(who id)%` (the band code).\n\n**Example.** A quest reward runs `mpfaction $n thieves.ini TRUSTED`. A merchants' guild faction with `CHANGE5=Thief_Steal;DOWN;50%;;-CLAN \"+Merchants Guild\"` now costs a thief standing when caught stealing from guild shops.\n\n*See also:* DT37 (F5 fixes the ability-ID faction CHANGE rules that DT37 reports as matching nothing).", "d": "yes", "note": ""}, {"id": "F6", "theme": "F", "title": "Faction band effects on the player, applied live", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** A faction gives NPCs effects and behaviours by range (AFFBEHAV), but only when `mob.isMonster()`, and only when faction data is refreshed, not when a value crosses a band. A player gets nothing for standing beyond ABILITY gates. Auto-awards with a `-FACTION` mask are checked when assigned, on entering the world, so a band crossed mid-session changes nothing. The workaround is an always-on scripted GenAbility with `EXECMSG_PROG FACTIONCHANGE` running `MPAFFECT` and `MPUNAFFECT`.\n\n**Add.** A faction key `PLAYEREFFECTn = <Ability ID>; <parms>; <range codes or mask>`, also in CMGenEditor. On TYP_FACTIONCHANGE the effect is added when the value enters the range and removed when it leaves. It is not saved, being recomputed. A scripted GenAbility here is the band-change hook. Also re-check auto-award character masks on faction, tattoo and level change.\n\n**Example.** `house_varn.ini`: `PLAYEREFFECT1 = Prop_Adjuster; cha+2; HONORED EXALTED`, and `PLAYEREFFECT2 = Varn_Bounty; ; HATED`, a GenAbility whose script sends bounty hunters in Varn cities.\n\n*See also:* ST14, JS8 (All three need DefaultFaction to report a change and a band crossing beyond the source's room (FACTION_PROG, live band effects, a JS factionChange event)).", "d": "yes", "note": ""}, {"id": "F7", "theme": "F", "title": "Clans as world content: world/clans.cmare", "kind": "data file, builder tool", "value": "high", "effort": "medium", "body": "**Today.** Clans are not world content. A new game copies only CONTENT_TABLES, which has no CMCLAN, so a clan made with `CREATE CLAN` in builder mode never reaches a normal game. The clan table is also read after the map, so every `<CLAN>` tag on an area-file mob is dropped at boot and ClanHelper logs \"Unknown clan\". `ROLE=<n>` on the mob tag is a role index only. An ONCE_PROG `mpsetclan` on each NPC is today's stand-in.\n\n**Add.** `world/clans.cmare`, one `<CLAN>` per content clan: name, government, premise, category, accept mask, recall, morgue and donation rooms, level and XP, dues, tax, relations, flags, minimum members. It loads before the areas. Builder mode writes it on SAVE, and `world.sum` covers it. In a restored game the save's CMCLAN wins; clans founded in play stay save state. `ROLE=` on the mob tag and on ClanHelper takes a position ID.\n\n**Example.** The owner builds the Thieves Guild, the Temple of Arden and the Orc Horde, places the guildmaster and cutpurses with `<CLAN ROLE=...>`, and commits the file. Every new game starts with all three, and the cutpurses defend each other.\n\n*See also:* F2 (F2 keeps starting relations in F7's world/clans.cmare); S10, F18 (F7 and S10 both add world/clans.cmare, which F18's CREATE GUILD writes).", "d": "yes", "note": ""}, {"id": "F8", "theme": "F", "title": "Clan timers on game time, NPC members counted", "kind": "world option", "value": "high", "effort": "medium", "body": "**Today.** An NPC-only clan can already be kept from fading with minimum members 0: OVERRIDEMINMEMBERS in `clangovernments.xml`, `MODIFY CLAN`, `mpsetclandata 'Orc Horde' MINMEMBERS 0`, or `MINCLANMEMBERS=0` in `coffeemud.ini`. Trophies go off with the NOTROPHY flag. But clan timers use real time (`System.currentTimeMillis`): purge grace, vote expiry, dues, tattoo expiry and the CLANDECLARE cooldown. They ignore pause and turn-based time, and run while the game is closed. Only player member rows count, so NPC members add nothing to size or leadership.\n\n**Add.** A world option `CLANCLOCK=GAME`: daily maintenance, vote expiry, dues periods, purge grace and the declare cooldown counted with GameTime in game days. NPCs with a `<CLAN>` tag count as members for size and leaders.\n\n**Example.** The Orc Horde has no player members and, with minimum members 0, lasts the whole campaign. In turn-based play a vote or a dues month passes after 30 game days, not a real month.\n\n*See also:* F16 (Both move clan dues periods to the game calendar).", "d": "yes", "note": ""}, {"id": "F9", "theme": "F", "title": "Ranks earned by deeds: AUTOPROMOTEBY MERIT", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** Auto-promotion ranks members by level, rank, gold, XP or join date, once a real day, filling only seats held by ASSIGN roles. INNERMASK is only a gate, and the daily run tests it on a ThinPlayer, which has no faction or tattoo data. An NPC with ASSIGN power can run `clanassign $n cutpurse`, which checks INNERMASK on the live MOB, but someone must script when.\n\n**Add.** `<AUTOPROMOTEBY>` modes MERIT and MERIT_DEMOTE. A member moves to the most senior position whose INNERMASK they pass, within MAX seats, and with MERIT_DEMOTE drops back on failing it. The check runs on the loaded MOB at faction band, level or tattoo change, quest win, and each game day. The member is told; CLAN_PROG PROMOTE or DEMOTE fires. `CLANDETAILS` shows \"Next rank: Shadow, requires: ...\" from the mask. `<STANDINGFACTION>thieves.ini<\/STANDINGFACTION>` shows that faction beside the rank.\n\n**Example.** Footpad on joining. Cutpurse needs `-FACTION +THIEVES_TRUSTED +THIEVES_HONOURED`; Shadow `-FACTION +THIEVES_HONOURED -TATTOO +JOB_WAREHOUSE`; Guildmaster, MAX=1, `-TATTOO +SUCCEEDED_MASTER`. Stealing for the guild raises the standing, and the rank follows.\n\n*See also:* ST9, F2, F3, F10, F16, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts); F10, F18 (F10 and F18 use F9's MERIT promotion); P25 (Alternatives for ranks earned by deeds: a tattoo rank ladder or clan positions with MERIT promotion).", "d": "yes", "note": ""}, {"id": "F10", "theme": "F", "title": "GuildMaster behaviour for NPC-run guilds", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** The pieces exist, but each guild wires them by hand. `CLANAPPLY` joins at once, with ENTRYSCRIPT, when the clan's apply role is the accept position. The acceptance mask takes `-CLASS`, `-QUESTWIN` and `-IF`. An NPC with ACCEPT, ASSIGN and EXILE power (the GANG BOSS) can run `clanaccept`, `clanassign` and `clanexile` from a SPEECH_PROG. Fees and kits take a BRIBE_PROG and an `mpoload` in ENTRYSCRIPT. There is no kit per rank, and nothing handles each party character separately.\n\n**Add.** A thin GuildMaster behaviour over these commands: `CLAN=`, `JOINMASK=`, `JOINFEE=`, `JOINQUEST=` (a quest to win first), `RANKS=MERIT|SCRIPT` (MERIT needs F9), `KIT.<POSITION>=\"catalog item names\"` (given once per rank, replaced for a fee), `DUES=TRUE` (takes payment of the arrears that the yearly CLANDUES sweep records), `LEAVEMSG=`, `REFUSEMSG=`. It answers \"join\", \"rank\" or \"advance\", \"leave\", \"dues\" and \"kit\". It uses addMember and delMember, which today send nothing (DefaultClan.java:820-836), so it runs the government's ENTRYSCRIPT and EXITSCRIPT itself, as CLANACCEPT and CLANEXILE do, and fires CLAN_PROG once ST9 adds it. It treats each party character on its own.\n\n**Example.** Mother Ysolde in the Hidden Sanctum: \"join\" needs the Thief class and the \"Proof of Nerve\" quest, costs 50 gold, makes you a Footpad and hands you a lockpick set. At Shadow, \"kit\" gives the black hood.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST9, F2, F3, F9, F16, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts); F9, F18 (F10 and F18 use F9's MERIT promotion).", "d": "yes", "note": ""}, {"id": "F11", "theme": "F", "title": "Reputation per town, and law that heeds it", "kind": "world option, data file", "value": "medium", "effort": "small", "body": "**Today.** A town's reputation can be built as an ordinary faction: a `riverton.ini` in `FACTIONS=`, CHANGE triggers with `MASK=+AREAS Riverton`, REACTION lines, and shop PREJUDICE on its band codes. The automatic kind is all or nothing: `AUTOREACTION=AREA` makes an `AREA_<NAME>` faction for every area, wilderness and dungeons too, from one template. The law ignores reputation; `laws.ini` has no leniency key.\n\n**Add.** An area stat `REPUTATION=<template file|NONE>`, a `MODIFY AREA` field stored in the `.cmare`. Areas with it get their reputation faction from that template; areas without it get none, whatever AUTOREACTION says. A law key `LENIENCY=\"<range codes>=-1;<range codes>=+1\"` moves the punishment down or up by the offender's reputation there. Document PREJUDICE with reputation range codes (`BUY=0.8 RIVERTON_HERO`).\n\n**Example.** Riverton and Ashford use `towns.ini`; the swamp has no reputation. A Riverton hero caught drunk gets a warning instead of parole.\n\n*See also:* F17 (Both generate reputation factions from templates (per town vs per NPC clan)).", "d": "yes", "note": ""}, {"id": "F12", "theme": "F", "title": "ClanEnemyAggressive behaviour", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** ClanHelper only defends fellow members. Conquerable makes the ruling clan's NPCs attack members of a clan at WAR with it, reading the live relation, but only in conquerable areas and only for the ruler's NPCs. Elsewhere a builder must mirror war state in a global variable, set by the script that declares war, and test it with `-IF \"var(...)\"` in an Aggressive mask.\n\n**Add.** `ClanEnemyAggressive [CLAN=<own clan, default the NPC's>] [STATES=WAR,HOSTILE] [CHECKLEVEL] [MESSAGE=...] [CHANCE=n]`. It attacks any MOB, player or NPC, in a clan whose combined relation with its own is in STATES. It reads the live relation matrix (reusing `isAtClanWar` and `getCommonClanRelations`), so `MPCLANRELATION` changes it at once.\n\n**Example.** The Riverton militia carry ClanEnemyAggressive. While the Horde is at WAR, militia and orc raiders fight on sight in the streets. When the player brokers peace, they stop.\n\n*See also:* F2 (F12 reads the live relation that F2's MPCLANRELATION sets).", "d": "yes", "note": ""}, {"id": "F13", "theme": "F", "title": "Clan prices and rank-gated shop stock", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Shop PREJUDICE matches faction band codes, tattoos, class, race, gender and alignment, not clan or rank. A member price works through a tattoo given in ENTRYSCRIPT (`mptattoo $n KNIGHT_OF_ROSE`) and removed in EXITSCRIPT. A CNCLMSG_PROG on the shopkeeper can cancel BUY of one item when `islike()` fails. Nothing hides an item from LIST per buyer, and Prop_HaveZapper on stock does not stop BUY.\n\n**Add.** PREJUDICE tokens `CLAN:<name>` and `CLANPOS:<name>:<position>`, or a `MASK(<zapper>)` part, as in `BUY=0.8 CLAN:Knights_of_the_Rose`. A Prop_StockZapper for stock items, `MASK=\"<zapper>\" HIDE=TRUE|FALSE MSG=\"...\"`: it hides the item from LIST for buyers who fail the mask, or lists it marked restricted, and refuses BUY.\n\n**Example.** The Knights' armourer sells Rose Plate only to Knights (`-CLANRANK \"+Knights of the Rose>=KNIGHT\"`) and gives every member 20% off. The fence shows its poisons only to Shadows.", "d": "yes", "note": ""}, {"id": "F14", "theme": "F", "title": "Hidden factions, band ladder and party standings table", "kind": "presentation", "value": "medium", "effort": "small", "body": "**Today.** Whether a faction shows is one switch for everyone (SHOWINFACTIONSCMD, SCOREDISPLAY), so a secret order's standing is always shown or never. `FACTIONS <name>` and `FACTIONS HERE` filter the list but show only the current line, not the ladder. `AS <character> FACTIONS` shows one party character at a time, and `PARTY` has no faction view. A script can name a hidden standing with `$%FACTION($n cult.ini)%`.\n\n**Add.** Faction keys `SHOWMASK=<zapper>` (shown in FACTIONS and SCORE only to holders who pass it) and `HIDDENNAME=\"an unknown standing\"`. `FACTIONS <name>` shows the band ladder, the current band marked, and the points to the next. `FACTIONS PARTY` shows a table: a row per visible faction, a column per party character, band names in the cells.\n\n**Example.** Standing with the Cult of the Black Sun is tracked from the start but appears only once the character has the tattoo READ_CULT_LETTER. `FACTIONS PARTY` shows the paladin Hated by the Thieves Guild and the rogue Trusted.\n\n*See also:* N15 (F14's SHOWMASK and HIDDENNAME would hide a one-NPC faction, half of why N15 proposes Prop_Affinity instead of a faction).", "d": "yes", "note": ""}, {"id": "F15", "theme": "F", "title": "Clan news reaches the player", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** Clan announcements go to channels flagged CLANINFO. This fork keeps INFO (flagged CONQUESTS) and QUESTCHAT, so promotions, level-ups, fading warnings, dues and trophy messages reach no one. Adding CLANINFO to the INFO line of `CHANNELS=` in `coffeemud.ini` fixes most of it without Java. Only auto-promotion and accept tell the member directly, and only when the member has a session.\n\n**Add.** A world option `CLANNEWS=INFO|MEMBERS|OFF`. INFO sends clan news to the INFO channel. MEMBERS tells it directly to member characters, in their own windows. Either way the affected member always gets a personal line: \"You are now a Cutpurse of the Thieves Guild.\"\n\n**Example.** When MERIT promotion makes the rogue a Shadow, the rogue's window shows it, and INFO says \"The Thieves Guild has risen to level 3.\"", "d": "yes", "note": ""}, {"id": "F16", "theme": "F", "title": "Dues on the game calendar, with consequences", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** Clan dues (`MODIFY CLAN` \"Clan Dues/yr\", `mpsetclandata <clan> DUES n`) are taken once a mud year on real time, need a clan bank account, and come silently from coins, then the bank. `CLANDUES` lists members behind, but arrears have no consequence. A collector can be scripted: a DAY_PROG counts periods with `mpsetvar`, takes coin with `mpmoney`, and an NPC with ASSIGN and EXILE power runs `clanassign` or `clanexile`.\n\n**Add.** Government and clan keys: `DUESPERIOD=DAY|WEEK|MONTH|YEAR` on the game calendar, `DUESGRACE=<periods>`, `DUESLATE=\"WARN,DEMOTE,EXILE\"` (a step per missed period), `DUESAUTO=TRUE|FALSE`. With DUESAUTO false, dues are paid with `CLANDUES PAY [clan]` or to the GuildMaster. `CLANMEMBER(DUESOWED)` reads arrears, and CLAN_PROG DUESLATE fires. The clan bank becomes optional; the money goes to clan XP or a treasury stat.\n\n**Example.** The Merchants' Guild charges 20 gold a game month. After two missed months the member discount ends (demotion). After four the member is expelled, and the guild seal crumbles in EXITSCRIPT.\n\n*See also:* ST9, F2, F3, F9, F10, F22 (later) (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts); F1 (F16 reads arrears through F1's CLANMEMBER(DUESOWED)); F8 (Both move clan dues periods to the game calendar).", "d": "yes", "note": ""}, {"id": "F17", "theme": "F", "title": "Clan standing generated from each NPC organization", "kind": "world option and data file", "value": "medium", "effort": "medium", "body": "**Today.** `AUTOREACTION` builds reaction factions for `AREA`, `NAME`, `RACE`, `PLANAR` and `DEITY` from template files, with per-name override files. It has no clan type, and this fork's `coffeemud.ini` sets `AUTOREACTION=PLANAR` only. A builder can hand-write one faction per guild, with `REACTION` masks `-CLAN \"+Thieves Guild\"` and `KILL` and `BRIBE` rules masked to members. Each file must then be kept in step with its clan by hand. This complements the per-area town reputation.\n\n**Add.** A `CLAN` type for `AUTOREACTION`. For each clan flagged `NPCRUN` it builds a faction `CLAN_<CODE>` from `resources/examples/clanreaction.ini`, where `<NAME>` is the clan name. Defaults: `REACTION` masks `-CLAN \"+<NAME>\"`, so every member reacts by band. Killing a member lowers standing, and a bribe or gift raises it. `RELATION` entries come from the clan's relations (ally +50%, war -50%). A file `clanreaction_<code>.ini` overrides the template for one clan.\n\n**Example.** Kill a Thieves Guild cutpurse and the whole guild in the city turns cold to you. The Watch, at war with the guild, warms to you a little.\n\n*See also:* F11 (Both generate reputation factions from templates (per town vs per NPC clan)).", "d": "yes", "note": ""}, {"id": "F18", "theme": "F", "title": "CREATE GUILD generator and single-player governments", "kind": "generator and data file", "value": "medium", "effort": "medium", "body": "**Today.** An NPC guild needs a government, a clan, a standing faction, a scripted guildmaster, entry rules for the hall, a trainer and a shop, all wired by hand. Each piece is editable data (`CREATE GOVERNMENT`, `MODIFY GOVERNMENT`, `CREATE CLAN`, `CREATE FACTION`). But the stock governments are built for player politics: voting, applicants, trophies. Only `GANG` works without voting.\n\n**Add.** Ship `GUILD_NPC`, `ORDER`, `TEMPLE` and `CULT` in `clangovernments.xml`: no voting, `MERIT` promotion, `NPCRUN` defaults, and four or five named ranks with placeholder `INNERMASK`s. Add a builder command `CREATE GUILD <name> TEMPLATE=<government> HALL=<room>`. It makes the clan in `world/clans.cmare` and a standing faction (Shunned to Exalted, with `KILL` and `BRIBE` rules masked to members). It also places a guildmaster in the hall, `Prop_ReqEntry` on the inner rooms, and a stub trainer and shop. It needs clans kept as world content. It uses `GuildMaster` and `-CLANRANK` if those are approved.\n\n**Example.** `CREATE GUILD Knights of the Rose TEMPLATE=ORDER HALL=Castle#14` gives an order the player can join, rise in and be thrown out of. The owner then writes its quests and kit.\n\n*See also:* F7, S10 (F7 and S10 both add world/clans.cmare, which F18's CREATE GUILD writes); F9, F10 (F10 and F18 use F9's MERIT promotion).", "d": "yes", "note": ""}, {"id": "F19", "theme": "F", "title": "ClanWarfare behaviour: NPC clans raid and conquer", "kind": "behaviour and world option", "value": "medium", "effort": "large", "body": "**Today.** Conquest moves only when members of a conquest-enabled clan kill natives in an area that holds their flag, and only against a ruler they are at `WAR` or `HOSTILE` with. NPC members never travel or fight on their own, so NPC clans never gain or lose ground without the player. A warlord's `DAY_PROG` (`mpmload`, `mpsetclan`, `mpoload`, `mptrackto`) or a JavaScript behaviour can fake a raid, but both are large and brittle.\n\n**Add.** `ClanWarfare`, on a warlord NPC or a staging room. Parameters: `CLAN=`, `STAGING=`, `TARGETS=`, `EVERY=<game days>`, `SIZE=`, `RAIDER=\"catalog:orc raider\"`, `FLAG=\"catalog:Horde Banner\"`, `AUTOWAR=`, `RETREAT=<hp%>`, `RUMOUR=`. It runs when due, if the clan is at war with the target's ruler or the target has no ruler. It builds a band from the catalog and marches it there. The band plants the flag, fights natives and the ruling clan, and garrisons if it wins. `INFO` posts the rumour first and the result after. World option `WARS=ON|OFF`.\n\n**Example.** Every 7 game days the Orc Horde sends 4 raiders from Grimtusk Keep toward Millbrook. Left alone, Millbrook falls within a month. Hunting the raiders on the road holds the line.\n\n*See also:* C24 (later) (Both march a catalog band from a staging room to a target (an invasion vs a clan raid)); F3 (F19 (later)'s raids change area rule, which F3 sets directly from scripts).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "F20", "theme": "F", "title": "Party-founded clans: the profile votes once", "kind": "world option and command", "value": "low", "effort": "small", "body": "**Today.** Each party character is a separate member and voter. Under a voting government such as `FELLOWSHIP`, every `MUST_VOTE_ON` action waits until the player has used `CLANVOTE` with each character, or until the vote's MAXDAYS (100 game days for FELLOWSHIP) run out with the quorum (33%, at least 2 votes) cast. One character founds the clan alone and pays `CLANCOST` once (10000 gold in `coffeemud.ini`, which can be lowered); each of the others must `CLANAPPLY` and be accepted. Voting can be avoided. `GANG`'s `BOSS` holds every power as `CAN_DO`, and the leader can `clanaccept` the others after `AS <character> clanapply`.\n\n**Add.** World option `CLANVOTES=PROFILE`: all characters of the profile count as one voter, so actions that need a vote run at once. `CLANCREATE <name> PARTY` founds the clan with every party character joining together and pays `CLANCOST` once. `PARTY CLANS` lists each character's clans and ranks.\n\n**Example.** The party founds The Gray Company under `FELLOWSHIP` and buys a hall with `Prop_RoomForSale`. They set it as the clan home and declare war on the bandits without voting with themselves.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "F21", "theme": "F", "title": "Deity holy days, favor gates and portents", "kind": "property", "value": "low", "effort": "medium", "body": "**Today.** Deities have ritual triggers, blessings, curses and powers. A ritual can already be limited to holy days with `CHECK <zapper mask>` (`+MONTHS`, `+DAY`, `+SEASONS`, `+WEATHER`, `+IF` and others). Favor exists as the `AUTOREACTION=DEITY` faction, which is off by default, and holidays can give mobs behaviours. But favor changes nothing by itself, holy days bring no reward, and a deity shows no signs. `GenDeity`'s only fields are `CLERREQ`, `CLERRIT`, `WORREQ`, `WORRIT` and `SVCRIT`.\n\n**Add.** Three `GenDeity` fields. `HOLYDAYS=<holiday names or m-d>`: services and worship on those days give double favor and a guaranteed blessing. `FAVORGATES=\"<blessing or power>:<range code>\"`: the blessing or power is granted only at that favor. `PORTENTS=\"<range code>:<message or weather>\"`: signs that a favored or disfavored worshipper sees, such as rain that follows them.\n\n**Example.** Ceres, goddess of the harvest: services during the Harvest Fair grant `Prop_ImproveGather`. Her infidels see crops wither as they enter farmland.\n\n*See also:* W6 (F21 (later)'s deity holy days are named holidays, tested with W6's tests by name).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "F22", "theme": "F", "title": "Prop_ClanDisguise: pass as a member in uniform", "kind": "property and script trigger", "value": "low", "effort": "medium", "body": "**Today.** `ClanHelper`, `Conquerable`, the `-CLAN` mask and faction reactions read real membership. Masks cover part of this. `GateGuard`, `Prop_ReqEntry` and `Aggressive` accept `-WORN \"+cult robes\"` with `+OR`, `-CHANCE` and `-IF`. So a guard can let through members or wearers of the uniform, with a chance to fail. `WEAR_PROG` with `mpsetclan` grants real membership instead, which is saved and carries the clan's benefits.\n\n**Add.** `Prop_ClanDisguise` for wearable items: `CLAN=\"Cult of the Black Sun\" POSITION=ACOLYTE DETECT=\"-INT +15\" CHANCE=20 ONDETECT=ATTACK|ALARM|SCRIPT`. While it is worn, NPCs' `-CLAN` checks (and `-CLANRANK`, if added) treat the wearer as that member. An NPC that passes `DETECT` rolls `CHANCE` once per encounter to see through it. A success fires `ONDETECT` and a new trigger, `CLAN_PROG DISCOVERED`. The wearer gets no titles or benefits. If this is declined, document the `-WORN` mask pattern instead.\n\n**Example.** Robes taken from a dead acolyte get the party past the cult's door guards. But the sharp-eyed high priest may see through them and raise the alarm.\n\n*See also:* ST9, F2, F3, F9, F10, F16 (These fire ST9's CLAN_PROG events (RELATION, CONQUER, PROMOTE, DUESLATE, DISCOVERED), and ST9 and F10 both make addMember run the entry and exit scripts).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "T2", "theme": "T", "title": "Dungeons that reset when the party comes back", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** `ResetWhole TICKS=<n>` resets an area after n ticks with no player activity. In turn-based time that already means a fresh area after a long absence. `MUDHOUR=<h>` resets at a game hour, and `MPRESET AREA` in a `GREET_PROG` resets on entry. Its last-access time is not saved, so it is -1 after a restore. `InstanceArea` makes a fresh copy per visit, but copies do not save, and its type adjustments (`LEVELADJ`, `ELITE`, `PREFIX` and the rest) apply only to copies.\n\n**Add.** `INPLACE=true` on `InstanceArea`: no copy is made, and the type's adjustments are applied to the real area at each reset, keyed to the entering leader's level. Save `ResetWhole`'s last-access time. As conveniences on `ResetWhole`: `ONREENTRY=true` (reset when a party member enters after all had left), `MINAWAY=<game hours>`, `SKIPROOMS=<room mask>` and `RESETMSG`. The rooms are ordinary, so saves restore them as they are.\n\n**Example.** \"The Drowned Barrow\" has `ResetWhole ONREENTRY=true MINAWAY=12` and `InstanceArea INPLACE=true LIKE=Triumph`. A return after half a day finds it restocked at the party's level. A save made inside restores the same half-cleared barrow.\n\n*See also:* W9 (Both add ResetWhole parameters (DAYS vs MINAWAY, MSG vs RESETMSG) for how an area resets after the party leaves); G14 (Alternatives for a dungeon that is fresh when the party returns: reset it in place, or re-roll it).", "d": "yes", "note": ""}, {"id": "T3", "theme": "T", "title": "Script commands to sail, anchor, dock, board and hitch", "kind": "script command", "value": "high", "effort": "medium", "body": "**Today.** A script can `MPFORCE` a crew mob aboard to type `RAISE ANCHOR`, `COURSE` and `STEER`. It can `MPBEHAVE` `Patroller` on the vessel with room IDs as steps; Patroller routes between them but loops, and `MPUNBEHAVE` stops it. `MPTRANSFER $n <ship room id>` puts one person aboard. JavaScript can call `NavigableItem` methods. There is no one-shot route and no move-and-dock, and no script can set an item's `riding()`, so nothing hitches a cart.\n\n**Add.** `MPSAIL <vessel> TO <room id|area|port name>`, a one-shot route computed as `SeaNavigation` and `AwaitShip` do, or `MPSAIL <vessel> <dir dir ...>`. `MPANCHOR <vessel> UP|DOWN`. `MPMOVEVESSEL <vessel> <room>`, which moves and docks it with no voyage, for scenes and quests. `MPBOARD <who> <vessel> [room id]`, for a mob or a player with the party. `MPHITCH <item> <mount>` and `MPUNHITCH <item>`.\n\n**Example.** When the player pays the smuggler, the quest runs `MPBOARD $n 'the Black Gull'`, then `MPSAIL 'the Black Gull' TO 'Hidden Cove#1'`. When the ship reaches the cove, the next quest step starts.\n\n*See also:* T5, T14 (One route-finder serves T3's MPSAIL TO, T5's stops and T14's COURSE TO a named port).", "d": "yes", "note": ""}, {"id": "T4", "theme": "T", "title": "Travel time on rooms, exits and areas", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** A step out of combat costs a fifth of a tick, about 4 game seconds, and a game hour is 150 ticks. The cost is set per command for the whole game (`CMProps.getCommandActionCost`). No room, exit or area changes it, and `LongRoad` changes movement points only. A 30-room road or ocean crossing passes in about a minute of game time, so day and night, hunger and weather cannot carry a journey.\n\n**Add.** A `Prop_TravelTime` property for exits, rooms or whole areas: `TIME=<game minutes per step>`, with multipliers `MOUNTED=0.5`, `VEHICLE=0.7` and `NIGHT=1.5`. Walking, riding or a vessel moving through costs that much game time. In turn-based time the world moves on by it, through the same queue as other commands. In real time the clock is briefly stopped and moved ahead. The party moves together and each member is charged once.\n\n**Example.** The 12 rooms of the \"Kingsroad\" area have `TIME=120`: two hours a step, half on horseback. Walking from Ashford to the capital takes a day. The party sees dusk, gets hungry, and a nighttime ambush script can fire.\n\n*See also:* T6, T12, T18 (T6, T12 and T18 use T4's travel time).", "d": "yes", "note": ""}, {"id": "T5", "theme": "T", "title": "Timetabled ferry, coach and airship lines", "kind": "behaviour", "value": "high", "effort": "large", "body": "**Today.** `Patroller` on a vessel or rideable follows room-ID stops and routes between them, with `MIN`/`MAX` for pace, `.` to pause one step and `RESTART` to loop. `Prop_TicketTaker` takes a fare on boarding, and `TIME_PROG` with `MPBEHAVE` can start departures at set hours. Missing: waiting at a stop for game hours, crew-only steering (`rideok=only` skips boardables, so passengers can steer), a timetable sign, and a saved route position (Patroller's step is a plain field).\n\n**Add.** A `TransportLine` behaviour for any navigable vessel, rideable or mob driver: `STOPS=room;room;...` or port names, `DEPART=6,12,18` (game hours) or `WAIT=<ticks at stop>`, `ROUND=loop|back`, `FARE=<n>` or `FARES=stop:price,...`, `BOARDCALL=`, `DEPARTMSG=`, `ARRIVEMSG=` (with `$stop` and `$next`), `PASSENGERONLY=true`, and `SIGN=<item name>` for a board at each stop. Stop index and departure time save in world.xml. It routes as T3's `MPSAIL TO`, so stops need not be adjacent.\n\n**Example.** \"The Gull\" runs Port Azure, Saltmarsh and Gullrock, leaving at 6, 12 and 18, two silver a stop. The quay's board reads \"The Gull: at Saltmarsh, due here at 12\". `WAIT UNTIL ARRIVAL` (T1 (now in W4)) carries the party across.\n\n*See also:* T3, T14 (One route-finder serves T3's MPSAIL TO, T5's stops and T14's COURSE TO a named port); T8 (T5's PASSENGERONLY and T8's NAVMASK both keep passengers off the helm); T16 (Two timetabled routes with a saved position (TransportLine vs MovingRoom with DEPART=)); T10, T17 (Three fare rules for the party (T5's FARE, T10's PERHEAD, T17's PARTY=LEADER); settle one).", "d": "yes", "note": ""}, {"id": "T6", "theme": "T", "title": "Journeys: passages that take hours, with events on the way", "kind": "property, script trigger", "value": "high", "effort": "large", "body": "**Today.** A journey can be faked: a transit room with `DelayedTransporter min=N max=N chance=100;<dest room>` (it carries followers), `RAND_PROG` or `DELAY_PROG` scripts there for events, and a `GIVE_PROG` or `Prop_TicketTaker` with `MPTRANSFER` to get in. But durations are in ticks only, the countdown does not pause for an event, no trigger marks the stages, and progress is not saved.\n\n**Add.** A `Prop_Journey` property for an exit, portal, rideable or NPC: `DEST=<room>`, `DURATION=<game hours>`, optional `VIA=<transit room>`, `FARE=`, `LEAVEMSG`/`ARRIVEMSG`, and `EVENTS=\"10%:storm_fn;5%:LOAD MOB pirate band;2%:CATALOG encounter-sea\"`, rolled each game hour. On a hit the journey pauses for the fight or scene and resumes after. The whole party moves, and time passes as in T4. A new `JOURNEY_PROG` trigger fires at start, each hour (with the hour) and at arrival. A save made mid-journey resumes where it stopped.\n\n**Example.** Passage to Gullrock: the party sits in the ferry cabin for 6 game hours. In hour 3 a kraken event loads a tentacle mob on deck. After the fight the trip goes on, and the party lands on the Gullrock quay at dusk.\n\n*See also:* T4, T12, T18 (T6, T12 and T18 use T4's travel time); T10 (Alternatives for a timed passage with messages and fares (Prop_Journey vs an extended DelayedTransporter)).", "d": "yes", "note": ""}, {"id": "T7", "theme": "T", "title": "Script functions for riding and vessels", "kind": "script function, JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** `INCONTAINER($n)` gives what a mob rides, and `ISCONTENT($i)` lists a rideable's riders. `INROOM($i)` and `INAREA($i)` say where a vessel is. `INAREA($n)` for someone aboard gives the interior's area name, a rough \"aboard\". `STAT($i ABILITY)` and `STAT($i USES)` give speed and hull. Course, anchor and docking are not stat codes, there is no rider count, and a vessel cannot be found by name anywhere in the world.\n\n**Add.** `ABOARD($n)` (the vessel item's name, or empty), `RIDERS($i)` (a count), `ISANCHORED(<vessel>)`, `ISDOCKED(<vessel>)`, `COURSE(<vessel>)` (remaining directions) and `VESSELROOM(<vessel>)` (its room ID, found by name anywhere). `RIDING($n)`, `SPEED` and `HULL` can be short names for what `INCONTAINER` and `STAT` already give. Each also as a JavaScript call.\n\n**Example.** A smuggler whispers the password only if `aboard($n)` is \"the Black Gull\" and `isanchored(\"the Black Gull\")` is false. A harbour board shows `vesselroom(the Gull)` to say where the ferry is.", "d": "yes", "note": ""}, {"id": "T8", "theme": "T", "title": "Crew-only helm for world-owned vessels", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** When a vessel's `OWNER` is empty, anyone may raise the anchor, set a course or steer, so a passenger can take the world's ferry. Setting `OWNER` to a clan or an NPC captain's name locks the helm (anchor or brake, steer, sail, course, raise and lower; not TENDER), though anyone following the owner still passes. A script can also block it: nav commands reach the ship as HUH messages and the interior area's scripts are asked first, so a `CNCLMSG_PROG` there with `if ispc($n)` and `return cancel` stops passengers. That is one script per ship.\n\n**Add.** A `NAVMASK` stat on `GenNavigableBoardable` (which `GenCaravan`, `GenSailingShip` and `GenAirShip` extend), or a `Prop_HelmRestrict` property: a zapper mask for who may use `RAISE`/`LOWER ANCHOR`, `COURSE`, `STEER`, `SAIL`, `TENDER` and brakes, with `MESSAGE=\"The captain glares: hands off the wheel.\"`. Mobs with `Sailor` on the vessel, and Archons, always pass. An optional `ONFAIL=<script function>` lets a crew script react.\n\n**Example.** The ferry has `NAVMASK=\"-PLAYERS\"`. The pirate galleon the player is held on has `NAVMASK=\"-TATTOOS MUTINEER\"`, so the party can take the helm only after the mutiny quest.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* T5 (T5's PASSENGERONLY and T8's NAVMASK both keep passengers off the helm).", "d": "yes", "note": ""}, {"id": "T9", "theme": "T", "title": "Builder-set vessel pacing", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** How many ticks a vessel waits between moves and between turns are Java fields, `ticksPerMoves` and `ticksPerTurn`, both 1. Only `GenBalloon` changes them, in its constructor. They have no stat codes. A world-run vessel can be paced with `Patroller`'s `MIN` and `MAX`, but a player-steered one can only change `ABILITY`, which is rooms per tick and soon too fast.\n\n**Add.** `TICKSPERMOVE` and `TICKSPERTURN` stat codes on `GenNavigableBoardable`, `GenCaravan`, `GenAirShip` and `GenBalloon`, set with `MODIFY` or `MPSET` and kept in catalog and recipe templates. Optionally a `WEATHERSPEED=true|false` switch for the wind bonus.\n\n**Example.** A river barge with `ABILITY=1 TICKSPERMOVE=6` takes about a game hour to drift 25 rooms of river, so the trip downstream passes a sunset. An ox caravan and a fast courier get their own pace the same way.", "d": "yes", "note": ""}, {"id": "T10", "theme": "T", "title": "DelayedTransporter with messages, fares, conditions and party handling", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** `DelayedTransporter` takes `min`, `max`, `chance` and a list of rooms, and sends each mob to a random one when its own count runs out. There is no message, no look on arrival, no fare and no condition. It carries the mob's followers, but whoever's count ends first goes, so a follower may leave alone. Messages and conditions need a `GREET_PROG` or `DELAY_PROG` with `MPECHO`, or `Prop_ReqTattoo` on the exit.\n\n**Add.** `DEPARTMSG=`, `ARRIVEMSG=`, `LOOK=true`, `FARE=<n>` (taken from the leader, or from each member with `PERHEAD=true`), `MASK=<zapper>` for who is carried, and `DEST=ORDER|RANDOM` to cycle the list in order or pick at random. `PARTY=true` carries the whole party when the first member's time is up, so no one is left behind or sent ahead alone.\n\n**Example.** A druid circle: after 3 ticks in it, \"The standing stones hum and the world folds...\", and the party arrives at the Moonwell and sees it described. Only those with the GROVEFRIEND tattoo are carried (`MASK=\"-TATTOOS GROVEFRIEND\"`).\n\n*See also:* T5, T17 (Three fare rules for the party (T5's FARE, T10's PERHEAD, T17's PARTY=LEADER); settle one); T6 (Alternatives for a timed passage with messages and fares (Prop_Journey vs an extended DelayedTransporter)).", "d": "yes", "note": ""}, {"id": "T11", "theme": "T", "title": "Unique interiors when vessels are copied, and a VESSEL command", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** Every copy of a vessel keeps the same interior area name (the `shipbuilding.cmare` templates are all `UNNAMED_n`), and the Archon guide warns that ships sharing room IDs confuse the engine. The rename in `copyOf` is commented out, and catalog spawn and quest `LOAD` do not rename either. Changing a copy's name in `MODIFY ITEM` calls `Boardable.rename`, which fixes it, but on a cataloged item the change goes to the catalog entry instead. `GOTO <ship room id>` reaches the interior.\n\n**Add.** On `COPY`, catalog spawn, quest `LOAD` or `CREATE` from a template, give the interior area and its room IDs a unique name derived from the item's name. An option on the catalog entry keeps a fixed name. A `VESSEL` builder command: `VESSEL <item> RENAME <name>`, `VESSEL <item> ENTER` (go to its first room to edit) and `VESSEL <item> HOME <room>`.\n\n**Example.** The builder catalogs one \"merchant cog\" and places five on trade routes. Each gets its own interior (`Cog_Mira#0`, `Cog_Tern#0` and so on), and ship lookups never pick the wrong one.\n\n*See also:* S15 (Both deal with vessels whose interiors share room IDs (copies in T11, double-saved owned ships in S15)); DT28 (Both add a VESSEL builder command (RENAME, ENTER and HOME vs STATUS)).", "d": "yes", "note": ""}, {"id": "T12", "theme": "T", "title": "Waypoint network: fast travel between places found", "kind": "property or behaviour", "value": "medium", "effort": "medium", "body": "**Today.** `Prop_Transporter` goes to one fixed room, and `TaxiBehavior` offers every destination to everyone. `Concierge` with `PORTAL=true` on a stone item (`Mirewood#1=20;Highpeak#4=20;PORTAL=true`) lets the player pick a priced destination, but lists them all from the start. Travel \"between the stones you have found\" takes a script per stone: `MPTATTOO` in a `GREET_PROG`, then a `SPEECH_PROG` that builds a list from `HASTATTOO` and uses `MPCHOOSE`, `MPMONEY` and `MPTRANSFER`.\n\n**Add.** A declarative waypoint, as a `Prop_Waypoint` property or `Waystone` behaviour for items or rooms: `NETWORK=`, `NAME=`, `DISCOVER=ENTER|TOUCH|RITUAL|QUEST`, `COST=` (`moves 20`, `gold 5` or mana), `TIME=<game hours>` (T4), `MASK=` and `MSG=`. Found waypoints are saved per character or profile. `TRAVEL`, `TOUCH` or `USE` at one lists the found ones of that network; `TRAVEL <name>` moves the party there.\n\n**Example.** Six elven waystones across the realm. The party attunes each as it explores, and later goes from the Mirewood stone to Highpeak in an hour of game time for 20 mana, but never to a stone it has not found.\n\n*See also:* T4, T6, T18 (T6, T12 and T18 use T4's travel time).", "d": "yes", "note": ""}, {"id": "T14", "theme": "T", "title": "Named ports, and COURSE TO a place", "kind": "property, command", "value": "medium", "effort": "medium", "body": "**Today.** `COURSE` takes direction words only, so a player crossing an ocean grid works out the path step by step. `SEACHART ADD` and `SEANAVIGATE <n>` (`Skill_SeaCharting`, `Skill_SeaNavigation`) route to a charted point and set the course, but over water only, and to points the player made. `Concierge`, `TaxiBehavior` and `Patroller` route to rooms the builder lists. A builder cannot name a port or landmark the game understands.\n\n**Add.** A `Prop_Port` property for rooms: `NAME=\"Port Azure\"`, `KIND=SEA|ROAD|AIR|SPACE`, `HIDDEN=true|false` and an optional `KNOWNMASK` for who knows it. `COURSE TO <port|room id>`, `SAIL TO` and `DRIVE TO` compute a route over water, drivable rooms or air with the tracking library, refuse an unknown or unreachable place, and take the voyage's turn-based time. Points from `SEACHART` are accepted too. A `PORTS` command lists the known ports.\n\n**Example.** On a bought sloop the player types `course to port azure`, and the ship sails the 40-room channel by itself. The hidden \"Smuggler's Cove\" becomes known when a quest gives the tattoo its `KNOWNMASK` asks for.\n\n*See also:* T3, T5 (One route-finder serves T3's MPSAIL TO, T5's stops and T14's COURSE TO a named port).", "d": "yes", "note": ""}, {"id": "T16", "theme": "T", "title": "MovingRoom routes in the world files, with saved position", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** `MovingRoom` reads its routes from one global file, `resources/movingroom.xml`, outside world/ and not exported. Its position (`currentStop`, `isReversed`, `currentStatus`) is in plain fields, reset on restore. It adds and removes exits and appends text to real room descriptions, and builder export reads the live rooms, so that text and those exits can likely end up in the world files (to verify). The line and display settings it parses (`LINEPRINTNAME`, `ROOMPRINTNAME`, `DISPLOC`) are never used.\n\n**Add.** Let the parameters carry the route inline (`ROUTE=<xml>`) or name a file under `world/routes/`. Allow a timetable by game hour (`DEPART=`) as well as ticks. Save `currentStop`, `isReversed` and `currentStatus` in world.xml. Make the exits and description text temporary overlays that export skips. Show the line and where the car is on a sign item, or with a `TIMETABLE` command.\n\n**Example.** The dwarven mine lift, its route in `world/routes/deepdelve-lift.xml`, visits Surface, Level 2 and the Deeps. A brass plate at each landing reads \"Lift: descending to the Deeps\". A save made on the lift restores it mid-shaft.\n\n*See also:* S9, S17 (T16 saves MovingRoom's position, which S17 assigns to S9's STATE stat); T5 (Two timetabled routes with a saved position (TransportLine vs MovingRoom with DEPART=)).", "d": "yes", "note": ""}, {"id": "T17", "theme": "T", "title": "Fares for the whole party", "kind": "property and behaviour", "value": "low", "effort": "small", "body": "**Today.** `Prop_TicketTaker` takes one parameter, the fare. It charges every player character who boards (mounts, sits, enters or sleeps aboard) and remembers who has paid. Party characters are all players, so each one must carry coin and pay alone. `TaxiBehavior` keeps one rider, who pays, and lets off only those who mounted. Neither has an option for the leader to pay, or for pets or cargo.\n\n**Add.** A `PARTY=LEADER|EACH` parameter for both, and for the proposed transport line if it is approved. With `LEADER`, the leader pays once, per head, for the members and their mounts, and the others board without being stopped. `EACH` is today's rule. Optional `PETS=<price>` and `CARGO=<price per 100 lbs>`.\n\n**Example.** A ferry gangplank charges 2 silver with `PARTY=LEADER PETS=5`. The leader of four with a horse pays 4 x 2 plus 5. The other three walk aboard.\n\n*See also:* T5, T10 (Three fare rules for the party (T5's FARE, T10's PERHEAD, T17's PARTY=LEADER); settle one).", "d": "yes", "note": ""}, {"id": "T18", "theme": "T", "title": "Builder-marked roads for caravans", "kind": "property", "value": "low", "effort": "small", "body": "**Today.** Caravans go only where `isDrivableRoom`
