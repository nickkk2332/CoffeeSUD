tion steps do not. Acting at a waypoint takes a Scriptable: ENTRY_PROG 100 with `IF INROOM($i == Gate#1)`, then `MPFORCE $i lock door`. A night route is a TIME_PROG that runs MPUNBEHAVE Patroller and then MPBEHAVE Patroller with another route.\n\n**Add.** New step tokens:\n- `WAIT=n` (ticks);\n- `DO=<command>`, forced, e.g. `DO=lock door`;\n- `EMOTE=text`;\n- `IF=<zapper mask on host>`, which skips to the next RESTART unless it matches;\n- named routes `ROUTE=DAY:...;ROUTE=NIGHT:...`, picked by time of day;\n- `RESUME=true`, which after combat tracks back to the last waypoint. Only direction routes need it.\n\n**Example.** `Patroller min=3 max=3;Gate#1;WAIT=5;DO=say Gate secure.;Wall#4;EMOTE=peers over the battlements.;Wall#7;WAIT=3;RESTART`. At night a ROUTE=NIGHT takes the same guard round the barracks with a lantern.\n\n*See also:* N3, N8 (N16's day and night patrol routes overlap N3's Schedule, and N8's catch-up moves both when an area wakes).", "d": "yes", "note": ""}, {"id": "N17", "theme": "N", "title": "Warning before aggression", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** Aggressive attacks on sight after an optional `delay=` and one `MESSAGE=`. Its `BRIBE=` form warns with `BRIBEPAYMSG` and waits, but only for a price, and the wait is miscomputed (N18). Its zapper mask already spares chosen players. A warning that escalates needs a script: GREET_PROG, MPALARM or DELAY_PROG, `IF INROOM($n == $i)`, MPKILL $n. Yet one wrong room can end a single-player run.\n\n**Add.** Options for Aggressive, VeryAggressive, WimpyAggressive and MobileAggressive: `WARN=\"line|line\"`, one line per tick for `WARNTICKS=n`, then the attack if the intruder is still there; `BACKOFF=true`, leaving, sitting down or dropping the weapon resets the warning; `NEAR=1`, the warning is heard as a sound in the rooms next door.\n\n**Example.** A wolf den guardian: `Aggressive WARN=\"The wolf bares its teeth.|The wolf snarls and crouches!\" WARNTICKS=2 BACKOFF=true +ITEM \"-raw meat\"`. The mask spares a player carrying raw meat.\n\n*See also:* N18 (N18 fixes the Aggressive BRIBE wait window that N17's warning options build on).", "d": "yes", "note": "assuming it is optional"}, {"id": "N18", "theme": "N", "title": "Fix the NPC behaviour bugs a world will hit", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** Seven confirmed bugs that a builder would take for mistakes in their own setup. MOBHunter looks up `Thief_Assasinate` (misspelt), so isHunting is always false, and it can pick itself as prey. MudChat `<30>` tick entries fire on about 71% of ticks (also N19). Aggressive's `BRIBE=` uses the peace ticks as the pay window, as do VeryAggressive and WimpyAggressive; MobileAggressive extends Mobile and needs a separate check. Loyalty's interval, (2*60)/4000, is 0, so it searches every tick. The GoodGuardian and GoodExecutioner pause between attacks never arms. EvilExecutioner skips its noRecurse guard and Scavenger takes items it cannot get or see, both because `&&` binds tighter than `||`.\n\n**Add.** Fix all seven, each with a smoke or engine test.\n\n**Example.** A bounty hunter on MOBHunter follows its hunt through instead of restarting it every cycle, and a drunk's `<10>` hiccup comes up 10% of the time, not 90%.\n\n*See also:* N13 (later) (Both fix Loyalty's zero interval); N17 (N18 fixes the Aggressive BRIBE wait window that N17's warning options build on); N19 (Both fix the MudChat <30> tick entry firing on about 71% of ticks).", "d": "yes", "note": ""}, {"id": "N19", "theme": "N", "title": "Fix the MudChat defects", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** Chat files behave differently from `MUDChat.html` in eight confirmed ways. A `<30>` tick entry fires on about 71% of ticks (also N18). Tick expressions force every connector to AND, so `|` and `~` are ignored. `${PERSONALITY:3}` parses the wrong substring and crashes in nextInt(0). An empty reply line drops the replies after it. An `@` include adds the original say entry, not the re-parented copy. lastSpeakerM is never set, so expiry is never extended or reset. Tick entries take the last match, speech the first. The guide calls the LLM prefix a quote; the code uses a backtick.\n\n**Add.** Fix each, make tick and speech matching agree, correct the guide, and add a MudChat test to the engine suite (Commands/Test.java has none).\n\n**Example.** A tavern drunk with a `<5>` hiccup line hiccups about one tick in twenty, as meant, not nearly every tick.\n\n*See also:* N11 (Both change MudChat's chat-file parser (guards and operators vs connector and tick fixes); do them together); N18 (Both fix the MudChat <30> tick entry firing on about 71% of ticks).", "d": "yes", "note": ""}, {"id": "N20", "theme": "N", "title": "Escortee: an NPC that travels with the party to a destination", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** The escort quest templates (normal_, auto_ and competitive_escort1 and 2) MPFORCE the NPC to follow the player and track arrival with a player script; the NPC never knows the way, waits or panics. It speaks only when forced: the quest instructions on accept and $ESCORTED_RESPONSE on arrival, nothing on the way. Left without a leader, it is purged at the second check. Concierge `MOBILE=true` leads, but drops its followers on arrival. TaxiBehavior carries riders with trail options such as NOLOCKS and NOWATER. A leading escort can be scripted with MPTRACKTO, ENTRY_PROG and INROOM(), DEATH_PROG and MPSTEPQUEST, at length.\n\n**Add.** An `Escortee` behaviour: `DEST=<room id>`, `MODE=LEAD|FOLLOW`; `WAITFOR=LEADER`, stop while the leader is away and call \"Wait for me!\" after n ticks; `PANIC=FLEE|HIDE|COWER` when attacked; `AVOID=<room mask>`; `TALK=room:line` remarks on the way; `ONARRIVE=` and `ONDEATH=` actions (say, set a script variable, call a script function that steps or wins the quest); `TIMEOUT=`.\n\n**Example.** A merchant met at a crossroads: `Escortee DEST=Riverford#1 MODE=LEAD WAITFOR=LEADER PANIC=COWER TALK=\"Bridge#3:They say trolls live under here.\" ONARRIVE=\"SAY Thank you, friends!;SETVAR $n ESCORTED 1\"`.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "N21", "theme": "N", "title": "A configurable Hireling", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** Hireling takes only `price;minutes;zappermask`. Its keywords (HIRE, HIRELING, WORK, WORKS, TIME, AVAILABLE), lines and refusal are fixed, its contract is not saved, and the HIRE command only says \"Are you for hire?\". A scripted hireling works and is saved: BRIBE_PROG, `mpforce $i follow $n`, a tattoo or VAR for the contract, DELAY_PROG or QUEST_TIME_PROG to end it, MPMONEY for wages.\n\n**Add.** Hireling parameters: `KEYWORDS=`; `MSG_OFFER=`, `MSG_HIRED=`, `MSG_REFUSE=`, `MSG_EXPIRE=` (or Prop_NPCLines, if approved); `CONTRACT=MINUTES|DAYS|QUEST:<name>|UNTILFIRED`; `UPKEEP=` coins per game day from the player; morale: it leaves if unpaid, or below a set HP% unless loyal, and AFFINITY raises loyalty; `REFUSE=<order mask>`. HIRE opens the terms as a menu. The contract is saved.\n\n**Example.** A mercenary captain with `CONTRACT=QUEST:goblinwar UPKEEP=5 MSG_HIRED=\"My blade is yours till the goblin king falls.\"` leaves when the quest ends, or after two unpaid days.\n\n*See also:* N12 (N21's MSG_ parameters for Hireling lines are an alternative to N12's Prop_NPCLines); N13 (later) (Two NPC party-member behaviours with loyalty, orders and saved terms; Companion and a configurable Hireling overlap); S9 (N21's saved Hireling contract is S9's Hireling STATE).", "d": "yes", "note": ""}, {"id": "N22", "theme": "N", "title": "Event barks with conditions and cooldowns, in Sounder", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** Sounder already gives event-keyed one-liners on MOBs, rooms, items and areas: timed SOUND, PORTAL_ENTER (arrivals), PORTAL_EXIT, WIELD, WEAR, HOLD, GET, DROP, OPEN, DAMAGE and FIGHT, with $n, $p, $e and $s. Time, weather, low hit points, shop and bribe barks need Scriptable progs (TIME_PROG, RAND_PROG with ISWEATHER, HITPRCNT_PROG, BUY_PROG, BRIBE_PROG) written as nested IF RAND chains.\n\n**Add.** Extend Sounder rather than add a behaviour: a compact table, inline or `FILE=barks/guard.txt`, of `EVENT: weight line`. New events GREET_FIRST, KILL, FLEE, ALLY_DIES, IDLE, DAWN, DUSK, NIGHT, RAIN, SNOW, HURT<n%, SEE_ITEM(mask), SEE_MOB(mask), SHOP_LIST, SHOP_BUY, BRIBED. A mask condition per line; CHANCE= and COOLDOWN= per event; ONCEPERPLAYER; SAY, EMOTE or SOUND prefixes as in MudChat; lines drawn with the seeded dice.\n\n**Example.** A city guard: GREET \"Move along.\" | \"Keep your blade sheathed.\"; WIELD(+WEAPONCLASS SWORD) \"Put that away in the city!\"; NIGHT \"Curfew's at the bell.\"; HURT<30 \"To me! Guards!\".\n\n*See also:* PR10 (Both add per-line time, weather and mask conditions, weights and once or cooldown rules to Sounder).", "d": "yes", "note": ""}, {"id": "N23", "theme": "N", "title": "Rumours: a world list, gossiping NPCs, rumours from events", "kind": "data file, behaviour and script command", "value": "medium", "effort": "medium", "body": "**Today.** No rumour, news or gossip system exists; every \"heard any rumours?\" answer is written per NPC and goes stale. The workaround is shared script variables on a global host (MPSETVAR, saved) read back by SPEECH_PROG or MudChat `$%VAR(...)%`, with masks, expiry, weights and tell-once made by hand.\n\n**Add.** A `world/rumors.txt` file: text, AREA or room mask, condition (+IF or quest state), weight, EXPIRES (game days), TELLONCE. A `Rumors` behaviour (`TOPICS=rumor news gossip CHANCE=10`) answers those words with a fitting rumour and sometimes volunteers one. `MPRUMOR ADD|REMOVE \"text\" AREA=... DAYS=...` for scripts and quests. Optional automatic rumours: area conquered, quest started or won, named NPC killed. Rumours told are kept per player (and in the notes, if approved) and saved.\n\n**Example.** The Riverford barmaid hints \"Black Ned's gang camps by the old mill.\" Ned's DEATH_PROG runs `MPRUMOR ADD \"They say a stranger killed Black Ned\" AREA=Riverford DAYS=10`, and she passes that on.\n\n*See also:* PR7, N24, N28 (N23 (later)'s rumours, N24's [[topic]] lines and N28's overheard scenes can write PR7 journal entries).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N24", "theme": "N", "title": "Topic keywords the player can learn and list", "kind": "presentation", "value": "medium", "effort": "medium", "body": "**Today.** The player cannot know which words an NPC reacts to, so quest templates give the phrase outright (\"say i accept\"). The pieces exist: colour codes such as `^y...^?` highlight a word, `ask <npc> <topic>` or `sayto` fires SPEECH_PROG and MudChat keyword entries, and a VAR or tattoo can remember a topic.\n\n**Add.** Markup `[[mine]]` or `[[the old mine|mine]]` in NPC lines (MudChat, Scriptable say, dialogue) highlights the word and teaches the topic to the character, saved. `ASK <npc> ABOUT` (or TALK) with no topic lists the NPC's topics the player has learned: MudChat keywords, SPEECH_PROG words, dialogue nodes. `HINTTOPICS=true` lists an NPC's topics on first meeting. MudChat indexes entries by their longest word, so the listing needs care.\n\n**Example.** The innkeeper says \"Folk don't go near the [[old mine]] since the [[collapse]].\" In the next village, `ask miner about collapse` gets the miner's entry.\n\n*See also:* N9 (N24's topic list is shown by N9's TALK, or ASK, with no topic); PR7, N23 (later), N28 (N23 (later)'s rumours, N24's [[topic]] lines and N28's overheard scenes can write PR7 journal entries).", "d": "yes", "note": ""}, {"id": "N25", "theme": "N", "title": "LLM calls off the game thread", "kind": "behaviour, script command and world option", "value": "medium", "effort": "medium", "body": "**Today.** In single-player, executeRunnable queues every job on the one game thread. A MudChat backtick reply or MPLLM calls LLMSession.chat there, so the HTTP call can freeze the game, terminal and windows included, for up to 20 seconds. Timeout and temperature are fixed at 20 s and 0.7. This matters only to owners who install the langchain4j jar (LANGCHAIN4J_JAR_PATH is empty by default).\n\n**Add.** Run LLMSession.chat on a dedicated worker thread, the one exception to the single game thread, and post the reply back as a game-thread job into the NPC's say queue. Show \"X ponders your words...\" at once. Ini settings LLM_TIMEOUT and LLM_TEMPERATURE, and a per-NPC `${LLMTEMP}`. In turn-based time the reply arrives before the next prompt. MPLLM gets a callback form: `MPLLM host var prompt CALLBACK=FUNC`.\n\n**Example.** The LLM-voiced oracle no longer locks the game: the player sees \"The oracle closes her eyes...\" and her answer follows seconds later, while a turn-based world waits.\n\n*See also:* N10 (Both make NPC replies land before the next prompt in turn-based time, N25 (later) for LLM replies).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N26", "theme": "N", "title": "LLM NPCs with lore files and saved memory per player", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** Context per message already works: the text after a backtick reply goes through mcFilter each time, so `$<...>` (speaker), `${...}` (NPC) and `$%...%` (script functions) can tell the LLM who speaks and when; a `${LLMCONTEXT=}` is not needed. Lore fits in the system prompt via `${LLMPROMPT=...}`, `${LLMPROMPT+...}` or an included `%file`. But memory is one session per NPC, reset after a hard-coded 360000 ms idle and lost on save. Document retrieval is Archon-only and commented out.\n\n**Add.** `${LLMLORE=lore/riverford.txt}` per NPC, chat group or area, plus a world lore file, put in the system prompt, or retrieved by embedding when large; `LLMMEMSCOPE=PERPLAYER|NPC`; `LLMIDLE=` game minutes before reset, or never; the transcript saved with the game.\n\n**Example.** The village elder knows from the lore file that the dam broke last spring, greets the player by name, mentions their unfinished \"Missing Sheep\" quest, and after a save and reload remembers their talk.\n\n*See also:* S9 (N26 (later)'s saved LLM transcript is S9's LLM session state).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N27", "theme": "N", "title": "LLM NPCs that act from a declared whitelist", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** An LLM NPC can only talk: every reply becomes `say`. Crude hooks exist: its SPEAK_PROG fires on its own reply, so `SPEAK_PROG p 'go through'` can run `mpopen gate`, and MPLLM puts a reply in a VAR for IF and STRCONTAINS to check. But the reply has no target ($t is null), tags would be spoken aloud, and nothing limits what may happen or how often per player.\n\n**Add.** `${LLMACTIONS=GIVE(rusty key) ONCE; SETVAR(TRUST 0-10); STARTQUEST(minerats); EMOTE; ATTACK IF AFFINITY<-50}` declares the allowed actions, and the system prompt explains tags such as `[[GIVE rusty key]]`. MudChat strips the tags from the speech, checks each against the list and its per-player limits, and runs it as MOBPROG commands, the NPC as monster and the speaker as $n. Rejected tags are logged. CHATTEST, if approved, tests it.\n\n**Example.** A gatekeeper with OPEN(gate) declared is talked round and answers \"Fine, go through.\" `[[SETVAR TRUST 8]] [[OPEN gate]]`; the gate opens. Undeclared, it would not.", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N28", "theme": "N", "title": "Scene: NPC exchanges the player overhears", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** MudChat ignores other NPCs' speech and stays quiet 8 ticks after one speaks, so NPCs cannot converse. A scene can be one Scriptable on the room or an actor: GREET_PROG, ENTRY_PROG or TIME_PROG starts it, `if var($n SAW_SCENE) == ''` makes it once per player, `mpforce guard1 say ...` gives each line, chained with `mpalarm <ticks> mpcallfunc NEXTLINE`. It works but is tedious to keep in step.\n\n**Add.** A `Scene` behaviour on a room or NPC: `ACTOR guard1=+NAME \"tall guard\"`, then lines such as `guard1: say Heard the bandits hit the mill again.`, `guard2: emote spits.`, `PAUSE 1`; conditions (player present, time of day, quest state); `REPEAT=n` days or ONCE per player; `INTERRUPTIBLE`, actors stop and turn to a player who speaks to them. Lines run on turns in turn-based time. An overheard scene can post a rumour or note.\n\n**Example.** Entering the barracks at night plays, once, two guards arguing about the captain's bribes; it unlocks a \"captain\" topic and a rumour.\n\n*See also:* SC7 (Two answers to scripted cutscenes: MPWAIT in any script, or a Scene behaviour for NPC exchanges); PR7, N23 (later), N24 (N23 (later)'s rumours, N24's [[topic]] lines and N28's overheard scenes can write PR7 journal entries).", "d": "yes", "note": ""}, {"id": "N29", "theme": "N", "title": "CHECK(): a skill check for dialogue", "kind": "script function", "value": "low", "effort": "small", "body": "**Today.** Persuade, intimidate and deceive options need hand-written arithmetic. The parts exist: STAT(<who> CHA), ISABLE(<who> <skill>) for proficiency (e.g. `$%ISABLE($n Skill_Haggle)%`), FACTION(), RAND() and RANDNUM() on the shared seeded dice, and MATH(). So `if rand() <= math(STAT($n CHA)*3 + ISABLE($n Skill_Haggle)/2)` works, but each builder writes it differently and nothing explains the result.\n\n**Add.** A function `CHECK(<who> <STAT|skill ID> <difficulty> [modifier])` that rolls the shared dice, adds the stat bonus or skill proficiency and any AFFINITY or faction modifier, and returns true or false. It sets `$<who CHECKMARGIN>` and can show \"[Charisma check: success]\"; a config option hides or shows the rolls. Dialogue CHOICE lines take `CHECK=` directly, if the dialogue tree is approved.\n\n**Example.** `if CHECK($n CHA 15 $%AFFINITY($i $n)%/10)` makes the toll-keeper waive the fee; on failure he raises it.\n\n*See also:* N14 (later), N2, N9 (N2's MPDIALOG, N9's TALK fallback and N29's CHECK= on choices all hook into N14 (later)'s dialogue trees).", "d": "yes", "note": ""}, {"id": "C1", "theme": "C", "title": "Healing and support aimed at the ally who needs it", "kind": "behaviour", "value": "high", "effort": "small", "body": "**Today.** CombatAbilities casts helpful skills only on itself or on the mob it follows, and only when that leader is in the room. Through CombatAbilities, a shaman heals its chief only if it follows him, and then its Aggressive needs MISBEHAVE. Healer casts one of six fixed prayers on a random inhabitant whose group leader is a player, only while a player is in the room, whether hurt or not. NiceAbilities (`min=1 max=1 ; <zapper mask>`) already casts the mob's own beneficial skills on a random inhabitant matching the mask, NPCs included, in or out of combat, while a player is in the room. A cure goes only to a target that is hurt or diseased, because its castingQuality is BENEFICIAL_OTHERS only then. So Clericness plus NiceAbilities with a mask matching the chieftain heals him without following him, and buffs him before a fight. CombatAbilities also has a PRECAST stat that casts self-buffs out of combat every n ticks, but only Java sets it. Nothing picks the most hurt ally, waits for an HP threshold or cures first.\n\n**Add.** On CombatAbilities and its presets (Clericness and the like): `SUPPORT=SELF|LEADER|GROUP|MASK:<zapper>`, `HEALAT=50` (only allies under 50% HP, the most hurt first), `CUREFIRST=Poison,Disease`, and `BUFFOUTOFCOMBAT` (buff allies before a fight). On Healer and NiceAbilities (which already takes a zapper mask): `HEALAT=` and most hurt first. On Healer also `SPELLS=id,id` and `TARGET=GROUP|MASK:<zapper>`.\n\n**Example.** A goblin shaman with `Clericness MIXEDDEFENSIVE SUPPORT=MASK:\"-RACE +Goblin\" HEALAT=60` keeps the chieftain standing, so the party learns to kill the shaman first. A temple acolyte: `Healer HEALAT=70 SPELLS=Prayer_CureSerious,Prayer_CureDisease TARGET=MASK:\"-NPC\"`.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* C22 (Both add CombatAbilities options for healing and when to use abilities (HEALAT and SUPPORT vs BELOW, SELF and COOLDOWN)).", "d": "yes", "note": ""}, {"id": "C2", "theme": "C", "title": "Morale: mobs and groups that flee, rally or surrender", "kind": "behaviour, script trigger", "value": "high", "effort": "medium", "body": "**Today.** Mobs fight to the death or flee on their own. FightFlee rolls a flee chance every tick whatever the HP, Wimpy flees by mask, and the engine's wimpy HP is absolute and out of reach on generic mobs. For a gang to break when its chief dies, the chief needs a DEATH_PROG that loops over the gang with MPFORCE $0 flee. Surrender exists only as the player skill Thief_Surrender.\n\n**Add.** A behaviour `Morale`. `FLEEAT=30%` and `OUTNUMBERED=2.0` (enemies to allies in the room). `BREAK=LEADERDEAD|50%DEAD|HP<20%`: the leader is the mob it follows or `LEADER=<mask>`, and the group is its followers and BrotherHelper allies. Then `ACTION=FLEE|SURRENDER|BERSERK`, with `CHANCE=` and `MSG=`. `RALLY=<room>` with `REGROUP=n`: it flees there, rests n ticks, then comes back with any allies there. `SURRENDERAT=15%`: it drops its weapon, makes peace (reusing Thief_Surrender's peace logic), says `SURRENDERMSG=` and fires a new SURRENDER_PROG. BERSERK gives damage +30% and attack -10%. `BRAVE=<mask>`: never breaks.\n\n**Example.** Goblins: `Morale FLEEAT=40% BREAK=LEADERDEAD ACTION=FLEE RALLY=Warren#12 REGROUP=15`. Kill the chieftain and they scatter to the warren, then return with the shaman. A bandit with `SURRENDERAT=20%` begs for mercy, and its SURRENDER_PROG offers to show where the loot is.\n\n*See also:* C17 (Both make a mob stop fighting at low HP and fire a trigger (SURRENDER_PROG vs YIELD_PROG)).", "d": "yes", "note": ""}, {"id": "C3", "theme": "C", "title": "BossPhases: boss phases that fire once per fight", "kind": "behaviour, script trigger, script function", "value": "high", "effort": "medium", "body": "**Today.** Every phase action exists as a MOBPROG command (MPCAST, MPMLOAD, MPBEHAVE, MPAFFECT, MPHEAL, MPTRANSFER, MPECHO). But HITPRCNT_PROG fires every tick while HP is under its threshold. So each phase needs a guard. A per-instance tattoo (MPTATTOO) works best, because MPSETVAR variables are keyed by the mob's name and shared by its copies. Guards must be cleared by hand in DEATH_PROG, or a tattoo saved mid-fight comes back on rejuv. MPNOTRIGGER mutes every HITPRCNT prog at once.\n\n**Add.** A behaviour `BossPhases`. Phases are `AT=75%`, `AT=ROUND n`, `AT=ADDSDEAD`, `ONENGAGE:` and `ONDEATH:`, and each fires once per fight. Actions: SAY, EMOTE, YELL, CAST, SUMMON <catalog name> xN (gone when the fight ends), BEHAVE/UNBEHAVE, AFFECT or REMOVE <ability> [ticks], IMMUNE ticks, HEAL n%, MOVETO <room>, ROOM EMOTE/AFFECT, CALL <function>. `RESET=FULLHEAL|LEAVECOMBAT|LEASH|NEVER` says when the phases rearm. The phase is per instance, saved with the mob, and set back to 1 on rejuv. Scripts get PHASE_PROG n and `PHASE($i == n)`.\n\n**Example.** A lich: `BossPhases ONENGAGE: SAY \"Fools!\"; AT=60%: SUMMON skeleton-warrior x2; AT=25%: AFFECT Prop_AbilityImmunity \"WEAPONS\" 3, MOVETO Crypt#9, HEAL 20%; ONDEATH: ROOM EMOTE \"The phylactery cracks.\"`\n\n*See also:* ST15, C21 (C3's ONENGAGE and rearm and C21's reset need the combat start and end detection that ST15 adds); C21 (C3's RESET=LEASH rearm and C21's EncounterReset both reset a boss whose party walked away).", "d": "yes", "note": ""}, {"id": "C4", "theme": "C", "title": "Spawners with catalog weights, conditions and despawn", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** The catalog is mounted under resources/catalog, with one all.cmare per category. So `RandomMonsters ... ;catalog/mobs/wolves/all.cmare` and `MPMLOAD fromfile` already draw from it. To weight the picks, a builder has to repeat entries in a hand-made file. RandomMonsters and RandomItems filter only by room kind, and what they spawn stays forever. A quest can spawn on conditions with a room mask, LOAD MOBGROUP and DURATION, but that takes one quest per spawn.\n\n**Add.** New parameters on RandomMonsters and RandomItems:\n- `CATALOG=\"grey wolf=5,dire wolf=1\"`: weighted catalog names;\n- `WHEN=\"<mask>\"`, tested on the chosen room;\n- `DESPAWN=WHENFALSE|DAWN|TICKS=n`: the mob leaves unseen;\n- `NEAR=PARTY:3`: spawn within 3 rooms of the player;\n- `MAXAREA=n`;\n- `LEVEL=PARTY±2`, using the catalog's level adjustment.\n\nThis complements DEVPLAN item 1, which covers catalog items.\n\n**Example.** Pine Forest: `CATALOG=\"grey wolf=4,dire wolf=1\" WHEN=\"+SEASONS WINTER +HOURS 19-5\" DESPAWN=DAWN maxmonsters=6`. Wolves roam winter nights and are gone by morning.\n\n*See also:* SC3, C9 (All three add a catalog source to RandomMonsters and MPMLOAD (catalog:name, CATALOG= weights); settle one syntax).", "d": "yes", "note": ""}, {"id": "C5", "theme": "C", "title": "Telegraphed attacks: named, cancellable, saved alarms", "kind": "script command, script function", "value": "high", "effort": "medium", "body": "**Today.** MPALARM <ticks> <command> delays an action. The function it fires can check things at that moment: a stun (`AFFECTED($i Spell_Stun)`), the caster's death, or a `braced` tattoo set by a BRACE command made with CNCLMSG_PROG HUH. DELAY_PROG can repeat a warning. But alarms have no name. MPNOTRIGGER cannot cancel them, nothing can ask about them, and they are not written to the save. GenAbility has no cast time; CHANNELING only stops auto-attacks.\n\n**Add.** `MPALARM NAME=<name> <ticks> <command>`, `MPALARMCANCEL <name>`, and `ALARM($i <name>)` for the ticks left. Named alarms are saved. They are cancelled when the caster dies, is stunned or is knocked out. On top of them: `MPTELEGRAPH <ticks> \"<warning>\" <command> [INTERRUPT=STUN,DAMAGE>20%,MOVE] [AVOID=LEAVE|HIDE|COMMAND:brace]`. It shows the warning each tick, and LOOK shows '<boss> is gathering power'. A GenAbility field `WINDUP=ticks` with `WINDUPMSG` lets mobs using CombatAbilities telegraph custom abilities.\n\n**Example.** \"The dragon rears back, flames gathering in its throat!\" Two turns later its breath does 8d10 fire to everyone in the room, except those who typed BRACE behind a pillar. If the party stuns it first, the breath is cancelled.\n\n*See also:* S7 (Both save pending MPALARMs (C5's named alarms, S7's queued alarms)).", "d": "yes", "note": ""}, {"id": "C6", "theme": "C", "title": "Prop_PartyScaler: scale fights to the party's size", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Prop_Doppleganger scales a mob's level to its foes. With DIFFGRP=true it counts the group and scales DIFFADD and DIFFPCT per member, and PLAYERSNFOLS, LEVELCODE, MIN and MAX tune it. But it rescales only at full HP and changes only stats that follow from level. It also skips Archon characters, so a builder testing it sees nothing. Extra mobs per party member need a GREET_PROG loop over NUMPCSROOM with MPMLOAD.\n\n**Add.** `Prop_PartyScaler` for mobs, rooms or areas, an extension or sibling of Prop_Doppleganger: `BASE=3` (the party size it is tuned for), `HP=+25%/MEMBER`, `DAMAGE=+10%/MEMBER`, `ATTACK=+5/MEMBER`, `LEVEL=AVG+2`, `MIN=`, `MAX=`, `ADDS=catalog:skeleton/MEMBER-ABOVE-2`, `WHEN=ENGAGE`. MEMBER counts the leader's party and followers in the room (core/Party). Scaling applies when combat starts and holds until the fight resets. It shows in CONSIDER and honours the PLAYTEST toggle.\n\n**Example.** The Bone King is tuned for 3 characters. Against 1 he has 50% less HP and no skeleton guards; against 5 he has 50% more HP and two extra guards.\n\n*See also:* C25 (C25's CONSIDER ALL notes when C6's party scaling applies).", "d": "yes", "note": ""}, {"id": "C7", "theme": "C", "title": "Checkpoints: per-character respawn points", "kind": "property, script command, script function, world option", "value": "high", "effort": "medium", "body": "**Today.** `MPBEACON <room> all` sets the start and recall room of every character in the room. With DEATH=START, a dead character wakes there, and ISRECALL() reads the room. So a shrine is a room script: a 'pray' command made with CNCLMSG_PROG HUH runs mpbeacon, mpheal and `mprejuv area`. PLAYERDEATH=RETAIN,RECALL already avoids corpse runs. But MPBEACON also moves the recall room, every shrine is a separate script, and saving from a script is untested. DEATH_MASK entries matched on tattoos fail when a character has several tattoos, because their order is undefined.\n\n**Add.** `Prop_Checkpoint` on rooms: `NAME=\"Old Shrine\"`, `ON=ENTER|REST|COMMAND:pray`, `HEAL=100%`, `RESPAWNAREA=true|false`, `SAVE=AUTO` (an autosave slot). It records the room as each party member's respawn point. The point is saved in the character and kept apart from the recall room. A `DEATH=CHECKPOINT` keyword falls back to START when no checkpoint is set. Scripts get `MPSETRESPAWN $n <roomid>` and `RESPAWNROOM($n)`.\n\n**Example.** With PLAYERDEATH=RETAIN,RECALL and DEATH=CHECKPOINT, a character killed in the crypt wakes at the last shrine they prayed at, with their gear, and pays 10% of their gold. A shrine with RESPAWNAREA=true brings the crypt's skeletons back.\n\n*See also:* C8, C16 (Three changes to where and how the party wakes after death; C8's CHECKPOINT uses C7, and C16 makes the death rules per area); CR13 (Both set a per-character return point for the party (a respawn checkpoint vs a home start room)); S2, S23 (Three autosave designs (Prop_AutoSave, AUTOSAVE=n, a checkpoint's SAVE=AUTO), and S23's CHECKPOINT command shares C7's name).", "d": "yes", "note": ""}, {"id": "C8", "theme": "C", "title": "A downed state and rules for when the whole party falls", "kind": "world option, script trigger", "value": "high", "effort": "medium", "body": "**Today.** Each character dies alone by the global PLAYERDEATH list. OUT x knocks a character out safely for x ticks. ASTRAL and ASTRAL_RES leave a spirit that can be resurrected, and clerics have Prayer_Resurrect. But no ally can revive a fallen character during a fight, and there is no bleed-out window. Nothing notices when the whole party is down, because core/Party has no death handling. Prop_SparringRoom moves deaths to a set room, but it drops all followers and so breaks the party.\n\n**Add.** A new PLAYERDEATH option, `DOWNED x`. At 0 HP the character falls for x rounds and mobs ignore them. An ally's REVIVE, or a heal of at least y HP, brings them back. If the fight ends first, they get up at 1 HP. If x runs out, the rest of the PLAYERDEATH list applies. `PARTYDEFEAT=RESTORE|CHECKPOINT|DEATH` (or a list) applies when every party member is down or dead. RESTORE offers the latest save, and CHECKPOINT moves everyone there with a penalty expression. A PARTYDEFEAT_PROG fires on rooms and areas. The party stays together.\n\n**Example.** The healer drops at 0 HP, and the fighter types REVIVE on the next turn. Later the ogre kills the whole party. The game says 'Your party has fallen' and offers the save from the dungeon entrance. Another area's PARTYDEFEAT_PROG wakes the party in the goblin pens.\n\n*See also:* C7, C16 (Three changes to where and how the party wakes after death; C8's CHECKPOINT uses C7, and C16 makes the death rules per area).", "d": "yes", "note": ""}, {"id": "C9", "theme": "C", "title": "Random encounters on entering a room, from encounter tables", "kind": "behaviour, data file, script command, quest feature", "value": "high", "effort": "large", "body": "**Today.** RandomMonsters spawns on a timer, not when the party arrives, and picks evenly from a fixed list. Today an area script does encounters: ALL_GREET_PROG fires on every room entry, tests ISTIME, INLOCALE and a cooldown VAR, then runs MPMLOAD FROMGENFILE on generator XML that has weights and catalog members. That XML is heavy to write, sits under resources/, and caches results per parameter string, so the same picks repeat.\n\n**Add.** A behaviour `RandomEncounters` for areas and rooms: `TABLE=`, `CHANCE=` per room entered, `COOLDOWN=` (in rooms or game days), `LOCALES=`, `TRIGGER=<mask>`, `MAXACTIVE=`, and `DESPAWN=` after the party leaves. Tables are files `world/encounters/<name>.enc`, edited with an ENCOUNTER builder command. An entry has a weight, catalog members with dice counts and a leader, a party mask (+HOUR, +SEASON, -LEVEL, +GROUPSIZE), a level band, ONCE and COOLDOWN, and `FROM=HIDDEN|ADJACENT|HERE`. AMBUSH gives the monsters the first round. An entry can also be ITEM, EMOTE, TRAP, MERCHANT or FUNC <function>. `BUDGET=pct` adds entries until they reach that share of the party's power. Also add `mpmload encounter <table>`, the quest command `load encounter`, and `catalog:<name>` in RandomMonsters, MPMLOAD and MPOLOAD.\n\n**Example.** Darkwood: `RandomEncounters TABLE=darkwood CHANCE=10% COOLDOWN=6`. By day the party meets deer or a few bandits. At night it meets 2d3 wolves led by a dire wolf, or a wraith if the party is above level 8. Once, it meets a lost traveller whose FUNCTION_PROG starts an escort.\n\n*See also:* SC3, C4 (All three add a catalog source to RandomMonsters and MPMLOAD (catalog:name, CATALOG= weights); settle one syntax); C20 (C20's encounter: waves draw on C9's encounter tables); C23 (C23's ambush and C9's AMBUSH entries both give monsters a surprise first round, from encounter: tables); DT40 (later) (DT40 (later) simulates fights against C9's encounter: tables); C15, C25 (C9's encounter budget and C25's CONSIDER ALL both count C15's mob ranks).", "d": "yes", "note": ""}, {"id": "C10", "theme": "C", "title": "TargetPriority: which party member a monster attacks", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** TargetPlayer switches to the lowest-level player in the enemy group. CombatAbilities switches to whoever has dealt the most damage or healing, once that lead is clear: over 10% of its max HP and 1.5 times the current victim's. Any other choice takes a hand-written FIGHT_PROG for each monster. The script tests HITPRCNT() in a FOR loop and switches with MPKILL <name>.\n\n**Add.** A behaviour `TargetPriority`:\n- `PREFER=`: an ordered list from HEALER, CASTER, LOWESTHP, LOWESTARMOR, LEADER, LASTHITME, STRONGEST and MASK:<zapper>;\n- `SWITCH=30`: the chance per tick to switch;\n- `STICKY=3`: ticks before it may switch again;\n- `TAUNTABLE`: a clear aggro lead overrides the list.\n\n**Example.** An assassin with `TargetPriority PREFER=CASTER,LOWESTHP SWITCH=50` goes for the mage. An ogre with `PREFER=LASTHITME STICKY=4` turns on whoever hit it last. Pack wolves with `PREFER=LOWESTHP` gang up on the wounded.\n\n*See also:* C18 (Both choose which party member a monster attacks (a behaviour vs script threat functions)).", "d": "yes", "note": ""}, {"id": "C11", "theme": "C", "title": "Pursue: chase a fleeing target, then go home", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** Fleeing one room usually escapes. VeryAggressive has a 15% chance per tick to step into a room next door that holds a target. It has no leash and does not return home. Follower does not follow while in combat, so it gives no pursuit. MOBHunter hunts by mask through Thief_Assassinate, and that is broken. A script can chase. EXIT_PROG does not fire on a flight: fleeing is a FLEE message, not a LEAVE, and walking out of a fight is refused. EXECMSG_PROG FLEE, or ACT_PROG on 'flees', does fire, even in combat. The script then runs MPTRACKTO $n, and later MPWALKTO $%ISRECALL($i)% to walk home.\n\n**Add.** A behaviour `Pursue`:\n- `CHANCE=60`: the chance to chase each time a target flees;\n- `MAXROOMS=3`, `DELAY=1` (ticks), `MASK=`;\n- `LEASH=`: the furthest it goes from its start room;\n- then home through WanderHomeLater, or `STAY`, with `GIVEUPMSG=`;\n- `REMEMBER=n`: a target who comes back within n ticks is attacked on sight.\n\n**Example.** A mountain cat: `Pursue CHANCE=80 MAXROOMS=4 LEASH=8`. A town guard: `Pursue CHANCE=50 MAXROOMS=10 MASK=\"-RACES +Goblin\"` (no zapper mask can test for a warrant today).\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* C21 (Both send a mob home after it loses its target (Pursue's LEASH vs EncounterReset)).", "d": "yes", "note": ""}, {"id": "C12", "theme": "C", "title": "Target masks and life steal on damage properties", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Prop_AddDamage adds its extra damage against every target. Prop_AbsorbDamage cannot tell attackers apart. The masks on Prop_HaveResister and Prop_WearResister test the wearer, not the attacker. A bane weapon therefore needs a workaround. One is Prop_FightSpellCast with a damage spell and `MASK=-RACECAT +Undead`. Another is a DAMAGE_PROG on the weapon that tests RACECAT($t), then runs MPDAMAGE. No life steal exists outside spells.\n\n**Add.** `TARGETMASK=\"<zapper>\"` on Prop_AddDamage, so its extra damage applies only to matching victims. `LEECH=<pct>`, also on Prop_AddDamage, heals the wielder by that share of the damage dealt. `SOURCEMASK=\"<zapper>\"` on Prop_AbsorbDamage, Prop_HaveResister and Prop_WearResister, so their reduction applies only against matching attackers.\n\n**Example.** The Sunblade does 50% extra burning damage to undead only. The Wyrmguard shield absorbs 40% of fire damage when the attacker is a dragon.", "d": "yes", "note": ""}, {"id": "C13", "theme": "C", "title": "A difficulty setting and a player-side flag in combat formulas", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** XPMOD in coffeemud.ini scales XP gains and losses for the whole game. AUTOAREAPROPS can put a property on every area, but no area property changes NPC combat stats: Prop_HereAdjuster works on rooms only, and Prop_Adjuster on one mob. The FORMULA_* strings cannot tell the player's side from the mobs' side; their PVP twins apply only between players. Editing a formula therefore changes fights between mobs too. There is no difficulty setting.\n\n**Add.** `DIFFICULTY=NORMAL` in coffeemud.ini, and a DIFFICULTY command in play, saved with the game. Each preset sets multipliers: NPCDAMAGE, NPCHP, PLAYERXP and PLAYERDAMAGE. The attack, damage and crit formulas also get `@xP`, which is 1 when the attacker is a player or a player's follower and 0 otherwise. They also get `@xD`, the difficulty multiplier, so builders can write their own curves.\n\n**Example.** In Story mode, mobs deal 60% damage and the player gets a crit bonus. In Hard mode, mobs deal 130% damage and have 120% HP. The player switches to Story before a boss they keep losing to.\n\n*See also:* C14 (Both change the ini combat formulas for NPCs; C13's @xP and @xD variables belong in C14's new formulas).", "d": "yes", "note": ""}, {"id": "C14", "theme": "C", "title": "Ini formulas for NPC armor, attack, damage, speed, rejuv and money", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** NPC hit points are the only NPC stat with an ini formula, FORMULA_NPCHITPOINTS. CoffeeLevels.getLevelAttack, getLevelMOBArmor, getLevelMOBDamage and getLevelMOBSpeed are fixed in Java. fillOutMOB also fixes rejuv time (2 minutes plus level/2 minutes, at most 20) and money (1d<level>+1d10). RESET MOBCOMBATSTATS and Prop_Doppleganger use the same functions. The only way round it is per mob: Prop_Adjuster with MULTIPLYPH and MULTIPLYCH, or stats set by hand on each GenMob.\n\n**Add.** Six formulas in coffeemud.ini: FORMULA_NPCARMOR, FORMULA_NPCATTACK, FORMULA_NPCDAMAGE, FORMULA_NPCSPEED, FORMULA_NPCREJUV and FORMULA_NPCMONEY. In them, @x1 is the level, @x2 is LASTPLAYERLEVEL, @x3 is the mob's ABILITY (its HP modifier), and @x4 is the attack attribute bonus. The defaults equal today's expressions, so nothing changes until the owner edits them. RESET MOBCOMBATSTATS and Prop_Doppleganger use the new formulas.\n\n**Example.** The owner wants a low-magic world, where level-10 mobs hit harder but are easier to hit. They set `FORMULA_NPCDAMAGE=@x1*1.3` and `FORMULA_NPCARMOR=110-(@x1*1.8)`, then run RESET MOBCOMBATSTATS WORLD.\n\n*See also:* C13 (Both change the ini combat formulas for NPCs; C13's @xP and @xD variables belong in C14's new formulas).", "d": "yes", "note": ""}, {"id": "C15", "theme": "C", "title": "Prop_MobRank: minion, normal, elite and boss presets", "kind": "property, script function", "value": "medium", "effort": "small", "body": "**Today.** The engine has no notion of rank. Each tough mob is tuned by hand: Prop_Adjuster with MULTIPLYPH and MULTIPLYCH for attack, armor, damage and HP, Prop_ModExperience for XP, and Prop_Resistance for resistances. A builder can tag a mob as elite and test the tag with +TAG in masks or HASTAG() in scripts. But the player never sees the tag, and retuning every elite means editing each one.\n\n**Add.** `Prop_MobRank RANK=MINION|NORMAL|ELITE|BOSS`, built on Prop_Adjuster, since builders cannot use Prop_CombatAdjuster. It reads a table from coffeemud.ini, such as `MOBRANK_ELITE=HP+100% DAMAGE+25% XP*2.5 RESIST=mind 25% TAG=[elite]`. The tag shows in LOOK and CONSIDER. Scripts get RANK(), and masks get a +TAG-style test. Encounter budgets count each rank's power.\n\n**Example.** The gnoll warlord is RANK=BOSS, and its bodyguards are RANK=ELITE. When bosses feel too spongy, one edit to MOBRANK_BOSS fixes all of them.\n\n*See also:* C9, C25 (C9's encounter budget and C25's CONSIDER ALL both count C15's mob ranks).", "d": "yes", "note": ""}, {"id": "C16", "theme": "C", "title": "Prop_DeathRules: death and defeat rules per area or room", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** PLAYERDEATH, DEATH, MORGUE and ITEMLOOTPOLICY are global, and MUDFight reads them from the ini only. Prop_SparringRoom, on a room, area or mob, cancels a death and moves the character to a set room. Its behaviour is fixed, and it drops all followers. Custom rules take a room or area script: CNCLMSG_PROG S=DEATH ALL, then MPSTOP, MPHEAL and MPTRANSFER, gear moved with MPJUNK and MPOLOAD, then `return cancel`.\n\n**Add.** `Prop_DeathRules` on areas or rooms. MUDFight reads it before the global values. Its parameters:\n- `PLAYERDEATH=\"OUT 3,RETAIN\"`, `MOBDEATH=` and `ITEMLOOTPOLICY=`;\n- `TO=<room>`;\n- `GEAR=CONTAINER:<room>/<container>`;\n- `HEAL=pct`, `MSG=` and `MASK=`.\n\nThe party's followers stay with it.\n\n**Example.** In the bandit hideout, defeat moves the character to the cage room with 25% HP. Their weapons go to the chief's strongbox, and the defeat becomes a jailbreak scene instead of a reload. A tutorial area uses OUT, so losing there only knocks the character out. A sparring hall sets MOBDEATH=OUT.\n\n*See also:* C7, C8 (Three changes to where and how the party wakes after death; C8's CHECKPOINT uses C7, and C16 makes the death rules per area).", "d": "yes", "note": ""}, {"id": "C17", "theme": "C", "title": "Essential and yielding mobs", "kind": "property and script trigger", "value": "medium", "effort": "small", "body": "**Today.** Prop_SafePet makes a mob wholly unattackable, with a custom MSG, so a quest NPC is safe from stray blows and from AUTOASSIST. Prop_PracticeDummy never dies, but never fights back. A mob that yields mid-fight is a script: HITPRCNT_PROG 10 guarded by a tattoo, then MPSTOP ALL, MPAFFECT Prop_SafePet for some ticks, an echo, and SPEECH_PROG branches. CNCLMSG_PROG can cancel the mob's own death.\n\n**Add.** A property `Prop_Essential MODE=KNOCKOUT|YIELD AT=10% TICKS=20 MSG=\"<S-NAME> drops to one knee and yields!\" NOXPPENALTY`. At the threshold the mob's fight ends, and attacks on it are refused with a message for TICKS. New triggers YIELD_PROG and DEFEAT_PROG fire so the script can branch: spare it, take its key, or finish it with a kill command.\n\n**Example.** A rival knight yields at 10%. If the player says spare, they gain faction and he comes back later as an ally. Attacking again marks the player a murderer and costs faction.\n\n*See also:* C2 (Both make a mob stop fighting at low HP and fire a trigger (SURRENDER_PROG vs YIELD_PROG)).", "d": "yes", "note": ""}, {"id": "C18", "theme": "C", "title": "Threat and target picking in scripts", "kind": "script function and script command", "value": "medium", "effort": "small", "body": "**Today.** The CombatAbilities family keeps a threat table and retargets on it. Damage to the mob counts double, damage to its victim's group counts once, heals count triple, and AGGROFYING abilities add twice their level. So a taunt is a GenAbility flagged AGGROFYING. TargetPlayer switches to the lowest-level enemy. Scripts cannot read or change threat, since CombatAbilities exposes only PRECAST, PHYSDAMTAKEN, SKILLSALWAYS, SKILLSNEVER and COMBATMODE. Finding the lowest HP% needs an MQL loop over HITPRCNT.\n\n**Add.** Functions THREAT($i $n > 100), TOPTHREAT($i), WEAKEST($i) (lowest HP%) and OPPONENT($i 'MASK=-CLASS +Cleric'), each returning a name usable in MPKILL. A command `MPTHREAT $i $n +500|=0|*2`. A light threat table, made on demand, for mobs without CombatAbilities.\n\n**Example.** The ogre chieftain's FIGHT_PROG 20 runs MPKILL on WEAKEST($i) and echoes \"The chieftain lunges at the weakest foe!\". A custom TAUNT ability runs `MPTHREAT $t $n *3`.\n\n*See also:* C10 (Both choose which party member a monster attacks (a behaviour vs script threat functions)).", "d": "yes", "note": ""}, {"id": "C19", "theme": "C", "title": "Respawns that follow the story", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** A dead mob comes back when its rejuv count runs out. The only exception is camping. A cleared camp refills even after its quest is won. The workaround is a ONCE_PROG on the mob, which runs again on each respawn. It checks QUESTWINNER or a global saved with MPSAVEVAR, then runs MPPURGE $i, or MPMLOAD of a replacement followed by MPPURGE $i. The mob shows for a moment, and the check runs only at respawn. Mobs loaded by a quest stop with the quest.\n\n**Add.** `Prop_RejuvWhen WHEN=\"<zapper mask>\" ELSE=WAIT|NEVER|REPLACE:<catalog mob>`, checked before the mob is brought back. WAIT checks again later, NEVER leaves it gone, and REPLACE spawns the catalog mob instead. Masks such as `+IF !QUESTWINNER(...)` or `-HOUR` say when. The same option works for item rejuv.\n\n**Example.** Once the player wins \"Clear the Old Mill\", the bandits there never return, and settlers spawn in their place.\n\n*See also:* W9 (Both keep a slain boss from coming back (Prop_RejuvWhen vs ResetWhole's EXCEPT=)).", "d": "yes", "note": ""}, {"id": "C20", "theme": "C", "title": "Wave and arena rooms", "kind": "behaviour and script trigger", "value": "medium", "effort": "medium", "body": "**Today.** Waves can be built by hand. Quest STEP sections or MPSTEPQUEST from a DEATH_PROG advance them. A room script counts survivors with NUMMOBSROOM, ISQUESTMOBALIVE or MQL, then uses MPMLOAD for the next group. MPCLOSE, MPLOCK and MPUNLOCK handle the exits, Prop_SparringRoom a defeat that is not death, and ResetWhole the reset. Wave variables are keyed by name. The invasion quest templates spawn once, with no waves.\n\n**Add.** A room behaviour `WaveSpawner`, such as `WAVE1=catalog:goblin*3 WAVE2=catalog:goblin*2+catalog:goblin archer*2 WAVE3=encounter:goblin_boss`. It also takes NEXT=CLEAR|TICKS=n, START=ENTER|CALL, LOCKEXITS=true, ONWIN=function or unlock, ONLOSE=SPARRING|RESET, REWARD=item and RESETAFTER=ticks. It fires WAVE_PROG n, ARENAWIN_PROG and ARENALOSE_PROG. The wave number and state are saved.\n\n**Example.** A gladiator pit locks its gate when the player enters. The arena master announces three waves. Clearing them opens the exit and gives a laurel. A defeated player wakes in the infirmary, and the pit resets.\n\n*See also:* C9 (C20's encounter: waves draw on C9's encounter tables); C24 (later) (Both spawn waves of catalog mobs with win and lose outcomes; share the wave code).", "d": "yes", "note": ""}, {"id": "C21", "theme": "C", "title": "Leash and reset for bosses", "kind": "behaviour and script trigger", "value": "medium", "effort": "medium", "body": "**Today.** A boss the party flees regains HP only at the slow natural rate, and keeps its phase variables and its summoned adds, so hit, retreat and return wins the fight. StdMOB has an empty \"go home\" branch, and Mobile's leash= only limits wandering. Parts exist. ResetWhole resets a room after n ticks with no player activity there. MPRESET $i restores HP, mana and moves. MPWALKTO and MPTRACKTO walk a mob home, $%ISRECALL($i)% gives its home room, and INROOM($i == ...) tells whether it is there. A RAND_PROG with !ISFIGHT($i) and an idle counter can leash a mob by hand.\n\n**Add.** A behaviour `EncounterReset RADIUS=1 IDLE=5 HEAL=100% HOME=true DESPAWNADDS=true`. When no enemy has been within RADIUS for IDLE ticks, the mob returns home and heals. Its debuffs and phase state are cleared, only the adds it summoned are removed, and a new RESET_PROG trigger fires. ROOM=true applies it to every mob in the room.\n\n**Example.** The party fights the ravine troll and runs at half HP. Five ticks later the troll is back on its bridge at full HP, growling.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST15, C3 (C3's ONENGAGE and rearm and C21's reset need the combat start and end detection that ST15 adds); C3 (C3's RESET=LEASH rearm and C21's EncounterReset both reset a boss whose party walked away); C11 (Both send a mob home after it loses its target (Pursue's LEASH vs EncounterReset)).", "d": "yes", "note": ""}, {"id": "C22", "theme": "C", "title": "Ability rotations for CombatAbilities", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** CombatAbilities and its subclasses take +SKILL and -SKILL lists, COMBATMODE (RANDOM, DEFENSIVE, OFFENSIVE, MIXED, ONLYALWAYS), BSIZE, PROFICIENT and MIN/MAX/CHANCE timing. Each try picks a random ability that qualifies. A GenAbility gets a cooldown from TICKSBETWEENCASTS, and its CASTMASK may gate on HP through -IF, though that is untested. Stock abilities have no rules of their own, so \"breath every 3 rounds, haste once below 30%\" needs FIGHT_PROG with MPCAST and tattoo guards.\n\n**Add.** Options on each entry of the +SKILL list, stock abilities included: EVERY, FIRST, ONCE, BELOW, COOLDOWN, WEIGHT, SELF and TARGET=CASTER. For example: `+Dragonbreath(EVERY=3 FIRST=2) +Spell_Haste(ONCE BELOW=30%) +Prayer_Heal(SELF BELOW=40% COOLDOWN=5) +Skill_Trip(WEIGHT=3 TARGET=CASTER)`. OPENER=skill sets the first round. Each mob keeps its own counters, and they reset when combat ends.\n\n**Example.** A wyvern with no script: OPENER=Skill_Dive, `+Poison_Sting(EVERY=2) +Skill_Tail(WEIGHT=2) +Spell_Fly(ONCE BELOW=25%)`. When badly hurt, it takes to the air.\n\n*See also:* C1 (Both add CombatAbilities options for healing and when to use abilities (HEALAT and SUPPORT vs BELOW, SELF and COOLDOWN)).", "d": "yes", "note": ""}, {"id": "C23", "theme": "C", "title": "Ambushes with a perception check and surprise", "kind": "property and script trigger", "value": "medium", "effort": "medium", "body": "**Today.** A room ambush is GREET_PROG or ENTRY_PROG with MPMLOAD and MPFORCE kill. A tattoo or ONCE guards it, and masks such as +GROUPSIZE gate it. Hidden mobs (Prop_Hidden, MPHIDE) with Aggressive get a backstab opener, but nothing more. Room traps such as Trap_MonsterCage roll a save against level and can be found by trap-detection skills. GenTrap runs its SCRIPT only inside its ability branch, though, so it is awkward as an ambush. There is no party perception roll and no surprise round.\n\n**Add.** `Prop_Ambush MOBS=encounter:bandits|catalog:bandit*3 CHANCE=100 DETECT=WIS+Skill_Search:15 SURPRISE=1 MSG=\"Figures burst from the undergrowth!\" SPOTMSG=\"You spot glints of steel in the bushes.\" ONCE|RESET=ticks MASK=...`. It rolls DETECT for the party's best member. On a failure the ambushers act for SURPRISE rounds and the party's turn is skipped. On a success the party may strike first or avoid the ambush. AMBUSH_PROG fires with the outcome.\n\n**Example.** On a forest road, bandits jump a party with no ranger. A party with a ranger spots them and can sneak past or strike first.\n\n*See also:* C9 (C23's ambush and C9's AMBUSH entries both give monsters a surprise first round, from encounter: tables); I20 (C23's ambush notes that GenTrap runs its script only inside its ability branch, which I20 fixes).", "d": "yes", "note": ""}, {"id": "C24", "theme": "C", "title": "Invasions and raids on an area", "kind": "behaviour and script command", "value": "medium", "effort": "large", "body": "**Today.** The CREATE QUEST wizard has two invasion templates, competitive_invasion1.quest and competitive_invasion2.quest. They bring invaders into a room with Mobile, count kills, and reward the winner through an announcer. The invaders win when time runs out. They work single-player, and running quests are saved. Marching (MPTRACKTO, MPWALKTO, Patroller, MOBHunter) and waves (quest STEPs) must be scripted by hand. Conquerable needs clan flags.\n\n**Add.** An area behaviour `Invasion` with SOURCE=room ids, MOBS=CATALOG:orcs or a cmare file, WAVES=3, SIZE=4-6, EVERY=20 ticks and TARGET=room id. Attackers march to TARGET and fight what they meet on the way. START=mask, or a command `MPINVADE <area> START|STOP`, starts it. WIN when all waves are dead, LOSE when N attackers reach TARGET. Each outcome sets a variable and runs a FUNC, or MPROOMSTATE if room states are added. It also echoes to the area and on INFO, clears away the attackers left, and keeps its state in saves.\n\n**Example.** A quest step starts an orc raid on Millbrook, in three waves from the northern ford to the mill. If the player holds, the reeve rewards them. If not, the mill burns and the bakery closes.\n\n*See also:* C20 (Both spawn waves of catalog mobs with win and lose outcomes; share the wave code); F19 (later) (Both march a catalog band from a staging room to a target (an invasion vs a clan raid)).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "C25", "theme": "C", "title": "CONSIDER ALL for the whole fight", "kind": "presentation", "value": "low", "effort": "small", "body": "**Today.** CONSIDER compares one mob with the one character who types it. GCONSIDER (GCOS, GCO) rates a mob against the group's combined damage, with return attacks only on the leader. GCONSIDER ALL repeats that for each visible mob. Nothing gives one verdict on all the room's enemies against the whole party.\n\n**Add.** CONSIDER with no argument, or CONSIDER ALL, sums the power of the hostile mobs present and of the party (CoffeeLevels getPowerLevel). It gives one word, from trivial to deadly. It shows mob ranks, if ranks are added. It notes \"scales to your party\" when Prop_Doppleganger or a party-scaling property applies.\n\n**Example.** In the barracks: \"four guards and a sergeant (elite): a hard fight for your party of three.\"\n\n*See also:* C15, C9 (C9's encounter budget and C25's CONSIDER ALL both count C15's mob ranks); C6 (C25's CONSIDER ALL notes when C6's party scaling applies).", "d": "yes", "note": ""}, {"id": "I1", "theme": "I", "title": "Fix property bugs that make documented options do nothing", "kind": "property fixes", "value": "high", "effort": "small", "body": "**Today.** Several documented options fail silently. In Prop_PropSetter, TRIGGER=DROP_PUTIN and TRIGGER=HITTING_WITH never fire, MOUNT also fires on hitting and PUT on DROP: the constants (64, 128) do not match TRIGGER_DESC (256, 512). Prop_LimitedContents tests the new item instead of each existing one, so it counts every item. Prop_ItemBinder checks ON= against the TO string, so abbreviations fail. AHELP PROP_UNDROPPABLE finds nothing; the key is PROP_DROPPABLE. There is no workaround.\n\n**Add.** Bits 256 and 512 in TriggeredAffect and fixed checks in Prop_PropSetter; the mask test on I in Prop_LimitedContents; boundOn in Prop_ItemBinder; the renamed help key. Then the defects in DOCS b075-b078 (ModFaction percent squaring, MoveRestrictor ISEARCH, null check and CHANCE off-by-one, RoomRedirect host, ItemSlot look text), each with a small engine test.\n\n**Example.** TRIGGER=HITTING_WITH on a vampiric dagger fires, and a quiver limited to 20 arrows counts only arrows.\n\n*See also:* I15 (I15's receptacles rely on I1's Prop_LimitedContents count fix).", "d": "yes", "note": ""}, {"id": "I2", "theme": "I", "title": "MPDOOR: change a door on both sides from anywhere, with a message", "kind": "script command, script function", "value": "high", "effort": "small", "body": "**Today.** MPOPEN, MPCLOSE, MPLOCK and MPUNLOCK change one Exit object, silently, and skip its RESETTIME relock timer. They take $xN, not a direction word. Opening a door on both sides with messages takes four lines: MPOPEN $xN, MPAT <room> MPOPEN $xS, and an MPECHO per room. ISOPEN and ISLOCKED read state, but for another room only inside MPAT.\n\n**Add.** MPDOOR <OPEN|CLOSE|LOCK|UNLOCK|TOGGLE> <room id|here|$r> <direction|container name> [QUIET|\"message\"]. It goes through roomAffectFully, as Prop_OpenCommand does: both sides change, the message (default '<T-NAME> swings open.') shows in both rooms, and the relock timer starts. It works on containers too. DOORSTATE(<room> <dir>) returns open, closed or locked. The help for MPOPEN and its siblings says they are one-sided.\n\n**Example.** A cellar lever runs MPDOOR OPEN \"Crypt#12\" north \"With a grinding of stone the crypt door swings open.\" The crypt sees it too, and the door is open from both sides.\n\n*See also:* JS17, SC4, SC6 (JS17's state(), signal() and door() helpers wrap SC4's per-object state, SC6's signals and I2's MPDOOR); I9 (I9's switch actions are built on I2's MPDOOR).", "d": "yes", "note": ""}, {"id": "I3", "theme": "I", "title": "Books with pages kept in the item and the world files", "kind": "presentation, data file, script trigger", "value": "high", "effort": "medium", "body": "**Today.** StdBook and GenBook keep pages in the journal table CMJRNL, keyed by the book's name. That is save state: pages written in builder mode never reach world/ or a new game, and same-named books share them. GenJournal boards have the same gap. GenReadable holds one text, or one FILE= under resources/. A CNCLMSG_PROG READ script can fake pages.\n\n**Add.** A static mode for GenBook (or a GenTome) whose text holds pages: <PAGE TITLE=\"...\" LANG=Elvish>...<\/PAGE>, or FILE=world/texts/ost.txt with '=== title ===' separators. READ BOOK lists contents; READ 3 BOOK, READ NEXT and READ PREV turn pages. VARIES works per page, a page may carry LORE=key, READ_PROG <page> fires, and TEAR PAGE 3 FROM BOOK makes a page item. world/journals/*.txt seeds boards and books.\n\n**Example.** The 'Annals of Ost' keeps 12 pages in its area file. Page 7, torn out and hidden in the tower, starts a quest step when read.\n\n*See also:* ST19 (I3's paged books fire a READ_PROG <page>, the trigger ST19 adds); PR6 (I3's pages carry LORE= keys from PR6's codex); S10 (Both put book and board pages in world/journals (seed text files vs journal XML)).", "d": "yes", "note": ""}, {"id": "I4", "theme": "I", "title": "Prop_When: props and behaviours active only while a condition holds", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Zapper masks cover most conditions: MASK= on nearly every prop, with -IF (ISMOON, ISHOUR, QUESTWINNER), -CHANCE and -TATTOOS, and decaying tattoos as cooldowns. But masks are tested at events such as entering, and Prop_Transporter, Prop_AddDamage and Prop_MultiEffects children take none. Quests test masks only at start. A behaviour that is on only while a condition holds needs TIME_PROG with MPBEHAVE and MPUNBEHAVE. Nothing gives once per profile or world.\n\n**Add.** Prop_When PROPS=\"Prop_X(args);Prop_Y(args)\" (MultiEffects grammar), or ID=<ability or behaviour> PARMS=\"...\", with WHEN=<zapper mask>, EVERY=<ticks>, CHECK=OWNER|HOST|ROOMPLAYERS|TRIGGERER, ONCE=CHAR|PROFILE|WORLD, COOLDOWN=<ticks or game hours>, CHANCE=<pct>, ONSTART=, ONEND=, ELSEMSG=. It adds what it wraps when the mask turns true and removes it when false. It works on rooms, areas, exits and items, reuses decaying tattoos, and saves its state.\n\n**Example.** Darkwood: WHEN=\"-IF ISMOON(FULL)\" with RandomMonsters loading catalog werewolves and an Emoter howling; it ends by itself. A fairy ring: COOLDOWN=24h PROPS=\"Prop_Transporter(Feywild#1)\".\n\n*See also:* N1 (Alternatives for behaviours active only while a condition holds: a WHEN= parameter on every behaviour, or a Prop_When wrapper).", "d": "yes", "note": ""}, {"id": "I5", "theme": "I", "title": "Prop_Transform: things that change form over time or by condition", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Decay only destroys, Age only turns a GenCaged item into its mob, TemporaryAffects only adds or removes props, Prop_ClosedSeason only hides. A change of form needs a script per object: TIME_PROG, DAY_PROG or DELAY_PROG, checks such as ISSEASON or INLOCALE, then MPOLOAD or MPMLOAD and MPPURGE $i. Farming and Gardening grow plants, but as skills.\n\n**Add.** Prop_Transform with AFTER=<ticks>, DAYS=<game days, kept in saves> or WHEN=<mask on its room, or NIGHT, FULLMOON, WINTER>; START=GET|DROP|WEAR|ALWAYS; INTO=<catalog item>, MOB=<catalog mob>, or SET=\"NAME=.. DISPLAY=.. DESC=.. PROPS=..\" to change in place; REVERT=TRUE when WHEN ends; RESET to restart on leaving the condition; ONLYIN=room|container|carried; KEEP=CONTENTS,DAMAGE,FOLLOW; MSG=. Time left lives in miscText. A result with its own Prop_Transform makes a chain.\n\n**Example.** A dragon egg carried three game days hatches into a wyrmling that follows its finder. A stone gargoyle wakes as a hostile mob at night and turns to stone at dawn.\n\n*See also:* I22, I27 (All three replace an item in place with another while keeping its state; share MPTRANSFORM's KEEP code).", "d": "yes", "note": ""}, {"id": "I6", "theme": "I", "title": "Item sets with tiers, any bonus, and progress shown", "kind": "property, script function, script trigger", "value": "high", "effort": "medium", "body": "**Today.** ALLSET=name-N exists only on Prop_HaveAdjuster (pieces carried) and Prop_WearAdjuster (pieces worn): one threshold each, adjustments only (stats, saves, ableprofs and the like; no granted spells). One of each fakes two tiers. Mixed thresholds misbehave, because setCheck writes one piece's result to the whole set. Prop_WearSpellCast, Prop_WearEnabler, Prop_WearResister and Prop_AddDamage ignore ALLSET, so a granted spell needs WEAR_PROG and REMOVE_PROG on every piece. A MASK=\"-WORN +piece ...\" on one piece only half works: it is checked when the spell is added, not when another piece comes off. LOOK and IDENTIFY say nothing of sets.\n\n**Add.** First the threshold fix. Then Prop_ItemSet SET=drowned_king NAME=\"Regalia of the Drowned King\" COUNT=WORN|HELD TIER2=\"Prop_WearAdjuster(savewat+20)\" TIER4=\"Prop_WearSpellCast(Spell_WaterBreathing);Prop_WearEnabler(Chant_Tsunami)\" ONMSG= MASK=. Tiers sit on one piece or in resources/itemsets.txt. The highest tiers met apply as hidden effects and end when a piece comes off. LOOK and IDENTIFY show 'Set: 3/5 worn' and each tier. ALLSET works on the other Wear and Have props. Scripts get SETCOUNT($n <set>), and SET_PROG when a tier turns on or off.\n\n**Example.** Four dragonbone pieces lie across the world: two give fire resistance, all four the Dragonbreath ability.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "I7", "theme": "I", "title": "Prop_Cursed: hidden curses that Remove Curse ends cleanly", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** No-remove and no-drop items exist: MODIFY ITEM's misc flags, MPSET $i ISREMOVABLE false, or Prop_PropSetter(TRIGGER=WEAR_WIELD ISREMOVABLE=false) for a curse shown once worn. Prayer_RemoveCurse resets the flags but, ending only DOMAIN_CURSING effects, leaves penalties such as Prop_WearAdjuster(str-3). Prayer_CurseItem added in the builder cannot be ended. There is no false identity, and a curse broken by a deed needs a SPEECH_PROG.\n\n**Add.** Prop_Cursed, in DOMAIN_CURSING so endLowerCurses ends it: LEVEL=15 HIDDEN=TRUE NOREMOVE NODROP PENALTY=\"Prop_WearAdjuster(str-3 dex-2);Prop_WearSpellCast(Prayer_CurseLuck)\" REVEAL=\"The ring tightens on your finger!\" BREAK=<ritual steps> or BREAKMASK=<mask> ONBREAK=CRUMBLE|KEEP|BECOME:<catalog item>. It sets the existing flags. Hidden, it identifies as normal below LEVEL until worn. Lifted, its penalties go with it.\n\n**Example.** A dead knight's ring seems to give +2 STR. Worn, it will not come off and drains wisdom, until the player confesses at the chapel or a strong enough priest lifts it. Then it crumbles.", "d": "yes", "note": ""}, {"id": "I8", "theme": "I", "title": "Prop_Invokable: item powers on demand, with recharging charges", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** GenWand already gives a spell on a spoken magic word, with charges (USES, MAXUSES), and its wear location can be a finger, so a ring works too. But only characters with a WandUsage class skill can use it; for others it 'glows faintly'. Recharging needs a TIME_PROG running MPSET $i USES 3. Without the skill, a SPEECH_PROG with a counter and MPCAST does it. Prop_UseSpellCast fires on wear, fill or put, never on demand.\n\n**Add.** Prop_Invokable, with no class skill needed: WORD=\"Ignis\" or VERB=INVOKE (INVOKE <item>), SPELLS=\"Spell_Fireball;LEVEL=12\", TARGET=SELF|ENEMY|ROOM, CHARGES=3, RECHARGE=DAWN|DAILY|TICKS=200, COOLDOWN=5, REQUIRE=WORN|HELD, MASK=, MSG= and EMPTYMSG=\"The ring is cold.\". Charges live in miscText. IDENTIFY shows the charges and the recharge rule.\n\n**Example.** The Ring of the Ember Lord casts Fireball three times a day when its wearer says 'Ignis', and recharges at dawn on the area's clock.", "d": "yes", "note": ""}, {"id": "I9", "theme": "I", "title": "Prop_Switch: levers, buttons and dials that keep their state", "kind": "property, script trigger, script function", "value": "high", "effort": "medium", "body": "**Today.** A lever must be ungettable, but StdItem then refuses PUSH and PULL ('You can't move X'). So the builder writes CNCLMSG_PROG PULL with RETURN CANCEL, keeps state in MPSETVAR or TAGS, and calls MPOPEN twice, skipping the relock timer. Prop_OpenCommand answers only verbs that reach HUH: PULL and PUSH are commands, TURN is Turn Undead's word. ACTIVATE takes only Electronics.\n\n**Add.** Prop_Switch for items and exits: VERBS=\"pull,push,turn,press,flip\" (ahead of commands), STATES=\"down,up\" or a dial 1-8, START=, DESC_<state> for LOOK, MSG_<state>, ACTION_<state>=\"door open Gate#3 east; signal gate1 on; unhide 'a narrow stair'\" (built on MPDOOR, signals and MPOLOAD), RESET=<ticks>, REQUIRES=<mask> with REQMSG=, ONCE=true, MASK=. State lives in the property text. Scripts get SWITCH_PROG <state> and SWITCHSTATE(<obj>); ACTIVATE and DEACTIVATE work too.\n\n**Example.** PULL RUSTED LEVER raises the portcullis of Gate#3 east, both sides, for 20 ticks; LOOK LEVER says 'The lever is up.' A second lever moves only while the iron crank is carried.\n\n*See also:* ST7, I19 (All three let an object's own verb (TURN, PULL, PUSH) win over stock commands and skills; one parser hook serves them); SC6, I12 (later), I15, I25 (The puzzle props send and receive SC6's signals (signal gate1 on, ONFULL=signal, SIGNAL inputs)); I2 (I9's switch actions are built on I2's MPDOOR); I16 (I16's combination lock shares I9's switch state).", "d": "yes", "note": ""}, {"id": "I10", "theme": "I", "title": "USE X ON Y and COMBINE A WITH B, with triggers and a table", "kind": "player commands, script triggers, data file", "value": "high", "effort": "medium", "body": "**Today.** Commands/ has no USE, APPLY or COMBINE, and there is no USE trigger. CREATE COMMAND USE (a GenCommand in world/custom.cmare) with one FUNCTION_PROG EXECUTE script and a SWITCH over item pairs works, as does CMDFAIL_PROG USE on each target. Either way every pair is hand-written, with no standard answer for the rest.\n\n**Add.** Player commands USE <item> [ON <target>] and COMBINE <item> WITH <item>, sending a new TYP_USE message to tool and target. USE_PROG and COMBINE_PROG [keywords] fire on either, with $o the tool and $t the target. world/combinations.txt has rows ITEM_A, ITEM_B (name, tag or catalog name), RESULT (catalog item or nothing), CONSUME=A,B, MASK= or SKILL=, MESSAGE. Simple combining needs no script; the rest answers 'Nothing happens.'\n\n**Example.** USE OIL FLASK ON HINGE silences the squeaking door that wakes the guard. COMBINE TORN MAP WITH TORN MAP makes 'the old smuggler's map' from the catalog.", "d": "yes", "note": ""}, {"id": "I11", "theme": "I", "title": "Prop_Discoverable: hidden things anyone can find", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Prop_Hidden is seen only with CAN_SEE_HIDDEN, from Thief_Search or Searching. Searching is open to every class at level 4 in allqualifylist.txt, and a data change can make it AUTOGAIN at level 1. MPHIDE sets IS_NOT_SEEN, which no search finds. Examine-to-reveal works as a LOOK_PROG (or EXECMSG_PROG EXAMINE) running MPUNAFFECT on Prop_Hidden, and the removal is saved. There is no stat roll, no hint, and no way without a script.\n\n**Add.** Prop_Discoverable on items, exits and mobs: FOUNDBY=examine:bookshelf|search|look:fireplace, CHECK=\"INT 12\" or DC=15 with a bonus from Searching and Thief_Search, MSG=\"Behind a loose book you find a small brass lever.\", HINT=\"One book sticks out.\" shown when the parent is looked at, and STAYS=true. A basic SEARCH that takes a turn works without the skills.\n\n**Example.** A secret door behind a tapestry (FOUNDBY=examine:tapestry) is found by anyone who examines the tapestry; a thief also finds it with SEARCH.\n\n*See also:* P11 (P11's ON=FIND discovery XP fires when a hidden thing is found, as I11's discoveries are).", "d": "yes", "note": ""}, {"id": "I12", "theme": "I", "title": "PuzzleController: puzzle state, sequences and solve actions", "kind": "behaviour, builder tool", "value": "high", "effort": "large", "body": "**Today.** Ritual triggers with TriggeredAffects already do ordered and timed sequences without a script: '&' (in order), '|', TIMEOUT, SAY, PUTTHING, INROOM, CHECK <mask> and more, tracked per player, then ADD or REMOVE an ability or behaviour. But PUSH, PULL, OPEN, GET and signals are not steps, state cannot span objects (three levers in positions), and there is no saved solved flag or wrong-move handling. The rest is MPSETVAR counters by hand.\n\n**Add.** A PuzzleController behaviour on a room, area or hidden item, built on the Triggerer with new PULL, PUSH, OPEN and SIGNAL codes: INPUTS=\"lever1,lever2,lever3\", MODE=ALL|ORDER|COUNT=n|EXPR=\"lever1=up & lever3=down\", WINDOW=<ticks or turns>, WRONG=reset|keep with WRONGMSG=, ONSOLVE= and ONFAIL= action lists, RESET=never|areareset|ticks:300, ONCE=true. Inputs and the solved flag are saved. The PUZZLE builder command shows the state.\n\n**Example.** Hall of Bells: MODE=ORDER INPUTS=bell_low,bell_high,bell_mid WRONG=reset WRONGMSG=\"The bells clash and the echoes die.\" The right order opens the hidden stair.\n\n*See also:* SC6, I9, I15, I25 (The puzzle props send and receive SC6's signals (signal gate1 on, ONFULL=signal, SIGNAL inputs)); DT33 (DT33's PUZZLE command shows and works I12 (later)'s controller and the switch and plate props).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "I13", "theme": "I", "title": "Prop_BlockedExit: blockages the player must clear", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Chant_CaveIn needs a caster and runs out; Prop_WeakBridge breaks and mends itself. A blockage can be faked as a closed, locked door named 'a pile of rubble' with Prop_OpenCommand ('clear rubble;dig rubble;NOOPEN'), and a script can count tool attempts in a VAR before MPUNLOCK and MPOPEN. The door state is saved, but the exit's close timer or a reset can shut it again. Nothing wears a blockage down, burns it or grows it back.\n\n**Add.** Prop_BlockedExit on exits: NAME=\"a pile of rubble\", HP=40, TOOL=<mask on the held item>, SKILL=Digging|STR (each attempt lowers HP), FIRE=TRUE, MSG= and CLEARMSG=, ONCLEAR=\"SETVAR area tunnel_open 1\", RESPAWN=0|<ticks>. CLEAR <dir>, DIG <dir> and attacking the exit work on it. Its state is kept in saves (bw-save-roomdelta).\n\n**Example.** A collapsed dwarf-mine tunnel takes about five turns with a pickaxe and opens a shortcut. A vine-choked jungle path burns clear but grows back after 3 game days.\n\n*See also:* W7, S17 (I13's cleared blockages and W7's room states are kept through S17's room-delta save).", "d": "yes", "note": ""}, {"id": "I14", "theme": "I", "title": "Prop_Detector: an item that reacts to what is near", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Prop_Sounder reacts to actions, and Prop_Smell emotes only on mobs. Same-room detection can be scripted: a RAND_PROG or DELAY_PROG on the item with NUMRACES, NUMMOBSROOM, ISHERE or ROOMMOB plus ISLIKE, then MPECHOAT the owner; NUMRACESINAREA covers an area. MPSET $i AFFBEHAV can toggle an ambiance. Detection a set number of rooms away, and a clean ambiance on and off, are out of reach.\n\n**Add.** Prop_Detector DETECT=<mob mask, such as \"-RACECAT +Orc +Goblinoid\"> or DETECTITEM=<item mask>, RANGE=0..3 rooms, AMBIANCE=\"(glowing blue)\", MSG=\"$p glows faintly blue.\", STOPMSG=\"$p's glow fades.\", WHERE=WORN|HELD|ANY, EVERY=<ticks>. It ticks on the item and holds the ambiance while something is detected.\n\n**Example.** An elven blade glows when orcs are within two rooms. A dowsing rod twitches near buried treasure.", "d": "yes", "note": ""}, {"id": "I15", "theme": "I", "title": "Receptacles: containers that react to the right objects", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Prop_LimitedContents already filters a container by mask, +TAGS and +NAMES included, with a count and a refusal: '2 +TAGS dragoneye;0;MSG=\"It does not fit.\"' (its count bug is in the property-bug fixes). PUT_PROG on the container fires on put, and NUMITEMS or INCONTAINER tell when it is full. Prop_ItemSlot REMOVABLE=FALSE locks items in, but only Prop_ItemSlotFiller items, and nothing fires when slots fill. Plain containers cannot lock in or consume.\n\n**Add.** Extend Prop_LimitedContents or Prop_ItemSlot rather than add a property: LOCKIN=true (cannot be taken out once placed), CONSUME=true, and ONPUT=, ONFULL=\"signal eyes full\" and ONEMPTY= as actions or signals.\n\n**Example.** The dragon statue's two eye sockets accept only items tagged dragoneye. With both in place, its mouth opens and shows the key.\n\n*See also:* SC6, I9, I12 (later), I25 (The puzzle props send and receive SC6's signals (signal gate1 on, ONFULL=signal, SIGNAL inputs)); I1 (I15's receptacles rely on I1's Prop_LimitedContents count fix).", "d": "yes", "note": ""}, {"id": "I16", "theme": "I", "title": "Prop_ComboLock: dials, codes and keypads", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Prop_OpenCommand 'dial 7 3 9;press 739' already opens on an exact phrase, on both sides (Prop_OpenPassword does the same for a spoken code), and GenExit's RESETTIME relocks. Its first word must reach HUH, so ENTER and PUSH, which are commands, cannot start it, nor can TURN for a player who knows Turn Undead. A random code per game can be scripted (ONCE_PROG, MPSETVAR, RANDNUM) and printed by a clue item through $<var>. Missing: dials set one at a time and shown on LOOK, symbol sets, and a tries limit.\n\n**Add.** Prop_ComboLock on exits and containers, sharing the state of Prop_Switch (proposed in I9; it does not exist yet): CODE=7-3-9 or a word, DIALS=3, SYMBOLS=0-9 or \"sun,moon,star\", VERB=turn (TURN DIAL 2 TO 3), SET DIALS 7 3 9 or ENTER 739 for keypads, SHOW=true ('The dials read 7-1-4.'), TRIES=3 with ONWRONG=\"cast Spell_ShockingGrasp $n\", RELOCK=30, ONOPEN=. CODE=RANDOM rolls a code per new game into a variable a clue item can print.\n\n**Example.** The alchemist's chest has three symbol dials. A torn page in the library gives the order: 'sun before star, moon last'.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* I9 (I16's combination lock shares I9's switch state).", "d": "yes", "note": ""}, {"id": "I17", "theme": "I", "title": "Riddler behaviour: riddles with several answers, tries and consequences", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** A riddle is a SPEECH_PROG with a keyword list or an exact phrase, plus MPSETVAR counters for tries and a \"solved\" flag. MudChat matches patterns but counts no tries. Prop_OpenPassword takes one word and can only open. Tries with consequences, a random riddle, typo tolerance and once-only memory all need a script.\n\n**Add.** A Riddler behaviour for a mob or item: RIDDLE=\"...\" (several; RANDOM=true picks one), ANSWERS=\"mountain|a mountain|mountains\" (case, articles and punctuation ignored; FUZZY=1 forgives a one-letter typo), ASK=greet|look|command, TRIES=3, ONRIGHT=, ONWRONG= and ONOUT= holding script commands, and ONCE=character|save. The player answers with SAY or ANSWER <text>.\n\n**Example.** The sphinx at the desert gate asks one of five riddles. A right answer runs \"door open here north; exp 100\" and it steps aside for good. After three wrong answers it attacks.", "d": "yes", "note": ""}, {"id": "I18", "theme": "I", "title": "Fix READ <direction> so it reads writing on an exit", "kind": "bug fix (player command)", "value": "medium", "effort": "small", "body": "**Today.** READ finds the exit for a direction, then at once overwrites it with an item lookup on the last word (Read.execute, fetchFromMOBRoomFavorsItems). That lookup matches exits by name, door name or closed text, never by direction. So READ NORTH fails, although exits can carry readable text and handleBeingRead supports them. READ DOOR works, but only if the player guesses the name.\n\n**Add.** Keep the exit when a direction was given, and search items only when it is null. This is a one-line fix. Also, LOOK <direction> adds \"There is writing on it.\" when the exit is readable, so the player knows to read it.\n\n**Example.** A door carved with \"Beware the Wyrm\": LOOK NORTH mentions the writing, and READ NORTH shows the carving.", "d": "yes", "note": ""}, {"id": "I19", "theme": "I", "title": "Fix Prop_CloseCommand and let command phrases start with a real verb", "kind": "bug fix (property)", "value": "medium", "effort": "small", "body": "**Today.** Prop_CloseCommand cannot work. A missing else makes the word NOCLOSE also a command phrase. The exit branch closes only if(!E.isOpen()), that is, when the exit is already closed. The container branch sends MSG_OPEN, not MSG_CLOSE. setMiscText never resets noclose to false. Also, Prop_OpenCommand and Prop_CloseCommand react only to unknown input (TYP_HUH), so a phrase that starts with a real command or skill word, such as PUSH, PULL or ENTER, never fires.\n\n**Add.** Fix the four lines to mirror Prop_OpenCommand, and add both properties to the smoke test. Then let both listen to COMMANDFAIL too, which PUSH sends when the object is missing. If not, their help should say the phrase must not start with a command.\n\n**Example.** PUSH STONE seals the tomb's exit behind the player. This needs the COMMANDFAIL change as well as the fix.\n\
