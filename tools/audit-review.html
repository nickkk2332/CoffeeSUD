call its functions, and `MPCALLFUNC` reaches only its own host. `UNLOAD FILE` resets `ONCE_PROG` only for the first host that re-parses. `MPNOTRIGGER` works only from inside the host's script. Pending alarms cannot be listed.\n\n**Add.** A `SCRIPT` command, with targets as for `STAT` (a mob or item here, `ROOM`, `AREA`, name@room): `SCRIPT FIRE <target> <trigger> [args] [AS source] [WITH item]`, for `SPEECH hello`, `GIVE`, `DEATH`, `GREET`, `TIME_PROG 5`; `SCRIPT CALL <target> <function> [args]`; `SCRIPT RESET <target> [ONCE|DELAY|ALL]`; `SCRIPT LIST <target>`, its triggers with file:line; `SCRIPT DISABLE|ENABLE <target> [trigger]`; `SCRIPT ALARMS <target> LIST|CLEAR`.\n\n**Example.** `SCRIPT FIRE baker TIME_PROG 5 AS Bob` checks the dawn bread scene without waiting a day. After editing the innkeeper's welcome, `SCRIPT RESET innkeeper ONCE`, then walk in again.\n\n*See also:* JS12 (Both fire a chosen trigger on a chosen host on demand (JCONSOLE .trigger, SCRIPT FIRE)).", "d": "yes", "note": ""}, {"id": "DT8", "theme": "DT", "title": "PLAYTEST: meet the world as a mortal from builder mode", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** Builder mode makes every character that logs in an Archon (`SaveGame.makeArchon`), party members too. Holders of `ORDER`, `CMDROOMS` or `CMDMOBS` are spared by `Aggressive` and `Follower`, are not scaled to by `Prop_Doppleganger`, get no rolled variable equipment, and see `Prop_Uncampable` mobs respawn. Workarounds: `POSSESS` a GenMob with `SYSMSGS` off (no XP, quests or player prompt), which also lets `Mobile` mobs leave; or quit for a normal game, since `SaveGame.restore` refuses in builder mode.\n\n**Add.** `PLAYTEST ON|OFF`. While on, one shared exemption test makes AI, scaling and spawning treat the builder as a mortal, and the prompt shows `(playtest)`. Building commands run with `BUILD <command>`. ON takes a restore point that death returns to, and can set party and difficulty as a new game. OFF restores HP and makes peace. Larger: `PLAYTEST GAME (NAME) (AT room) (LEVEL= CLASS= RACE= KIT=)` exports the world and restarts in process as a normal game; there, plain `BUILD` restarts into builder mode at that room. Also `PARTY MORTAL|ARCHON <name>`, respected by `makeArchon`, so the builder can `SWITCH` to a mortal tester.\n\n**Example.** Build the bandit camp, `PLAYTEST ON`, sneak in, get ambushed at the party's level, `PLAYTEST OFF`, lower the sentry's SPOT=, try again.\n\n*See also:* DT5 (Alternatives for testing as a mortal: a normal game with dev powers, or a playtest mode inside builder mode).", "d": "yes", "note": ""}, {"id": "DT9", "theme": "DT", "title": "DEVLOG: live errors and debug lines for the builder", "kind": "debug tool", "value": "high", "effort": "medium", "body": "**Today.** Single-player forces every log stream to mud.log. Script errors show only to the room the host is in. `<SCRIPT>` JavaScript errors, `MPLOG`, `SCRIPTTRACE`, loader skips and quest failures go only to the file. Launching with `sud.sh ERRMSGS=BOTH WRNMSGS=BOTH` (the ini does not work, SUD overrides it) prints raw lines on the terminal, mixed with game output, never in character windows, and fixed for the session. `LIST LOG LAST n` and `LIST SCRIPTS ERRORS` read the file afterwards.\n\n**Add.** A listener hook in `core/Log`, and `DEVLOG ON|OFF [ERROR|WARN|INFO|DEBUG] [MODULE mask]`, such as `Scripting,Quest*`. New lines go to the builder's own session as one compact coloured line, a repeat shown once with a count, or with `DEVLOG WINDOW` to a separate Swing window reusing `CharacterWindow`. `DEVLOG LAST n` replays, `DEVLOG CLEAR` clears. An ini key sets the default, and the setting persists in builder mode. `LIST LOG ERRORS SINCE BOOT` filters by source: Scripting, CoffeeMaker, Quests, WorldFiles.\n\n**Example.** A script runs `MPGOTO Woods#99` two rooms away, and the terminal at once shows \"[err] Scripting: the hermit/Woods#7/MPGOTO/no such room Woods#99\". A JS TypeError in a `<SCRIPT>` block shows the same way.\n\n*See also:* JS2, DT10 (All three route script and JavaScript errors, with file and line, to the builder; build one error channel); DT24, JS6 (JS22 (now in JS6)'s and DT24's debug() both write to DT9's developer log; one function).", "d": "yes", "note": ""}, {"id": "DT10", "theme": "DT", "title": "Script errors with file and line, kept from the player", "kind": "debug tool", "value": "high", "effort": "medium", "body": "**Today.** `logError` shows \"Scripting Error: ...\" to everyone in the room, so in a normal game the player reads engine errors. The message lists every LOAD= file of the object, not the one at fault, and gives no line. An unknown MP word is only logged; any other unknown word runs as a game command. An MP prefix such as `MPSE` resolves to the last match, `MPSETCLAN`. `<SCRIPT>` exceptions go only to mud.log. The aids are the `BADSCRIPTS` debug flag and `LIST SCRIPTS ERRORS`, after the fact.\n\n**Add.** Record each script line's file and line when parsing, following LOAD=. Errors read `progs/guard.script:42 MPSETVAR Syntax: ...`. In builder mode they go to the builder's session and to a ring buffer shown by a `SCRIPTERRORS` command. In a normal game, ini `SCRIPTERRORS=LOG|NOTICE|SHOW` decides: logged only, one short line per session, or shown. An unknown or ambiguous MP word is an error. `<SCRIPT>` exceptions are reported the same way.\n\n**Example.** A mistyped `mpechot $n` in a 300-line quest-giver script is reported to the builder as `progs/elder.script:212 unknown command MPECHOT`. The playtester never sees a raw engine error.\n\n*See also:* SC14 (SC14 fixes the MP prefix fallback taking the last match, and DT10 makes an ambiguous MP word an error); JS2, DT9 (All three route script and JavaScript errors, with file and line, to the builder; build one error channel).", "d": "yes", "note": ""}, {"id": "DT11", "theme": "DT", "title": "SCRIPTCHECK: a static checker for MOBPROG and JavaScript", "kind": "builder tool and debug tool", "value": "high", "effort": "medium", "body": "**Today.** Script mistakes surface only when a line runs. `parseScripts` only splits lines. IF conditions are parsed on first use, FOR without NEXT is found when it runs, and LOAD= files are read only then. An unknown trigger such as `GREETPROG` never fires and nothing reports it at load. A mistyped command runs as a game command. `LIST SCRIPTS ERRORS` reads the log afterwards, so the builder must play every branch.\n\n**Add.** `SCRIPTCHECK <file|target|AREA|ALL>`, with a headless form. It parses with LOAD= expanded, runs nothing, and reports by file:line: unknown triggers, commands (strict, no prefix matching) and functions; wrong argument counts; unbalanced IF/ELSE/ENDIF, SWITCH/ENDSWITCH, FOR/NEXT and MPWHILE parentheses; `<SCRIPT>` without `<\/SCRIPT>`; missing LOAD= files; `MPCALLFUNC` to undefined `FUNCTION_PROG`s; room IDs in `MPGOTO`, `MPTRANSFER` and `MPOLOADROOM` that do not exist; Rhino compile errors and unapproved `<SCRIPT>` blocks. Variables read but never set are warnings. Builder `SAVE` runs it. It reuses the progs, methods and funcs tables in `ScriptingEngine`.\n\n**Example.** Before playtesting the new village, `SCRIPTCHECK AREA` shows \"progs/miller.script:14 unknown trigger GREETPROG\", \"quests/harvest.script:52 MPCALLFUNC PayFarmer: no such FUNCTION_PROG\" and three unbalanced IFs.\n\n*See also:* DT32 (DT32 runs DT11's MOBPROG checker on a quest's embedded scripts); DT13, DT12 (DT13's WORLD CHECK runs DT11's SCRIPTCHECK and DT12's PROPCHECK).", "d": "yes", "note": ""}, {"id": "DT12", "theme": "DT", "title": "PROPCHECK: check every property string in the world", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** Property parameters are free text, and most classes drop bad input silently. Only `Prop_HaveAdjuster` and `TriggeredAffects` collect errors; `Prop_AddDamage` and `Prop_Socials` write to the log. A wrong room ID can quietly freeze a mob under `Prop_LocationBound`, and a misspelled spell ID in a `Prop_SpellAdder` list does nothing. No command validates effects, and an ability does not declare its parameter keys.\n\n**Add.** `PROPCHECK [AREA name|ROOM|ALL|CATALOG]` walks rooms, exits, areas, mobs, items and catalog entries, re-parses every effect's text and reports: keys the class does not know (each Prop gets a declared key list); room IDs that do not resolve (`Prop_Transporter`, `Prop_RoomRedirect`, `Prop_LocationBound`, `Prop_SparringRoom`); unknown ability IDs in spell lists; zapper masks that fail to compile; props on hosts they cannot affect (`canAffect` false). Lines read \"Area#12 / iron chest / Prop_LimitedContents: unknown key MAXX\". It can also run at builder `SAVE`.\n\n**Example.** Before committing a new area, the owner runs `PROPCHECK AREA Dunmoor` and fixes three typos that would otherwise have done nothing.\n\n*See also:* DT13, DT11 (DT13's WORLD CHECK runs DT11's SCRIPTCHECK and DT12's PROPCHECK); DT19 (Both need each property and behaviour to declare its parameter keys so unknown ones can be flagged).", "d": "yes", "note": ""}, {"id": "DT13", "theme": "DT", "title": "WORLD CHECK: one lint of the whole world, also headless", "kind": "debug tool", "value": "high", "effort": "medium", "body": "**Today.** The checks are separate commands with separate output: `LIST UNLINKEDEXITS`, `ONEWAYDOORS`, `ORPHANS`, `LINKAGES` (split room groups, not reach from START), `DEVIATIONS`, `LIST SCRIPTS ERRORS`, `LIST HELPFILEREQUESTS`, `LIST TAGS TODO`, `TRAILTO`. The boot import names a broken world file but stops at its first problem. Nothing checks keys, default text or data references, and nothing runs before a commit.\n\n**Add.** `WORLD CHECK (AREA name) (LOG) (ONLY=exits,reach,keys,scripts,text,data,balance,quests)` wraps those lists in one report by severity, with room IDs and file:line, and adds: reach from START and the race and class start rooms; locked doors and containers whose key exists nowhere (room, mob, shop, catalog); empty shops; default text (\"StdRoom-\", \"Brand new database room!\", \"A Standard MOB\"); unknown classes, and unknown ability, race, class, faction, catalog or room IDs in custom objects, masks and scripts; masks that fail to compile; achievements that parse to \"Error:\"; short recipe rows; custom objects without help; quests that fail to start; unreferenced catalog items; areas with no clock or climate; `Mobile` mobs free to leave their area; `DEVIATIONS` above a threshold; `SCRIPTCHECK ALL` and `PROPCHECK ALL`. `sud.sh CHECK=1` runs it on a scratch copy and exits non-zero on errors.\n\n**Example.** A git hook runs `sud.sh CHECK=1` and refuses the commit: \"Crypt#7 east: locked with key 'bone key', which exists nowhere\"; \"Town#3: default description\".\n\n*See also:* DT11, DT12 (DT13's WORLD CHECK runs DT11's SCRIPTCHECK and DT12's PROPCHECK).", "d": "yes", "note": ""}, {"id": "DT14", "theme": "DT", "title": "GENERATE CHECK: lint for generator XML", "kind": "debug tool and generator", "value": "high", "effort": "medium", "body": "**Today.** Template errors in generator XML (unknown INSERT or LIKE ids, undefined variables, a misspelt layout or CLASS, REQUIRES that cannot be met, `<` in attributes) show only at generation time, as \"Unable to fully generate\", often deep in a run. Detail is in the log: load-time problems, and traces under `DEBUG=MUDPERCOLATOR`. `GENERATE <TYPE> LIST` prints the defined ids. The `random.xsd` the DOCS mention is gone from the fork.\n\n**Add.** `GENERATE CHECK <file>` loads the file with its LOAD and FROM includes and reports, with tag id and line: duplicate ids without MERGE; INSERT, LIKE and FROM targets that do not exist; CLASS values `CMClass` cannot resolve (catalog: and metacraft: excepted); unknown layouts; `$variables` never defined and without default; REQUIRES that cannot be met; SELECT modes that cannot pick; unused ids. The smoke test can call it, so content mistakes fail the build.\n\n**Example.** After writing crypt.xml, `GENERATE CHECK randareas/crypt.xml` says that \"crypt_leaf_rooms\" is inserted but never defined, and that class \"GenSkeleton\" does not exist.", "d": "yes", "note": ""}, {"id": "DT15", "theme": "DT", "title": "Playtest files with assertions, and a runner that fails", "kind": "builder tool and data file", "value": "high", "effort": "medium", "body": "**Today.** `tools/sudplay.py` drives the real game from input lines and passes ini overrides (`TIMEMODE=TURNS`, `RANDOMSEED=`, a scratch `DBSERVICE=`, `SAVEDIR`, `WORLDDIR`, `RESTORE=`). But its `#expect` waits up to 30 minutes and never fails, so each test needs its own greps afterwards, as `smoke.sh` does. A builder cannot keep regression playtests of the world as content.\n\n**Add.** `.play` files under `world/tests/`: one command per line, plus `#seed n`, `#new` with a `#char Name,Race,Class` block or `#restore slot`, `#expect TEXT` and `#reject TEXT` (fail on timeout or match), `#assert HERE roomid`, `#assert HAS item`, `#assert VAR host name op value`, `#assert QUEST name STEP n`, `#wait n`, `#save slot`. A small dev-only `ASSERT` command answers the asserts, so nothing is scraped. `tools/playtest.sh [files]`, on top of sudplay.py with scratch data as smoke.sh uses, defaults to turns and a fixed seed, prints PASS or FAIL per file and step, and exits non-zero on failure. In game: `PLAYTEST RUN <file>`, so it does not clash with DT8's `PLAYTEST ON|OFF`.\n\n**Example.** `world/tests/bridge.play` goes to the troll, gives the toll, asserts `VAR Hero PAIDTROLL = 1`, crosses, asserts `HERE Moor#1`. Run before every commit, it catches the day an edit renamed the toll item.\n\n**Also merged here, from DT38 (WORLD TEST: repeatable checks of the world's content).** WORLD TEST [name|ALL] in builder mode, for two kinds of file:\n- world/tests/*.test: a throwaway character (LEVEL, CLASS, RACE, AT room), a list of commands, and EXPECT \"text\", EXPECT ROOM id, EXPECT VAR mob var=value, EXPECT ITEM name.\n- world/js/tests/*.js: test(name, function(t){...}) with the helpers t.newPlayer, t.go, t.say, t.wait, t.eq and t.at.\n\nEach run uses a throwaway copy of the world, turn-based time and a fixed RANDOMSEED, then resets the rooms. It reports pass or fail, with the output that failed. A script in tools/ can run the tests before a commit.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* DT25, DT39 (later) (DT25 records .play files for DT15's runner, and exact replay of them needs DT39 (later)).", "d": "yes", "note": ""}, {"id": "DT16", "theme": "DT", "title": "TESTCHAR and KIT: test characters and loadouts as data", "kind": "builder tool and data file", "value": "high", "effort": "medium", "body": "**Today.** A new profile character goes through every creation question, as the long answer script in `smoke.sh` shows. `CHARGEN NEW` makes an averaged levelled mob in the room, not a profile character that can join the party or be saved. A kit can be written as a MOBPROG file run with `MPRUN` or a `CHARCREATIONSCRIPTS` hook, using `MPPLAYERCLASS`, `MPOLOAD`, `MPMONEY`, `MPFACTION`, `MPSETVAR` and `MPTRANSFER`, but there is no simple kit format.\n\n**Add.** Kit files `world/kits/NAME.kit`, with lines such as `level 12`, `class Fighter`, `race Dwarf`, `item catalog:Mithril Axe`, `gold 500`, `ability Skill_Dodge 75`, `faction Merchants 2500`, `var ACT 3`, `room Crypt#1`. `TESTCHAR name KIT=k [PARTY]` (dev and builder) makes a profile character from the kit with no questions, levelled by CHARGEN's code, and can add it to the party. `KIT k [target]` applies a kit to an existing character or follower, as a thin interpreter over those MP commands. Kits live with the world in git.\n\n**Example.** `TESTCHAR Tank KIT=act3-warrior PARTY`, `TESTCHAR Heals KIT=act3-cleric PARTY`, then `GOTO Crypt#1`: the act-3 dungeon is tested with a level-12 party in under a minute.\n\n*See also:* P7, P8 (DT16's kit files and TESTCHAR overlap P7's starting kits (both under world/kits) and P8's ready-made characters; share one format).", "d": "yes", "note": ""}, {"id": "DT17", "theme": "DT", "title": "PREVIEW and CHECKTEXT for conditional text", "kind": "builder tool, presentation", "value": "high", "effort": "medium", "body": "**Today.** A builder sees a `<VARIES>` text only as it reads now, here, to them. To see the winter night version they must change the world: `TICKTOCK`, `Prop_Weather` on the area, or walking in from one side. Unknown or lowercase tags, open tags, `>` inside a `MASK` and open colour codes print silently as text. The engine has one such bug now: the code spells the tag `FROMUNKOWN`, where the ArchonGuide documents `FROMUNKNOWN`.\n\n**Add.** `PREVIEW ROOM|ITEM name|MOB name [DAY|NIGHT|DAWN|DUSK] [SPRING..WINTER] [RAIN|SNOW|...] [FROM north] [VISITED|FIRSTVISIT] [AS charname] [VAR x=y]` shows the text under those conditions and changes nothing. `CHECKTEXT [ROOM|AREA|WORLD]` lists unknown or lowercase tags, unbalanced tags, masks with `>`, open colour codes, dead `FILE=` links, and `Prop_Details` keywords that also match real objects. `FROMUNKNOWN` becomes an alias.\n\n**Example.** `PREVIEW ROOM NIGHT WINTER SNOW VAR BRIDGE=1`, then `CHECKTEXT AREA` reports `Mirefen#14: <nigth> is not a tag`.\n\n*See also:* PR16 (Both deal with the FROMUNKOWN tag spelling (document it vs add FROMUNKNOWN as an alias)); B12 (Both define a PREVIEW command (catalog objects vs conditional text)); DT20 (DT20's LOOK AS uses DT17's PREVIEW code).", "d": "yes", "note": ""}, {"id": "DT18", "theme": "DT", "title": "Script trace for one host, shown to the builder", "kind": "debug tool, script command, script function", "value": "medium", "effort": "small", "body": "**Today.** `CREATE DEBUGFLAG SCRIPTTRACE` turns on a global trace that writes every line of every script to mud.log. It does not say why a trigger was skipped: the chance roll, a mask, `MPNOTRIGGER`, a busy host (`isFreeToBeTriggered`), no PC present, a passive area, or no global registration yet. `if isimmort($n)` with `mpechoat` gives builder-only output, but it needs a PC in context.\n\n**Add.** `SCRIPTTRACE <target>|ROOM|AREA|OFF [trigger]`, shown only in the builder's session and not saved. It echoes each trigger considered with its result (`GREET_PROG 50: rolled 73, skipped`), each line run and each variable change. `MPSETINTERNAL TRACE TRUE` turns it on from inside a script. A new test, `ISBUILDER()`, calls `SaveGame.isBuilderMode()`. A builder-only `MPDEBUG` has its own item.\n\n**Example.** With `SCRIPTTRACE AREA GREET_PROG` on, the builder walks into the bandit camp. The trace shows the chief's `GREET_PROG` was skipped because he is asleep, so the script itself is fine.\n\n*See also:* ST6, DT5 (ST6 adds ISDEV() and ISBUILDER(), DT5 adds ISDEV() and DT18 adds ISBUILDER(); add each once).", "d": "yes", "note": ""}, {"id": "DT19", "theme": "DT", "title": "STAT BEHAVIORS: an NPC's live behaviour state", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** `STAT SCRIPTS <mob>` shows a mob's scripts and variables, and `MODIFY MOB` lists its behaviours with their parameter strings. Nothing shows a behaviour's live state. `StdBehavior.getStat` gives only `CLASS` and `TEXT` (`CombatAbilities` exposes more). Misspelt parameter keys are dropped silently, and the `DEBUGFLAG` traces go to the log.\n\n**Add.** `STAT BEHAVIORS <mob|item|here>`, beside `STAT SCRIPTS`. For each behaviour it shows:\n\n- the parameters as parsed, with unknown keys flagged;\n- ticks to the next action, and the last action;\n- the current target, route step, schedule entry, morale or remembered facts.\n\nEach behaviour answers `getStat(\"DEBUG\")`; the default gives tickDown and chance. `TRACEB <mob> [ticks]` echoes each decision to the builder for a while.\n\n**Example.** The miller is not at the market. `STAT BEHAVIORS miller` shows `Schedule: entry DAY -> Market#5, path failed: locked door Mill#2 east`.\n\n*See also:* S9 (S9's getStat(STATE) and DT19's getStat(DEBUG) both expose a behaviour's runtime state; design them together); DT12 (Both need each property and behaviour to declare its parameter keys so unknown ones can be flagged).", "d": "yes", "note": ""}, {"id": "DT20", "theme": "DT", "title": "WEATHER SET, TIME SET, LOOK AS and HAZARDS", "kind": "builder tool, debug tool", "value": "medium", "effort": "small", "body": "**Today.** `TICKTOCK` moves the calendar by any step from hours to years, and `TICKTOCK SET Y/M/D/H` sets it, but only plain `TICKTOCK n` runs the time-change events. No command sets the weather. The builder adds `Prop_Weather` with `MODIFY AREA`, or calls `setNextWeatherType` and `forceWeatherTick` from `JCONSOLE`. Nothing lists an area's hazards.\n\n**Add.** In builder mode:\n\n- `WEATHER SET <weather> [AREA <name>] [NEXT]`;\n- `TIME SET <hour|DAWN|DUSK|NIGHT>` and `TIME SEASON <season>`, which run the change events;\n- `LOOK AS <night|winter|rain|visited|from north...>`, which shows the room under made-up conditions, using the same code as `PREVIEW`;\n- `HAZARDS`, which lists every hazard, spawner and condition behaviour in the area with its current state.\n\n**Example.** The owner writes a moor room with `<NIGHT><FOG>` text and checks it with `LOOK AS night fog`. Then `WEATHER SET THUNDERSTORM` lets them watch the shepherd's `WEATHER_PROG`.\n\n*See also:* W12, W20 (W12's MPWEATHER and WEATHER SET and FORECAST are repeated in W20 (MPWEATHER, FORECAST) and DT20 (WEATHER SET); build one set of weather commands); DT17 (DT20's LOOK AS uses DT17's PREVIEW code).", "d": "yes", "note": ""}, {"id": "DT21", "theme": "DT", "title": "LAW: inspect and test an area's legal system", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** The law finds its people and places by name (`OFFICERS=cityguard`, `JUDGE=justice judge`, `JAIL=The Jail$`). A name that matches nothing fails silently, and the reasons go only to the debug log, under the `ARREST` flag. `STAT CRIMES` gives daily counts, not current warrants. The only way to look inside is `JCONSOLE` with raw calls such as `CMLib.law().getLegalBehavior(...).getWarrantsOf(...)`.\n\n**Add.** `LAW`, in builder mode, shows the law file in use, the officers, judges, jail and release rooms it found, the taxes and the number of crimes. `LAW CRIMES [filter]`, `LAW WARRANTS [name]`, `LAW PARDON <name> [crime|ALL]` and `LAW ACCUSE <name> <crime>` handle warrants. `LAW TEST <crime>` says whether doing it here and now is a crime, and why (home or indoors flags, witnesses). `LAW SET KEY=VALUE` writes the custom law, using the inline Arrest parameters that already exist.\n\n**Example.** After building a town, `LAW` reports `0 officers found matching cityguard`, and the builder renames the guards.\n\n*See also:* W1 (Both add pardoning and accusing per crime (MPPARDON and MPFINE vs LAW PARDON and LAW ACCUSE)); W21 (DT21's LAW SET writes the custom law that W21 saves as world content).", "d": "yes", "note": ""}, {"id": "DT22", "theme": "DT", "title": "PRICECHECK: how a price was reached", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** A price combines several factors:\n\n- the stock price or base value;\n- the first matching prejudice rule;\n- every matching `PRICEMASKS` mask, multiplied together;\n- charisma against the keeper's wisdom;\n- sales tax, devaluation and rounding to coins.\n\nShopkeeper, area, parent area and ini settings stack on top. `VALUE` and the shop's `LIST` show only the result. The only breakdown is `JCONSOLE` with raw calls to `CMLib.coffeeShops()`.\n\n**Add.** `PRICECHECK <item> [AT <shopkeeper>] [FOR <character>] [SELL]` prints each factor and where it came from (shopkeeper, area, parent or ini, and which mask or rule matched). It also prints the selling and buying prices, the budget left and the time to the next inventory reset. It reads the existing `getFinal*` settings and factor functions.\n\n**Example.** `PRICECHECK cloak` shows `PRICEMASKS 10.0 -MATERIAL +CLOTH, set by quest harsh winter`, so the builder sees why cloaks cost ten times more.", "d": "yes", "note": ""}, {"id": "DT23", "theme": "DT", "title": "TIMESCALE: run real time faster or slower", "kind": "world option, builder tool", "value": "medium", "effort": "small", "body": "**Today.** In real-time mode the clock runs at wall-clock speed, so watching a caravan route or a weather change means waiting. `GameTime.now()` has no rate. At launch, `sud.sh TICKTIME=500` makes ticks come about 8 times as often, and `MILLISPERMUDHOUR=60000` speeds up only the calendar. Neither one scales the millisecond durations read from `GameTime` (cooldowns, decay, effect timers), and the tick length is fixed at boot.\n\n**Add.** A rate in `GameTime`, set by the dev and builder command `TIMESCALE x` (0.1 to 20) or by `TIMESCALE=` in the ini. `GameTime.now()` multiplies the real time elapsed since the last change, so everything that reads the clock follows. Pause and turn-based time work as now. The prompt shows `(x5)` while the rate is not 1.\n\n**Example.** `TIMESCALE 8` to watch the river ferry cross and come back a few times, then `TIMESCALE 1`.", "d": "yes", "note": ""}, {"id": "DT24", "theme": "DT", "title": "MPDEBUG and a JavaScript debug() for builder-only output", "kind": "script command, JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** Players in the room see `MPECHO`, and a forgotten one ships with the world. `MPLOG DEBUG <module> <text>` does most of the job already: it expands $-variables and writes only to the debug log, and `sud.sh DBGMSGS=BOTH` shows it on the terminal. In `<SCRIPT>` JavaScript, `Packages.com.planet_ink.coffee_mud.core.Log.debugOut(...)` works but is long. No message says which host, room or line wrote it.\n\n**Add.** `MPDEBUG text`: `MPLOG DEBUG` with a `[debug host@room file:line]` prefix. In builder or dev mode it goes to a developer log, on the terminal or in a window. In a normal game it does nothing, so leftover lines are harmless. The same function is `debug(x)` in the `<SCRIPT>`, `JRUN` and `JCONSOLE` scopes, with `toJavaString` for objects.\n\n**Example.** In a quest's `SPEECH_PROG`, `MPDEBUG chose suspect=$<$i SUSPECT> motive=$<$i MOTIVE>` checks the mystery generator's choices without spoiling them in the room.\n\n*See also:* DT9, JS6 (JS22 (now in JS6)'s and DT24's debug() both write to DT9's developer log; one function).", "d": "yes", "note": ""}, {"id": "DT25", "theme": "DT", "title": "RECORD INPUT: a replayable playtest file", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** A bug that shows up after an hour of play cannot be replayed. `sud.sh DEBUG=INPUT` logs each typed line to mud.log as `TIN: <character>: '<line>'` with a timestamp, for the terminal and every window. `RECORD` (`Archon_Record`) writes input and output mixed together. Neither is a file a runner can replay, and neither records what game it started from.\n\n**Add.** `RECORD INPUT file|OFF` (dev) and the ini setting `RECORDINPUT=1`. Every typed line is written with its character and game time, after a header: seed, time mode, the save or new game it started from, and the world checksum. The result is a `.play` file that the playtest runner can replay. Today that runner is `tools/sudplay.py`, which plays a script of input lines. `RECORD MARK text` puts a comment in the file when the bug is seen.\n\n**Example.** While playing with `RECORDINPUT=1`, the blacksmith's script loops. `RECORD MARK loop here` marks the spot, and the file is replayed after each fix.\n\n*Re-checked against the code after writing: accurate.*\n\n*See also:* DT15, DT39 (later) (DT25 records .play files for DT15's runner, and exact replay of them needs DT39 (later)).", "d": "yes", "note": ""}, {"id": "DT26", "theme": "DT", "title": "NOTE: playtest notes that reach builder mode", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** The `BUG`, `TYPO` and `IDEA` journals were removed. `COMMANDJOURNALS=NOTE ADDROOM` in coffeemud.ini would make a `NOTE` journal with the room ID on each entry, and its `SCRIPT=` could copy entries to mud.log with `MPLOG INFO`. But entries are kept in `CMJRNL`, a table in that game's save. A note written in play never reaches builder mode, where the fix is made.\n\n**Add.** `NOTE text` works in any mode and appends to `notes/playtest.txt`, outside world/ and the saves. Each note records the date, save slot, character, room ID and name, game time and the text. `NOTE HERE` adds what `STAT ROOM` shows. `NOTES` lists them numbered, `NOTES DONE n` marks one done, and `NOTES GOTO n` (builder or dev) goes to the room.\n\n**Example.** While playing: `note the miller mentions a dog that is not in the room`. Next day in builder mode, `NOTES GOTO 4`, add the dog, `NOTES DONE 4`.\n\n*See also:* PR7 (Both claim the NOTES command (PR7's JOURNAL alias vs DT26's playtest notes)).", "d": "yes", "note": ""}, {"id": "DT27", "theme": "DT", "title": "world/dev/: areas loaded only for building and testing", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** Every file in world/areas is imported into every game, and the default start room even ships the Archon's manual. `Prop_Hidden` on an area hides it from `GOTO`, area lists and tracking for normal players. But the area is still loaded and part of the world checksum, and its items are real copies, which matters for the planned unique-item caps. `WORLDDIR=` can point at a dev world, but each switch forces a full rebuild.\n\n**Add.** Area files in `world/dev/*.cmare`, imported only with `BUILDER=1` or `DEV=1` (only `BUILDER` exists today). They have their own checksum, so they do not force rebuilds of the normal game. Builder mode writes areas flagged dev (an area flag or a `dev` tag in the file) back there. `DEVSTART=Hub#1` sets the dev start room. `WORLDCHECK` warns about exits from shipped areas into dev areas.\n\n**Example.** `world/dev/hub.cmare` holds a Developer Hub with portals to Act1#1, Act2#1 and Act3#1, a `Prop_PracticeDummy`, and a chest with one of each catalog unique. Players never see it.\n\n*See also:* DT5, DT6 (DT6's GOD toggles and DT27's world/dev areas depend on DT5's DEV=1 mode).", "d": "yes", "note": ""}, {"id": "DT28", "theme": "DT", "title": "VESSEL STATUS and LIST INSTANCES", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** `LIST SHIPS` shows a vessel's name, place and tech registry key, and `STAT` on the vessel item adds owner, price, speed and uses. Nothing shows its course, anchor, facing, pacing, crew, passengers or route step. Instance children appear in `LIST AREAS` under names like `3_Area`, and `INSTANCEDISPLAY` only predicts which type a player would get. Nothing shows an instance's members or time left.\n\n**Add.** `VESSEL STATUS <name>` shows course, anchor, facing, speed and pacing, hull, owner, home port, docked room, behaviours and route position, crew and passengers. `LIST SHIPS` gains `ANCHOR`, `COURSE` and `OWNER` columns. `LIST INSTANCES` lists each child area with its parent, type ID, members, ticks to timeout, room count and a `GOTO` hint.\n\n**Example.** While testing the ferry line, `VESSEL STATUS gull` shows `stop 2/3 Saltmarsh, departs at 12, anchor down, 3 crew, 1 passenger`, and the builder sees why it is stuck.\n\n*See also:* T11 (Both add a VESSEL builder command (RENAME, ENTER and HOME vs STATUS)).", "d": "yes", "note": ""}, {"id": "DT29", "theme": "DT", "title": "VALIDATE RECIPES", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** A malformed inline component only logs, and the craft then costs nothing. A missing named component logs nothing, and a bad mob ID in hunting.txt shows only \"no signs of life\". `LIST RECIPES <skillID>` and `MODIFY RECIPE <skillID>` check the base recipe file column by column, but they stop at the first error. They skip the `.txt.N` extensions, components.txt and the gathering tables, and they do not check whether components resolve.\n\n**Add.** `VALIDATE RECIPES [skill|ALL]` parses every recipe row, extension file and components.txt entry of the chosen skills. It reports every error with its file and row:\n\n- unknown materials, resources and subtypes;\n- unknown item classes, and unknown spell or behaviour IDs;\n- malformed component expressions;\n- bad mobs or races in hunting.txt and fishing.txt;\n- rows with the wrong number of columns.\n\n**Example.** After adding starsteel recipes, `VALIDATE RECIPES Blacksmithing` reports `blacksmith.txt.1 row 3: material starstel unknown`.", "d": "yes", "note": ""}, {"id": "DT30", "theme": "DT", "title": "VOCAB: test translation and parser rules", "kind": "debug tool, builder tool", "value": "medium", "effort": "small", "body": "**Today.** Writing translation and parser rules is trial and error. Nothing shows which rule rewrote a line, what the command pre-processor makes of a typed command, or which file supplied a lists.ini value. Reloading works but needs the cache keys: `LIST RESOURCES`, then `UNLOAD RESOURCE PARSED_LISTFILE`, `TRANSLATION_`, `PARSER_` or `PARSED_SOCIALS`, and `UNLOAD HELP`.\n\n**Add.**\n\n- `VOCAB TEST <text>` shows the text after the session and final rules, and which rule matched.\n- `VOCAB INPUT <command line>` shows what the pre-processor makes of it, including several commands if it splits.\n- `VOCAB LIST <KEY>` shows the effective lists.ini value and the file or area that supplied it.\n- `VOCAB RELOAD` runs those unloads in one command.\n- `VOCAB ADD <section> replaceall \"x\" with \"y\"` appends to the world rule file.\n\n**Example.** `VOCAB INPUT get sword and shield from chest` shows the two resulting commands before the builder ships a parser rule.", "d": "yes", "note": ""}, {"id": "DT31", "theme": "DT", "title": "LANGUAGE PREVIEW and COVERAGE for invented languages", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** To check a `GenLanguage`, a builder has to speak it to a test mob with set proficiencies. The `LANGUAGES` command lists what a character knows, `LIST LANGUAGES` lists the defined ones, and `MODIFY LANGUAGE` only edits. `StdLanguage`'s `translate`, `messChars` and `scrambleAll` are public, but only JavaScript can reach them. Nothing reports how much of a text the dictionary covers.\n\n**Add.** `LANGUAGE PREVIEW <id> [proficiency] <text>` shows what a listener at that proficiency hears, the speaker's own garble and a reader's view. It also shows where each word came from: the dictionary, the suffix rules, the syllables or the word lists. `LANGUAGE COVERAGE <id> <file|room>` counts dictionary hits over a text, such as an area's descriptions.\n\n**Example.** Before release, `LANGUAGE COVERAGE Dunetongue` over the oasis area's descriptions shows the missing words. The builder adds the 40 most common ones to the dictionary file.\n\n*See also:* L5 (DT31's preview shows which of L5's sources (dictionary, suffixes, syllables) each word came from).", "d": "yes", "note": ""}, {"id": "DT32", "theme": "DT", "title": "QUESTCHECK: check a quest script without starting it", "kind": "debug tool, quest feature", "value": "medium", "effort": "medium", "body": "**Today.** A quest's errors show only when it starts, and only in mud.log. `CREATE QUEST` and `MODIFY QUEST` check the name and duration, and say only that the script \"contained errors\". A typo in an embedded MOBPROG shows only when that line runs. The `QUESTSCRIPTS` debug flag and `LIST LOG LAST n` only help read the log.\n\n**Add.** `QUESTCHECK <quest|file>` parses the script without making objects and reports by line:\n\n- unknown commands or `SET` variables;\n- a missing `NAME` or `DURATION`;\n- `WAIT` without `INTERVAL`, which deletes the quest after its first stop;\n- `LOAD=` and `IMPORT` files that do not exist;\n- `<FILE>` names and step labels used but not defined.\n\nIt also runs the MOBPROG parser on each embedded script to catch unknown triggers, commands and functions. At startup, builder mode checks all of world/quests and prints a one-line summary.\n\n**Example.** After a hand edit, `QUESTCHECK bell` reports `line 14: SET DURATON unknown; line 30: LOAD=bell_ghost.script not found`.\n\n*See also:* DT11 (DT32 runs DT11's MOBPROG checker on a quest's embedded scripts).", "d": "yes", "note": ""}, {"id": "DT33", "theme": "DT", "title": "PUZZLE command: see, test, reset and check puzzle wiring", "kind": "builder tool", "value": "medium", "effort": "medium", "body": "**Today.** STAT on an object dumps its script variables as raw XML. LIST SCRIPTS (AREA) lists scripted objects, LIST SCRIPTS ERRORS pulls runtime script errors from the log, and LIST UNLINKEDEXITS and LIST ONEWAYDOORS check the map. Nothing shows a room's switches, plates, receptacles and controllers with their state and targets. Nothing checks that a room, direction, door or catalog name in a script or property exists. A bad one shows up only in play.\n\n**Add.** A PUZZLE command in builder mode. PUZZLE and PUZZLE AREA list each puzzle prop with its state and targets. PUZZLE SET <obj> <state>, PUZZLE SIGNAL <target> <name> and PUZZLE RESET [room|area] work the puzzle by hand. PUZZLE CHECK validates every target, signal and catalog name in the world, MPAT and MPOPEN included. It also runs at world load and logs to mud.log. The listing and the console need the switch, plate and controller props, so they come after those. CHECK is useful now.\n\n**Example.** After building the Hall of Bells, PUZZLE CHECK reports that lever3 targets 'Vault#2 west', which has no door.\n\n*See also:* I12 (later) (DT33's PUZZLE command shows and works I12 (later)'s controller and the switch and plate props).", "d": "yes", "note": ""}, {"id": "DT34", "theme": "DT", "title": "SCRIPTPROF: timing per script and trigger, slow-script warnings", "kind": "debug tool", "value": "medium", "effort": "medium", "body": "**Today.** Everything runs on one game thread, so a slow script stalls the world and makes turn-based WAITs crawl. LIST TICKS shows tick times per ticking object (tickermillitotal, tickermilliavg, tickerlastduration), and a mob's RAND_PROG and TIME_PROG count in its tick. DEBUG=SCRIPTTRACE logs each trigger with timestamps, so rough timing can be done by hand. Nothing counts per script file or trigger line. Nothing times triggers run from messages, such as SPEECH_PROG and GREET_PROG. MPWHILE stops after 4 seconds without telling anyone.\n\n**Add.** SCRIPTPROF ON|OFF|RESET|REPORT [n] [AREA]. For each script file and trigger line it counts runs, total ms and max ms, and names the host with the worst run. An ini setting, SCRIPTSLOW=50 (ms): a trigger run longer than that, or an MPWHILE cut off at its cap, logs a warning to mud.log naming the host, file and line.\n\n**Example.** WAIT 1 DAY takes a minute. SCRIPTPROF REPORT 5 shows the RAND_PROG at line 30 of progs/townsfolk.script taking 70% of the time: a FOR over every room in the world on every tick.", "d": "yes", "note": ""}, {"id": "DT35", "theme": "DT", "title": "COMBATDEBUG: explain each roll while tuning", "kind": "debug tool", "value": "medium", "effort": "medium", "body": "**Today.** Combat numbers stack up: Prop_CombatAdjuster, resistances, Prop_AbsorbDamage, the fudge for level difference, crits. SHOWDAMAGE=YES/SOURCE/TARGET in the ini shows only the final damage. STAT COMBAT <mob> shows the static attack, armor and damage figures. The debug flags have no combat entry but `SIEGECOMBAT`, for ship fights. When an encounter feels wrong, the builder cannot see why a hit missed or did only 3 damage.\n\n**Add.** A builder command, COMBATDEBUG ON|OFF [target]. For each attack involving the target it prints the attack value, the armor, the hit chance and the roll, and the base damage. It then prints the result of each formula (TARGETED, FUDGE, CRIT), and each effect that changed the damage message (resistance, absorb, immunity) with what it changed. It can also log to a file, for SIMFIGHT runs.\n\n**Example.** `[dbg] goblin -> Ana: atk 62 vs ac 41, hit 71% roll 34 HIT; dmg 7, fudge(-2 lvls) 6, Prop_AbsorbDamage(10% +SLASHING) -> 5.`\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* DT40 (later) (DT35's combat log is meant for DT40 (later)'s SIMFIGHT runs).", "d": "yes", "note": ""}, {"id": "DT36", "theme": "DT", "title": "PROGRESSION report: the level curve and the XP the content gives", "kind": "debug tool", "value": "medium", "effort": "medium", "body": "**Today.** To balance progression, the owner reads EXP_CHART, the class formulas and allqualifylist by hand. WILLQUALIFY <level> <class> lists the skills and expertises gained per level and marks autogain. CHARGEN NEW or PLAYER <class> <level> makes a sample character whose SCORE shows HP, mana, moves, trains and practices. HELP <class> prints the practice and train formulas. LIST ACHIEVEMENTS and LIST QUESTS show rewards one at a time. There is no table of the curve, and nothing adds up the XP the world gives.\n\n**Add.** PROGRESSION <class> [race] [to level] lists, for each level, the XP needed, HP, mana and moves, practices and trains, the skills gained (autogain or to learn) and the expertises unlocked. PROGRESSION XP [area] adds up, per area, the XP in achievements, in literal MPEXP amounts in quest and mob scripts, and in Prop_Discovery and Prop_EnterAdjuster. It also shows the level a character reaches after doing everything, area by area in order.\n\n**Example.** Clearing the first three areas gives 6,200 XP (level 6), but the fourth area's mobs are level 9. A discovery reward or an EXP_CHART step needs changing.", "d": "yes", "note": ""}, {"id": "DT37", "theme": "DT", "title": "ORGCHECK: check faction files, governments and clan references", "kind": "builder tool", "value": "medium", "effort": "medium", "body": "**Today.** Mistakes in faction and clan data fail silently, and there is no check command. A faction file is read into a property map, so a later duplicate key replaces an earlier one. resources/examples/reputation.ini sets RANGE6 three times, and only 'world hero' survives. Bands can overlap or leave gaps. PresenceReaction drops unknown IDs. CHANGE triggers on unknown ability IDs never match. A mob whose <CLAN> names a missing clan loses the tag at load.\n\n**Add.** ORGCHECK [faction file|clan|government|ALL] in builder mode. It re-reads the raw ini and reports:\n- duplicate keys, and gaps or overlaps between bands;\n- CHANGE triggers that match nothing, the stock ability-ID rules included;\n- unknown REACTION and AFFBEHAV IDs, masks that do not compile and missing RELATION targets;\n- positions with no powers, or with an INNERMASK no one can pass.\n\nIt also lists mobs in the world files with an unknown <CLAN>, and governments whose ENTRYSCRIPT does not parse.\n\n**Example.** ORGCHECK thieves.ini reports 'RANGE3 and RANGE4 both contain 500', 'REACTION7: unknown ability Mod' and '3 mobs in harbor.cmare name clan Thieve Guild, which does not exist'.\n\n*See also:* F5 (F5 fixes the ability-ID faction CHANGE rules that DT37 reports as matching nothing).", "d": "yes", "note": ""}, {"id": "DT39", "theme": "DT", "title": "DETERMINISTIC=1: exact replay for playtests", "kind": "world option", "value": "medium", "effort": "large", "body": "**Today.** RANDOMSEED and TIMEMODE=TURNS are the only settings that make a run repeatable, and PLAN.md notes that exact replay is not done. Objects in a tick group tick in an order set by identity hash codes. The boot loads on several threads. IDs and database keys use Math.random(). So a recorded playtest or a golden transcript drifts between runs, and a difference after a world edit may mean nothing.\n\n**Add.** A DETERMINISTIC=1 setting, in the ini and on the command line, for tests. With it:\n- tick groups order their objects by registration order and a stable sequence number;\n- the boot loads on one thread;\n- generated IDs and database keys come from a seeded generator;\n- time is forced to TURNS.\n\ntools/smoke.sh and any replay of recorded input turn it on. This is engine work spread across the scheduler, the boot and ID generation.\n\n**Example.** A recorded 300-command run through act 1 gives a byte-identical transcript every time, so any difference after a world edit is meaningful.\n\n*See also:* JS13 (Exact replay needs JS13's Math.random on the shared dice as well as DT39 (later)'s deterministic scheduler); DT15, DT25 (DT25 records .play files for DT15's runner, and exact replay of them needs DT39 (later)).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "DT40", "theme": "DT", "title": "SIMFIGHT: simulate the real party against an encounter", "kind": "debug tool", "value": "medium", "effort": "large", "body": "**Today.** CHARGEN COMBAT ([classes]...) (MOB=<name>) (ITERATIONS=x) (EXPORT=file) (FAILCHECK) (SKIPLEVELS) [start] [end] runs stock class characters, each with its class's CombatAbilities AI, one-on-one against a mob, catalog mobs included. It reports wins per class and level. It cannot use the real party with its gear, skills and followers. It cannot face several opponents, a room or an encounter table. It reports nothing per member.\n\n**Add.** SIMFIGHT [PARTY|name...] VS [HERE|mob name|encounter:<table>|catalog:<name>*n] ITERATIONS=50 AI=CLASS [DIFFICULTY=x], built as an extension of CharGen. It copies the party and the opponents into a scratch room and runs the fight headless at full speed. Followers are on AUTOASSIST and party members use class AI. It reports the win rate and median rounds; HP and mana left and deaths, per member; the deadliest ability; and how often telegraph or phase triggers fired.\n\n**Example.** After setting up the lich, with phases and a telegraphed blast, SIMFIGHT PARTY VS HERE ITERATIONS=100 gives 'win 34%, cleric dies 61%, median 14 rounds'. The builder weakens the blast and reruns until the win rate is about 70%.\n\n*See also:* C9 (DT40 (later) simulates fights against C9's encounter: tables); DT35 (DT35's combat log is meant for DT40 (later)'s SIMFIGHT runs).", "d": "no", "note": "later: moved to LATER.md"}]};
const KEY = 'coffeesud-audit-review';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
// decisions already recorded in the audit, unless this browser has its own
for (const it of DATA.items) if (!(it.id in state) && (it.d || it.note)) state[it.id] = { d: it.d || '', note: it.note || '' };

const themeName = {};
for (const t of DATA.themes) {
  themeName[t.prefix] = t;
  const o = document.createElement('option'); o.value = t.prefix; o.textContent = t.name;
  document.getElementById('fTheme').appendChild(o);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}
function render(md) {
  return md.trim().split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    return '<p>' + inline(block.replace(/\n/g, ' ')) + '</p>';
  }).join('');
}
function decision(id) { return (state[id] && state[id].d) || ''; }
function tally() {
  let y = 0, n = 0;
  for (const it of DATA.items) { const d = decision(it.id); if (d === 'yes') y++; else if (d === 'no') n++; }
  document.getElementById('tally').innerHTML = `<b>${DATA.items.length}</b> items · <b>${y}</b> yes · <b>${n}</b> no · <b>${DATA.items.length - y - n}</b> undecided`;
}
function setDecision(id, d, el) {
  state[id] = state[id] || {};
  state[id].d = (state[id].d === d) ? '' : d;
  save(); tally(); paint(el, id);
}
function paint(el, id) {
  const d = decision(id);
  el.classList.toggle('yes', d === 'yes'); el.classList.toggle('no', d === 'no');
  el.querySelector('.y').classList.toggle('on', d === 'yes');
  el.querySelector('.n').classList.toggle('on', d === 'no');
}
function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const ft = document.getElementById('fTheme').value, fv = document.getElementById('fValue').value;
  const fe = document.getElementById('fEffort').value, fs = document.getElementById('fState').value;
  const list = document.getElementById('list'); list.innerHTML = '';
  let shown = 0, lastTheme = null;
  for (const it of DATA.items) {
    const d = decision(it.id);
    if (ft && it.theme !== ft) continue;
    if (fv && it.value !== fv) continue;
    if (fe && it.effort !== fe) continue;
    if (fs === 'u' && d) continue;
    if (fs && fs !== 'u' && d !== fs) continue;
    if (q && !(it.id + ' ' + it.title + ' ' + it.kind + ' ' + it.body).toLowerCase().includes(q)) continue;
    if (it.theme !== lastTheme) {
      const t = themeName[it.theme] || { name: it.theme, scope: '' };
      const h = document.createElement('h2'); h.className = 'theme'; h.textContent = t.name; list.appendChild(h);
      if (t.scope) { const p = document.createElement('p'); p.className = 'scope'; p.textContent = t.scope; list.appendChild(p); }
      lastTheme = it.theme;
    }
    const el = document.createElement('section'); el.className = 'item';
    el.innerHTML = `<div class="head"><span class="id">${esc(it.id)}</span><span class="title">${esc(it.title)}</span></div>
      <div class="meta"><span class="chip">${esc(it.kind)}</span><span class="chip ${it.value}">value: ${esc(it.value)}</span><span class="chip">effort: ${esc(it.effort)}</span></div>
      <div class="body">${render(it.body)}</div>
      <div class="decide"><button class="y">Yes</button><button class="n">No</button>
      <input class="note" placeholder="Note (optional)" value="${esc((state[it.id] && state[it.id].note) || '')}"></div>`;
    el.querySelector('.head').onclick = () => el.classList.toggle('open');
    el.querySelector('.y').onclick = () => setDecision(it.id, 'yes', el);
    el.querySelector('.n').onclick = () => setDecision(it.id, 'no', el);
    el.querySelector('.note').oninput = e => { state[it.id] = state[it.id] || {}; state[it.id].note = e.target.value; save(); };
    if (openAll) el.classList.add('open');
    paint(el, it.id); list.appendChild(el); shown++;
  }
  if (!shown) list.innerHTML = '<p class="empty">No items match.</p>';
}
let openAll = false;
document.getElementById('openAll').onclick = e => { openAll = !openAll; e.target.textContent = openAll ? 'Collapse all' : 'Expand all'; draw(); };
for (const id of ['q', 'fTheme', 'fValue', 'fEffort', 'fState']) document.getElementById(id).addEventListener('input', draw);

const dlg = document.getElementById('dlg'), area = document.getElementById('dlgArea');
function openDlg(text, value, canApply) {
  document.getElementById('dlgText').textContent = text; area.value = value;
  document.getElementById('dlgApply').style.display = canApply ? '' : 'none';
  dlg.showModal();
}
document.getElementById('export').onclick = () => {
  const lines = [];
  for (const it of DATA.items) {
    const s = state[it.id] || {};
    if (!s.d && !s.note) continue;
    lines.push(`${it.id} ${s.d || '?'}${s.note ? ' - ' + s.note.replace(/\s+/g, ' ') : ''}`);
  }
  openDlg('Your decisions, one per line. Copy them and paste them back to Claude.', lines.join('\n'), false);
};
document.getElementById('import').onclick = () => openDlg('Paste decisions exported earlier ("S1 yes", one per line), then Apply.', '', true);
document.getElementById('dlgCopy').onclick = () => { area.select(); try { navigator.clipboard.writeText(area.value); } catch (e) { document.execCommand('copy'); } };
document.getElementById('dlgClose').onclick = () => dlg.close();
document.getElementById('dlgApply').onclick = () => {
  for (const line of area.value.split('\n')) {
    const m = line.trim().match(/^([A-Z]{1,2}\d+)\s+(yes|no|\?)(?:\s+-\s+(.*))?$/i);
    if (!m) continue;
    state[m[1]] = { d: m[2] === '?' ? '' : m[2].toLowerCase(), note: m[3] || '' };
  }
  save(); tally(); draw(); dlg.close();
};
tally(); draw();
</script>
</body>
</html>
