13", "theme": "PR", "title": "CALL tag: text computed by a script function", "kind": "JavaScript hook and presentation", "value": "medium", "effort": "small", "body": "**Today.** A computed value cannot be placed inside a description. `LOOK_PROG` is queued and runs a tick later. With `MPSETINTERNAL NODELAY true` it runs at once, but after the look, so it can only add text at the end. A `CNCLMSG_PROG` on the room runs before the look is shown and can `MPSET` the `DESCRIPTION` before each `LOOK`. That works, but it rewrites the stored text. `FUNCTION_PROG` with `RETURN` already exists in MOBPROG and JavaScript.\n\n**Add.** A `<CALL fname args>` tag in VARIES text. At once, it calls a `FUNCTION_PROG` or JS function in the scripts of the room, item, mob or area that holds the text, with `$n` as the viewer. What the function returns goes into the text. Results are cached for each look, with a time limit like the one JavaScript already has.\n\n**Example.** A well: \"The rope runs into the dark; the water is about `<CALL waterdepth>` feet below.\" `FUNCTION_PROG waterdepth` returns 30 minus 5 times `VAR(* BUCKETS)`.", "d": "yes", "note": ""}, {"id": "PR14", "theme": "PR", "title": "Script variables in the prompt, and world-defined score lines", "kind": "presentation", "value": "medium", "effort": "small", "body": "**Today.** Factions cover part of this:\n- a faction with `SCOREDISPLAY=TRUE` shows in `SCORE` (\"Your Renown : Feared\");\n- the prompt shows it with `%f` or `%F`;\n- `MPFACTION` changes it.\n\nThe prompt also has `%-STAT`, `%t`/`%T`, `%z`/`%r` and `%<CONFIGFLAG` sections. But factions are per character and numeric. No token shows a script variable or the time mode, and `SCORE` takes no free lines.\n\n**Add.** Five prompt tokens:\n- `%{VAR name}`, a global variable;\n- `%{PVAR name}`, the player's own variable;\n- `%{QVAR quest var}`;\n- `%{TIMEMODE}`, REAL or TURN;\n- `%{LEADER}`.\n\nA file, `world/score.txt`, holds lines added to `SCORE`. They use the prompt tokens plus VARIES, and a line that comes out blank is hidden. Builders who want per-character standings should use factions.\n\n**Example.** `score.txt` holds `Chapter : %{VAR CHAPTER}`. A second line uses VARIES to show `^rThe ash-mark burns on your palm.^N` while `CURSED` is 1. The prompt is `^h%hhp ^w[%{VAR CHAPTER}]^N>`.\n\n*See also:* PR20, PR21 (PR20's header templates and PR21's panel build on PR14's prompt tokens).", "d": "yes", "note": ""}, {"id": "PR15", "theme": "PR", "title": "LISTEN and TOUCH commands, with Prop_Senses", "kind": "property and presentation", "value": "medium", "effort": "small", "body": "**Today.** For smell, `SNIFF` with `Prop_Smell` works. `LISTEN` is only the thief skill `Thief_Listen`, and there is no `FEEL`. `TOUCH` is a stock social (`resources/socials.txt`) for mobs, room items and worn equipment, and `SOCIAL_PROG TOUCH` on the item or mob can answer it. It cannot target exits or untakeable items with no display text, and it shadows any `Prop_Socials` `TOUCH`. `Prop_Socials` can already add local commands to an area, room, exit or mob, or to an item for whoever carries it. For example: `NAME=LISTEN SRCCODE=S TGTCODE=S YOUSEE=\"Water drips ahead.\"`, with `TARGET=` and `MASK=`. These commands work in the dark, and `SOCIAL_PROG` lets a script set a tattoo. What is missing is built-in commands with fallbacks and one property for all the senses.\n\n**Add.** Commands `LISTEN [target]` and `TOUCH`/`FEEL target`. `Prop_Senses` on rooms, items, mobs and exits takes `SOUND=..;TOUCH=..;TASTE=..`. A `|` separates alternative texts, VARIES is allowed, and it accepts `CHANCE=` and `SETVAR=` or `TATTOO=` on first use. `LISTEN` in a room with no `SOUND` falls back to the room's sound emotes. All of it works in the dark. The clashes with `Thief_Listen` over the word `LISTEN` and with the stock `TOUCH` social must be settled.\n\n**Example.** A dark vault door: `Prop_Senses TOUCH=\"Under your fingers, a ring of nine raised studs; the third is loose.\" TATTOO=FOUND_STUD`.\n\n*Note.* `TOUCH` is already a stock social that `SOCIAL_PROG` can answer, and a room's `LISTEN` can be added with `Prop_Socials` (see *Already possible* in the README). What this item adds is built-in commands with fallbacks and one property for all the senses.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "PR16", "theme": "PR", "title": "In-game help for VARIES and the description tags", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** `<VARIES>` is documented only in `guides/ArchonGuide.html`. No `resources/help/*.ini` entry mentions it, so a builder in the game cannot look up the tags or the `MASK` syntax. Zapper masks do have in-game help (`AHELP ZAPPERMASKS`, from `resources/help/zappermasks.txt`).\n\n**Add.** Entries `VARIES`, `DESCRIPTION_TAGS` and `ROOM_TEXT` in `resources/help/arc_misc.ini`. They cover:\n- every tag, `<ELSE>` toggling the last tag, and nesting;\n- `MASKn` with `-IF \"VAR(...)\"` and `-QUESTWIN`, and `&gt;` for `>`;\n- the trap that a lone `+IF` always passes;\n- the `FROMUNKOWN` spelling;\n- a link to `ZAPPERMASKS`, and examples ready to copy.\n\nUpdate them as new tags arrive (`IFVAR`, `FIRSTVISIT`, `CALL`). This is a data change only.\n\n**Example.** `AHELP VARIES` shows the tag table and three examples ready to copy. One of them is the bridge text that changes after `MPSETVAR * BRIDGE 1`.\n\n*See also:* PR1, PR2 (PR1's and PR2's new VARIES tags need PR16's VARIES help); DT17 (Both deal with the FROMUNKOWN tag spelling (document it vs add FROMUNKNOWN as an alias)).", "d": "yes", "note": ""}, {"id": "PR17", "theme": "PR", "title": "Named colour aliases", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** Builders write raw codes such as ^y or ^##C8A060 into every lore line, inscription and whisper, so restyling means editing every description. The engine's semantic codes can be remapped in one line, with COLORSCHEME in the ini or by the player with COLORSET. Several are unused in single player: ^x, ^X and ^Z (IMPORTANT1 to 3), ^Q and ^q (channels), ^t (TELL) and ^z (DING). A world can repurpose them now, for example ^x for lore and ^Z for danger. But the set is fixed and the letters carry no meaning.\n\n**Add.** A COLORALIASES setting in the ini or the world: `COLORALIASES=LORE=##C8A060,DANGER=LIGHTRED+BOLD,WHISPER=DARKGREY,MAGIC=LIGHTPURPLE`. Any text then uses `^{LORE}...^N`. COLORSET lists the aliases so the player can change them, and they are stripped when ANSI is off.\n\n**Example.** Every inscription is written `^{LORE}...^N`. The lore colour changes in one line.", "d": "yes", "note": ""}, {"id": "PR18", "theme": "PR", "title": "Prop_ShowWhen: things only some viewers see", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** Prop_ClosedSeason hides a mob or item only by time, season or weather, and it checks its mask on the hidden thing, not on the viewer. Exits can be closed, not hidden. There are workarounds. An invisible ghost can be seen with see-invisible from Prop_UseSpellCast2(Spell_DetectInvisible) on a drink or Prop_WearSpellCast on an amulet. Prop_Hidden or the Semi-Hidden flag lets Search find a thing. MPHIDE and MPUNHIDE work from a script (they are global, which is fine in single player). None of these decides by a mask on the viewer.\n\n**Add.** Prop_ShowWhen, with `MASK=` (a zapper mask on the viewer), `CHECK=ROOMPLAYERS|ANYPLAYER|HOST`, `WHEN=` (a VARIES code or mask) and `HIDEMODE=UNSEEN|HIDDEN` (Search can find a HIDDEN host). The mask is checked against the player characters present. Until it passes, the host cannot be seen or touched, and an exit cannot be passed.\n\n**Example.** The seer's tea carries Prop_TattooAdder SPIRITSIGHT. The ghosts and a spectral stair north in the old tower carry `Prop_ShowWhen MASK=\"-TATTOO +SPIRITSIGHT\"`. After the tea, the player sees them.", "d": "yes", "note": ""}, {"id": "PR19", "theme": "PR", "title": "Map items that reveal and mark rooms", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** BardMap's readable text can be a semicolon list of room IDs (Area#1;Area#2;...), and reading it draws only those rooms. So a map of just the smugglers' coves works now. GenMap draws whole areas. Both draw the raw room title, cut to 24 characters in 6-character box lines, and VARIES is not applied. A map cannot mark a spot, and reading one teaches the character nothing for later.\n\n**Add.** Prop_MapReveal on readable items, with `ROOMS=Area#1-40` or `AREA=name`. On READ it adds the rooms to a set of known rooms on the character, saved like visited rooms. A MAP command (a separate item) shows them dimmed. `MARK=Area#12:X:\"Buried chest\"` puts a labelled glyph on that room. StdMap switches to displayText(viewer), so VARIES titles show.\n\n**Example.** Reading a torn treasure map adds the smugglers' coves to the player's MAP, with a red X on cove 3.\n\n*See also:* PR9 (PR19's revealed rooms are shown by PR9's MAP command).", "d": "yes", "note": ""}, {"id": "PR20", "theme": "PR", "title": "Room header and footer templates", "kind": "world option", "value": "low", "effort": "small", "body": "**Today.** The first line of a look is hard-coded: ^O, then the room title from displayText(mob), then the disposition notes. Only its colour can change, through ROOMTITLE in COLORSCHEME or with COLORSET. The ini has no header or footer template, and the area name shows only in the prompt, as %z. So a world cannot show the area, a region tag or a danger marker beside the title. Nor can it add a fixed footer, such as the time of day outdoors.\n\n**Add.** ROOMHEADER and ROOMFOOTER settings in the ini or the world. They use the prompt token engine plus VARIES, for example `ROOMHEADER=^O%r^N ^w[%z]^N`. An empty setting gives today's output.\n\n**Example.** `ROOMHEADER=^O%r^N ^k(%z)^N` gives \"Market Square (Old Vael)\".\n\n*See also:* PR14, PR21 (PR20's header templates and PR21's panel build on PR14's prompt tokens).", "d": "yes", "note": ""}, {"id": "PR21", "theme": "PR", "title": "Side panel in the character windows", "kind": "presentation", "value": "low", "effort": "medium", "body": "**Today.** The Swing character windows (CharacterWindow) hold only a scrolling text pane and an input line. PLAN 5e names health bars, the party and a map as later work, but nothing is defined, and a builder cannot choose what a panel shows. What would feed a panel already exists: the minimap (getMiniMap in Skill_RegionalAwareness) and the prompt token engine.\n\n**Add.** A side panel, turned on by `WINDOWPANEL=STATUS,MAP,PARTY` in the ini or by `WINDOWS PANEL ON`. STATUS is drawn from world/text/panel.txt with the prompt tokens and %{VAR}. MAP is the minimap of the window's character, redrawn on each move. PARTY shows hit-point bars for the party. The panel refreshes with the prompt.\n\n**Example.** panel.txt holds `%r / %z`, `HP %h/%H` and `Chapter %{VAR CHAPTER}`, with the map below.\n\n*See also:* PR14, PR20 (PR20's header templates and PR21's panel build on PR14's prompt tokens).", "d": "", "note": "Maybe, not sure yet"}, {"id": "S1", "theme": "S", "title": "Quest state that survives SAVE and RESTORE", "kind": "quest feature", "value": "high", "effort": "small", "body": "**Today.** The save keeps a quest's name, winners, step, time left and quest mobs and items (`WorldState.questsXML`). It loses `MPQSET` variables (read with `QVAR`), the wait of a quest not yet running (so reloading rerolls it), whom `Prop_QuestGiver` already offered to, `QuestChat`'s said-once lines, and which ONCE_PROGs a SAVABLE personal quest script has already run, so those run again. `MPSETVAR` variables already survive: quest scripts use the quest name as their var scope, and every VARSCOPE table is saved.\n\n**Add.** The quest XML gets `<VARS>` (the quest's vars, without object stats) and, for quests not running, `<WAIT>`. `setQuests` puts them back after the step. `Prop_QuestGiver` keeps its offers as quest vars `OFFERED:<name>`. `QuestChat` reads back the `CHAT:<name>` vars it already writes. SAVABLE scripts save `<SONCE>` next to SSVAR: the ONCE_PROGs and QUEST_TIME_PROGs already run.\n\n**Example.** Each broken wall in 'Siege of Brenn' does `MPQSET * WALLS ++`, and step 2 starts at `QVAR(* WALLS >= 3)`. After two walls, a save and a restore, WALLS is still 2 and 'You have joined the siege' does not repeat.\n\n*See also:* Q7 (Both save which quests Prop_QuestGiver has offered (REOFFER offers vs OFFERED:<name> quest vars)); S7 (S1's SONCE (ONCE_PROGs already run in SAVABLE scripts) is S7's script-state save applied to player scripts); S9 (S1 moves Prop_QuestGiver offers and QuestChat lines into quest vars, which S9 says then need no STATE hook).", "d": "yes", "note": ""}, {"id": "S2", "theme": "S", "title": "Save rules: save points, no-save zones, no saving in combat, autosave", "kind": "world option, property", "value": "high", "effort": "small", "body": "**Today.** SAVE works anywhere and at any time, even mid-fight. `Save.execute` calls `SaveGame.save` directly and sends no message, so neither CNCLMSG_PROG nor a property can refuse it. A save made mid-fight keeps the boss's HP but not who is fighting whom, pending MPALARMs or behaviour state, so a reload quietly ends the fight. Autosave can be scripted today: an ENTRY_PROG that runs `mpforce $n save auto`, with a tattoo so it runs once.\n\n**Add.** `SAVEMODE=ANYWHERE|NOTINCOMBAT|SAVEPOINTS|IRONMAN`, chosen at new game and kept in the save header. `Prop_SavePoint` (room or area, `MSG=`) allows saving there under SAVEPOINTS. `Prop_NoSave` (room or area, `MSG=`) refuses saving there. NOTINCOMBAT refuses while any party member is fighting. `Prop_AutoSave` saves on entry (`ONCE=CHAR` or every entry, `SLOT=auto` or a rotating slot, `MSG=\"[Autosaved]\"`). `Save.execute` checks all of these before saving and says why it refuses.\n\n**Example.** The Sunken Temple has `Prop_NoSave MSG=\"The water's whispering drowns your thoughts.\"`, and only the shrine at its centre autosaves. Inns and campfires carry `Prop_SavePoint`.\n\n*See also:* ST6 (Both make SAVE refusable (a GAME_PROG SAVE returning cancel, or save rules), which needs one check in Save.execute); S23, C7 (Three autosave designs (Prop_AutoSave, AUTOSAVE=n, a checkpoint's SAVE=AUTO), and S23's CHECKPOINT command shares C7's name).", "d": "yes", "note": ""}, {"id": "S3", "theme": "S", "title": "world/world.ini for the settings that define the game", "kind": "world option, builder tool", "value": "high", "effort": "small", "body": "**Today.** Start, death and morgue rooms, the calendar, the starting kit, race and class rules and similar keys sit in `coffeemud.ini` beside the engine's own settings. `SUD.readSettings` reads only that file and the command line. A world can ship a wrapper such as `sud.sh START=Oasis#1 DEATH=Oasis#Shrine`, or a full ini selected with `BOOT=`, which replaces the whole file. No command edits ini keys, and `CREATE DISABLEFLAG` lasts only until restart. A world built for custom races breaks under someone else's ini.\n\n**Add.** Read `WORLDDIR/world.ini` after `coffeemud.ini` and before the command line, for a documented whitelist: `START*` (with `START_MASK`), `DEATH*`, `MORGUE*`, `STARTINGITEMS`, `STARTHP`, `STARTMANA`, `STARTMOVE`, `STARTSTAT`, `AWARERANGE`, the default `TIMEMODE`, calendar keys, race and class allow lists, currency, `CHARCREATIONSCRIPTS`, `DEITYPOLICY`, `FACTIONS`, `MUDTHEME`, `DISABLE`, `ENABLE`, `ADDCHARSTAT_*`, `REPLACECHARSTAT_*`, `NEWACODES`, `NEWDOMAINS`, `DEFAULTABILITYARGS`, `EXPRATE`, `FORMULA_*`, `LASTPLAYERLEVEL`, `MUD_NAME`, `INJURYSYSTEM` and `MANACOST`. Other keys are reported and ignored. In builder mode, `WORLD SET key=value` writes the file and `LIST WORLDINI` shows each value in effect and where it came from. `world.sum` covers the file.\n\n**Example.** `MUD_NAME=The Ashen Reach`, `START=Emberfall#0`, `START_DWARF=Deepforge#12`, `DISABLE=STDRACES,STDCLASSES,AUTOAWARDS` and `HOURSINDAY=12`, committed with the areas.\n\n*See also:* S6, P10 (P10's world/rules.ini, S14 (now in S6)'s rules.ini and S3's world.ini are one world rule file).", "d": "yes", "note": ""}, {"id": "S4", "theme": "S", "title": "Riding kept in saves and world files", "kind": "save format", "value": "high", "effort": "small", "body": "**Today.** Area files write `MRIDE` for a mob riding something, and `CoffeeMaker` links it again through `mobRideTable`, so a placed mounted guard loads mounted. An owned vessel's team is hitched again from the character's tables. But `world.xml` records no riding for PLAYER, FOLLOWER, MOB or ITEM entries. A restore leaves the rower in the lake without the logboat, sets the rider down and unhitches the cart. Area XML has no `IRIDE`, so a builder cannot place a wagon that is already hitched to its oxen.\n\n**Add.** `RIDING=<index or name>` on the MOB, PLAYER, FOLLOWER and ITEM entries of `world.xml`. The links are made after everything is placed, as `mobRideTable` does. Add `IRIDE` to item XML in area files. Party members riding with the leader keep their places.\n\n**Example.** A trade road has a `GenCaravan` hitched to two oxen, ready to drive away. The player saves while galloping across a plain on a warhorse and is still mounted after the restore.\n\n*Re-checked against the code after writing: accurate.*", "d": "yes", "note": ""}, {"id": "S5", "theme": "S", "title": "SAVE keeps conquests", "kind": "save format", "value": "high", "effort": "small", "body": "**Today.** `Conquerable` writes the ruler, the previous ruler, the date and the clan items to CMPDAT (`CONQITEMS`), but only on shutdown or room reset. `declareWinner` writes nothing, and control points live only in memory. `SaveGame.save` writes the players, the clocks and `world.xml`, but it never asks legal behaviours to write their state, and QUIT saves before the shutdown write. A conquest made since the last reset is therefore lost.\n\n**Add.** At SAVE, every `LegalBehavior` writes its state: ruler, previous ruler, conquest date, control points per clan, revolt counters and clan items. The state goes into CMPDAT before the tables are copied, or into `world.xml`. RESTORE puts it back before ticks start. Law warrants get the same treatment if they are affected (see S12).\n\n**Example.** The party's Gray Company takes the bandit fort and saves. After a restore the fort is still theirs, with its control points, and the bandits have not quietly taken it back.\n\n*See also:* F3 (S5 saves the control points that F3's MPCONQUER changes); S12 (S5 says law warrants should be saved the same way as conquests, which is S12).", "d": "yes", "note": ""}, {"id": "S6", "theme": "S", "title": "A world/resources overlay for every data file", "kind": "world option, data file", "value": "high", "effort": "medium", "body": "**Today.** `Resources.makeFileResourceName` puts `resources/` in front of every path. So all of these sit among the stock files: Scriptable and quest `LOAD=`, `MPSCRIPT LOAD=`, `IMPORT MOBS`, RandomMonsters and RandomItems files, `movingroom.xml`, the generator entry points (`GENERATE FROM`, RandomQuests `PATH`, `GENERATIONFILEPATH`, `FROMGENFILE`), `FILE=` texts, chat files, help (`MUDHelp` lists `resources/help`), factions, recipes, achievements, titles, socials and the `text/` screens. The shipped `world/quests/holidays.quest` is only a `LOAD=` back into `resources/`. `CREATE HELP`, achievements and holidays write into `resources/`. In a normal game the same commands change it for good, and the building warning does not say so. Some routes exist, but each is partial: inline parameters and scripts, a quest's `<FILE>` blocks, `LOAD=\"/world/...\"` inside generator XML, a `LISTFILE` list, `PRIVATERESOURCES` (one file at a time), class-path lines that name `world/classes/`, and extension files `.2` to `.9` (in `resources/` only).\n\n**Add.** `WORLDDIR/resources/`, laid out like `resources/` and searched first, also by direct `CMFile` reads such as `CharCreation`'s. A file with a stock file's name replaces it, and `<name>.add` appends to it. World help files merge after the stock help. The world `lists.ini` joins `LISTFILE`. World translation and parser rules run before the stock ones, and `#STOCK OFF` drops the stock rules for a section. `WORLDDIR/classes/*` join the class paths at boot. `CHATDEFAULT=<file|NONE>` replaces the stock `chat.dat` default group. A recipe may name `CATALOG:name` as its result. In builder mode, the HELP, ACHIEVEMENT, TITLE, AWARD, FACTION, SOCIAL, HOLIDAY, EXPERTISE, COMPONENT and PLANE editors write here. In a normal game those editors are refused or kept in the save only, and the warning says which. Quest export keeps a quest's `world/quests/<name>/` folder with it. If WORLDCHECK and DEVWATCH are adopted, they cover the overlay, and WORLDCHECK lists files that shadow stock ones. These files are read from disk when used, so editing them needs no cache rebuild.\n\n**Example.** A world ships `progs/ferryman.script`, `help/lore.ini`, `factions/house_varn.ini`, `skills/blacksmith.txt.add` with three recipes, and `text/intro.txt`, all under `world/resources/`.\n\n**Also merged here, from S14 (Progression files and rule keys that travel with the world).** `world/rules.ini` overlays a whitelist of these rule keys. World copies of `achievements.ini`, `titles.ini`, `awards.txt`, `factions/*.ini`, `skills/allqualifylist.txt`, `skills/expertises.txt`, `lists.ini` (merged key by key, as `LISTFILE` already allows), `text/*.txt` and `classes/*.js` (loaded automatically) override the stock ones. Builder-mode editors write the world copies, as `PRIVATERESOURCEPATH` already makes them do for listed files. They need not count in `world.sum`, since they are not cached in the database. This part is the list of progression files and keys that S6 and S3 must cover, and `rules.ini` is the same file as `world.ini`.\n\n*See also:* JS5 (Two ways to keep scripts and JS classes in world/: JS5's world: prefix and world/js class folders, or S6's overlay and WORLDDIR/classes); L9, S20 (Three designs for world socials and dropping stock ones (vocab/socials files, the world resources overlay, DISABLE=STDSOCIALS)); L14 (Both load world help after the stock files and point the help editors at the world (vocab/help vs world/resources/help)); S3, P10 (P10's world/rules.ini, S14 (now in S6)'s rules.ini and S3's world.ini are one world rule file).", "d": "yes", "note": ""}, {"id": "S7", "theme": "S", "title": "Script engine state in the save: ONCE, TIME, DAY, DELAY, alarms, local variables", "kind": "script trigger, save format, debug tool", "value": "high", "effort": "medium", "body": "**Today.** A restore builds every script engine from scratch. ONCE_PROG fires again, TIME_PROG and DAY_PROG can fire twice in the same hour, and DELAY_PROG countdowns, pending MPALARMs and MPNOTRIGGER cooldowns are lost, because `oncesDone`, `lastTimeProgsDone`, `lastDayProgsDone`, `delayTargetTimes`, `que` and `noTrigger` are kept in memory only. INDIVIDUAL-scope variables (`MPSETINTERNAL SCOPE *`, `MPSCRIPT INDIVIDUAL`) on NPCs, items and rooms are also lost, though the guide says they are saved. `getLocalVarXML` exists, but `WorldState` never calls it. The idiom that works today is to guard the body with a saved variable: `IF VAR($i DONE == 1)` ... `MPSETVAR $i DONE 1`. It fails for objects that share a name.\n\n**Add.** A `<SCRIPTSTATE>` in `world.xml` for each scripted mob, item and room. It holds the local variables, which ONCE_PROGs and QUEST_TIME_PROGs are done, when each TIME_PROG and DAY_PROG last fired, the DELAY countdowns, queued MPALARMs (trigger, line, and source and target by name or room ID) and the cooldowns, with times as game time left. It is keyed by a hash of the script text, so editing a script drops its stale state. It is restored before the first tick. ONCE_PROG then means once per game, and `ONCE_PROG BOOT` means once per load. `SAVES CHECK` lists what a save would not keep: summoned mobs without a leader, space objects, and unsavable hosts with scripts. The guide documents the idiom and drops the wrong line.\n\n**Example.** The throne room's ONCE_PROG loads the lich king and echoes 'The crypt doors slam shut!'. The player kills him, saves and restores. The doors do not slam again and the lich stays dead.\n\n*See also:* ST24 (ST24 wants its saved next-fire time to share S7's saved script state (ONCE, DELAY, alarms)); SC4 (S7 saves the INDIVIDUAL-scope variables that SC4 says a save drops; SC4's per-object store is the other answer to the same loss); SC7 (SC7's saved pending waits and S7's saved queued alarms belong in one script-state section of the save); S1 (S1's SONCE (ONCE_PROGs already run in SAVABLE scripts) is S7's script-state save applied to player scripts); C5 (Both save pending MPALARMs (C5's named alarms, S7's queued alarms)).", "d": "yes", "note": ""}, {"id": "S8", "theme": "S", "title": "Generated quests survive save and restore", "kind": "quest feature, generator", "value": "high", "effort": "medium", "body": "**Today.** `RandomQuests` marks each quest it makes as a copy (`setCopy(true)`), and both `questsXML` and `setQuests` skip copies. On RESTORE the quest is gone, and `getPlayerPersistentQuests` ends and deletes the player's accepted script as an orphan. `Prop_QuestGiver QUEST=\"GENERATE:...\"` keeps its quest only in a field, so it generates a different one. A quest made with GENERATE QUEST in a normal game is lost as well: it is not in the content, so the restore skips it. PLAN 4d lists only spawned copies of spawnable quests as a known gap.\n\n**Add.** The save's `<QUESTS>` holds each quest made at run time with a `GENERATED` flag, its script text, its generator vars, its host (the mob or area that offered it), its step, its time left, and its quest mobs and items. RESTORE rebuilds and starts these quests from their scripts, then applies their state. `RandomQuests` and `Prop_QuestGiver` take them back by name instead of generating new ones.\n\n**Example.** Elder Maren's generated quest 'Kill 6 marsh trolls' is still active after a restore, at 4 of 6.\n\n**Also merged here, from CR23 (Craft orders: RandomQuests orders that survive saves).** No new CraftOrders behaviour. Instead, save and restore RandomQuests quests with the game. Document the `source_faction` and `source_faction_amt` variables. Optionally add an order target by recipe name that ignores the material.\n\n*See also:* Q14, G2 (Q14's quest board needs G2's RandomQuests fix and S8's saved generated quests).", "d": "yes", "note": ""}, {"id": "S9", "theme": "S", "title": "A save hook for behaviour state: contracts, bribes, routes, dialogue", "kind": "behaviour, save format", "value": "high", "effort": "medium", "body": "**Today.** The save keeps a mob's `TEXT` (its behaviour parameters), stats, HP, inventory and effects, but not the state its behaviours build up while running. A restore loses all of it. A `Hireling` loses its contract (`workingFor`, `onTheJobUntil`, `partials`); with `onTheJobUntil` at 0 its tick returns at once, so it follows for free forever. Also lost: `Aggressive` bribes, a `BribeGateGuard` tab, a `Patroller` step, `MOBEater`'s stomach, `Emoter`'s expiry, `MudChat` group switches, the lines `QuestChat` has said, the offers `Prop_QuestGiver` has made, and the LLM's memory. `StdBehavior` has only the CLASS and TEXT stats. A Scriptable NPC can keep a contract in a timed tattoo, but the built-in behaviours cannot.\n\n**Add.** `getStat(\"STATE\")` returns the runtime state of a behaviour or property, and `setStat(\"STATE\", xml)` takes it back. The `StdBehavior` default is empty. `WorldState` writes `<BSTATE ID=...>` on saved mobs, items and rooms, with times as game time left, and restores it after load. Implement it for Hireling, Aggressive, BribeGateGuard, Patroller, Decay, Emoter, Concierge, Taxi, Nanny, MOBEater, MudChat (groups per speaker), QuestChat, Prop_QuestGiver and the LLM session (the last N exchanges, replayed as context). New behaviours (Schedule, Companion, BossPhases, Morale) must have it. State that S1 moves into quest vars needs no hook.\n\n**Example.** Hire a sellsword for 2 game hours, save after one hour and restore. He says 'I've still got an hour on your coin' and leaves when the hour runs out.\n\n*See also:* N11 (N11's per-speaker MudChat groups are saved through S9's behaviour STATE hook); N21 (N21's saved Hireling contract is S9's Hireling STATE); N26 (later) (N26 (later)'s saved LLM transcript is S9's LLM session state); S17, T16 (T16 saves MovingRoom's position, which S17 assigns to S9's STATE stat); DT19 (S9's getStat(STATE) and DT19's getStat(DEBUG) both expose a behaviour's runtime state; design them together); S1 (S1 moves Prop_QuestGiver offers and QuestChat lines into quest vars, which S9 says then need no STATE hook).", "d": "yes", "note": ""}, {"id": "S10", "theme": "S", "title": "Templates, NPC clans, cron jobs, board posts and VFS files in world/", "kind": "world option, builder tool", "value": "high", "effort": "medium", "body": "**Today.** Only the content tables become world files and reach a new game: areas, rooms, exits, room mobs and items, custom races, classes, abilities and commands, and quests. Builder templates are kept in CMPDAT, NPC clans in CMCLAN, `CREATE CRON` jobs and notice-board posts in CMJRNL, and files written with SHELL `::` in CMVFS. A new normal game starts with all of these empty. They live only in the cache, which is not in git, and EXPORT has no option for clans, journals or templates. The only workaround is a script that makes them again at game start.\n\n**Add.** `WorldFiles` writes and reads four more kinds of file. `world/templates.cmare` holds all templates, shared, not tied to a builder's name. `world/clans.cmare` holds clans with no player members. `world/journals/NAME.xml` holds journals named by a world `StdJournal` item, plus `SYSTEM_CRON`. `world/vfs/...` holds one file per VFS entry. `exportAll` writes them, the rebuild imports them, and a new game copies them in as content. Saves then add to them.\n\n**Example.** The builder writes five lore posts on the town notice board and creates an 'Orc Horde' clan that conquers the Plains. A new game has both.\n\n*See also:* I3 (Both put book and board pages in world/journals (seed text files vs journal XML)); F7, F18 (F7 and S10 both add world/clans.cmare, which F18's CREATE GUILD writes); P8 (Both use world/templates.cmare, for player templates and for builder templates); S21 (Both move CREATE CRON jobs into world/ (as the SYSTEM_CRON journal vs world/cron files on game time)).", "d": "yes", "note": ""}, {"id": "S11", "theme": "S", "title": "One file per custom object, with scripts beside it", "kind": "data file, builder tool", "value": "high", "effort": "medium", "body": "**Today.** All custom races, classes, abilities and commands sit in one file, `world/custom.cmare`. `GenAbility.getAllXML` escapes every field, so a script with `<SCRIPT>` JS blocks or `<` comparisons is stored as `&lt;` text that is hard to edit, diff or review. `LOAD=` in a GenAbility or GenCommand script reads from `resources/`, outside the world. Only quest scripts can use the quest file's embedded `<FILE>` sections.\n\n**Add.** `WorldFiles` writes and reads one file per object: `world/custom/races/<ID>.cmare`, and likewise under `classes/`, `abilities/` and `commands/`. A SCRIPT field longer than one line goes to a sidecar file, `<ID>.script` (or `<ID>.js` for pure JavaScript). The field refers to it as `SCRIPT=FILE:<ID>.script`, and the file is read raw, with no escaping. The old single `custom.cmare` is still read, and the checksum covers all these files.\n\n**Example.** `world/custom/abilities/Spell_Emberbrand.cmare` holds the fields and `Spell_Emberbrand.script` holds a readable 40-line script. A git diff shows which line of the spell changed.\n\n*See also:* S25 (Both make world files readable (scripts in sidecar files vs expanded CDATA)); B3 (B3's EXTRACT SCRIPT and S11's sidecar files both move inline scripts into their own files).", "d": "yes", "note": ""}, {"id": "S12", "theme": "S", "title": "Warrants, fines and criminal records in the save", "kind": "save format", "value": "high", "effort": "medium", "body": "**Today.** Warrants and old warrants (which mark repeat offenders) are lists kept in memory in `DefaultLawSet`, and fines are a table keyed by the MOB object. `world.xml` has no section for law, so a save and restore wipes a murder warrant or an unpaid fine. A punishment already under way survives, because Prisoner, Shaming and Banishment are timed effects and are saved with their remaining ticks.\n\n**Add.** A `<LAW>` section in `WorldState`, holding for each legal area: each warrant (criminal, victim, witness, crime, punishment, state, offence count, and last offence in game time), the old warrants, and the fines owed. They are restored once the characters are back. Fines are keyed again by character name, since the MOB objects are new.\n\n**Example.** The player kills a guard in Riverton and saves. After a restore the guards still hunt them, and the TaxCollector still demands the unpaid fine.\n\n*See also:* S5 (S5 says law warrants should be saved the same way as conquests, which is S12).", "d": "yes", "note": ""}, {"id": "S13", "theme": "S", "title": "World version in saves, a compatibility report and RESTORE ... FRESH=", "kind": "builder tool, debug tool", "value": "high", "effort": "medium", "body": "**Today.** A save does not record which world it was made with. After world edits, a restore silently drops the contents of rooms that no longer exist. A restore empties every room and rebuilds each saved mob and item from its saved TEXT. So mobs and items added since the save never appear in a long playtest save, and restored ones keep their old behaviours, properties and inline scripts. Only `LOAD=` scripts pick up edits. The workaround is a new game.\n\n**Add.** `header.properties` holds the world checksum and one checksum per area. Restoring a save from another world prints a report: areas changed, saved rooms missing and what was in them, mobs and items of unknown class, and quests gone or changed. `RESTORE name FRESH=CHANGED|area1,area2|ALL` takes the room contents of those areas from the current world. The player, what they carry, the party, quests and variables stay as saved, and quest-owned things are left to the quest. `SAVES` marks older saves '(older world)'.\n\n**Example.** After adding a quest-giver to the Tavern, `RESTORE act2 FRESH=Town` lets the 15-hour playtest save meet her.\n\n*See also:* S23 (Both show which world version a save was made with (a compatibility report vs SAVES INFO)).", "d": "yes", "note": ""}, {"id": "S15", "theme": "S", "title": "Vessels that save and restore exactly", "kind": "save format", "value": "high", "effort": "medium", "body": "**Today.** These faults come from reading the code; a run has not confirmed them yet. `WorldState.capture` writes a placed vessel's interior twice: once in the ship item's TEXT (`SSAREA`, with crew and cargo) and again as ROOM entries, because the room list includes ship interiors. Restore rebuilds the ship from its TEXT, then the ROOM entries add the same mobs and items again. A vessel the player bought or built is a room item in `world.xml` and also a row in the character's item table, so two ships can share interior room IDs. Course, anchor, facing and the ship followed are plain fields, and `anchorDown` starts true, so a ship under way stops. A builder cannot work around this.\n\n**Add.** Write the interior once: skip the ROOM entries for boardable areas, or build the ship empty and let the ROOM entries fill it. Leave out room items the character tables already save (owned boardables and titles). Add a `VESSEL` tag for each navigable item with `ANCHOR`, `COURSE`, `FACING`, `FOLLOWING` and `TICKSSINCEMOVE`, applied after the ship is rebuilt. The smoke test saves and restores a crewed ship under way.\n\n**Example.** 'The Gull' is a ferry with a captain and two sailors on a Patroller route. Saved mid-crossing and restored, it still has three crew and still sails for Port Azure.\n\n*See also:* T11 (Both deal with vessels whose interiors share room IDs (copies in T11, double-saved owned ships in S15)).", "d": "yes", "note": ""}, {"id": "S16", "theme": "S", "title": "Crops and crafts in progress survive a save", "kind": "save rule", "value": "high", "effort": "medium", "body": "**Today.** A planted crop is a Farming effect on the room; a craft in progress is an effect on the crafter. A save keeps only the effect's ID, TEXT, ticks and proficiency (WorldState.putEffects). CommonSkill's stat codes are TICKUP, PCTREMAIN and NAME, with nothing for Farming's crop item, room or good ticks, or CraftingSkill's buildingI. After a restore the crop fails at its sixth tick, and a craft ends with nothing though its materials were spent. SAVE does not check for activities in progress.\n\n**Add.** A CommonSkill stat code, ACTIVITYXML: the found or building item as XML, the activity room ID, tickUp, goodticks and the recipe line. WorldState.effectsXML writes it for common skills and putEffects reads it back. For skills that lack it, SAVE finishes or cancels personal crafting, refunds the materials, and says so.\n\n**Example.** The player sows moonwheat in the home garden, saves and quits. Next session they restore, wait a few game hours and harvest it.", "d": "yes", "note": ""}, {"id": "S17", "theme": "S", "title": "Rooms and areas changed in play survive saves", "kind": "save format", "value": "high", "effort": "large", "body": "**Today.** A save keeps room contents, door states, timed effects and area weather. The room tables are content, rebuilt from `world/` at boot. So RESTORE undoes `MPSET` of DISPLAY, DESCRIPTION, ATMOSPHERE or CLIMATE, `MPBEHAVE`, lasting properties from `MPAFFECT`, `MPLINK` exits, `FieryRoom`'s charred text and `Chant_Flood`'s atmosphere. It also undoes building in a normal game: a `Prop_RoomForSale` owner, new titles, walls, doors, lock keys and `Prop_RoomView`. Rooms made by STAIRS, EXCAVATE or lot expansion are unknown at boot, so their contents are skipped, and the lot, now unowned, gives the items on its floor expiry times. `TemporaryAffects` comes back with empty text. The workaround is to keep state in script variables and branch the text with `<MASK -IF \"VAR(...)\">` in VARIES.\n\n**Add.** At boot, fingerprint each room and area: title, description, class, climate, atmosphere, behaviours with their parameters, lasting effects and exits. Also mark rooms that play writes through `DBUpdateRoom`, `DBUpdateExits`, `DBCreateRoom` or `DBDeleteRoom`. SAVE writes a `<ROOMSHAPES>` section: the full room XML of each changed or created room, the area changes, and the IDs of destroyed rooms. RESTORE creates, replaces and deletes rooms and links exits before it puts contents back. S9's STATE stat covers `FieryRoom`'s burn ticks, `Emoter`'s EXPIRES and `MovingRoom`'s position, and `TemporaryAffects` saves its text. A character's start room that was built in play then still exists after a restore.\n\n**Example.** The burnt bandit camp stays 'A Charred Ruin', with the cellar exit made by `MPLINK`. A bought 'Millhouse' keeps its new rooms, its lock, its owner and the loot stored in it.\n\n*See also:* S9, T16 (T16 saves MovingRoom's position, which S17 assigns to S9's STATE stat); I13, W7 (I13's cleared blockages and W7's room states are kept through S17's room-delta save).", "d": "yes", "note": ""}, {"id": "S18", "theme": "S", "title": "Generated dungeons survive a save", "kind": "generator and save rule", "value": "high", "effort": "large", "body": "**Today.** In builder mode, GENERATE AREA output is ordinary content and goes to world/areas/*.cmare on SAVE or quit, so a dungeon baked while building persists. In play it does not. Rooms made by GENERATE, StdAutoGenInstance instances and AutoGrid children are written to the save, but WorldState.apply drops every saved room whose ID no longer exists. StdAutoGenInstance's OTHERVARS has PASSIVEMINS=<n> and NORESET=true, but neither survives a save.\n\n**Add.** A <GENERATED> entry in the save's world.xml for each generated area or room set: generator file, tag ID, variables, seed (from gen-seed), gate room and direction. On restore, regenerate each with its seed before room state is applied, so dead mobs, taken items and open doors match. PERSIST=true in OTHERVARS, reusing PASSIVEMINS, keeps one instance per party. The gen-seed reproducibility caveats apply.\n\n**Example.** A Shifting Mines entrance uses StdAutoGenInstance with PERSIST=true. The player clears half the mine, saves, quits and restores: same corridors, same dead goblins.\n\n*See also:* G1 (S18 regenerates generated areas from their seed on restore, and S18 and T13 (now in G1) both propose PERSIST=true for one instance per save).", "d": "yes", "note": ""}, {"id": "S19", "theme": "S", "title": "Instances and planes survive a save", "kind": "save rule", "value": "high", "effort": "large", "body": "**Today.** Saving inside an instance child (StdThinInstance, InstanceArea, StdAutoGenInstance) or on a plane stores the character's start room as the location (MOBloader), so a restore puts them at home. Party members keep the instance room ID in WorldState's PLAYER ROOM. Party.bringIn finds nothing there and leaves each one where they last were, so the party splits. Child rooms are written but dropped on restore: child names come from in-memory counters (instIDNum, instanceCounter, planeIDNum) and nothing re-creates a child. Dead bosses and opened chests are lost. Builders have no workaround.\n\n**Add.** Capture each live child in world.xml: name, parent area, instance or planar type ID and parameters, members, ticks left (childTimeout or DURATION), and the visited rooms. On restore, rebuild each child under the same name (the createRedirectArea or SubThinInstance path) before rooms are applied. Then save the real instance room as the location.\n\n**Example.** Midway through a Triumph run of the Sunken Crypt, the player saves and quits. On restore they stand in the same corridor. The lich's lieutenant is still dead and the timer still runs.\n\n*See also:* G1 (T13 (now in G1)'s ENTRY seed needs S19's saved instances, as T13 (now in G1) says); S22 (Both keep instance state across a restore (instance children vs entry limits)).", "d": "yes", "note": ""}, {"id": "S20", "theme": "S", "title": "Opt out of stock achievements, titles and socials; wildcard disables", "kind": "world option", "value": "medium", "effort": "small", "body": "**Today.** A custom world inherits about 1,200 stock achievements, the stock titles.ini and 338 socials. DISABLE has STDRACES, STDCLASSES and AUTOAWARDS (all awards.txt auto-awards, such as the monthly XP bonuses tied to stock classes; NPCAUTOAWARDS for NPCs only). RACE_, CHARCLASS_, ABILITY_, COMMAND_ and FACTION_ disable exact IDs. Only EXPERTISE_ takes a trailing *, so hiding a spell family means listing hundreds of IDs. Holidays are already content: deleting world/quests/holidays.quest turns them off. Classes keep stock spells from players, but scrolls, wands and NPC casters still use them.\n\n**Add.** DISABLE flags STDACHIEVEMENTS, STDTITLES and STDSOCIALS in world.ini. Each skips the stock file and keeps only the world's own. They need world/ to hold its own copies of those files, which is a separate item. Add wildcards to isAbilityDisabled, isCommandDisabled and isRaceDisabled, for example ABILITY_Spell_*.\n\n**Example.** A low-magic world sets DISABLE=STDACHIEVEMENTS,AUTOAWARDS,ABILITY_Spell_*,ABILITY_Chant_*. Its own 12 GenAbility rituals and its own achievements remain.\n\n*See also:* L9, S6 (Three designs for world socials and dropping stock ones (vocab/socials files, the world resources overlay, DISABLE=STDSOCIALS)).", "d": "yes", "note": ""}, {"id": "S21", "theme": "S", "title": "World cron jobs in files, on the game clock", "kind": "world option and data file", "value": "medium", "effort": "small", "body": "**Today.** CREATE CRON makes an interval script job. It goes in the SYSTEM_CRON journal, which is not a world content table, so it never reaches world/. CMJournals times it with System.currentTimeMillis, so it fires while the game is paused and ignores turn-based time. Game-clock events already work two other ways, both in world/: DAY_PROG and TIME_PROG on an area or room Scriptable, and quests in world/quests/ that repeat with SET WAIT and SET DURATION.\n\n**Add.** Either move CRON to the game clock and world files, or retire it and document the alternatives. Moving it means world/cron/<name>.cron files with INTERVAL in game time (\"1 day\", \"6 hours\", parsed by parseTickExpression), an optional MASK on the world state, and SCRIPT. They run on GameTime, and the save keeps each job's next run. In builder mode CREATE and MODIFY CRON write these files.\n\n**Example.** world/cron/market_day.cron fills the Emberfall market with travelling merchants every 7 game days. Today, DAY_PROG 1 8 15 22 on the area comes close.\n\n*See also:* ST24, JS19 (Three ways to run something on a game-clock interval that survives saves; ST24 also suggests moving cron to GameTime, which is S21); S10 (Both move CREATE CRON jobs into world/ (as the SYSTEM_CRON journal vs world/cron files on game time)).", "d": "yes", "note": ""}, {"id": "S22", "theme": "S", "title": "Save instance limits and planar visit timers", "kind": "save rule", "value": "medium", "effort": "small", "body": "**Today.** InstanceArea's LIMIT (for example 1/DAY) keeps its entry counters in the character's class variable map (getClassVariableMap), timed with GameTime.now(). DefaultPlayerStats never writes that map. Any restore, even of the same save, clears the counters, so the player can farm a once-a-day dungeon by reloading. The planar travel recentVisits map lives on the ability and is not saved either. It only raises difficulty for repeat visits within an hour, so it matters less.\n\n**Add.** Write the LIMIT counters into the character's saved data, either the playerstats XML or the profile's world.xml, and read them back on restore. As a minor follow-up, save recentVisits the same way.\n\n**Example.** A Triumph instance allows one run per game day. It stays locked after the player restores a save made after the run.\n\n*See also:* S19 (Both keep instance state across a restore (instance children vs entry limits)).", "d": "yes", "note": ""}, {"id": "S23", "theme": "S", "title": "Save tools: info, delete, copy, diff, checkpoints, autosave", "kind": "debug tool and world option", "value": "medium", "effort": "medium", "body": "**Today.** SAVE name, RESTORE name (or RESTORE=name at launch), SAVES and the save offer at QUIT exist, so a checkpoint is SAVE cp1. Each save is a folder saves/NAME/ with header.properties, world.xml and fakedb tables, so the file system can delete or copy one. In game nothing deletes, copies or describes a save (SaveSlots.delete is never called). There is no autosave. Comparing two runs means reading world.xml by hand.\n\n**Add.** SAVES INFO name shows the header, the party with levels and locations, the game date, running quests, script variable count, world version and dev flag. Add SAVES DELETE name (confirmed), SAVES COPY a b and SAVES DIFF a b (stats, inventory, variables, quests, rooms). CHECKPOINT rotates slots _cp1 to _cp3, and ROLLBACK restores the latest. AUTOSAVE=n (game minutes or ON-AREA-CHANGE) works with AUTOSAVEKEEP=3. tools/saveinspect.py prints a slot offline and can set a variable, hit points or position.\n\n**Example.** SAVES DIFF before-boss after-boss shows the boss script never set VAR Hero BOSSDEAD.\n\n*See also:* S2, C7 (Three autosave designs (Prop_AutoSave, AUTOSAVE=n, a checkpoint's SAVE=AUTO), and S23's CHECKPOINT command shares C7's name); S13 (Both show which world version a save was made with (a compatibility report vs SAVES INFO)).", "d": "yes", "note": ""}, {"id": "S24", "theme": "S", "title": "Space objects in world files and saves", "kind": "data file and save rule", "value": "medium", "effort": "medium", "body": "**Today.** Ships, stars, moonlets, asteroids and stations placed in space as items, not in a room, are not in world/ (planets and moons built as areas are, with their coordinates). WorldFiles exports areas, custom objects, the catalog and quests only, and PLAN 4f notes that a rebuild loses them. WorldState captures rooms, the interiors of every loaded ship included, docked or not, but not where anything in CMLib.space() is or how it moves. An unowned ship moving through space returns to its content position on restore. Only ships the player or a clan owns survive, with the character's or the clan's tables, through a SPACE.x,y,z room ID. This matters only for a science-fiction world.\n\n**Add.** Export the space contents to world/space.cmare and import it on rebuild: each object's XML with coordinates, speed, facing and interior. The save's world.xml gets a SPACE section with each unowned object's class, TEXT, coordinates, speed and direction, restored before the player logs in.\n\n**Example.** The builder places a derelict station orbiting the gas giant and a patrol cutter on its course. Both survive a rebuild and a save and restore.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "S25", "theme": "S", "title": "Readable world files and a world diff", "kind": "data file and builder tool", "value": "medium", "effort": "large", "body": "**Today.** In .cmare files a room's, mob's or item's own data (RTEXT, MTEXT, ITEXT: descriptions, behaviours, effects, scripts, Prop_ parameters) is entity-escaped XML on one line, and base stats are a pipe-separated PROP array. WorldFiles.layOut gives one tag per line only to the outer XML. Scripts already have a clean route: Scriptable with LOAD=progs/x.script keeps the script in its own file. Property and behaviour parameters have none, and Shell's COMPAREFILES is a plain text diff.\n\n**Add.** layOut expands RTEXT, MTEXT, ITEXT, EXDAT and CATADATA into indented child elements marked xml=\"1\", with inline scripts in CDATA. The reader escapes them back for CoffeeMaker, so old files still load. PROP can optionally be written as named attributes when it reads back exactly. The round-trip test stays. tools/worlddiff compares two revisions or folders of world/ by object: \"Town#12: description changed; mob baker: +Scriptable\".\n\n**Example.** The owner fixes a word in the baker's speech in town.cmare. The git diff is one line instead of a 4 KB escaped blob.\n\n*See also:* S11 (Both make world files readable (scripts in sidecar files vs expanded CDATA)); B2 (Both add a world diff (tools/worlddiff vs WORLD DIFF against the export)).", "d": "yes", "note": ""}, {"id": "B1", "theme": "B", "title": "SAVE ROOM HOME: save each mob into its own start room", "kind": "builder tool", "value": "high", "effort": "small", "body": "**Today.** `SAVE ROOM` saves every savable mob standing in the room, with no start-room check (`DBUpdateMOBs`), so a mob that wandered in from elsewhere is saved a second time. `clearDebri`, which runs first, destroys this room's own mobs that have wandered out, so a new mob that walked off is lost. `RESET ROOM` sends strays home but drops unsaved work. Mobs can already be kept still with `PAUSE AREA` or `CREATE DISABLEFLAG MOBILITY` (`DISABLE=MOBILITY` in coffeemud.ini), so no FREEZE command is needed.\n\n**Add.** `SAVE ROOM HOME`, the default in builder mode. Each mob is saved into its `getStartRoom()`, wherever it stands. Mobs whose home is elsewhere are left out and listed. This room's own wanderers are saved here, not destroyed.\n\n**Example.** A guard wanders from Gate#1 into the tavern as the builder types `SAVE ROOM` there. Today the next start has two guards. With HOME the guard stays saved at Gate#1, and the save reports \"skipped: the gate guard (home Gate#1)\".", "d": "yes", "note": ""}, {"id": "B2", "theme": "B", "title": "Protect hand edits: per-file checks, WORLD STATUS and WORLD DIFF", "kind": "builder tool", "value": "high", "effort": "small", "body": "**Today.** On `SAVE` and on quit, builder mode rewrites each world file whose generated text differs from the disk (`exportAll`, `writeOrDelete`). It never checks whether the file changed since boot, so a .cmare or .quest file edited by hand during the session is replaced by the older database copy. `writeFolder` deletes, without asking, any such file with no live object, even one just added by hand. `bootSum` covers the whole world, not each file. Only git guards this today.\n\n**Add.** Record each file's checksum at boot and after each export. A file changed on disk since then is not overwritten or deleted: the export goes to NAME.cmare.builder beside it, with the warning \"areas/castle.cmare was edited outside the game: WORLD RELOAD castle, or SAVE FORCE to overwrite\". `WORLD STATUS` lists files edited outside the game and files the next export would write or delete. `WORLD DIFF file` shows a line diff against what the export would write.\n\n**Example.** The builder fixes twenty descriptions in castle.cmare during a session, then saves a room. Today the fixes vanish. With this, `SAVE` warns, and `WORLD DIFF castle` shows the changed lines.\n\n*See also:* S25 (Both add a world diff (tools/worlddiff vs WORLD DIFF against the export)); DT3 (Both stop builder SAVE overwriting a world file that is not what was loaded, with SAVE FORCE to override); B5 (B5's WORLD RELOAD CHANGED works from B2's per-file checksums and WORLD STATUS); B6 (Both change how exportAll overwrites and deletes world files (refuse vs back up)).", "d": "yes", "note": ""}, {"id": "B3", "theme": "B", "title": "Multi-line editing of scripts and descriptions", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** Behaviour parameters (an inline Scriptable script among them), descriptions (`genDescription`) and the GenAbility and GenTrap SCRIPT fields (`promptStatStr`) are one-line prompts, with ';' and '~' separators. The line editor (`CMJournals.makeMessage`, through `promptStatMsg`) serves only GenCommand. It labels its SCRIPT field \"Help Text\" and wants a literal FUNCTION_PROG EXECUTE line, so a script that is only `LOAD=progs/x.script` is refused. The usual workaround is a file in resources/progs attached with `LOAD=`.\n\n**Add.** Use `promptStatMsg` for Scriptable parameters, long descriptions, quest scripts and every SCRIPT field. Label GenCommand's field \"Script\", expand `LOAD=` (`parseLoads`) before its check, and show parse errors on save. `EDIT SCRIPT <target> (N)` opens the Nth script, `EDIT DESC <target>` the description. Optional `EDITOR=WINDOW` (a Swing text area) or `EDITOR=EXTERNAL` ($EDITOR on a temporary file). `EXTRACT SCRIPT <target>` moves an inline script to progs/NAME.script (in the world folder once it holds scripts) and replaces it with `LOAD=`.\n\n**Example.** `EDIT SCRIPT the innkeeper` shows the 30-line greeting script line by line. `.r 12` replaces line 12 and `.s` saves. `EXTRACT SCRIPT` then lets the other innkeepers share it.\n\n*See also:* S11 (B3's EXTRACT SCRIPT and S11's sidecar files both move inline scripts into their own files).", "d": "yes", "note": ""}, {"id": "B4", "theme": "B", "title": "Track unsaved changes: LIST UNSAVED, SAVE CHANGED, warning on quit", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** `CREATE`, `MODIFY` and `DESTROY` of mobs and items, and `TRANSFER`, change only the live room. World files are written from the database copy (`getRoomXML`), so anything not followed by `SAVE ROOM` is lost on `SAVE` or quit. `GMODIFY` with `CHANGE=` resets each live room first, dropping unsaved work. `SAVE ROOM` reports the count change, `SAVE AREA` saves a whole area and `LIST CONTENTS` shows what the files will get. Nothing lists which rooms differ.\n\n**Add.** Mark a room dirty when a building command (Create, Modify, Destroy, Copy, Transfer, Restring, Every, MQL UPDATE) touches it or its contents. `LIST UNSAVED` shows each such room, what changed and +N/-N counts (`DBCountRoomMobsItems`). `SAVE CHANGED` saves exactly those rooms. QUIT, plain `SAVE` and `GMODIFY CHANGE=` warn first. Optional `BUILDERAUTOSAVE=1` saves after each command. A prompt code `%U` shows the count.\n\n**Example.** The builder creates a blacksmith and two anvils in Town#12 and quits. QUIT asks \"1 room has unsaved mobs/items: Town#12 (+1 mob, +2 items). Save them first? (Y/n)\".\n\n*See also:* B6 (Both record each building command's change (dirty rooms vs an undo log)); B8 (B8's exit and area changes mark rooms dirty for B4's SAVE CHANGED).", "d": "yes", "note": ""}, {"id": "B5", "theme": "B", "title": "WORLD RELOAD of areas, scripts, quests and the catalog, and DEVWATCH", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** World files are read at boot only. `LOAD AREA` reads the database cache, not the file. `IMPORT NOPROMPT /world/areas/castle.cmare` rebuilds an area from its file and relinks other areas' exits, but leaves the builder outside. `UNLOAD FILE progs/x.script` clears a parsed script. `MODIFY QUEST name STOP` then `START` rereads a `LOAD=` target, but not the world/quests/*.quest file. catalog.cmare cannot be imported: WorldFiles writes a layout IMPORT does not read.\n\n**Add.** `WORLD RELOAD`, a front end over these. `AREA name` moves the builder out and back and keeps the new checksum. `SCRIPT file|ALL`, with `RESET` to clear script state. `QUEST name` or `QUESTS` stops the quest, rereads the .quest file and its `LOAD=` target, and restarts it. `CATALOG` reloads in place. `CHANGED` does every file `WORLD STATUS` lists as edited. In a normal game it saves to a temporary slot and restores it. `DEVWATCH ON` polls world/ and resources/ every few seconds and runs the matching reload, noted in DEVLOG.\n\n**Example.** The builder replaces \"Lord Varn\" with \"Lady Varn\" across castle.cmare in an editor, types `WORLD RELOAD castle`, and sees the change in the throne room at once.\n\n*See also:* JS10 (Both reload changed files in the running world and add an automatic file watch (JS WATCH, DEVWATCH)); B2 (B5's WORLD RELOAD CHANGED works from B2's per-file checksums and WORLD STATUS); DT2 (Both reload a quest from its world/quests file and LOAD= targets and restart it).", "d": "yes", "note": ""}, {"id": "B6", "theme": "B", "title": "UNDO, HISTORY and backups of world files", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** There is no undo. A wrong `MODIFY`, `DESTROY`, `COPY` or `GMODIFY CHANGE=` is permanent once saved, and `GMODIFY` only writes to Log.sysOut. `writeOrDelete` and `writeFolder` overwrite or delete world files in place, with no backup, so a destroyed area's file goes on the next `SAVE`. `RESET ROOM` or `RESET AREA` reverts unsaved live changes only. Git covers only committed states.\n\n**Add.** Before a building command changes an object, its XML (`getMobXML`, `getItemXML`, `getRoomXML` with content, exit XML) goes into an undo log of the last 50 actions, in memory and in world/.history/. `UNDO (n)` puts changes back. `HISTORY` lists them (\"MODIFY MOB the guard @Gate#1\"). `exportAll` copies each file it overwrites or deletes to world/.backup/NAME.TIMESTAMP, keeping the last N, with `WORLD BACKUPS` and `WORLD RESTOREFILE name (timestamp)`.\n\n**Example.** The builder runs `gmodify area class=genmob change=level=30`, meaning only the guards, and the whole town is level 30. `UNDO` puts all 40 mobs back as they were.\n\n*See also:* B2 (Both change how exportAll overwrites and deletes world files (refuse vs back up)); B4 (Both record each building command's change (dirty rooms vs an undo log)).", "d": "yes", "note": ""}, {"id": "B7", "theme": "B", "title": "Effects editor: edit in place, filtered list, duplicates", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** In the effects field of `MODIFY` (`CMGenEditor.genAffects`), typing an existing ID removes it. Changing one parameter means removing the effect and adding it again, starting from the default text, not the current one. '?' lists every ability, highlighting those whose `canAffect` is true, and '?' at the parameters prompt shows the class's help. A second copy of the same Prop is silently ignored (`addNonUninvokableEffect`).\n\n**Add.** '=ID', or picking by number, edits that effect's parameters with the current text filled in. '-ID' removes it. '?P' lists only property classes (`Ability.ACODE_PROPERTY`) and misc effects that can affect this host, each with its one-line help. Adding an ID already present offers to wrap both copies in `Prop_MultiEffects`.\n\n**Example.** Raising a `Prop_WearAdjuster` from str+2 to str+3 becomes one edit: `=Prop_WearAdjuster`, change the 2, done.", "d": "yes", "note": ""}, {"id": "B8", "theme": "B", "title": "GMODIFY and MQL UPDATE for exits and areas", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** `GMODIFY` already changes and saves an area's own fields (`tryModfy`, `DBUpdateArea`), but it checks field names against mob, item and locale stat codes, so area-only fields may be refused. It has no loop over exits: GenDoor names and door messages cannot be found or changed. MQL can select EXITS and AREAS, but `MODIFY UPDATE:` saves only rooms, items and mobs, so exit and area changes are lost at the next start.\n\n**Add.** Exit stat codes and an exit loop in `GMODIFY`, saving with `DBUpdateExits`, as in `GMODIFY AREA class=GenDoor&&name=[ss]door change=name=[ss]stone door`. Area-only stat codes in its allowed fields. In the save step of `Modify.doMql`, Exit (`DBUpdateExits` on its room) and Area (`DBUpdateArea`), with the rooms marked dirty for `SAVE CHANGED`.\n\n**Example.** Every door in the dwarf hold should read \"stone door\" and get a new closed message. One `GMODIFY` on the area does it, and it is still there after the next start.\n\n*See also:* B4 (B8's exit and area changes mark rooms dirty for B4's SAVE CHANGED).", "d": "yes", "note": ""}, {"id": "B9", "theme": "B", "title": "Dig mode and BUILD PATH for fast room creation", "kind": "builder tool", "value": "medium", "effort": "small", "body": "**Today.** `CREATE ROOM <dir> <type>` takes a locale class or a builder template (`getBuilderTemplateObject`), whose title, description, behaviours, effects and contents are copied. `COPY <dir>` clones the current room (`COPY <roomid> <dir>` clones any room), and `COPY 5 <dir>` lays a straight chain of five linked copies in one command; `LINK` sets exits, and `GENERATE` builds from randareas XML. Still, a path that bends or changes room type takes a command per leg and a walk to its end, and one made from a locale class gets the placeholder '<Locale>-' and no description. An `ALIAS` with '~'-separated commands only approximates a path.\n\n**Add.** `BUILD DIG ON|OFF (TYPE=locale|template) (LINK=two-way|one-way)`: while on, moving where there is no exit creates a room of that type and links it. Plain `DIG` is taken by the player command (Commands/Dig.java). `BUILD PATH e,e,n,ne (TYPE=x) (NAME=\"A forest trail\") (DESC=\"...\")` lays out a chain in one command. New rooms are marked dirty or saved, and tagged TODO so `WORLD CHECK` lists them until edited.\n\n**Example.** `BUILD DIG ON TYPE=forestpath`, then e, e, n, n, ne: five linked rooms copied from the forestpath template, tagged TODO for their own descriptions later.\n\n*Re-checked against the code after writing: corrected.*", "d": "yes", "note": ""}, {"id": "B10", "theme": "B", "title": "MAP of an area, in the terminal and as HTML", "kind": "presentation", "value": "medium", "effort": "medium", "body": "**Today.** The LOOK mini-map shows a few rooms around the player (AWARERANGE, default 3), without room IDs. A GenMap item whose map-areas field (`RoomMap.setMapArea`) names an area can be READ to see the whole area laid out by `StdMap.placeRooms`, but with no IDs and no marks for problems. `LIST LINKAGES` gives the connections as text. The MUDGrinder map went with the web server; its GrinderFlatMap layout survives only in the archive.\n\n**Add.** `MAP (RADIUS n) (AREA) (IDS) (FLAGS)`: an ASCII map from `Skill_RegionalAwareness.getMiniMap` or StdMap's layout, with room-number labels and marks: > one-way exit, + locked door, @ exit to another area, s room with scripts, ! unreachable room. `EXPORT MAP area file.html` writes a static clickable map (names, IDs, exits) from the GrinderFlatMap layout and `getHTMLTable`. Optionally, a Swing window beside the character windows.\n\n**Example.** After `GENERATE` builds a 40-room maze, `MAP AREA IDS` shows that Maze#17 to #22 hang off a one-way exit. `EXPORT MAP` gives maze.html for planning the descriptions.\n\n*See also:* PR9 (Two MAP commands (a player map with fog of war vs a builder map with IDs), both clashing with Skill_Map's word).", "d": "yes", "note": ""}, {"id": "B11", "theme": "B", "title": "Macro files (RUNFILE) and a builder helper for JRUN", "kind": "script command and JavaScript hook", "value": "medium", "effort": "medium", "body": "**Today.** `ALIAS DEFINE key cmd1~cmd2` gives per-character macros with @x1 arguments. `MPRUN LOAD=macros/shop.script` runs a script's ONCE_PROG lines as the builder's own commands. `JRUN file.js args` offers only mob(), getParm(), getParms(), numParms(), toJavaString() and getCMType(); anything else needs `Packages.com.planet_ink...` boilerplate (see resources/examples/Lemming.js). There is no plain file of commands to replay, and no helpers for common building steps.\n\n**Add.** `RUNFILE name (args)` runs world/macros/NAME.cmd: one game command per line, $1..$9, $room and $area substituted, '#' comments, a `STOPONERROR` option and a summary of failed lines. JRUN gets a `builder` object: `room(id)`, `dig(dir, locale)`, `link(fromId, dir, toId)`, `create('mob', catalogName, roomId)`, `saveRoom(id)`, `forEachRoom(area, fn)` and `cmd('modify room name X')`, so generation scripts are short JS files in the world folder.\n\n**Example.** world/macros/shop.cmd creates a catalog shopkeeper, sets the shop type from $1, stocks three items from catalog category $2 and saves the room. The builder types `RUNFILE shop weaponsmith weapons` in each of four towns.\n\n*See also:* JS6 (B11's JRUN builder object and JS6's cm object both add helpers to the JRUN scope).", "d": "yes", "note": ""}, {"id": "B12", "theme": "B", "title": "SANDBOX scratch area and PREVIEW of catalog objects", "kind": "builder tool", "value": "low", "effort": "small", "body": "**Today.** `GENERATE NOSAVE` skips the database, but the area stays in the live world, is not marked unsavable, and can reach the world files. A StdAutoGenInstance area rebuilds its instance children from a randareas file on each entry, and `exportAll` skips those children, so one generator can be previewed that way. The editor's disposition list does not offer `PhyStats.IS_UNSAVABLE`, so a scratch area cannot be marked unsavable by hand.\n\n**Add.** `SANDBOX (ENTER|LEAVE|CLEAR)`: a builder-only area with a few empty rooms, marked IS_UNSAVABLE, which `exportAll` already skips. `GENERATE ... SANDBOX` puts results there. `PREVIEW <catalog or template name>` makes a temporary copy in the sandbox, shows LOOK, STAT, its equipment and shop list, and destroys it when the builder leaves.\n\n**Example.** The builder runs `GENERATE AREA maze_dungeon FROM randareas/example.xml areasize=30 SANDBOX` five times with different themes, walks each, then generates the chosen one into the real world.\n\n*See also:* G4 (Both preview generated content in a throwaway scratch area); DT17 (Both define a PREVIEW command (catalog objects vs conditional text)).", "d": "yes", "note": ""}, {"id": "B13", "theme": "B", "title": "AHELP BUILDING and a builder summary at login", "kind": "presentation", "value": "low", "effort": "small", "body": "**Today.** The only builder-mode help is in the SAVE entry of help.ini, and the login says only \"Builder mode makes you an Archon, with the in-game editors.\" Nothing tells a new builder that mobs and items need `SAVE ROOM`, that hand edits during a session are overwritten, where templates and JS approvals live, or how to check the world. guides/ArchonGuide.html explains saving mobs, but not BUILDER=1 or the world folder.\n\n**Add.** An `AHELP BUILDING` topic: create, `SAVE ROOM` or `SAVE CHANGED`, catalog and templates, `GMODIFY` and MQL, `IMPORT` and `GENERATE`, the world folder and what is not in it, `PLAYTEST`, `WORLD CHECK`, and existing aids (`MPUNLOADSCRIPT`, `IMPORT /world/areas/...`, `LIST CONTENTS`, `LIST LINKAGES`, `PAUSE AREA`, ERRMSGS=BOTH, JSCRIPTS=2, GenMap). At builder login, three lines: whether the world files loaded whole (`WORLD PROBLEMS`), unsaved rooms from last time, and \"AHELP BUILDING for the workflow\".\n\n**Example.** On a first start with BUILDER=1 the owner reads `AHELP BUILDING`. It says up front that a created mob must be saved with `SAVE ROOM`, the first trap most builders fall into.\n\n*See also:* DT3 (B13's builder login summary shows DT3's WORLD PROBLEMS).", "d": "yes", "note": ""}, {"id": "B14", "theme": "B", "title": "CHATDRAFT: LLM drafts of fixed NPC dialogue", "kind": "builder tool", "value": "low", "effort": "small", "body": "**Today.** In builder mode the `LLM <text>` command (needs LISTADMIN and an installed LLM) answers the Archon, with a session per character. A builder can paste an NPC's description, ask for MudChat entries in chat.dat syntax and copy them into a file by hand. MUDPercolator's LLM=\"true\" values serve random areas only. An LLM at play time would cost money, need the network and change from play to play.\n\n**Add.** `CHATDRAFT <mob> [topics...] [TO world/chat/<file>]` gathers the NPC's name, description, race, area and lore files, prompts the configured LLM, and writes a MudChat group, optionally with a .dlg skeleton. It shows a diff and asks before writing. `CHATDRAFT VARIANTS <file> <entry>` adds alternative replies to an entry. The result is plain data, so the game never needs the LLM at play time.\n\n**Example.** `chatdraft blacksmith weapons armor prices gossip to world/chat/riverford.dat` gives a blacksmith group of four entries, with three to five weighted replies each in his gruff voice, for the owner to trim.", "d": "no", "note": "later: moved to LATER.md"}, {"id": "DT1", "theme": "DT", "title": "VARS: list, set, clear and watch script variables", "kind": "debug tool and script function", "value": "high", "effort": "small", "body": "**Today.** No command lists script variables. `STAT <mob> SCRIPTS` shows them only for scoped engines on a mob's own scripts, so it is empty for the usual global scope. `LIST RESOURCES` shows the `VARSCOPE-*` keys but not their values. `JCONSOLE setVar` or `MPRUN mpsetvar` (after `mpsetinternal SCOPE GLOBAL`) changes one variable whose host and name you already know. `CREATE DEBUGFLAG SCRIPTVARS` only logs changes to mud.log.\n\n**Add.** A `VARS` command built on `getScriptVarSet`. `VARS LIST [scope|GLOBAL|QUEST name] [host] [mask]` lists scope, host, name and value, including the individual-scope stores of live engines. Also `VARS SCOPES`, `VARS SET host name value [SCOPE s]`, `VARS CLEAR host [name|*]`, `VARS WATCH host name` and `VARS UNWATCH` (each change reported with the host and script file), and `VARS DUMP file` to compare two runs. Add the script function `$%VARNAMES(host prefix)%`.\n\n**Example.** `VARS LIST * Hero QUEST_*` shows the hero's quest flags. `VARS SET Hero ACT 3` starts a playtest at the third act. `VARS WATCH * DRAGONMOOD` shows which script keeps resetting it.", "d": "yes", "note": ""}, {"id": "DT2", "theme": "DT", "title": "QUESTINFO and quest test controls", "kind": "builder tool and quest feature", "value": "high", "effort": "small", "body": "**Today.** `LIST QUESTS` shows only running, waiting or disabled. `Quest.getLastErrors` has no caller, and quest errors go to mud.log. Details can be dug out one at a time: `$%QVAR(bell STEPNUM)%` and `MOB_ROOMID` read the step and the mob's room; `MPRUN` with `mpstepquest`, `mpquestwin` or `mpqset` changes them; `JCONSOLE` can call the quest object. `MODIFY QUEST` STOP and START cannot restart at the current step, and STOP deletes an unscheduled quest.\n\n**Add.** `QUESTINFO <quest>` on one screen: state, step number and label, time and wait remaining, quest vars, the designated MOB, ITEM, ROOM, AREA and groups with room IDs, the objects it holds and the scripts, behaviours and effects it added, winners with status, and `getLastErrors()`. New `MODIFY QUEST` verbs: `STEP <n|label>`, `WIN <char> (OUTCOME w)`, `UNWIN <char>`, `RESETWINNERS`, `VAR <name> <value>`, and `RELOAD`, which re-reads `world/quests/<name>.quest` and its LOAD= files, clears the parsed-script cache and restarts at the current step.\n\n**Example.** `MODIFY QUEST bell STEP 4`, then `QUESTINFO bell` shows the ghost in Brenn#112 at 30 hp, WALLS=2, and the last error \"no mob found named drowned priest\".\n\n*See also:* B5 (Both reload a quest from its world/quests file and LOAD= targets and restart it); Q6 (DT2's MODIFY QUEST STEP <label> needs Q6's named steps).", "d": "yes", "note": ""}, {"id": "DT3", "theme": "DT", "title": "World load report, and no overwrite of partly loaded files", "kind": "debug tool", "value": "high", "effort": "small", "body": "**Today.** When a hand-edited world file names an unknown item class, ability or behaviour, `CoffeeMaker` logs \"Unknown ... skipping\" and carries on. `WorldFiles.importArea` still counts the file as loaded whole, so the next builder `SAVE` writes it back without the skipped object: a typo becomes lost data. `WorldFiles.report` prints only fatal problems. The rest is in mud.log, seen with `LIST LOG` or `ERRMSGS=BOTH`.\n\n**Add.** While `WorldFiles` imports, collect every CoffeeMaker and loader warning and error (unknown class or ability, aborted parse, bad exit target) with its file and room. Print a summary at startup and at the builder's first login, and list it with `WORLD PROBLEMS`. A file with skipped parts is not loaded whole: it is not rewritten until it is fixed and reloaded, or the builder confirms with `SAVE FORCE`.\n\n**Example.** The owner types `<ACLASS>Spell_Fireblal<\/ACLASS>` on a mage. At the next start builder mode says \"castle.cmare: unknown ability Spell_Fireblal on the court mage (Castle#14), skipped; this file will not be rewritten until fixed.\"\n\n*See also:* B2 (Both stop builder SAVE overwriting a world file that is not what was loaded, with SAVE FORCE to override); B13 (B13's builder login summary shows DT3's WORLD PROBLEMS).", "d": "yes", "note": ""}, {"id": "DT4", "theme": "DT", "title": "CHATTEST, CHATLINT and CHAT RELOAD", "kind": "debug tool", "value": "high", "effort": "small", "body": "**Today.** When an NPC does not answer, the builder cannot see why: the wrong group, a failing mask, a parse error, the 3-tick start delay, or the busy check after another NPC spoke. Chat parse errors go only to `Log.debugOut`, malformed lines to a warning. There is no MUDCHAT debug flag, and `TEST` has no MudChat case. Only reloading exists: `UNLOAD RESOURCE` drops cached chat groups.\n\n**Add.** `CHATTEST <mob> <sentence>` shows, without anyone speaking, the NPC's active groups, the entries the words map to, each match result with masks, `+IF` and `?` guards, the weighted replies with variables filled in, and whether timing or busy state would stop a reply. `CHATLINT <file>` reports parse errors with line numbers, malformed `${}` lines, `@` links to later groups, entries hidden by broader earlier patterns, and tick odds. `CHAT RELOAD [file]` re-parses, and builder mode reloads a changed file by itself. The same test and lint cover `.dlg` dialogue trees.\n\n**Example.** `chattest foreman hello there` shows group \"foreman_quest\" (switched), entry \"(hello)\" rejected by `?VAR($t MINEQUEST)==done`, fell through to \"@default\" entry \"(hello|hi)\", weight 9.", "d": "yes", "note": ""}, {"id": "DT5", "theme": "DT", "title": "DEV=1: a normal game with saves and developer powers", "kind": "world option", "value": "high", "effort": "small", "body": "**Today.** There are two modes: `BUILDER=1`, with no saves, and a normal game. A launch override already gives powers in a normal game: `sud.sh SYSOPMASK=-MOBS RESTORE=act2` makes every profile character a sysop, keeping class and saves, and `MODIFY USER` can grant security groups saved in `CMCHAR`. But a sysop holds every security flag: `IMMORT` keeps them from dying, and `ORDER`/`CMDROOMS` make `Aggressive` skip them, so the test is not like play. Nothing marks such a save, and scripts can only test the powers with `ISIMMORT($n)`, not whether this is a dev game.\n\n**Add.** A `DEV=1` launch setting, in the ini or on the command line. Every profile character gets the security group named by `DEVGROUP=` (default `GROUP_DEV`, defined in coffeemud.ini like the other `GROUP_` lines) without a class change, and the plan's dev-only commands (`GOD`, `DEVLOG`, `VARS`, `SCRIPT` and others) are on. Saves made then get `dev=true` in header.properties and show `[dev]` in `SAVES` and the startup list. The script function `ISDEV()` tests it.\n\n**Example.** `sud.sh DEV=1 RESTORE=act2`: play the real level-5 Ranger through act 2, `GOTO` back to check a fixed room, look at quest variables, and keep saving.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST6, DT18 (ST6 adds ISDEV() and ISBUILDER(), DT5 adds ISDEV() and DT18 adds ISBUILDER(); add each once); DT8 (Alternatives for testing as a mortal: a normal game with dev powers, or a playtest mode inside builder mode); DT6, DT27 (DT6's GOD toggles and DT27's world/dev areas depend on DT5's DEV=1 mode).", "d": "yes", "note": ""}, {"id": "DT6", "theme": "DT", "title": "Prop_DevCheats and GOD toggles", "kind": "property and debug tool", "value": "high", "effort": "small", "body": "**Today.** Most cheats exist under other names, but only for sysops and all at once. `IMMORT` keeps you at 1 hp. `Prop_WeaponImmunity` with `+ALL` blocks damage. `WIZINV` sees hidden, dark and invisible things and turns malice away. `Aggressive` skips holders of `ORDER` or `CMDROOMS`. `ALLSKILLS` skips cooldowns, and `GOTO` moves you anywhere. Missing: passing closed or locked doors and `Prop_Req*` entry checks (`StdExit` has no bypass), zero mana and move costs, and turning one power off, such as `IMMORT` for one fight.\n\n**Add.** `Prop_DevCheats`, saved with the character like any effect, with `NOCLIP` (ignores doors, locks, `Prop_Req*` checks and movement costs), `NOCOST` (no mana or move cost, no cooldown), and opt-out flags that suspend a sysop power for that character. A dev-only `GOD [flag|ALL] [ON|OFF]` toggles these and fronts the existing pieces as `NODAMAGE`, `NODEATH`, `SEEALL` and `NOAGGRO`.\n\n**Example.** `GOD NOCLIP NOAGGRO ON`, then walk the 40-room Sunken Crypt checking every description and exit. `GOD NODAMAGE ON`, then let the lich drop below 25% to see its `HITPRCNT_PROG` phase change.\n\n*See also:* DT5, DT27 (DT6's GOD toggles and DT27's world/dev areas depend on DT5's DEV=1 mode).", "d": "yes", "note": ""}, {"id": "DT7", "theme": "DT", "title": "SCRIPT FIRE, CALL, RESET: run a host's triggers on demand", "kind": "debug tool", "value": "high", "effort": "medium", "body": "**Today.** Nothing runs a chosen trigger or `FUNCTION_PROG` on a chosen host as if a given character caused it. `TICKTOCK` makes a `TIME_PROG` fire, but it changes the clock. `MPRUN mpslay` fires a `DEATH_PROG` only by killing the mob. `MPRUN MPSCRIPT <target> INDIVIDUAL EXECUTE` runs new code on a target but cannot
