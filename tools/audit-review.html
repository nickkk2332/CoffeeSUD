and on a fresh checkout. There is no hash to approve.\n\n*See also:* SC14 (Both fix JSCRIPTS=1 letting a refused script run from its second try).", "d": "yes", "note": ""}, {"id": "JS2", "theme": "JS", "title": "A time limit and readable errors for all JavaScript", "kind": "debug tool and world option", "value": "high", "effort": "small", "body": "**Today.** `<SCRIPT>`, JRUN, JCONSOLE, quest JS and cron JS all call Context.enter() with no time limit. The world runs on one game thread, so `while(true){}` in a RAND_PROG freezes the game. Every entry point names its source `<cmd>`. JS errors go only to mud.log, which can be read in game with LIST LOG. MOBPROG errors also show in the room. JRUN exits its context outside a finally block. JavaScriptingEngine.LimitedContextFactory exists, but nothing uses it, and it is incomplete: it never sets setOptimizationLevel(-1) or setGenerateObserverCount(true).\n\n**Add.** One factory, installed at boot with ContextFactory.initGlobal, so every entry point gets the limit: `JSTIMELIMIT=2` (seconds) in the ini, with a longer limit for JRUN. JRUN exits in a finally block. Source names say where the code is, such as \"mob 'Brenna' @ Town#4 SPEECH_PROG\" or \"world/js/lib/dialog.js\". In builder mode, errors and timeouts are shown to the builder with the line and a snippet. `JS ERRORS [n]` lists recent errors with host, trigger, line and time.\n\n**Example.** A typo shows \"JS error in 'Brenna' (Town#4) SPEECH_PROG line 3: ReferenceError: \"soruce\" is not defined\". A runaway loop stops after 2 seconds.\n\n*See also:* DT9, DT10 (All three route script and JavaScript errors, with file and line, to the builder; build one error channel).", "d": "yes", "note": ""}, {"id": "JS3", "theme": "JS", "title": "Shared JavaScript libraries with require()", "kind": "JavaScript hook", "value": "high", "effort": "small", "body": "**Today.** JS has no module system. The Rhino jar contains CommonJS Require, but nothing installs it. Code can be shared in other ways. Many hosts can use LOAD=progs/dialog.script and share one parsed copy, `<SCRIPT>` blocks included. FUNCTION_PROG with MPCALLFUNC gives named subroutines. A JS file can be pulled in with eval(String(...Resources.getFileResource(...))). That last way has no module scope, no exports and no cache invalidation.\n\n**Add.** Install Rhino's `require` in every JS scope. Modules are looked up in world/js/lib, then resources/js/lib. Each compiles once and is cached. The cache is dropped when the file changes or on JS RELOAD. Modules see `cm` and export with `exports.fn = ...`. `<SCRIPT SRC=\"lib/x.js\">` runs a file as a block.\n\n**Example.** world/js/lib/dialog.js exports `menu(npc, player, options)`. Every quest-giver's SPEECH_PROG runs `<SCRIPT> require('dialog').menu(monster(), source(), TOPICS) <\/SCRIPT>`.\n\n*See also:* JS6 (JS22 (now in JS6)'s include() and JS3's require() are two module mechanisms for shared JavaScript; pick one); G17 (G17's template JavaScript loads libraries through JS3's require() from world/js/lib).", "d": "yes", "note": ""}, {"id": "JS5", "theme": "JS", "title": "JavaScript classes and script files kept in world/", "kind": "data file and JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** JS classes load from any folder named in the ini's class-path keys. `BEHAVIORS=%DEFAULT%;world/js/behaviors/` works now, in the ini or on the sud.sh command line, and LOAD BEHAVIOR file.js reloads a class at run time. But nothing in world/ loads by default. LOAD= includes are forced under resources/, so a .script file cannot sit next to its area. world.sum covers only areas, custom.cmare, catalog.cmare and quests.\n\n**Add.** At boot, before areas import, load world/js/<type>/*.js for every class type (behaviors, abilities, properties, items, mobs, races, charclasses, commands). MOBPROG files go in world/scripts/, reached with a `world:` prefix (LOAD=world:scripts/guard.script). Cover these files in world.sum and list them in LIST CUSTOM. Show compile errors and broken //extends lines to the builder and in a world check. Ship commented templates for a behaviour and a property. Add a base class, JSWorldBehavior, with onEnter, onLeave, onWeather and onDaypart hooks and helpers (area echo, roll, catalog spawn).\n\n**Example.** world/js/behaviors/Ferryman.js waits for a fare and carries the party across the river. River.cmare attaches it as `Ferryman FARE=5 FAR=Riverbank#2`. Both files are committed together.\n\n*See also:* S6 (Two ways to keep scripts and JS classes in world/: JS5's world: prefix and world/js class folders, or S6's overlay and WORLDDIR/classes); CR8 (CR8 names world-loaded JS classes (JS5) as the alternative to GenBuildingSkill).", "d": "yes", "note": ""}, {"id": "JS6", "theme": "JS", "title": "One `cm` helper object in every JavaScript scope", "kind": "JavaScript hook and script function", "value": "high", "effort": "medium", "body": "**Today.** `<SCRIPT>` and JCONSOLE can call every MOBPROG command and function as an upper-case JS function (MPECHO, MPMLOAD, RANDNUM$, STAT$, with $-codes expanded), but only in string form. Other entry points get far less: JRUN 6 helpers, quest JS 4, cron JS 3 and JS classes 2. importPackage does not work because there is no ImporterTopLevel. Object-level work needs long Packages.com.planet_ink... paths and internal calls such as CMLib.law().getLegalBehavior(R).getWarrantsOf(...), which may change.\n\n**Add.** One scope builder used by every entry point. It provides the MOBPROG bridge, ImporterTopLevel, and an object `cm` that returns Java objects. Members: lib, room('Area#12'), area, findMob, findItem, loadMob(catalogName, room), loadItem, echo, tell, say, emote, cmd, dice, chance, now, calendar, player(), party(), var, stat, mp('MPECHO hello') and log. World members: clock(area) (hour, season, moon, absHours and so on), passTime, weather(area).get/set/forecast, law(area).warrants/pardon/fine/accuse, shop(mob).stock/price, market, bank and holiday. Time and weather events reach JS through cm.on. All of it is documented in guides/.\n\n**Example.** `var g = cm.loadMob('Town Guard', cm.room('Town#1')); cm.say(g, 'Halt, ' + cm.player().name() + '!');`\n\n**Also merged here, from JS22 (Shared JavaScript code, a sud helper object, and debug()).** In all three scopes:\n- `include('progs/lib/combat.js')`, cached and path-checked like `LOAD=`;\n- `debug(x)`, which writes to DEVLOG;\n- a `sud` object: `sud.time` (now, isTurnBased, advance(ticks), waitUntil(fn)), `sud.party` (leader, members, isMember), `sud.save` (slot, isBuilder, isDev), `sud.find` (room(id), mob(name, area), item(name, room)) and `sud.vars` (get, set, list).\n\nJCONSOLE also gets `here`, `area` and `target`. `sud.on('save', fn)` waits for the lifecycle-trigger item.\n\n*See also:* JS3 (JS22 (now in JS6)'s include() and JS3's require() are two module mechanisms for shared JavaScript; pick one); W1, W4, W6, W12, W14, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); B11 (B11's JRUN builder object and JS6's cm object both add helpers to the JRUN scope); DT9, DT24 (JS22 (now in JS6)'s and DT24's debug() both write to DT9's developer log; one function).", "d": "yes", "note": ""}, {"id": "JS7", "theme": "JS", "title": "Structured JavaScript state kept in saves", "kind": "JavaScript hook and builder tool", "value": "high", "effort": "medium", "body": "**Today.** JS values are lost between runs. setVar stores only strings and upper-cases names. A workaround exists: setVar('WORLD','STATE',JSON.stringify(obj)), read back with JSON.parse(getVar(...)). This Rhino has JSON, and global vars are written to the save's <SCRIPTVARS>. But every value must be packed by hand. There is no stable key per host and no starting state for a new game.\n\n**Add.** `cm.store(key)` returns a plain JS object that is saved with the game. A key can be 'world', a host (keyed by room ID, or by a mob's start room plus its name), 'quest:<name>' or any string. On SAVE, stores are written as JSON, in a <JSSTATE> section of world.xml or over the global vars. On restore they come back after WorldState.apply and before onRestore. A new game starts from world/js/state.json if it exists. `JS STATE [key]` in builder mode shows and edits a store.\n\n**Example.** A blacksmith keeps `cm.store(me)` = {orders:[{who:'Ann', item:'longsword', readyDay:12}], served:7}. After SAVE and RESTORE, the sword is still due on day 12.\n\n*See also:* SC4 (Two saved per-object state stores: SC4's @-host variables in ExtraData and JS7's cm.store keyed by host); JS18, JS19 (JS18's quest state and JS19's pending timers are saved through JS7's cm.store and JSSTATE section).", "d": "yes", "note": ""}, {"id": "JS8", "theme": "JS", "title": "World-wide JavaScript events with cm.on", "kind": "JavaScript hook", "value": "high", "effort": "medium", "body": "**Today.** A script hears only the messages that reach its host. CMMap broadcasts DEATH, LEVEL, LOGIN, QUIT, WINQUEST, ENDQUEST, LEGALWARRANT, LEGALSTATE and CHANNEL world-wide, but Scriptable listens only through LOGIN_PROG, LEVEL_PROG and CHANNEL_PROG. Workarounds: ScriptableEverymob on an area gives every native mob a script, an area hears its rooms' messages, and achievements.ini counts kills and exploration. A JavaAdapter MsgListener can be added with addGlobalHandler, but the handler is held weakly and is gone after a reboot.\n\n**Add.** `cm.on(name, fn)` and `cm.off(name, fn)`, registered from init.js or libraries and set up again at each boot. Events: death(victim, killer), levelup, questwin, questend, enterRoom(mob, room, from), enterArea, itemGained, itemLost, factionChange(mob, faction, delta), turn() (each step of turn-based time), hour, day, weather(area, kind), save and restore. 'Before' variants such as beforeDeath and beforeEnterRoom can return false to veto. enterRoom, itemGained, factionChange and turn are not broadcast today. They need new sendGlobalMessage calls or a hook in the turn scheduler.\n\n**Example.** A death handler counts orcs the party kills in cm.store('world').orcKills. At 50, it loads the Orc Warlord at Fort#1.\n\n*See also:* ST12 (Both expose the engine's world-wide broadcasts (DEATH, LEVEL, WINQUEST, LEGALWARRANT and so on) to scripts, ST12 in MOBPROG and JS8 in JavaScript); ST4, ST11 (ST4's dawn, dusk and date-change messages and ST11's calendar triggers hook the same clock transitions, which JS8's hour, day and weather events also need); ST14, F6 (All three need DefaultFaction to report a change and a band crossing beyond the source's room (FACTION_PROG, live band effects, a JS factionChange event)); ST6 (JS8's save, restore and turn() events repeat ST6's lifecycle and turn events (with JS4 (now in ST6) and ST23 (now in ST6) merged into ST6)).", "d": "yes", "note": ""}, {"id": "JS9", "theme": "JS", "title": "Effects whose stat changes are written in JavaScript", "kind": "property and behaviour", "value": "high", "effort": "medium", "body": "**Today.** MOBPROG cannot change computed stats: there is no affectPhyStats or affectCharStats trigger. GenAbility has a SCRIPT field (okMessage, executeMsg, tick), and HERESTATS and MOCKABILITY give stat changes that stay fixed while the effect lasts (HERESTATS may use caster and target level variables, worked out once when cast). Prop_*Adjuster gives fixed changes gated by a mask. MPSET changes base stats permanently, so a kill-counting sword can be built today by MPSETting its DAMAGE. A JS class extending Ability can compute stats, but it needs an ini path or LOAD, one class per effect, and parameters parsed by hand.\n\n**Add.** A property `Prop_JScript` (for mobs, items, rooms, exits and areas) and a behaviour `JSBehavior`. The behaviour gets only okMessage, executeMsg and tick: behaviours are never asked for stat changes, so the stat hooks need the property. Alternatively, the same as a JS-file field on GenAbility. Parameters: `SCRIPT=world:js/props/bloodblade.js KILLS=0`. The file may define affectPhyStats(host, affected, stats), affectCharStats, affectCharState, okMessage, executeMsg, tick, onAdded and onRemoved. Parameters arrive as `parms`, and changes to them are written back to the property's text, so they are saved with the host. Each file is compiled once and shared.\n\n**Example.** \"Bloodblade\" counts its wielder's kills in parms.KILLS and adds 1 damage per 10 kills. The count is kept in the sword's own text, so it survives saves.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* SC13, N7, P1 (Four ways to give a shared script or effect per-instance parameters (SC13's ARG(), N7's PARM(), P1's EFFECTPARM(), JS9's parms); decide them together); I24 (Both make items that grow with kills: JS9's bloodblade example in JavaScript, I24 as a property).", "d": "yes", "note": ""}, {"id": "JS10", "theme": "JS", "title": "JS RELOAD: update changed JavaScript in the running world", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** LOAD <TYPE> file.js (sysop) recompiles a JS class and replaces its template, so new instances use the new code. Mobs, items and behaviours already in the world keep the old class. Load unloads the old class first only for .class names. Scripts can mostly be reloaded already: UNLOAD RESOURCE PARSEDPRG, UNLOAD FILE and MPUNLOADSCRIPT drop cached MOBPROG files, so edited LOAD= files and their `<SCRIPT>` blocks are read again on the next trigger.\n\n**Add.** `JS RELOAD [file|ALL]` in builder mode. It finds changed world/js files by modification time and recompiles them. Each live instance is replaced with a new one: its text() is copied, it is attached again to its host, and onReload(oldState) is called if defined. It also clears the require cache, rebuilds JScriptable scopes, and reports compile errors as file:line. `JS WATCH ON|OFF` checks file times every few seconds and reloads automatically.\n\n**Example.** The builder edits the ferryman's dialog in a text editor, types `js reload` and talks to him again. onReload carries over his half-finished crossing.\n\n*See also:* B5 (Both reload changed files in the running world and add an automatic file watch (JS WATCH, DEVWATCH)).", "d": "yes", "note": ""}, {"id": "JS11", "theme": "JS", "title": "JScriptable: a Scriptable written wholly in JavaScript", "kind": "behaviour", "value": "high", "effort": "large", "body": "**Today.** JS can live only inside MOBPROG triggers. Each `<SCRIPT>` block starts with a fresh scope and its result is discarded. CALLFUNC finds only FUNCTION_PROG. A JS class extending StdBehavior can veto in okMessage, but must decode CMMsg codes by hand. The unused JavaScriptingEngine (one scope per script, callFunc) is broken: okMessage always returns true, I2 is taken from msg.tool() instead of msg.target(), and getMakeMOB returns null for hosts that are not mobs. Scriptable.engine() and CoffeeMaker.unpackGenScriptsXML hard-code DefaultScriptingEngine.\n\n**Add.** Finish JavaScriptingEngine and expose it as a behaviour `JScriptable` for mobs, items, rooms, exits and areas. It takes inline JS or LOAD=world:js/npc/ferryman.js, plus a scope (GLOBAL, INDIVIDUAL or a name). It calls only the handlers the script defines: onLoad, onGreet, onArrive, onLeave, onSpeech(who, text), onGive, onGet, onDrop, onWear, onRemove, onOpen, onClose, onLock, onUnlock, onDeath, onKill, onDamage, onCast, onLook, onTick, onHour and onDay. onCommand(who, verb, rest) returns true to handle an unknown command. canMessage(msg) returns false to veto, and afterMessage(msg) runs after the message. MPCALLFUNC and CALLFUNC can call its functions. Scripts use `cm`, the time limit and cm.store. The engine choice is saved in the <SCRPT> XML.\n\n**Example.** When a player says \"ferry\", the ferryman's onSpeech asks for five coins and sets state.crossing. Then onTick moves the boat.\n\n*See also:* JS18 (JS11 finishes JavaScriptingEngine as JScriptable, while JS18 proposes dropping it or making it selectable; decide its fate once).", "d": "yes", "note": ""}, {"id": "JS12", "theme": "JS", "title": "JCONSOLE as a given mob, item or room", "kind": "debug tool", "value": "medium", "effort": "small", "body": "**Today.** JCONSOLE keeps a scope per builder, which is lost on reboot. It takes multi-line input between '<' and '>' and can call every MOBPROG command and function. Every call runs as the builder: host, monster and source are all the builder, with no target or message. Objects print as raw toString text. To test a mob's script, the builder must act it out: say the phrase or give the item.\n\n**Add.** `JCONSOLE @<mob|item|here|area>` binds host() and monster() to the target and source() to the builder, and sets `me`, `here` and `cm`. Dot commands: `.trigger GREET|SPEECH text|GIVE item` fires that handler on the target's JScriptable or Scriptable. `.load file.js` loads a file and `.reset` clears the scope. `.inspect expr` prints name, class ID, location and getStatCodes values. `.time on` shows run time. History is kept across sessions in builder mode.\n\n**Example.** After `jconsole @blacksmith`, `.trigger SPEECH repair my sword` shows exactly what the smith answers, and `.inspect cm.store(me)` shows his orders.\n\n*See also:* DT7 (Both fire a chosen trigger on a chosen host on demand (JCONSOLE .trigger, SCRIPT FIRE)).", "d": "yes", "note": ""}, {"id": "JS13", "theme": "JS", "title": "Seeded randomness and game time in JavaScript", "kind": "JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** The fork rolls all the game's dice from one seeded generator and keeps time with GameTime, so RANDOMSEED and turn-based time are repeatable. From `<SCRIPT>`, RANDNUM$, RAND0NUM$ and RAND use that generator. ISHOUR, ISDAY, ISSEASON and DATETIME$ read the game clock. But plain JS Math.random and Date use the JDK, and cron JS counts real milliseconds. Ordinary JS therefore breaks seeded replays and ignores pauses and turns.\n\n**Add.** In every JS scope, back Math.random with the shared dice generator, so the save's dice state covers it. Add cm.now(), cm.calendar() (hour, day, month, season) and cm.ticks() on the game clock. Optionally, make Date.now() and new Date() read GameTime, with cm.realNow() for real time. That part is riskier, because some code may expect real dates.\n\n**Example.** A card-playing NPC written in JS deals the same hands under RANDOMSEED=42. A \"come back in 3 hours\" check counts game hours, which do not pass while the game is paused.\n\n*See also:* DT39 (later) (Exact replay needs JS13's Math.random on the shared dice as well as DT39 (later)'s deterministic scheduler).", "d": "yes", "note": ""}, {"id": "JS14", "theme": "JS", "title": "+JS and -JS entries in zapper masks", "kind": "script function", "value": "medium", "effort": "small", "body": "**Today.** Zapper masks gate catalog spawn rules, Prop_Req* checks, ability components and shop masks. Their scripted test is +IF/-IF (resources/help/zappermasks.txt). It takes one quoted MOBPROG condition, compiled once per mask, with the tested object as host. Global vars are visible, so `+IF \"var(WORLD BELLRUNG == 1)\"` can already gate on world state set by setVar from JS. +IF lacks structured data and the JS language.\n\n**Add.** Mask entries `+JS \"expr\"` and `-JS \"expr\"`. The expression sees `mob`, `target`, `item`, `room` and `cm`, cm.store included. It is compiled once per mask and runs under the time limit. An error counts as no match. It can reuse the compiled-entry slot that +IF uses. It is mainly a convenience over +IF.\n\n**Example.** Prop_ReqEntry on a crypt door has `+JS \"cm.store('world').bellRung && cm.calendar().hour < 4\"`. Alongside DEVPLAN item 1, a catalog spawn rule with `+JS \"cm.store('world').dragonDead\"` makes the dragonscale chest loot appear only after the dragon dies.", "d": "yes", "note": ""}, {"id": "JS15", "theme": "JS", "title": "JS() in conditions, MPJSFILE, and cancel from <SCRIPT>", "kind": "script function and script command", "value": "medium", "effort": "small", "body": "**Today.** To use one JS test in an IF, a builder needs a whole `<SCRIPT>` block that sets a var, then `if var(...)`, because the block's value is discarded. A one-line `<SCRIPT>...<\/SCRIPT>` already works anywhere in a line, so an MPJS command is not needed. JS cannot veto a message. In CNCLMSG_PROG it can change the message in objs()[0], but a bridged RETURN('cancel') ends only its own sub-execute. Running a JS file needs the eval-of-CMFile workaround.\n\n**Add.** A function `JS(\"expr\")`, true when the result is truthy, for use in IF. A string form `JS$`, for `$%JS$(...)%` substitution in text. A command `MPJSFILE world:js/x.js args`. Inside `<SCRIPT>`, `cancel()`, or a final value of \"cancel\", makes the enclosing prog return cancel, so CNCLMSG_PROG can veto from JS.\n\n**Example.** `cnclmsg_prog GET p idol` with `<SCRIPT> if (!cm.store('world').trapDisarmed) { MPECHO('A dart flies!'); cancel() } <\/SCRIPT>`. The player cannot take the idol until the trap is disarmed.\n\n*See also:* SC5, JS17 (Message access and veto from scripts: SC5 in MOBPROG, JS17's msg() and cancel(), JS15's cancel(); JS15 and JS17 both add cancel()).", "d": "yes", "note": ""}, {"id": "JS16", "theme": "JS", "title": "A single-player JavaScript guide and JS HELP", "kind": "presentation and debug tool", "value": "medium", "effort": "small", "body": "**Today.** The JS documentation is scattered and partly out of date. Scriptable.html (around line 4610) covers `<SCRIPT>`, the MOBPROG bridge and getVar/setVar. It still says semicolons must be escaped, which is no longer true inside `<SCRIPT>`. Programming.html covers JS classes next to material for the removed web server. arc_help.ini covers JCONSOLE, JRUN and MPRUN. Nothing lists what each context provides, and CMDFAIL_PROG and +IF masks are barely documented. In JCONSOLE, `for (k in obj)` lists a Java object's members, but only roughly.\n\n**Add.** A guides/JavaScript.html covering: each context and what it exposes (a table), the `cm` API, event and handler names, state and save rules, require and the world/js layout, error and time-limit behaviour, and today's tricks (the MOBPROG bridge, JSON in global vars, one-line `<SCRIPT>`). It ends with worked examples: a shopkeeper, a ferryman, a cursed sword and a quest. Also add `JS HELP <expr>`, which lists the methods of the object an expression returns, with its STAT codes and values. The guide is worth writing whichever other items are approved.\n\n**Example.** `js help cm.room('Town#1')` lists getArea(), numInhabitants() and fetchInhabitant(i), and stat codes such as DISPLAY, DESCRIPTION and CLIMATE.", "d": "yes", "note": ""}, {"id": "JS17", "theme": "JS", "title": "Message, cancel and lookup helpers for JavaScript in scripts", "kind": "JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** JavaScript in a trigger's `<SCRIPT>` block gets host, source, target, item, item2, the message text, objs and getVar/setVar. Every MOBPROG command and function can be called as an uppercase function (`MPOPEN('$xN')`, `INAREA$()`), and `Packages.com.planet_ink.coffee_mud.core.CMLib` reaches the engine. In `CNCLMSG_PROG` the CMMsg is `objs()[0]`. `EXECMSG_PROG` and the other queued triggers get no message. JS cannot cancel: it sets a variable, then MOBPROG runs `RETURN CANCEL` after the block. Common lookups need long calls, and none of the helpers are documented.\n\n**Add.** In JScriptEvent: `msg()` (the CMMsg in every message trigger, null elsewhere), `cancel()`, `room(id)`, `findItem(where, name)`, `door(roomId, dir, op)` over MPDOOR, `signal(...)` and `state(...)`. Document them in `guides/Scriptable.html`.\n\n**Example.** A boulder's `CNCLMSG_PROG` reads `msg().value()` to get the push direction and calls `cancel()` unless the way is downhill.\n\n*See also:* SC5, JS15 (Message access and veto from scripts: SC5 in MOBPROG, JS17's msg() and cancel(), JS15's cancel(); JS15 and JS17 both add cancel()); SC4, SC6, I2 (JS17's state(), signal() and door() helpers wrap SC4's per-object state, SC6's signals and I2's MPDOOR).", "d": "yes", "note": ""}, {"id": "JS18", "theme": "JS", "title": "JavaScript quest handlers and a quests helper", "kind": "JavaScript hook, quest feature", "value": "medium", "effort": "medium", "body": "**Today.** A quest's `<SCRIPT>` runs once, at setup, with `quest()` and `setupState()` and no MOBPROG bridge. Steps and wins are scripted through what the quest gives (`GIVE SCRIPT`): `QUEST_TIME_PROG`, `MPSTEPQUEST`, `MPQUESTWIN`, `QVAR`, and the `FUNCTION_PROG` hooks `CAN_ACCEPT`, `DO_ACCEPT` and `DO_DROP`. JS reaches quests only through `Packages...CMLib.quests()`. `WINQUEST` is sent only by `MPQUESTWIN`. JavaScriptingEngine is dormant: nothing creates it, its quest calls do nothing, and its `isFunc` ignores the name it is given.\n\n**Add.** A quest file names `JSFILE=world:js/quests/<name>.js` or holds a `<JSQUEST>` block. `onStart(state)`, `onStep(n, state)`, `onTimeUp(state)`, `onWin(player)` and `onStop()` are called if defined. Scripts on quest objects may define `onQuestAccept(quest, mob)`, `onQuestStep(quest, step, label)`, `onQuestWin(quest, mob, outcome)`, `onQuestFail(quest, mob, reason)` and `onQuestEnd(quest, reason)`. Quest JS gets the bridge. Its state lives in `cm.store('quest:'+name)` and is saved with the game. A `quests` helper gives start, step, win, fail, stop, running, stepNumber, status, objective, journal and getVar/setVar. JavaScriptingEngine is either dropped, or made selectable (`MPSCRIPT ENGINE=JS`) with `isFunc` fixed.\n\n**Example.** In \"Missing Cat\", `onStart` picks a random alley from `setupState().roomGroup` and stores it. `onWin` pays 50 gold, less 5 for each game hour taken, counted from the stored start time.\n\n*See also:* ST5, Q4, Q11 (Quest outcome hooks overlap: ST5's QUEST_PROG FAIL and END EXPIRED, Q4's QUESTFAIL_PROG, Q11's QUESTTIMEOUT_PROG, and JS18's onQuestFail and onQuestEnd in JavaScript); JS7, JS19 (JS18's quest state and JS19's pending timers are saved through JS7's cm.store and JSSTATE section); JS11 (JS11 finishes JavaScriptingEngine as JScriptable, while JS18 proposes dropping it or making it selectable; decide its fate once).", "d": "yes", "note": ""}, {"id": "JS19", "theme": "JS", "title": "Game-clock scheduling from JavaScript", "kind": "JavaScript hook", "value": "medium", "effort": "medium", "body": "**Today.** MOBPROG schedules on the game clock with `TIME_PROG`, `DAY_PROG`, `DELAY_PROG`, `RAND_PROG`, `MPALARM <ticks> <command>` and ScriptLater. Quests start on `SET MUDDAY` and take `WAIT`, `INTERVAL` and `DURATION` in mudhours or muddays. They live in `world/quests`, so a market day can be a quest today. CRON runs on real time and is kept in the journal table, which is save state: a job made in builder mode never reaches a new game. JS has no scheduler of its own. A `<SCRIPT>` can call `MPALARM('10 MPCALLFUNC market')` through the MOBPROG bridge. That runs MOBPROG text, not a JS function, and pending alarms are not saved. A CRON job can hold a `<SCRIPT>` block, but it runs on real time.\n\n**Add.** `cm.every('1 day'|'6 hours'|ticks, fn)`, `cm.at('hour 6'|'day 1'|'season winter', fn)` and `cm.after(ticks, fn, data)`. All run on GameTime, built on the tick `TIME_PROG` uses, so they wait while the game is paused and step with turns. Recurring ones are registered from `init.js` (JS4 (now in ST6)) on each boot. Pending one-shot timers and their data go into the save's JSSTATE (JS7) and come back on restore. `cm` comes from JS6.\n\n**Example.** `cm.at('day 7 hour 8', function(){ fillMarket(); cm.echo(cm.room('Town#Square'), 'Traders set up their stalls.'); })` makes a market day on the 7th of each month. As in DAY_PROG, 'day' is the day of the month, and the shipped calendar has no weeks (DAYSINWEEK= is empty).\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* ST24, S21 (Three ways to run something on a game-clock interval that survives saves; ST24 also suggests moving cron to GameTime, which is S21); JS7, JS18 (JS18's quest state and JS19's pending timers are saved through JS7's cm.store and JSSTATE section).", "d": "yes", "note": ""}, {"id": "JS20", "theme": "JS", "title": "Commands and local verbs from JavaScript", "kind": "JavaScript hook", "value": "medium", "effort": "medium", "body": "**Today.** `CREATE COMMAND` makes a GenCommand with HELP, ACCESS (its words), SCRIPT, ORDEROK, SECMASK, ACTCOST and CBTCOST. Its `FUNCTION_PROG EXECUTE` may be a `<SCRIPT>`, is pre-approved, gets the arguments in `objs()`, and is saved in `world/custom.cmare`. A verb for one room uses `CNCLMSG_PROG HUH p <phrase>` (documented) or `CMDFAIL_PROG <verb> [P phrase|words]` (undocumented), where `return cancel` swallows the failure. There is no short way to do either from JS, and no ready fallback message.\n\n**Add.** `cm.command('dig', {help:'DIG [direction]', cost:1, combatCost:2}, function(mob, args){...})`, in `init.js` or a library, makes a GenCommand behind the scenes (or a JS command class), kept with the world. `cm.verb(roomOrItemOrMob, 'pull lever', function(mob, rest){...})` makes a phrase work only near that object. It handles the matching and gives a \"You can't do that here\" fallback. Document `CMDFAIL_PROG` in `guides/Scriptable.html` first. That alone may be enough.\n\n**Example.** `cm.verb(cm.room('Mine#7'), 'pull lever', function(m){ cm.echo(m.location(), 'The cart rattles away.'); cm.store('world').cartAtBottom=true; })`\n\n*See also:* ST7 (JS20's cm.verb is a JavaScript form of ST7's VERB_PROG local verbs); SC9, SC15 (SC9 and SC15 both rewrite guides/Scriptable.html with single-player notes and a CMDFAIL_PROG section, which JS20 says may be enough on its own).", "d": "yes", "note": ""}, {"id": "JS21", "theme": "JS", "title": "Upgrade Rhino and fix the quote swap", "kind": "JavaScript runtime upgrade", "value": "medium", "effort": "medium", "body": "**Today.** By its manifest, `lib/js.jar` is Mozilla Rhino 1.7R2, built 2011-05-09. It has commonjs and NativeJSON, so it is a late 1.7R3-era build. Scripts get no arrow functions, no template strings, no `let`/`const` by default, and no `Array.find`/`includes` or `Object.assign`. The game runs on Java 21, which current Rhino supports (1.7.14 and later need Java 11). Separately, `setScript` turns every `'` into a backtick and `getScripts` turns it back (DefaultScriptingEngine, also for `STATIC=`). JConsole input and cron do the same. A literal backtick in an inline script comes back as a quote.\n\n**Add.** Replace `lib/js.jar` with Rhino 1.7.15 or later, set language version ES6 in the shared JS runtime, and keep `RHINO.LICENSE`. Recheck the `//extends` class compiler (ClassCompiler, in CMClass) and the JConsole and JRUN scopes. Keep `<SCRIPT>` bodies out of the quote swap, or swap through an escape that cannot clash. This matters only once template literals work.\n\n**Example.** ``cm.party().filter(m => m.curState().getHitPoints() < 10).forEach(m => cm.tell(m, `You feel weak, ${m.name()}.`))``", "d": "yes", "note": ""}, {"id": "JS23", "theme": "JS", "title": "A world JavaScript file for progression", "kind": "JavaScript hook", "value": "medium", "effort": "medium", "body": "**Today.** No single world file sees progression events and returns a result, though most hooks exist as scripts. `LEVEL_PROG` is global. `CHARCREATIONSCRIPTS` (RACE, GENDER, STATS, CLASS, FACTIONS, END) may hold `<SCRIPT>` JS. A script on a parent area (`DEFAULTPARENTAREA`) hears every EXPCHANGE, TEACH, PRACTICE and TRAIN message, and can change XP with `objs()[0].setValue()`. XPMOD and Prop_ModExperience scale XP by type. Practice and train counts can only be adjusted after the fact (`MPPRACS`, `MPTRAINS`), and `STARTSTAT` has no script mode.\n\n**Add.** `world/scripts/progression.js`, with each function called if defined: `onCreated(mob)`, `onCreationStep(mob, step, answer)`, `xpGain(mob, source, amount)` (returns the amount), `onLevel(mob, level)`, `practicesForLevel(mob)` and `trainsForLevel(mob)` (each returns a number and overrides the progression-formulas item), `onLearn(mob, abilityId)`, `onTrain(mob, what, amount)`, and `statRoll(mob)` for a new `STARTSTAT=SCRIPT`. It runs in the usual JS scope. It complements the proposed SCRIPT field on GenRace and GenCharClass.\n\n**Example.** `xpGain` returns 0 for `COMBAT:*` when the character bears a pacifist monk's tattoo, and `amount*1.5` for `DISCOVERY:*`. `trainsForLevel` gives 2 at every fifth level.\n\n*See also:* P17 (JS23's practicesForLevel and trainsForLevel override P17's per-level formulas; they are alternatives); P21 (JS23 says it complements P21's SCRIPT field on GenRace and GenCharClass).", "d": "yes", "note": ""}, {"id": "Q1", "theme": "Q", "title": "Finished quests stay known", "kind": "quest feature", "value": "high", "effort": "small", "body": "**Today.** A quest with no WAIT, INTERVAL or DATE, such as a story quest started by MPSTARTQUEST, is deleted from the quest list when it stops: by MPENDQUEST, MODIFY QUEST STOP or DISABLE, or its duration running out (enterDormantState calls delQuest). QUESTWINNER, +QUESTWIN and QUESTS WON then forget it, the save drops its winners, and in builder mode the next export deletes its world/quests file. The workaround is SET DURATION 0, or SET WAIT 1 with SET INTERVAL 1.\n\n**Add.** A FINISHED state. A stopped unscheduled quest stays listed with its winners and is saved as FINISHED. Only DESTROY QUEST removes a quest or its file. New settings: `SET RESTART NEVER|ALWAYS|<game time>`, `SET ENDONWIN TRUE` (MPQUESTWIN stops the quest, with cleanup) and `SET AUTOSTART BOOT` (short for WAIT 1). `MODIFY QUEST x REOPEN` clears FINISHED for testing.\n\n**Example.** 'The Drowned Bell' uses AUTOSTART BOOT, RESTART NEVER and ENDONWIN TRUE. When Mira wins, the ghost and the bell vanish. The quest stays FINISHED across saves, and the chapel NPCs keep using QUESTWINNER($n bell).\n\n*See also:* Q5 (Both control whether and when a quest can be done again (SET RESTART vs SET REPEATABLE and MAXWINS)).", "d": "yes", "note": ""}, {"id": "Q2", "theme": "Q", "title": "Quest-giver and turn-in markers in room listings", "kind": "property, world option", "value": "high", "effort": "small", "body": "**Today.** Nothing marks an NPC who has a quest for the player. Prop_QuestGiver only prompts when its trigger fires, and room listings read static ambiances. A builder can fake markers with `GIVE AFFECT AmbianceAdder (^Y!^?)` in the quest script, then swap them with MPUNAFFECT and MPAFFECT in DO_ACCEPT and turn-in scripts, by hand for every quest.\n\n**Add.** `Prop_QuestMarker` on a mob or item. `QUEST=<name|*>`, where * means every running quest it hosts or is first quest mob of. `AVAILABLE=`, `ACTIVE=` and `READY=` give the marker strings. `READYFUNC=CAN_COMPLETE` names a FUNCTION_PROG that returns non-empty when the viewer can turn in. getDispositionBlurbs asks the marker per viewer, through canAcceptQuest, which matters with a party and per-character windows. World option `QUESTMARKERS=AUTO` adds it to every quest's first quest mob and to Prop_QuestGiver hosts.\n\n**Example.** 'Old Ned mends a net here. (!)' until Mira accepts. Then a grey '(?)' while the quest is active, and a bright '(?)' once QOBJECTIVE says the bell is found.", "d": "yes", "note": ""}, {"id": "Q3", "theme": "Q", "title": "Quest journal: objectives, history and game time in QUESTS", "kind": "script command, script function, presentation", "value": "high", "effort": "medium", "body": "**Today.** QUESTS lists accepted quests by name. QUESTS <name> adds the instructions and the free-text PROGRESS and TIME_REMAINING vars the script sets, so templates build 'Killed 3/5' by hand. Ticks show as real minutes, which mean nothing under TIMEMODE TURNS unless the script sets TIME_REMAINING_TYPE. There are no objectives, no history and no grouping by SET CATEGORY.\n\n**Add.** A per-character log saved with the character, as a hidden savable effect. `MPQOBJECTIVE $n <quest> ADD <id> <target> <text>`, then `SET|BUMP|DONE|FAIL|HIDE <id> (n)` or `CLEAR`. `MPQJOURNAL $n <quest> <text>` adds an entry dated on the game calendar. `QOBJECTIVE($n quest id)` returns the count, DONE or FAILED. Quest-script `SET OBJECTIVE` and `SET JOURNAL` give each STEP's defaults. QUESTS groups by CATEGORY, main first, and shows `[x]/[ ] text n/m` with time left in game days or turns. `QUESTS <name>` adds history, `QUESTS LOG` recent entries. OBJECTIVEn and OBJECTIVEnDONE vars set by MPSETVAR are drawn the same way. A 'Quest updated:' notice can be turned off by a world option.\n\n**Example.** Accepting the bell quest runs `MPQOBJECTIVE $n bell ADD drowned 5 Lay 5 drowned men to rest`. Each drowned man's DEATH_PROG runs `MPQOBJECTIVE $n bell BUMP drowned`.\n\n*See also:* Q16 (Q16's objective locations hang on Q3's journal objectives); PR7 (Two journals: Q3's quest log with MPQJOURNAL and PR7's JOURNAL with MPJOURNAL and automatic quest entries).", "d": "yes", "note": ""}, {"id": "Q4", "theme": "Q", "title": "Per-character quest status and outcome", "kind": "script function, script command", "value": "high", "effort": "medium", "body": "**Today.** The only per-character record is the winners map, name to last win time. Nothing records a failed or abandoned quest, or how it ended. `MPQSET * STATISTICS FAILED` only bumps a counter. Builders use tattoos (MPTATTOO, HASTATTOO) and MPSETVAR instead. A KEYPLAYER death always resets the whole quest, which suits a server event, not 'the escort died, you failed'.\n\n**Add.** Per character: status ACTIVE, WON, FAILED or ABANDONED, an outcome word and a game-calendar time, saved with the winners. `MPQUESTWIN $n <quest> (OUTCOME <word>)`. `MPQUESTFAIL $n <quest> (<reason>)` does the MPENDQUEST $n cleanup and fires QUESTFAIL_PROG. Functions `QUESTSTATUS($n quest)` and `QUESTOUTCOME($n quest)`, with $% %-forms. Masks +QUESTFAIL/-QUESTFAIL and +QUESTOUTCOME \"quest:word\". `GIVE STAT KEYPLAYER FAIL` fails the quest for those on it; TRUE still resets. `QUESTS FAILED`, and outcomes in QUESTS WON.\n\n**Example.** Merchant Oskar's escort has KEYPLAYER FAIL. If he dies, his widow's GREET_PROG tests `QUESTSTATUS($n oskar == FAILED)` and blames the player. In 'Bandits of the Fen', `MPQUESTWIN $n bandits OUTCOME spared` puts the chief in town as a guard.\n\n*See also:* ST5, Q11, JS18 (Quest outcome hooks overlap: ST5's QUEST_PROG FAIL and END EXPIRED, Q4's QUESTFAIL_PROG, Q11's QUESTTIMEOUT_PROG, and JS18's onQuestFail and onQuestEnd in JavaScript); Q8, Q11, Q12, Q15 (These use Q4's per-character quest status (WON, FAILED, ABANDONED, EXPIRED) and MPQUESTFAIL).", "d": "yes", "note": ""}, {"id": "Q5", "theme": "Q", "title": "Repeatable quests with win counts and game-time cooldowns", "kind": "quest feature, script function", "value": "medium", "effort": "small", "body": "**Today.** Winners keep only the last win time, with no count, and scripts can only ask QUESTWINNER, yes or no. Templates repeat by testing $MULTIPLE in every check. The stored time is GameTime.now(), not the game calendar, so 'once per game day' cannot be said. Workarounds: an achievement with EVENT=\"QUESTOR\" NUM=10 for a count, and a timed tattoo such as `MPTATTOO $n 1200 WOLF_CD` for a cooldown.\n\n**Add.** A win count and a game-calendar time per winner. Quest settings `SET REPEATABLE NO|YES|<game time, e.g. 1 mudday>` and `SET MAXWINS <n>`, checked by canAcceptQuest before CAN_ACCEPT. Functions `QUESTWINS($n quest)` and `QUESTWINAGE($n quest)` (game hours since the last win), and a mask +QUESTWINS \"quest:>=10\". QUESTS WON shows the counts.\n\n**Example.** 'Wolf bounty' at the ranger lodge has REPEATABLE 1 mudday and MAXWINS 10. After ten bounties, 'The Wolf King' opens with PLAYERMASK +QUESTWINS \"wolf_bounty:>=10\".\n\n*See also:* Q1 (Both control whether and when a quest can be done again (SET RESTART vs SET REPEATABLE and MAXWINS)).", "d": "yes", "note": ""}, {"id": "Q6", "theme": "Q", "title": "Named steps and jumps for branching", "kind": "quest feature", "value": "medium", "effort": "small", "body": "**Today.** Steps are numbered by position. STEP takes only BREAK, BACK and AUTO, and MPSTEPQUEST skips (+N) or jumps (=N) by number only; those two forms are documented nowhere. Inserting a step breaks every jump, a spare-or-kill branch must jump to a number, and the save holds only STEPNUM.\n\n**Add.** `STEP <label>` and `STEP AUTO <label>` name the step that follows. `MPSTEPQUEST <quest> =<label>` jumps to it. `STEP GOTO <label>` ends a branch, so the next step is the label. `QVAR(quest STEPNAME == label)` and `$%QVAR(quest STEPNAME)%` read the current one. Saves store the label as well as the number, so an edited file still restores to the right step.\n\n**Example.** In 'Bandits of the Fen', step 'confront' offers MPCHOOSE spare or kill. The script runs `MPSTEPQUEST bandits =spared` or `=slain`. Each branch loads its own mobs and ends with `STEP GOTO epilogue`.\n\n*Re-checked against the code after writing: accurate.*\n\n*See also:* DT2 (DT2's MODIFY QUEST STEP <label> needs Q6's named steps).", "d": "yes", "note": ""}, {"id": "Q7", "theme": "Q", "title": "Control re-offers and accept a declined quest later", "kind": "property, player command", "value": "medium", "effort": "small", "body": "**Today.** Prop_QuestGiver on an area offers once per character, remembered only in memory, so a 'No' at the area border loses the quest. On a room or exit it asks again on every entry. A GenQuestBoard lists every running quest the reader can accept, and TRIGGER=SPEAK on the giver re-offers when the player talks, but no player command lists past offers.\n\n**Add.** Prop_QuestGiver `REOFFER=ALWAYS|ONCE|<game time>`, with offers kept in the save. Player commands `QUESTS OFFERED`, which lists quests offered and still acceptable through canAcceptQuest, and `QUESTS ACCEPT <n|name>`, which calls acceptQuest. Reading a quest board entry adds it to OFFERED.\n\n**Example.** Entering the swamp offers 'The Drowned Bell' and Mira says no. After talking to Ned she types QUESTS OFFERED, then QUESTS ACCEPT 1.\n\n*See also:* S1 (Both save which quests Prop_QuestGiver has offered (REOFFER offers vs OFFERED:<name> quest vars)).", "d": "yes", "note": ""}, {"id": "Q8", "theme": "Q", "title": "Prop_QuestItem: bound quest items", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** A carried quest item can be dropped, sold, given or junked unless the builder stacks Prop_Undroppable, Prop_Unsellable and Prop_ItemBinder DEATHKEEP=TRUE (or bundles them in Prop_MultiEffects) and blocks give and junk with a CNCLMSG_PROG. It is cleaned up only if registered with `MPQSET * QUESTOBJ $o`, and then only when the whole quest stops.\n\n**Add.** `Prop_QuestItem QUEST=<name> (NODROP NOSELL NOGIVE) (REMOVEON=WON,FAILED,ENDED) (KEEPONDEATH)`. It blocks those actions with a message, stays with the character on death, vanishes when the holder's quest leaves ACTIVE, and is listed under QUESTS <name>. REMOVEON needs the per-character quest status item.\n\n**Example.** The sunken bell has `Prop_QuestItem QUEST=bell NODROP NOSELL REMOVEON=WON`. It cannot be pawned, and it leaves the pack when the priest takes it.\n\n*See also:* Q4, Q11, Q12, Q15 (These use Q4's per-character quest status (WON, FAILED, ABANDONED, EXPIRED) and MPQUESTFAIL).", "d": "yes", "note": ""}, {"id": "Q9", "theme": "Q", "title": "Quest QUIET fix and a quest-script help page", "kind": "quest fix and documentation", "value": "medium", "effort": "small", "body": "**Today.** In DefaultQuest, `SET QUIET ON/OFF` sets the quiet flag from the OPTIONAL state (`q.beQuiet=optional`, line 1131). Some features are found only in the code: MPSTEPQUEST's +N/=N forms, MPQUESTWIN -name (removes a win), TIME_REMAINING_TYPE, QUEST_TIME_PROG -1/-2, and MPRUN and JCONSOLE as test tools. MPSTEPQUEST is missing from AHELP's command list and Scriptable.html. The rest is scattered over Scriptable.html, ArchonGuide.html and GameBuildersGuide.html, which still describes MUDGrinder and online-player rules.\n\n**Add.** The QUIET fix. A CoffeeSUD quest page, AHELP QUESTSCRIPT and a guide section, that walks one single-player story quest from offer to reward, gathers these features and the new ones, and drops the MUDGrinder and online-player text.\n\n**Example.** A builder reads AHELP QUESTSCRIPT and writes a two-branch quest without opening the Java.\n\n*See also:* SC9, ST5 (Q9, SC9 and ST5 each ask to document MPSTEPQUEST or QUEST_TIME_PROG's -1 and -2 codes; write it once).", "d": "yes", "note": ""}, {"id": "Q10", "theme": "Q", "title": "Declarative quest rewards, shown when offered", "kind": "quest feature, script command", "value": "medium", "effort": "medium", "body": "**Today.** Rewards are scripted by hand at turn-in, with mpexp, mpfaction, mpoload and give. Offers, boards and QUESTS cannot say what a quest pays, beyond hand-written text in MESSAGE= or INSTRUCTIONS. A hidden EVENT=\"SCRIPTED\" achievement granted by `MPACHIEVE $n <id> 1` gives a one-line reward, but only once per character, with no faction or catalog item award.\n\n**Add.** `SET REWARDS \"<awards>\"` in the achievements' award syntax (CURRENCY, XP, QP, TITLE, ABILITY, EXPERTISE, STAT, TATTOO, ITEM, MOB), plus FACTION:<id>:<+n> and ITEM:<catalog name>. `MPQUESTWIN $n quest REWARD` grants them with one standard message; `MPREWARD $n \"<awards>\"` gives ad-hoc ones. Prop_QuestGiver DETAILS, quest boards and QUESTS show 'Reward:'. It reuses Achievements.parseAwards and the grant code, made public on the library.\n\n**Example.** `SET REWARDS \"100 CURRENCY 15% XP ITEM:silver_bell_charm FACTION:Brenn:+200\"`. Ned's turn-in becomes `MPQUESTWIN $n bell REWARD` instead of fifteen lines.\n\n*See also:* P5 (Both extend Achievements.parseAwards' award syntax (FACTION, catalog ITEM, SCRIPT, VAR, RECIPE)).", "d": "yes", "note": ""}, {"id": "Q11", "theme": "Q", "title": "Per-character quest deadlines", "kind": "script command, script trigger", "value": "medium", "effort": "medium", "body": "**Today.** The only time limit is the quest's global SET DURATION, counted from the quest's start, not from when the player accepted. A per-character deadline today is a timed tattoo, `MPTATTOO $n 360 MEDICINE_DUE`, which follows the game clock and is saved. The script polls `!HASTATTOO` from a RAND_PROG and sets TIME_REMAINING by hand for QUESTS. DELAY_PROG timers are not saved.\n\n**Add.** `MPQTIMER $n <quest> <game time>` and `MPQTIMER $n <quest> OFF`. QUESTS shows time left in game hours or days. On expiry, QUESTTIMEOUT_PROG <quest> fires on the player's quest scripts; with no such trigger, the quest fails with reason EXPIRED. The timer is saved with the character and runs on the game clock, so pause and turn-based time hold.\n\n**Example.** A courier job runs `MPQTIMER $n medicine 6 mudhours`. If the medicine is late, the patient dies: QUESTTIMEOUT_PROG medicine fails the quest and junks the vial.\n\n*See also:* ST5, Q4, JS18 (Quest outcome hooks overlap: ST5's QUEST_PROG FAIL and END EXPIRED, Q4's QUESTFAIL_PROG, Q11's QUESTTIMEOUT_PROG, and JS18's onQuestFail and onQuestEnd in JavaScript); Q4, Q8, Q12, Q15 (These use Q4's per-character quest status (WON, FAILED, ABANDONED, EXPIRED) and MPQUESTFAIL).", "d": "yes", "note": ""}, {"id": "Q12", "theme": "Q", "title": "Quest credit for the party or the whole profile", "kind": "quest feature", "value": "medium", "effort": "medium", "body": "**Today.** Accepting, winning, QUESTWINNER and +QUESTWIN are keyed by character name. With a party or several characters in the profile, the leader's quest does not count for the others, and a story quest won by one character is open again to another. Builders write MPACCTATTOO and HASACCTATTOO checks, or MPSCRIPT each party member by hand in DO_ACCEPT.\n\n**Add.** `SET SHARED NONE|PARTY|PROFILE`. NONE keeps today's behaviour. PARTY gives the tracking script and log to every party member present on accept, and MPQUESTWIN and MPQUESTFAIL apply to the party. PROFILE makes QUESTWINNER, QUESTSTATUS and the masks answer for any character of the profile, and shows the log to all of them.\n\n**Example.** 'The Drowned Bell' is SHARED PROFILE, so once Mira wins, the chapel treats her alt Tobin as the bell's saviour. 'Wolf bounty' is SHARED PARTY, so all four party members are paid.\n\n*See also:* Q4, Q8, Q11, Q15 (These use Q4's per-character quest status (WON, FAILED, ABANDONED, EXPIRED) and MPQUESTFAIL).", "d": "yes", "note": ""}, {"id": "Q13", "theme": "Q", "title": "Single-player story templates for the Quest Maker", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** The 74 templates in resources/quests/templates cover the old goal types. Some shapes exist: normal_travel1 (explore), normal_travel2 (talk to), normal_delivery1-4 (hand over), normal_killer1/2 with $MULTIPLE YES (repeat kills, no cooldown). There is no multi-stage chain, choice or use-an-item-here template. The competitive_* ones race players on QUESTCHAT, and $QUEST_ANNOUNCECHANNEL lines target channels the fork removed.\n\n**Add.** story_talk1 (with an optional hand-over), story_chain1 (N stages, each with giver, goal and journal text), story_choice1 (two outcomes via MPCHOOSE, with their own rewards, factions and outcome), story_useitem1 (use or put an item in a room), story_explore1, and story_bounty1 (repeatable kill count with a cooldown). They use the journal, status and rewards when those exist, plain MOBPROG otherwise. A `#!QUESTMAKER_MODE` header lets the list hide competitive_* in single-player.\n\n**Example.** CREATE QUEST, pick story_choice1, enter 'bandit chief' with outcomes 'spare' and 'kill'. The wizard writes one self-contained world/quests/bandits.quest.", "d": "yes", "note": ""}, {"id": "Q14", "theme": "Q", "title": "Quest board with generated jobs, refreshed daily", "kind": "behaviour, generator", "value": "medium", "effort": "medium", "body": "**Today.** StdQuestBoard and GenQuestBoard list every running quest the reader can accept, with filters such as SAREAMASK, TYPFILTER and CATFILTER, and READ board <n> offers to accept. RandomQuests MINQUESTS=3 MAXQUESTS=3 EXPIRE=... on a mob or area gives it a rotating set. But EXPIRE is a duration, not a calendar refresh, templates get no player context, generated quests do not persist, and the RandomQuests core-count bug blocks it on 1 to 3 core machines.\n\n**Add.** A QuestBoard behaviour or property for an item or room: `COUNT=3 REFRESH=MUDDAY:1 TEMPLATE=normal VARS=\"...\" FILE= TAGID=`. It keeps COUNT quests generated through the fixed RandomQuests, lists them on READ or LOOK, and the player takes one with ACCEPT <n>; a new one comes at the next refresh. Templates get $PLAYER_LEVEL, $PARTY_SIZE, $PLAYER_FACTION_<id> and $QUESTS_DONE. Taken quests persist through gen-persist-quests.\n\n**Example.** The Mercenaries' Guild board in Port Halden always shows three jobs, an escort, a collection and a kill, at the party's level, with a new one each morning.\n\n*See also:* G2, S8 (Q14's quest board needs G2's RandomQuests fix and S8's saved generated quests).", "d": "yes", "note": ""}, {"id": "Q15", "theme": "Q", "title": "Undroppable main quests and a working drop hook", "kind": "quest feature, script function", "value": "low", "effort": "small", "body": "**Today.** QUESTS DROP works on any accepted quest, the main story included. DO_DROP runs only for scripts whose quest no longer exists, never on the confirmed drop. The confirmed drop does run `QUEST_TIME_PROG <quest> -1` and `-2` on the tracking script, which can serve as a hook, but these also fire on MPENDQUEST $n, so telling a drop from a turn-in needs a var.\n\n**Add.** `SET DROPPABLE FALSE`, so QUESTS DROP refuses. A FUNCTION_PROG CAN_DROP: a non-empty return refuses the drop and is shown to the player. DO_DROP is called on the confirmed drop, and the status ABANDONED is recorded.\n\n**Example.** The main story cannot be dropped. Dropping the side delivery runs DO_DROP, which takes back the parcel.\n\n*See also:* Q4, Q8, Q11, Q12 (These use Q4's per-character quest status (WON, FAILED, ABANDONED, EXPIRED) and MPQUESTFAIL).", "d": "yes", "note": ""}, {"id": "Q16", "theme": "Q", "title": "Objective locations and QUESTS WHERE", "kind": "presentation, world option", "value": "low", "effort": "small", "body": "**Today.** QUESTS shows no location. The giver's room and area appear in the offer text of Prop_QuestGiver and quest boards. The giver's name and area also reach QUEST <name>: in all normal_ and nearly all competitive_ templates (48 of 74), the giver's ONCE_PROG runs `MPQSET * INSTRUCTIONS $i in $a wants you to '...'`. A builder can write $%QVAR(quest MOB_ROOMID)% into INSTRUCTIONS or PROGRESS. Prayer_SeekersPrayer reveals quest-givers, and the tracking library backs MPTRACKTO for mobs, but nothing in the quest system points the player at an objective. Concierge already gives a route to a room through the tracking library ('The way to X from here is: ...'), and class skills such as Ranger_Track let a player track a named mob.\n\n**Add.** An objective option `AT=<roomID|area|questobj:MOB>`, on the journal's objectives. QUESTS shows 'in <area>', and `QUESTS WHERE <n>` gives the first direction toward it through the tracking library. A world option `QUESTTRACK=OFF|AREA|PATH` sets how much is shown. It depends on the quest journal item.\n\n**Example.** 'Return the bell to the chapel (Brenn, Chapel of Tides)'. QUESTS WHERE 1 answers 'The chapel lies to the north-east.'\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* Q3 (Q16's objective locations hang on Q3's journal objectives).", "d": "yes", "note": ""}, {"id": "N1", "theme": "N", "title": "WHEN= condition on every behaviour", "kind": "behaviour", "value": "high", "effort": "small", "body": "**Today.** A builder cannot say \"this wolf roams only at night\". ActiveTicker reads only min, max, chance and mingrp. Of about 95 behaviours, only GateGuard (allnight), Scavenger (ATNIGHT), BribeGateGuard and ResetWhole read the clock. Zapper masks know +HOUR, +SEASON, +WEATHER and -IF, but behaviours test masks on their targets, never on their host. The workarounds: a TIME_PROG that swaps behaviours with MPBEHAVE and MPUNBEHAVE, which after a restore waits for the next listed hour; Prop_ClosedSeason, which hides the whole mob; or two mobs.\n\n**Add.** Shared parameters, read in StdBehavior and ActiveTicker.canAct and in the StdBehavior-based mob behaviours (the Aggressive family, Wimpy, Vagrant, the helpers, the guardians). `WHEN=\"<zapper mask>\"` is tested on the host (mob, item or room). The shorthands are `TOD=DAWN|DAY|DUSK|NIGHT` and `HOURS=a-b`. While the condition fails, the behaviour neither ticks nor reacts. For the opposite case, add a second copy with the opposite condition.\n\n**Example.** A werewolf has `MobileAggressive TOD=NIGHT -NPC` and `Mobile TOD=DAY min=20 max=40`. A storm elemental has `Aggressive WHEN=\"+WEATHER -THUNDERSTORM\"`.\n\n*See also:* I4 (Alternatives for behaviours active only while a condition holds: a WHEN= parameter on every behaviour, or a Prop_When wrapper).", "d": "yes", "note": ""}, {"id": "N2", "theme": "N", "title": "MPMENU: numbered dialogue choices that do not block", "kind": "script command", "value": "high", "effort": "medium", "body": "**Today.** `MPCHOOSE <who> <var> <choices> <default> <prompt>` takes single letters or a comma list, and the builder writes the menu into the prompt by hand. Hiding an option needs an IF around each `mpechoat` line. MPCHOOSE, MPPROMPT and MPCONFIRM wait on the player's session on the single game thread. When their real-time timeout runs out (60 s or 360 s), the rest of the script is aborted.\n\n**Add.** `MPMENU <pc> <FUNCTION> \"<prompt>\" <key>:\"<label>\"[IF <cond>] ... [default]`. It shows the options numbered, hides those whose condition fails, takes a default or escape key, and returns at once. The chosen key goes to that FUNCTION_PROG as $0, with the original $n and $i. The menu is shown on the player's terminal and costs no time in turn-based mode. JavaScript reaches it by name, like any MP command. `MPDIALOG <pc> <file> [node]` opens a node of a dialogue tree (N14). This part waits for N14, which is in `LATER.md`. MPCHOOSE stays.\n\n**Example.** The old sage's GREET_PROG runs `MPMENU $n SAGE \"The old sage regards you.\" tower:\"Ask about the tower\" ring:\"Show him the ring\"[IF HAS($n ring)] bye:\"Leave\" bye`. FUNCTION_PROG SAGE then branches with `SWITCH $0`.\n\n*See also:* N14 (later), N9, N29 (N2's MPDIALOG, N9's TALK fallback and N29's CHECK= on choices all hook into N14 (later)'s dialogue trees).", "d": "yes", "note": ""}, {"id": "N3", "theme": "N", "title": "Schedule behaviour: daily routines over several places", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** Prop_ClosedDayNight gives an NPC two states. It is open at its start room and closed at HOME=, which it reaches with Skill_Track. It has SLEEP, SIT, LOCKUP, SHOPMSG= and HOURS=a-b. It checks the hour every tick, so it catches up after a restore or a WAIT. Patroller has no idea of time. A third place takes a TIME_PROG per hour with MPTRACKTO and MPFORCE sit, which must cope with fights and failed paths. TIME_PROG fires only on the hour.\n\n**Add.** Behaviour `Schedule`, with ';'-separated entries `WHEN: PLACE [ACTIVITY] [SAY/EMOTE text]`.\n- WHEN: DAWN, DAY, DUSK, NIGHT or hours (2-3), optionally with DAYS=, SEASON=, WEATHER=, HOLIDAY= or MASK=.\n- PLACE: a room id, HOME, START or ANY:<room mask>.\n- ACTIVITY: SLEEP or SIT [on item], WANDER n, SHOP (closed elsewhere, with SHOPMSG), WORK \"emote|emote\", LOCK or HIDE.\n\nIt travels with Skill_Track, suspends Mobile on the way (MobileBehavior.suspendMobility) and goes back to the routine after a fight. On load, restore, a time jump or an area waking up, it puts the NPC at the current entry at once, and walks only if the player is near. `STAT($i SCHEDULE)` reads the current entry.\n\n**Example.** `Schedule DAWN: Mill#2 WORK \"pours grain into the hopper|wipes flour from his hands\"; DAY: Market#5 SHOP; DUSK: Inn#1 SIT \"stool\" SAY \"Long day.\"; NIGHT: Mill#9 SLEEP \"straw bed\" LOCK`. A player who needs flour at night has to wake the miller at the mill.\n\n*See also:* N8, N16 (N16's day and night patrol routes overlap N3's Schedule, and N8's catch-up moves both when an area wakes).", "d": "yes", "note": ""}, {"id": "N4", "theme": "N", "title": "Sleeper behaviour: sleeping NPCs woken by noise", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** A mob can start asleep (the IS_SLEEPING disposition). Prop_ClosedDayNight SLEEP sleeps by the hour, and Vagrant naps at random. Only an attack, or the player's WAKE, wakes one. Noise exists as MSG_NOISE (Trap_Noise, Thief_SetAlarm, Spell_Alarm), but no sleeper hears it. The sleeper's own scripts cannot react either, because isFreeToBeTriggered needs it awake. The workaround is a room Scriptable whose ALL_GREET_PROG or EXECMSG_PROG runs `MPFORCE ogre stand` on a RAND.\n\n**Add.** Behaviour `Sleeper`.\n- When it sleeps: `ALWAYS`, `TOD=NIGHT` or `HOURS=a-b`, with `BED=\"item name\"`.\n- What wakes it: `WAKEON=ATTACK,NOISE,ENTER,LIGHT,TOUCH`, with `WAKECHANCE=n` per event. Fighting or shouting here or next door raises the chance; the intruder's Sneak or Hide proficiency lowers it.\n- `DEEP`: only an attack wakes it.\n- On waking: `GRUMBLE=\"text\"`, `AWAKEFOR=n` ticks before it sleeps again, and `ALARM`, which hands over to Sentry (N5).\n\nLOOK shows \"is sleeping soundly\" or \"stirs\".\n\n**Example.** A cave ogre has `Aggressive` and `Sleeper ALWAYS WAKEON=NOISE,ENTER WAKECHANCE=40 GRUMBLE=\"Who disturbs Grok?\" ALARM`. A thief sneaks past him. A fight in the next cave wakes him.\n\n*See also:* N5 (N4's ALARM option hands over to N5's Sentry, and Sentry wakes N4's sleepers).", "d": "yes", "note": ""}, {"id": "N5", "theme": "N", "title": "Sentry behaviour: lookouts who spot sneakers and raise the alarm", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** No behaviour spots intruders or rouses a camp. ProtectedCitizen acts only while its own host is fighting. It yells and moves the first matching guard in each room within RADIUS (7) one step closer per call. Arrest notices crimes only in areas with law. Thief_SetAlarm and Spell_Alarm make noise, but no NPC reacts to it. A builder cannot set up a camp where the player silences the lookout first, or where the camp wakes when the player fails.\n\n**Add.** Behaviour `Sentry`.\n- `SPOT=n`: the chance per tick to notice hidden or sneaking characters here and next door, against their Hide or Sneak proficiency.\n- `ALARM=\"RADIUS=6 MASK=-NAME +bandit MSG=Intruders!\"` and `ALERTTICKS=n`. On alarm, matching mobs in the radius become alert for that time. They wake (Sleeper), pause Schedule or Patroller, head for the alarm room and attack the party.\n- `ALARMITEM=\"a brass gong\"`: a room item that anyone, the player too, can ring to set off the alarm.\n\nThe alarm sends a room message that EXECMSG_PROG can catch.\n\n**Example.** Watchtower bandit: `Sentry SPOT=30 ALARM=\"RADIUS=6 MASK=-NAME +bandit MSG=Intruders! To arms!\" ALERTTICKS=40`. Kill or charm the lookout quietly and the camp can be taken tent by tent.\n\n*See also:* N4 (N4's ALARM option hands over to N5's Sentry, and Sentry wakes N4's sleepers).", "d": "yes", "note": ""}, {"id": "N6", "theme": "N", "title": "Memory behaviour: NPCs remember what each character did", "kind": "behaviour", "value": "high", "effort": "medium", "body": "**Today.** Factions already hold grudges for a group, and they survive saves. CHANGEn= triggers (KILL or MURDER of masked targets, BRIBE, TALK, any message type) and REACTIONn= lines (Aggressive toward a range) can turn a village against a killer. +/-FACTION masks feed shop ignore masks. One NPC remembering one character is hand scripting: ACT_PROG, GIVE_PROG, DAMAGE_PROG and DEATH_PROG with `MPSETVAR $i MEM_$n` on every mob. The INDIVIDUAL ('*') variable scope is not saved. Bribes are kept by name in memory only, and a Truce lasts 30 s.\n\n**Add.** Behaviour `Memory`. Per character it records MET (first and last game date), ATTACKED, HURT, HEALED, GAVE (total value), STOLE, KILLEDKIN (`KIN=<mask>`), TALKED, and custom `TRACK=NAME:<regex on the action text>`. Facts are script variables in a saved scope, read as `VAR($i MEM_ATTACKED_$n)`. `FORGET=30d` makes them fade. Ready-made reactions:\n- `HOSTILEIF=`;\n- `GREETIF= \"text\"`;\n- `REFUSEIF= \"text\"`, which refuses buying, selling and teaching through okMessage.\n\n`SHARE=AREA|MASK` passes facts on to kin. For village-wide grudges the docs point to factions.\n\n**Example.** On a village: `Memory KIN=\"-NAME +villager\" SHARE=AREA HOSTILEIF=KILLEDKIN>0 REFUSEIF=STOLE>0 FORGET=60d`. Steal once and the shops refuse you for two months of game time.\n\n*See also:* ST21 (Both keep a saved per-NPC, per-character record of meetings (times met, first and last game date)); N15 (Both track one NPC's view of each character (remembered deeds vs an affinity score); N15's rules could read N6's facts).", "d": "yes", "note": ""}, {"id": "N7", "theme": "N", "title": "GenBehavior: named behaviours with parameters, defined as data", "kind": "data file, behaviour, builder tool", "value": "high", "effort": "medium", "body": "**Today.** custom.cmare holds generic races, classes, abilities and commands, but no behaviour. A routine is reused through a Scriptable with `LOAD=progs/tollkeeper.script`, one file for every user. Per-mob values go in an inline prefix, `ONCE_PROG;MPSETVAR $i price 20;~;LOAD=...`, and the script reads them as `$<$i price>`. A GenAbility's SCRIPT also runs as a permanent effect. But the file lives in resources/progs, outside the world, and nothing names it, lists it or declares its parameters.\n\n**Add.** `GenBehavior`, made with `CREATE BEHAVIOR <ID>` in builder mode and kept in custom.cmare (or world/custom/behaviors/). Its fields:\n- a name, and HELP shown by AHELP;\n- CANIMPROVE: mobs, items, rooms, areas;\n- PARMS with defaults (`price=20;exit=north`);\n- SCRIPT, in MOBPROG or JavaScript, which reads the parameters as `PARM(price)` or `$%PARM(price)%`.\n\nEach instance has its own engine and variables. It goes wherever a behaviour ID goes: MODIFY, MPBEHAVE, quest GIVE BEHAVIOR, faction AFFBEHAV, plane BEHAVE, holidays. A smaller form would be a registry of named Scriptable templates.\n\n**Example.** Define `TollKeeper` once. Five bridge guards get `TollKeeper price=20 exit=north`, `TollKeeper price=5 exit=west` and so on. One fix to the script fixes them all.\n\n*See also:* SC13, P1, JS9 (Four ways to give a shared script or effect per-instance parameters (SC13's ARG(), N7's PARM(), P1's EFFECTPARM(), JS9's parms); decide them together).", "d": "yes", "note": ""}, {"id": "N8", "theme": "N", "title": "Catch-up hook when an area wakes", "kind": "JavaScript hook, world option", "value": "high", "effort": "medium", "body": "**Today.** An area that no player has visited for PASSIVEMINS game minutes turns PASSIVE. There, only Mobile and its family, Aggressive, VeryAggressive and MovingRoom stop. Scripts keep running (runInPassiveAreas defaults to true), and so do TIME_PROG, Prop_ClosedDayNight and Patroller, so a baker on those is in place when the player returns. PASSIVEMINS is an area stat, DISABLE=PASSIVEAREAS turns passivity off, and in turn-based time WAIT moves every area. What is left: wanderers and aggressive mobs stay frozen where they were, and no behaviour is told how long its area slept.\n\n**Add.** When an area turns ACTIVE again, each of its behaviours and properties gets `catchUp(elapsedTicks)`, which JavaScript behaviours can override:\n- Schedule (N3) moves NPCs to the current entry.\n- Patroller jumps to the step it would have reached.\n- Sleeper and Prop_ClosedDayNight apply the current hour.\n- Spawners refill.\n\nA per-area `CATCHUP=ON|OFF`, next to PASSIVEMINS, is secondary.\n\n**Example.** Leave the village at dusk and come back at noon. The miller is already at the market and the night watch is in bed, though the village was not simulated while you were in the dungeon.\n\n*See also:* N3, N16 (N16's day and night patrol routes overlap N3's Schedule, and N8's catch-up moves both when an area wakes); ST24 (Both catch up on time that passed while a host or area was not ticking (catchUp(elapsedTicks) vs EVERY_PROG CATCHUP)).", "d": "yes", "note": ""}, {"id": "N9", "theme": "N", "title": "TALK command and TALK_PROG trigger", "kind": "script trigger and command", "value": "high", "effort": "medium", "body": "**Today.** ASK and SAYTO already address one NPC. `ask innkeeper about mine` fires the NPC's SPEECH_PROG on \"mine\" and MudChat's targeted path, even in a full party room. A GenCommand TALK in world/custom.cmare can run `sayto <npc> hello`. Three things are missing:\n- a trigger that knows a conversation has begun, and on what topic;\n- a remembered partner: a bare `'text` has no target, and MudChat ignores untargeted speech with three or more characters in the room;\n- a way to learn what an NPC offers.\n\n**Add.** A player command `TALK [npc] [ABOUT topic]` that fires `TALK_PROG [topic words|ALL]` on the NPC, with $n the player, $i the NPC and $t the topic. If no TALK_PROG runs, it falls back to the NPC's dialogue tree (N14; until that is built, this step is skipped), then to MudChat as if the player had said \"hello\". TALK sets the conversation partner, so a bare `'text` goes to that NPC while both are in the room. The player's own party is never picked. With no tree, TALK shows a service menu, each entry running the normal command: shop (LIST, BUY, SELL), banker, trainer or MOBTeacher, Hireling terms, and quests from Prop_QuestGiver or quest mobs.\n\n**Example.** `talk innkeeper` fires TALK_PROG ALL; `talk innkeeper about mine` fires TALK_PROG mine. Then `'any rooms free?` reaches the innkeeper with two companions in the room.\n\n*See also:* ST21 (ST21 counts a TALK as a meeting and keeps the last topic, which N9's TALK command supplies); N14 (later), N2, N29 (N2's MPDIALOG, N9's TALK fallback and N29's CHECK= on choices all hook into N14 (later)'s dialogue trees); N24 (N24's topic list is shown by N9's TALK, or ASK, with no topic).", "d": "yes", "note": ""}, {"id": "N10", "theme": "N", "title": "Replies arrive at once in turn-based time", "kind": "world option", "value": "high", "effort": "medium", "body": "**Today.** In TIMEMODE TURNS a SAY costs 0.2 ticks. A script reply waits 1 tick and a MudChat reply 2 (RESPONSE_DELAY), plus any LLM time. So the answer comes up to 5 actions later from a script and 6 to 10 from MudChat, and WAIT does not stop when an NPC speaks. Scriptable can already reply at once: `MPSETINTERNAL NODELAY true` in a ONCE_PROG per script, or SCRIPTABLEDELAY in DISABLE= in coffeemud.ini for the whole game. DEFCMDTIME tunes command costs. An exception such as `DEFCMDTIME=Say 1.0, 0.20` does bring a script reply on the same turn (Say 2.0 for MudChat), but only by letting the whole world move a full tick on each SAY. MudChat has no setting.\n\n**Add.** A setting `DIALOGUETIME=INSTANT|TICKS`, also available as `TIMEMODE DIALOGUE INSTANT`. It defaults to INSTANT in turn-based time. When INSTANT, replies to the player's speech run before the next prompt without moving the clock. That covers replies queued by MudChat, by Scriptable (SPEECH, GIVE, BRIBE, SOCIAL, and TALK if N9 adds it) and by the Dialogue behaviour if N14 adds it. Long LLM replies show \"<npc> is thinking...\" and still land before the prompt. MudChat gets `DELAY=n` (ticks), and WAIT stops early when an NPC speaks to the player.\n\n**Example.** In a turn-based dungeon, `sayto troll riddle?` gets the riddle on the next line. The goblins in the next room get no free turn.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* N25 (later) (Both make NPC replies land before the next prompt in turn-based time, N25 (later) for LLM replies).", "d": "yes", "note": ""}, {"id": "N11", "theme": "N", "title": "MudChat: readable conditions, script effects and per-player saved state", "kind": "behaviour, data file", "value": "high", "effort": "medium", "body": "**Today.** A chat entry's condition is a zapper mask between slashes, +IF included, evaluated with the speaker as $n. It works, but `)`, `&` and `|` inside it need a backslash, and the mask is lowercased. Replies cannot run MOBPROG commands, because `!` commands fail the security check. The workaround is a Scriptable SPEAK_PROG on the same NPC that fires on its own line, with $t the player. `$@group` switches belong to the NPC, not the speaker. They expire after six minutes and are not saved.\n\n**Add.**\n1. A guard line `?<scriptable expression>` before an entry, with $t the speaker, e.g. `?QUESTSCRIPTED($t mine) and VAR($t MET)==1`.\n2. A reply operator `&` that runs the rest of the line as a MOBPROG command, with the NPC as the monster and the speaker as $n.\n3. `$@group` kept per speaker. `$@!group` is permanent until changed and kept in a saved script variable. `$@-` returns to the base group.\n\n**Example.** A mine foreman's chat file. Under `?VAR($t MINEQUEST)==done`, `(hello)` answers `9\"You're the hero of the mine!`. Otherwise `(work)` answers `9\"Clear the rats and I'll pay you.~&mpstartquest minerats$@!foreman_quest`.\n\n*See also:* N19 (Both change MudChat's chat-file parser (guards and operators vs connector and tick fixes); do them together); S9 (N11's per-speaker MudChat groups are saved through S9's behaviour STATE hook).", "d": "yes", "note": ""}, {"id": "N12", "theme": "N", "title": "Prop_NPCLines: per-NPC wording for stock service lines", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** Shopkeepers, bankers, postmen, librarians, trainers, MOBTeacher and Hireling speak fixed English, such as \"I'm not interested.\" or \"I don't buy stolen goods.\". CoffeeShops alone has 23 literal postSay calls, StdBanker 31, StdPostman 37. The only override is translation_en_TX.properties, which applies to the whole game, by Java class at best. Scriptable can add a line after a stock one but cannot cancel it, because CNCLMSG_PROG matches the message type, not the text. A gruff dwarf smith and a polite elven jeweller sound the same.\n\n**Add.** `Prop_NPCLines`, which holds `key=text` entries.\n- The key is a short ID (NOTBUYING, STOLEN, TOOPOOR, OUTOFSTOCK, HIRED, TIMEUP, BALANCE, ...) or the original text in quotes.\n- The text may give alternatives split by `|`, use @x1 and @x2 for the engine's values and $n for the customer.\n- A mask suffix gives a conditional variant, e.g. `[+AFFINITY >25]`.\n\nThe postSay calls in these classes look up the speaker's Prop_NPCLines before translation. An area-level version gives a whole town one voice.\n\n**Example.** `Prop_NPCLines NOTBUYING=\"Bah! I've no use for that junk.\"|\"Take that rubbish elsewhere.\" STOLEN=\"I know where that came from, thief.\"`\n\n*Note.* A `CNCLMSG_PROG` `<SCRIPT>` block can test the text of the live message in `objs()[0]` and cancel or reword the line (see *Already possible* in the README), so this property is a convenience, not the only route.\n\n*See also:* N21 (N21's MSG_ parameters for Hireling lines are an alternative to N12's Prop_NPCLines).", "d": "yes", "note": ""}, {"id": "N13", "theme": "N", "title": "Companion behaviour: NPC party members who take orders and comment", "kind": "behaviour", "value": "high", "effort": "large", "body": "**Today.** The companion behaviours fall short:\n- Hireling is paid and timed on the game clock.\n- Follower follows whoever leaves the room.\n- Loyalty seeks one named character, and searches every tick because its INTERVAL, (2*60)/4000, is 0.\n\nA script can make an NPC follow (`MPFORCE $i follow $n`). ORDER gives `autoguard` (wait here), NOFOLLOW and kill. Every remark can be scripted with ENTRY_PROG, KILL_PROG, HITPRCNT_PROG and VAR guards. But after PARTY LEAD, handOver re-points only the profile's characters, so NPC followers keep the old leader. There are no stances, no loyalty and no ready-made remarks.\n\n**Add.** Behaviour `Companion`:\n- `JOIN=SPEECH \"join me\"|GIVE <price>|SCRIPT`.\n- `FOLLOWS=PARTY`: follows again after PARTY LEAD, SWITCH or REST.\n- `STANCE=AGGRESSIVE|DEFENSIVE|PASSIVE`.\n- Orders: `wait here`, `follow`, `guard <name>`, `stance <x>`, `camp`, `go home`.\n- `LOYALTY=n`, moved by `LIKES=` and `DISLIKES=` event:amount pairs (KILLINNOCENT, GIFT, HEALED, LEFTBEHIND), and `LEAVEAT=n`.\n- `BARKS=`, inline or in a line file, keyed by events: ENTER_AREA, ENTER_ROOM, AFTER_KILL, LOW_HP, LEADER_LOW_HP, SEE_ITEM, SEE_MOB, REST, IDLE, QUEST_STEP or PLAYER_ACTION. Each has a chance, a cooldown and ONCE.\n- `TALK <companion>` answers \"what do you think?\" from lines keyed by area or locale.\n\nLOYALTY and STANCE are stats that scripts can read, and the state is saved. Loyalty's interval gets fixed along the way.\n\n**Example.** `Companion JOIN=SPEECH FOLLOWS=PARTY STANCE=DEFENSIVE LOYALTY=60 DISLIKES=KILLINNOCENT:-30 LEAVEAT=10 BARKS=\"Dark Wood:I hate these trees.\"`. Told `wait here`, the squire waits outside the dragon's lair.\n\n*See also:* N21 (Two NPC party-member behaviours with loyalty, orders and saved terms; Companion and a configurable Hireling overlap); P9 (Companion NPCs (N13 (later)) and recruiting an NPC into the profile (P9) are alternatives for NPC party members); N18 (Both fix Loyalty's zero interval).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N14", "theme": "N", "title": "Dialogue trees: a Dialogue behaviour and .dlg files", "kind": "behaviour, data file", "value": "high", "effort": "large", "body": "**Today.** The engine has no model of nodes and choices. Branching talk is built by hand:\n- a SPEECH_PROG or GREET_PROG state machine, with per-player MPSETVAR state and one FUNCTION_PROG per node through MPCALLFUNC;\n- menus with MPCHOOSE, MPPROMPT and MPCONFIRM, which block, and which abort the script when their 60 s timeout runs out;\n- MudChat `$@group` switches, which are per NPC and expire.\n\nConditions (IF, +IF), ONCE (a VAR guard) and checks (STAT, ISABLE, RAND) all exist. What is missing is a format that ties them together.\n\n**Add.** Behaviour `Dialogue FILE=innkeeper.dlg START=root`, reading world/dialogue/*.dlg:\n- `NODE id`;\n- `SAY` lines with $-variables and random alternatives;\n- `CHOICE` lines with a label, a condition (a zapper mask with +IF, or an IF expression), `GOTO node` or `END`, and `ONCE` per player;\n- `EFFECT` lines: MOBPROG commands with $n the player and $i the NPC, or a JavaScript block;\n- `CHECK=CHA 14` or `SKILL=Skill_Haggle 50` on a choice, with SUCCESS and FAIL nodes.\n\nChoices are shown numbered and answered through the non-blocking Session.InputCallback, as Prop_QuestGiver does, at no time cost. Each player's node and ONCE flags are kept in saved script variables. TALK (N9) opens the tree; MPDIALOG (N2) opens any node.\n\n**Example.** The innkeeper's root node offers:\n1. Ask about the mine, shown only if `QUESTSCRIPTED($n mine)` is false.\n2. Rent a room, with EFFECT `mpcallfunc RENT`.\n3. [CHA 14] Flirt for a discount. On SUCCESS it sets VAR DISCOUNT 1.\n4. Leave.\n\n*See also:* N2, N9, N29 (N2's MPDIALOG, N9's TALK fallback and N29's CHECK= on choices all hook into N14 (later)'s dialogue trees).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "N15", "theme": "N", "title": "Prop_Affinity: one NPC's opinion of each character", "kind": "property, script function, script command", "value": "high", "effort": "large", "body": "**Today.** A faction can already serve one NPC: a file such as resources/factions/smith.ini, listed in FACTIONS= in coffeemud.ini. It has:\n- RANGE bands;\n- CHANGE triggers aimed at that NPC (CMMSG on MSG_GIVE, TALK(REGEX=), BRIBE, KILL, TIME for decay);\n- REACTION lines;\n- FACTION() and MPFACTION in scripts;\n- +/-FACTION masks for MudChat, shop prejudice and ignore masks.\n\nIts values are saved with the character. But it takes one file per NPC, under resources/ instead of world/. The faction shows in FACTIONS and SCORE unless SHOWINFACTIONSCMD=FALSE, and there is no shorthand for gifts of a given item.\n\n**Add.** `Prop_Affinity` on an NPC, or on an area for a village. It holds a hidden faction-like value per NPC and character, and saves it.\n- Bands: HOSTILE<-50, COLD<0, NEUTRAL, FRIENDLY>=25, DEVOTED>=75.\n- A decay rate.\n- Rules: GIFT(item mask) +n, TALK(keyword) +n, QUESTWIN(name) +n, ATTACKED -n, CAUGHT_STEALING -n, KILLED(mob mask) -n, BRIBE per gold.\n\n`AFFINITY($i $n)` gives the number or the band, and `MPAFFINITY $i $n +5` changes it. The mask `+AFFINITY >25` tests it against the NPC in context, so MudChat, shops and Dialogue can use it. Options: `SHOPFACTOR=band:multiplier`, and `REFUSE` below a band.\n\n**Example.** The smith starts NEUTRAL. Rare ore (+10) and his quest (+30) make him FRIENDLY: prices drop 10% and a dialogue option to forge a unique blade opens. Punch him and he turns HOSTILE and will not trade.\n\n*See also:* N6 (Both track one NPC's view of each character (remembered deeds vs an affinity score); N15's rules could read N6's facts); F14 (F14's SHOWMASK and HIDDENNAME would hide a one-NPC faction, half of why N15 proposes Prop_Affinity instead of a faction).", "d": "yes", "note": ""}, {"id": "N16", "theme": "N", "title": "Patroller waypoints that wait, act and change route by time", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** A '.' in a patrol pauses one step, so a long wait is a row of dots. Room-id steps re-track from wherever the patroller is, so it finds its route after a fight. Direc
