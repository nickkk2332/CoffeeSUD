n*See also:* ST7, I9 (All three let an object's own verb (TURN, PULL, PUSH) win over stock commands and skills; one parser hook serves them).", "d": "yes", "note": ""}, {"id": "I20", "theme": "I", "title": "GenTrap: choose what springs it, and run its script with no ability", "kind": "property (and a bug fix)", "value": "medium", "effort": "small", "body": "**Today.** What springs a trap is fixed by its class: entering a room, unlocking or opening an exit or container, or getting, pushing or pulling an item (holding, for bombs). A cursed throne (sit), a trapped book (read), a painting (look) or a chest that bites when closed must be a Scriptable instead: EXECMSG_PROG SIT or LOOK_PROG, MPCAST, and a variable for \"disarmed\". GenTrap's SCRIPT also runs only inside if(able.trim().length()>0), so a trap with a script and no ABILITY does nothing.\n\n**Add.** A TRIGGERS field on GenTrap, e.g. TRIGGERS=SIT,READ,LOOK,CLOSE,WEAR,DROP,PUT,LEAVE:north. DISARM=skill|verb:\"cut red wire\" for puzzle-style disarming, plus RESET= and ONCE. Move the script call out of the ability branch so a script-only trap works.\n\n**Example.** The Usurper's Throne: sitting on it fires Spell_Curse and a script with the old king's voice, unless the seal on the throne has been broken.\n\n*See also:* C23 (C23's ambush notes that GenTrap runs its script only inside its ability branch, which I20 fixes); P3 (Both extend GenTrap scripting (TRIGGERS and DISARM vs ONTRIGGER and ONDISARM hooks)).", "d": "yes", "note": ""}, {"id": "I21", "theme": "I", "title": "Richer keys and locks: master keys, keys used up, unpickable locks", "kind": "property (and a change to key matching)", "value": "medium", "effort": "small", "body": "**Today.** A lock matches one key code exactly (getKey().equals(keyName())). A keyring counts only one container level deep, so not inside a pack. Scripts cover the rest: CNCLMSG_PROG on UNLOCK with HAS() and MPUNLOCK for a master key, UNLOCK_PROG with MPJUNK $o for a key used up, a very high lock level or a CNCLMSG_PROG for a lock no thief can pick. Prop_LocationBound already sends a key back to its room.\n\n**Add.** The core: key codes as a list (crypt;vault) or a prefix (jail.*), and keyrings found at any depth. Then, for convenience, Prop_KeyRules on a key (CONSUME=true, BREAK=10 as a percent chance, RETURN=room id, MASK=) and Prop_LockRules on exits and containers (PICK=never|level:30, KEYS=a;b, RELOCK=20, MSG=).\n\n**Example.** The jailer's master key, jail.*, opens all six cells, jail.1 to jail.6. The cursed bone key unlocks the ossuary once and crumbles.", "d": "yes", "note": ""}, {"id": "I22", "theme": "I", "title": "MPTRANSFORM: turn an item into another in place", "kind": "script command and JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** Turning one item into another takes MPJUNK and MPOLOAD, which loses its worn slot, container, state and tags. MPPUT and MPFORCE wear win some of that back, clumsily. MPM2I2M only converts between mobs and items. MPSET can rewrite a generic item in place (NAME, DESCRIPTION, USES, DISPOSITION, TAGS, AFFBEHAV and more), so a dull gem can start to glow. It cannot change the class, say GenItem to GenLightSource, or swap in a catalog item.\n\n**Add.** MPTRANSFORM <item> <catalog name|item name|fromfile ...> [KEEP=state,tags,uses,container,worn]. The item is replaced in the same place by a copy of the named item, keeping the chosen fields. The new item is $p for the rest of the script. JavaScript gets transform(item, name).\n\n**Example.** Dipping \"an unlit torch\" into the brazier turns it into \"a burning torch\", still held in the same hand.\n\n*See also:* I5, I27 (All three replace an item in place with another while keeping its state; share MPTRANSFORM's KEEP code).", "d": "yes", "note": ""}, {"id": "I23", "theme": "I", "title": "Prop_Attunement: powers that wake only once the item is attuned", "kind": "property and command", "value": "medium", "effort": "medium", "body": "**Today.** Prop_ItemBinder binds an item, but nothing makes its powers wait for a deed. Most of it can be built: masks on the item's props (Prop_WearEnabler(Spell_Haste; MASK=-TATTOOS +ATTUNED_CLOAK)), the tattoo given by Prop_TattooAdder on a shrine or MPTATTOO in a script, and Prop_LimitedEquip 3;id='attuned' to cap equipped items. Missing: attuning by rest, a cap on attuned rather than equipped items, a way to unattune, and \"requires attunement\" in identify.\n\n**Add.** Prop_Attunement, wrapping that pattern. PROPS=\"Prop_WearEnabler(Spell_Haste);Prop_WearAdjuster(dex+2)\" stay inert until attuned. HOW=REST:10 (rest ten ticks holding it), or RITUAL=\"INROOM Shrine#3 & SAY attune\", or ON=EQUIP. LIMIT=3 per character, BIND=TRUE, MSG=, MASK=. UNATTUNE <item> frees a slot.\n\n**Example.** The party finds four strong items, but each character can attune only three, so choosing is part of building the character. A druid's staff attunes only in its grove.", "d": "yes", "note": ""}, {"id": "I24", "theme": "I", "title": "Prop_ItemGrowth: items that grow with use", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** No property counts kills, hits or uses on an item. Prop_Doppleganger follows only the owner's level, and Prop_PropSetter has no counter. A script can do it: DAMAGE_PROG on the item ($g is the damage) and EXECMSG_PROG DEATH or KILL_PROG catch hits and kills, MPSETVAR and MPSAVEVAR keep the count, and at each threshold MPSET $i NAME and MPSET $i AFFBEHAV swap in stronger props. There is no way to say it as data.\n\n**Add.** Prop_ItemGrowth GAIN=KILL|HIT|USE|WORNTICK, XP=\"@x1\" (the victim's level), KILLMASK=\"-RACECAT +Undead\", STAGES=\"100:NAME='a humming blade' PROPS=Prop_WearAdjuster(dam+2);400:NAME='Dawnbringer' PROPS=...\", MSG=\"$p shudders as it grows stronger!\", BIND=CHARACTER. Progress is kept in the property's text, so saves keep it. Identify shows the stage and progress.\n\n**Example.** A rusty sword from the tutorial becomes the hero's legendary blade after 100, 400 and 1000 undead kills, with a new name and powers at each stage.\n\n*See also:* JS9 (Both make items that grow with kills: JS9's bloodblade example in JavaScript, I24 as a property).", "d": "yes", "note": ""}, {"id": "I25", "theme": "I", "title": "Prop_PressurePlate: triggers on weight and presence", "kind": "property and script functions", "value": "medium", "effort": "medium", "body": "**Today.** Room traps fire only on entering. Prop_WeakBridge checks weight only on enter and leave, GenScale compares only when looked at, and Prop_ReqCapacity only refuses entry or drops over a cap. A room script can sum STAT(x WEIGHT) over ROOMITEM and ROOMMOB in a FOR loop, called from ENTRY_PROG, EXIT_PROG, DROP_PROG and GET_PROG. It is heavy and has no release delay. There is no ROOMWEIGHT or CONTENTWEIGHT function.\n\n**Add.** Prop_PressurePlate on a room or a floor fixture: WEIGHT=>=120 (mobs there plus items on it), COUNT=>=2 (mobs), MASK= for what counts (-RACE +Golem, or items by tag), ON=\"signal plate1 down; door open here north\", OFF=, DELAY=0 (ticks before release), MSGON=, MSGOFF=. It re-checks on enter, leave, drop, get, put and ride. Also the functions ROOMWEIGHT($r) and CONTENTWEIGHT($i).\n\n**Example.** Lifting the gold idol off its plate springs the trap unless a bag of sand of equal weight is dropped on it. Or one character, sent there with AS, holds the gate open while another passes.\n\n*See also:* SC6, I9, I12 (later), I15 (The puzzle props send and receive SC6's signals (signal gate1 on, ONFULL=signal, SIGNAL inputs)).", "d": "yes", "note": ""}, {"id": "I26", "theme": "I", "title": "Durability options: wear rate, broken instead of destroyed, unbreakable items", "kind": "world option and property", "value": "medium", "effort": "medium", "body": "**Today.** Wear chances are hard-coded: per damage type and material in StdArmor, and a flat 1% per hit in StdWeapon. At 0 uses an item is destroyed (StdArmor.executeMsg, MUDFight.postItemDamage), which can delete a unique item for good. To make one nearly unbreakable, set its uses outside 0..1000 (MPSET $i USES 9999). postItemDamage then destroys it outright on any item damage, such as Freeze Metal. Or use Prop_Artifact, which brings multiplayer side effects. A CNCLMSG_PROG cannot stop StdArmor's direct wear. Mending exists: ItemMender, MEND, the mending crafts.\n\n**Add.** Ini options ITEMWEAR=0..200 (a percent multiplier, 0 for off) and ITEMBREAK=DESTROY|BREAK. With BREAK, an item at 0 is broken: unusable and without bonuses, but it can be mended. Prop_Durability MULT=50 UNBREAKABLE NOREPAIR BROKENNAME=\"a shattered %s\" sets it per item. The inventory shows condition, such as (worn) or (broken).\n\n**Example.** With ITEMWEAR=50 and ITEMBREAK=BREAK, the heirloom sword breaks in a hard fight and goes to the dwarven smith (ItemMender) instead of vanishing.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* CR3 (Both let worn items break instead of vanishing (a tool's wear:n fate vs ITEMBREAK=BREAK)).", "d": "yes", "note": ""}, {"id": "I27", "theme": "I", "title": "ItemUpgrader behaviour: upgrade paths at a smith or workbench", "kind": "behaviour and property", "value": "medium", "effort": "medium", "body": "**Today.** ItemMender, ItemRefitter and ItemIdentifier mend, refit and identify. Prop_ItemSlot adds sockets, and the Enhanced crafting expertise changes an item only as it is crafted. Nothing improves an existing item along a set path, such as +1 to +2 or a sword reforged into its awakened form. A GIVE_PROG or SPEECH_PROG on the smith can check HAS() and GOLDAMT, then MPJUNK and MPOLOAD, but that loses state and tags.\n\n**Add.** An ItemUpgrader behaviour for a mob or a fixture such as an anvil. UPGRADES=world/upgrades.txt, or inline rows of FROM=\"name|tag|catalog\", TO=\"catalog:Starfall\" or ADJ=\"dam+2 att+5\", COST=500, MATERIALS=\"starmetal ingot x3\", LEVEL=20, KEEP=state,sockets,tags and MSG=. UPGRADE SWORD shows the cost, UPGRADE SWORD CONFIRM buys. Prop_UpgradePath can carry the path on the item. KEEP= shares its code with MPTRANSFORM.\n\n**Example.** The dwarven smith turns \"a notched blade\", three starmetal ingots and 2000 gold into \"Starfall, the reforged blade\" from the catalog.\n\n*See also:* I5, I22 (All three replace an item in place with another while keeping its state; share MPTRANSFORM's KEEP code).", "d": "yes", "note": ""}, {"id": "W1", "theme": "W", "title": "Warrants and fines in scripts and masks", "kind": "script function, script command", "value": "high", "effort": "small", "body": "**Today.** Scripts can accuse with MPACCUSE, and Prop_ReqEntry or Prop_HaveZapper can accuse as their zap event. The only way to pardon is MPCAST Prayer_Forgive $n from a mob in the legal area. It clears every warrant at once and shows prayer messages. A quest can suppress a law with SET AREA and GIVE STAT SUPPRESSLAW while it runs. Nothing can ask whether the player is wanted, for what, or what they owe. Masks have +OFFICER and +JUDGE but no key for wanted.\n\n**Add.** Functions ISWANTED(who [crime]), WARRANTS(who) (a count) and FINESOWED(who), read in the legal area of the scripted object. Commands MPPARDON who [crime|ALL], quiet and per crime; MPFINE who +/-amount; MPRELEASE who; MPSUPPRESSLAW crime|ALL <duration>. Zapper keys +WANTED and -WANTED [crime], so a shop's IGNOREMASK, a gate guard or <VARIES> text can react to criminals.\n\n**Example.** A corrupt magistrate: BRIBE_PROG 500 runs MPPARDON $n ALL if ISWANTED($n). An honest shop turns away anyone wanted.\n\n*See also:* JS6, W4, W6, W12, W14, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); W26 (later), PR1 (W1's +WANTED mask is what W26 (later)'s bounty hunters need and what PR1's <WANTED> tag tests); DT21 (Both add pardoning and accusing per crime (MPPARDON and MPFINE vs LAW PARDON and LAW ACCUSE)).", "d": "yes", "note": ""}, {"id": "W2", "theme": "W", "title": "Currency file and a world default currency", "kind": "data file, world option", "value": "high", "effort": "small", "body": "**Today.** An area's CURRENCY can be a full definition or just a code. Child areas inherit it, so a parent area can serve as a world default. A code resolves from what areas define at load, or from the built-in GOLD, COPPER, CREDIT, DOLLAR and VICTORY. An area with no currency anywhere in its parent chain gets the hard-coded gold coins and Archon notes. When a code is defined twice, the first definition is kept without a warning. VALUE() knows only the sets areas made, so VALUE($n GOLD > 5) fails for the built-in ones.\n\n**Add.** A currency file loaded at boot: vocab/currencies.ini, or CURRENCY_<CODE>= lines in the world ini. Lines such as DEFAULT=CROWN, CROWN=1 copper penny(s) (cp);12 silver shilling(s) (ss);240 gold crown(s) (gc) and TRADEBAR=notrade;1 trade bar(s) (tb). DEFAULT replaces the hard-coded set. A code defined twice with different denominations is logged. VALUE() accepts every registered code.\n\n**Example.** The kingdom uses CROWN and the elven wood uses LEAF. An area with no currency of its own falls back to CROWN, not Archon notes.\n\n*See also:* W16 (W16's coin braces extend the denomination lines of W2's currency file).", "d": "yes", "note": ""}, {"id": "W3", "theme": "W", "title": "Typed hazard zones: Prop_Hazard", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** FieryRoom does fire only. Prop_InstantDeath with DAMAGE= and a MASK (which can test -WEATHER, -WORN, -EFFECTS and +IF) hurts occupants on entry and each tick, but its damage is untyped, so saves and resistances do not count. It has no formula. It stops once nobody matches and does not start again until the next entry. On an area it does nothing. Anything more takes a RAND_PROG with MPDAMAGE in every room.\n\n**Add.** Prop_Hazard, on a room, or on an area with a room filter such as -ALL +MOUNTAINS. TYPE=COLD|HEAT|ACID|GAS|POISON|ELECTRIC|HOLY|UNHOLY|DISEASE|THINAIR. DAMAGE= takes a formula (@x1 = level) and is dealt as that type, so saves and Prop_Resistance apply. Also SAVE=, DRAIN=MOVE|MANA, AFFECT=\"Disease_FrostBite 20%\", PROTECT= (a mask on the victim), WHEN= (a mask checked every tick), EVERY=, ONSET=, ESCALATE=, DARKONLY, LITONLY, NONPC, WARN= (shown once) and MSG= lines. It can start from Prop_InstantDeath, with its area bug fixed.\n\n**Example.** Frostfang Pass: TYPE=COLD DAMAGE=1d6 SAVE=COLD WHEN=\"-WEATHER +BLIZZARD +SNOW\". Without a fur cloak or Resist Cold, the crossing in winter hurts more each tick.\n\n*See also:* W10 (W10's +ROOMDARK mask is meant as a WHEN condition in W3's Prop_Hazard, next to its DARKONLY); W25 (later) (Both hurt characters by cold and heat from where they are (a typed hazard zone vs a body-temperature model)).", "d": "yes", "note": ""}, {"id": "W4", "theme": "W", "title": "Letting time pass: long WAIT, WAIT UNTIL, MPPASSTIME", "kind": "script command, builder tool", "value": "high", "effort": "medium", "body": "**Today.** WAIT runs real simulated ticks and stops when the player is disturbed. It is capped at 100 ticks, which is less than one mud hour, and it works only while the clock is stopped. TICKTOCK moves the calendar without running the ticks in between, so nothing heals, restocks or respawns, and TIME_PROGs are skipped. No script can make time pass. GameTime.requestAdvance, which WAIT uses, already takes a stop condition.\n\n**Add.** WAIT n TICKS|HOURS|DAYS|WEEKS and WAIT UNTIL DAWN|DAY|DUSK|NIGHT|HOUR h|DAY d, with a progress line each game hour. In real time the clock pauses for the wait. Builder mode adds WAIT UNTIL VAR host name op value and WAIT UNTIL QUEST name STEP n|DONE. The owner chooses whether long waits are for players too, or only for builders. Script command MPPASSTIME <n HOURS|n DAYS|UNTIL DAWN|UNTIL HOUR n> [INTERRUPTIBLE] [QUIET]. Optional Prop_InnRoom: a wait in this room gives full rest.\n\n**Example.** A ferryman's BUY_PROG moves the player across with MPTRANSFER, then runs MPPASSTIME 4 HOURS. A builder types WAIT UNTIL HOUR 20 to watch the night market open.\n\n**Also merged here, from T1 (WAIT UNTIL arrival, and a script command to end a wait).** `WAIT UNTIL ARRIVAL|STOP|DOCK`, which ends when the vessel or rideable you are on stops or reaches a port, and `WAIT UNTIL DAWN|DUSK|MORNING|HOUR <n>`. These forms get a larger cap, say 3 game days, and keep the usual hurt and attack checks. A script command `MPINTERRUPT <who> [message]` ends any multi-tick wait or journey for that character and the party. JavaScript gets the same call. `GameTime.requestAdvance` already takes an \"until\" test, so this is cheap.\n\n*See also:* JS6, W1, W6, W12, W14, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); ST8 (ST8's DOCK_PROG and T1 (now in W4)'s WAIT UNTIL DOCK both need an event when a vessel stops or anchors in a port).", "d": "yes", "note": ""}, {"id": "W5", "theme": "W", "title": "Area calendars and the start date as content", "kind": "world option, data file", "value": "high", "effort": "medium", "body": "**Today.** The global calendar is already content: coffeemud.ini sets HOURSINDAY, DAYSINMONTH, MONTHSINYEAR, DAYSINWEEK, DAWNHR to NIGHTHR, and YEARDESC. A StdTimeZone area's own calendar is saved only in the TIMECLOCK record in CMPDAT. That is a save table: WorldFiles never writes it and a new game does not copy it. So in every real game that area reverts to the global calendar. Every clock starts at hour -1, day 1, month 1, year 1000. A date set in builder mode with MODIFY YEAR or TICK SET is lost the same way.\n\n**Add.** An area stat CALENDAR, kept in the area's ADATA in the .cmare and edited on the MODIFY AREA calendar screen. It holds HOURS, DAYS, MONTHS, WEEK, YEARS, DAWNHR, DAYHR, DUSKHR, NIGHTHR and START=Y/M/D/H. Left empty, it inherits from the parent area or the global clock. STARTDATE=Y/M/D/H in coffeemud.ini sets the global start. TIMECLOCK then holds only the current date, as save state.\n\n**Example.** An elven realm has 10-hour days and months named Leafwake and Bloomtide. Every new game opens there at dawn on 3 Bloomtide 812.\n\n*See also:* W22 (W22's seasons, day length and moons are calendar fields for W5's per-area CALENDAR stat).", "d": "yes", "note": ""}, {"id": "W6", "theme": "W", "title": "Holidays: more recurrences and tests by name", "kind": "quest feature, script function", "value": "high", "effort": "medium", "body": "**Today.** CREATE, MODIFY, LIST and DESTROY HOLIDAY edit resources/quests/holidays/holidays.quest, which is content. A holiday is a quest without a script. It has an area or room mask (which can test -SEASON and -WEATHER), MUDDAY m-d, a real-life DATE or WAIT/INTERVAL, and a DURATION. It sets behaviours, properties and stats such as PRICEMASKS for that time. CALENDAR lists the dated holidays. A holiday cannot recur by weekday, interval, season or moon. Nothing tests a holiday by name: QVAR(<quest> REMAINING > 0) is the nearest.\n\n**Add.** New recurrences in the holiday system: WEEKDAY=name, EVERY=n DAYS FROM y/m/d, SEASONSTART=WINTER and MOON=FULL. DATE follows the game calendar, and DURATION takes days or hours. Tests by name: ISHOLIDAY(name), HOLIDAY() (the current names), zapper +HOLIDAY, VARIES <HOLIDAY name>, and quest SET HOLIDAY name, which makes a quest run exactly while the holiday is on. CALENDAR shows game dates (\"Moonfeast in 4 days\").\n\n**Example.** Moonfeast falls on every full moon in Riverton. A quest with SET HOLIDAY Moonfeast suppresses the drunkenness law and sets PRICEMASKS to 0.9. Room text mentions the lanterns.\n\n*See also:* JS6, W1, W4, W12, W14, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); W23 (Both tie a quest to a holiday (SET HOLIDAY vs SET SCHEDULE HOLIDAY)); PR1 (Both add a VARIES <HOLIDAY name> tag); F21 (later) (F21 (later)'s deity holy days are named holidays, tested with W6's tests by name).", "d": "yes", "note": ""}, {"id": "W7", "theme": "W", "title": "RoomStates: named versions of a room", "kind": "behaviour, script command", "value": "high", "effort": "large", "body": "**Today.** A script can switch a room between states. Each state is a FUNCTION_PROG called with MPCALLFUNC. It runs MPSET DISPLAY/DESCRIPTION/ATMOSPHERE/CLIMATE, MPAFFECT Prop_RoomDark, MPBEHAVE WaterCurrents, MPUNLINK, MPCLOSE and MPSETVAR, and VARIES text follows the state through '+IF VAR(...)'. Prop_ClosedSeason and Prop_ClosedDayNight darken rooms and close exits by time or season. But MPSET CLASS does nothing, rooms cannot switch together, and the states are not declared in one place.\n\n**Add.** Behaviour RoomStates. A state looks like STATE=flooded TITLE= DESC= ATMOSPHERE= CLIMATE= CLASS=IndoorShallowWater ADD=\"Prop_RoomDark();WaterCurrents(go=east)\" BLOCK=north,down OPEN=up ENTERMSG=. Transitions: TO=flooded WHEN=\"+WEATHER +RAIN\" AFTER=20; TO=dry TICKS=300; TO=collapsed ONVAR=\"mine_collapse==1\". On an area it switches several rooms together. Script command MPROOMSTATE <room|area> <state>, and function ROOMSTATE(room), which VARIES masks can also test. The save keeps the state, through the room-delta save item (bw-save-roomdelta).\n\n**Example.** Deepdelve mine shaft: a trap makes it 'collapsed', with the way down blocked, darkness and dust. MPROOMSTATE from the digging script makes it 'cleared', with shored-up beams.\n\n*See also:* ST25 (W7's ONVAR transitions (and W19's) need the variable-change notice that ST25 adds to setVar); I13, S17 (I13's cleared blockages and W7's room states are kept through S17's room-delta save); W8, W19 (W19's Floodable and W8's TidalRoom are presets of W7's RoomStates).", "d": "yes", "note": ""}, {"id": "W8", "theme": "W", "title": "Tides for builders", "kind": "script function, property", "value": "medium", "effort": "small", "body": "**Today.** Each area's clock works out the tide, but only Mer, Pirate and the druid tide chants read getTidePhase. Scripts, masks and VARIES cannot. The tide model is thin. It is LOW only in the hour the day starts and HIGH only in the dusk hour, with its strength set by the moon, and NO_TIDE the rest of the time. A builder can match it today with a TIME_PROG at those hours plus ISMOON, and close a causeway door with Prop_ClosedDayNight HOURS=.\n\n**Add.** Function ISTIDE(room, HIGH|LOW), mask +TIDE HIGH|LOW, and VARIES tags <HIGHTIDE> and <LOWTIDE>. Prop_TidalExit(OPEN=LOW MSG=\"The causeway is under water.\") makes an exit passable only at low tide. TidalRoom, or a RoomStates preset, floods a shore room at high tide: swimming, a water atmosphere at the deepest, light items washed away. RISING and EBBING, or a longer flood window, would first need a new tide model.\n\n**Example.** The causeway to St. Brine's Isle is open only at low tide. At high tide the description changes, and the player can be cut off on the island until the next ebb.\n\n*See also:* W7, W19 (W19's Floodable and W8's TidalRoom are presets of W7's RoomStates).", "d": "yes", "note": ""}, {"id": "W9", "theme": "W", "title": "ResetWhole: DAYS, EXCEPT and MSG", "kind": "behaviour", "value": "medium", "effort": "small", "body": "**Today.** ResetWhole's TICKS= already runs on the game clock and counts from the last player activity in the area, so it already means n ticks after the party left. MUDHOUR= uses the area's calendar. RLHOUR reads the real clock, which means nothing with pause and turn-based time. A reset reloads whole rooms, so a slain boss comes back unless his ONCE_PROG purges him when a variable is set. A message after a reset needs an area GREET_PROG.\n\n**Add.** New ResetWhole parameters. DAYS=n, in game days on the area's calendar, as a shorthand for TICKS. EXCEPT=mask, for mobs or items that never respawn, such as bosses and unique loot. MSG=\"...\", shown on the next entry after a reset. RLHOUR is deprecated in single-player.\n\n**Example.** The Goblin Warrens refill 7 game days after the party leaves, except the Goblin King (EXCEPT=\"-NAME +'Goblin King'\"). On the way back in, the player reads \"Fresh tracks lead into the tunnels.\"\n\n*Note.* Leave unique items to `DEVPLAN.md` item 1, whose copy counting and once-ever rule stop a unique item from coming back; keep `EXCEPT=` for bosses and the like.\n\n*Re-checked against the code after writing: accurate.*\n\n*See also:* C19 (Both keep a slain boss from coming back (Prop_RejuvWhen vs ResetWhole's EXCEPT=)); T2 (Both add ResetWhole parameters (DAYS vs MINAWAY, MSG vs RESETMSG) for how an area resets after the party leaves).", "d": "yes", "note": ""}, {"id": "W10", "theme": "W", "title": "Darkness tests, and dangers in the dark", "kind": "script function, property", "value": "medium", "effort": "small", "body": "**Today.** A room's darkness is its IS_DARK disposition. Night, blizzards, dust storms, Prop_RoomDark and Prop_ClosedSeason set it, and any light in the room clears it. A room script can test it with ISLIKE($d '-DISPOSITION +ISDARK'), and so can a room Emoter or a quest room mask. A mask checked against the player cannot see it, because StdRoom filters IS_DARK out of what reaches occupants. Losing your way in the dark exists only as the Chant_Labyrinth spell.\n\n**Add.** Functions ISDARK(room) and ISLIT(room). Mask keys +ROOMDARK and -ROOMDARK, seen from the player's side, so they also work as WHEN conditions in Prop_Hazard and similar properties. Property Prop_DarkDanger(LOST=10% STUMBLE=5% LURKER=catalog:\"ghoul\" 3% MSG=...), which acts only while the room is dark to that player.\n\n**Example.** The catacombs: without a lit torch, each move has a 10% chance of going a random way (\"You lose your way in the dark\"). There is also a 3% chance that a ghoul comes out of the dark.\n\n*See also:* W3 (W10's +ROOMDARK mask is meant as a WHEN condition in W3's Prop_Hazard, next to its DARKONLY).", "d": "yes", "note": ""}, {"id": "W11", "theme": "W", "title": "Darkness that torches cannot beat", "kind": "property", "value": "medium", "effort": "small", "body": "**Today.** Prop_RoomDark sets IS_DARK on the room (with HOURS=), but any carried torch clears it, because inhabitants are applied after room effects. Spell_DarknessGlobe does beat lights. It strips IS_LIGHTSOURCE from every inhabitant and forces the room dark on each tick and each entry. But it is a spell on a mob. The workaround is a hidden room mob with a permanent globe, and lights flicker back between its ticks.\n\n**Add.** New options on Prop_RoomDark, for rooms and areas. ABSOLUTE=TRUE applies the darkness again after inhabitants and items, and turns off their IS_LIGHTSOURCE while inside, reusing the DarknessGlobe code. LIGHTMASK=\"+NAMES -sunrod -'everburning lantern'\" names the lights that still work. SEEMASK= says who still sees, such as darkvision races. SNUFF=30 is the chance to put out a lit torch on entry, with a message.\n\n**Example.** In the Shadowfell crypt, torches go out on entry. Only the Lantern of Dawn from the temple quest lights the way.", "d": "yes", "note": ""}, {"id": "W12", "theme": "W", "title": "MPWEATHER, and WEATHER SET, FORECAST and NEXT", "kind": "script command, builder tool", "value": "medium", "effort": "small", "body": "**Today.** 'MPAFFECT Prop_Weather $a 300 TICKS THUNDERSTORM' pins an area's current and next weather for a time, but silently. Weather chants such as Chant_SummonRain or Prayer_Weather, cast through MPAFFECT, change the next weather with the usual messages. They cannot pick an exact state or a duration. WEATHER WORLD lists each area's current weather. Nothing shows the odds of the next.\n\n**Add.** MPWEATHER <area|$a> <state> [NEXT] [FOR n HOURS|DAYS] [QUIET]. It sets the current weather, or with NEXT only the next one. It sends the normal end and start messages to everyone under the sky, holds the weather for the time given, then returns to the normal chain. Builder commands: WEATHER SET <state> [FOR ...]; WEATHER FORECAST, which shows the current and next weather and the weighted chances of the step after; WEATHER NEXT, which forces one weather step.\n\n**Example.** A step of the necromancer quest runs MPWEATHER $a THUNDERSTORM FOR 2 HOURS. A builder runs WEATHER FORECAST after changing an area's climate.\n\n*See also:* JS6, W1, W4, W6, W14, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); W20, DT20 (W12's MPWEATHER and WEATHER SET and FORECAST are repeated in W20 (MPWEATHER, FORECAST) and DT20 (WEATHER SET); build one set of weather commands).", "d": "yes", "note": ""}, {"id": "W13", "theme": "W", "title": "Sky and weather lines per area: Prop_SkyText", "kind": "property, presentation", "value": "medium", "effort": "small", "body": "**Today.** The dawn, day, dusk and night lines and the weather texts come from global lists in resources/lists.ini (TOD_CHANGE_OUTSIDE, TOD_CHANGE_INSIDE, WEATHER_*). A cave city and a desert share them. Lines 669 and 671 have the sun rising in the west and setting in the east. A room's description can follow time and weather with <VARIES>. For lines per area, DISABLE=TODNOTIFIES or WEATHERNOTIFIES turns off the stock ones, and then every area needs a TIME_PROG or RAND_PROG with MPECHO.\n\n**Add.** Prop_SkyText on an area or room. DAWN=, DAY=, DUSK= and NIGHT= are for outside, and INDAWN=, INNIGHT= and so on for indoors. WEATHER_<STATE>= gives that weather's start, stop and description lines, and MOON= the moon's. Alternatives separated by | are picked at random. NONE silences a line. Anything unset falls back to lists.ini. Separately, a data-only fix to lines 669 and 671.\n\n**Example.** Ashen Wastes: DAWN=\"The red sun drags itself over the ash dunes.\", and snow starts with \"Grey ash begins to fall.\" The Underdark: DAWN=NONE, NIGHT=\"The glowcaps dim as night falls on the surface far above.\"\n\n*See also:* W20, L3 (Three ways to give an area its own time-of-day and weather lines (Prop_SkyText, climate files, Prop_LocalLists); pick one).", "d": "yes", "note": ""}, {"id": "W14", "theme": "W", "title": "MPSHOP: remove, restock and reprice shop stock", "kind": "script command, script function", "value": "medium", "effort": "small", "body": "**Today.** Scripts can read a shop with SHOPITEM, NUMITEMSSHOP and SHOPHAS (which sets $9 to the price). They can add stock with MPOLOADSHOP (with PRICE=n) and MPMLOADSHOP. MPSET changes a GenShopkeeper's rules: PRICEMASKS, BUDGET, DEVALRATE, INVRESETRATE, IGNOREMASK and WHATISELL. No script or quest can remove stock, set a quantity, reprice a stocked item, reset the inventory or set the budget that is left. Only the RESET command clears a store.\n\n**Add.** MPSHOP <shopkeeper> with one of REMOVE <item> [n|ALL], STOCK <item> <n>, PRICE <item> <amount|-1>, CLEAR, RESET (reload the built stock) or BUDGET <amount> (the budget left). Functions SHOPPRICE(<shopkeeper> <item> [<customer>]), the price that customer would pay, and SHOPBUDGET(<shopkeeper>).\n\n**Example.** While the mine is collapsed, the blacksmith's script runs MPSHOP $i REMOVE \"iron ingot\" ALL. A fence offers a stolen ring back at its SHOPPRICE plus half.\n\n*See also:* JS6, W1, W4, W6, W12, W15, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them); W17 (W14's SHOPPRICE and W17's PRICE both return an item's price at a shop for a customer).", "d": "yes", "note": ""}, {"id": "W15", "theme": "W", "title": "Bank accounts and debts in scripts", "kind": "script function, script command", "value": "medium", "effort": "small", "body": "**Today.** The money library keeps bank balances per bank chain, and debts with interest and due dates, in CMPDAT, which a save holds. Scripts see only the coins a character carries (GOLDAMT, MPMONEY). The workarounds are to MPFORCE the player to DEPOSIT in front of a banker, or LIST BANKS, which only shows them. A reward cannot be paid into an account, and a quest cannot create or check a debt.\n\n**Add.** Functions BANKBALANCE(who chain [currency]) and DEBT(who owedTo). Commands MPBANK who chain +/-amount [reason], which writes a ledger line. MPDEBT who owedTo +/-amount [INTEREST pct] [DUE n DAYS], and MPDEBT who owedTo CLEAR. The data already lives in the save, so changes made by scripts persist.\n\n**Example.** The guild pays bounties straight into Riverton Trust. A moneylender's quest sends thugs once DEBT($n Vargo) is past due.\n\n*See also:* JS6, W1, W4, W6, W12, W14, W27 (later) (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them).", "d": "yes", "note": ""}, {"id": "W16", "theme": "W", "title": "Coin descriptions, materials and weights", "kind": "data file", "value": "medium", "effort": "small", "body": "**Today.** A coin's material follows from its denomination's name. Note, bill and dollar give PAPER. Otherwise it is the first material word in the name, so a silver shilling is SILVER and a glass moon bead is GLASS. Its description is always \"Equal to N <lowest coin>.\" There is no weight per denomination, so invented coins all read alike, and a material other than the one in the name cannot be set.\n\n**Add.** Optional braces after a denomination in a currency definition, for example 12 silver shilling(s) (ss) {MATERIAL=SILVER WEIGHT=0.01 DESC=\"A thin disc stamped with the crowned stag.\"}. StdCoins uses them for the material, weight and description. The \"Equal to\" line comes after DESC.\n\n**Example.** Dwarven iron hacksilver is heavy, a paper guild scrip has a watermark in its description, and moon beads are made of GLASS though their name does not say so.\n\n*See also:* W2 (W16's coin braces extend the denomination lines of W2's currency file).", "d": "yes", "note": ""}, {"id": "W17", "theme": "W", "title": "Money formatting for scripts", "kind": "script function", "value": "medium", "effort": "small", "body": "**Today.** Scripts see money only as numbers. `GOLDAMT` and `VALUE` return amounts, `CURRENCY` returns a code, and only `SHOPHAS` fills `$9` with a formatted price. To quote a price in coin names, a script must embed JavaScript that calls `Packages.com.planet_ink.coffee_mud.core.CMLib.beanCounter().nameCurrencyLong`. That needs `JSCRIPTS` approval and some Java.\n\n**Add.** Three MOBPROG functions, also reachable from JavaScript as `name$`. `MONEYSTR(amount [CODE] [LONG|SHORT])` calls `nameCurrencyLong` or `nameCurrencyShort`. `PRICE($i [shopkeeper])` gives the item's price at that shop, formatted. `DENOMNAME(CODE value [count])` gives the name of a denomination.\n\n**Example.** A ferryman's `SPEECH_PROG` runs `say The crossing is $%MONEYSTR(36 CROWN LONG)%, friend.` It prints \"3 silver shillings\".\n\n*Note.* `JSCRIPTS=2` already runs every JavaScript block without approval (see *Already possible* in the README), so the JavaScript route mentioned above needs no approval; what this item adds is the convenience of doing it without JavaScript.\n\n*See also:* W14 (W14's SHOPPRICE and W17's PRICE both return an item's price at a shop for a customer).", "d": "yes", "note": ""}, {"id": "W18", "theme": "W", "title": "A breath count before drowning", "kind": "world option, property, script function", "value": "medium", "effort": "medium", "body": "**Today.** Drowning and choking damage start on the first tick a mob cannot breathe the room's atmosphere. Holding breath exists only as skills: `Skill_DeepBreath` and `Skill_LongBreath` (sailors, LizardMan, Otter). A builder can lend them with `Prop_WearEnabler` or `Prop_HaveEnabler`, and `Prop_WearSpellCast` can give `Spell_WaterBreathing`. Anyone else has no breath to hold and gets no warning.\n\n**Add.** A breath count for everyone, set by an ini formula such as `BREATHTICKS=@x1/3` (`@x1` is constitution). It warns at half and at a quarter, and damage starts only when it runs out. `Prop_AirSupply(TICKS=n)` on items adds ticks. As with the skills, any room with breathable air refills the count, so an air pocket needs nothing new. Add a script function `BREATH($n)` and a mask `+BREATH <n`.\n\n**Example.** In the Sunken Temple the player has about 6 ticks of air to reach the air pocket in room 4. A merfolk NPC sells air bladders.\n\n*See also:* W19 (W19's full flood drowns through W18's breath count).", "d": "yes", "note": ""}, {"id": "W19", "theme": "W", "title": "Floodable rooms driven by weather, tide or a variable", "kind": "behaviour", "value": "medium", "effort": "medium", "body": "**Today.** Flooding exists in two forms only. `Trap_FloodRoom` is sprung once: it blocks exits, makes occupants swim, then drains. `Chant_Flood` is a spell with a duration. Scripts can already build a flood by hand. `MPSET $i ATMOSPHERE WATER` makes the room's air water, so occupants drown (the resource is named WATER; FRESHWATER is ignored). `MPAFFECT property:Chant_Flood $i` makes it a swimming room until `MPUNAFFECT`. `MPBEHAVE WaterCurrents $i <dir>` sweeps loose items, and players, out through an exit. A variable can hold the level, and `ISWEATHER` tests for rain. What is missing is one behaviour that ties these into levels that rise and drain on their own. WaterCurrents also takes every loose item, not just small ones.\n\n**Add.** A `Floodable` room behaviour, built as a preset of RoomStates, with levels 0 to 3: dry; ankle-deep (slower, slips); waist-deep (swimming, small items float off to `FLOWTO=dir`); full (water atmosphere, so drowning; see the breath item). The water rises one level per `RATE` ticks while its condition holds, and drains (`DRAIN`) when it does not. The condition is `RISE=\"+WEATHER +RAIN +THUNDERSTORM\"`, `ONVAR=\"sluice==open\"` or `TIDE=HIGH`. Rising water puts out lights and fires, and `VARIES` text can test `FLOODLEVEL()`.\n\n**Example.** The old city storm drains rise a level every 15 ticks of rain. The player must turn the pump-room wheel, which sets `sluice=open`, before the lower tunnel fills.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* W7, W8 (W19's Floodable and W8's TidalRoom are presets of W7's RoomStates); W18 (W19's full flood drowns through W18's breath count).", "d": "yes", "note": ""}, {"id": "W20", "theme": "W", "title": "Climates and weather texts as data, chosen per area", "kind": "data file, world option, script command", "value": "medium", "effort": "medium", "body": "**Today.** Weather odds are static arrays in `DefaultClimate`, which every area uses. An area saves only five climate bits (wet, cold, windy, hot, dry). `Prop_Weather` pins one weather. `LinkedWeather` copies another area's weather or rolls it in, so a hidden template area can act as a climate. `CLIMATE_VOID` is always CLEAR. The weather texts in `resources/lists.ini` apply to the whole world.\n\n**Add.** Named climates in `world/climates/<name>.ini`. Each gives a weight per season for each of the 14 weather states, `TRANSITION` overrides (`RAIN->FOG=30`), a minimum `HOLD` in hours, an optional allowed list, and texts per weather that override `lists.ini`. An area picks one with `WEATHERPROFILE=<name>` in `MODIFY AREA`. Child areas inherit it, and the climate bits still apply as modifiers. `MPWEATHER <area> <weather> [NEXT|NOW]` makes one change without pinning it. A `WEATHER FORECAST` could show the odds.\n\n**Example.** Saltmarsh Coast uses \"monsoon\": heavy summer rain that reads \"Warm monsoon rain drums on the reeds\". The Underdark allows only FOG and CLEAR.\n\n*See also:* W12, DT20 (W12's MPWEATHER and WEATHER SET and FORECAST are repeated in W20 (MPWEATHER, FORECAST) and DT20 (WEATHER SET); build one set of weather commands); W13, L3 (Three ways to give an area its own time-of-day and weather lines (Prop_SkyText, climate files, Prop_LocalLists); pick one).", "d": "yes", "note": ""}, {"id": "W21", "theme": "W", "title": "Law book edits in builder mode saved to the world files", "kind": "builder tool, data file", "value": "medium", "effort": "medium", "body": "**Today.** Per-area laws already work as content. `Arrest(laws_riverton.ini;SALESTAX=5 OFFICERS=\"cityguard\")` names a law file in `resources/` and merges the overrides over it. The behaviour is kept in the area's `BEHAVES` in the `.cmare`. The gap is the law named `custom` and the `StdLawBook`/`GenLawBook` editor. They write the law text to CMPDAT under `AREA/ARREST`, which is save state, so laws edited in builder mode do not reach a new game.\n\n**Add.** In builder mode, law book edits (`updateLaw`) are written back as content. They go either as `KEY=VALUE` overrides in the `Arrest` parameters or as a law file (an area stat `LAWTEXT`, or `world/laws/<Area>.ini` from WorldFiles) that `Arrest` loads for `custom`. In a normal game, law changes, such as those after a conquest, stay in the save as now. Builders' documentation should also describe the `file;KEY=VALUE` route.\n\n**Example.** In builder mode the builder bans nightshade and sets `SALESTAX=5` in the Riverton courthouse law book. The change lands in `world/areas/riverton.cmare`, so every new game has it.\n\n*See also:* DT21 (DT21's LAW SET writes the custom law that W21 saves as world content).", "d": "yes", "note": ""}, {"id": "W22", "theme": "W", "title": "Custom seasons, seasonal day length and named moons", "kind": "world option", "value": "medium", "effort": "medium", "body": "**Today.** Seasons are the fixed `TimeClock.Season` enum. Each season is floor(months/4) months long, WINTER comes first, and leftover months go to FALL. Day length is one `dawnToDusk` array for the whole year. There is one moon, whose phase comes from the day of the month; `DOMAIN_MOONALTERING` effects only shift it. `ISSEASON`, `+SEASON`, `VARIES` and `Prop_ClosedSeason` know only the four names.\n\n**Add.** Calendar fields:\n- `SEASONS=Frostfall:WINTER:0-2,Thaw:SPRING:3,...` names each season, the season it counts as for weather, and its months.\n- `SEASONOFFSET=n` shifts the seasons in one area, for a southern land.\n- `DAYLIGHT=WINTER:2-4,SUMMER:0-5` sets dawn and night hours per season.\n- `MOONS=Selune:24,Ember:9:3` gives each moon a name, a cycle in days and an offset.\n\n`ISSEASON`, `VARIES`, `+SEASON` and `TIME` accept the custom names, and `ISMOON` takes an optional moon name.\n\n**Example.** A desert world has two seasons, \"the Burn\" and \"the Rains\", and a red second moon, Ember. A `TIME_PROG` that checks `ismoon(Ember full)` starts a cult's ritual.\n\n*See also:* W5 (W22's seasons, day length and moons are calendar fields for W5's per-area CALENDAR stat).", "d": "yes", "note": ""}, {"id": "W23", "theme": "W", "title": "Game-time schedules for quests", "kind": "quest feature", "value": "medium", "effort": "medium", "body": "**Today.** Quest `SET WAIT`, `INTERVAL` and `DURATION` already take game time (`MUDHOURS`, `MUDDAYS`, `MUDWEEKS`, ...), and `MUDDAY m-d` gives a yearly date. Room masks with `-SEASON` or `-WEATHER` limit where an event happens. A scheduler mob can run `MPSTARTQUEST` from a `TIME_PROG`, or from a `RAND_PROG` that tests `ISSEASON(WINTER)`. CRON runs by the real clock and is stored as state, not content. What is missing is a declared window (weekday, hours, season, moon, weather, holiday) and an end at dusk.\n\n**Add.** A quest keyword `SET SCHEDULE \"<rule>\"`. Rules: `HOUR a-b`, `WEEKDAY name`, `EVERY n DAYS [AT DAWN|HOUR h]`, `SEASON name`, `MONTH name`, `MOON phase`, `HOLIDAY name`, or `WEATHER state` in the quest area. `SET DURATION UNTIL DUSK|HOUR h|END` ends the quest when its window closes. The quest engine checks the rule each game hour.\n\n**Example.** A weekly fair uses `SET SCHEDULE \"WEEKDAY Marketday\"` and `SET DURATION UNTIL DUSK`, and spawns stalls and traders in the square. A winter wolf-pack quest uses `SET SCHEDULE \"SEASON WINTER\"`.\n\n*See also:* W6 (Both tie a quest to a holiday (SET HOLIDAY vs SET SCHEDULE HOLIDAY)).", "d": "yes", "note": ""}, {"id": "W24", "theme": "W", "title": "Gradual and conditional restocking", "kind": "property", "value": "medium", "effort": "medium", "body": "**Today.** A generic shopkeeper's stock resets all at once. Every `INVRESETRATE` ticks, `doInventoryReset` empties the shelves, the player's sales included, and reloads the built stock. Between resets a sold-out item stays gone. `INVRESETRATE` is a number of ticks, set per shop, per area or in the ini. Stock cannot depend on season, weather, a holiday or a variable. `Prop_ClosedSeason` does not work on a stock item, which has no room.\n\n**Add.** `Prop_Restock` on a shopkeeper or an area. `RATE=\"1 per 6 HOURS\"` or `\"25% per DAY\"` brings each built item back toward its built quantity. `SELLOFF=\"20% per DAY\"` makes goods the player sold go a little at a time. A conditional line such as `STOCK=\"strawberries;10;WHEN=+SEASON +SUMMER\"` keeps an item in stock only while its mask holds. `INVRESETRATE` also takes time words (\"3 DAYS\").\n\n**Example.** The fruit seller has strawberries only in summer and apples in fall. A day after the player buys the armourer's last helm, it is back.", "d": "no", "note": "later: moved to LATER.md"}, {"id": "W25", "theme": "W", "title": "Exposure: body temperature from climate, shelter and clothing", "kind": "behaviour, property, script function", "value": "medium", "effort": "large", "body": "**Today.** There is no temperature model. The area's COLD and HOT bits and the weather only shift WeatherAffects' disease rolls and a few spells. Clothing counts only as cover for the feet, torso and legs. Some pieces can be reused: `Disease_FrostBite`, `Disease_Cold`, `Spell_ResistCold`, `Chant_ColdWard`, and `Prop_HereAdjuster` for penalties.\n\n**Add.** An area behaviour `Exposure(cold=0-3 heat=0-3)`, which `AUTOAREAPROPS` can give to every area, puts an Exposure effect on the character. Each tick the effect adds up:\n- the climate bits, the weather and the time of day;\n- shelter (indoors, `HideoutShelter`, tents);\n- being wet (swimming, rain);\n- a lit fire in the room.\n\nClothing protects through `Prop_Insulation(WARM=n COOL=n)`, which by default comes from the material (fur, wool, leather). The stages chilled, cold and freezing bring movement and dexterity penalties, then damage and FrostBite; heat has its own stages. The prompt and `SCORE` show the stage, and `EXPOSURE($n)` returns it.\n\n**Example.** In the Northern Wastes at night, away from a campfire, the player goes from chilled to freezing in about 30 ticks without a fur cloak (`WARM=2`). Inns and caves are safe.\n\n*See also:* W3 (Both hurt characters by cold and heat from where they are (a typed hazard zone vs a body-temperature model)).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "W26", "theme": "W", "title": "Bounty hunters and wanted posters", "kind": "behaviour, property", "value": "medium", "effort": "large", "body": "**Today.** Every Arrest pursuit check is gated on `inMyMetroArea`, so a player wanted in one town is free one area over. `MOBHunter` stays in its own area (`TrackingFlag.AREAONLY`), and no mask means \"wanted\". `Skill_TrackCriminal`, `Skill_PrisonerTransfer` and `Skill_CollectBounty` have machinery to reuse. No wanted poster exists.\n\n**Add.** A `BountyHunter` behaviour with these parameters:\n- `AREAS=\"Riverton;Ashford\"`: whose warrants it serves;\n- `MINFINE=200` or `MINCRIMES=1`;\n- `CHANCE`: per game hour;\n- `RANGE`: the areas it travels.\n\nWhen the player is wanted there but is elsewhere, the hunter tracks them down. The player can pay the fine plus a fee, or surrender and be taken to that jail with the warrant intact, or fight. If the hunter wins, it delivers them anyway. `Prop_WantedPoster` makes readable notices of the player's warrants and bounties. This needs a script query for warrants and a `+WANTED` mask, which are proposed separately.\n\n**Example.** After robbing the Ashford bank the player flees to the hills. Two game days later Grek the bounty hunter walks into their inn.\n\n*See also:* W1, PR1 (W1's +WANTED mask is what W26 (later)'s bounty hunters need and what PR1's <WANTED> tag tests).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "W27", "theme": "W", "title": "Market: supply and demand that remembers and recovers", "kind": "behaviour, script command, script function", "value": "medium", "effort": "large", "body": "**Today.** Supply moves prices only through `DEVALRATE`. It counts the copies in one shop's stock and resets with that stock, so after the player sells 50 pelts to one tanner, the tanner next door still pays full price. `PRICEMASKS` can be changed by `MPSET $a` or a quest's `GIVE STAT`, but area stats set by a script are not saved. Nothing recovers over time or links towns. The StockMarket behaviour that DOCS describes is not in this tree.\n\n**Add.** An area behaviour `Market`, for example `GOODS=\"pelts: -RESOURCE +FUR +HIDE; grain: -RESOURCE +WHEAT +BARLEY\" BASE=1.0 SELLDROP=2% BUYRISE=1% RECOVER=10% per DAY MIN=0.3 MAX=3.0`. It keeps a saved price factor for each good, applies it to every shop in the area, and moves it back toward `BASE` each game day. `TRADE=Ashford:grain` passes part of a price change on to another town. `MPMARKET <area> <good> +/-pct` moves a factor, and `MARKET(<area> <good>)` reads it.\n\n**Example.** The player sells a load of pelts in Riverton, and the price drops 40% and recovers over a week. A quest in which the grain caravan is robbed runs `MPMARKET $a grain +80`.\n\n*See also:* JS6, W1, W4, W6, W12, W14, W15 (JS6's cm world members (law, passTime, holiday, weather, shop, bank, market) are JavaScript forms of these W items and depend on them).", "d": "no", "note": "later: moved to LATER.md"}, {"id": "W28", "theme": "W", "title": "Prop_TimeMode: zones locked to turn-based or real time", "kind": "property", "value": "low", "effort": "small", "body": "**Today.** `TIMEMODE` is the player's own switch between turn-based and real-time play. A zone can switch it by script. A `GREET_PROG` or `ENTRY_PROG` runs `mpforce $n timemode turns`, and an `EXIT_PROG` runs `mpforce $n timemode realtime`. But no script function reads the current mode, so the player's own choice cannot be restored on leaving. The player can also type `TIMEMODE` inside the zone.\n\n**Add.** `Prop_TimeMode` for rooms and areas, with `MODE=TURNS|REALTIME`, `ONLYCOMBAT=TRUE`, `RESTORE=TRUE` and `MSG=\"Time seems to slow...\"`. On entry it switches GameTime as `TIMEMODE` does and remembers the previous mode. On leaving it restores that mode. Inside the zone, `TIMEMODE` says the mode is locked.\n\n**Example.** The flooding tomb runs in real time, with the water rising every few seconds. The chess-puzzle hall is always turn-based.\n\n*See also:* ST6 (ST6's ISTURNBASED() is the missing time-mode function that W28's Today names for restoring the player's mode).", "d": "yes", "note": ""}, {"id": "W29", "theme": "W", "title": "Exchange rates that can change", "kind": "behaviour, script command", "value": "low", "effort": "small", "body": "**Today.** Coins exchange at the fixed value ratio of their denominations. `MoneyChanger` takes a fee per currency (`CROWN=30`, with `CUT=5` as the default) and refuses unlisted currencies once any rate is set. \"Crowns lost value\" can therefore be done for one changer as a higher fee. A quest can swap the fee with `MPUNBEHAVE` and `MPBEHAVE`, and the save keeps the change. But the parser skips \"-\", so there is no premium, and a world-wide change means re-scripting every changer.\n\n**Add.** Negative rates in `MoneyChanger`: `RATE.<CODE>=pct`, a premium or discount on top of `CUT`. A script command `MPEXCHANGE <CODE> <pct>` sets a world-wide exchange modifier, kept in the save, which every money changer applies.\n\n**Example.** When the quest \"Fall of the Capital\" completes, `MPEXCHANGE CROWN 70` makes every money changer give 30% less for crowns.\n\n*Re-checked against the code after writing: accurate.*", "d": "yes", "note": ""}, {"id": "G1", "theme": "G", "title": "Seeds for repeatable generation", "kind": "world option", "value": "high", "effort": "small", "body": "**Today.** `GENERATE` takes only `NOSAVE`, `FROM` and `VAR=VALUE`, and its result depends on every roll made before it. The only seed is the global `RANDOMSEED`. A builder cannot keep a dungeon they liked or have the engine rebuild it exactly. A `<SCRIPT>` block can reach `CMath.seedRand`, but that is clumsy. Even with one seed, loot varies: the metacraft search stops after one second of real time, and crafted recipe sets are cached (`SYSTEM_ITEMGEN_*`).\n\n**Add.** `SEED=<n>` on `GENERATE`, a `SEED` variable for `StdAutoGenInstance` and `AutoGrid`, and a `seed=\"...\"` attribute on `AREA`, `ROOM`, `MOB` and `ITEM` that takes math, so `seed=\"$[$GAME_DAY]\"` gives a dungeon of the day. A seeded run saves the shared generator's state, seeds it, builds, then restores it. The seed is stored on the area, exposed as `$GEN_SEED`, and printed when none was given. Metacraft gets a fixed number of tries, and seeded runs skip the item cache (the `DISABLE=ITEMGENCACHE` switch already exists).\n\n**Example.** The owner generates 'The Drowned Crypt' with seeds 1 to 20, keeps 13 for its layout, and writes `SEED=13` into the AutoGen area so every new game has that crypt.\n\n**Also merged here, from T13 (Generated instances with a fixed or saved seed).** An autogen variable `SEED=<number>|GAME|ENTRY`, with a generator reseeded around the build of each copy. `GAME` uses one seed for the whole save, stored in world.xml, so the dungeon is the same each visit. `ENTRY` rolls a seed per entry and saves it with the instance, so a restore rebuilds it; this needs instances to be saved, a separate item. `PERSIST=true` would do what `GENERATE AREA` does, once per save in play.\n\n*See also:* G4 (G4's SEED option needs G1's seeds); G14 (G14's SEED=daily|weekly uses G1's seeds); S18 (S18 regenerates generated areas from their seed on restore, and S18 and T13 (now in G1) both propose PERSIST=true for one instance per save); S19 (T13 (now in G1)'s ENTRY seed needs S19's saved instances, as T13 (now in G1) says).", "d": "yes", "note": ""}, {"id": "G2", "theme": "G", "title": "Fix RandomQuests hanging or never generating", "kind": "behaviour", "value": "high", "effort": "small", "body": "**Today.** `RandomQuests` caps its workers at `availableProcessors()/4` using integer division. That is 0 on one to three cores, so every attempt returns at once. In INLINE mode, which `Prop_QuestGiver QUEST=\"GENERATE:...\"` always uses, `tick()` loops `while(myQuests.size()<numQuests) generator.run()` and never checks the disable flag. The game thread hangs on such machines. It also hangs on any machine when generation fails for good: file not found, undefined tag, unmet `REQUIRES`, attempts used up. The gate does nothing in the fork, because `ServiceEngine.executeRunnable` already queues work on the one game thread.\n\n**Add.** Drop the processor gate. Generate on the game thread with a set number of tries per tick (`MAXATTEMPTS`), end the inline loop when the disable flag is set, and after repeated failures disable the behaviour with a log line. Add a smoke test that generates one quest through `Prop_QuestGiver GENERATE:`.\n\n**Example.** A notice board with `Prop_QuestGiver QUEST=\"GENERATE:template=normal\"` gives out a quest on the owner's two-core laptop instead of freezing the game when picked up.\n\n*See also:* Q14, S8 (Q14's quest board needs G2's RandomQuests fix and S8's saved generated quests).", "d": "yes", "note": ""}, {"id": "G3", "theme": "G", "title": "Depth and position variables for generated rooms", "kind": "generator", "value": "high", "effort": "small", "body": "**Today.** Room templates see a room's node type, run, exits and flags (`ROOMTAG_NODETYPE`, `NODERUN`, `NODEEXITS`, `NODEFLAGS`). They do not see its distance from the entrance or its coordinates, though `LayoutNode.coord()` exists. The area has only `AREA_NUMLEAFS` and `AREA_SIZE`. Leaf groups are built first, in random order, so a boss room gated by a `__boss<1` counter lands in whichever leaf comes first, often next to the entrance.\n\n**Add.** A breadth-first pass from the entry node over the node list that `layOutRooms` already holds. Each room gets `ROOMTAG_DEPTH`, `ROOMTAG_DEPTHPCT` (0 to 100), `ROOMTAG_ISDEEPEST`, `ROOMTAG_INDEX`, `ROOMTAG_X` and `ROOMTAG_Y`. The area gets `AREA_MAXDEPTH` and `AREA_NUMROOMS`. An `AREA` attribute `order=\"depth|reverse-depth|random\"` sets the order in which room groups are built.\n\n**Example.** `<ROOM condition=\"$roomtag_isdeepest='true' and $__boss<1\" define=\"__boss+=1\">` puts the ogre chieftain's hall at the far end, and mobs with `level=\"$level_low+$roomtag_depthpct/10\"` get harder deeper in.\n\n*See also:* G9, G15, ST20 (G9, G15 and ST20's GENVAR use G3's depth tags (ROOMTAG_DEPTH, AREA_MAXDEPTH)).", "d": "yes", "note": ""}, {"id": "G4", "theme": "G", "title": "GENERATE PREVIEW and GENLAYOUT: see before you build", "kind": "builder tool", "value": "high", "effort": "small", "body": "**Today.** The only way to see what a template or layout makes is to generate it for real and `DESTROY` the area afterwards. In builder mode `GENERATE NOSAVE` does not protect the world files. It skips only the database writes, and `WorldFiles.exportAll` writes every live area to `world/areas` on `SAVE` and on quit. The ASCII layout drawer, `LayoutTester.draw`, is a developer `main()` that prints to the console.\n\n**Add.** `GENLAYOUT <layout> <size> [dir] [SEED=n] [LEVELS=n]` prints the ASCII map with node types and a count per type, reusing `LayoutTester.draw`. `GENERATE PREVIEW <type> <id> [FROM file] [vars] [SEED=n]` builds in a scratch area, prints the room list (title, node type, mobs, items, exits) and the seed, then destroys the scratch area. `KEEP` then runs the real `GENERATE` with the same seed. `SEED` needs G1, and `LEVELS` needs G16.\n\n**Example.** The owner runs `GENLAYOUT SPOTTEDMESH 40 SEED=9` a few times to pick a shape. Then `GENERATE PREVIEW AREA swamp_dungeon theme=swamp level_range=8 SEED=9`, checks the mob levels, and types `KEEP`.\n\n*See also:* G1 (G4's SEED option needs G1's seeds); G16 (G4's LEVELS option needs G16's multi-level layouts); B12 (Both preview generated content in a throwaway scratch area).", "d": "yes", "note": ""}, {"id": "G5", "theme": "G", "title": "MPGENERATE command and GENSTRING function for MOBPROG", "kind": "script command and script function", "value": "high", "effort": "medium", "body": "**Today.** Scripts generate only through `FROMGENFILE` on `MPOLOAD`, `MPOLOADROOM`, `MPMLOAD` and `MPMLOADSHOP`. It takes `INTO <container>` and sets `$b`. Results are cached per file, tag and parameters, so the same call always gives the same roll. A throwaway `nonce=$%RANDNUM(1000000)%` forces a new roll, but each value leaves a cache entry behind. Scripts cannot generate rooms, areas or text, and they pass in no context variables. Quests come only from `MPBEHAVE RandomQuests` or `Prop_QuestGiver` (G2).\n\n**Add.** `MPGENERATE ITEM <file> <id> [vars] [INTO <container>|TO <mob>|HERE]`, `MPGENERATE MOB <file> <id> [vars] [HERE|AT <room>]`, `MPGENERATE ROOM <file> <id> <dir>`, `MPGENERATE AREA <file> <id> <dir> [SEED=n]` and `MPGENERATE QUEST <file> <id> [vars]`. Each call is a fresh roll and sets `$b`. A function `GENSTRING(<file> <id> [vars])` returns generated text. Every call defines `$PLAYER_LEVEL`, `$PARTY_SIZE`, `$AREA_LEVEL`, `$AREA_THEME`, `$HOUR`, `$SEASON` and `$WEATHER`. `FROMGENFILE` stays and accepts a `FRESH` word to skip the cache.\n\n**Example.** An iron chest's `OPEN_PROG` runs `MPGENERATE ITEM randareas/loot.xml chest_loot level_range=$<$n.level> INTO $i` once per reset. A tavern drunk's `SPEECH_PROG` says `GENSTRING(randareas/rumors.xml rumor area=$a)`.\n\n*See also:* G11 (The same fresh-roll generation calls, for MOBPROG (MPGENERATE, GENSTRING) and for JavaScript (gen.item, gen.string and so on)).", "d": "yes", "note": ""}, {"id": "G6", "theme": "G", "title": "Loot tables: Prop_LootTable on mobs and containers", "kind": "property", "value": "high", "effort": "medium", "body": "**Today.** `RandomItems` picks evenly from a static list. `ItemGenerator` weights all craftables by value, and its loop starts at index 2, so it never picks the first two. That is a bug worth fixing anyway. The catalog's `DROP` and `LIVE` rules place one item each. A weighted `loot.xml` can be written today with `select=\"pick-n\"`, `PICKWEIGHT`, `condition`, `class=\"catalog\"` and metacraft. Rolling it on an event is the weak part: a `DEATH_PROG` running `MPOLOAD FROMGENFILE` gets the cached roll every time (G5).\n\n**Add.** `Prop_LootTable` with `FILE=<xml> ID=<tag> ROLLS=<math, e.g. 1?3> ON=DEATH|OPEN|SPAWN|RESET CHANCE=<pct> GOLD=<math>`. Each roll is fresh, with `$mob_level`, `$area_level`, `$theme` and `$player_level` set. Entries with `class=\"catalog\"` keep DEVPLAN item 1's caps and once-ever rules. A container rolls once until its contents reset. It uses the same state as DEVPLAN item 1's planned `CONTAINER` on-opening rule, not a second copy. Ship a sample `loot.xml` with common, uncommon and rare tiers.\n\n**Example.** Goblins in the Warrens carry `Prop_LootTable FILE=randareas/loot.xml ID=goblin ROLLS=0?2 ON=DEATH`. They drop mostly copper and crude daggers, a war-horn 3% of the time, and 0.5% of the time the catalog item 'Fang of Grishnak', capped by the catalog.\n\n*Note.* Its roll on opening a container is the `CONTAINER` rule already planned in `DEVPLAN.md` item 1. Build it on that item, sharing its caps and once-ever rules, not as a second container rule.\n\n*See also:* G10 (G10's affixes are rolled by G6's loot tables).", "d": "yes", "note": ""}, {"id": "G7", "theme": "G", "title": "Guaranteed placements and reachable keys (ENSURE)", "kind": "generator", "value": "high", "effort": "medium", "body": "**Today.** Templates place keys by chance, as `lair.xml` does with `validate=\"1?10=1 or (1?2=1 and $__storekey<2)\"`. So a lair can have a locked storeroom with no key, or a key behind the door it opens. `postProcess` only re-runs values that could not be resolved earlier. Nothing checks the built area. Two parts exist to build on: the area-wide `__` counters and the rooms held on `LAYOUT_NODES`.\n\n**Add.** An `<ENSURE>` child of `AREA` that runs after layout and fill, for example `<ENSURE var=\"__storekey\" min=\"1\" fallback=\"store_key\" where=\"reachable-without:keyname=$areaname storekey\" in=\"mob|room|container\"/>`. If the counter is short, it builds the fallback tag. It then puts it in a room reachable from the entrance without passing a door locked to that key, found by walking the built rooms. `max=\"n\"` removes extras, and `<ENSURE room=\"boss_room\" count=\"1\"/>` requires a room.\n\n**Example.** The prison theme always has one jail key outside the cell block, on a guard or in the warden's desk, never inside a locked cell.", "d": "yes", "note": ""}, {"id": "G8", "theme": "G", "title": "Hand-drawn MAP layout: drawn shape, generated content", "kind": "generator", "value": "high", "effort": "medium", "body": "**Today.** The layouts are `APARTMENT`, `BOXCITY`, `BOXCITYSQUARE`, `BRANCH`, `CROSS`, `GRIDCITY`, `MAZE`, `MESH`, `SPOTTEDMESH` and `TREE`. All are procedural, and none reads a drawn map. A builder who wants a set shape, such as a keep with a courtyard or a cross-shaped temple, must dig every room by hand or take a random shape. A JavaScript layout class could parse a file, but that is programming, not content.\n\n**Add.** `layout=\"MAP\"` with an inline `<MAP>` child or a `MAPFILE=\"world/maps/keep.txt\"` attribute. The map is a character grid: `.` is street, `o` interior, `L` leaf, `@` the entrance, `-` and `|` links, `+` a door, `^` and `v` stairs. Other glyphs map to room templates with `<GLYPH char=\"B\" room=\"boss_room\"/>`. Nodes get the usual `ROOMTAG_*` tags, so the existing theme templates fill them.\n\n**Example.** The owner draws the 25-room Abbey of St. Corwin in a text file, maps `C` to the chapel template, and lets the forest-ruins theme dress the rest. Re-rolling changes text and mobs but keeps the floor plan.", "d": "yes", "note": ""}, {"id": "G9", "theme": "G", "title": "GENERATE FILL: theme templates on hand-built rooms", "kind": "builder tool", "value": "high", "effort": "medium", "body": "**Today.** `GENERATE ROOM` always makes a new room (`buildRoom`) in an empty direction, and node tags come only from a layout. A builder who digs the map by hand with `DIG`, `LINK` or `CREATE ROOM` cannot have a theme write text, mobs and items into those rooms. The workaround goes room by room: `GENERATE MOB` and `GENERATE ITEM` in each room, and `GENERATE STRING` output pasted in with `MODIFY ROOM`.\n\n**Add.** `GENERATE FILL <roomtemplate_id> [FROM file] [vars] ROOM|AREA [KEEPTEXT] [SEED=n]`. For each target room it works out `ROOMTAG_NODETYPE`, `NODERUN`, `NODEEXITS`, `NODEFLAGS` and the neighbour tags from the room's real exits, and the depth from the area entrance (G3). It then runs the `ROOM` template on the existing room. It sets the title and description, unless `KEEPTEXT` is given or the room is marked `GENLOCK` (G13), and adds mobs, items, affects and behaviours. Exits are left alone.\n\n**Example.** The owner digs a 30-room forest by hand to match their world map and runs `GENERATE FILL forest_rooms FROM randareas/forest.xml AREA level_range=5`. Then they edit the few rooms the story needs.\n\n*See also:* G3, G15, ST20 (G9, G15 and ST20's GENVAR use G3's depth tags (ROOMTAG_DEPTH, AREA_MAXDEPTH)); G13, G14 (G14 needs G13's GENSOURCE, and G9 and G14 keep G13's GENLOCK rooms).", "d": "yes", "note": ""}, {"id": "G10", "theme": "G", "title": "Data-driven affixes for random enchantment", "kind": "data file", "value": "high", "effort": "medium", "body": "**Today.** `TimsLibrary.enchant` is called by `ItemGenerator ENCHANTED=%` and `Thief_Digsite`. It only bumps the plus or minus, adds a curse, or adds `Prop_FightSpellCast` or `Prop_WearSpellCast` with random spells (ammunition gets a `Prop_WearAdjuster` attack and damage bonus instead). A template can build 'of the Bear' by hand, using `AFFECT` children picked by `PICKWEIGHT` and `condition` plus a prefix `STRING` used in the name. But each template has to repeat this, and nothing ties an affix to the item's level or value: `enchant()` raises the level only for added spells and ammunition, and a template can only set the whole item's `LEVEL`, `VALUE` or `ITEM_POWERBONUS`.\n\n**Add.** An affix file, `world/affixes.xml` or `resources/randareas/affixes.xml`. Each entry looks like `<AFFIX id name=\"Flaming\" pos=\"prefix|suffix\" kinds=\"weapon,armor,ammo\" level=\"5-30\" pickweight=\"10\" cursed=\"false\">` and holds `AFFECT` tags in the percolator language. `enchant()` uses the file when it exists. So do `ItemGenerator ENCHANTED=%`, `RandomItems`, `Prop_LootTable` (item G6) and a new `ITEM` template attribute, `AFFIXES=\"0?2\"`. The item's name gets the prefix and suffix, and its level and value rise by the affix's level.\n\n**Example.** Goblin loot can roll 'a Rusty Short Sword of Bleeding', a rare result for levels 4 to 12, from the owner's 30 hand-written affixes.\n\n*Re-checked against the code after writing: corrected.*\n\n*See also:* G6 (G10's affixes are rolled by G6's loot tables).", "d": "yes", "note": ""}, {"id": "G11", "theme": "G", "title": "JavaScript generator helpers", "kind": "JavaScript hook", "value": "medium", "effort": "small", "body": "**Today.** A `<SCRIPT>` block sees `host`, `source`, `target`, `monster`, `item`, `message`, `getVar`, `setVar` and a few helpers. It can reach the percolator through `Packages.com.planet_ink.coffee_mud.core.CMLib`, but must repeat the whole sequence: parse the XML, `buildDefinedIDSet`, `checkRequirements`, `preDefineReward`, `defineReward`, a `find*` call, `postProcess`. `getLayoutManager('TREE').generate(30,dir)` already returns the node list. With `JSCRIPTS=1`, each script needs `MODIFY JSCRIPT` approval unless the owner sets `JSCRIPTS=2`.\n\n**Add.** A `gen` object in `JScriptEvent` and `JavaScriptingEngine` with `gen.item(file,id,vars)`, `gen.mob(file,id,vars)`, `gen.string(file,id,vars)`, `gen.room(file,id,dir)`, `gen.area(file,id,dir,seed)` and `gen.layout(name,size,seed)`. `gen.layout` returns the nodes with x, y, type and exits. `vars` is a JavaScript object. The results are live objects that the script places itself.\n\n**Example.** A cartographer's `JS_PROG` calls `gen.layout('TREE',30,seed)` to sell a treasure map whose drawing matches the dungeon later generated with that seed.\n\n*See also:* G5 (The same fresh-roll generation calls, for MOBPROG (MPGENERATE, GENSTRING) and for JavaScript (gen.item, gen.string and so on)); G17 (Both put generator access in JavaScript: G11 from play-time scripts, G17 inside templates).", "d": "yes", "note": ""}, {"id": "G12", "theme": "G", "title": "Name styles by culture and race", "kind": "data file and script function", "value": "medium", "effort": "small", "body": "**Today.** `CharCreation.generateRandomName` has one hard-coded vowel and consonant table. Everything uses it: `SYSTEM_RANDOM_NAME:min-max` in templates, `NEW *`, the account name, character creation and `Spell_TrueName`. So elves and orcs sound alike. Templates can keep pools per culture in data, with `STRING` banks as in `inc_fantasynames.xml` or with syllable picks joined together. JavaScript can call `CMLib.login().generateRandomName(a,b)`. MOBPROG has no random-name function, and nothing picks a style by race.\n\n**Add.** Name styles as data, one file per style in `world/namegen/` or `resources/namegen/`, in the format `makeRandomNameSets` reads: syllables with start, middle and end flags. A style can also hold prefixes, suffixes, titles, and given and family names by gender. Today's table becomes `default`. Templates write `SYSTEM_RANDOM_NAME:2-4:elvish`. Scripts get `RANDNAME(style min max)` or `RANDNAME(race gender)`. A `NAMESTYLE` on `GenRace`, a theme or a `GenLanguage` picks the style for `NEW *`, for `NAME=RANDOM` templates and for the name offered at character creation.\n\n**Example.** The dwarf hold names its NPCs with `SYSTEM_RANDOM_NAME:2-3:dwarvish` (Thrandin, Borgrum), and `NEW *` for a dwarf offers 'Thrain Ironhand'. Goblin chieftains get harsh 'gr', 'zk' and 'ug' syllables.\n\n*See also:* L5 (Both add syllable banks for made-up words (names vs unknown words), and G12 attaches a name style to a GenLanguage).", "d": "yes", "note": ""}, {"id": "G13", "theme": "G", "title": "Cleaner baking: unlinked areas, apostrophes, GENSOURCE, REGENERATE", "kind": "builder tool", "value": "medium", "effort": "medium", "body": "**Today.** Baking already works: in builder mode, `GENERATE AREA` output goes to `world/areas/<area>.cmare` on `SAVE` or quit. But `getAreaXML` keeps no record of how an area was made, so it cannot be re-rolled without losing hand edits. A detached area needs a scratch room with a free exit, then `UNLINK`, then `LINK` later. Generated apostrophes are stored as backticks. That is the engine-wide convention and players see apostrophes, but it makes the files harder to read.\n\n**Add.** (1) `GENERATE AREA ... UNLINKED`, which builds with no gate, for `LINK` later. (2) A world option `GEN_BACKTICKS=false`, or builder mode itself, keeps real apostrophes in generated text. (3) A `GENSOURCE` stat records the generator file, id, vars and seed, and is written to the `.cmare`. (4) `REGENERATE AREA [SEED=n|SAME]` rebuilds from `GENSOURCE` and keeps rooms marked `GENLOCK` (a room flag or property) with their exits. Parts 3 and 4 carry the value. Parts 1 and 2 are conveniences.\n\n**Example.** The owner bakes 'Old Tunnels' unlinked, writes the story rooms by hand and marks them `GENLOCK`. After improving the template's descriptions, they run `REGENERATE AREA SEED=SAME`, and the hand-written rooms stay.\n\n*See also:* G14, G9 (G14 needs G13's GENSOURCE, and G9 and G14 keep G13's GENLOCK rooms).", "d": "yes", "note": ""}, {"id": "G14", "theme": "G", "title": "Regenerate behaviour and MPREGENERATE: areas that re-roll", "kind": "behaviour and script command", "value": "medium", "effort": "medium", "body": "**Today.** `ResetWhole` and `MPRESET` restore an area's stored state. Only instances and grids re-roll. `StdAutoGenInstance` builds a fresh child per party and drops old ones after `PASSIVEMINS`. `RESET INSTANCE` re-rolls unless `NORESET=true`, and `AutoGrid` rebuilds on expiry. A `<SCRIPT>` block can call `resetInstance(R)` on an instance child. Nothing re-rolls a persistent area on a schedule or on a story event.\n\n**Add.** A `Regenerate` behaviour for areas: `FILE= ID= VARS=\"...\" SEED=random|daily|weekly|<n> WHEN=MUDDAY:<n>|MOON:FULL|ONEMPTY|SCRIPT KEEP=<room ids or GENLOCK>`. It fires only when no party member is inside. It destroys the generated rooms and rebuilds them, keeping gate links, kept rooms and anything a quest is using. `MPREGENERATE <area> [SEED=n]` triggers it from a script, and a trigger such as `GENERATED_PROG` runs afterwards. It needs `GENSOURCE` (G13) and seeds (G1).\n\n**Example.** 'The Shifting Labyrinth' rebuilds itself at every full moon with a new seed. Its entrance hall and the minotaur's throne room, marked `GENLOCK`, stay as they are.\n\n*See also:* ST20 (G14 runs ST20's GENERATED_PROG after re-rolling an area); G1 (G14's SEED=daily|weekly uses G1's seeds); G13, G9 (G14 needs G13's GENSOURCE, and G9 and G14 keep G13's GENLOCK rooms); T2 (Alternatives for a dungeon that is fresh when the party returns: reset it in place, or re-roll it).", "d": "yes", "note": ""}, {"id": "G15", "theme": "G", "title": "New theme packs, set-piece library and theme skeleton", "kind": "data file", "value": "medium", "effort": "medium", "body": "**Today.** Twelve themes ship, plus `planet.xml`. The driver's TODO lists ruins, crypt, castle, volcano and sky as missing. Making a new theme means copying and editing, since each theme lists its theme names in every `requires`. The layout variants are already one line each with `like=\"maze_dungeon\"`. No set-piece rooms ship, though their parts exist: `Prop_OpenPassword`, `RandomTraps`, `Prop_Hidden`, `class=\"catalog\"`. `guides/RandomAreas.html` leaves out `BRANCH`, `MESH` and `SPOTTEDMESH`. It also says `repeat-X` selects every choice, but the code draws X with replacement.\n\n**Add.** Data only. Seven themes built from the existing banks: `crypt.xml`, `ruins.xml`, `castle.xml`, `volcano.xml`, `sky.xml`, `mine.xml` and `sewer.xml`. An `inc_setpieces.xml` with a riddle door (`Prop_OpenPassword` fed by a riddle `STRING` bank), a lever room (a MOBPROG on a `GenItem`), a healing shrine, a trapped corridor (`RandomTraps`) and a collapsed passage. Each set piece is gated by a `__setpiece` counter and the depth tags (G3). A `theme_skeleton.xml` with one `AREA`, the layout from a variable or list, `requires` built from one `THEME_NAMES` string, and a comment on each slot. The guide documents the skeleton, and its errors are fixed.\n\n**Example.** The owner copies the skeleton to `fungal_caverns.xml`, fills in the room text and five mob tags, and adds a riddle door. `random_dungeon` can now roll it.\n\n*See also:* G3, G9, ST20 (G9, G15 and ST20's GENVAR use G3's depth tags (ROOMTAG_DEPTH, AREA_MAXDEPTH)).", "d": "yes", "note": ""}, {"id": "G16", "theme": "G", "title": "Multi-level areas and new layouts (CAVE, CLUMP, LINEAR, RING, ISLANDS)", "kind": "generator", "value": "medium", "effort": "large", "body": "**Today.** Every layout is a flat grid. `AbstractLayout.getDirection` gives only north, south, east and west, and no layout uses `LayoutRuns.ud`. Some of this can be done in data, though it is untested. An `EXIT` with `DIRECTION=\"DOWN\"` builds a nested `ROOM`. A `ROOM` with `layout=` and `size=` becomes a sub-layout, so a `__counter` can give one stair per level. Picking a layout at random already works, with `select=\"any\"` over `like=` variants or with a `$variable`. A JavaScript layout in a `LIBRARY` path's `layouts/` folder may also load.\n\n**Add.** A `levels=\"n\"` attribute on `AREA` and on nested room layouts. It splits the size over n stacked floors joined by `UP` and `DOWN` at non-leaf nodes, and exports `ROOMTAG_LEVEL` and `ROOMTAG_STAIRS`. Five new layouts: `CAVE` (cellular-automata blobs, winding passages), `CLUMP` (a square with random dead ends), `LINEAR` (a road with side spurs), `RING` (a loop with spokes, for wall walks) and `ISLANDS` (clusters joined by single bridges). `layout` also takes a comma list and picks one at random.\n\n**Example.** `<AREA layout=\"TREE\" levels=\"4\" size=\"60\">` makes a goblin mine four floors deep with ladders down. A 'Sky Citadel' uses `RING` with `levels=\"2\"`.\n\n*See also:* G4 (G4's LEVELS option needs G16's multi-level layouts).", "d": "yes", "note": ""}, {"id": "G17", "theme": "G", "title": "JavaScript in random-area templates", "kind": "generator, JavaScript hook", "value": "low", "effort": "medium", "body": "**Today.** Random-area templates (`resources/randareas`, run by `GENERATE` through `MUDPercolator`) compute values with `${...}` variables, math expressions and `STAT:` lookups, and filter with their own `CONDITION`/`VALIDATE` grammar. The `j` variable flag only escapes a value for use inside JavaScript. No JavaScript runs while generating. A `<SCRIPT>` on a generated mob's Scriptable runs at play time, which is too late. So logic like \"a name from my own tables\" or \"skip this room if a flag is set\" has to be written in the template language.\n\n**Add.** `${js:expr}` in template strings, and `CONDITION=\"js:expr\"` and `VALIDATE=\"js:expr\"` on template tags. The expression sees `defined` (the generator's variables) and `obj` (the object being built). It also gets the bindings that the other JavaScript items in this plan give scripts (`cm`, and `require()` from `world/js/lib`). One name or loot library then serves both play and generation.\n\n**Example.** `<STRING ID=\"innkeeper_name\">${js:require('names').dwarven(2)}<\/STRING>` names each innkeeper from the owner's dwarven tables. `<ROOM CONDITION=\"js:!cm.store('world').bridgeBurnt\" ...>` leaves out the bridge room once the story has burnt it.\n\n*See also:* JS3 (G17's template JavaScript loads libraries through JS3's require() from world/js/lib); G11 (Both put generator access in JavaScript: G11 from play-time scripts, G17 inside templates).", "d": "yes", "note": ""}, {"id": "CR1", "theme": "CR", "title": "Homes owned by the profile, and pre-owned homes", "kind": "world option", "value": "high", "effort": "small", "body": "**Today.** Land belongs to a character's name, a spouse, a clan or the follow chain. A party member who does not follow the owner owns nothing (after PARTY REMOVE, after SWITCH, or while the owner rests), and the theft check refuses them, since PLAN 5a set PLAYERKILL to NEVER. A world file cannot ship a home that is already the player's. `isProperlyOwned` and `updateLotWithThisData` wipe any owner who is not an existing player or clan, and clans are not world content.\n\n**Add.** In single-player, every character of the profile (its one PlayerAccount) counts as owner in `doesOwnThisLand`, `doesOwnThisProperty`, `doesHaveWeakPrivilegesWith` and `robberyCheck`. A reserved owner token, `@PROFILE`, in `Prop_*ForSale` and `Prop_PrivateProperty`, which `isProperlyOwned` and `updateLot` treat as always existing. As an option, land the player buys is recorded as `@PROFILE`.\n\n**Example.** \"Your cottage\" in the tutorial village carries `Prop_RoomForSale('@PROFILE/0')`. Any character the player makes later can enter, build there and use the chest, and nothing counts as theft between them.
